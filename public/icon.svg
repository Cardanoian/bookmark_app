<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">책갈피 앱 아이콘</title>
  <desc id="desc">노란 배경 위에 코랄색 책갈피가 꽂힌 친근한 표정의 열린 책</desc>

  <!-- 바탕색은 마스커블 PWA 아이콘이 원형·스쿼클로 잘려도 빈 모서리가 생기지 않게 끝까지 채운다. -->
  <rect width="512" height="512" fill="#FFD02F"/>

  <!-- 책의 뒤쪽 표지: 작은 화면에서도 책 실루엣이 또렷하게 보이도록 단순화했다. -->
  <path d="M94 181h324a28 28 0 0 1 28 28v166a28 28 0 0 1-28 28H94a28 28 0 0 1-28-28V209a28 28 0 0 1 28-28Z"
        fill="#FFFFFF" stroke="#1C1C1E" stroke-width="26" stroke-linejoin="round"/>

  <!-- 가운데 책갈피 리본. -->
  <path d="M222 322h68v112l-34-24-34 24Z"
        fill="#FF9999" stroke="#1C1C1E" stroke-width="24" stroke-linejoin="round"/>

  <!-- 펼친 책장. 좌우 페이지가 가운데 골에서 자연스럽게 만난다. -->
  <path d="M108 126c60-8 111 2 148 39v184c-37-37-88-47-148-39Z"
        fill="#FFFFFF" stroke="#1C1C1E" stroke-width="26" stroke-linejoin="round"/>
  <path d="M404 126c-60-8-111 2-148 39v184c37-37 88-47 148-39Z"
        fill="#FFFFFF" stroke="#1C1C1E" stroke-width="26" stroke-linejoin="round"/>

  <!-- 반려 몬스터 테마를 암시하는 최소한의 따뜻한 표정. -->
  <circle cx="190" cy="246" r="12" fill="#1C1C1E"/>
  <circle cx="322" cy="246" r="12" fill="#1C1C1E"/>
</svg>
