# API 키나 시크릿은 이 파일에 넣지 않습니다. credentials 또는 환경 변수만 사용합니다.
app_settings:
  - key: feature_flags
    # on_demand_games: false는 전면 중단, true는 전체 활성화입니다.
    # 학급/학교별 오버라이드는 관리 화면에서 추가하며 이 기본 문서는 기존 설정을 덮어쓰지 않습니다.
    value:
      seasonal_banner_enabled: false
      on_demand_games: true
      # 독서 토론(reading_discussion). 안전 스택(신고·교사 모더레이션·금칙어)을 함께 출하하므로
      # 기본 확대(on). false=전역 하드 kill, "reading_discussion:classroom:<id>"=false 로 학급 격리.
      reading_discussion: true
      # 계정 연동(MERGE, account_linking_seasons_plan §Phase 3). 아동 자격증명 인증 표면이라 파일럿
      # 기본 off. false=전역 하드 kill. 파일럿은 이 전역을 지우고 "account_linking:classroom:<id>"=true
      # 스코프 오버라이드로, 확대는 전역 true 로 전환한다(app_setting.rb feature_enabled? 규약).
      account_linking: false
    description: 전역 기능 플래그(JSON 객체)
