# API 키나 시크릿은 이 파일에 넣지 않습니다. credentials 또는 환경 변수만 사용합니다.
app_settings:
  - key: feature_flags
    # on_demand_games: false는 전면 중단, true는 전체 활성화입니다.
    # 학급/학교별 오버라이드는 관리 화면에서 추가하며 이 기본 문서는 기존 설정을 덮어쓰지 않습니다.
    value:
      seasonal_banner_enabled: false
      on_demand_games: true
      # 독서 토론(reading_discussion). 안전 스택(신고·교사 모더레이션·금칙어)을 함께 출하하므로
      # 기본 확대(on). false=전역 하드 kill, "reading_discussion:classroom:<id>"=false 로 학급 격리.
      reading_discussion: true
      # 계정 연동(MERGE, account_linking_seasons_plan §Phase 3). 구현 완료 기능이라 기본 on.
      # 문제가 생기면 false를 전역 하드 kill로 사용하고, 학급별 격리가 필요하면
      # "account_linking:classroom:<id>"=false 오버라이드를 사용한다(app_setting.rb 규약).
      account_linking: true
      # 랭킹 시즌제 읽기 플래그(account_linking_seasons_plan §Phase 1/5). RankingBoard·랭킹 뷰의 읽기
      # 경로만 게이트해 정렬 기준을 평생 experience ↔ 현재 학년도 season_scores.experience_earned 사이에서
      # 전환한다(시즌 데이터 축적은 플래그와 무관하게 항상 동작 — 켜면 즉시 활성). **2027-03 학년도
      # 경계에 전역 on 예정**이라 기본 off(전환 스위치, 2026 시즌은 부분·비권위).
      ranking_seasons: false
    description: 전역 기능 플래그(JSON 객체)
