    짧은 글이 함께 있어서 쉽고 재미있게 읽을 수 있어요.
'9791160575309':
  title: 엽기 과학자 프래니
  summary: 괴짜 과학자를 꿈꾸는 소녀 프래니가 학교에서 벌어지는 사건들을 과학 실험으로 해결하는 이야기예요. 프래니는 남들과 다르게 기발하고
    엽기적인 발명품을 만드는 것을 좋아해요. 친구들과 잘 어울리고 싶어 하면서도 자신만의 개성을 포기하지 않으려 애써요. 상상력 넘치는 과학 실험과
    유쾌한 사건들이 가득한 이야기예요.
'9791130627519':
  title: 개를 훔치는 완벽한 방법
  summary: 아빠가 집을 나가고 형편이 어려워져 차에서 지내게 된 조지나네 가족 이야기예요. 조지나는 돈을 벌기 위해 부잣집 개를 몰래 데려갔다가
    사례금을 받아 돌려주는 계획을 세워요. 계획을 실행하는 과정에서 예상치 못한 일들이 벌어지고 조지나는 진짜 소중한 것이 무엇인지 깨닫게 돼요.
    가족에 대한 사랑과 정직함을 배울 수 있는 따뜻한 이야기예요.
'9788963723037':
  title: 나의 라임 오렌지나무
  summary: 브라질의 가난한 동네에 사는 다섯 살 소년 제제의 이야기예요. 장난꾸러기라고 늘 혼나던 제제는 마당의 작은 라임 오렌지나무에게
    밍기뉴라는 이름을 붙여 주고 마음을 나눠요. 이웃 아저씨 뽀르뚜가와도 부자지간 같은 따뜻한 우정을 쌓지만 슬픈 이별을 겪게 돼요. 어린아이의
    눈으로 본 가난과 사랑, 성장을 감동적으로 그린 이야기예요.
'9791169634182':
  title: 전지적 독자 시점
  summary: 평범한 회사원 김독자가 자신만 끝까지 읽었던 소설 속 세상이 현실이 되면서 벌어지는 이야기예요. 소설의 미래 내용을 알고 있는
    독자는 이 지식을 이용해 무너져 가는 세상에서 살아남으려 해요. 소설 속 주인공이었던 유중혁과 함께 예측할 수 없는 재난과 사건들을 헤쳐 나가요.
    이야기와 현실이 뒤섞이는 독특한 설정으로 큰 인기를 얻은 작품이에요.
'9788934967323':
  title: 전지적 독자 시점 =part 1 /Omniscient reader's viewpoint
  summary: 평범한 회사원 김독자가 자신만 끝까지 읽었던 소설 속 세상이 현실이 되면서 벌어지는 이야기예요. 소설의 미래 내용을 알고 있는
