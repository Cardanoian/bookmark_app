  summary: 돈이 아니라 시간을 사고파는 인터넷 상점을 운영하는 소년 백온조의 이야기예요. 사람들은 자신이 못하는 일을 대신해 달라며 시간을
    사가고, 백온조는 의뢰를 하나씩 해결해줘요. 여러 의뢰를 겪으며 백온조는 낯선 사람들과 마음을 나누고 진짜 소중한 것이 무엇인지 깨달아요.
    시간이라는 특별한 소재로 사람 사이의 신뢰를 그린 이야기예요.
'9780545646239':
