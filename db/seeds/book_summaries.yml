'9788936456955':
  title: 알로하, 나의 엄마들 :이금이 장편소설
  summary: 20세기 초, 사진 한 장만 보고 하와이로 시집간 조선 소녀들의 이야기예요. 버들, 홍주, 송화 세 친구는 낯선 땅에서 사진 속
    모습과 다른 남편을 만나 당황하지만 서로 의지하며 살아가요. 힘든 이민 생활 속에서도 우정과 희망을 잃지 않고 새로운 삶을 개척해 나가요.
    사진신부라는 잘 알려지지 않은 역사를 따뜻하게 그린 이야기예요.
'9791165180102':
  title: 암호클럽
  summary: 네 명의 친구들이 모여 암호클럽을 만들고 마을에서 벌어지는 수수께끼 같은 사건을 해결해 나가는 이야기예요. 아이들은 다양한 암호와
    비밀 기호를 직접 풀어내며 사건의 실마리를 찾아가요. 추리와 암호 풀이가 함께 어우러져 읽는 재미와 두뇌 게임을 동시에 즐길 수 있어요. 우정과
    협동으로 사건을 해결하는 어린이 탐정단 이야기예요.
