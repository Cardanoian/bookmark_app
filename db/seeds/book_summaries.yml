'9788960869240':
  title: 무빙 :강풀액션만화
  summary: 초능력을 가진 것을 숨기고 평범하게 살아가는 고등학생들이 주인공으로, 하늘을 나는 능력이나 몸이 다쳐도 금세 낫는 능력처럼 저마다
    특별한 힘을 갖고 있어요. 알고 보니 이 아이들의 부모님들은 과거에 비밀 요원으로 활동했던 초능력자들이었고, 아이들에게 절대 능력을 드러내지
    말라고 당부해 왔어요. 하지만 위험한 사건이 벌어지면서 아이들은 자신의 힘을 사용할 수밖에 없는 상황에 놓이게 돼요. 가족을 지키기 위한 부모
    세대의 숨겨진 사연과 아이들이 진실을 알아가는 과정이 함께 펼쳐져요. 액션과 감동이 어우러져 많은 사랑을 받은 작품이에요.
