'9791173571442':
  title: 무적 이순신
  summary: 임진왜란 때 나라를 지킨 이순신 장군의 이야기예요. 이순신 장군은 거북선을 만들고 뛰어난 전략을 세워 훨씬 많은 수의 일본 배들과
    싸워 이겼어요. 명량대첩처럼 불리한 상황에서도 포기하지 않고 지혜와 용기로 승리를 이끌어낸 이야기를 만날 수 있어요. 나라를 위해 몸과 마음을
    다한 이순신 장군의 멋진 모습을 배울 수 있는 책이랍니다.
