'9791190305938':
  title: 유미의 세포들 =Yumi's cells
  summary: 평범한 직장인 유미의 마음속에는 감정과 생각을 담당하는 작은 세포들이 살고 있어요. 사랑 세포, 이성 세포, 감성 세포 같은 세포들이
    회의를 하며 유미의 하루하루를 이끌어가요. 연애와 일상 속에서 유미가 겪는 고민과 감정을 세포들의 시선으로 재미있게 보여줘요. 마음속 감정을
    캐릭터로 표현한 독특한 이야기예요.
'9788937834790':
  title: 정의란 무엇인가
  summary: 트롤리 문제처럼 어려운 상황 속에서 무엇이 옳은 선택인지 함께 고민해보게 하는 철학책이에요. 여러 가지 예시와 질문을 통해 정의와
    도덕에 대한 다양한 생각을 소개해줘요. 정답을 알려주기보다 스스로 생각해보도록 이끄는 것이 특징이에요. 쉽지 않은 주제를 실제 사례로 풀어내
    생각하는 힘을 키워주는 책이에요.
'9788949144085':
  title: 배드 가이즈
  summary: 늑대, 뱀, 상어, 피라냐처럼 사람들에게 무섭게만 보이던 동물 친구들이 나오는 이야기예요. 이들은 나쁜 녀석이라는 이미지를 벗고
    착한 일을 해서 이미지를 바꾸기로 결심해요. 좌충우돌 끝에 이들은 서투르지만 진심으로 좋은 일을 하려고 애써요. 겉모습만 보고 판단하면 안
    된다는 메시지를 유쾌하게 전하는 이야기예요.
'9791195747696':
  title: 기억의 풍선
  summary: 할아버지의 머릿속에는 소중한 기억들이 풍선처럼 매달려 있어요. 그런데 할아버지가 나이가 들면서 풍선들이 하나둘 사라져 가요. 손자는
    할아버지가 자신을 잊어갈까 봐 걱정하지만, 자신의 풍선 하나를 할아버지에게 나누어 줘요. 기억을 잃어가는 가족을 사랑으로 보듬는 마음을 그린
    그림책이에요.
'9791191583496':
  title: 유미의 세포들 =Yumi's cells
  summary: 평범한 직장인 유미의 마음속에는 감정과 생각을 담당하는 작은 세포들이 살고 있어요. 사랑 세포, 이성 세포, 감성 세포 같은 세포들이
    회의를 하며 유미의 하루하루를 이끌어가요. 연애와 일상 속에서 유미가 겪는 고민과 감정을 세포들의 시선으로 재미있게 보여줘요. 마음속 감정을
    캐릭터로 표현한 독특한 이야기예요.
'9788952782380':
  title: 65층 나무 집
  summary: 앤디와 테리는 세상에서 가장 높이 솟아나는 나무 집에 살고 있어요. 나무 집에는 층마다 볼링장, 상어 탱크 같은 기상천외한 공간들이
    가득해요. 두 사람은 출판사에 새 책을 넘겨야 하는 마감을 자꾸 미루면서 온갖 소동을 벌여요. 기발한 상상과 웃음이 가득한 나무 집 모험 이야기예요.
'9791190147798':
  title: "(주석으로 쉽게 읽는) 고정욱 삼국지"
  summary: 중국 후한 말, 어지러운 세상을 바로잡으려는 영웅들의 이야기예요. 유비, 관우, 장비는 의형제를 맺고 함께 큰 뜻을 이루기로 다짐해요.
    조조, 손권 등 여러 영웅들과 힘을 겨루며 위, 촉, 오 세 나라가 세워지는 과정이 펼쳐져요. 지혜와 의리, 우정을 배울 수 있는 중국 고전을
    쉽게 풀어낸 이야기예요.
'9791192738482':
  title: 이상한 집 :11개의 평면도
  summary: 어느 이상한 집의 평면도를 우연히 보게 된 사람이 그 안에 숨겨진 수상한 점들을 발견하면서 이야기가 시작돼요. 쓸모없어 보이는
    방이나 이상하게 배치된 통로에는 놀라운 비밀이 숨어 있어요. 평면도 하나하나를 파헤칠 때마다 집에 얽힌 무서운 사연이 드러나요. 건축 도면이라는
    독특한 소재로 미스터리를 풀어가는 이야기예요.
'9788949186214':
  title: 마법의 시간여행
  summary: 남매 잭과 애니는 숲속에서 신비한 마법의 나무 집을 발견해요. 나무 집 안에는 책이 가득한데, 책 속 그림을 가리키며 소원을 빌면
    그 시대와 장소로 순간 이동할 수 있어요. 공룡 시대, 고대 이집트처럼 다양한 시간과 장소를 모험하며 지식을 쌓아가요. 책과 모험을 함께 즐길
    수 있는 시리즈예요.
'9788949197814':
  title: 건방이의 건방진 수련기
  summary: 사람이 되고 싶은 건방진 구미호 건방이가 인간 세상에서 좌충우돌 수련을 하는 이야기예요. 건방이는 온갖 말썽을 부리면서도 사람들과
    부대끼며 조금씩 마음을 배워가요. 유쾌하고 엉뚱한 사건들을 겪으며 건방이는 진짜 소중한 것이 무엇인지 깨달아가요. 재치 있는 입담과 웃음이
    가득한 판타지 동화예요.
'9791187777472':
  title: 전사들 :새로운 예언
  summary: 숲에서 무리를 이루어 사는 야생 고양이들의 이야기예요. 고양이들은 각자의 부족(클랜)에 속해 전사로서 규율을 지키며 살아가요.
    힘든 시련과 위험한 모험을 겪으면서 고양이들은 우정과 용기를 배워가요. 동물이지만 사람처럼 생각하고 말하는 모습이 흥미진진하게 그려져요.
'9788934967477':
  title: 전지적 독자 시점 Part 4 03
  summary: 주인공 김독자는 오랫동안 봐온 인터넷 소설 속 세상이 현실이 되어버린 것을 알게 돼요. 소설의 결말까지 미리 알고 있는 사람은
    김독자뿐이라 그는 이 지식을 이용해 위기를 헤쳐나가야 해요. 소설 속 등장인물들과 함께 갑작스레 닥친 재난 같은 사건들을 헤쳐나가요. 오직
    한 사람만 아는 미래라는 독특한 설정이 흥미진진한 이야기예요.
'9791173470950':
  title: "(소통이 어려운 나를 위한) 데일 카네기 인간관계론"
  summary: 사람들과 더 잘 지내는 방법을 알려주는 책이에요. 남을 비난하기보다 진심으로 칭찬하고, 상대방의 이야기를 잘 들어주라고 말해요.
    이름을 기억해 주고 먼저 웃으며 다가가면 친구를 사귀기 쉬워진다고 알려줘요. 어린이 눈높이에 맞게 데일 카네기의 인간관계 지혜를 쉽게 풀어낸
    책이에요.
'9791187777762':
  title: 전사들 :예언의 시작
  summary: 숲에서 무리를 이루어 사는 야생 고양이들의 이야기예요. 고양이들은 각자의 부족(클랜)에 속해 전사로서 규율을 지키며 살아가요.
    힘든 시련과 위험한 모험을 겪으면서 고양이들은 우정과 용기를 배워가요. 동물이지만 사람처럼 생각하고 말하는 모습이 흥미진진하게 그려져요.
'9791175482852':
  title: "(추리 천재) 엉덩이 탐정"
  summary: 얼굴이 엉덩이처럼 생긴 탐정이 세상에서 일어나는 이상한 사건들을 해결하는 이야기예요. 엉덩이 탐정은 냄새를 맡아 단서를 찾고,
    결정적인 순간에는 필살기인 방귀 공격까지 사용해요. 우아한 말투와 엉뚱한 외모가 만들어내는 반전 매력이 웃음을 줘요. 유쾌하고 기발한 탐정
    이야기로 아이들에게 인기가 많아요.
'9788950995317':
  title: 이사도라 문
  summary: 이사도라 문은 요정 엄마와 뱀파이어 아빠 사이에서 태어난 특별한 소녀예요. 요정 학교에도 뱀파이어 학교에도 완전히 어울리지 못해
    고민이 많아요. 결국 인간 학교에 다니게 되면서 새로운 친구들을 만나고 좌충우돌 학교생활을 시작해요. 반은 요정, 반은 뱀파이어인 자신만의
    매력을 찾아가는 이야기예요.
'9788955827712':
  title: 똑똑한 쿠키
  summary: 자신이 다른 쿠키들만큼 똑똑하지 않다고 생각하는 쿠키의 이야기예요. 이 쿠키는 계산이나 어려운 문제는 잘 못하지만 친구를 배려하고
    다정하게 대하는 데는 뛰어나요. 처음엔 속상해하던 쿠키는 자신만의 다른 똑똑함을 깨달아가요. 똑똑함에도 여러 가지 모습이 있다는 걸 알려주는
    그림책이에요.
'9791187777694':
  title: 전사들 :예언의 시작
  summary: 숲에서 무리를 이루어 사는 야생 고양이들의 이야기예요. 고양이들은 각자의 부족(클랜)에 속해 전사로서 규율을 지키며 살아가요.
    힘든 시련과 위험한 모험을 겪으면서 고양이들은 우정과 용기를 배워가요. 동물이지만 사람처럼 생각하고 말하는 모습이 흥미진진하게 그려져요.
'9788990982704':
  title: 용의자 X의 헌신
  summary: 이웃에 사는 수학 천재 이시가미는 자신이 좋아하는 여인 야스코를 돕기 위해 완벽한 알리바이를 만들어줘요. 형사 쿠사나기와 천재
    물리학자 유가와는 사건 속 석연치 않은 점을 파헤치기 시작해요. 두 천재의 치밀한 두뇌 싸움이 팽팽하게 이어져요. 사랑을 위한 희생과 진실을
    파헤치는 추리가 돋보이는 이야기예요.
'9788949144108':
  title: 배드 가이즈
  summary: 늑대, 뱀, 상어, 피라냐처럼 사람들에게 무섭게만 보이던 동물 친구들이 나오는 이야기예요. 이들은 나쁜 녀석이라는 이미지를 벗고
    착한 일을 해서 이미지를 바꾸기로 결심해요. 좌충우돌 끝에 이들은 서투르지만 진심으로 좋은 일을 하려고 애써요. 겉모습만 보고 판단하면 안
    된다는 메시지를 유쾌하게 전하는 이야기예요.
'9788993242706':
  title: 장수탕 선녀님
  summary: 낡은 목욕탕 장수탕에 놀러 간 아이가 신기한 할머니를 만나면서 이야기가 시작돼요. 그 할머니는 사실 아주 오래전부터 살아온 선녀였어요.
    아이는 선녀 할머니와 함께 냉탕에서 신나게 놀고 아이스크림을 나눠 먹어요. 평범한 목욕탕에서 벌어지는 특별한 만남을 그린 그림책이에요.
'9791167790859':
  title: 중증외상센터 :골든아워
  summary: 실력은 뛰어나지만 병원에서 인정받지 못하던 외과 의사 백강혁이 낙후된 중증외상센터에 오면서 이야기가 시작돼요. 골든아워, 즉 생사를
    가르는 짧은 시간 안에 백강혁은 뛰어난 실력으로 위급한 환자들을 살려내요. 처음엔 무시당하지만 그의 실력이 알려지면서 주변 사람들의 시선이
    달라져요. 생명을 구하는 의료진의 치열한 하루를 그린 이야기예요.
'9788952783486':
  title: 아낌없이 주는 나무 (어린이용)
  summary: 한 그루의 나무가 어린 소년을 아주 많이 사랑해서, 소년이 자랄 때마다 필요한 것을 다 내어줘요. 처음엔 그늘에서 놀아 주고,
    나중엔 열매를 따 가게 하고, 그다음엔 가지를 베어 집을 짓게 해 주고, 결국엔 몸통까지 베어 배를 만들게 해 줘요. 소년은 어른이 되고 할아버지가
    될 때까지 필요할 때마다 나무를 찾아오지만 정작 고맙다는 말은 잘 하지 않아요. 그루터기만 남은 나무에게 늙은 소년이 돌아와 걸터앉아 쉬자,
    나무는 그것만으로도 행복해해요. 아무것도 바라지 않고 다 주는 나무의 사랑을 통해 진짜 사랑이 무엇인지 생각하게 해 주는 그림책이에요.
'9791160946635':
  title: 마당을 나온 암탉 :출간 20주년 기념판
  summary: 양계장에서 알만 낳던 암탉 잎싹이는 마당에 나가 자기 알을 직접 품어 보는 게 소원이에요. 우여곡절 끝에 양계장을 탈출한 잎싹이는
    들판에서 버려진 알 하나를 발견해 정성껏 품어 새끼를 부화시켜요. 알고 보니 그 새끼는 청둥오리였고, 잎싹이는 초록머리라는 이름을 지어 주며
    온갖 위험 속에서도 헌신적으로 키워요. 초록머리는 자라서 자신이 오리라는 걸 깨닫고 다른 오리들과 함께 하늘을 날아 떠나게 돼요. 잎싹이는
    초록머리를 떠나보내며 진짜 사랑과 자유가 무엇인지 보여 주는 감동적인 이야기예요.
'9788937460449':
  title: 데미안
  summary: 소년 싱클레어는 우연히 거짓말을 하다가 동네 불량한 아이에게 약점을 잡혀 시달리게 돼요. 그때 전학 온 신비로운 소년 데미안이
    나타나 싱클레어를 그 곤경에서 구해 주고, 이후 선과 악, 세상의 진실에 대해 남다른 생각을 알려 줘요. 싱클레어는 데미안과의 만남을 통해
    착하기만 한 세상이 아니라 자기 안의 어두운 부분도 인정하며 진짜 자기 자신을 찾아가는 법을 배워요. 알을 깨고 나와야 새로운 세상으로 갈
    수 있다는 유명한 구절처럼, 한 소년이 자라면서 스스로를 발견해 가는 성장 이야기예요. 나 자신을 아는 것이 왜 중요한지 깊이 생각하게 해
    주는 고전이에요.
'9788965462385':
  title: 엘 데포 :특별한 아이와 진실한 친구 이야기
  summary: 씨씨는 어릴 때 심한 병을 앓고 난 후 청력을 잃어서 보청기를 끼고 소리를 들어야 해요. 새 학교에 전학 간 씨씨는 친구들과 다르다는
    것 때문에 속상해하면서도, 보청기 덕분에 멀리서도 선생님 목소리를 들을 수 있다며 스스로를 슈퍼히어로 '엘 데포'라고 상상해요. 진짜 친구를
    사귀는 게 쉽지 않았지만 씨씨는 점점 자신감을 갖고 자기 모습 그대로를 좋아해 주는 친구를 만나게 돼요. 작가 자신의 어린 시절을 그린 만화로,
    다름을 부끄러워하지 않는 용기를 보여 줘요. 귀가 잘 안 들리는 친구를 이해하는 데도 큰 도움이 되는 책이에요.
'9788960869233':
  title: 무빙 :강풀액션만화
  summary: 초능력을 가진 것을 숨기고 평범하게 살아가는 고등학생들이 주인공으로, 하늘을 나는 능력이나 몸이 다쳐도 금세 낫는 능력처럼 저마다
    특별한 힘을 갖고 있어요. 알고 보니 이 아이들의 부모님들은 과거에 비밀 요원으로 활동했던 초능력자들이었고, 아이들에게 절대 능력을 드러내지
    말라고 당부해 왔어요. 하지만 위험한 사건이 벌어지면서 아이들은 자신의 힘을 사용할 수밖에 없는 상황에 놓이게 돼요. 가족을 지키기 위한 부모
    세대의 숨겨진 사연과 아이들이 진실을 알아가는 과정이 함께 펼쳐져요. 액션과 감동이 어우러져 많은 사랑을 받은 작품이에요.
'9788925588735':
  title: 프로젝트 헤일메리
  summary: 주인공 라일랜드 그레이스는 우주선 안에서 기억을 잃은 채 깨어나고, 자신이 왜 우주에 혼자 있는지조차 기억하지 못해요. 점점 기억을
    되찾으며 태양 에너지를 갉아먹는 정체불명의 생명체 때문에 지구가 큰 위기에 처했고, 자신이 이를 해결하러 떠난 마지막 희망의 우주비행사라는
    사실을 깨달아요. 홀로 임무를 수행하던 중 다른 별에서 온 외계 생명체 로키를 만나 서로 다른 언어와 문화를 넘어 우정을 쌓아 가요. 둘은
    힘을 합쳐 지구와 로키의 별을 모두 구할 방법을 찾아 나서요. 과학적 상상력과 우정, 희생정신이 돋보이는 신나는 우주 모험 이야기예요.
'9791187777793':
  title: 전사들 :예언의 시작
  summary: 평범한 집고양이 러스티는 우연히 숲속 야생 고양이 무리인 천둥부족을 만나면서 새로운 삶을 시작하게 돼요. 러스티는 파이어포라는
    이름을 받고 정식 전사가 되기 위한 혹독한 훈련을 받으며 사냥법과 부족의 규칙을 배워 나가요. 그러던 중 부족 안에 숨어 있는 배신자와 이웃
    부족과의 갈등 등 여러 위기를 마주하게 돼요. 용기와 지혜로 어려움을 헤쳐 나가며 러스티는 진정한 전사로 성장해 가요. 고양이들의 시선으로
    그려지는 야생의 모험과 우정이 흥미진진한 판타지 시리즈의 첫 이야기예요.
'9791187777861':
  title: 전사들 :예언의 시작
  summary: 평범한 집고양이 러스티는 우연히 숲속 야생 고양이 무리인 천둥부족을 만나면서 새로운 삶을 시작하게 돼요. 러스티는 파이어포라는
