'9788954615044':
  title: 해리엇 =175년 동안 바다를 품고 살았던 갈라파고스 거북 이야기 /Harriet
  summary: 찰스 다윈이 갈라파고스 제도에서 데려왔다고 알려진 아기 거북 해리엇의 이야기예요. 해리엇은 무려 175년이라는 긴 세월을 살면서
    세상이 변해가는 모습을 지켜봐요. 여러 사람의 손을 거치며 낯선 땅에서 살아가지만 묵묵히 오랜 시간을 견뎌내요. 한 생명이 살아온 길고 긴
    시간을 통해 삶을 되돌아보게 하는 이야기예요.
'9788990369307':
  title: 아버지의 편지:다산 정약용, 편지로 가르친 아버지의 사랑
