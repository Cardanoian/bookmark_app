'9788936446819':
  title: 수박 수영장 :안녕달 그림책
  summary: 무더운 여름날, 커다란 수박이 통째로 시원한 수영장으로 변신해요. 마을 사람들은 수박 속으로 풍덩 뛰어들어 시원하게 물놀이를 즐기지요.
    수박씨를 타고 미끄럼을 타거나 둥둥 떠다니며 즐거운 시간을 보내요. 더위를 잊게 해 주는 상상만으로도 시원해지는 여름 그림책이에요.
'9791130696836':
  title: 드래곤 마스터
  summary: 평범한 농부 소년이 어느 날 갑자기 왕의 성으로 불려가면서 이야기가 시작돼요. 소년은 자신에게 용의 마음을 이해하는 특별한 힘이
    있다는 것을 알게 되고 드래곤 마스터가 되지요. 자신과 짝이 된 용과 마음을 나누고 함께 훈련하며 진짜 우정을 쌓아가요. 다른 드래곤 마스터
    친구들과 힘을 합쳐 왕국을 위협하는 위험에 맞서요.
'9788937847721':
  title: 내일은 실험왕 :본격 대결 과학실험 만화
  summary: 과학을 좋아하는 두 친구가 실험 대결을 벌이며 서로 실력을 겨루는 학습 만화예요. 지는 걸 싫어하는 라이벌 사이지만, 위기의 순간마다
    힘을 합쳐 문제를 해결하기도 해요. 다양한 과학 실험과 원리가 만화 속에 재미있게 녹아 있어요. 티격태격하는 두 친구를 따라가다 보면 과학이
    한층 더 재미있게 느껴져요.
'9788983927651':
  title: 해리포터 :비밀의 방
  summary: 호그와트 마법학교 2학년이 된 해리는 학교에 이상한 소문이 돌면서 불안에 휩싸여요. 학생들이 하나둘 몸이 굳어버리는 사건이 벌어지고,
    오래전 봉인되었던 '비밀의 방'이 다시 열렸다는 소문이 퍼지지요. 해리와 론, 헤르미온느는 사건의 진실을 파헤치기 위해 위험한 모험을 시작해요.
    거대한 뱀 괴물의 정체와 자신을 둘러싼 수상한 소문의 비밀을 밝혀내는 이야기예요.
