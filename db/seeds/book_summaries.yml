'9788971968345':
  title: 프린들 주세요
  summary: 닉 앨런은 짓궂은 장난을 잘 치는 아이인데, 국어 시간에 사전과 단어의 뜻에 대해 배우다가 재미있는 생각을 떠올려요. 닉은 친구들과
    함께 '펜' 대신 '프린들'이라는 새로운 단어를 만들어 쓰기로 하고, 이 장난은 학교 전체로 퍼져 나가요. 깐깐한 그레인저 선생님은 이 장난을
    못마땅해하며 못 쓰게 막으려 하지만, 오히려 소문이 나면서 프린들이라는 단어는 마을을 넘어 전국으로 퍼지게 돼요. 시간이 흐른 뒤 닉은 사실
    그레인저 선생님이 자신을 응원하고 있었다는 것을 알게 되고, 두 사람 사이의 특별한 우정도 드러나요. 말과 언어가 어떻게 만들어지고 퍼지는지
    재미있게 생각해 보게 하는 이야기예요.
'9791171176243':
  title: 이사도라 문
  summary: 이사도라 문은 엄마는 요정이고 아빠는 뱀파이어인 특별한 소녀예요. 낮에는 인간 학교에 다니고 밤에는 요정과 뱀파이어의 마법 세계를
    오가며 두 세계를 모두 경험해요. 요정의 마법 지팡이와 뱀파이어의 망토를 이용해 크고 작은 사건들을 겪으며 학교생활에 적응해 나가요. 서로
    다른 두 세계의 규칙 때문에 헷갈리고 실수도 하지만 특유의 씩씩함으로 문제를 해결해요. 평범함과는 다른 자신만의 개성을 사랑스럽게 보여 주는
    그림 동화 시리즈예요.
'9788934967484':
  title: 전지적 독자 시점 Part 4 04
  summary: 평범한 회사원 김독자는 아무도 끝까지 읽지 않은 웹소설 '멸망 후 살아남는 세 가지 방법'의 유일한 독자예요. 그런데 어느 날
    소설 속 내용 그대로 세상이 멸망하며 현실이 소설과 똑같이 변해 버려요. 김독자는 자신이 알고 있는 소설의 뒷이야기를 무기로 삼아, 소설 속
    주인공 유중혁과 함께 각종 시나리오와 괴물들을 헤쳐 나가요. 아무도 몰랐던 결말을 알고 있는 유일한 사람으로서 세상을 구하기 위해 고군분투하는
    이야기예요. 방대한 세계관과 반전이 매력적인 인기 웹소설 기반 작품이에요.
'9788950957827':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 손오공은 스승 삼장법사와 함께 세상을 구하기 위해 신비한 한자의 힘을 모으는 모험을 떠나요. 곳곳에 숨겨진 한자들을 찾아내 익히면
    그 한자가 가진 힘을 마법처럼 사용할 수 있어요. 여행 중에 다양한 요괴와 악당들을 만나 한자의 힘으로 맞서 싸우며 위기를 헤쳐 나가요. 재미있는
    모험 이야기를 따라가다 보면 자연스럽게 여러 한자와 뜻을 배울 수 있어요. 이야기와 학습을 함께 즐길 수 있는 어린이 인기 학습만화예요.
'9788983925329':
  title: 해리포터 :마법사의 돌
  summary: 이모네 집 계단 밑 벽장에서 구박받으며 살던 해리 포터는 열한 살 생일에 자신이 사실 마법사이며, 유명한 마법학교 호그와트에 입학하게
    됐다는 놀라운 사실을 알게 돼요. 호그와트에서 론과 헤르미온느라는 친한 친구를 사귀고, 마법과 빗자루 하늘 날기 등을 배우며 새로운 삶을 시작해요.
    그러던 중 학교 어딘가에 숨겨진 '마법사의 돌'을 노리는 위험한 존재가 있다는 것을 알게 되고, 그 정체가 해리의 부모님을 죽인 어둠의 마법사
    볼드모트와 관련이 있다는 것도 밝혀져요. 해리와 친구들은 힘을 합쳐 마법사의 돌을 지키기 위해 위험한 모험에 나서요. 마법 세계의 시작을 알리는
    전 세계적으로 사랑받는 판타지 소설이에요.
'9788961550536':
  title: 파브르 곤충기
  summary: 프랑스의 과학자 파브르가 평생에 걸쳐 곤충들을 관찰하고 연구한 내용을 담은 책이에요. 딱정벌레, 매미, 사마귀, 거미 같은 다양한
    곤충들이 어떻게 먹이를 잡고, 짝을 찾고, 알을 낳아 새끼를 키우는지 아주 자세하고 생생하게 설명해 줘요. 직접 관찰하며 실험한 이야기가 많아서
    곤충들의 신기한 생태를 마치 눈앞에서 보는 것처럼 느낄 수 있어요. 작은 곤충들의 세계에도 나름의 지혜와 놀라운 생존 방법이 있다는 것을 알려
    줘요. 자연과 생명에 대한 호기심을 키워 주는 세계적인 고전 과학책이에요.
