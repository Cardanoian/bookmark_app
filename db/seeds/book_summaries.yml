'9788972782810':
  title: 아홉살 인생 - 개정판
  summary: 여민은 산동네 가난한 마을에서 살아가는 아홉 살 소년이에요. 여민은 동네에 사는 다양한 이웃들, 특별한 사연을 가진 어른들과 친구들을
    만나며 세상을 하나씩 배워 가요. 가난하지만 순수한 마음으로 이웃들과 부대끼며 우정과 이별, 삶의 다양한 모습을 겪게 되지요. 어린 여민의
    눈으로 바라본 세상은 때로는 따뜻하고 때로는 서글프게 다가와요. 아이의 눈으로 삶의 진실을 담담하게 그려낸 성장 이야기예요.
'9791167551115':
  title: 죽이고 싶은 아이 :이꽃님 장편소설
  summary: 주연은 단짝 친구 서한새가 죽은 채 발견되면서 가장 유력한 살인 용의자로 몰리게 돼요. 주연은 자신이 범인이 아니라고 주장하지만
    아무도 그 말을 믿어주지 않아요. 이야기는 여러 사람의 진술과 기록을 통해 두 사람 사이에 있었던 복잡한 우정과 상처를 하나씩 드러내요. 진실이
    조금씩 밝혀지면서 두 소녀의 관계에 숨겨져 있던 뜻밖의 사연이 드러나게 되지요. 우정과 진실에 대해 다시 생각하게 만드는 미스터리 이야기예요.
'9791162203620':
  title: 파과 :구병모 장편소설
  summary: 조각은 평생을 킬러로 살아온 예순 살이 넘은 여성으로, 이제 은퇴를 앞두고 있어요. 조각은 자신의 자리를 위협하는 젊은 킬러와
    얽히게 되면서 위험한 상황에 놓이게 돼요. 이야기는 조각이 걸어온 고단한 삶과 잊지 못하는 과거의 인연을 함께 보여줘요. 늙고 낡아가는 몸으로도
    끝까지 자신의 방식대로 살아가려는 조각의 모습이 그려져요. 삶과 죽음, 늙음에 대해 깊이 생각하게 하는 이야기예요.
'9788991871670':
  title: 무릎딱지
  summary: 소녀는 사랑하는 엄마가 세상을 떠난 뒤 슬픔을 어떻게 받아들여야 할지 몰라 힘들어해요. 소녀는 무릎에 생긴 딱지를 절대 떼지 않고
    소중하게 간직하려고 해요. 그 딱지가 떨어지면 엄마의 마지막 흔적까지 사라져 버릴 것 같은 마음 때문이지요. 가족들의 따뜻한 보살핌 속에서
    소녀는 조금씩 슬픔과 그리움을 마주하는 법을 배워가요. 상실을 겪은 아이의 마음을 섬세하게 그린 그림책이에요.
'9788965795094':
  title: 호두까기 인형
  summary: 클라라는 크리스마스 이브에 대부에게서 호두까기 인형을 선물로 받아요. 밤이 되자 호두까기 인형이 살아나 장난감 병정들을 이끌고
    사악한 생쥐 왕과 전쟁을 벌이게 되지요. 클라라의 도움으로 호두까기 인형은 생쥐 왕을 물리치고 멋진 왕자로 변신해요. 클라라는 왕자와 함께
    신비로운 과자 나라로 환상적인 여행을 떠나게 돼요. 크리스마스의 설렘과 환상이 가득한 유명한 이야기예요.
'9791196436520':
  title: 가시고기 :조창인 장편소설
  summary: 다림이 아버지는 이혼 후 홀로 아들 다림이를 키우며 수영 선수의 꿈을 응원해 줘요. 그런데 아버지는 자신이 큰 병에 걸렸다는 사실을
    알게 되지만 다림이가 걱정할까 봐 끝까지 숨기려 해요. 아버지는 아들의 훈련비와 미래를 위해 자신의 몸을 돌보지 않고 모든 것을 희생해요.
    가시고기 아빠가 새끼를 위해 자기 몸을 다 내주듯, 아버지는 끝까지 아들을 위해 헌신하지요. 부모의 사랑이 얼마나 큰지 눈물겹게 보여 주는
    이야기예요.
'9791167770899':
  title: 나 혼자만 레벨업
  summary: 성진우는 가장 약한 E급 헌터로 늘 목숨을 걸고 겨우겨우 던전을 돌아다니는 처지예요. 어느 날 아주 위험한 이중 던전에 갇혀 죽을
    고비를 넘기게 되지요. 그 사건 이후 성진우에게는 다른 헌터들에게는 없는 특별한 시스템이 생겨서 끝없이 강해질 수 있게 돼요. 성진우는 이
    능력을 이용해 하루하루 레벨을 올리며 점점 최강의 헌터로 성장해 나가요. 약자에서 최강자로 거듭나는 통쾌한 성장 이야기예요.
'9788936434496':
  title: 달까지 가자 :장류진 장편소설
  summary: 평범한 회사원인 은상, 다해, 지송은 박봉에 지친 일상 속에서 인생을 바꿀 기회를 찾고 있어요. 세 사람은 큰맘 먹고 가상 화폐에
    투자하며 인생 역전을 꿈꾸게 되지요. 오르내리는 시세에 울고 웃으며 서로 의지하고 응원하는 모습을 보여줘요. 위태로운 투자 속에서도 세 친구의
    우정과 각자의 성장이 함께 그려져요. 평범한 청춘들이 달까지 가고 싶어 하는 간절한 마음이 담긴 이야기예요.
'9791170521730':
  title: 미키7 :에드워드 애슈턴 SF 장편소설
  summary: 미키는 우주 개척선의 '익스펜더블'로, 위험한 임무를 맡아 죽을 때마다 몸이 복제되어 기억과 함께 다시 태어나요. 이번에는 벌써
    일곱 번째 몸인 미키7로 살고 있는데, 어느 날 실수로 이전 몸이 아직 살아 있는 채로 함께 존재하게 되는 사고가 벌어져요. 규칙상 복제 인간이
    동시에 둘일 수 없기 때문에 미키는 큰 위기에 빠지게 되지요. 미키는 자신의 정체성과 존재 이유에 대해 고민하며 위기를 헤쳐 나가요. 목숨과
    정체성에 대한 질문을 던지는 흥미로운 SF 이야기예요.
'9788936473310':
  title: 완득이 1 (큰글자도서)
  summary: 완득이는 가난한 형편에 춤을 추는 난쟁이 아버지와 함께 사는 고등학생이에요. 담임 선생님인 똥주는 사사건건 완득이를 못살게 굴지만
    사실은 진심으로 완득이를 걱정하는 사람이에요. 완득이는 자신을 낳고 떠난 엄마가 필리핀 출신이라는 사실을 알게 되고 처음으로 엄마와 만나게
    되지요. 완득이는 킥복싱을 배우면서 자신의 화를 다스리고 조금씩 자신감을 찾아가요. 가족과 자기 자신을 이해해 가는 완득이의 성장을 그린 이야기예요.
'9788983925398':
  title: 해리포터 :불의 잔
  summary: 호그와트 4학년이 된 해리는 세 학교가 겨루는 트리위저드 대회에 나이 제한에도 불구하고 참가하게 돼요. 용, 인어, 미로 같은
    위험한 과제들을 헤쳐 나가며 우정과 용기를 시험받아요. 대회 마지막 과제에서 해리는 라이벌 세드릭과 함께 트로피에 손을 대는 순간 무서운 곳으로
    순간이동을 하게 돼요. 그곳에서 강력해진 어둠의 마법사 볼드모트가 부활하는 장면을 목격하고 말아요. 어둠과의 싸움이 본격적으로 시작되는 긴장감
    넘치는 이야기예요.
'9788934921196':
  title: 책 먹는 여우
  summary: 여우 아저씨는 남다른 취미를 가지고 있는데, 바로 소금과 후추를 뿌려서 책을 맛있게 먹는 거예요. 여우 아저씨는 새로운 책을 사
    먹을 돈이 부족해지자 직접 이야기를 써서 책을 만들기로 결심해요. 하지만 도서관에서 몰래 책을 먹다가 사서에게 들켜서 큰 곤란에 빠지고 말아요.
    여우 아저씨는 결국 자기만의 특별한 이야기책을 써내려 가면서 진짜 작가로 거듭나요. 책을 사랑하는 특별한 마음을 유쾌하게 그린 이야기예요.
'9788965794547':
  title: 위대한 개츠비
  summary: 제이 개츠비는 화려한 저택에서 밤마다 성대한 파티를 열며 많은 사람들의 관심을 받는 부자예요. 그런데 사실 개츠비가 이렇게 화려하게
    사는 이유는 오래전에 헤어진 첫사랑 데이지를 다시 만나기 위해서예요. 데이지는 이미 다른 부유한 남자와 결혼한 상태라 개츠비의 사랑은 순탄하지
    않아요. 이웃에 살게 된 닉의 눈을 통해 개츠비의 화려하지만 쓸쓸한 삶이 펼쳐져요. 결국 개츠비의 사랑은 비극적인 결말을 맞이하게 되는 유명한
    고전 이야기예요.
'9788994749624':
  title: "(명탐정) 셜록 홈즈"
  summary: 셜록 홈즈는 아주 작은 단서만 보고도 사건의 진실을 알아내는 뛰어난 탐정이에요. 홈즈는 친구이자 조수인 왓슨 박사와 함께 런던에서
    일어나는 어려운 사건들을 하나씩 해결해 나가요. 아무도 풀지 못하는 수수께끼도 홈즈의 날카로운 관찰력과 추리력 앞에서는 술술 풀리고 말아요.
    홈즈와 왓슨은 위험한 범인들과 맞서면서도 침착하게 사건을 해결해 나가요. 명탐정의 통쾌한 활약이 담긴 세계적으로 유명한 추리 이야기예요.
'9788937460777':
  title: '1984'
  summary: 윈스턴은 '빅브라더'라는 지도자가 모든 것을 감시하고 통제하는 무서운 나라에서 살아가고 있어요. 윈스턴이 일하는 곳에서는 과거의
    기록을 마음대로 바꾸는 일을 하는데, 윈스턴은 이런 세상에 점점 의문을 품게 되지요. 윈스턴은 줄리아라는 여성을 만나 몰래 사랑을 나누며 감시를
    피해 자유를 꿈꿔요. 하지만 결국 두 사람의 비밀은 발각되고 윈스턴은 무서운 처벌을 받게 돼요. 자유와 감시에 대해 깊이 생각하게 만드는 유명한
    고전 소설이에요.
'9788925588650':
  title: 마션
  summary: 우주 비행사 마크 와트니는 화성 탐사 임무 중 모래폭풍 사고로 동료들에게 죽은 줄 알려진 채 홀로 화성에 남겨지고 말아요. 마크는
    식량도 부족하고 지구와 연락할 방법도 없는 상황에서 살아남기 위해 온갖 지혜를 짜내요. 화성 흙에 감자를 재배하고 고장 난 장비를 고쳐가며
    힘겹게 하루하루를 버텨내지요. 마침내 지구와 연락이 닿으면서 마크를 구하기 위한 힘겨운 구조 작전이 시작돼요. 과학 지식과 포기하지 않는 의지로
    위기를 극복하는 감동적인 이야기예요.
'9788982814471':
  title: 연금술사
  summary: 양치기 소년 산티아고는 이집트 피라미드 근처에 보물이 있다는 꿈을 반복해서 꾸게 돼요. 산티아고는 그 꿈을 따라 스페인을 떠나
    사막을 건너는 긴 여행을 시작해요. 여행 중 연금술사를 비롯한 여러 사람들을 만나며 자연의 신호를 읽는 법과 자신만의 꿈을 이루는 지혜를 배워가지요.
    수많은 시련을 겪으면서도 산티아고는 포기하지 않고 꿈을 향해 나아가요. 자신만의 꿈을 따라가는 것이 얼마나 소중한지 알려 주는 이야기예요.
'9788994629131':
  title: '이문열 형민우 초한지 1 : 떠오르는 태양'
  summary: 진나라가 무너진 뒤 중국 땅에는 새로운 주인이 되기 위한 영웅들의 싸움이 시작돼요. 항우와 유방을 비롯한 여러 영웅호걸들이 저마다
    군사를 일으키며 천하를 놓고 다투게 되지요. 힘과 기세가 넘치는 항우와, 사람들의 마음을 얻는 데 능한 유방의 서로 다른 모습이 흥미롭게 그려져요.
    이 첫 권에서는 혼란스러운 시대에 영웅들이 하나둘 세상에 나서는 이야기가 펼쳐져요. 훗날 초나라와 한나라로 갈라져 싸우게 되는 큰 전쟁의 서막을
    보여 주는 이야기예요.
'9791164287840':
  title: 전지적 독자 시점
  summary: 김독자는 아무도 끝까지 읽지 않은 인터넷 소설 '멸망 이후의 세계'를 유일하게 완독한 독자예요. 그런데 어느 날 현실 세계가 갑자기
    그 소설 속 이야기처럼 변하면서 무서운 시나리오들이 펼쳐지기 시작해요. 김독자는 소설 내용을 미리 알고 있다는 사실을 이용해서 위기를 하나씩
    헤쳐 나가요. 소설 속 등장인물들과 함께 힘을 합쳐 멸망해 가는 세상에서 살아남으려 애써요. 지식과 용기로 위기를 극복하는 통쾌한 이야기의
    만화판이에요.
'9791169630795':
  title: 전지적 독자 시점
  summary: 김독자는 아무도 끝까지 읽지 않은 인터넷 소설 '멸망 이후의 세계'를 유일하게 완독한 독자예요. 그런데 어느 날 현실 세계가 갑자기
    그 소설 속 이야기처럼 변하면서 무서운 시나리오들이 펼쳐지기 시작해요. 김독자는 소설 내용을 미리 알고 있다는 사실을 이용해서 위기를 하나씩
    헤쳐 나가요. 소설 속 등장인물들과 함께 힘을 합쳐 멸망해 가는 세상에서 살아남으려 애써요. 지식과 용기로 위기를 극복하는 통쾌한 이야기의
    만화판이에요.
'9788954692922':
  title: 정년이
  summary: 정년이는 목포에서 소리를 기막히게 잘하는 소녀로, 엄마의 반대를 무릅쓰고 여성국극단에 들어가기로 결심해요. 낯선 서울살이와 치열한
    경쟁 속에서도 타고난 재능과 노력으로 하나씩 인정을 받아가요. 라이벌들과 부딪히고 좌절도 겪지만 포기하지 않고 무대에 서는 꿈을 이어가요.
    결국 정년이는 여성국극의 스타로 성장하며 많은 사람들에게 감동을 줘요. 꿈을 향한 열정과 노력의 소중함을 보여 주는 이야기예요.
'9780679824114':
  title: Dinosaurs before dark
  summary: 잭과 애니 남매는 숲속에서 책이 가득한 신비한 나무집을 발견하게 돼요. 나무집 안의 공룡 그림책을 펼치자 두 사람은 순식간에 공룡들이
    살던 먼 옛날로 순간이동을 하게 되지요. 잭과 애니는 무섭게 생긴 공룡들을 눈앞에서 마주치며 아슬아슬한 순간들을 겪어요. 다행히 프테라노돈의
    도움을 받아 두 사람은 다시 나무집으로 무사히 돌아오게 돼요. 시간과 공간을 넘나드는 신나는 첫 모험 이야기예요.
'9791191714302':
  title: "(동화) 가시고기"
  summary: 다림이 아버지는 이혼을 하고 홀로 다림이를 키우며 수영 선수라는 아들의 꿈을 정성껏 응원해요. 그러던 중 아버지는 자신이 큰 병에
    걸렸다는 사실을 알게 되지만 다림이가 걱정할까 봐 내색하지 않아요. 아버지는 아들의 훈련과 미래를 위해 자기 몸을 돌보지 않고 모든 것을 다
    내주지요. 가시고기 아빠가 새끼를 위해 온몸을 다 바치듯 아버지의 사랑도 그렇게 깊어요. 부모의 크나큰 사랑을 느낄 수 있는 감동적인 이야기예요.
'9788990982575':
  title: 가면산장 살인사건
  summary: 눈보라가 몰아치는 밤, 한 무리의 사람들이 산속 외딴 산장에 갇히게 돼요. 근처에 탈옥한 살인범이 숨어 있을지도 모른다는 소식에
    사람들은 서로를 알아보지 못하도록 가면을 쓰고 지내기로 하지요. 그런데 산장 안에서 하나둘 의문의 사건이 벌어지면서 사람들은 서로를 의심하기
    시작해요. 가면 뒤에 숨겨진 진실이 무엇인지 아무도 쉽게 짐작하지 못해요. 마지막 순간까지 긴장을 놓을 수 없는 미스터리 이야기예요.
'9791173323065':
  title: 셜록 홈스 :주홍색 연구
  summary: 군의관 왓슨은 다친 몸으로 전쟁터에서 돌아와 셜록 홈즈라는 독특한 인물과 한집에서 살게 돼요. 어느 날 런던의 한 빈집에서 살해된
    남자가 발견되는데, 벽에는 핏빛 글씨로 이상한 단어가 쓰여 있었어요. 경찰은 사건을 풀지 못해 쩔쩔매지만 홈즈는 작은 단서들만으로 범인의 특징을
    척척 알아맞혀요. 사건을 파헤치다 보니 오래전 머나먼 곳에서 시작된 슬픈 복수의 사연이 드러나게 되지요. 셜록 홈즈가 처음으로 등장하는 유명한
    추리소설이에요.
'9788958283508':
  title: 오이대왕
  summary: 어느 날 한 가족의 지하실에 있던 오이밭에서 이상한 오이 왕이 나타나 가족들의 집에 눌러앉게 돼요. 오이대왕은 제멋대로 명령을
    내리며 가족들을 마음대로 휘두르려고 하지요. 가족들은 갑작스레 나타난 오이대왕 때문에 크고 작은 소동과 혼란을 겪게 돼요. 아빠의 일기와 아이들의
    이야기를 통해 가족 안에서 벌어지는 우스꽝스러운 사건들이 펼쳐져요. 권위와 가족의 모습에 대해 유쾌하게 생각해 보게 하는 이야기예요.
'9788936442293':
  title: 초정리 편지:배유안 장편동화
  summary: 글을 모르는 가난한 소년 장운이는 초정리 약수터에서 우연히 낯선 어른을 만나게 돼요. 그 어른은 장운이에게 친절하게 글을 가르쳐
    주며 신기한 새 글자에 대해 이야기해 줘요. 장운이는 그 글자가 얼마나 배우기 쉽고 훌륭한지 알게 되면서 글을 깨치는 기쁨을 느끼지요. 나중에서야
    장운이는 자신에게 글을 가르쳐 준 사람이 바로 세종대왕이었다는 사실을 알게 돼요. 한글이 만들어지던 시절의 감동을 담은 이야기예요.
'9788901161266':
  title: 허생전
  summary: 허생은 글공부만 하고 살림은 돌보지 않는 가난한 선비로, 아내의 성화에 못 이겨 돈을 벌러 나서게 돼요. 허생은 한양의 부자 변씨에게
    큰돈을 빌려 과일과 말총 같은 물건을 몽땅 사들이는 방법으로 큰돈을 벌어들이지요. 허생은 그렇게 모은 돈으로 도적들을 이끌고 빈 섬으로 가서
    함께 살 만한 살기 좋은 세상을 만들어요. 세상을 떠나기 전 허생은 빌린 돈을 갚고 다시 조용히 글공부하는 선비로 돌아가지요. 조선 시대 양반
    사회의 헛점을 재치 있게 꼬집는 유명한 고전 이야기예요.
'9788949150550':
  title: 마법의 시간여행
  summary: 잭과 애니 남매는 숲속에서 책이 가득한 신비한 나무집을 발견하게 돼요. 나무집 안의 공룡 그림책을 펼치자 두 사람은 순식간에 공룡들이
    살던 먼 옛날로 순간이동을 하게 되지요. 잭과 애니는 무섭게 생긴 공룡들을 눈앞에서 마주치며 아슬아슬한 순간들을 겪어요. 다행히 프테라노돈의
    도움을 받아 두 사람은 다시 나무집으로 무사히 돌아오게 돼요. 시간과 공간을 넘나드는 신나는 첫 모험 이야기예요.
'9791130604190':
  title: 개를 훔치는 완벽한 방법
  summary: 조지나는 아빠가 집을 나간 뒤 엄마, 동생과 함께 자동차에서 지내야 할 만큼 어려운 형편에 놓이게 돼요. 조지나는 돈을 벌기 위해
    남의 개를 몰래 데려갔다가 사례금을 받고 돌려주는 대담한 계획을 세우게 되지요. 친구 토비와 함께 계획을 실행하지만 생각처럼 쉽게 되지 않고
    예상치 못한 일들이 벌어져요. 개를 훔치는 과정에서 조지나는 옳고 그름에 대해 다시 한번 깊이 생각하게 돼요. 어려운 형편 속에서도 소중한
    것을 깨달아 가는 이야기예요.
'9791193358825':
  title: 노트북 :니컬러스 스파크스 장편소설
  summary: 어느 요양원에서 한 할아버지가 기억을 잃어가는 할머니에게 낡은 공책 속 이야기를 매일 읽어 줘요. 그 이야기는 오래전 여름, 신분이
    다른 두 젊은 남녀 노아와 앨리가 만나 사랑에 빠졌던 추억이에요. 두 사람은 집안의 반대와 전쟁 때문에 오랫동안 헤어져 지내야 했지만 서로를
    잊지 못해요. 시간이 흐른 뒤 두 사람은 다시 만나 마침내 사랑을 이루게 되지요. 오랜 세월이 지나도 변하지 않는 사랑을 그린 감동적인 이야기예요.
'9788934967347':
  title: 전지적 독자 시점 =part 1 /Omniscient reader's viewpoint
  summary: 김독자는 아무도 끝까지 읽지 않은 인터넷 소설 '멸망 이후의 세계'를 유일하게 완독한 독자예요. 그런데 어느 날 현실 세계가 갑자기
    그 소설 속 이야기처럼 변하면서 무서운 시나리오들이 펼쳐지기 시작해요. 김독자는 소설 내용을 미리 알고 있다는 사실을 이용해서 위기를 하나씩
    헤쳐 나가요. 소설 속 등장인물들과 함께 힘을 합쳐 멸망해 가는 세상에서 살아남으려 애써요. 지식과 용기로 위기를 극복하는 통쾌한 이야기예요.
'9788949144207':
  title: 배드 가이즈
  summary: 늑대 아저씨, 뱀 아저씨, 상어 아저씨, 피라냐 아저씨는 겉모습 때문에 늘 나쁜 녀석들이라는 오해를 받아요. 이들은 사람들에게
    착한 모습을 보여 주기 위해 좋은 일을 하기로 마음먹어요. 처음에는 좋은 일이 서툴러서 자꾸 엉뚱한 사고를 치고 말아요. 그래도 포기하지 않고
    진짜 착한 영웅이 되기 위해 노력해요. 겉모습만 보고 판단하면 안 된다는 걸 유쾌하게 알려 주는 이야기예요.
'9791167770707':
  title: 나 혼자만 레벨업
  summary: 세상에서 가장 약한 사냥꾼이었던 성진우가 목숨을 건 던전에서 살아남은 뒤 혼자에게만 보이는 신비한 시스템을 얻어 점점 강해지는
    이야기예요. 레벨을 올릴수록 힘과 능력이 쑥쑥 자라면서 성진우는 세상에서 가장 강한 헌터로 거듭나요. 위험한 몬스터와 던전을 헤쳐 나가는 짜릿한
    모험이 계속 펼쳐져요. 약했던 주인공이 노력과 용기로 최강자가 되는 성장 이야기라 더 통쾌하게 느껴져요.
'9791136401229':
  title: 나 혼자만 레벨업 =추공 장편소설 /Only I level up
  summary: 세상에서 가장 약한 사냥꾼이었던 성진우가 목숨을 건 던전에서 살아남은 뒤 혼자에게만 보이는 신비한 시스템을 얻어 점점 강해지는
    이야기예요. 레벨을 올릴수록 힘과 능력이 쑥쑥 자라면서 성진우는 세상에서 가장 강한 헌터로 거듭나요. 위험한 몬스터와 던전을 헤쳐 나가는 짜릿한
    모험이 계속 펼쳐져요. 약했던 주인공이 노력과 용기로 최강자가 되는 성장 이야기라 더 통쾌하게 느껴져요.
'9788957981023':
  title: 너도 하늘말나리야:이금이 장편동화
  summary: 엄마 아빠와 관련된 아픔을 하나씩 지닌 세 친구 미르와 소희, 바우가 시골 마을에서 만나며 벌어지는 이야기예요. 처음엔 서로 서먹하고
    오해도 하지만 점점 마음을 열고 진짜 친구가 되어가요. 각자의 상처를 이해해 주면서 아이들은 조금씩 씩씩하게 성장해요. 가족과 우정의 소중함을
    잔잔하게 느끼게 해주는 성장동화예요.
'9788937462788':
  title: 노인과 바다
  summary: 늙은 어부 산티아고가 84일 동안 고기를 한 마리도 못 잡다가 커다란 청새치를 만나 사흘 밤낮 사투를 벌이는 이야기예요. 온 힘을
    다해 마침내 청새치를 잡지만 돌아오는 길에 상어 떼가 몰려들어 물고기를 다 뜯어 먹어버려요. 결국 뼈만 남은 채 항구로 돌아오지만 노인은 포기하지
    않았던 자신에게 떳떳함을 느껴요. 사람은 실패해도 굴복하지 않는 존재라는 걸 보여주는 감동적인 이야기예요.
'9788934967361':
  title: 전지적 독자 시점 =part 1 /Omniscient reader's viewpoint
  summary: 김독자는 오직 자신만 끝까지 읽은 인터넷 소설 속 이야기가 어느 날 현실이 되어버리는 걸 알게 돼요. 소설 속 미래 내용을 알고
    있는 덕분에 다가올 위험을 미리 예측하고 사람들을 구해요. 갑자기 멸망이 시작된 세상에서 김독자는 소설 속 인물들과 함께 살아남기 위해 힘을
    모아요. 아무도 몰랐던 사실을 아는 유일한 독자가 진짜 주인공이 되어가는 짜릿한 이야기예요.
'9788954682466':
  title: 정년이
  summary: 1950년대 목포에 사는 소녀 윤정년은 타고난 소리 실력을 가지고 있지만 형편이 어려워 꿈을 펼치기 힘들었어요. 여성들만으로 이루어진
    국극단에 들어가게 된 정년은 뛰어난 재능으로 두각을 나타내기 시작해요. 질투와 견제 속에서도 정년은 실력으로 하나씩 인정받으며 최고의 소리꾼으로
    성장해가요. 꿈을 향한 열정과 노력이 감동을 주는 이야기예요.
'9788954671989':
  title: 귤의 맛 :조남주 장편소설
  summary: 작은 동네에 사는 네 소녀 다윤, 은지, 해인, 노을이 친구가 되어 함께 자라나는 이야기예요. 서로 성격도 다르고 가정 환경도
    다르지만 우정을 나누며 힘든 순간을 함께 이겨내요. 시간이 흐르면서 각자 다른 고민과 변화를 겪지만 우정은 계속 이어져요. 친구와 함께 자라는
    게 얼마나 소중한지 느끼게 해주는 이야기예요.
'9788949190020':
  title: 모모
  summary: 회색 신사들이 사람들을 꾀어 소중한 시간을 훔쳐가면서 마을 사람들은 점점 여유와 행복을 잃어가요. 시간의 소중함을 아는 소녀 모모는
    거북이 카시오페이아의 도움을 받아 시간을 지키는 호라 박사를 찾아가요. 모모는 용기를 내어 회색 신사들과 맞서 사람들의 잃어버린 시간을 되찾아
    줘요. 진짜 소중한 건 바쁘게 사는 게 아니라 사람들과 함께하는 시간이라는 걸 알려주는 이야기예요.
'9788949190013':
  title: 수학 귀신 :수학을 싫어하는 한 소년이 수학의 원리를 깨우치기까지
  summary: 수학을 싫어하는 소년 로베르트는 매일 밤 꿈속에서 신기한 수학 귀신을 만나요. 수학 귀신은 어려워 보이던 숫자와 계산을 재미있는
    마법처럼 쉽고 신기하게 보여줘요. 열두 밤 동안 꿈에서 만남을 거듭하며 로베르트는 수학이 얼마나 흥미로운 것인지 깨닫게 돼요. 수학을 무서워하던
    아이도 저절로 수학과 친해지게 만들어주는 이야기예요.
'9788985712682':
  title: 연어
  summary: 은빛 비늘을 가진 연어 한 마리가 넓은 바다에서 살다가 자신이 태어난 강으로 돌아가는 힘든 여정을 떠나요. 물살을 거슬러 오르며
    온갖 위험과 시련을 겪지만 포기하지 않고 헤엄쳐 나가요. 그 여정 속에서 연어는 삶과 사랑, 죽음의 의미에 대해 깊이 생각하게 돼요. 자연의
    신비와 생명의 소중함을 아름답게 그려낸 이야기예요.
'9788934967354':
  title: 전지적 독자 시점 =part 1 /Omniscient reader's viewpoint
  summary: 김독자는 오직 자신만 끝까지 읽은 인터넷 소설 속 이야기가 어느 날 현실이 되어버리는 걸 알게 돼요. 소설 속 미래 내용을 알고
    있는 덕분에 다가올 위험을 미리 예측하고 사람들을 구해요. 갑자기 멸망이 시작된 세상에서 김독자는 소설 속 인물들과 함께 살아남기 위해 힘을
    모아요. 아무도 몰랐던 사실을 아는 유일한 독자가 진짜 주인공이 되어가는 짜릿한 이야기예요.
'9788965480471':
  title: 초한지
  summary: 진나라가 무너진 뒤 항우와 유방이라는 두 영웅이 천하를 차지하기 위해 치열하게 다투는 이야기예요. 힘이 세고 용맹한 항우와 지혜롭고
    인내심 많은 유방은 여러 차례 전쟁을 치르며 엎치락뒤치락해요. 결국 유방이 여러 인재들의 도움을 받아 항우를 물리치고 한나라를 세우게 돼요.
    지혜와 사람의 마음을 얻는 것이 힘보다 강하다는 걸 보여주는 역사 이야기예요.
'9788936458775':
  title: 하늘은 맑건만 :현덕 소설
  summary: 문기는 심부름을 갔다가 실수로 거스름돈을 너무 많이 받게 돼요. 친구 수만이의 꾐에 넘어가 그 돈으로 물건을 사고 놀이도 하지만
    마음은 편치 않아요. 죄책감에 시달리던 문기는 결국 사실대로 털어놓기로 마음먹어요. 정직하게 사는 것이 얼마나 마음 편한 일인지 깨닫게 해주는
    이야기예요.
'9788961706438':
  title: 도그맨
  summary: 폭탄 사고로 크게 다친 경찰견과 경찰관을 살리기 위해 의사들이 개의 머리와 사람의 몸을 합치는 수술을 해서 도그맨이 탄생해요.
    도그맨은 냄새를 잘 맡는 개의 능력과 사람의 지혜를 모두 가지고 도시의 나쁜 짓을 해결해요. 얄미운 고양이 악당 피티가 여러 가지 사고를 치지만
    도그맨은 유쾌하게 사건을 풀어가요. 웃음과 감동이 함께 있는 유쾌한 만화책이에요.
'9788954672214':
  title: 시선으로부터, :정세랑 장편소설
  summary: 심시선 할머니가 세상을 떠난 뒤, 가족들은 할머니의 특별한 유언에 따라 하와이로 제사 여행을 떠나요. 할머니의 자녀와 손주들은
    여행을 하며 각자 자신만의 방식으로 할머니를 추억해요. 이야기를 통해 자유롭고 당당하게 살았던 할머니의 인생이 하나씩 드러나요. 가족마다 다른
    기억 속에서 한 사람의 진짜 모습을 찾아가는 이야기예요.
'9788934967385':
  title: 전지적 독자 시점 =part 1 /Omniscient reader's viewpoint
  summary: 김독자는 오직 자신만 끝까지 읽은 인터넷 소설 속 이야기가 어느 날 현실이 되어버리는 걸 알게 돼요. 소설 속 미래 내용을 알고
    있는 덕분에 다가올 위험을 미리 예측하고 사람들을 구해요. 갑자기 멸망이 시작된 세상에서 김독자는 소설 속 인물들과 함께 살아남기 위해 힘을
    모아요. 아무도 몰랐던 사실을 아는 유일한 독자가 진짜 주인공이 되어가는 짜릿한 이야기예요.
'9788965795735':
  title: 서유기
  summary: 삼장법사는 불경을 구하러 인도로 떠나는 먼 여행을 시작해요. 손오공, 저팔계, 사오정이 제자가 되어 삼장법사를 지키며 함께 길을
    떠나요. 가는 길마다 요괴들이 나타나 방해하지만 손오공의 뛰어난 재주로 하나씩 물리쳐요. 우정과 용기로 어려움을 이겨내는 통쾌한 모험 이야기예요.
'9788950921705':
  title: 쾌걸 조로리
  summary: 장난꾸러기 여우 조로리는 세상에서 제일가는 짓궂은 장난의 왕이 되는 것이 꿈이에요. 제자인 멧돼지 형제 노시시, 가치시와 함께
    이곳저곳을 돌아다니며 신나는 장난을 계획해요. 하지만 계획은 항상 엉뚱하게 꼬여서 우스꽝스러운 소동이 벌어져요. 웃음이 끊이지 않는 유쾌한
    모험이 가득한 이야기예요.
'9788949141121':
  title: 레 미제라블
  summary: 빵 한 조각을 훔친 죄로 오랫동안 감옥살이를 한 장발장은 세상에 대한 원망으로 가득해요. 하지만 은촛대를 훔친 그를 용서해준 신부님
    덕분에 마음을 바꿔 새사람이 되기로 결심해요. 장발장은 이름을 바꾸고 성실하게 살면서 불쌍한 여인의 딸 코제트를 딸처럼 돌보아줘요. 끝까지
    그를 쫓는 자베르 경감을 피해 다니면서도 장발장은 선하게 살아가려 애써요.
'9788936473235':
  title: 소년이 온다 :한강 장편소설
  summary: 1980년 5월 광주에서 친구를 찾다가 목숨을 잃은 소년 동호의 이야기로 시작해요. 동호와 그 곁에 있던 사람들이 겪은 아픈 사건을
    여러 사람의 시선으로 하나씩 들려줘요. 힘든 시절 속에서도 사람들이 서로를 지키려 했던 마음이 가슴 아프게 다가와요. 우리 역사의 슬픈 순간을
    잊지 말자는 마음을 담은 이야기예요.
'9791185193977':
  title: 이태원 클라쓰
  summary: 박새로이는 학교폭력 사건에 휘말려 인생이 크게 꼬여버려요. 시간이 흘러 새로이는 이태원에 작은 술집을 열고 자신을 힘들게 했던
    대기업에 맞서기로 결심해요. 여러 사람들과 힘을 합쳐 가게를 키워나가며 새로이는 조금씩 꿈을 이뤄가요. 포기하지 않는 마음과 신념으로 어려움을
    이겨내는 이야기예요.
'9788949120775':
  title: 줄무늬 파자마를 입은 소년
  summary: 독일 장교의 아들 브루노는 이사 간 새집 근처 울타리 너머에서 줄무늬 옷을 입은 또래 소년 쉬무엘을 만나요. 두 아이는 서로 다른
    세상에 살고 있지만 울타리를 사이에 두고 우정을 쌓아가요. 브루노는 그곳이 얼마나 무서운 곳인지 모른 채 쉬무엘과 놀아주고 싶어해요. 순수한
    아이들의 우정이 역사의 비극과 맞닿으면서 가슴 아픈 결말로 이어지는 이야기예요.
'9788936455286':
  title: 수영장 가는 날 =염혜원 그림책 /Saturday is swimming day
  summary: 주인공 아이는 토요일마다 엄마와 함께 수영장에 가는 것을 손꼽아 기다려요. 물에 들어가기 전 준비하는 순간부터 신나게 헤엄치는
    순간까지 하루 일과가 그림으로 정겹게 펼쳐져요. 처음엔 서툴던 수영 실력도 조금씩 늘어가는 모습이 담겨 있어요. 평범한 일상 속 작은 행복을
    느끼게 해주는 그림책이에요.
'9788952787590':
  title: 샬롯의 거미줄
  summary: 돼지 윌버는 거미 샬롯과 친구가 되지만 곧 도살될 위기에 처하게 돼요. 샬롯은 윌버를 살리기 위해 거미줄에 '대단한 돼지' 같은
    글자를 짜 넣어 사람들을 놀라게 해요. 윌버는 유명해져서 위기를 넘기지만 샬롯은 얼마 남지 않은 삶을 살고 있었어요. 진정한 우정이 무엇인지
    깊은 감동을 주는 이야기예요.
'9788925550633':
  title: 오싹오싹 당근
  summary: 토끼 제스퍼는 정원에 있는 당근을 뽑아 먹는 걸 아주 좋아해요. 그런데 어느 순간부터 당근들이 자신을 따라오는 것 같은 이상한
    느낌을 받기 시작해요. 제스퍼는 무서운 마음에 당근을 피해 이리저리 도망 다니지만 결국 당근은 그저 자리에 가만히 있을 뿐이에요. 익살스러운
    반전으로 웃음을 주는 그림책이에요.
'9788965795049':
  title: 거울 나라의 앨리스
  summary: 앨리스는 거울 속으로 들어가 체스판처럼 생긴 신기한 나라에 도착해요. 그곳에서 트위들덤과 트위들디, 붉은 여왕 등 이상한 인물들을
    만나며 체스 말처럼 한 칸씩 나아가는 모험을 해요. 여러 가지 황당하고 재미있는 사건들을 겪으며 앨리스는 마침내 여왕이 돼요. 상상력 넘치는
    신기한 나라의 이야기가 가득해요.
'9791158362157':
  title: 나는 강물처럼 말해요
  summary: 말을 더듬는 소년은 학교에서 발표할 때마다 부끄럽고 힘들어해요. 어느 날 아빠와 함께 강가에 간 소년은 강물이 부딪히고 소용돌이치며
    흐르는 모습을 보게 돼요. 아빠는 소년에게 강물처럼 너의 말도 그렇게 흘러가는 거라고 다정하게 이야기해줘요. 자신의 다름을 있는 그대로 받아들이는
    용기를 주는 그림책이에요.
'9788937460050':
  title: 동물농장
  summary: 매너 농장의 동물들은 인간 농장주의 학대에 지쳐 힘을 합쳐 그를 몰아내고 자신들만의 농장을 만들어요. 처음엔 모든 동물이 평등하게
    살자고 약속했지만 점점 똑똑한 돼지들이 권력을 차지하기 시작해요. 시간이 지날수록 돼지들은 다른 동물들을 억누르며 예전 인간 주인과 다를 바
    없어져요. 힘을 가진 자가 변해가는 모습을 통해 진정한 평등이 무엇인지 생각하게 하는 이야기예요.
'9788965793823':
  title: 아라비안나이트
  summary: 세헤라자데는 자신을 죽이려는 왕에게 매일 밤 재미있는 이야기를 들려주기 시작해요. 신드바드의 모험, 알라딘과 요술 램프, 알리바바와
    40인의 도둑 같은 신기한 이야기들이 밤마다 펼쳐져요. 이야기가 끝나지 않도록 매번 절묘한 순간에 이야기를 멈추는 세헤라자데의 지혜가 돋보여요.
    결국 왕의 마음이 누그러지면서 두 사람은 행복하게 살게 돼요.
'9788954691666':
  title: 정년이
  summary: 1950년대 목포에 사는 소녀 윤정년은 타고난 소리 실력을 가지고 있지만 형편이 어려워 꿈을 펼치기 힘들었어요. 여성들만으로 이루어진
    국극단에 들어가게 된 정년은 뛰어난 재능으로 두각을 나타내기 시작해요. 질투와 견제 속에서도 정년은 실력으로 하나씩 인정받으며 최고의 소리꾼으로
    성장해가요. 꿈을 향한 열정과 노력이 감동을 주는 이야기예요.
'9788983925411':
  title: 해리포터 :불사조 기사단
  summary: 해리는 볼드모트가 부활했다는 사실을 마법 정부가 믿지 않아 답답한 나날을 보내요. 새로 부임한 엄브리지 교수는 학생들을 마법으로부터
    멀어지게 하려 하고, 해리는 몰래 친구들과 방어마법 동아리를 만들어요. 불사조 기사단과 함께 볼드모트에 맞서 싸우지만 그 과정에서 소중한 사람을
    잃는 아픔을 겪어요. 진실을 밝히기 위한 해리와 친구들의 용감한 싸움이 펼쳐지는 이야기예요.
'9788965796138':
  title: 심청전
  summary: 앞을 보지 못하는 아버지를 모시고 사는 효녀 심청은 아버지의 눈을 뜨게 해준다는 말에 공양미 삼백 석에 몸을 팔아요. 심청은 인당수
    바다에 몸을 던지지만 용왕의 도움으로 다시 살아나 연꽃에 실려 세상으로 돌아와요. 이후 왕비가 된 심청은 아버지를 찾기 위해 맹인 잔치를 열어요.
    마침내 아버지를 만난 심청의 효심에 감동한 아버지는 두 눈을 번쩍 뜨게 돼요.
'9788934940913':
  title: 잘못 뽑은 반장 :슬기로운 학교생활 만화
  summary: 장난꾸러기 이로운은 친구들의 부추김에 얼떨결에 반장 후보로 나가게 돼요. 재미로 나간 선거에서 뜻밖에 반장으로 뽑히면서 이로운은
    당황하고 말아요. 처음엔 서툴고 엉뚱하게 반장 역할을 하지만 점점 책임감을 느끼며 진짜 반장답게 변해가요. 실수를 통해 성장해가는 유쾌한 이야기예요.
'9788965796046':
  title: 둘리틀 선생의 항해기
  summary: 동물들의 말을 알아듣는 둘리틀 선생은 아프리카 원숭이들 사이에 퍼진 전염병 소식을 듣게 돼요. 둘리틀 선생은 앵무새 폴리네시아와
    여러 동물 친구들을 데리고 배를 타고 먼 항해를 떠나요. 항해 도중 여러 위험과 신기한 사건들을 겪지만 동물 친구들의 도움으로 하나씩 헤쳐나가요.
    마침내 아프리카에 도착해 아픈 원숭이들을 치료해주는 훈훈한 이야기예요.
'9788925564685':
  title: 미스터 션샤인 =드라마 원작소설 /Mr. Sunshine
  summary: 조선의 노비였던 유진은 어린 시절 미국으로 건너가 힘든 시간을 보낸 끝에 미군 장교가 되어 돌아와요. 조선으로 돌아온 유진은 신분이
    높은 집안의 당찬 소녀 애신을 만나 마음이 끌리게 돼요. 나라가 위기에 처한 혼란스러운 시대 속에서 유진과 애신은 각자의 방식으로 나라를 지키기
    위해 애써요. 신분을 뛰어넘은 사랑과 조국을 향한 용기가 담긴 이야기예요.
'9788997381678':
  title: 소년과 두더지와 여우와 말
  summary: 눈 내리는 들판에서 외로운 소년은 우연히 두더지를 만나고, 둘은 함께 여행을 떠나며 여우와 말도 만나게 돼요. 네 친구는 함께
    걸으며 삶과 용기, 친절함에 대한 따뜻한 이야기를 나눠요. 서로 다른 존재들이지만 진심으로 마음을 나누며 큰 위로를 주고받아요. 짧지만 깊은
    울림을 주는 그림 같은 이야기예요.
'9791164287048':
  title: 전지적 독자 시점
  summary: 김독자는 오직 자신만 끝까지 읽은 인터넷 소설 속 이야기가 어느 날 현실이 되어버리는 걸 알게 돼요. 소설 속 미래 내용을 알고
    있는 덕분에 다가올 위험을 미리 예측하고 사람들을 구해요. 갑자기 멸망이 시작된 세상에서 김독자는 소설 속 인물들과 함께 살아남기 위해 힘을
    모아요. 아무도 몰랐던 사실을 아는 유일한 독자가 진짜 주인공이 되어가는 짜릿한 이야기예요.
'9788965793649':
  title: 해저 2만 리
  summary: 아로낙스 교수 일행은 바다 괴물로 소문난 정체불명의 물체를 조사하다가 그것이 네모 선장의 잠수함 노틸러스호라는 걸 알게 돼요.
    네모 선장과 함께 잠수함을 타고 깊은 바닷속 세계를 탐험하며 신비한 바다 생물들을 만나요. 때로는 위험한 상황도 만나지만 바닷속 세상의 아름다움과
    신비함에 감탄하게 돼요. 상상력 넘치는 해저 대모험 이야기예요.
'9791158360351':
  title: 으리으리한 개집
  summary: 작은 강아지는 자기 몸에 비해 지나치게 크고 화려한 개집을 갖게 돼요. 처음엔 크고 멋진 집이 마냥 자랑스러웠지만 시간이 지날수록
    그 안이 춥고 쓸쓸하게 느껴져요. 강아지는 진짜 편안하고 행복한 보금자리가 무엇인지 다시 생각하게 돼요. 겉모습보다 마음이 편한 것이 더 소중하다는
    걸 알려주는 그림책이에요.
'9791130630816':
  title: 중증외상센터 골든 아워 =Golden hour
  summary: 천재적인 실력을 가진 외과의사 백강혁은 촌각을 다투는 중증외상 환자들을 살리기 위해 온 힘을 다해요. 병원의 여러 어려운 상황과
    부족한 지원 속에서도 백강혁은 환자를 살리는 일을 최우선으로 여겨요. 함께 일하는 젊은 의사들도 백강혁을 보며 진짜 의사의 자세를 배워가요.
    생명을 살리기 위한 치열하고 감동적인 이야기예요.
'9788953588769':
  title: 퍼시잭슨과 올림포스의 신
  summary: 평범한 줄 알았던 소년 퍼시 잭슨은 자신이 바다의 신 포세이돈의 아들이라는 놀라운 사실을 알게 돼요. 제우스의 번개를 훔쳤다는
    누명을 쓴 퍼시는 친구 그로버, 아나베스와 함께 누명을 벗기 위한 모험을 떠나요. 그리스 신화 속 괴물들과 신들을 만나며 퍼시는 점점 자신의
    능력을 깨닫게 돼요. 그리스 신화를 배경으로 한 신나는 모험 이야기예요.
'9788952788719':
  title: 찰리와 초콜릿 공장 - 개정판
  summary: 가난한 소년 찰리는 윌리 웡카 초콜릿 공장의 신비한 초대권인 황금 티켓을 우연히 얻게 돼요. 찰리를 포함한 다섯 아이는 공장을
    견학하게 되는데, 욕심 많고 버릇없는 아이들은 하나씩 이상한 사고를 당해요. 오직 정직하고 착한 마음을 가진 찰리만이 끝까지 규칙을 지키며
    웡카 아저씨의 신뢰를 얻어요. 결국 찰리는 놀랍게도 초콜릿 공장을 물려받게 되는 행운을 얻어요.
'9781442402980':
  title: Creepy pair of underwear!
  summary: 어둠을 무서워하는 토끼 아이는 어느 날 반짝반짝 빛나는 무서운 속옷을 발견하고 사게 돼요. 그런데 그 속옷이 밤마다 스스로 빛을
    내며 온 방 안을 돌아다녀서 아이는 깜짝 놀라요. 아무리 숨기고 버려도 속옷은 자꾸만 다시 나타나서 아이를 곤란하게 만들어요. 결국 아이는
    용기를 내어 무서운 속옷과 친구가 되기로 하는 유쾌한 이야기예요.
'9788950908584':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 손오공은 옥황상제의 명을 받아 한자의 신비한 힘을 배우기 위한 모험을 떠나요. 한자를 익힐 때마다 그 글자의 뜻과 똑같은 신기한
    마법을 부릴 수 있게 돼요. 손오공은 배운 한자의 힘으로 여러 요괴들과 맞서 싸우며 위기를 헤쳐나가요. 한자를 재미있는 모험 이야기로 배울
    수 있게 해주는 학습만화예요.
'9788949144191':
  title: 배드 가이즈
  summary: 늑대, 뱀, 상어, 피라냐는 무섭게 생긴 겉모습 때문에 늘 나쁜 녀석 취급을 받아요. 억울했던 이들은 이제부터 착한 일을 해서
    좋은 녀석이 되기로 결심해요. 하지만 오랫동안 나쁜 짓에 익숙했던 탓에 착한 일을 하려 할 때마다 자꾸 엉뚱한 소동이 벌어져요. 좌충우돌 끝에
    진짜 착한 마음이 무엇인지 깨달아가는 유쾌한 이야기예요.
'9788936473327':
  title: 완득이 2 (큰글자도서)
  summary: 도완득은 반항심 가득한 고등학생으로, 킥복싱을 하며 답답한 마음을 풀어요. 괴짜 같은 담임 선생님 동주는 자꾸 완득이의 일에 참견하며
    잔소리를 늘어놓아요. 완득이는 얼굴도 모르고 지내던 베트남인 어머니와 장애를 가진 아버지를 이해하게 되면서 조금씩 마음의 문을 열어요. 투박하지만
    따뜻한 시선으로 성장을 그린 이야기예요.
'9791185193649':
  title: 이태원 클라쓰
  summary: 박새로이는 학교폭력 사건에 휘말려 인생이 크게 꼬여버려요. 시간이 흘러 새로이는 이태원에 작은 술집을 열고 자신을 힘들게 했던
    대기업에 맞서기로 결심해요. 여러 사람들과 힘을 합쳐 가게를 키워나가며 새로이는 조금씩 꿈을 이뤄가요. 포기하지 않는 마음과 신념으로 어려움을
    이겨내는 이야기예요.
'9788936449032':
  title: 홍길동전
  summary: 홍길동은 재주가 뛰어나지만 서자로 태어난 탓에 아버지를 아버지라 부르지 못하는 서러움을 겪어요. 집을 나온 길동은 의적 무리 활빈당의
    우두머리가 되어 탐관오리의 재물을 빼앗아 가난한 백성들에게 나눠줘요. 뛰어난 도술로 관군을 따돌리며 정의로운 일을 해나가는 길동의 활약이 통쾌하게
    펼쳐져요. 마침내 길동은 율도국이라는 새로운 나라를 세워 백성들과 함께 행복하게 살아가요.
'9788955825893':
  title: 설날
  summary: 설날 아침, 아이는 예쁜 한복을 입고 부모님과 함께 할머니 할아버지 댁으로 세배를 하러 가요. 어른들께 정성껏 세배를 올리고 덕담과
    함께 세뱃돈을 받아 마음이 두근두근해요. 온 가족이 둘러앉아 따뜻한 떡국을 나눠 먹으며 한 살 더 먹는 새해를 맞이해요. 우리나라 명절인 설날의
    정겨운 풍경을 담은 그림책이에요.
'9788952709042':
  title: 아낌없이 주는 나무
  summary: 한 그루의 나무는 어린 소년과 친구가 되어 그네를 태워주고 그늘을 만들어주며 행복한 시간을 함께 보내요. 소년이 자라면서 필요할
    때마다 나무는 열매와 나뭇가지, 몸통까지 아낌없이 내어줘요. 세월이 흘러 노인이 된 소년이 돌아왔을 때 나무는 이제 그루터기만 남아 있어요.
    그래도 나무는 지친 노인이 앉아 쉴 수 있도록 그루터기를 기꺼이 내어주는 감동적인 이야기예요.
'9788901161242':
  title: 강림도령
  summary: 저승사자가 필요했던 염라대왕은 이승에서 가장 똑똑한 강림이라는 사람을 저승사자로 데려오려 해요. 강림은 온갖 어려운 문제와 시험을
    지혜롭게 풀어내며 저승으로 가는 길을 헤쳐나가요. 결국 강림은 염라대왕을 이승으로 데려오라는 어려운 임무까지 성공적으로 해내요. 지혜와 용기로
    힘든 일을 해낸 강림이 저승사자가 되는 우리나라 전래 신화예요.
'9791136401212':
  title: 나 혼자만 레벨업 =추공 장편소설 /Only I level up
  summary: 세상에서 가장 약한 사냥꾼이었던 성진우가 목숨을 건 던전에서 살아남은 뒤 혼자에게만 보이는 신비한 시스템을 얻어 점점 강해지는
    이야기예요. 레벨을 올릴수록 힘과 능력이 쑥쑥 자라면서 성진우는 세상에서 가장 강한 헌터로 거듭나요. 위험한 몬스터와 던전을 헤쳐 나가는 짜릿한
    모험이 계속 펼쳐져요. 약했던 주인공이 노력과 용기로 최강자가 되는 성장 이야기라 더 통쾌하게 느껴져요.
'9788992555487':
  title: 리버보이
  summary: 소녀 제스는 큰 병을 앓고 있는 할아버지를 따라 할아버지의 고향인 강가 마을로 여행을 떠나요. 할아버지는 마지막 힘을 다해 평생
    그리던 그림을 완성하려 하고, 제스는 강가에서 신비한 소년을 만나요. 강물을 따라 헤엄치고 그림을 그리는 시간 속에서 제스는 삶과 이별의 의미를
    조금씩 깨달아가요. 할아버지와의 마지막 시간을 아름답게 그려낸 감동적인 이야기예요.
'9791162790021':
  title: 이태원 클라쓰
  summary: 박새로이는 학교폭력 사건에 휘말려 인생이 크게 꼬여버려요. 시간이 흘러 새로이는 이태원에 작은 술집을 열고 자신을 힘들게 했던
    대기업에 맞서기로 결심해요. 여러 사람들과 힘을 합쳐 가게를 키워나가며 새로이는 조금씩 꿈을 이뤄가요. 포기하지 않는 마음과 신념으로 어려움을
    이겨내는 이야기예요.
'9788965480464':
  title: 초한지
  summary: 진나라가 무너진 뒤 항우와 유방이라는 두 영웅이 천하를 차지하기 위해 치열하게 다투는 이야기예요. 힘이 세고 용맹한 항우와 지혜롭고
    인내심 많은 유방은 여러 차례 전쟁을 치르며 엎치락뒤치락해요. 결국 유방이 여러 인재들의 도움을 받아 항우를 물리치고 한나라를 세우게 돼요.
    지혜와 사람의 마음을 얻는 것이 힘보다 강하다는 걸 보여주는 역사 이야기예요.
'9789810986995':
  title: "(The) Bad guys"
  summary: 늑대, 뱀, 상어, 피라냐는 무섭게 생긴 겉모습 때문에 늘 나쁜 녀석 취급을 받아요. 억울했던 이들은 이제부터 착한 일을 해서
    좋은 녀석이 되기로 결심해요. 하지만 오랫동안 나쁜 짓에 익숙했던 탓에 착한 일을 하려 할 때마다 자꾸 엉뚱한 소동이 벌어져요. 좌충우돌 끝에
    진짜 착한 마음이 무엇인지 깨달아가는 유쾌한 이야기예요.
'9788970943114':
  title: 수호의 하얀말
  summary: 가난한 목동 수호는 들판에서 주운 하얀 망아지를 정성껏 키우며 둘도 없는 친구가 돼요. 하얀 말은 무럭무럭 자라 경마 대회에서
    우승할 만큼 훌륭한 말이 되지만, 욕심 많은 영주가 말을 강제로 빼앗아가요. 말은 수호에게 돌아가려다 크게 다쳐 결국 숨을 거두고 말아요.
    수호는 슬픔 속에서 말의 뼈와 가죽으로 악기를 만들어 늘 함께하기로 하는데, 이것이 몽골의 전통 악기 마두금의 유래가 되는 이야기예요.
'9788959761654':
  title: 엉덩이탐정 :뿡뿡 사라진 과자를 찾아라!
  summary: 과자가 감쪽같이 사라지는 이상한 사건이 벌어지자 엉덩이 모양 얼굴을 한 탐정이 나타나요. 엉덩이탐정은 특유의 예리한 냄새 감각과
    추리력으로 사건 현장을 꼼꼼히 살펴봐요. 조수 브라운과 함께 용의자들을 하나씩 조사하며 사라진 과자의 비밀을 파헤쳐요. 마지막엔 시원한 방귀
    포즈와 함께 진짜 범인을 멋지게 찾아내는 유쾌한 추리 이야기예요.
'9788965463795':
  title: 엘 데포 :슈퍼 파워 에디션
  summary: 청각장애가 있는 소녀 시시는 커다란 보청기를 끼고 새 학교에 다니게 돼요. 보청기 때문에 다른 친구들과 다르다고 느껴 속상해하던
    시시는 보청기 덕분에 오히려 선생님 목소리를 어디서든 들을 수 있다는 걸 알게 돼요. 시시는 이 능력을 슈퍼히어로처럼 여기며 스스로를 엘데포라는
    특별한 존재로 생각하기 시작해요. 자신의 다름을 자랑스럽게 받아들이는 용기를 그린 자전적 이야기예요.
'9788965794080':
  title: 15소년 표류기
  summary: 15명의 소년들을 태운 배가 거센 폭풍우를 만나 무인도에 표류하게 돼요. 어른 없이 남겨진 소년들은 처음엔 혼란스러워하지만 힘을
    합쳐 살아갈 방법을 찾아나가요. 서로 의견이 갈리고 다투기도 하지만 협력하며 섬 생활에 적응해가요. 오랜 노력 끝에 마침내 구조되어 고향으로
    돌아가는 소년들의 용기와 우정을 담은 모험 이야기예요.
'9788993055030':
  title: 윔피 키드
  summary: 중학생이 된 그레그 헤플리가 겪는 좌충우돌 학교생활을 그림일기 형식으로 재미있게 풀어낸 이야기예요. 인기 많은 아이가 되고 싶어
    하지만 자꾸 엉뚱한 실수를 저지르고 형과도 티격태격해요. 친구 로우리와의 우정, 학교에서 생기는 크고 작은 사건들이 유쾌하게 펼쳐져요. 그림과
    짧은 글이 함께 있어서 쉽고 재미있게 읽을 수 있어요.
'9788949152523':
  title: "(과학탐험대) 신기한 스쿨버스"
  summary: 프리즐 선생님과 아이들이 신기한 노란 스쿨버스를 타고 과학 탐험을 떠나는 이야기예요. 버스가 작아지거나 모습을 바꾸면서 우주,
    몸속, 바닷속 같은 곳을 직접 체험하듯 여행해요. 아이들은 여행 중에 여러 가지 과학 지식을 자연스럽게 배우게 돼요. 상상력 넘치는 모험과
    함께 과학이 재미있어지는 책이에요.
'9791171257980':
  title: 그물에 걸린 무지개 물고기
  summary: 바닷속에서 가장 아름다운 반짝이는 비늘을 가진 무지개 물고기 이야기예요. 처음에는 자기 비늘을 자랑하며 다른 물고기들과 나누지
    않아 외톨이가 돼요. 문어 할머니의 조언을 듣고 반짝이는 비늘을 친구들에게 하나씩 나누어 주면서 진짜 행복을 알게 돼요. 나눔과 우정의 소중함을
    알려 주는 따뜻한 그림책이에요.
'9788965793878':
  title: 제인 에어
  summary: 어릴 때 부모를 잃고 외숙모 집과 기숙학교에서 힘든 어린 시절을 보낸 제인 에어의 이야기예요. 씩씩하게 자란 제인은 손필드 저택의
    가정교사가 되어 저택의 주인 로체스터를 만나요. 두 사람은 서로 사랑하게 되지만 로체스터에게는 감춰진 비밀이 있어요. 힘든 상황에서도 자신의
    신념과 자존감을 지켜내는 제인의 모습이 감동을 줘요.
'9788936811853':
  title: "(청소년을 위한) 빅터 프랭클의 죽음의 수용소에서"
  summary: 정신과 의사 빅터 프랭클이 나치 강제 수용소에서 겪은 실제 경험을 담은 책이에요. 가족을 잃고 극한의 고통 속에서도 그는 삶의
    의미를 찾으려는 노력을 멈추지 않았어요. 아무리 힘든 상황에서도 사람은 자신의 태도를 스스로 선택할 자유가 있다는 것을 깨닫게 돼요. 고통
    속에서도 희망과 의미를 찾는 인간의 힘을 보여 주는 이야기예요.
'9780810988217':
  title: Diary of a wimpy kid
  summary: 중학생이 된 그레그 헤플리가 겪는 좌충우돌 학교생활을 그림일기 형식으로 재미있게 풀어낸 영어 원서예요. 인기 많은 아이가 되고
    싶어 하지만 자꾸 엉뚱한 실수를 저지르고 형과도 티격태격해요. 친구 로우리와의 우정, 학교에서 생기는 크고 작은 사건들이 유쾌하게 펼쳐져요.
    그림과 짧은 글이 함께 있어서 쉽고 재미있게 읽을 수 있어요.
'9788936473242':
  title: 소년이 온다 :한강 장편소설
  summary: 1980년 5월 광주에서 일어난 일을 배경으로 한 소설이에요. 친구를 찾으려다 목숨을 잃은 소년 동호와 그 주변 사람들의 이야기가
    여러 인물의 시선으로 펼쳐져요. 힘든 시절 사람들이 겪은 슬픔과 두려움, 그 안에서도 잃지 않은 서로를 향한 마음을 이야기해요. 무겁지만 꼭
    기억해야 할 우리 역사를 다룬 작품이에요.
'9788965794592':
  title: 오페라의 유령
  summary: 파리 오페라 극장 지하에 숨어 사는 정체불명의 남자 팬텀의 이야기예요. 팬텀은 아름다운 목소리를 가진 신인 가수 크리스틴을 몰래
    도와주고 사랑하게 돼요. 얼굴을 가리고 살아가는 팬텀의 비밀과 크리스틴을 둘러싼 이야기가 긴장감 있게 펼쳐져요. 신비롭고 애틋한 사랑 이야기로
    오랫동안 사랑받아 온 고전이에요.
'9788965590064':
  title: 윔피 키드
  summary: 중학생이 된 그레그 헤플리가 겪는 좌충우돌 학교생활을 그림일기 형식으로 재미있게 풀어낸 이야기예요. 인기 많은 아이가 되고 싶어
