  summary: 주인공 김독자는 오랫동안 봐온 인터넷 소설 속 세상이 현실이 되어버린 것을 알게 돼요. 소설의 결말까지 미리 알고 있는 사람은
    김독자뿐이라 그는 이 지식을 이용해 위기를 헤쳐나가야 해요. 소설 속 등장인물들과 함께 갑작스레 닥친 재난 같은 사건들을 헤쳐나가요. 오직
    한 사람만 아는 미래라는 독특한 설정이 흥미진진한 이야기예요.
'9788954427173':
