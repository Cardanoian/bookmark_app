'9791171174287':
  title: 그리스 로마 신화
  summary: 하늘과 바다, 땅을 다스리는 제우스를 비롯한 올림포스의 열두 신 이야기가 펼쳐져요. 헤라클레스의 열두 가지 모험, 트로이 전쟁
    등 그리스 로마 신화 속에서 가장 유명한 신과 영웅들의 이야기를 만날 수 있지요. 신들의 다툼과 화해, 영웅들의 용기와 지혜가 흥미진진하게
    펼쳐진답니다. 서양 문화와 예술의 뿌리가 된 신화 이야기를 쉽고 재미있게 배울 수 있어요.
'9788936442996':
  title: 불량한 자전거 여행 :김남중 장편동화
