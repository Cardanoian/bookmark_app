    위험한 요괴를 물리치려면 한자를 알아야 마법을 쓸 수 있어서, 모험을 하면서 자연스럽게 한자를 배우게 돼요. 손오공과 친구들이 힘을 모아 어려운
    고비를 넘기는 신나는 이야기가 펼쳐진답니다.
