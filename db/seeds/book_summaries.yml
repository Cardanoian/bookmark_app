  summary: 인기 게임 메이플 스토리의 캐릭터들이 등장해 수학 문제를 이용한 사건들을 해결해 나가는 학습만화예요. 마을 곳곳에서 벌어지는 사건
    속에 수학 원리가 숨어 있어, 주인공들은 문제를 풀어야 사건의 실마리를 찾을 수 있습니다. 흥미진진한 모험을 따라가다 보면 자연스럽게 여러
    수학 개념을 익히게 돼요. 게임 캐릭터와 함께 수학을 재미있게 배우고 싶은 어린이들에게 인기 있는 시리즈입니다.
'9791171172696':
  title: 무적 이순신
  summary: 임진왜란이라는 큰 전쟁 속에서 나라를 지켜 낸 이순신 장군의 이야기를 담은 학습만화예요. 이순신 장군은 거북선을 만들고 뛰어난
    전술을 세워 훨씬 많은 수의 왜군 함대를 여러 차례 물리칩니다. 어려운 상황에서도 포기하지 않고 백성과 나라를 지키려 했던 장군의 리더십과
    지혜가 잘 드러나 있어요. 우리 역사 속 대표적인 영웅의 활약을 쉽고 재미있게 만나 볼 수 있는 이야기입니다.
'9791171174744':
  title: 무적 이순신
  summary: 임진왜란이라는 큰 전쟁 속에서 나라를 지켜 낸 이순신 장군의 이야기를 담은 학습만화예요. 이순신 장군은 거북선을 만들고 뛰어난
    전술을 세워 훨씬 많은 수의 왜군 함대를 여러 차례 물리칩니다. 어려운 상황에서도 포기하지 않고 백성과 나라를 지키려 했던 장군의 리더십과
    지혜가 잘 드러나 있어요. 우리 역사 속 대표적인 영웅의 활약을 쉽고 재미있게 만나 볼 수 있는 이야기입니다.
'9791173571299':
  title: 열혈 세종대왕
  summary: 백성을 사랑하는 마음으로 훌륭한 업적을 많이 남긴 세종대왕의 이야기를 담은 학습만화예요. 글을 몰라 어려움을 겪는 백성들을 안타깝게
    여긴 세종대왕은 신하들과 함께 누구나 쉽게 배울 수 있는 글자, 한글을 만들어 냅니다. 이 밖에도 과학 기구를 만들고 여러 제도를 정비하며
    백성을 위한 정치를 펼쳤어요. 백성을 아끼는 마음이 만들어 낸 위대한 업적들을 쉽고 재미있게 만나 볼 수 있는 이야기입니다.
'9791130666303':
  title: '만화 한국 신화 8 : 특급 저승사자 강림'
  summary: 원래 인간 세상의 관리였던 강림이 저승차사가 되어 겪는 이야기를 담은 우리나라 신화예요. 염라대왕을 인간 세상으로 데려오라는 어려운
    임무를 맡게 된 강림은 여러 위기를 슬기롭게 헤쳐 나갑니다. 우여곡절 끝에 임무를 완수한 강림은 그 능력을 인정받아 저승을 오가는 특별한 사자가
    되지요. 우리 전통 신화 속 저승과 죽음에 대한 이야기를 만화로 재미있게 풀어낸 작품입니다.
'9788949195797':
  title: 건방이의 건방진 수련기
  summary: 오랜 세월을 살아온 여우 요괴 건방이는 진짜 사람이 되고 싶어서 인간 세상으로 내려와요. 사람이 되려면 초등학교에 다니며 특별한
    수련을 거쳐야 한다는 것을 알게 되지요. 신비한 여우 요술을 몰래 쓰다가 들킬 뻔하면서 학교에서 좌충우돌 소동이 벌어져요. 당돌하고 자신만만한
    건방이지만 친구들과 부대끼며 조금씩 사람의 마음을 배워가요. 과연 건방이는 무사히 수련을 마치고 진짜 사람이 될 수 있을까요.
'9788949195780':
  title: 건방이의 건방진 수련기
  summary: 오랜 세월을 살아온 여우 요괴 건방이는 진짜 사람이 되고 싶어서 인간 세상으로 내려와요. 사람이 되려면 초등학교에 다니며 특별한
    수련을 거쳐야 한다는 것을 알게 되지요. 신비한 여우 요술을 몰래 쓰다가 들킬 뻔하면서 학교에서 좌충우돌 소동이 벌어져요. 당돌하고 자신만만한
    건방이지만 친구들과 부대끼며 조금씩 사람의 마음을 배워가요. 과연 건방이는 무사히 수련을 마치고 진짜 사람이 될 수 있을까요.
'9788937847004':
  title: 윔피 키드
  summary: 그레그는 막 중학교에 입학한 평범한 소년으로, 엄마의 권유로 하루하루 일기를 쓰기 시작해요. 인기 많은 아이가 되고 싶지만 뜻대로
    되지 않고 크고 작은 실수와 곤란한 일들이 자꾸 벌어져요. 짓궂은 형 로드릭과 엉뚱한 단짝 친구 라울리 때문에도 소동이 끊이지 않지요. 그레그가
    솔직하고 유쾌하게 써 내려간 일기를 보면 학교생활의 좌충우돌이 고스란히 담겨 있어요.
'9791168411975':
  title: 윔피 키드
  summary: 그레그는 막 중학교에 입학한 평범한 소년으로, 엄마의 권유로 하루하루 일기를 쓰기 시작해요. 인기 많은 아이가 되고 싶지만 뜻대로
