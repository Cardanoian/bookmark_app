'9788901161235':
  title: 홍길동전
  summary: 홍길동은 옛날에 양반 아버지와 몸종 어머니 사이에서 태어났어요. 재주가 아주 뛰어났지만, 서자라는 이유로 아버지에게도 '아버지'라
    부르지 못하고 차별을 받았지요. 결국 집을 떠나 의적 활동을 시작하고, 탐욕스러운 관리들을 혼내주며 가난하고 힘없는 백성들을 도와주었어요.
    나중에는 율도국이라는 멋진 나라를 세워 왕이 되어 모든 사람들이 차별 없이 행복하게 살 수 있도록 이끌었답니다.
'9788934905851':
  title: 흔한남매 과학 탐험대
  summary: 이 책은 인기 유튜버 '흔한남매'의 으뜸이와 에이미가 과학을 탐험하는 신나는 이야기예요. 으뜸이와 에이미가 펼치는 좌충우돌 에피소드를
    따라가다 보면 재미있게 과학 원리를 배울 수 있답니다. 우리 주변에서 일어나는 신기한 과학 현상들을 흔한남매와 함께 쉽고 즐겁게 알아볼 수
