    당부와 검소하고 바르게 살라는 가르침이 담겨 있어요. 힘든 상황 속에서도 자식을 향한 아버지의 사랑과 걱정이 곳곳에 묻어나요. 옛 아버지의
    마음을 통해 배움과 삶의 자세를 생각하게 하는 책이에요.
