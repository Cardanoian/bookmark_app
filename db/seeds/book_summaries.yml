  summary: 설민석 선생님과 함께 우리나라 역사 속으로 떠나는 모험 이야기예요. 주인공들은 시간여행을 통해 고조선부터 조선까지 여러 시대의
    역사적 사건과 인물들을 직접 만나요. 위기에 처할 때마다 지혜를 모아 어려움을 헤쳐나가면서 한국사의 중요한 순간들을 몸으로 체험해요. 흥미진진한
    모험을 따라가다 보면 우리 역사를 재미있게 배우게 된답니다.
