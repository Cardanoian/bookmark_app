'9791187777885':
  title: 전사들 :예언의 시작
  summary: 평범한 집고양이 러스티는 우연히 숲속 야생 고양이 무리인 천둥부족을 만나면서 새로운 삶을 시작하게 돼요. 러스티는 파이어포라는
    이름을 받고 정식 전사가 되기 위한 혹독한 훈련을 받으며 사냥법과 부족의 규칙을 배워 나가요. 그러던 중 부족 안에 숨어 있는 배신자와 이웃
    부족과의 갈등 등 여러 위기를 마주하게 돼요. 용기와 지혜로 어려움을 헤쳐 나가며 러스티는 진정한 전사로 성장해 가요. 고양이들의 시선으로
    그려지는 야생의 모험과 우정이 흥미진진한 판타지 시리즈의 첫 이야기예요.
'9780440414803':
  title: Holes
  summary: 스탠리 옐네츠는 억울하게 도둑 누명을 쓰고 그린레이크 캠프라는 소년원 같은 곳으로 보내져요. 그곳에서 아이들은 매일 뙤약볕 아래에서
    이유도 모른 채 깊은 구덩이를 파야 하는 벌을 받아요. 스탠리는 구덩이를 파는 동안 자기 집안에 내려오는 오래된 저주 이야기와 그린레이크에
    숨겨진 보물, 그리고 옛날 이곳에서 있었던 사건의 진실을 하나씩 알아가게 돼요. 친구 제로와 함께 어려움을 헤쳐 나가며 스탠리는 집안의 저주를
    풀고 진실을 밝혀내요. 과거와 현재의 이야기가 절묘하게 얽히며 통쾌한 결말로 이어지는 모험 소설이에요.
'9788949124513':
  title: 나는 윤봉구다 :복제인간 윤봉구 그 이후의 이야기
  summary: 윤봉구는 어느 날 자신이 사실 진짜 윤봉구가 아니라 과학자 할아버지가 만든 복제인간이라는 충격적인 사실을 알게 돼요. 자신의 정체를
    알게 된 뒤에도 봉구는 가족과 친구들 사이에서 예전처럼 평범하게 살아가려 애써요. 이 책은 그 사실을 알게 된 이후 봉구가 자신의 정체성과
    존재의 의미에 대해 고민하며 겪는 이야기를 담고 있어요. 복제인간이라는 특별한 설정을 통해 '나는 누구인가'라는 질문을 아이들 눈높이에서 재미있게
    풀어내요. 가족의 사랑과 자기 자신을 있는 그대로 받아들이는 용기를 생각하게 해 주는 이야기예요.
'9791168342682':
  title: 그릿 =흔들리지 않고 무엇이든 해내는 마음근력 /GRIT
  summary: 이 책은 뛰어난 재능보다 포기하지 않고 끝까지 해내는 마음의 힘, 즉 '그릿'이 성공을 만든다는 것을 설명하는 책이에요. 어려운
    일을 만났을 때 좌절하지 않고 다시 일어서는 마음의 근육을 어떻게 기를 수 있는지 다양한 사례를 통해 알려 줘요. 열정을 가지고 목표를 향해
    꾸준히 노력하는 태도가 왜 중요한지 강조해요. 작은 실패에 흔들리지 않고 나아가는 힘이 결국 큰 성취로 이어진다는 것을 알려 줘요. 끈기와
    노력의 가치를 다시 생각하게 해 주는 책이에요.
'9788936442712':
  title: 기호 3번 안석뽕 :진형민 장편동화
  summary: 초등학교에서 전교 어린이회장 선거가 열리자, 반에서 인기도 없고 눈에 띄지도 않던 안석뽕이 얼떨결에 기호 3번 후보로 나서게 돼요.
    다른 후보들은 화려한 공약과 인기로 앞서가지만, 안석뽕과 친구들은 자기들만의 엉뚱하고 재미있는 방식으로 선거운동을 펼쳐요. 아이들의 선거를
    통해 어른들의 정치와 선거판을 재치 있게 빗대어 보여 주면서도, 진짜 중요한 게 무엇인지 생각하게 만들어요. 인기나 겉모습보다 진심이 통할
    수 있다는 것을 유쾌하게 그려 내요. 웃음 속에 날카로운 메시지를 담은 인기 동화예요.
'9788936443504':
  title: 푸른 사자 와니니 :이현 장편동화
  summary: 와니니는 초원의 사자 무리에서 태어난 어린 암사자인데, 사냥 솜씨가 서툴다는 이유로 무리에서 쫓겨나게 돼요. 홀로 남겨진 와니니는
    무리 없이 살아가는 게 얼마나 위험하고 힘든 일인지 깨달으며 초원에서 여러 위기를 마주해요. 그러다 비슷한 처지의 다른 사자들을 만나 함께
    살아가게 되고, 서로 의지하며 진정한 가족이 되어 가요. 여러 어려움을 겪으면서 와니니는 점점 용감하고 지혜로운 사자로 성장해 나가요. 초원
    동물들의 삶을 통해 진짜 강함이 무엇인지 보여 주는 감동적인 동화예요.
'9791162540640':
  title: 아주 작은 습관의 힘 :최고의 변화는 어떻게 만들어지는가
  summary: 이 책은 아주 작은 습관이 쌓이고 쌓이면 큰 변화를 만든다고 알려줘요. 매일 아주 조금씩만 나아져도 시간이 지나면 놀라운 차이가
    생긴다고 말해요. 좋은 습관을 만들려면 하기 쉽게, 눈에 잘 띄게 만들고 하고 나면 기분 좋게 만들어야 한다고 알려줘요. 반대로 나쁜 습관은
    눈에 안 띄게 하고 하기 어렵게 만들면 줄일 수 있대요. 작은 행동 하나하나가 결국 내가 어떤 사람이 되는지를 결정한다는 걸 배울 수 있는
    책이에요.
'9788949144122':
  title: 배드 가이즈
  summary: 늑대 아저씨는 사납게 생겼지만 사실 친구들과 함께 착한 사람이 되고 싶어 해요. 뱀, 상어, 피라냐 같은 무섭게 생긴 친구들이
    모여 나쁜 녀석 클럽을 만들었다가 착한 일을 해보기로 결심해요. 첫 도전으로 동물 보호소에 갇힌 강아지들을 구해 주려다가 큰 소동이 벌어져요.
    겉모습만 보고 나쁘다고 오해받던 친구들이 진짜 착한 마음을 보여 주려고 좌충우돌하는 이야기예요. 웃기면서도 겉모습보다 마음이 중요하다는 걸
    알려주는 이야기예요.
'9788949144146':
  title: 배드 가이즈
  summary: 늑대 아저씨는 사납게 생겼지만 사실 친구들과 함께 착한 사람이 되고 싶어 해요. 뱀, 상어, 피라냐 같은 무섭게 생긴 친구들이
    모여 나쁜 녀석 클럽을 만들었다가 착한 일을 해보기로 결심해요. 첫 도전으로 동물 보호소에 갇힌 강아지들을 구해 주려다가 큰 소동이 벌어져요.
    겉모습만 보고 나쁘다고 오해받던 친구들이 진짜 착한 마음을 보여 주려고 좌충우돌하는 이야기예요. 웃기면서도 겉모습보다 마음이 중요하다는 걸
    알려주는 이야기예요.
'9788949144139':
  title: 배드 가이즈
  summary: 늑대 아저씨는 사납게 생겼지만 사실 친구들과 함께 착한 사람이 되고 싶어 해요. 뱀, 상어, 피라냐 같은 무섭게 생긴 친구들이
    모여 나쁜 녀석 클럽을 만들었다가 착한 일을 해보기로 결심해요. 첫 도전으로 동물 보호소에 갇힌 강아지들을 구해 주려다가 큰 소동이 벌어져요.
