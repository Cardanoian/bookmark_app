'9791169230148':
  title: "(신비아파트) 한자귀신"
  summary: 신비아파트에 사는 아이들이 이번에는 한자의 힘을 가진 신비한 귀신들과 마주치면서 이야기가 시작돼요. 귀신이 일으키는 오싹한 사건을
    풀어내려면 한자의 뜻과 소리를 잘 알아야만 하지요. 아이들은 무섭지만 짜릿한 모험을 통해 사건의 실마리를 찾아가며 한자를 하나씩 익히게 돼요.
    신비아파트만의 흥미진진한 이야기 속에서 즐겁게 한자 공부를 할 수 있는 만화책이에요.
'9791130656137':
  title: 드래곤 마스터
  summary: 평범한 농부 소년 드레이크는 어느 날 갑자기 왕의 부름을 받아 성으로 가게 돼요. 알고 보니 드레이크에게는 용과 마음을 나눌 수
    있는 특별한 능력이 있어서, 그는 '드래곤 마스터'로 뽑히게 되지요. 드레이크는 자신의 용과 함께 훈련하며 서로를 이해하는 법을 배우고, 다른
    드래곤 마스터 친구들과도 우정을 쌓아가요. 힘을 모아 어려운 문제를 해결해 나가면서 드레이크는 진정한 드래곤 마스터로 성장한답니다.
'9788935652792':
  title: 마법의 설탕 두 조각
  summary: 한 소년은 부모님이 자신의 말을 들어주지 않는다고 화가 나서 집을 뛰쳐나가요. 마법사를 만난 소년은 부모님께 뿌리면 자신이 시키는
    대로만 하게 되는 신기한 마법 설탕을 얻게 되지요. 처음엔 신나서 부모님을 마음대로 조종하지만, 인형처럼 변해 버린 부모님을 보며 점점 무섭고
    외로워져요. 결국 소년은 원래대로 되돌리는 두 번째 설탕을 찾기 위해 다시 길을 떠난답니다.
'9791164385652':
  title: 신비아파트 한자 귀신 5 - 의문의 전학생
  summary: 신비아파트에 낯선 전학생이 나타나면서 아이들 사이에 이상한 일들이 벌어지기 시작해요. 알고 보니 전학생에게는 한자의 힘을 지닌
    신비한 비밀이 숨겨져 있었지요. 하리와 친구들은 수상한 사건의 실마리를 풀기 위해 한자의 뜻을 하나씩 익혀가며 진실에 다가가요. 오싹하면서도
    흥미진진한 이야기를 따라가다 보면 한자 실력도 쑥쑥 늘어난답니다.
'9788964963678':
  title: 오싹오싹 팬티!
  summary: 토끼 재스퍼는 가게에서 반짝반짝 빛나는 신비한 초록색 팬티를 발견하고 마음에 쏙 들어 사 오게 돼요. 그런데 밤이 되자 그 팬티가
    혼자서 빛을 내고 스르르 움직이며 재스퍼를 뒤쫓아 다니기 시작해요. 무서워진 재스퍼는 팬티를 없애려고 땅에 묻고 던지고 별의별 방법을 다 써보지만
    팬티는 자꾸만 되돌아오지요. 결국 재스퍼는 팬티와 친구가 되기로 마음먹으면서 오싹했던 마음이 편안해진답니다.
'9791175483156':
  title: 흔한남매 수수께끼 어드벤처 6
  summary: 티격태격하면서도 서로를 아끼는 흔한 오빠와 흔한 동생이 이번엔 수수께끼가 가득한 신비한 모험 속으로 빠져들어요. 두 남매는 곳곳에
    숨겨진 수수께끼와 퀴즈를 함께 풀어가며 위기를 헤쳐 나가지요. 티격태격 다투다가도 결정적인 순간엔 힘을 합치는 남매의 모습이 웃음을 자아내요.
    흔한남매 특유의 유쾌한 개그와 함께 두뇌를 쓰는 재미를 느낄 수 있는 이야기예요.
