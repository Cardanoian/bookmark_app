  summary: 수영을 좋아하는 초등학생 나루의 이야기예요. 나루는 수영 대회에서 라이벌 친구를 꼭 이기고 싶어 하지만 뜻대로 되지 않아 속상해해요.
    경쟁하는 과정에서 친구와의 우정, 정정당당하게 겨루는 것의 소중함에 대해 고민하게 돼요. 진심을 다해 노력하는 나루의 모습을 통해 스포츠맨십과
    성장의 의미를 느낄 수 있는 이야기랍니다.
'9791189001278':
  title: 설민석의 세계사 대모험
  summary: 설민석 선생님과 함께 세계 역사 속으로 떠나는 모험 이야기예요. 주인공들은 시간을 넘나들며 이집트, 로마, 중국 같은 여러 나라의
    옛날 역사적 사건과 인물들을 직접 만나게 돼요. 위기의 순간마다 지혜를 발휘해 문제를 해결하면서 세계사의 중요한 장면들을 생생하게 체험해요.
    재미있는 모험을 따라가다 보면 어려운 세계사 지식도 저절로 익히게 된답니다.
'9788950980801':
  title: 마법천자문 :손오공의 한자 대탐험
