'9791193031223':
  title: 설민석의 세계사 대모험
  summary: 이 책은 유명한 역사 선생님 설민석이 어린이 친구들을 위해 만든 신나는 세계사 모험 시리즈 중 하나예요. 주인공 온달과 평강이
    램프의 요정 지니와 함께 시간 여행을 떠나 세계 여러 나라의 중요한 역사적 순간들을 직접 경험하게 된답니다. 옛날 이집트의 피라미드를 보고,
    로마의 영웅들을 만나며 흥미진진한 모험을 펼쳐요. 이 책을 읽다 보면 우리 친구들도 마치 역사 탐험가가 된 것처럼 세계의 다양한 문화와 역사를
    쉽고 재미있게 배울 수 있을 거예요.
'9791193031230':
  title: 설민석의 세계사 대모험
  summary: 이 책은 설민석 선생님과 온달, 평강 공주가 시간 여행을 하면서 세계 곳곳의 역사를 배우는 흥미진진한 학습 만화 시리즈예요. 친구들은
    고대 이집트나 로마 제국 등 여러 시대와 나라를 직접 방문하며 중요한 사건들을 만난답니다. 역사 속 위인들이나 문화를 생생하게 겪으면서 어렵게
    느껴질 수 있는 세계사를 쉽고 재미있게 이해할 수 있게 도와줘요. 모험 가득한 이야기를 따라가다 보면 자연스럽게 역사 지식을 쑥쑥 키울 수
    있을 거예요.
'9791193031247':
  title: 설민석의 세계사 대모험
  summary: 설민석 선생님과 태건이, 온달이가 함께 신나는 시간 여행을 떠나는 이야기예요. 이 책은 우리 친구들을 세계 여러 나라의 역사 속으로
    모험을 데려다줄 거예요. 고대 이집트나 로마처럼 아주 옛날 나라들을 직접 방문하며, 그곳에서 있었던 중요한 사건들이나 위대한 인물들을 만날
    수 있답니다. 어려운 역사 이야기도 재미있는 만화와 함께 신나는 모험처럼 즐길 수 있어요. 이 책을 읽다 보면 역사가 얼마나 흥미진진한지 깨닫고,
    마치 내가 직접 역사 속 주인공이 된 것처럼 생생하게 체험할 수 있을 거예요.
'9791193031254':
  title: 설민석의 세계사 대모험
  summary: 이 책은 썰박사와 태건, 로빈이 신기한 램프의 요정 지니와 함께 시간 여행을 떠나는 모험 이야기예요. 아이들은 전 세계 곳곳의
    중요한 역사 속으로 들어가 여러 문명의 흥미진진한 사건들을 직접 겪는 것처럼 배우게 된답니다. 피라미드가 가득한 고대 이집트부터 거대한 로마
    제국까지, 다양한 나라와 시대의 역사를 쉽고 재미있게 만날 수 있어요. 어려운 세계사 지식을 마치 게임처럼 신나게 깨우치면서 역사 박사가 될
    수 있도록 도와주는 책이랍니다.
'9791193031278':
  title: "(설민석의) 그리스 로마 신화 대모험"
  summary: 이 책은 설민석 선생님과 함께 신나는 그리스 로마 신화 속으로 떠나는 대모험 이야기예요. 주인공들이 신들의 세계를 탐험하며 흥미진진한
    신화 속 영웅들과 신들을 만난답니다. 제우스, 헤라, 포세이돈 같은 올림포스 신들의 재미있는 탄생 이야기나 놀라운 능력들을 배울 수 있어요.
    헤라클레스나 페르세우스 같은 용감한 영웅들이 무시무시한 괴물과 싸우는 이야기도 아주 생생하게 펼쳐져요. 어려운 신화 이야기를 어린이 눈높이에
    맞춰 그림과 함께 쉽게 설명해주어 재미있게 읽을 수 있답니다. 신화 속 지혜와 상상력을 키우는 데 도움이 될 거예요.
'9791193031377':
  title: "(설민석의) 그리스 로마 신화 대모험"
  summary: 이 책은 어린이 친구들이 어렵게 느낄 수 있는 그리스 로마 신화를 쉽고 재미있게 알려줘요. 설민석 선생님이 들려주는 이야기와 함께
    멋진 그림과 만화로 신들의 모험을 생생하게 경험할 수 있어요. 제우스, 헤라, 아테나 같은 여러 신들이 어떤 특별한 힘을 가지고 있고 어떤
    재미있는 사건들을 겪는지 알려준답니다. 신화 속에 숨겨진 교훈이나 지혜도 함께 배울 수 있어서 더욱 유익해요. 흥미진진한 신들의 이야기를 따라가다
    보면 어느새 신화 박사가 된 기분이 들 거예요!
'9791193031414':
  title: "(설민석의) 우리 고전 대모험"
  summary: 설민석의 우리 고전 대모험은 설쌤과 친구들이 우리나라의 소중한 옛날이야기 속으로 직접 떠나는 신나는 모험 이야기예요. 이 책은
    '춘향전', '흥부전' 같은 유명한 우리 고전들을 마치 만화 영화를 보는 것처럼 재미있게 알려준답니다. 주인공 친구들은 고전 속 인물들을 만나
    여러 가지 사건들을 해결하고, 그 안에서 중요한 가르침과 지혜를 배워요. 책을 읽으면서 우리 고전이 왜 지금까지도 소중하게 전해지는지, 어떤
    교훈을 담고 있는지 자연스럽게 알 수 있을 거예요. 모험을 통해 우리 조상들의 생각과 멋진 문화를 쉽고 즐겁게 만날 수 있는 특별한 기회가
    될 거예요.
'9791193031421':
  title: "(설민석의) 우리 고전 대모험"
  summary: 이 책은 설민석 선생님이 우리 옛날이야기, 즉 고전을 어린이 눈높이에 맞춰 쉽고 재미있게 알려주는 만화책이에요. 주인공들이 고전
    속으로 들어가 다양한 모험을 겪으면서, 옛이야기의 인물들을 만나고 소중한 지혜와 교훈을 얻게 됩니다. 마치 게임을 하듯이 흥미진진한 이야기를
    따라가다 보면, 어렵게만 느껴졌던 우리 고전이 정말 가깝고 친근하게 느껴질 거예요. 재미있는 그림과 함께 우리 고전의 소중한 가치를 배울 수
    있는 신나는 대모험이 펼쳐집니다.
'9791193031438':
  title: "(설민석의) 우리 고전 대모험"
  summary: "「설민석의 우리 고전 대모험」은 어린이 친구들이 우리나라의 소중한 옛날이야기들을 쉽고 재미있게 만날 수 있도록 돕는 책이에요.
    책 속 친구들이 특별한 모험을 떠나면서, 흥부와 놀부, 심청전처럼 유명한 고전들을 직접 경험하게 된답니다. 각 이야기의 주인공들을 만나 함께
    문제를 해결하고, 숨겨진 지혜와 교훈을 찾아 나서죠. 이 책을 읽으면 우리 고전이 얼마나 멋지고 신나는 이야기인지 깨달으며, 자연스럽게 한국
    문화를 사랑하게 될 거예요. 고전이 어렵다고 생각했던 친구들도 이 책으로 고전과 친해질 수 있을 거예요!"
'9791193031445':
  title: "(설민석의) 우리 고전 대모험"
  summary: 설민석 선생님과 함께 우리나라의 멋진 옛이야기 속으로 신나는 모험을 떠나는 책이에요. 어려운 고전들을 초등학생 친구들이 쉽고 재미있게
    이해할 수 있도록 꾸며져 있어요. 책 속 주인공들이 흥미진진한 사건을 겪으며 고전이 주는 지혜로운 가르침을 깨닫게 된답니다. 생생한 그림과
    함께 옛날이야기가 얼마나 재미있고 소중한지 자연스럽게 배울 수 있어요. 이 책을 읽고 나면 우리 고전과 더욱 친해지고 싶어질 거예요!
'9791193031452':
  title: 설민석의 한국사 대모험
  summary: 이 책은 온달과 평강 공주, 그리고 설쌤이 함께 시간 여행을 하면서 한국사를 배우는 재미있는 만화책이에요. 역사 속 중요한 인물들을
    만나고, 그 시대에 어떤 일들이 있었는지 신나는 모험을 통해 알 수 있습니다. 지루할 틈 없이 웃음 가득한 이야기로 꾸며져 있어서, 마치 게임처럼
    한국사를 즐길 수 있어요. 어렵게만 느껴졌던 역사가 이 책을 읽으면서 저절로 머리에 쏙쏙 들어올 거예요.
'9791193031490':
  title: 설민석의 삼국지 대모험
  summary: 이 책은 옛날 중국에서 유비, 관우, 장비 같은 영웅들이 나타나 혼란스러운 세상을 바로잡으려 애썼던 이야기를 담고 있어요. 힘을
    합친 그들은 멋진 우정을 보여주며 여러 전투를 치르지만, 조조와 손권처럼 다른 영웅들도 나타나 세 나라로 나뉘어 치열하게 싸웠답니다. 지혜로운
    제갈량의 뛰어난 전략과 용감한 장수들의 흥미진진한 모험을 통해 리더십과 충성심을 배울 수 있어요. 설민석 선생님이 아이들 눈높이에 맞춰 복잡한
    삼국지 이야기를 쉽고 재미있는 만화로 들려주어 더욱 즐겁게 읽을 수 있는 책입니다.
'9791193031506':
  title: 설민석의 삼국지 대모험
  summary: 옛날 중국에 위, 촉, 오 세 나라가 서로 싸우던 시대가 있었어요. 유비와 관우, 장비 세 친구는 백성을 구하기 위해 의형제를
    맺고 세상의 혼란을 잠재우려 노력해요. 이 책은 설민석 선생님이 들려주는 삼국지 이야기로, 만화 속으로 들어가 삼국지의 영웅들과 함께 흥미진진한
    모험을 떠나는 내용이에요. 지혜로운 전략과 용감한 싸움을 통해 진정한 영웅의 모습을 배우고, 우정과 의리, 지혜의 가치를 느낄 수 있을 거예요.
'9791193031513':
  title: 설민석의 삼국지 대모험
  summary: 이 책은 유명한 역사 선생님 설민석 선생님이 아이들이 쉽고 재미있게 삼국지를 알 수 있도록 만든 학습 만화예요. 옛날 중국이 혼란스러웠던
    시대에 용감한 영웅들이 나라를 다시 세우기 위해 힘을 모으는 이야기가 펼쳐진답니다. 유비, 관우, 장비 같은 친구들의 우정과 지혜로운 제갈량의
    전략을 만화로 생생하게 만날 수 있어요. 흥미진진한 모험과 치열한 전투를 따라가다 보면 자연스럽게 역사와 지혜를 배우게 될 거예요.
'9791193031520':
  title: 설민석의 삼국지 대모험
  summary: 이 책은 중국의 아주 오래된 이야기인 '삼국지'를 설민석 선생님이 어린이 눈높이에 맞춰 쉽고 재미있게 풀어낸 만화책이에요. 용감한
    유비, 관우, 장비 삼형제가 혼란스러운 세상을 바로잡기 위해 모험을 떠나는 이야기가 펼쳐져요. 똑똑한 제갈량과 힘센 조조 등 개성 넘치는 인물들이
    멋진 전략과 싸움을 보여준답니다. 책을 읽으면서 지혜와 용기, 그리고 친구들과의 소중한 우정에 대해 배울 수 있을 거예요.
'9791193031537':
  title: 설민석의 삼국지 대모험
  summary: 이 책은 중국의 아주 오래된 옛날이야기, 바로 삼국지를 어린이들이 재미있게 읽도록 만든 만화책이에요. 위나라, 촉나라, 오나라
    세 나라가 서로 가장 강한 나라가 되려고 싸우는 흥미진진한 모험이 가득하답니다. 유비, 관우, 장비처럼 멋진 영웅들이 친구들과 함께 용기를
    내고 지혜를 모아 나라를 지키는 이야기가 펼쳐져요. 설민석 선생님이 어려운 역사 이야기를 아이들 눈높이에 맞춰 쉽게 설명해 주어서, 삼국지
    속 멋진 인물들과 사건들을 즐겁게 배울 수 있어요. 이 책을 읽으면 용기, 지혜, 그리고 친구와의 소중한 우정 등 많은 교훈을 얻을 수 있을
    거예요.
'9791193031544':
  title: 설민석의 삼국지 대모험
  summary: 이 책은 옛날 중국의 아주 커다란 나라, 삼국시대 영웅들의 신나는 모험 이야기예요. 유비, 관우, 장비처럼 용감한 친구들과 똑똑한
    제갈량이 힘을 합쳐 세상의 평화를 위해 멋진 활약을 펼쳐요. 설민석 선생님이 아이들이 재미있게 읽도록 만화로 만들어서, 어려웠던 삼국지 이야기가
    쉽고 흥미진진하게 다가올 거예요. 영웅들의 우정과 지혜, 그리고 가슴 뛰는 대결을 따라가다 보면 어느새 역사 속으로 푹 빠져들게 될 거랍니다.
'9791193031551':
  title: 설민석의 삼국지 대모험
  summary: 이 책은 옛날 중국의 아주 커다란 나라였던 '삼국 시대'의 멋진 이야기를 담고 있어요. 설민석 선생님이 아이들이 이해하기 쉽게
    재미있는 모험 이야기로 다시 만들었답니다. 유비, 관우, 장비 같은 용감한 영웅들이 혼란스러운 세상을 바로잡기 위해 힘을 모으는 모습이 그려져요.
    지혜로운 책략과 뜨거운 우정으로 가득한 이 이야기를 읽으며 역사 속 인물들의 흥미진진한 도전을 함께 경험할 수 있을 거예요.
'9791193031568':
  title: 설민석의 삼국지 대모험
  summary: 이 책은 중국의 아주 옛날 삼국 시대 이야기를 설민석 선생님과 함께 쉽고 재미있게 탐험하는 만화책이에요. 용감한 유비, 관우,
    장비 삼형제를 비롯해 멋진 제갈량과 조조, 손권 등 많은 영웅들이 등장한답니다. 서로 힘을 합치고 지혜를 겨루며 나라를 세우기 위해 펼치는
    흥미진진한 모험들을 만날 수 있어요. 어린이 친구들이 어렵게 느낄 수 있는 삼국지 이야기를 즐거운 만화로 술술 읽을 수 있게 도와줄 거예요.
    이 책을 읽다 보면 역사 속 영웅들의 지혜와 용기를 배우게 될 거예요!
'9791193031612':
  title: "(설민석의) 그리스 로마 신화 대모험"
  summary: 이 책은 설민석 선생님이 어린이들을 위해 쉽게 쓴 그리스 로마 신화 이야기예요. 평범한 어린이 주인공들이 신화 속 세계로 모험을
    떠나며 올림포스 신들과 영웅들을 만나는 내용이지요. 제우스, 헤라, 포세이돈 같은 신들의 재미있는 탄생 이야기나 헤라클레스처럼 용감한 영웅들의
    모험을 생생하게 보여줘요. 만화 같은 그림과 신나는 이야기 덕분에 어려운 신화도 마치 게임처럼 쉽게 이해할 수 있답니다. 어린이들이 그리스
    로마 신화를 쉽고 재미있게 배우고 상상력을 키울 수 있도록 도와주는 책이에요.
'9791193031636':
  title: 설민석의 한국사 대모험
  summary: 설민석의 한국사 대모험은 시간 여행을 떠나는 평강 공주와 온달이, 그리고 설민석 선생님이 함께 우리나라의 멋진 역사 속으로 모험을
    떠나는 이야기예요. 이 책을 읽으면 고조선부터 조선 시대까지 다양한 역사적인 인물과 사건들을 만날 수 있답니다. 마치 만화 영화를 보듯이 재미있게
    역사를 배울 수 있어서, 어려운 내용도 쉽게 이해할 수 있어요. 책장을 넘길 때마다 어떤 새로운 모험이 펼쳐질지 기대될 거예요. 이 책을 통해
    우리 역사를 더욱 가깝고 흥미롭게 느껴 보세요!
'9791193031667':
  title: "(설민석의) 그리스 로마 신화 대모험"
  summary: 이 책은 설민석 선생님과 함께 신비로운 그리스 로마 신화 속으로 떠나는 대모험 이야기예요. 하늘의 신 제우스, 지혜의 여신 아테나,
    영웅 헤라클레스 등 많은 신과 영웅들을 만날 수 있어요. 신들이 힘을 겨루고, 흥미진진한 사건들을 겪으며 세상을 만들어가는 과정을 배우게 됩니다.
    설민석 선생님이 쉽고 재미있게 신화 이야기를 풀어주어 아이들도 어렵지 않게 읽을 수 있어요. 이 책을 읽으면 신화 속 지혜와 재미있는 상상의
    세계에 푹 빠져들 거예요.
'9791193031681':
  title: 설민석의 한국사 대모험
  summary: 이 책은 설민석 선생님과 함께 시간 여행을 떠나는 역사 만화예요. 주인공 온달과 평강 공주, 그리고 귀여운 로빈이 우리나라의 중요한
    역사 속으로 모험을 떠나요. 과거의 위인들을 직접 만나고, 흥미진진한 사건들을 겪으면서 한국사를 쉽고 재미있게 배워요. 다양한 인물과 시대적
    배경을 통해 우리 역사의 흐름을 자연스럽게 알 수 있게 도와준답니다. 어렵게 느껴질 수 있는 한국사를 마치 게임처럼 즐기면서 깨달을 수 있게
    해주는 특별한 책이에요.
'9791193031704':
  title: "(설민석의) 우리 고전 대모험"
  summary: 이 책은 어린이 친구들이 설민석 선생님과 함께 우리나라의 멋진 옛이야기, 즉 고전을 탐험하는 신나는 모험 이야기예요. 주인공들이
    시간 여행을 떠나 흥부전, 심청전 같은 우리 고전 속으로 직접 들어가 등장인물들을 만나고 사건들을 겪게 된답니다. 재미있는 그림과 함께 모험을
    따라가다 보면 어렵게만 느껴졌던 고전들이 저절로 이해되고 우리 조상들의 지혜와 삶을 엿볼 수 있어요. 초등학생 친구들이 우리 고전을 쉽고 즐겁게
    만날 수 있도록 도와주는 책이랍니다.
'9791193031711':
  title: "(설민석의) 그리스 로마 신화 대모험"
  summary: 이 책은 설민석 선생님과 함께 신비로운 그리스 로마 신화 속으로 떠나는 대모험 이야기예요. 주인공들이 신화 속 영웅들과 신들을
    만나며 멋진 모험을 펼치죠. 제우스, 헤라, 아테나 같은 신들과 용감한 헤라클레스 같은 영웅들의 흥미진진한 이야기를 재미있게 들려줘요. 신들의
    멋진 능력과 영웅들의 용기를 배우고, 우리가 알지 못했던 신화 속 숨겨진 지혜도 함께 찾아볼 수 있답니다. 마치 게임처럼 흥미롭게 신화의 세계를
    탐험하며 즐겁게 역사를 배울 수 있어요.
'9791193031742':
  title: 설민석의 한국사 대모험
  summary: 이 책은 설민석 선생님과 함께 시간 여행을 떠나 한국사를 배우는 신나는 학습 만화예요. 주인공인 온달이와 평강이는 설쌤을 따라
    과거의 여러 시대로 돌아가 역사 속 인물들을 직접 만나고 사건들을 겪어요. 흥미진진한 모험을 하면서 우리나라의 중요한 역사를 쉽고 재미있게
    알게 된답니다. 재미있는 그림과 이야기 덕분에 지루하지 않게 역사 지식을 쏙쏙 배울 수 있어요. 과거의 인물들이 겪었던 일을 보며 지혜를 얻고
    현재를 이해하는 데 도움을 주는 책이에요.
'9791193031803':
  title: 설민석의 세계사 대모험
  summary: "「설민석의 세계사 대모험」은 설민석 선생님과 함께 용감한 태건이, 세봉이가 세계 역사를 탐험하는 신나는 이야기예요. 이 책은
    시간 여행을 하면서 고대 문명부터 근현대까지 중요한 역사적 사건들을 직접 경험하는 것처럼 보여줍니다. 이집트 피라미드의 비밀이나 프랑스 혁명의
    현장처럼, 마치 그 시대에 와 있는 듯 생생하게 역사를 배울 수 있어요. 재미있는 만화와 흥미진진한 모험 덕분에 복잡한 세계사도 쉽고 재미있게
    이해할 수 있답니다. 책을 읽다 보면 자연스럽게 역사 지식이 쑥쑥 자라서 세계사 박사가 될 수 있을 거예요."
'9791193031810':
  title: 설민석의 세계사 대모험
  summary: 이 책은 역사 선생님 설쌤과 함께 신나는 세계 역사 여행을 떠나는 이야기예요. 주인공들은 시간 여행을 하면서 고대 이집트, 로마
    제국, 또는 중국 등 세계 여러 나라의 중요한 역사적 순간들을 직접 체험하게 된답니다. 모험을 통해 어려운 역사적 사건들과 인물들을 만나고,
    마치 게임처럼 흥미진진하게 역사를 배울 수 있어요. 어린이들이 역사를 쉽고 재미있게 배우고, 세계를 이해하는 넓은 시야를 가질 수 있도록 도와줄
    거예요.
'9791193031902':
  title: 설민석의 세계사 대모험
  summary: 이 책은 주인공들이 시간 여행을 하면서 세계 여러 나라의 역사와 문화를 배우는 흥미진진한 모험 이야기예요. 마치 게임처럼 재미있는
    사건들을 겪으면서, 왜 이런 일들이 일어났고 어떤 사람들이 중요했는지 쉽게 알려줘요. 딱딱한 역사책이 아니라 신나는 만화와 이야기로 되어 있어서,
    어린이 친구들도 재미있게 읽다 보면 세계 역사를 저절로 알게 될 거예요. 어렵게만 느껴지던 세계사를 모험을 통해 즐겁게 배울 수 있도록 도와주는
    아주 특별한 책이랍니다.
'9791193031919':
  title: 설민석의 세계사 대모험
  summary: 이 책은 설민석 선생님과 함께 시간 여행을 하면서 세계 역사를 배우는 신나는 모험 이야기예요. 주인공 태건이와 세봉이가 설쌤과
    함께 과거의 역사 속으로 떠나 여러 나라와 시대의 중요한 사건들을 직접 겪게 된답니다. 고대 문명부터 근현대사까지, 다양한 역사적 인물들을
    만나 그들의 이야기를 생생하게 들을 수 있어요. 흥미진진한 만화로 되어 있어서 마치 게임을 하듯이 재미있게 세계사를 공부할 수 있습니다. 어렵게
    느껴질 수 있는 세계사를 쉽고 즐겁게 이해하도록 도와주는 멋진 역사 대모험 책이랍니다.
'9791193031940':
  title: "(설민석의) 그리스 로마 신화 대모험"
  summary: 이 책은 신나는 모험 이야기를 통해 아이들이 그리스 로마 신화를 쉽고 재미있게 만날 수 있도록 도와줘요. 제우스, 헤라 같은 신들과
    헤라클레스처럼 용감한 영웅들의 이야기가 가득 담겨 있어요. 신비로운 괴물들과 흥미진진한 사건들을 따라가며 아이들은 상상의 세계에 푹 빠질 거예요.
    책을 읽으면서 옛날 사람들의 지혜와 용기를 배우고, 서양 문화의 기초도 자연스럽게 익힐 수 있답니다. 마치 신화 속으로 직접 떠나는 대모험
    같아서 책장이 술술 넘어갈 거예요.
'9791193031957':
  title: "(설민석의) 우리 고전 대모험"
  summary: 설민석 선생님과 함께 우리나라의 멋진 옛날이야기들을 신나게 탐험하는 책이에요. 주인공들이 고전 속 세상으로 직접 들어가 여러 인물들을
    만나고, 재미있는 사건들을 겪으며 신나는 모험을 떠나요. 이 책을 통해 어렵게 느껴질 수 있는 우리 고전들을 마치 게임처럼 흥미진진하게 배울
    수 있답니다. 친구들은 고전 속에서 지혜와 교훈을 얻고, 이야기를 읽는 재미에 푹 빠질 거예요. 초등학생 눈높이에 맞춰 우리 고전의 가치를
    쉽고 재미있게 알려주는 유익한 책이랍니다.
'9791193207895':
  title: 우정 챌린지
  summary: 지우와 소미는 서로 다른 친구들과 친해지기 위해 '우정 챌린지'라는 특별한 미션을 시작해요. 이 챌린지는 친구들에게 먼저 다가가고,
    함께 즐거운 활동을 하며 우정을 쌓는 모험이랍니다. 처음에는 낯설고 어색하기도 했지만, 둘은 챌린지를 통해 새로운 친구들을 만나고 서로를 더
    이해하게 돼요. 과연 지우와 소미는 모든 우정 챌린지를 성공적으로 마칠 수 있을까요? 이 책은 진정한 우정의 의미와 친구를 소중히 여기는 마음을
    가르쳐주는 따뜻한 이야기예요.
'9791193487068':
  title: 채사장의 지대넓얕 :지적 대화를 위한 넓고 얕은 지식
  summary: 이 책은 우리 주변의 세상 이야기를 쉽고 재미있게 알려주는 특별한 책이에요. 복잡하게만 느껴지는 역사, 경제, 정치 같은 어려운
    내용들을 친절하게 설명해주죠. 어른들이 여러 가지 지식을 넓게 배우고, 세상을 더 깊이 이해할 수 있도록 도와준답니다. 마치 처음 배우는 친구에게
    이야기하듯 친근한 말로 쓰여 있어요. 이 책을 읽으면 세상을 보는 눈이 넓어지고, 궁금한 점이 많아질 거예요.
'9791193487082':
  title: 미스터리 보건실 냥쌤
  summary: 별난 아이들이 모인 학교에 아주 특별한 보건실이 있어요. 이 보건실에는 고양이 모습을 한 '냥쌤'이 간호사 선생님으로 계시죠.
    냥쌤은 아이들이 몸이 아프다고 찾아오면, 실제로는 마음속 고민이나 걱정을 마법처럼 알아차려요. 그리고 따뜻하고 신비로운 방법으로 아이들의 마음을
    보듬어주고 문제를 해결할 수 있도록 도와줘요. 냥쌤 덕분에 아이들은 몸도 마음도 건강해지고, 친구들과도 더 사이좋게 지내게 된답니다. 학교생활의
    크고 작은 어려움을 겪는 아이들에게 냥쌤은 최고의 비밀 친구 같은 존재예요.
'9791193487211':
  title: 채사장의 지대넓얕 :지적 대화를 위한 넓고 얕은 지식
  summary: 이 책은 채사장 아저씨가 쓴, 똑똑한 대화를 위한 여러 지식들을 알려주는 책이에요. 세상에는 역사, 경제, 정치, 철학 등 아주
    많은 분야가 있는데, 이 책은 그 모든 것을 어렵지 않게 설명해 줘요. 마치 넓은 운동장을 구경하듯이 다양한 지식들을 살짝 맛볼 수 있게 해주죠.
    너무 깊이 들어가지 않고 넓게 둘러보면서 세상을 이해하는 눈을 키울 수 있도록 도와준답니다. 이 책을 읽으면 친구들과 이야기할 때 좀 더 풍부하고
    재미있는 대화를 나눌 수 있는 배경 지식을 얻게 될 거예요.
'9791193487259':
  title: '채사장의 지대넓얕 14 : 예술의 역사 - 지적 대화를 위한 넓고 얕은 지식'
  summary: 이 책은 아주 옛날 동굴 벽화부터 지금 우리가 보는 현대 미술까지, 사람들이 만든 멋진 예술 작품들의 흥미진진한 역사를 알려줘요.
    왜 시대마다 다른 모양의 예술이 생겨났는지, 어떤 유명한 예술가들이 어떻게 특별한 작품을 만들었는지 쉽고 재미있게 배울 수 있어요. 그림,
    조각, 건축 등 다양한 예술 분야를 만나면서 예술이 그 시대 사람들의 생각과 생활을 어떻게 보여주는지 이해하게 될 거예요. 딱딱한 미술사 책이
    아니라, 예술을 통해 세상을 더 넓게 보고 깊이 생각하는 힘을 길러주는 아주 특별한 책이랍니다.
'9791193914519':
  title: 마이 가디언
  summary: 평범하게 살고 싶었던 주인공 시아는 어느 날 자신이 악령을 봉인하는 '가디언'의 후예라는 사실을 알게 됩니다. 봉인되었던 악령
    '사미'가 풀려나자, 시아는 자신의 가디언 '블랙'을 만나게 되지요. 사실 블랙은 시아가 봉인했던 사미의 일부로, 시아를 지키며 함께 사미와
    싸워야 하는 운명입니다. 시아는 가디언으로서 숨겨진 힘을 깨닫고 친구들과 함께 악령들로부터 세상을 구하기 위해 모험을 떠나게 됩니다. 이 이야기는
    평범한 소녀가 자신의 운명을 받아들이고 성장하는 흥미진진한 모험 이야기입니다.
'9791193914717':
  title: 시간 고양이
  summary: 주인공 아이가 밤늦게까지 숙제를 하다 지쳐 잠이 들려는 순간, 신비한 고양이 한 마리가 나타나요. 이 고양이의 이름은 바로 '시간'이랍니다.
    시간 고양이는 아이가 숙제를 미루고 시간을 제대로 쓰지 못해 힘들어하는 모습을 보고 도와주기로 해요. 고양이는 아이에게 시간을 소중히 사용하고
    하루를 알차게 보내는 방법을 재미있게 알려준답니다. 이 책은 우리 친구들이 시간을 아끼고 잘 활용하는 것의 중요성을 깨닫게 해주는 따뜻한 이야기예요.
'9791193914953':
  title: 마이 가디언
  summary: 강준이라는 평범한 초등학생이 우연히 '가디언'이라는 특별한 존재를 만나게 돼요. 이 가디언은 원래 강준을 도와주는 수호신 같은
    존재인데, 강준은 갑자기 생긴 이 가디언 때문에 신비로운 일들에 휘말리게 된답니다. 가디언과 함께 특별한 능력을 배우고, 위험한 상황들을 헤쳐나가면서
    진짜 우정이 무엇인지 깨닫게 돼요. 과연 강준과 가디언은 무사히 임무를 완수하고 평범한 일상으로 돌아갈 수 있을까요?
'9791193914984':
  title: 전학생
  summary: 어느 날, 민준이네 반에 낯선 전학생 지우가 나타나요. 지우는 다른 친구들과 어울리는 것을 어려워하고, 아이들은 지우의 특별한
    모습에 호기심을 느끼면서도 조금은 불편해합니다. 하지만 시간이 지나면서 민준이와 친구들은 지우의 진심을 알게 되고, 서로의 다름을 이해하며
    소중한 우정을 쌓아가요. 이 책은 새로운 친구를 받아들이고 함께 성장하는 과정을 따뜻하게 그려낸답니다.
'9791193939222':
  title: 마법의 푸드 트럭
  summary: 우주라는 이름의 한 소년은 학교생활과 공부 때문에 힘들어했어요. 그러던 어느 날, 우주는 특별한 마법 푸드 트럭을 만나게 됩니다.
    이 푸드 트럭은 우주의 기분에 따라 신기하고 맛있는 음식을 만들어 주었어요. 마법의 음식 덕분에 우주는 어려운 일들을 하나씩 해결하며 스스로
    성장하는 법을 배우게 됩니다. 이 책은 어린이들이 용기를 내어 자신의 고민을 극복하고 자존감을 키우는 과정을 따뜻하게 보여주는 이야기예요.
'9791194293705':
  title: 말하고 싶은 비밀
  summary: 이 책은 세 친구 '나', 아루, 루루가 자신들만의 비밀 클럽을 만들면서 시작돼요. 이 클럽의 가장 중요한 규칙은 서로의 비밀을
    소중히 나누고 지켜주는 것이죠. 주인공 '나'는 누구에게도 말하지 못한 짝사랑 비밀을 가지고 있고, 아루와 루루도 각자 마음에 품고 있던 비밀들을
    털어놓아요. 친구들은 비밀을 나누면서 서로를 더 깊이 이해하게 되고, 혼자서는 털어놓기 힘들었던 고민들을 함께 나누며 용기를 얻게 됩니다.
    서로의 비밀을 지켜주면서 우정을 키우고 마음을 키워가는 따뜻한 성장 이야기랍니다.
'9791194330592':
  title: 흔한남매 과학 탐험대
  summary: 흔한남매의 에이미와 으뜸이가 신나는 과학 탐험대로 변신했어요. 일상생활 속에서 궁금했던 다양한 과학 현상들을 직접 경험하고 배워
    나가지요. 때로는 엉뚱한 상상력으로, 때로는 진지한 실험으로 과학 원리를 쉽고 재미있게 알려준답니다. 만화와 함께 호기심을 자극하는 실험 활동과
    퀴즈 등으로 과학이 훨씬 즐거워질 거예요. 에이미와 으뜸이의 좌충우돌 탐험을 따라가다 보면 어느새 과학 박사님이 되어 있을 거예요!
'9791194616016':
  title: 설민석의 한국사 대모험
  summary: 이 책은 온달과 평강 공주가 시간 여행을 하면서 우리나라 역사의 중요한 순간들을 직접 체험하는 이야기예요. 설민석 선생님이 친구들과
    함께 역사 속 인물들을 만나고 재미있는 사건들을 겪으면서 우리 역사를 쉽고 신나게 알려주죠. 마치 만화 영화를 보는 것처럼 흥미진진하게 한국사를
    배우고, 옛날 사람들의 지혜와 용기도 엿볼 수 있어요. 이 책을 읽다 보면 어렵게만 느껴졌던 한국사가 여러분의 가장 친한 친구처럼 느껴질 거예요.
'9791194616023':
  title: 설민석의 한국사 대모험
  summary: 이 책은 온달과 평강 공주가 시간 여행을 떠나 한국사의 중요한 순간들을 직접 체험하는 흥미진진한 모험 이야기예요. 아이들은 주인공들과
    함께 고구려, 조선 시대로 가서 다양한 역사 인물들을 만나고 그들의 삶과 지혜를 배울 수 있어요. 마치 게임을 하듯이 재미있는 만화와 쉬운
    설명 덕분에 어려운 한국사도 금방 머리에 쏙쏙 들어올 거예요. 책을 읽다 보면 자연스럽게 역사적 사실은 물론, 그때 살았던 사람들의 마음까지
    이해하게 된답니다. 역사가 지루하게 느껴졌던 친구들도 이 책과 함께라면 한국사 박사가 될 수 있을 거예요.
'9791194616030':
  title: 설민석의 한국사 대모험
  summary: 이 책은 설쌤과 친구들이 시간 여행을 떠나 우리나라 역사를 재미있게 배우는 역사 만화예요. 온달과 평강 공주 같은 주인공들이 과거로
    모험을 하면서 각 시대의 중요한 인물들을 직접 만나요. 조선 시대의 왕부터 독립운동가들까지, 다양한 역사적 순간들을 생생하게 경험할 수 있답니다.
    마치 게임을 하듯 흥미진진한 이야기 속에서 자연스럽게 역사 지식을 얻게 될 거예요. 어려운 역사도 쉽고 재미있게 공부하고 싶은 친구들에게 딱
    맞는 신나는 한국사 대모험이 펼쳐져요.
'9791194616047':
  title: 설민석의 한국사 대모험
  summary: 이 책은 설민석 선생님이 아이들이 한국사를 재미있게 배울 수 있도록 만든 역사 만화책이에요. 주인공 온달, 평강 공주, 그리고
    로빈 같은 친구들이 시간을 넘나들며 과거의 역사 속으로 대모험을 떠나요. 친구들은 중요한 역사적 사건의 현장에 직접 가보고, 옛날 위인들을
    만나 다양한 이야기를 듣는답니다. 책을 읽다 보면 우리 조상들의 지혜와 그 시대의 생활 모습을 자연스럽게 알게 돼요. 지루하게 외우는 역사가
    아니라, 신나는 모험을 통해 우리나라 역사를 쉽고 재미있게 배우는 소중한 기회가 될 거예요.
'9791194616054':
  title: "(설민석의) 그리스 로마 신화 대모험"
  summary: 이 책은 설민석 선생님이 들려주는 재미있는 그리스 로마 신화 이야기예요. 주인공들이 흥미진진한 모험을 떠나면서 제우스, 헤라,
    포세이돈 같은 신들을 만나요. 신들의 재미있는 이야기와 영웅들의 멋진 활약을 쉽고 신나게 배울 수 있답니다. 만화처럼 그려져 있어서 아이들이
    지루할 틈 없이 신화를 접하고 상상의 나래를 펼칠 수 있게 도와줘요. 고대 그리스 로마 신화를 통해 지혜와 교훈도 얻을 수 있는 유익한 책이랍니다.
'9791194616276':
  title: "(설민석의) 그리스 로마 신화 대모험"
  summary: 이 책은 설민석 선생님이 들려주는 신나는 그리스 로마 신화 이야기예요. 토리라는 친구와 함께 제우스, 헤라 같은 멋진 신들과 헤라클레스
    같은 용감한 영웅들의 모험을 따라가게 된답니다. 재미있는 만화와 쉬운 설명으로 신화 속 흥미진진한 사건들을 하나씩 알아갈 수 있어요. 신들의
    세계를 탐험하며 놀라운 상상의 세계를 만나고, 지혜와 교훈도 얻을 수 있는 책이랍니다.
'9791194636212':
  title: 과자 사면 과학 드립니다
  summary: 이 책은 우리가 즐겨 먹는 맛있는 과자 속에 숨어있는 신기한 과학 원리를 알려주는 책이에요. 젤리, 감자칩, 초콜릿, 라면 등
    다양한 과자를 통해 기체의 성질, 밀도, 화학 반응 같은 여러 과학 지식을 쉽고 재미있게 배울 수 있어요. 딱딱한 과학 이론 대신 과자를 직접
    보고 맛보면서 자연스럽게 과학의 원리를 깨닫게 된답니다. 과자를 먹을 때마다 '이 속에 이런 과학이!' 하며 깜짝 놀라게 될 거예요. 덕분에
    과학이 우리 생활과 아주 가깝고 즐거운 과목이라는 것을 알 수 있게 해줘요.
'9791195794799':
  title: 설민석의 한국사 대모험
  summary: "『설민석의 한국사 대모험』은 시간 여행을 하는 주인공 온달과 평강 공주, 그리고 설민석 선생님이 함께 신나는 한국사 속으로 떠나는
    이야기예요. 이 책은 역사 속 중요한 인물들을 만나고, 흥미로운 사건들을 직접 겪으면서 우리 역사를 쉽고 재미있게 알려줘요. 만화 형식이라
    딱딱하지 않고, 마치 모험을 떠나는 것처럼 즐겁게 역사를 배울 수 있답니다. 친구들과 함께 웃고 감동하면서 자연스럽게 한국사에 대한 지식을
    쌓을 수 있을 거예요."
'9791196025809':
  title: 설민석의 한국사 대모험
  summary: 이 책은 설민석 선생님과 친구들이 신비한 시간 여행을 떠나 우리나라의 흥미진진한 역사를 배우는 모험 이야기예요. 친구들은 과거의
    중요한 순간으로 돌아가 여러 위인들을 만나고, 재미있는 사건들을 직접 겪게 된답니다. 어린이들은 온달이와 평강이의 눈을 통해 선사시대부터 조선시대,
    근현대사에 이르기까지 다양한 역사의 장면들을 생생하게 체험할 수 있어요. 지루하게만 느껴졌던 한국사가 흥미진진한 모험으로 바뀌어, 읽는 내내
    역사의 재미에 푹 빠져들게 될 거예요.
'9791196025847':
  title: 설민석의 한국사 대모험
  summary: 평강공주와 온달이 신나는 시간 여행을 떠나면서 우리나라 역사의 중요한 순간들을 만나고, 여러 위인들을 직접 만나는 모험 이야기예요.
    이 책은 한국사 선생님 설민석 아저씨가 아이들이 쉽고 재미있게 역사를 배울 수 있도록 만든 역사 학습 만화랍니다. 과거로 떠나는 흥미진진한
    모험을 통해 어려운 역사 지식이 머리에 쏙쏙 들어오고, 역사가 더 이상 어렵지 않게 느껴질 거예요. 우리 조상들의 지혜와 용기를 배우면서 역사에
    대한 호기심을 키울 수 있답니다.
'9791196025861':
  title: 설민석의 한국사 대모험
  summary: 이 책은 설민석 선생님이 들려주는 재미있는 한국사 이야기예요. 주인공 온달과 평강 공주가 시간 여행을 떠나면서, 우리 역사의 중요한
    순간들을 직접 경험하고 위인들을 만나요. 매 권마다 흥미진진한 사건들을 해결하며 자연스럽게 한국사를 배울 수 있도록 도와준답니다. 만화 형식이라
    어렵게 느껴질 수 있는 역사도 쉽고 재미있게 읽을 수 있어요. 이 책을 통해 우리 역사에 대한 깊이 있는 지식과 교훈을 얻을 수 있을 거예요.
'9791196232160':
  title: 설민석의 한국사 대모험
  summary: 이 책은 유명한 역사 선생님 설민석과 함께 시간 여행을 떠나는 역사 만화 시리즈예요. 주인공인 '온달'과 '평강' 공주가 과거의
    여러 시대로 가서 신나는 모험을 한답니다. 친구들은 온달과 평강을 따라가면서 우리 역사의 중요한 사건들이나 멋진 위인들을 직접 만나는 것처럼
    생생하게 배울 수 있어요. 복잡하고 어렵게 느껴질 수 있는 한국사를 재미있는 이야기와 그림으로 쉽게 이해할 수 있게 도와줘요. 이 책을 읽으면서
    우리 역사가 얼마나 자랑스럽고 소중한지 느끼고, 옛날 사람들의 지혜도 배울 수 있을 거예요.
'9791196893118':
  title: 설민석의 세계사 대모험
  summary: 설민석 선생님과 함께 시간 여행을 떠나는 흥미진진한 세계사 모험 이야기예요. 주인공들은 시간의 문을 통해 과거로 가서 다양한 나라와
    시대를 직접 경험하게 됩니다. 고대 이집트의 피라미드를 탐험하고, 로마 제국의 용감한 전사들을 만나고, 중세 유럽의 기사들을 만나는 등 신나는
    일들이 가득해요. 위험에 빠진 역사를 바로잡고 미션을 해결하며, 재미있는 그림과 이야기로 세계사를 쉽고 재미있게 배울 수 있는 책이랍니다.
    이 책을 읽으면 마치 내가 주인공이 된 것처럼 세계 역사의 현장을 누빌 수 있을 거예요.
'9791196893132':
  title: 설민석의 세계사 대모험
  summary: 이 책은 설민석 선생님이 들려주는 재미있는 세계사 이야기예요. 주인공 태건이와 아름이가 신비한 모험을 떠나면서 여러 나라와 역사를
    배워요. 이집트 미라, 로마 검투사, 프랑스 혁명 등 흥미진진한 역사 속으로 쏙 들어가 볼 수 있답니다. 어려운 세계사도 만화와 그림으로 쉽게
    이해하고, 마치 그 시대에 있는 것 같은 기분을 느낄 수 있을 거예요. 지루할 틈 없이 재미있게 세계 역사를 탐험하며 똑똑해지는 기회가 될
    거예요.
'9791196893170':
  title: 설민석의 세계사 대모험
  summary: "『설민석의 세계사 대모험』은 설쌤과 친구들이 신나는 시간 여행을 떠나 세계 역사를 탐험하는 만화책 시리즈예요. 이 책에서 친구들은
    고대 이집트, 로마, 중국 등 다양한 시대로 모험을 떠나 특별한 경험을 한답니다. 그곳에서 클레오파트라, 카이사르 같은 유명한 역사 인물들을
