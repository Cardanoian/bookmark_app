  summary: 평범한 농부 소년 드레이크는 갑자기 왕의 성으로 불려가 드래곤 마스터로 선택돼요. 드레이크는 땅의 힘을 가진 드래곤 웜과 짝을
    이루게 되고 서로 마음을 나누는 법을 배워가요. 다른 드래곤 마스터들과 함께 훈련하며 우정을 쌓고 왕국을 지키는 임무를 맡게 돼요. 소년과
