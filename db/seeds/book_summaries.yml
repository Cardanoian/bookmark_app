    손에 땀을 쥐게 하는 모험담도 만날 수 있어요. 신비하고 흥미진진한 그리스 로마 신화 속 이야기들을 쉽고 재미있게 읽을 수 있답니다.
'9791193031575':
  title: 설민석의 삼국지 대모험
  summary: 중국의 유명한 고전 삼국지를 바탕으로 한 역사 모험 이야기예요. 유비, 관우, 장비가 의형제를 맺고 조조, 손권 같은 영웅들과
    힘을 겨루는 삼국 시대 이야기를 만나게 돼요. 주인공들은 시간을 넘나들며 삼국지 속 사건들을 직접 체험하면서 지혜와 우정의 의미를 배워요.
    손에 땀을 쥐는 전투와 영웅들의 이야기를 재미있게 즐길 수 있답니다.
'9791162335123':
  title: "(추리 천재) 엉덩이 탐정"
  summary: 머리가 엉덩이처럼 생긴 신사 탐정이 어려운 사건을 척척 해결하는 추리 이야기예요. 탐정은 냄새를 맡으면서 단서를 찾고, 침착하고
    예의 바른 태도로 사건의 진실을 밝혀내요. 조수 브라운과 함께 다니며 마을에서 일어나는 이상한 사건들을 하나씩 풀어나가요. 마지막에 범인을
    밝혀낼 때마다 시원하고 재미있는 반전이 기다리고 있답니다.
'9791164064243':
  title: "(이상한 과자 가게) 전천당"
  summary: 이상한 과자 가게 전천당에는 베니코 할머니가 있어요. 손님이 가게에 들어오면 할머니는 그 사람에게 꼭 필요한 신기한 과자를 딱
    하나 골라줘요. 과자를 먹으면 소원이 이루어지지만, 설명서에 적힌 규칙을 지키지 않으면 무서운 일이 벌어지고 말아요. 손님마다 다른 사연과
    소원, 그리고 과자의 신비한 힘이 펼쳐지는 이야기랍니다.
