'9788936456788':
  title: 아몬드 :손원평 장편소설
  summary: 윤재는 태어날 때부터 편도체 크기가 작아서 다른 사람들처럼 감정을 잘 느끼지 못하는 특별한 몸을 가지고 있어요. 할머니와 엄마는
    윤재가 감정을 배우고 표현할 수 있도록 정성껏 도와주지만, 윤재의 생일날 벌어진 끔찍한 사건으로 할머니는 돌아가시고 엄마는 의식을 잃고 말아요.
    홀로 남겨진 윤재는 학교에서 폭력적이고 거친 성격의 곤이라는 아이를 만나게 되고, 서로 다른 두 사람은 점점 특별한 관계를 맺어 가요. 감정을
    잘 느끼지 못하는 윤재가 곤이와의 만남을 통해 진짜 감정과 마음을 알아가는 과정이 감동적으로 그려져요. 공감과 이해가 무엇인지 깊이 생각하게
    해 주는 성장 소설이에요.
