    이야기와 현실이 뒤섞이는 독특한 설정으로 큰 인기를 얻은 작품이에요.
'9788934967378':
  title: 전지적 독자 시점 =part 1 /Omniscient reader's viewpoint
  summary: 평범한 회사원 김독자가 자신만 끝까지 읽었던 소설 속 세상이 현실이 되면서 벌어지는 이야기예요. 소설의 미래 내용을 알고 있는
    독자는 이 지식을 이용해 무너져 가는 세상에서 살아남으려 해요. 소설 속 주인공이었던 유중혁과 함께 예측할 수 없는 재난과 사건들을 헤쳐 나가요.
    이야기와 현실이 뒤섞이는 독특한 설정으로 큰 인기를 얻은 작품이에요.
'9788965480525':
  title: 초한지
  summary: 진나라가 무너진 뒤 천하를 두고 다툰 항우와 유방의 이야기를 담은 중국 고전이에요. 힘이 세고 용맹한 항우와 지혜롭게 사람들의
    마음을 얻은 유방이 치열하게 경쟁해요. 홍문의 만남, 해하 전투 같은 유명한 사건들을 통해 두 영웅의 서로 다른 리더십을 보여줘요. 결국 유방이
    한나라를 세우게 되는 과정을 흥미진진하게 그린 역사 이야기예요.
'9788949135021':
  title: 내 친구 스누피
  summary: 찰리 브라운과 그의 강아지 스누피, 친구들이 벌이는 짧고 유쾌한 일상 이야기예요. 스누피는 상상력이 풍부해서 혼자 비행기 조종사가
    되는 상상을 하기도 하고 엉뚱한 행동을 많이 해요. 친구 라이너스, 루시 등과 함께 학교와 동네에서 소소한 사건들을 겪어요. 짧은 만화 형식이라
    가볍게 웃으며 읽을 수 있는 책이에요.
'9788957363072':
  title: "(만화로 보는)그리스 로마 신화"
  summary: 제우스를 비롯한 올림포스 신들의 탄생과 인간 세상에 벌어진 여러 신화 이야기를 만화로 풀어낸 책이에요. 헤라클레스의 모험, 트로이
    전쟁 같은 유명한 신화 속 사건들이 담겨 있어요. 신들의 사랑과 다툼, 영웅들의 용기와 시련이 흥미진진하게 펼쳐져요. 서양 문화와 예술의 뿌리가
    되는 그리스 로마 신화를 쉽고 재미있게 만날 수 있어요.
'9788965793465':
  title: 어린 왕자
  summary: 작은 별에서 온 어린 왕자가 사막에 불시착한 비행사를 만나면서 이야기가 시작돼요. 어린 왕자는 자기 별에 두고 온 장미꽃을 그리워하며
    여러 별을 여행한 이야기를 들려줘요. 여행하며 만난 이상한 어른들을 통해 진짜 소중한 것이 무엇인지 생각하게 해요. 눈에 보이지 않는 것의
    소중함을 일깨워 주는 마음 따뜻한 이야기예요.
'9788994749631':
  title: "(명탐정) 셜록 홈즈"
  summary: 런던의 명탐정 셜록 홈즈와 그의 친구 왓슨이 어려운 사건들을 해결해 나가는 이야기예요. 홈즈는 작은 단서만으로도 날카로운 관찰력과
    추리력으로 범인을 찾아내요. 다양한 미스터리 사건들을 통해 홈즈의 뛰어난 추리 과정을 함께 따라갈 수 있어요. 탐정 이야기의 원조라 불리는
    세계적인 고전이에요.
'9788965795155':
  title: 여자의 일생
  summary: 순수하고 꿈 많았던 소녀 잔이 결혼 후 겪는 인생의 굴곡을 그린 이야기예요. 믿었던 남편에게 실망하고 아들에게 모든 사랑을 쏟지만
    뜻대로 되지 않아 힘든 나날을 보내요. 행복을 꿈꿨던 한 여인의 삶이 현실 앞에서 흔들리는 모습을 담담하게 보여줘요. 인생의 기쁨과 슬픔을
    함께 생각해 보게 하는 프랑스 고전 소설이에요.
'9788950936006':
  title: 마법천자문 1 - 불어라! 바람 풍風
  summary: 초등학생 준일이가 마법 세계로 빨려 들어가 한자의 힘을 배우게 되는 이야기예요. 손오공을 비롯한 서유기 속 인물들을 만나 한자
    마법을 쓰며 함께 모험을 떠나요. 위기의 순간마다 배운 한자를 외쳐 주문처럼 사용하면서 문제를 해결해 나가요. 신나는 모험을 따라가다 보면
    한자를 저절로 익히게 되는 책이에요.
'9788949135106':
  title: 왕자와 드레스메이커
  summary: 세바스티안 왕자는 사실 드레스를 입고 '레이디 크리스탈리아'로 변신하는 걸 좋아해요. 재봉사 프랜시스는 왕자의 비밀을 지키며 근사한
    드레스를 만들어 주는 단짝이 돼요. 왕자는 자신의 모습을 세상에 드러낼지 숨길지 고민하며 진짜 자신을 찾아가요. 있는 그대로의 나를 인정하고
    사랑하는 용기를 이야기하는 그래픽노블이에요.
'9788965480495':
  title: 초한지
  summary: 진나라가 무너진 뒤 천하를 두고 다툰 항우와 유방의 이야기를 담은 중국 고전이에요. 힘이 세고 용맹한 항우와 지혜롭게 사람들의
    마음을 얻은 유방이 치열하게 경쟁해요. 홍문의 만남, 해하 전투 같은 유명한 사건들을 통해 두 영웅의 서로 다른 리더십을 보여줘요. 결국 유방이
    한나라를 세우게 되는 과정을 흥미진진하게 그린 역사 이야기예요.
'9781442402973':
  title: Creepy carrots!
  summary: 재스퍼라는 토끼가 즐겨 먹던 당근들이 자신을 쫓아온다는 무서운 상상에 시달리는 이야기예요. 어디를 가도 당근이 보이는 것 같아
    재스퍼는 점점 겁을 먹고 당근을 피해 다녀요. 결국 재스퍼는 당근밭 주변에 울타리를 쳐서 다시는 당근이 보이지 않게 만들어요. 유머러스한 그림과
    반전이 있는 결말이 재미있는 그림책이에요.
'9788965793229':
  title: 명탐정 셜록 홈스
  summary: 런던의 명탐정 셜록 홈즈와 친구 왓슨이 어려운 사건을 해결해 나가는 이야기예요. 홈즈는 작은 단서 하나로도 날카로운 관찰력과 추리력을
    발휘해 범인을 찾아내요. 미스터리한 사건들을 함께 따라가며 홈즈의 뛰어난 추리 과정을 즐길 수 있어요. 탐정소설의 원조로 불리는 세계적인 고전
    이야기예요.
'9788958287650':
  title: 가방 들어 주는 아이 :고정욱 창작동화
  summary: 다리가 불편해 목발을 짚는 영택이와 같은 반이 된 석이의 이야기예요. 선생님의 부탁으로 석이는 영택이의 가방을 들어 주는 일을
    맡게 되지만 처음엔 귀찮고 싫어요. 함께 시간을 보내면서 석이는 영택이를 이해하고 진짜 친구가 되어 가요. 장애를 가진 친구와 마음을 나누는
    우정의 소중함을 알려 주는 이야기예요.
'9788965794370':
  title: 미녀와 야수
  summary: 아버지 대신 야수의 성에 남게 된 벨이라는 소녀의 이야기예요. 처음엔 무섭게만 보였던 야수와 지내면서 벨은 그의 따뜻한 마음을
    알게 돼요. 진심으로 야수를 사랑하게 된 벨의 마음이 마법을 풀어 야수는 다시 왕자로 돌아가요. 겉모습보다 마음이 중요하다는 것을 알려 주는
    사랑스러운 고전 동화예요.
'9791160575316':
  title: 엽기 과학자 프래니
  summary: 괴짜 과학자를 꿈꾸는 소녀 프래니가 학교에서 벌어지는 사건들을 과학 실험으로 해결하는 이야기예요. 프래니는 남들과 다르게 기발하고
    엽기적인 발명품을 만드는 것을 좋아해요. 친구들과 잘 어울리고 싶어 하면서도 자신만의 개성을 포기하지 않으려 애써요. 상상력 넘치는 과학 실험과
    유쾌한 사건들이 가득한 이야기예요.
'9788949140865':
  title: 어린 왕자
  summary: 작은 별에서 온 어린 왕자가 사막에 불시착한 비행사를 만나면서 이야기가 시작돼요. 어린 왕자는 자기 별에 두고 온 장미꽃을 그리워하며
    여러 별을 여행한 이야기를 들려줘요. 여행하며 만난 이상한 어른들을 통해 진짜 소중한 것이 무엇인지 생각하게 해요. 눈에 보이지 않는 것의
    소중함을 일깨워 주는 마음 따뜻한 이야기예요.
'9788965590262':
  title: 윔피 키드
  summary: 중학생이 된 그레그 헤플리가 겪는 좌충우돌 학교생활을 그림일기 형식으로 재미있게 풀어낸 이야기예요. 인기 많은 아이가 되고 싶어
    하지만 자꾸 엉뚱한 실수를 저지르고 형과도 티격태격해요. 친구 로우리와의 우정, 학교에서 생기는 크고 작은 사건들이 유쾌하게 펼쳐져요. 그림과
    짧은 글이 함께 있어서 쉽고 재미있게 읽을 수 있어요.
'9791133440078':
  title: 초속 5센티미터
  summary: 어릴 적 단짝이었던 타카키와 아카리가 서로 다른 곳으로 전학을 가며 멀어지는 이야기예요. 눈 내리는 밤 먼 길을 달려 재회한 두
    사람이지만 성장하며 점점 마음의 거리도 멀어져요. 시간이 흐르고 어른이 된 타카키는 여전히 그 시절의 마음을 잊지 못해요. 벚꽃이 떨어지는
    속도인 초속 5센티미터에 빗대어 첫사랑의 아련함을 그린 이야기예요.
'9788983925435':
  title: 해리포터 :불사조 기사단
  summary: 마법사 세상에서 볼드모트의 부활을 아무도 믿어 주지 않아 힘들어하는 해리의 다섯 번째 이야기예요. 새로운 어둠의 마법 방어법 선생님은
    오히려 학생들을 억압하며 진실을 감추려 해요. 해리는 친구들과 몰래 '덤블도어의 군대'를 만들어 스스로 마법을 익혀 나가요. 볼드모트에 맞서는
    저항의 시작과 큰 희생이 담긴 긴장감 넘치는 이야기예요.
'9788983925480':
  title: 해리포터 :혼혈 왕자
  summary: 덤블도어 교수가 해리에게 볼드모트의 과거를 하나씩 알려 주며 그의 약점을 찾아가는 이야기예요. 해리는 우연히 얻은 낡은 마법약
    교과서의 주인 '혼혈 왕자'의 정체가 궁금해져요. 한편 말포이는 볼드모트의 명령으로 위험한 임무를 몰래 수행하고 있어요. 믿었던 사람의 배신과
    큰 희생으로 마무리되는 충격적인 이야기예요.
'9788925577340':
  title: 오싹오싹 당근!
  summary: 재스퍼라는 토끼가 즐겨 먹던 당근들이 자신을 쫓아온다는 무서운 상상에 시달리는 이야기예요. 어디를 가도 당근이 보이는 것 같아
    재스퍼는 점점 겁을 먹고 당근을 피해 다녀요. 결국 재스퍼는 당근밭 주변에 울타리를 쳐서 다시는 당근이 보이지 않게 만들어요. 유머러스한 그림과
    반전이 있는 결말이 재미있는 그림책이에요.
'9791185564074':
  title: 달 샤베트
  summary: 더운 여름밤 하늘의 달이 녹아내리기 시작하는 이야기예요. 잠이 안 오던 여자아이가 녹아내리는 달을 발견하고 냉장고에 넣어 얼려요.
    달을 다시 하늘로 돌려보내기 위해 동네 사람들과 함께 달 조각을 나눠 먹으며 달 샤베트를 만들어요. 상상력 가득한 이야기와 아름다운 그림이
    어우러진 백희나 작가의 그림책이에요.
'9788961706797':
  title: 도그맨
  summary: 경찰관과 경찰견이 폭탄 사고를 당해 머리와 몸이 하나로 합쳐지면서 도그맨이 탄생하는 이야기예요. 개의 머리와 사람의 몸을 가진
    도그맨은 특유의 엉뚱함으로 사고를 치기도 하지만 정의롭게 마을을 지켜요. 나쁜 고양이 피티를 비롯한 악당들과 맞서 싸우며 좌충우돌 활약을 펼쳐요.
    만화와 글이 어우러져 유쾌하게 읽을 수 있는 인기 시리즈예요.
'9788925562599':
  title: 아르테미스 :앤디 위어 장편소설
  summary: 달 표면에 건설된 유일한 도시 아르테미스에 사는 밀수업자 재즈 바샤라의 이야기예요. 돈을 벌기 위해 위험한 범죄에 손을 댔다가
    예상치 못한 큰 음모에 휘말리게 돼요. 재즈는 특유의 재치와 기술을 발휘해 도시를 위협하는 위기를 해결하려고 애써요. 과학적 상상력과 스릴
    넘치는 사건이 어우러진 SF 소설이에요.
'9788990794659':
  title: "(최고의 이야기꾼) 구니 버드"
  summary: 2학년 교실에 갑자기 전학 온 구니 버드 그린은 특이한 옷차림과 당당한 태도로 아이들의 눈길을 사로잡아요. 구니 버드는 자신에게
    있었던 놀랍고도 믿기 힘든 일들을 '완전히 사실'이라며 친구들에게 들려줘요. 다이아몬드를 가지고 택시를 타고 온 이야기 등 기상천외한 이야기들이
    하나씩 펼쳐져요. 이야기 속 진실이 무엇인지 알아가는 재미가 있는 유쾌한 책이에요.
'9788949121154':
  title: 'Love that dog : 아주 특별한 시 수업'
  summary: 시를 쓰기 싫어하던 남자아이 잭이 선생님의 시 수업을 통해 조금씩 마음을 여는 이야기예요. 잭은 처음엔 짧고 퉁명스러운 글을 쓰다가
    점점 자신의 진짜 감정을 시로 표현하게 돼요. 사실 잭에게는 사고로 떠나보낸 소중한 반려견 이야기라는 슬픈 사연이 숨어 있었어요. 짧은 시로
    이루어진 특별한 형식으로 마음을 울리는 감동적인 이야기예요.
'9788949170930':
  title: 겁 없는 허수아비의 모험
  summary: 번개를 맞고 갑자기 생각과 마음을 갖게 된 허수아비의 이야기예요. 허수아비는 가난한 고아 소년 잭을 하인으로 삼아 함께 세상을
    여행해요. 순진하고 착한 허수아비는 자신의 땅을 빼앗으려는 나쁜 사람들 때문에 여러 위기를 겪어요. 엉뚱하지만 따뜻한 마음을 가진 허수아비의
    좌충우돌 모험이 유쾌하게 펼쳐져요.
'9788972914525':
  title: 그림으로 보는 거의 모든 것의 역사
  summary: 우주의 탄생부터 지구와 생명, 인류의 역사까지 세상 모든 것을 알기 쉽게 설명해 주는 책이에요. 빅뱅으로 우주가 시작된 순간부터
    공룡, 진화, 과학자들의 발견까지 폭넓게 다루고 있어요. 뉴턴, 다윈 같은 과학자들이 어떻게 세상의 비밀을 밝혀냈는지도 재미있게 소개해요.
    어려운 과학 이야기를 그림과 함께 쉽고 흥미롭게 풀어낸 책이에요.
'9788954604109':
  title: 김구
  summary: 김구는 우리나라가 일본의 식민지였던 시절, 나라의 독립을 위해 평생을 바친 독립운동가예요. 어릴 때부터 정의감이 강했던 김구는
    나라를 되찾기 위해 여러 어려움을 이겨내며 상하이로 건너가 대한민국 임시정부를 이끌었어요. 오랜 세월 타국을 떠돌며 고생했지만 결코 독립에
    대한 희망을 포기하지 않았어요. 마침내 광복을 맞이했지만 김구는 우리나라가 둘로 나뉘는 것을 막기 위해 끝까지 애쓰다가 안타깝게 세상을 떠났어요.
    자신의 모든 것을 나라를 위해 바친 김구 선생님의 뜨거운 마음을 느낄 수 있는 책이에요.
'9788961701082':
  title: 꼬마 명탐정 네이트
  summary: 네이트는 스스로 최고의 탐정이라고 자신하는 똑똑한 소년이에요. 팬케이크를 좋아하고 강아지 슬러지와 함께 다니면서 동네에서 일어나는
    사건들을 해결해요. 친구들이 소중한 물건을 잃어버리면 네이트를 찾아와 도움을 청하지요. 네이트는 차근차근 단서를 모으고 논리적으로 추리해서
    결국 사라진 물건을 찾아내요. 씩씩하고 재치있는 추리 과정이 읽는 내내 흥미진진해요.
'9788958284826':
  title: 꽃할머니
  summary: 꽃할머니는 어린 시절 일본군에게 끌려가 힘든 시간을 보낸 할머니의 실제 이야기를 그린 그림책이에요. 할머니는 전쟁 중에 낯선 곳으로
    끌려가 말할 수 없이 아프고 슬픈 일을 겪었어요. 오랜 세월이 지나서야 할머니는 용기를 내어 자신의 이야기를 세상에 들려주었어요. 이 책은
    전쟁의 아픔과 평화의 소중함을 어린이들에게 진심으로 전해줘요. 다시는 이런 슬픈 역사가 되풀이되지 않기를 바라는 마음이 담겨 있어요.
'9788984886063':
  title: 꿈꾸는 레모네이드 클럽
  summary: 트레이시와 마릴린은 수학을 좋아하는 단짝 친구예요. 그런데 마릴린이 백혈병에 걸렸다는 사실을 알게 되면서 반 친구들 모두가 슬픔에
    빠져요. 아이들은 힘든 상황에서도 희망을 잃지 않기 위해 레몬으로 레모네이드를 만들 듯 어려움을 이겨내자는 레모네이드 클럽을 만들어요. 친구들은
    마릴린을 응원하며 함께 아픔을 나누고 우정을 키워가요. 힘든 순간에도 서로를 믿고 도우면 이겨낼 수 있다는 따뜻한 메시지를 전해줘요.
'9788956635743':
  title: 나는 죽음이에요
  summary: 이 책에서는 죽음이 스스로 자신을 소개하며 이야기를 들려줘요. 죽음은 무섭고 어두운 존재가 아니라 살아있는 모든 것들의 곁에 늘
    함께 있는 자연스러운 친구라고 말해요. 사람이나 동물, 식물 모두 언젠가는 죽음을 만나게 되고 그것은 삶의 자연스러운 한 부분이라는 것을 차분하게
    설명해줘요. 이 책은 죽음을 두려운 것으로만 여기지 않고 삶과 자연스럽게 이어진 것으로 바라보게 도와줘요. 어린이들이 죽음에 대해 편안하게
    생각해 볼 수 있도록 도와주는 따뜻한 그림책이에요.
'9788987175744':
  title: 나무를 심은 사람
  summary: 양치기 노인 엘제아르 부피에는 황폐한 프랑스의 산골에서 홀로 나무를 심기 시작해요. 아무도 시키지 않았지만 그는 날마다 도토리를
    골라 정성껏 땅에 심었어요. 오랜 세월이 흐르자 메마르고 삭막했던 땅이 울창한 숲으로 변했고 마을에는 다시 물이 흐르고 사람들이 돌아와 살게
    되었어요. 한 사람의 묵묵한 정성이 세상을 얼마나 아름답게 바꿀 수 있는지 보여주는 감동적인 이야기예요. 프랑스 작가 장 지오노가 쓴 세계적으로
    사랑받는 명작이에요.
'9788993912135':
  title: 나쁜책
  summary: 평화롭게 지내던 숲속 마을에 갑자기 낯선 책 한 권이 나타나요. 이 책에는 다른 동물을 미워하고 차별해야 한다는 위험한 생각들이
    가득 담겨 있어요. 그 책을 읽은 여우는 점점 다른 동물들을, 특히 토끼들을 미워하고 못살게 굴기 시작해요. 나쁜 생각은 마을 전체로 퍼져나가
    결국 큰 다툼과 슬픔을 불러오고 말아요. 편견과 차별이 얼마나 위험한지, 그리고 우리가 무엇을 조심해야 하는지를 생각하게 해주는 묵직한 그림책이에요.
'9788992026420':
  title: 날고양이들
  summary: 어느 날 도시의 뒷골목에서 태어난 새끼 고양이들에게 신기하게도 날개가 돋아나요. 고양이 엄마는 위험한 도시에서 벗어나 자유롭게
    날 수 있는 이 아이들이 더 안전한 곳으로 떠나기를 바라요. 날개 달린 고양이 남매는 하늘을 날아 도시를 벗어나 넓은 시골로 모험을 떠나요.
    낯선 곳에서 여러 위기를 만나지만 서로 힘을 합쳐 이겨내고 자신들만의 보금자리를 찾아가요. 어슐러 K. 르귄이 쓴 상상력 넘치고 따뜻한 판타지
    동화예요.
'9788961550291':
  title: 다비드를 사랑한 미켈란젤로. 1-2
  summary: 미켈란젤로는 르네상스 시대 이탈리아를 대표하는 위대한 조각가이자 화가예요. 피렌체의 한 채석장에는 다른 조각가들이 다루기 어렵다며
    포기한 커다란 대리석 덩어리가 오랫동안 버려져 있었어요. 미켈란젤로는 그 돌덩어리 속에 숨어 있는 아름다운 형상을 알아보고 몇 년에 걸쳐 정성껏
    조각해 나갔어요. 마침내 완성된 것이 바로 늠름하고 아름다운 청년의 모습을 한 조각상 다비드예요. 돌 속에 숨은 아름다움을 찾아낸 미켈란젤로의
    열정과 예술혼을 느낄 수 있는 이야기예요.
'9788984313866':
  title: '다윈 : 세상을 뒤흔든 놀라운 발견'
  summary: 찰스 다윈은 어릴 때부터 자연을 관찰하고 곤충이나 식물을 모으는 것을 좋아하던 소년이었어요. 청년이 된 다윈은 비글호를 타고 세계를
    항해하며 여러 나라의 낯선 동식물들을 관찰할 기회를 얻었어요. 특히 갈라파고스 제도에서 섬마다 조금씩 다른 새들의 모습을 보고 생물이 환경에
    맞게 서서히 변화한다는 생각을 하게 되었어요. 오랜 연구 끝에 다윈은 생물이 살아남기 위해 조금씩 변화하며 진화한다는 자연선택설을 세상에 발표했어요.
    세상을 바라보는 눈을 완전히 바꾼 위대한 과학자 다윈의 이야기예요.
'9788934956334':
  title: 대한민국 임시 정부와 김구
  summary: 일본에게 나라를 빼앗긴 후, 많은 독립운동가들이 나라 밖에서 독립운동을 이어가기 위해 상하이에 대한민국 임시 정부를 세웠어요.
    김구는 이 임시 정부에서 중요한 역할을 맡아 독립운동을 이끌었고 어려운 살림 속에서도 굳은 의지로 활동을 계속했어요. 일본의 감시와 위협을
    피해 정부를 여러 차례 옮겨 다니면서도 독립에 대한 꿈을 포기하지 않았어요. 마침내 광복을 맞이하기까지 임시 정부와 김구가 걸어온 힘들고 감동적인
    여정을 보여주는 책이에요. 나라를 사랑하는 마음이 얼마나 값진 것인지 깨닫게 해줘요.
'9788958282471':
  title: 도착
  summary: 이 책은 글자가 하나도 없이 그림만으로 이야기를 전하는 특별한 그림책이에요. 한 남자가 가족을 남겨두고 낯설고 이상한 나라로 홀로
    이민을 떠나요. 그곳에서는 모든 것이 처음 보는 이상한 모습이라 말도 음식도 생활 방식도 낯설기만 해요. 남자는 그곳에서 자신처럼 새로운 곳에
    온 사람들을 만나 서로 도움을 주고받으며 차츰 적응해 나가요. 이민자가 낯선 땅에서 느끼는 두려움과 희망을 그림만으로도 깊이 있게 느낄 수
    있는 작품이에요.
'9788992185127':
  title: 레오나르도 다 빈치
  summary: 레오나르도 다빈치는 이탈리아 르네상스 시대를 대표하는 화가이자 발명가예요. 어릴 때부터 그림 그리기와 관찰하기를 좋아했고 사람의
    몸과 자연의 움직임을 꼼꼼히 연구했어요. 모나리자와 최후의 만찬 같은 명화를 남겼을 뿐만 아니라 하늘을 나는 기계, 물속을 다니는 배 같은
    놀라운 발명품도 설계했어요. 화가이면서 과학자이자 발명가였던 다빈치의 남다른 호기심과 열정을 만날 수 있는 책이에요. 어린이들에게 상상력과
    탐구심의 소중함을 일깨워 줘요.
'9788992089456':
  title: '레오나르도 다 빈치 : 르네상스의 상징'
  summary: 레오나르도 다빈치는 15세기 이탈리아 피렌체에서 태어나 르네상스 시대를 대표하는 예술가로 자랐어요. 그는 그림 실력뿐 아니라 해부학,
    건축, 기계 설계에 이르기까지 다양한 분야에 호기심을 가지고 연구했어요. 모나리자처럼 오늘날까지 사랑받는 명작들을 남겼고 노트에는 상상 속
    발명품에 대한 스케치를 가득 채웠어요. 이 책은 다빈치가 살았던 르네상스 시대의 모습과 함께 그의 다재다능한 삶을 보여줘요. 예술과 과학을
    넘나든 천재의 발자취를 따라가 볼 수 있어요.
'9788990794994':
  title: 루이 브라이, 점자로 세상을 열다
  summary: 루이 브라이는 어릴 때 아버지의 가죽 공방에서 놀다가 사고로 두 눈을 다쳐 앞을 볼 수 없게 되었어요. 앞이 보이지 않아도 루이는
    배우고 싶은 마음이 커서 시각장애인 학교에 들어가 열심히 공부했어요. 그러던 중 군인들이 어둠 속에서도 손으로 더듬어 읽을 수 있는 신호법에서
    아이디어를 얻어 손끝으로 읽을 수 있는 점자를 만들었어요. 루이가 만든 점자 덕분에 전 세계의 시각장애인들이 책을 읽고 글을 쓸 수 있게 되었어요.
    어려움을 딛고 세상을 바꾼 감동적인 실화예요.
'9788957981856':
  title: '마사코의 질문 : 손연자 동화집'
  summary: 이 책은 일제강점기를 배경으로 한 짧은 이야기들을 담은 동화집이에요. 표제작에서는 어릴 적 친했던 한국인 친구를 잊지 못하는 일본인
    소녀 마사코가 어른이 되어서야 그 시절의 아픈 진실을 알게 돼요. 이 책에 실린 이야기들은 일본군 위안부, 강제 징용 등 우리 민족이 겪은
    아픈 역사를 어린이의 눈높이에서 진솔하게 들려줘요. 힘들었던 시절을 살아간 사람들의 마음을 함께 느끼며 역사의 소중함을 배울 수 있어요. 읽고
    나면 마음이 뭉클해지는 감동적인 작품이에요.
'9788936441524':
  title: '별볼일 없는 4학년 : 주디 블룸 장편동화'
  summary: 피터 헤처는 학교에서는 평범한 4학년 남자아이인데 집에만 오면 골칫덩이 남동생 퍼지 때문에 하루도 조용할 날이 없어요. 퍼지는
    떼를 쓰고 말썽을 부리는데도 부모님은 어리다는 이유로 자꾸 봐주기만 해서 피터는 억울해요. 어느 날 퍼지가 피터가 애지중지 키우던 애완 거북이를
    통째로 꿀꺽 삼켜버리는 큰 사고까지 일으켜요. 피터는 동생 때문에 벌어지는 온갖 소동 속에서 형 노릇하기가 얼마나 힘든지 깨달아요. 유쾌하고
    웃음이 끊이지 않는 주디 블룸의 인기 시리즈예요.
'9788955822991':
  title: 밍로는 어떻게 산을 옮겼을까?
  summary: 밍로와 그의 아내는 커다란 산 바로 아래에 살고 있는데 산에서 굴러 떨어지는 돌 때문에 늘 걱정이 많아요. 밍로는 마을의 지혜로운
    노인을 찾아가 산을 저 멀리로 옮길 수 있는 방법을 알려달라고 부탁해요. 노인은 나무 주위에서 춤을 추거나 이상한 도구를 두드리는 등 신기한
    의식을 시켜요. 밍로는 노인이 시키는 대로 정성껏 따라 하다가 마지막에는 세간을 짊어지고 뒷걸음질로 산에서 멀어지게 돼요. 결국 밍로 부부는
    산에서 멀리 떨어진 곳으로 이사를 하게 되면서 마치 산이 움직인 것처럼 느끼게 되는 재치 있는 옛이야기예요.
'9788994077642':
  title: 보이지 않는 아이
  summary: 브라이언은 교실에서 있는 듯 없는 듯 아무도 신경 써주지 않는 아이예요. 친구들이 놀이를 할 때도 짝을 지을 때도 브라이언은 늘
    빠지기 일쑤라 마음속으로 점점 투명 인간이 된 것 같은 기분을 느껴요. 그러던 어느 날 전학 온 친구 저스틴에게 먼저 다정하게 말을 걸어주면서
    둘은 친구가 돼요. 작은 관심과 친절이 외로웠던 브라이언의 마음을 따뜻하게 채워줘요. 누군가에게 건네는 작은 배려가 얼마나 큰 힘이 되는지
    보여주는 이야기예요.
'9788943307653':
  title: 복 타러 간 총각
  summary: 가난한 총각은 자기가 왜 이렇게 복이 없는지 알아보려고 먼 길을 떠나 복을 나눠 준다는 신령님을 찾아가기로 해요. 길을 가다가
    저마다 사연 있는 이들을 만나 그들의 소원도 함께 물어봐 주기로 약속해요. 마침내 신령님을 만난 총각은 자신의 복뿐만 아니라 길에서 만난 이들의
    사연도 빠짐없이 전해요. 돌아오는 길에 총각은 그 답들을 하나씩 전해주며 다른 이들의 소원도 이뤄지게 도와줘요. 결국 총각도 남을 돕는 착한
    마음 덕분에 자기 복도 함께 찾게 되는 훈훈한 우리 옛이야기예요.
'9788901142135':
  title: 사람은 무엇으로 사는가 외
  summary: 가난한 구두수선공 세묜은 어느 추운 겨울날 벌거벗은 채 쓰러져 있는 낯선 남자를 만나 집으로 데려와요. 사실 그 남자는 하느님의
    뜻을 어겨 벌을 받고 인간 세상으로 내려온 천사였어요. 천사는 세묜의 집에서 지내며 구두 만드는 일을 도와주는데 세 번의 신비한 순간마다 조용히
    미소를 지어요. 시간이 흐르며 천사는 사람의 마음속에는 무엇이 있는지, 사람에게 주어지지 않은 것은 무엇인지, 사람은 무엇으로 사는지라는 세
    가지 진리를 깨닫게 돼요. 결국 사람은 서로를 향한 사랑으로 살아간다는 따뜻한 깨달음을 전해주는 톨스토이의 명작이에요.
'9788992026635':
  title: 산과 달이 만나는 곳
  summary: 밍리는 열매 없는 산 아래 가난한 마을에 사는 소녀예요. 어느 날 밍리는 가족의 가난한 살림을 바꾸고 싶어서 말하는 금붕어의 이야기를
    듣고 달나라 노인을 찾아 먼 여행을 떠나요. 여행 중에 날지 못하는 용을 만나 친구가 되고 여러 신비한 사람들을 만나며 옛이야기 같은 모험을
    함께 겪어요. 밍리는 여행을 통해 진짜 행복은 재물이 아니라 가족과 함께하는 마음에 있다는 것을 깨달아요. 중국 전래동화의 느낌을 살린 그레이스
    린의 아름답고 감동적인 판타지 동화예요.
'9788992684132':
  title: 새를 사랑한 산
  summary: 저 멀리 있는 산은 나무도 꽃도 없이 삭막하고 외로운 곳이었어요. 어느 날 조이라는 이름의 작은 새가 길을 잃고 그 산에 잠시
    내려앉게 되었어요. 산은 처음으로 찾아온 새가 무척 반가웠지만 새는 곧 다시 떠나야 했어요. 그 후 새는 해마다 산을 찾아와 작은 씨앗 하나씩을
    선물로 놓고 가고, 그 씨앗들이 자라나 산은 조금씩 꽃과 나무로 가득한 아름다운 곳으로 변해가요. 오랜 기다림과 우정이 삭막한 곳도 아름답게
    바꿀 수 있다는 것을 보여주는 따뜻한 이야기예요.
'9791188574018':
  title: 아름다운 실수
  summary: 한 화가가 그림을 그리다가 실수로 눈을 너무 크게 그리고 말아요. 하지만 화가는 실수를 지우는 대신 오히려 그 실수를 살려서 새로운
    그림으로 발전시켜 나가요. 그 다음에 생긴 또 다른 실수도 지우지 않고 창의적으로 바꾸어 그림을 점점 더 멋지게 완성해 가요. 이렇게 크고
    작은 실수들이 모여 결국 아름답고 특별한 하나의 그림이 완성돼요. 실수를 두려워하지 않고 오히려 새로운 시작으로 받아들이는 용기를 알려주는
    그림책이에요.
'9791186490174':
  title: 안녕 크렌쇼
  summary: 잭슨의 가족은 형편이 어려워져서 예전에 한 번 살던 곳에서 쫓겨나 자동차에서 지낸 적이 있어요. 요즘 다시 집세를 못 낼 상황이
    되자 잭슨은 또다시 살 곳을 잃을까 봐 불안하고 무서워요. 그런 잭슨 앞에 어릴 때 상상 속에서만 만났던 커다란 검은 고양이 크렌쇼가 다시
    나타나요. 크렌쇼는 잭슨이 혼자서 감당하기 힘든 마음을 솔직하게 털어놓을 수 있도록 곁에서 도와줘요. 어려운 현실 속에서도 가족과 우정, 솔직함의
    힘을 느끼게 해주는 캐서린 애플게이트의 감동적인 이야기예요.
'9788979381016':
  title: 알렉스 스콧, 레모네이드의 기적
  summary: 알렉스는 겨우 한 살 때 신경모세포종이라는 무서운 암에 걸렸어요. 어린 나이에도 알렉스는 자신처럼 아픈 다른 아이들을 돕고 싶어서
    집 앞에 작은 레모네이드 가게를 열었어요. 알렉스가 정성껏 만든 레모네이드를 팔아 모은 돈은 소아암 연구를 돕는 데 쓰였고 그 마음이 사람들에게
    전해져 점점 더 많은 이들이 함께하게 되었어요. 알렉스는 하늘나라로 떠났지만 그 작은 레모네이드 가게에서 시작된 나눔은 오늘날까지도 계속 이어지고
    있어요. 한 아이의 따뜻한 마음이 세상을 바꾼 실화를 담은 감동적인 이야기예요.
'9788992844222':
  title: 양쯔강 소년
  summary: 소년 푸는 어머니와 함께 시골을 떠나 중국의 큰 도시 충칭으로 이사를 가요. 푸는 그곳에서 구리 세공을 하는 장인의 견습생이 되어
    기술을 배우기 시작해요. 낯선 도시 생활 속에서 푸는 여러 가지 어려움과 유혹을 만나지만 스승의 가르침과 자신의 노력으로 하나씩 극복해 나가요.
    시간이 흐르며 푸는 철없는 소년에서 책임감 있고 지혜로운 청년으로 성장해요. 변화하는 시대의 중국을 배경으로 한 소년의 성장을 그린 뉴베리상
    수상작이에요.
'9788949170947':
  title: 에드워드 툴레인의 신기한 여행
  summary: 에드워드는 도자기로 만들어진 토끼 인형이에요. 자기밖에 모르고 잘난 척하던 에드워드는 어느 날 바다에 빠져 주인인 아비린과 헤어지고
    말아요. 어부, 떠돌이 아저씨, 허수아비, 아픈 여자아이 등 여러 사람들 손을 거치며 온갖 일을 겪지요. 그 과정에서 에드워드는 슬픔과 이별을
    알게 되고 진짜 사랑하는 마음을 배워 가요. 마침내 에드워드는 다시 누군가에게 사랑받을 기회를 만나게 돼요.
'9788979380972':
  title: 열네 번째 금붕어
  summary: 엘리스는 어느 날 자기 집에 낯선 십대 소년이 나타나자 깜짝 놀라요. 알고 보니 이 소년은 젊어지는 비밀을 찾아낸 엘리스의 할아버지였어요.
    할아버지는 해파리 연구를 하다가 스스로 실험해 보고는 십대의 몸이 되어 버린 거예요. 엘리스는 할아버지와 함께 다시 어른으로 돌아갈 방법을
    찾아 나서면서 과학과 늙음, 죽음에 대해 생각하게 돼요. 유쾌하면서도 진지하게 삶의 의미를 돌아보게 하는 이야기예요.
'9788991813144':
  title: 염소 즐라테
  summary: 아론은 명절을 앞두고 팔아야 할 염소 즐라테를 데리고 마을로 향해요. 그런데 가는 길에 눈보라가 몰아쳐서 아론과 즐라테는 눈 속에
    갇히고 말아요. 둘은 건초 더미 속에 숨어 서로 온기를 나누며 며칠을 함께 버텨내요. 그 시간 동안 아론은 즐라테를 진짜 가족처럼 아끼는 마음을
    깨닫게 되지요. 결국 무사히 집으로 돌아온 아론은 즐라테를 팔지 않기로 해요.
'9788901079158':
  title: 워터호스
  summary: 어린 소년 크루소는 바닷가에서 이상한 알을 하나 주워 와요. 알에서 태어난 것은 놀랍게도 전설 속 워터호스, 신비한 물의 동물이었어요.
    크루소는 이 동물을 몰래 욕조와 연못에 숨겨 기르며 정을 붙이지만 몸집이 점점 커져 더는 숨길 수 없게 돼요. 결국 가족은 이 동물을 커다란
    호수로 데려가 풀어 주기로 결심해요. 네스호 괴물 전설이 어떻게 생겨났는지를 상상력 넘치게 풀어낸 동화예요.
'9788936442453':
  title: '웨이 싸이드 학교가 무너지고 있어 : 루이스 쌔커 장편동화'
  summary: 웨이사이드 학교는 원래 한 층짜리로 지으려던 설계도를 실수로 세로로 세워서 삼십 층짜리 건물이 되어 버렸어요. 그래서 각 층마다
    교실이 하나씩만 있는 아주 이상한 학교가 만들어졌지요. 이 책에는 가장 꼭대기 층 교실에서 일어나는 엉뚱하고 웃긴 이야기들이 짧게 이어져 나와요.
    선생님과 아이들 모두 개성 넘치고 황당한 사건을 겪으며 웃음을 자아내지요. 상식을 뒤집는 유쾌한 이야기들이 가득한 동화예요.
'9788901074344':
  title: 이상한 나라의 앨리스
  summary: 앨리스는 하얀 토끼를 따라 굴속으로 들어갔다가 신기한 나라로 떨어지게 돼요. 그곳에서 몸이 커졌다 작아졌다 하며 여러 가지 신비한
    일들을 겪지요. 체셔 고양이, 미친 모자 장수, 하트 여왕 같은 독특한 인물들을 만나며 이상한 재판과 티타임에도 참여하게 돼요. 앨리스는 엉뚱하고
    논리가 뒤죽박죽인 이 세계에서 당황하면서도 점점 용감해져요. 결국 앨리스는 꿈에서 깨어나 다시 현실로 돌아오게 되는 이야기예요.
'9788955474404':
  title: 이상한 나라의 앨리스
  summary: 앨리스는 하얀 토끼를 따라 굴속으로 들어갔다가 신기한 나라로 떨어지게 돼요. 그곳에서 몸이 커졌다 작아졌다 하며 여러 가지 신비한
    일들을 겪지요. 체셔 고양이, 미친 모자 장수, 하트 여왕 같은 독특한 인물들을 만나며 이상한 재판과 티타임에도 참여하게 돼요. 앨리스는 엉뚱하고
    논리가 뒤죽박죽인 이 세계에서 당황하면서도 점점 용감해져요. 결국 앨리스는 꿈에서 깨어나 다시 현실로 돌아오게 되는 이야기예요.
'9788991550544':
  title: 절대로 실수하지 않는 아이
  summary: 비어트리스는 태어나서 한 번도 실수를 해 본 적이 없는 아이로 유명해요. 학교에서도 늘 완벽하게 행동해서 친구들과 선생님 모두
    비어트리스를 대단하게 여기지요. 그런데 어느 날 장기자랑 무대에서 그만 큰 실수를 저지르고 말아요. 처음엔 몹시 당황하지만 비어트리스는 실수해도
    괜찮다는 것, 오히려 실수 덕분에 더 즐거워질 수 있다는 걸 깨닫게 돼요. 완벽하지 않아도 행복할 수 있다는 걸 알려 주는 유쾌한 이야기예요.
'9788949140926':
  title: 치폴리노의 모험
  summary: 치폴리노는 양파를 닮은 소년으로, 가난한 사람들이 사는 마을에서 살아가요. 이 마을은 토마토 영주와 레몬 남작 같은 못된 귀족들에게
    괴롭힘을 당하고 있었지요. 치폴리노는 억울하게 감옥에 갇힌 아버지와 힘없는 이웃들을 돕기 위해 용기를 내요. 여러 채소와 과일 친구들과 힘을
    합쳐 못된 권력자들에 맞서 싸우지요. 결국 치폴리노와 친구들은 지혜와 용기로 마을 사람들에게 자유를 되찾아 줘요.
'9788937847042':
  title: 크리스마스로 불리는 소년
  summary: 니콜라스는 나무꾼 아버지와 단둘이 가난하게 살아가는 소년이에요. 아버지가 산타클로스를 찾아 먼 북쪽으로 떠나자 니콜라스도 아버지를
    찾아 위험한 여행을 떠나게 되지요. 여행 중에 요정들이 사는 신비한 마을을 만나고 날아다니는 순록과도 친구가 돼요. 니콜라스는 그 과정에서
    나누고 베푸는 마음의 소중함을 배우며 특별한 존재로 성장해요. 이 이야기는 산타클로스가 어떻게 탄생했는지를 상상력 있게 그려낸 동화예요.
'9788954603065':
  title: 파퍼 씨의 12마리 펭귄
  summary: 페인트공인 파퍼 씨는 남극 탐험가에게서 뜻밖에 펭귄 한 마리를 선물로 받게 돼요. 펭귄 캡틴 쿡을 집 안에서 키우다가 동물원에서
    짝을 얻으면서 새끼 펭귄들까지 태어나 순식간에 열두 마리로 늘어나지요. 좁은 집 안은 온통 펭귄들 때문에 난장판이 되고 파퍼 씨 가족은 큰
    소동을 겪어요. 파퍼 씨는 결국 펭귄들에게 재주를 가르쳐 순회공연을 다니게 되지요. 이야기의 마지막에는 파퍼 씨가 펭귄들과 함께 새로운 모험을
    떠나게 돼요.
'9788980408528':
  title: 푸른 돌고래 섬과 지아
  summary: 카라나는 인디언 부족과 함께 살던 섬에서 갑자기 혼자 남겨지게 돼요. 부족 사람들이 배를 타고 섬을 떠날 때 동생을 구하러 갔다가
    홀로 남겨졌기 때문이에요. 카라나는 오랜 세월 혼자서 사냥을 하고 집을 짓고 먹을 것을 구하며 씩씩하게 살아가지요. 처음에는 무서워하던 들개
    한 마리와도 친구가 되어 함께 지내게 돼요. 카라나는 마침내 오랜 시간이 흐른 뒤 사람들에게 구조되어 섬을 떠나게 되는 이야기예요.
'9788952752581':
  title: 하멜른의 피리 부는 사나이
  summary: 하멜른이라는 마을에 쥐 떼가 들끓어 사람들이 큰 고통을 겪고 있었어요. 어느 날 알록달록한 옷을 입은 피리 부는 사나이가 나타나
    돈을 받으면 쥐를 없애 주겠다고 약속해요. 그가 피리를 불자 마을의 모든 쥐들이 홀린 듯 따라 나와 강물에 빠져 사라지고 말지요. 그런데 마을
    사람들이 약속한 돈을 주지 않자 화가 난 사나이는 다시 피리를 불어요. 이번에는 마을의 아이들이 모두 그를 따라가 산속으로 사라져 버리는 슬픈
    이야기예요.
'9788983781611':
  title: 행운을 부르는 아이, 럭키
  summary: 럭키는 사막에 있는 작은 마을 하드팬에서 프랑스인 보호자 브리지트와 함께 살고 있어요. 엄마를 잃은 럭키는 언젠가 브리지트가 자신을
    떠날까 봐 늘 불안해하지요. 럭키는 마을회관에서 열리는 어른들의 모임을 몰래 엿들으며 인생을 바꿔 줄 위대한 힘을 찾으려 해요. 반려견과 함께
    집을 떠나기로 결심하면서 진짜 가족의 의미를 깨달아 가지요. 사막 마을을 배경으로 한 씩씩하고 따뜻한 성장 이야기예요.
'9788957982105':
  title: 홀리스 우즈의 그림들
  summary: 홀리스 우즈는 여러 위탁 가정을 전전해 온 소녀이자 그림 그리기를 좋아하는 아이예요. 예전에 잠시 머물렀던 리건 가족과의 행복했던
    기억을 그림으로 남겨 두고 있었지요. 홀리스는 이번에 나이 많은 화가 조시 할머니 집에 맡겨지게 돼요. 기억력이 점점 나빠지는 조시 할머니를
    돌보면서 홀리스는 진짜 가족이 무엇인지 다시 생각하게 되지요. 그림을 통해 마음속 이야기를 풀어내는 따뜻한 성장 이야기예요.
'9788983782229':
  title: 희망은 깃털처럼
  summary: 프래니가 다니는 학급에 어느 날 낯선 백인 소년이 전학을 와요. 아이들은 예수님을 닮았다며 그 아이를 지저스 보이라고 부르지요.
    프래니는 청각장애가 있는 오빠와 함께 살아가며 세상과 소통하는 다양한 방법에 대해 고민해요. 새로 온 친구를 통해 다름을 받아들이는 법과 희망을
    잃지 않는 마음을 배우게 되지요. 희망은 깃털처럼 가볍게 우리 곁에 머문다는 걸 느끼게 하는 이야기예요.
'9788991055704':
  title: 희망을 닮은 아이, 엘리야
  summary: 엘리야는 노예였다가 자유를 찾아 캐나다로 건너온 사람들이 세운 마을 벅스턴에서, 그 마을 최초로 자유인으로 태어난 아이예요. 엘리야는
    마을에서 유일하게 태어날 때부터 자유였다는 사실에 특별한 자부심을 느끼며 자라나지요. 어느 날 친구를 위해 도둑맞은 돈을 되찾으러 몰래 미국
    땅으로 넘어가는 위험한 여행을 떠나게 돼요. 그 과정에서 엘리야는 노예 제도의 끔찍한 현실을 직접 마주하게 되지요. 이 경험을 통해 엘리야는
    자유와 용기의 진짜 의미를 깊이 깨닫게 돼요.
