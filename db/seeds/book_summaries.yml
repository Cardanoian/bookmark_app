'9791130696850':
  title: 드래곤 마스터
  summary: 평범한 농부 소년 드레이크는 어느 날 갑자기 왕의 부름을 받아 성으로 가게 돼요. 알고 보니 드레이크에게는 용과 마음을 나눌 수
    있는 특별한 능력이 있어서, 그는 '드래곤 마스터'로 뽑히게 되지요. 드레이크는 자신의 용과 함께 훈련하며 서로를 이해하는 법을 배우고, 다른
    드래곤 마스터 친구들과도 우정을 쌓아가요. 힘을 모아 어려운 문제를 해결해 나가면서 드레이크는 진정한 드래곤 마스터로 성장한답니다.
'9788936477936':
  title: 알로하, 나의 엄마들 :이금이 장편소설
  summary: 1900년대 초, 조선의 어린 세 여인은 사진 한 장만 보고 하와이로 시집가는 '사진 신부'가 되기로 결심해요. 낯선 땅 하와이에
    도착한 이들은 사진 속 모습과는 다른 현실에 놀라지만, 힘든 노동과 외로움 속에서도 서로 의지하며 살아가지요. 세 여인은 각자 다른 삶을 살면서도
    끝까지 우정을 지키며 새로운 터전에서 뿌리를 내려가요. 낯선 땅에서도 씩씩하게 살아간 우리 할머니 세대 여성들의 용기와 우정을 그린 이야기예요.
'9788950976910':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 하늘의 벌을 받아 힘을 잃은 손오공이 인간 세상으로 내려와 한 아이를 만나면서 이야기가 시작돼요. 손오공은 한자를 외치면 그 한자의
    뜻대로 신기한 힘이 생기는 마법을 배우게 돼요. 사오정, 저팔계 같은 친구들과 함께 나쁜 요괴들을 물리치며 서유기 속 세상을 모험하지요. 이야기를
    재미있게 따라가다 보면 한자의 뜻과 모양을 저절로 익히게 되는 학습 만화예요.
'9791164381968':
  title: "(코믹 메이플스토리) 수학도둑 :지식·능력·경험을 융합하여 정리하는 No.1 수학학습만화"
  summary: 수학 나라의 소중한 수학 지식을 도둑맞으면서 이야기가 시작돼요. 주인공들은 사라진 수학 개념을 되찾기 위해 수학도둑을 뒤쫓으며
    모험을 떠나지요. 모험 중에 만나는 문제들을 하나씩 풀어가면서 자연스럽게 수학 원리를 익히게 돼요. 메이플스토리의 인기 캐릭터들이 함께 등장해서
    더욱 재미있게 수학을 배울 수 있는 학습 만화예요.
