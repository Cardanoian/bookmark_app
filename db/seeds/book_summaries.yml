'9788936442507':
  title: 불량한 자전거 여행 :김남중 장편동화
  summary: 부모님이 다투는 모습에 마음이 복잡해진 주인공은 무작정 삼촌을 따라 자전거로 국토 종주 여행을 떠나요. 처음엔 서툴고 힘들기만
    하던 자전거 여행이지만 낯선 길 위에서 여러 사람들을 만나며 조금씩 씩씩해지지요. 비바람을 맞고 언덕을 오르는 고된 하루하루를 견디며 스스로
    문제를 해결하는 법을 배워가요. 여행이 끝날 즈음 주인공은 처음보다 훌쩍 자란 마음으로 집으로 돌아가게 된답니다.
'9788964359204':
  title: '용선생 만화 한국사:'
  summary: 용선생님과 장하다, 나선애, 곽두기, 왕수재 네 친구가 시간 여행을 떠나면서 이야기가 펼쳐져요. 아이들은 옛날로 돌아가 그 시대
    사람들을 직접 만나고 사건을 눈으로 지켜보며 우리 역사를 배워요. 만화라서 어려운 역사 이야기도 쉽고 재미있게 이해할 수 있답니다. 용선생님의
    구수한 설명 덕분에 역사가 술술 머리에 들어와요.
'9788950976941':
