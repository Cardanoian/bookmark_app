'9788934972464':
  title: 사피엔스 :유인원에서 사이보그까지, 인간 역사의 대담하고 위대한 질문
  summary: 사피엔스는 오래전 여러 인류 중에서 왜 유독 우리 호모 사피엔스만 살아남아 지구 전체를 지배하게 되었는지 그 이유를 파헤치는 책이에요.
    이야기를 만들고 함께 믿는 능력 덕분에 낯선 사람들끼리도 큰 힘을 모을 수 있었다는 점을 흥미롭게 설명해요. 농사를 짓기 시작하면서 사람들의
    생활이 어떻게 달라졌는지도 함께 살펴봐요. 과학과 기술이 발전하면서 세상이 얼마나 크게 바뀌어 왔는지를 넓은 시야로 보여주는 책이에요.
'9788983927675':
  title: 해리포터 :아즈카반의 죄수
  summary: 호그와트 마법학교 3학년이 된 해리는 탈옥한 위험한 죄수 시리우스 블랙이 자신을 노리고 있다는 소식을 듣게 돼요. 학교 곳곳에는
    영혼까지 얼어붙게 만드는 무서운 존재, 디멘터들이 지키고 서 있지요. 해리는 론, 헤르미온느와 함께 시리우스 블랙을 둘러싼 진실을 하나씩 파헤쳐
    나가요. 그 끝에서 해리는 자신의 과거와 가족에 얽힌 뜻밖의 비밀을 마주하게 돼요.
'9788936443252':
  title: 푸른 사자 와니니 :이현 장편동화
  summary: 초원에 사는 아기 사자 와니니는 몸이 작고 약하다는 이유로 무리에서 쫓겨나요. 혼자가 된 와니니는 처음엔 무섭고 외롭지만 마음이
    잘 맞는 친구들을 만나 함께 살아가는 법을 배워요. 사냥을 하고 위험한 순간들을 헤쳐 나가면서 와니니는 점점 용감하고 지혜로운 사자로 자라나요.
    시간이 흘러 와니니는 자신을 쫓아냈던 무리가 위기에 처했다는 사실을 알게 되고, 망설임 없이 그들을 돕기로 결심해요. 작고 약했던 와니니가
    진짜 리더로 성장해 가는 감동적인 이야기예요.
'9791169791977':
  title: 스즈메의 문단속
  summary: 스즈메는 규슈의 한적한 마을에 사는 평범한 여고생이에요. 어느 날 폐허에서 신비한 문을 발견하고 실수로 열게 되면서, 재난을 몰고
    오는 힘이 세상으로 빠져나올 뻔한 큰 사건이 벌어져요. 문을 다시 닫는 여행자 소타를 만난 스즈메는 그와 함께 일본 곳곳에 열린 위험한 문들을
    찾아 닫는 여정을 떠나요. 여행 도중 소타는 다리가 셋인 작은 의자로 변해버리고, 둘은 힘을 합쳐 수수께끼의 존재까지 뒤쫓게 돼요. 문을 닫는
    여정을 통해 스즈메는 자신의 아픈 과거와 마주하고 한 뼘 더 성장한답니다.
'9788983927668':
  title: 해리포터 :아즈카반의 죄수
  summary: 호그와트 마법학교 3학년이 된 해리는 아즈카반 감옥을 탈출한 무서운 죄수 시리우스 블랙이 자신을 노린다는 소식을 듣게 돼요. 새로
    온 어둠의 마법 방어법 선생님 루핀에게 해리는 무시무시한 디멘터를 물리치는 패트로누스 마법을 배워요. 헤르미온느는 비밀리에 시간을 되돌리는
    도구를 이용해 여러 수업을 동시에 듣는답니다. 이야기가 진행될수록 시리우스 블랙에 얽힌 놀라운 진실과 해리 부모님의 과거가 조금씩 드러나요.
    결국 해리는 겉보기와는 다른 진실을 알게 되며 소중한 인연을 만나게 된답니다.
'9791157107223':
  title: 너의 췌장을 먹고 싶어
  summary: 평범한 남학생인 '나'는 우연히 반 친구 사쿠라의 비밀 일기장을 줍게 돼요. 일기에는 사쿠라가 몸에 심각한 병을 앓고 있어 살날이
    얼마 남지 않았다는 놀라운 사실이 적혀 있었어요. 비밀을 알게 된 두 사람은 서로 조금씩 마음을 열며 함께 시간을 보내게 돼요. 밝고 씩씩한
    사쿠라와 조용한 성격의 '나'는 어울리지 않는 듯하면서도 특별한 우정을 쌓아가요. 짧지만 소중한 시간을 함께한 두 사람의 이야기는 생명과 우정의
    의미를 깊이 생각하게 해준답니다.
'9791191826005':
  title: 너도 하늘말나리야 :이금이 장편동화
  summary: 미르는 부모님이 이혼한 뒤 엄마와 함께 낯선 시골 마을로 이사를 왔어요. 마을에는 엄마를 일찍 여의고 할머니와 사는 소희, 엄마가
    돌아가신 뒤로 말을 하지 않는 바우가 살고 있어요. 처음엔 서로 마음을 열지 못하던 세 아이는 조금씩 가까워지며 서로의 아픔을 이해하게 돼요.
    함께 시간을 보내면서 미르, 소희, 바우는 슬픔을 나누고 다시 웃는 법을 배워가요. 서로 다른 상처를 지닌 세 친구가 우정으로 마음을 치유해
    가는 따뜻한 이야기예요.
'9788934991328':
  title: 사피엔스 :그래픽 히스토리
  summary: 이 책은 아주 먼 옛날 여러 종류의 사람들이 지구에 함께 살았던 시절 이야기를 만화로 보여줘요. 안내자를 따라가며 우리 조상인
    호모 사피엔스가 어떻게 다른 인류들과 경쟁하며 살아남았는지 알아봐요. 사피엔스는 눈에 보이지 않는 이야기를 함께 믿고 상상하는 특별한 능력
    덕분에 많은 사람들이 힘을 모을 수 있었어요. 이러한 능력 덕분에 사피엔스는 점점 넓은 지역으로 퍼져나가 결국 지구의 주인이 되었답니다. 어렵게
    느껴질 수 있는 인류의 역사를 재미있는 그림과 이야기로 쉽게 설명해 주는 책이에요.
'9788983927682':
  title: 해리포터 :불의 잔
  summary: 호그와트에서 트리위저드 대회가 열리고 프랑스의 보바통과 독일의 덤스트랭 마법학교 학생들이 초대돼요. 나이 제한 때문에 참가할 수
    없었던 해리는 놀랍게도 자기 이름이 불의 잔에서 뽑히면서 얼떨결에 네 번째 대표 선수가 돼요. 해리는 용을 상대하고 호수 속 인어들을 만나며
    미로를 통과하는 위험한 세 가지 시험을 치르게 돼요. 대회가 진행되는 동안 해리 주변에서는 알 수 없는 수상한 일들이 자꾸 일어나요. 마지막
    시험에서 해리는 볼드모트가 다시 돌아오는 무서운 순간을 마주하게 된답니다.
'9788934945864':
  title: 멈출 수 없는 우리 2 - 세상은 왜 공평하지 않을까
  summary: 이 책은 아주 오래전 사람들이 사냥과 채집 대신 농사를 짓기 시작하면서 벌어진 큰 변화를 이야기해줘요. 농사를 지으면서 사람들은
    한곳에 머물러 살게 되었고, 곡식과 땅을 더 많이 가진 사람과 적게 가진 사람이 생겨났어요. 이렇게 해서 이전에는 없던 부자와 가난한 사람,
    왕과 백성 같은 차별과 계급이 생겨나기 시작했답니다. 책은 이런 불평등이 왜 생겨났고 오늘날까지 어떻게 이어지고 있는지 쉽고 재미있게 설명해줘요.
    인류 역사 속 공평하지 않은 세상의 시작을 함께 살펴보는 책이에요.
'9791167550170':
  title: 죽이고 싶은 아이 :이꽃님 장편소설
  summary: 어느 날 아침 주름의 가장 친한 친구 사라가 차갑게 숨진 채 발견되면서 마을이 발칵 뒤집혀요. 사건 현장에서 주름이 발견되면서
    사람들은 모두 주름을 범인으로 의심하기 시작해요. 하지만 정작 주름 자신도 그날 무슨 일이 있었는지 잘 기억하지 못해 혼란스러워해요. 이야기는
    여러 사람들의 증언을 통해 두 친구 사이에 있었던 일들을 하나씩 보여줘요. 진실이 무엇인지 끝까지 알 수 없는 긴장감 속에서 우정과 오해에
    대해 다시 생각하게 하는 이야기예요.
'9788936443269':
  title: 푸른 사자 와니니 :이현 장편동화
  summary: 초원에 사는 아기 사자 와니니는 몸이 작고 약하다는 이유로 무리에서 쫓겨나요. 혼자가 된 와니니는 처음엔 무섭고 외롭지만 마음이
    잘 맞는 친구들을 만나 함께 살아가는 법을 배워요. 사냥을 하고 위험한 순간들을 헤쳐 나가면서 와니니는 점점 용감하고 지혜로운 사자로 자라나요.
    시간이 흘러 와니니는 자신을 쫓아냈던 무리가 위기에 처했다는 사실을 알게 되고, 망설임 없이 그들을 돕기로 결심해요. 작고 약했던 와니니가
    진짜 리더로 성장해 가는 감동적인 이야기예요.
'9788936443283':
  title: 불량한 자전거 여행 :김남중 장편동화
  summary: 6학년 신호는 부모님이 자꾸 다투는 게 힘들어서 혼자 끙끙 앓고 있어요. 여름방학이 되자 신호는 얼굴도 잘 모르는 삼촌을 따라
    자전거를 타고 전국을 도는 여행을 떠나게 돼요. 처음엔 낯설고 힘든 자전거 여행이지만, 신호는 길 위에서 다양한 사람들을 만나고 여러 가지
    일들을 겪어요. 땀 흘리며 페달을 밟는 동안 신호는 조금씩 씩씩해지고 마음도 단단해져요. 여행이 끝날 무렵 신호는 가족 문제를 마주할 용기와
    함께 부쩍 자란 자신을 발견하게 된답니다.
'9788949144023':
  title: 배드 가이즈
  summary: 늑대 씨, 뱀 씨, 상어 씨, 피라냐 씨는 겉모습이 무섭게 생겨서 다들 나쁜 녀석들이라고 오해를 받아요. 사실은 좋은 사람이 되고
    싶었던 이 친구들은 힘을 합쳐 착한 일을 하기로 결심해요. 첫 번째 도전으로 이들은 동물 보호소에 갇힌 강아지들을 구해주려고 나서요. 무서운
    겉모습 때문에 자꾸 오해를 받으면서도 배드 가이즈는 포기하지 않고 좌충우돌 활약을 펼쳐요. 결국 이들은 진짜 좋은 사람이 되는 것이 무엇인지
    조금씩 깨달아 간답니다.
'9788936454951':
  title: 할머니의 여름휴가
  summary: 여름이 되자 주인공 아이는 엄마와 함께 돌아가신 할머니 댁으로 여름휴가를 떠나요. 그런데 놀랍게도 하늘나라에 계셔야 할 할머니가
    예전 모습 그대로 반갑게 아이를 맞아 주어요. 아이는 할머니와 함께 바다에서 물놀이도 하고 마당에서 시원한 수박도 나눠 먹으며 즐거운 시간을
    보내요. 짧은 여름휴가 동안 아이는 할머니와의 소중한 추억을 다시 한번 만들게 돼요. 그리운 사람과의 이별을 따뜻하고 포근하게 그려낸 감동적인
    그림책이에요.
'9791168417564':
  title: "(10대를 위한) 돈으로 살 수 없는 것들 =하버드대 마이클 샌델 교수의 경제 수업 /What money can't buy"
  summary: 이 책은 세상에 돈만 있으면 무엇이든 살 수 있을지 함께 생각해 보게 하는 책이에요. 새치기할 수 있는 자리를 돈 주고 사는 일이나
    책을 읽으면 돈을 주는 일처럼 실제로 있었던 여러 사례들을 재미있게 소개해줘요. 이런 일들이 겉으로는 편리해 보여도 사실은 소중한 가치를 망가뜨릴
    수 있다는 점을 차근차근 짚어줘요. 돈으로 살 수 있는 것과 살 수 없어야 하는 것은 무엇인지 스스로 판단해 보도록 이끌어줘요. 경제 이야기를
    통해 올바른 가치관을 생각해 보게 하는 유익한 책이랍니다.
'9788950981648':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 하늘의 벌을 받아 힘을 잃은 손오공이 인간 세상으로 내려와 한 아이를 만나면서 이야기가 시작돼요. 손오공은 한자를 외치면 그 한자의
    뜻대로 신기한 힘이 생기는 마법을 배우게 돼요. 사오정, 저팔계 같은 친구들과 함께 나쁜 요괴들을 물리치며 서유기 속 세상을 모험하지요. 이야기를
    재미있게 따라가다 보면 한자의 뜻과 모양을 저절로 익히게 되는 학습 만화예요.
'9788964359198':
  title: '용선생 만화 한국사:'
  summary: 용선생님과 장하다, 나선애, 곽두기, 왕수재 네 친구가 시간 여행을 떠나면서 이야기가 펼쳐져요. 아이들은 옛날로 돌아가 그 시대
    사람들을 직접 만나고 사건을 눈으로 지켜보며 우리 역사를 배워요. 만화라서 어려운 역사 이야기도 쉽고 재미있게 이해할 수 있답니다. 용선생님의
    구수한 설명 덕분에 역사가 술술 머리에 들어와요.
'9791130659091':
  title: '최재천의 동물대탐험 7 : 무왕가 할머니의 장례식 - 애도하는 사막의 거인, 코끼리'
  summary: 이 책은 무리를 이끌던 할머니 코끼리가 세상을 떠나는 이야기로 시작돼요. 가족을 잃은 코끼리들은 슬퍼하며 오랫동안 곁을 떠나지
    않고 코로 쓰다듬으며 애도한대요. 코끼리는 사람처럼 가족의 죽음을 슬퍼할 줄 아는 정이 많고 똑똑한 동물이라는 걸 알려줘요. 사막 같은 힘든
    환경에서도 서로를 아끼며 살아가는 코끼리 가족의 모습을 만날 수 있어요.
'9788950979973':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 하늘의 벌을 받아 힘을 잃은 손오공이 인간 세상으로 내려와 한 아이를 만나면서 이야기가 시작돼요. 손오공은 한자를 외치면 그 한자의
