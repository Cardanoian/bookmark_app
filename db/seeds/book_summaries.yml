'9791198363503':
  title: 아몬드 :손원평 장편소설
  summary: 윤재는 편도체가 작게 태어나 화나 무서움 같은 감정을 잘 느끼지 못하는 아이예요. 엄마와 할머니는 윤재가 다른 사람들과 어울려
    살아갈 수 있도록 감정을 배우게 도와주지요. 그러던 어느 날 갑작스러운 사고로 할머니를 잃고 엄마도 크게 다치면서 윤재는 홀로 남겨져요. 그
    뒤 거칠고 반항적인 소년 곤을 만나면서 윤재는 처음으로 감정이라는 것에 조금씩 다가가게 돼요.
'9788936443054':
  title: 푸른 사자 와니니 :이현 장편동화
  summary: 초원에서 태어난 어린 암사자 와니니는 몸이 약하다는 이유로 무리에서 쫓겨나고 말아요. 혼자가 된 와니니는 넓은 초원을 헤매며 살아남는
    법을 스스로 배워가지요. 그러다 자신처럼 무리에서 밀려난 사자들을 만나 서로 의지하며 함께 지내게 돼요. 크고 작은 어려움을 겪으면서도 와니니는
    점점 용감하고 지혜로운 사자로 자라나요.
'9791190090261':
  title: 천 개의 파랑 :천선란 장편소설
  summary: 경마장에서 일하는 인공지능 로봇 기수 콜리는 사고로 다리를 다친 경주마 투데이를 만나게 돼요. 낡고 고장 난 콜리는 폐기될 위기에
    처하지만, 장애가 있는 소녀 연재를 비롯한 사람들과 마음을 나누며 특별한 우정을 쌓아가지요. 콜리와 사람들은 투데이를 살리고 함께 달리게 하기
    위해 힘을 모아요. 로봇과 사람, 동물이 서로를 이해하며 성장해 가는 따뜻한 이야기예요.
'9791173571466':
  title: 무적 이순신
  summary: 이순신은 조선 시대의 장군으로, 임진왜란이 일어나자 바다에서 왜적과 맞서 싸웠어요. 적은 수의 배로도 이길 수 있도록 거북선이라는
    특별한 배를 만들어 전투에 활용했지요. 수가 훨씬 적은 조선 수군을 이끌고도 명량 대첩 등 여러 전투에서 놀라운 승리를 거두었답니다. 나라를
    지키기 위해 끝까지 최선을 다한 이순신의 용기와 지혜를 만나볼 수 있어요.
'9788966072057':
  title: 와일드 로봇
  summary: 태풍에 휩쓸려 무인도에 떠밀려온 로봇 로즈는 낯선 섬에서 홀로 살아남는 법을 배워가요. 처음에는 로봇을 무서워하던 섬의 동물들도
    시간이 지나며 점차 로즈와 친구가 되지요. 로즈는 알을 깨고 나온 아기 거위를 발견해 브라이트빌이라는 이름을 지어 주고 엄마처럼 정성껏 길러요.
    기계인 로즈와 야생 동물들이 서로 도우며 진짜 가족처럼 지내는 모습이 감동을 준답니다.
'9791130696829':
  title: 드래곤 마스터
  summary: 평범한 농부 소년 드레이크는 어느 날 갑자기 왕의 성으로 불려가게 돼요. 그곳에서 드레이크는 특별한 힘을 지닌 드래곤 마스터로
    선택되었다는 사실을 알게 되고, 자신의 용인 땅의 드래곤 웜을 만나지요. 다른 드래곤 마스터들과 함께 지내며 용을 이해하고 다루는 법을 하나씩
    배워가요. 서툴지만 용감한 드레이크가 진정한 드래곤 마스터로 성장해 가는 모험 이야기예요.
'9788949124360':
  title: 복제인간 윤봉구
  summary: 윤봉구는 평범한 초등학생인 줄 알았는데, 어느 날 자신이 복제인간이라는 놀라운 사실을 알게 돼요. 자신이 누구인지, 진짜 나라는
    것은 무엇인지 큰 혼란과 고민에 빠지게 되지요. 봉구는 가족과 친구들 사이에서 흔들리면서도 진실을 마주하려 애써요. 결국 봉구는 복제인간이라는
    사실과 상관없이 자기 자신으로 당당히 살아가기로 마음먹어요. 정체성과 가족의 소중함을 생각하게 해 주는 이야기예요.
'9791171252565':
  title: 웡카
  summary: 초콜릿을 만드는 재주가 뛰어난 청년 윌리 웡카가 꿈을 안고 낯선 도시에 도착하면서 이야기가 시작돼요. 웡카는 자신만의 초콜릿 가게를
    열고 싶어 하지만, 시장을 독차지하고 있는 못된 초콜릿 회사들의 방해를 받게 돼요. 그는 고아 소녀 누들을 비롯한 여러 친구들을 만나 도움을
    주고받으며 어려움을 헤쳐 나가요. 마법 같은 신비한 초콜릿과 재치 넘치는 모험을 통해 웡카는 자신의 꿈을 이루어 가지요. 훗날 유명한 초콜릿
    공장 주인이 되는 웡카의 유쾌하고 따뜻한 시작을 그린 이야기예요.
'9788972976196':
  title: 나의 라임 오렌지나무
  summary: 브라질의 가난한 동네에 사는 다섯 살 소년 제제는 장난꾸러기지만 속마음은 여리고 상처받기 쉬운 아이예요. 제제는 집 마당의 작은
    오렌지 나무에게 '밍기뉴'라는 이름을 지어 주고 친구처럼 이야기를 나누며 외로움을 달래지요. 가난과 어른들의 매질 속에서 힘들어하던 제제는
    다정한 아저씨 뽀르뚜가를 만나 처음으로 진심 어린 사랑을 느껴요. 하지만 뜻밖의 이별을 겪으며 제제는 아프게 성장해 나가요. 어린 시절의 순수함과
    슬픔을 담은 감동적인 성장 이야기예요.
'9788936443160':
  title: 푸른 사자 와니니 :이현 장편동화
  summary: 아프리카 초원에 사는 어린 암사자 와니니는 몸이 약하고 사냥도 서툴러서 무리에서 쓸모없다는 이야기를 들어요. 결국 와니니는 엄마와
    무리에서 쫓겨나 홀로 초원을 떠돌게 되지요. 와니니는 여러 위험과 시련을 겪으면서도 포기하지 않고 자기만의 방식으로 살아가는 법을 배워 나가요.
    새로운 친구들을 만나 서로 돕고 의지하며 진정한 가족과 리더십의 의미를 깨달아 가지요. 씩씩하고 당당하게 자라나는 어린 사자의 감동적인 성장
    이야기예요.
'9788983927644':
  title: 해리포터 :비밀의 방
  summary: 호그와트 마법학교 2학년이 된 해리는 학교에서 이상한 목소리가 들리는 걸 느끼고 불안에 휩싸여요. 학교 안에는 '비밀의 방'이라는
    전설이 전해지는데, 그 방이 실제로 열리면서 학생들이 하나둘 돌처럼 굳어 버리는 사건이 벌어지지요. 해리와 친구 론, 헤르미온느는 누가 비밀의
    방을 열었는지 알아내기 위해 힘을 합쳐요. 그 과정에서 어둠의 마법사 볼드모트와 관련된 비밀스러운 과거가 드러나게 돼요. 우정과 용기로 위기를
    헤쳐 나가는 짜릿한 마법 모험 이야기예요.
'9788947549455':
  title: 세금 내는 아이들 :어린이를 위한 투자 교육 동화
  summary: 어느 초등학교 교실에서 선생님은 아이들에게 진짜 돈처럼 쓸 수 있는 '학급 화폐'를 만들어 나누어 줘요. 아이들은 저마다 직업을
    갖고 일을 해서 돈을 벌고, 물건도 사고팔면서 교실 속 작은 사회를 만들어 가지요. 그런데 번 돈에서 세금을 내야 한다는 사실을 알게 되면서
    아이들은 세금이 왜 필요한지 하나씩 배워 나가요. 때로는 억울해하고 다투기도 하면서 아이들은 돈과 경제의 원리를 몸으로 깨우쳐요. 놀이처럼
    재미있게 세금과 경제를 배울 수 있는 이야기예요.
'9788937838309':
  title: 윔피 키드
  summary: 그렉 헤플리는 중학교에 갓 입학한 평범한 소년으로, 엄마의 성화에 못 이겨 일기를 쓰기 시작해요. 그렉은 자신은 특별하고 인기
    많은 사람이 될 거라 믿지만 학교생활은 뜻대로 되지 않아요. 덩치 큰 친구들 사이에서 치이고, 단짝 친구 롤리와 티격태격하면서도 우정을 이어
    가지요. 그렉은 여러 황당하고 웃긴 사건들을 겪으며 학교와 가족 안에서 좌충우돌 성장해 나가요. 솔직하고 유쾌한 그림일기로 웃음을 주는 이야기예요.
'9788954449663':
  title: 시간을 파는 상점 :김선영 장편소설
  summary: 고등학생 백온조는 인터넷에 '시간을 파는 상점'이라는 곳을 열고, 돈을 받고 다른 사람 대신 심부름이나 일을 해 주는 일을 시작해요.
    다양한 사람들이 시간을 사러 찾아오면서 온조는 여러 사람들의 사정과 마음을 알아 가게 되지요. 그 과정에서 온조는 자신이 겪었던 아픈 기억과
    마주하며 조금씩 성장해 나가요. 낯선 의뢰들을 하나씩 해결하면서 온조는 사람과 사람 사이의 소중함을 깨달아요. 시간과 관계의 의미를 다시 생각하게
    하는 잔잔한 이야기예요.
'9788954650212':
  title: 세계를 건너 너에게 갈게 :이꽃님 장편소설
  summary: 평범한 중학생 은유는 낡은 우체통에 편지를 넣으면 놀랍게도 20여 년 전 과거로 편지가 배달된다는 사실을 알게 돼요. 은유는 그
    우체통을 통해 자신과 같은 나이인 과거 소녀와 편지를 주고받기 시작하지요. 편지를 나누며 은유는 서로 다른 시간을 사는 두 사람이지만 닮은
    고민과 마음을 갖고 있다는 걸 깨달아요. 이야기가 진행될수록 두 사람의 관계에 얽힌 놀라운 비밀도 서서히 드러나지요. 시간을 뛰어넘은 편지로
    이어진 특별한 우정과 가족애를 그린 이야기예요.
'9788949123493':
  title: 순례 주택 :유은실 소설
  summary: 오수림은 복권에 당첨된 뒤 형편이 어려운 사람들을 위해 낮은 값에 세를 놓는 다세대 주택 '순례 주택'을 지은 할머니 순례와 함께
    살게 돼요. 순례 주택에는 사정이 저마다 다른 이웃들이 모여 살며 크고 작은 정을 나누고 있지요. 수림은 순례 할머니와 이웃들을 지켜보며 돈과
    행복, 진짜 부자란 무엇인지 새롭게 생각하게 돼요. 티격태격하면서도 서로를 챙기는 이웃들의 모습에서 수림은 따뜻한 가족 같은 정을 느끼게 되지요.
    이웃과 더불어 사는 삶의 의미를 돌아보게 하는 이야기예요.
'9788950976873':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 손오공이 신비한 한자의 힘을 빌려 요괴들과 맞서 싸우는 한자 학습 만화예요. 한자를 큰 소리로 외치면 그 뜻과 소리에 맞는 신기한
    마법이 펼쳐져요. 위기에 빠질 때마다 한자의 도움으로 지혜롭게 문제를 해결해 나가요. 손오공과 친구들의 좌충우돌 모험을 따라가다 보면 어느새
    한자를 재미있게 익힐 수 있어요.
'9788957980132':
  title: "(이금이 성장소설)유진과 유진"
  summary: 같은 이름을 가진 두 소녀 '유진'의 이야기예요. 한 유진이는 사랑받으며 밝게 자랐고, 다른 유진이는 어린 시절의 아픈 기억 때문에
    마음의 상처를 안고 살아가요. 우연히 같은 학교, 같은 반에서 만난 두 사람은 서로를 통해 자신을 되돌아보게 돼요. 아픔을 숨기지 않고 마주할
    때 비로소 진짜 나를 찾을 수 있다는 걸 보여주는 성장 이야기예요.
'9791168412040':
  title: "(10대를 위한) 공정하다는 착각 :하버드대 마이클 샌델 교수의 사회 수업"
  summary: 우리는 흔히 성공은 오로지 자신의 노력 덕분이라고 생각하지만, 사실은 운과 주변의 도움도 크게 작용한다는 것을 이야기하는 책이에요.
    능력만으로 모든 것이 정해진다는 믿음이 오히려 사람들 사이를 갈라놓을 수 있다는 점을 짚어줘요. 성공한 사람도, 그렇지 못한 사람도 서로를
    존중하며 더불어 사는 사회를 함께 생각해 보게 해요. 하버드대 교수의 눈높이 사회 수업을 통해 공정함이란 무엇인지 다시 한번 고민하게 만드는
    책이에요.
'9791168124295':
  title: 마지막 이야기 전달자
  summary: 지구가 큰 혜성과 부딪혀 멸망할 위기에 처하자, 주인공 페트라의 가족은 새로운 행성을 찾아 우주선을 타고 떠나요. 오랜 잠에 빠져
    있어야 하는 긴 여행 동안, 할머니께 들었던 옛이야기들을 마음속에 소중히 간직하려 해요. 그런데 깨어나 보니 모두의 기억과 개성을 지우려는
    무리가 우주선을 장악하고 있었어요. 페트라는 사람들의 소중한 이야기와 기억을 지키기 위해 용기를 내는 이야기예요.
'9791185934945':
  title: 문제아
  summary: 미국에 사는 열두 살 한국계 소년 조던은 평범한 일상을 보내다가 갑자기 도시에 큰 소요 사태가 일어나면서 위기를 맞아요. 부모님이
    운영하는 가게가 위험에 처하자 조던은 두려움 속에서도 가족을 지키기 위해 나서요. 그 과정에서 할아버지가 한국에서 겪었던 힘든 시절의 이야기도
    알게 돼요. 낯선 혼란 속에서 진짜 용기와 가족의 의미를 배워가는 성장 이야기예요.
'9788950976866':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 손오공이 신비한 한자의 힘을 빌려 요괴들과 맞서 싸우는 한자 학습 만화예요. 한자를 큰 소리로 외치면 그 뜻과 소리에 맞는 신기한
