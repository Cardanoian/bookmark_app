'9788950983901':
  title: 이사도라 문
  summary: 이사도라 문은 엄마는 요정이고 아빠는 뱀파이어인 특별한 소녀예요. 낮에는 인간 학교에 다니고 밤에는 요정과 뱀파이어의 마법 세계를
    오가며 두 세계를 모두 경험해요. 요정의 마법 지팡이와 뱀파이어의 망토를 이용해 크고 작은 사건들을 겪으며 학교생활에 적응해 나가요. 서로
    다른 두 세계의 규칙 때문에 헷갈리고 실수도 하지만 특유의 씩씩함으로 문제를 해결해요. 평범함과는 다른 자신만의 개성을 사랑스럽게 보여 주는
    그림 동화 시리즈예요.
