'9791173477935':
  title: 데미안 =Demian
  summary: 싱클레어는 평범한 소년이었지만 친구 데미안을 만나면서 선과 악이 뒤섞인 낯선 세계에 눈을 뜨게 돼요. 데미안은 세상을 다르게 보는
    신비로운 인물로, 싱클레어에게 스스로 생각하고 자신의 길을 찾으라고 이야기해 줘요. 싱클레어는 여러 방황과 혼란을 겪으면서도 조금씩 진짜 자신의
    모습을 찾아가요. 알을 깨고 나오는 새처럼 낡은 세계를 벗어나야 진짜 자신이 될 수 있다는 깨달음을 얻게 되지요. 성장과 자아 발견을 다룬
    깊이 있는 이야기예요.
'9791164288847':
  title: 전지적 독자 시점
  summary: 김독자는 아무도 끝까지 읽지 않은 인터넷 소설 '멸망 이후의 세계'를 유일하게 완독한 독자예요. 그런데 어느 날 현실 세계가 갑자기
