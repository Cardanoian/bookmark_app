    매력을 찾아가는 이야기예요.
'9791165180829':
  title: 암호클럽
  summary: 네 명의 친구들이 모여 암호클럽을 만들고 마을에서 벌어지는 수수께끼 같은 사건을 해결해 나가는 이야기예요. 아이들은 다양한 암호와
    비밀 기호를 직접 풀어내며 사건의 실마리를 찾아가요. 추리와 암호 풀이가 함께 어우러져 읽는 재미와 두뇌 게임을 동시에 즐길 수 있어요. 우정과
    협동으로 사건을 해결하는 어린이 탐정단 이야기예요.
'9791190077439':
  title: 할머니의 용궁 여행
  summary: 손녀가 할머니에게 어디 갔다 오셨냐고 묻자, 할머니는 사실 용궁에 다녀왔다는 신기한 이야기를 들려줘요. 아프고 지친 할머니가 거북이를
    따라 바닷속 용궁으로 가서 젊음을 되찾을 뻔한 이야기가 펼쳐져요. 옛이야기 별주부전을 떠올리게 하는 재미난 상상과 유머가 가득해요. 할머니와
    손녀의 정겨운 대화 속에 삶을 따뜻하게 담아낸 그림책이에요.
'9788949144078':
  title: 배드 가이즈
  summary: 늑대, 뱀, 상어, 피라냐처럼 사람들에게 무섭게만 보이던 동물 친구들이 나오는 이야기예요. 이들은 나쁜 녀석이라는 이미지를 벗고
    착한 일을 해서 이미지를 바꾸기로 결심해요. 좌충우돌 끝에 이들은 서투르지만 진심으로 좋은 일을 하려고 애써요. 겉모습만 보고 판단하면 안
    된다는 메시지를 유쾌하게 전하는 이야기예요.
'9788936446734':
  title: 사자왕 형제의 모험 :아스트리드 린드그렌 장편동화
  summary: 몸이 약해 일찍 세상을 떠난 형 요나탄과 동생 카알이 죽음 이후 낭기열라라는 신비한 나라에서 다시 만나는 이야기예요. 그곳에서
    용감한 형제는 폭군에 맞서 싸우며 자유를 지키기 위한 모험을 떠나요. 서로를 아끼는 형제의 사랑과 용기가 이야기를 이끌어가요. 삶과 죽음,
    용기에 대해 깊이 생각하게 하는 판타지 동화예요.
'9788966074808':
  title: 와일드 로봇의 보호
  summary: 무인도에서 동물들과 함께 살아가던 로봇 로즈가 섬에 닥친 위험을 감지하면서 이야기가 시작돼요. 로즈는 자신이 키운 기러기 아들과
    섬의 동물 친구들을 지키기 위해 애써요. 다가오는 위협에 맞서 로즈와 동물들은 힘을 합쳐 지혜롭게 문제를 헤쳐나가요. 로봇과 동물들의 우정과
    보살핌을 그린 따뜻한 모험 이야기예요.
'9788934967453':
  title: 전지적 독자 시점 Part 4 01
  summary: 주인공 김독자는 오랫동안 봐온 인터넷 소설 속 세상이 현실이 되어버린 것을 알게 돼요. 소설의 결말까지 미리 알고 있는 사람은
    김독자뿐이라 그는 이 지식을 이용해 위기를 헤쳐나가야 해요. 소설 속 등장인물들과 함께 갑작스레 닥친 재난 같은 사건들을 헤쳐나가요. 오직
    한 사람만 아는 미래라는 독특한 설정이 흥미진진한 이야기예요.
'9791167790590':
  title: 중증외상센터 :골든아워
  summary: 실력은 뛰어나지만 병원에서 인정받지 못하던 외과 의사 백강혁이 낙후된 중증외상센터에 오면서 이야기가 시작돼요. 골든아워, 즉 생사를
    가르는 짧은 시간 안에 백강혁은 뛰어난 실력으로 위급한 환자들을 살려내요. 처음엔 무시당하지만 그의 실력이 알려지면서 주변 사람들의 시선이
    달라져요. 생명을 구하는 의료진의 치열한 하루를 그린 이야기예요.
'9788983925312':
  title: 해리포터 :마법사의 돌
  summary: 이모 집에서 구박받으며 살던 소년 해리는 자신이 마법사이며 호그와트 마법학교에 입학하게 된다는 사실을 알게 돼요. 그곳에서 친구
    론, 헤르미온느를 만나 우정을 쌓고 마법을 배워가요. 해리는 자신의 부모님을 죽인 어둠의 마법사와 얽힌 비밀을 하나씩 알아가요. 마법 세계에서
    펼쳐지는 소년의 첫 모험 이야기예요.
'9788955826418':
  title: 착한 달걀
  summary: 달걀 한 판 속에서 늘 착하고 완벽하게 행동하려 애쓰던 착한 달걀의 이야기예요. 다른 달걀들을 챙기느라 지친 착한 달걀은 결국
    몸에 금이 가고 말아요. 상처받은 착한 달걀은 잠시 혼자만의 시간을 가지며 자신을 돌보는 법을 배워요. 진짜 행복은 남을 위해서만이 아니라
    나를 아끼는 데서도 온다는 걸 알려주는 그림책이에요.
'9788932903507':
  title: 개미 :베르나르 베르베르 장편소설
  summary: 인간 사회와 개미 사회, 두 세계를 오가며 펼쳐지는 이야기예요. 삼촌에게서 이상한 유산을 물려받은 남자가 지하실의 비밀을 파헤치던
    중 위험에 빠지고, 한편 병정개미 103호는 인간이라는 미지의 존재를 탐험해요. 서로 다른 두 세계의 이야기가 점점 가까워지며 놀라운 진실이
    드러나요. 개미의 시선으로 세상을 낯설게 바라보게 하는 독특한 이야기예요.
'9791190305952':
  title: 유미의 세포들 =Yumi's cells
  summary: 평범한 직장인 유미의 마음속에는 감정과 생각을 담당하는 작은 세포들이 살고 있어요. 사랑 세포, 이성 세포, 감성 세포 같은 세포들이
    회의를 하며 유미의 하루하루를 이끌어가요. 연애와 일상 속에서 유미가 겪는 고민과 감정을 세포들의 시선으로 재미있게 보여줘요. 마음속 감정을
    캐릭터로 표현한 독특한 이야기예요.
