  summary: 지현이는 어느 날 신기한 뽑기 기계를 발견해요. 이 기계에서는 동그란 구슬 대신 특별한 날짜가 적힌 쪽지가 나와요. 지현이는 날짜를
    뽑아보면서 자신의 미래를 알고 바꾸려고 하죠. 하지만 뽑은 날짜 때문에 재미있거나 때로는 엉뚱한 일이 벌어지기도 해요. 이 책을 읽으면서 여러분은
    과연 정해진 운명을 바꿀 수 있을지, 아니면 자신의 선택이 더 중요한지 생각해보게 될 거예요. 지현이의 좌충우돌 날짜 뽑기 모험은 우리에게
    많은 웃음과 생각을 선물한답니다.
