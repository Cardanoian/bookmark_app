'9788934967460':
  title: 전지적 독자 시점 Part 4 02
  summary: 평범한 회사원 김독자는 아무도 끝까지 읽지 않은 웹소설 '멸망 후 살아남는 세 가지 방법'의 유일한 독자예요. 그런데 어느 날
    소설 속 내용 그대로 세상이 멸망하며 현실이 소설과 똑같이 변해 버려요. 김독자는 자신이 알고 있는 소설의 뒷이야기를 무기로 삼아, 소설 속
    주인공 유중혁과 함께 각종 시나리오와 괴물들을 헤쳐 나가요. 아무도 몰랐던 결말을 알고 있는 유일한 사람으로서 세상을 구하기 위해 고군분투하는
    이야기예요. 방대한 세계관과 반전이 매력적인 인기 웹소설 기반 작품이에요.
