'9788993055023':
  title: 윔피 키드 :그레그 헤플리의 카툰 일기
  summary: 중학생이 된 그레그 헤플리가 겪는 좌충우돌 학교생활을 그림일기 형식으로 재미있게 풀어낸 이야기예요. 인기 많은 아이가 되고 싶어
