'9788954651134':
  title: 흰 :한강 소설
  summary: 이 책은 눈, 강보, 흰 쌀밥, 달처럼 하얀 것들을 하나씩 떠올리며 짧은 글로 엮어 낸 특별한 소설이에요. 작가는 자신이 태어나기도
    전에 세상을 떠난 언니를 떠올리며 그 짧았던 생명을 하얀 것들에 빗대어 조용히 위로해요. 화려한 사건 대신 담담하고 시적인 문장으로 삶과 죽음,
    그리움을 그려 낸 것이 특징이에요. 짧지만 마음에 오래 남는 여운을 주는 작품이에요.
'9788957363010':
  title: "(만화로 보는)그리스 로마 신화"
  summary: 그리스 로마 신화는 하늘과 바다와 땅을 다스리는 제우스, 헤라, 포세이돈 같은 올림포스 신들의 이야기를 담고 있어요. 헤라클레스처럼
    힘센 영웅이 괴물을 무찌르는 모험담도 있고, 페르세우스가 메두사를 물리치는 이야기도 나와요. 신들끼리 다투기도 하고 인간을 돕거나 벌주기도
    하면서 벌어지는 다채로운 사건들이 흥미진진하게 펼쳐져요. 오랜 옛날 그리스와 로마 사람들이 세상이 어떻게 생겨났다고 믿었는지 엿볼 수 있는
    재미있는 이야기 모음집이에요.
'9791173470929':
  title: 열두 살에 부자가 된 키라
  summary: 키라는 집안 형편이 넉넉하지 않아서 돈 걱정을 많이 하는 열두 살 소녀예요. 어느 날 말을 할 줄 아는 신기한 개 머니를 만나게
    되면서 돈을 어떻게 벌고 모으고 불려 나가야 하는지 하나씩 배우게 돼요. 머니는 키라에게 큰 꿈을 갖고 목표를 세우는 것이 얼마나 중요한지도
    알려 줘요. 어린이의 눈높이에서 돈과 경제의 원리를 재미있게 배울 수 있는 이야기예요.
'9788962245202':
  title: "(제로니모의) 환상모험"
  summary: 신문사 사장이자 소심한 생쥐 제로니모는 우연히 신비한 환상의 왕국으로 떠나는 모험을 시작하게 돼요. 그곳에는 요정, 마법사, 용
    같은 신비한 존재들이 살고 있고, 제로니모는 왕국을 위협하는 위기를 해결하기 위해 길을 나서요. 겁 많은 제로니모지만 여행을 하며 조금씩 용기를
    내고 새로운 친구들의 도움도 받아요. 상상력 가득한 판타지 세계를 유쾌하게 그려 낸 제로니모 스틸턴 시리즈예요.
'9791158362836':
  title: 연이와 버들 도령
  summary: 가난한 집 딸 연이는 계모의 손에 이끌려 낯선 곳으로 팔려 가듯 보내지고, 그곳에서 사람을 해치려는 호랑이를 만나 위험에 처해요.
    나무 속에 숨어 사는 신비한 버들도령이 연이를 몰래 도와주면서 둘은 특별한 인연을 맺게 돼요. 연이는 버들도령의 도움과 자신의 지혜로 위기를
    하나씩 헤쳐 나가요. 우리 옛이야기를 바탕으로 백희나 작가가 그림으로 새롭게 되살린 아름다운 그림책이에요.
'9788992036962':
  title: 고백 :미나토 가나에 장편소설
  summary: 한 중학교 선생님은 자신이 가장 아끼던 어린 딸을 잃은 뒤, 그 일이 반 학생 중 누군가와 관련이 있다는 사실을 알게 돼요. 선생님은
    마지막 수업 시간에 담담한 목소리로 그동안 있었던 일을 하나씩 털어놓기 시작해요. 이어서 여러 등장인물들이 각자의 입장에서 그날의 사건을 다시
    이야기하면서 감춰졌던 진실이 조금씩 드러나요. 여러 사람의 시선으로 하나의 사건을 다르게 보여 주는 독특한 구성이 인상적인 소설이에요.
'9791136401250':
  title: 나 혼자만 레벨업 =추공 장편소설 /Only I level up
  summary: 진우는 몬스터를 사냥해 세상을 지키는 헌터들 중에서도 가장 약한 최하급 헌터로 늘 무시당해요. 어느 날 위험한 이중 던전에서 죽을
    뻔한 위기를 넘긴 진우는 자신에게만 보이는 신비한 시스템 창을 얻게 돼요. 그 시스템 덕분에 진우는 게임 캐릭터처럼 사냥을 할 때마다 점점
    더 강해지는 레벨업을 하게 돼요. 아무도 주목하지 않던 약자가 세상에서 가장 강한 존재로 성장해 가는 짜릿한 이야기예요.
'9788949140254':
  title: 롤러 걸
  summary: 애스트리드는 단짝 친구 니콜과 여름 방학을 늘 함께 보내 왔는데, 우연히 롤러 더비 경기를 보고 한눈에 반해 롤러 더비 캠프에
    등록해요. 그런데 니콜은 애스트리드를 따라오지 않고 발레 캠프를 선택하면서 두 사람의 사이는 조금씩 멀어져요. 애스트리드는 서툰 실력 때문에
    자주 넘어지고 좌절하지만 포기하지 않고 열심히 연습해서 조금씩 실력을 키워 나가요. 우정과 성장, 자기 자신을 찾아가는 과정을 씩씩하게 그려
    낸 그래픽노블이에요.
'9791173041730':
  title: 화산귀환
  summary: 화산파 최고의 고수였던 매화검존은 마지막 순간 제자들을 지키다가 목숨을 잃지만, 백 년 뒤 몰락한 화산파의 어리고 약한 제자의
    몸으로 다시 눈을 뜨게 돼요. 예전의 실력과 기억을 고스란히 간직한 그는 형편없이 기울어 버린 화산파를 다시 일으켜 세우기로 결심해요. 뛰어난
    무공 실력을 숨긴 채 사문의 사형제들과 부딪히고 강호의 여러 세력과도 맞서며 벌어지는 무협 이야기예요. 통쾌한 무공 대결과 의리가 돋보이는
    인기 만화예요.
'9788988027400':
  title: 죽은 시인의 사회
  summary: 엄격한 규율로 유명한 웰튼 아카데미에 새로 부임한 키팅 선생님은 학생들에게 정해진 답만 외우지 말고 스스로 생각하라고 가르쳐요.
    키팅 선생님은 카르페 디엠, 오늘을 즐기라는 말과 함께 시와 삶에 대한 열정을 학생들 마음에 심어 줘요. 학생들은 몰래 죽은 시인의 사회라는
    모임을 만들어 시를 읽고 자신의 꿈을 찾아가기 시작해요. 하지만 자유롭게 자신의 길을 찾으려던 한 학생의 선택이 큰 슬픔을 불러오면서 이야기는
    깊은 울림을 남겨요.
'9791130643151':
  title: 복면공주
  summary: 마그놀리아 공주는 낮에는 얌전하고 우아한 공주지만, 몬스터가 나타나면 검은 옷을 입고 복면공주로 변신해서 몬스터를 물리치는 비밀
    영웅이에요. 아무도 복면공주의 진짜 정체를 몰라야 하기 때문에 공주는 손님을 맞이하다가도 몰래 빠져나가 싸우고 다시 돌아오느라 늘 진땀을 빼요.
    어느 날 눈치 빠른 다른 공주가 자꾸 이상한 낌새를 알아차리면서 비밀을 들킬 위기에 처하기도 해요. 공주도 얼마든지 씩씩한 영웅이 될 수 있다는
    걸 유쾌하게 보여 주는 이야기예요.
'9788949121277':
  title: 말 안 하기 게임
  summary: 데이브네 반 아이들은 시끄럽다는 잔소리를 듣다가, 우연히 간디가 침묵으로 힘을 보여 줬다는 이야기를 듣고 이틀 동안 꼭 필요한
    말 빼고는 하지 않는 게임을 시작해요. 남학생과 여학생 두 편으로 나뉘어 누가 규칙을 더 잘 지키는지 은근한 경쟁을 벌이면서 교실은 조용하지만
    흥미진진해져요. 말을 하지 않다 보니 아이들은 오히려 서로를 더 잘 관찰하고 이해하게 되는 뜻밖의 변화를 겪어요. 재미있는 상황 속에서 말의
    소중함을 다시 생각하게 해 주는 이야기예요.
'9788925543239':
  title: 소년 셜록 홈즈
  summary: 아직 탐정이 되기 전, 십 대 소년인 셜록 홈즈는 여름 방학 동안 이모네 집에 머물게 돼요. 그러던 중 마을에서 벌어진 이상한
    죽음을 목격하고 호기심을 참지 못한 채 사건을 파헤치기 시작해요. 홈즈는 이 사건을 수사하며 훗날 위대한 탐정이 되는 데 필요한 관찰력과 추리력을
    하나씩 갈고닦아요. 우리가 아는 명탐정 셜록 홈즈가 어떻게 탄생했는지 상상해서 보여 주는 이야기예요.
'9788936434601':
  title: 위저드 베이커리 :구병모 장편소설
  summary: 말을 더듬는 소년은 가족에게 오해를 받고 힘든 일을 겪은 뒤, 우연히 신비한 빵집으로 숨어들게 돼요. 그 빵집은 사실 마법사가
    운영하는 곳으로, 원하는 소원을 이루어 주는 특별한 쿠키와 빵을 팔고 있었어요. 소년은 그곳에서 마법사와 여러 손님들을 만나며 소원에는 반드시
    대가가 따른다는 사실을 깨닫게 돼요. 상처받은 마음을 치유해 가는 과정을 판타지로 그려 낸 인상 깊은 청소년 소설이에요.
'9791171251230':
  title: 169층 나무 집
  summary: 앤디와 테리는 무려 169층짜리 어마어마한 나무 집에 살면서 출판사 사장님께 새 책 원고를 넘겨야 하는데, 자꾸 엉뚱한 일이 생겨서
    마감을 못 지켜요. 나무 집에는 볼링장, 트램펄린, 상어가 사는 수영장처럼 기상천외한 시설들이 층마다 가득해요. 두 친구는 정신없는 사건들을
    겪으며 우당탕탕 소동을 벌이지만 결국 이야기를 완성해 나가요. 기발한 상상력과 웃음이 가득한 인기 시리즈예요.
'9788949152516':
  title: "(과학탐험대) 신기한 스쿨버스"
  summary: 프리즐 선생님 반 친구들은 평범해 보이는 노란 스쿨버스를 타고 견학을 떠나지만, 이 버스는 순식간에 커지거나 작아지고 하늘을 날기도
    하는 신기한 마법 버스예요. 아이들은 버스를 타고 우주, 사람 몸속, 바닷속처럼 직접 갈 수 없는 곳까지 생생하게 탐험해요. 프리즐 선생님은
    늘 예상치 못한 방법으로 아이들에게 과학의 원리를 몸소 체험하게 해 줘요. 상상력 넘치는 모험을 통해 과학을 재미있게 배울 수 있는 인기 시리즈예요.
'9788955824384':
  title: 나쁜 씨앗
  summary: 해바라기 씨앗은 원래 착하고 명랑한 씨앗이었는데, 새에게 먹힐 뻔한 끔찍한 일을 겪은 뒤로 나쁜 행동만 골라서 하는 씨앗이 되어
    버려요. 새치기를 하고 인사도 안 하고 물건도 함부로 다루면서 스스로도 그런 자신이 마음에 들지 않아 괴로워해요. 결국 나쁜 씨앗은 조금씩
    노력해서 다시 예의 바르고 친절한 씨앗으로 돌아가기로 마음먹어요. 누구나 실수할 수 있지만 변화할 수도 있다는 걸 유쾌하게 알려 주는 그림책이에요.
'9791130691886':
  title: 복면공주
  summary: 마그놀리아 공주는 낮에는 얌전하고 우아한 공주지만, 몬스터가 나타나면 검은 옷을 입고 복면공주로 변신해서 몬스터를 물리치는 비밀
    영웅이에요. 아무도 복면공주의 진짜 정체를 몰라야 하기 때문에 공주는 손님을 맞이하다가도 몰래 빠져나가 싸우고 다시 돌아오느라 늘 진땀을 빼요.
    어느 날 눈치 빠른 다른 공주가 자꾸 이상한 낌새를 알아차리면서 비밀을 들킬 위기에 처하기도 해요. 공주도 얼마든지 씩씩한 영웅이 될 수 있다는
    걸 유쾌하게 보여 주는 이야기예요.
'9788901291420':
  title: 삼국지
  summary: 중국 한나라 말, 나라가 어지러워지자 유비, 관우, 장비는 도원결의를 맺고 의형제가 되어 큰 뜻을 품어요. 지혜로운 조조와 손권
    같은 영웅들도 저마다 세력을 키우며 천하를 차지하기 위해 다투게 돼요. 유비는 제갈량이라는 뛰어난 지략가를 얻어 촉나라를 세우고, 세 나라가
    서로 힘을 겨루는 파란만장한 이야기가 펼쳐져요. 의리와 지혜, 전략이 가득한 중국 최고의 역사 이야기예요.
'9791164284016':
  title: 전지적 독자 시점
  summary: 김독자는 인터넷 소설 멸망한 세계에서 살아남는 방법을 유일하게 끝까지 읽은 독자였는데, 어느 날 소설 속 무서운 사건들이 실제
    현실에서 그대로 벌어지기 시작해요. 김독자는 소설의 결말과 앞으로 일어날 일들을 미리 알고 있다는 것을 무기 삼아 위기를 하나씩 헤쳐 나가요.
    소설의 진짜 주인공이었던 유중혁과 함께 힘을 합쳐 멸망해 가는 세상에서 살아남으려 애써요. 자신이 읽던 이야기 속으로 들어가 버린다는 상상력
    넘치는 설정이 돋보이는 인기작이에요.
'9791164284023':
  title: 전지적 독자 시점
  summary: 김독자는 인터넷 소설 멸망한 세계에서 살아남는 방법을 유일하게 끝까지 읽은 독자였는데, 어느 날 소설 속 무서운 사건들이 실제
    현실에서 그대로 벌어지기 시작해요. 김독자는 소설의 결말과 앞으로 일어날 일들을 미리 알고 있다는 것을 무기 삼아 위기를 하나씩 헤쳐 나가요.
    소설의 진짜 주인공이었던 유중혁과 함께 힘을 합쳐 멸망해 가는 세상에서 살아남으려 애써요. 자신이 읽던 이야기 속으로 들어가 버린다는 상상력
    넘치는 설정이 돋보이는 인기작이에요.
'9791130630809':
  title: 중증외상센터 골든 아워 =Golden hour
  summary: 백강혁은 실력이 뛰어나지만 괴짜 같은 외상외과 의사로, 위험한 지역에서 용병 의사로 활동하다가 한국으로 돌아와요. 그는 낙후된
    중증외상센터에 자리를 잡고, 촌각을 다투는 위급한 환자들을 과감하고 파격적인 방법으로 살려 내기 시작해요. 함께 일하는 후배 의사들은 처음엔
    그의 거침없는 방식에 당황하지만 점점 진짜 실력과 진심을 알아보게 돼요. 생명을 구하는 골든 아워의 긴박함을 실감 나게 그려 낸 의학 이야기예요.
'9788934967507':
  title: 전지적 독자 시점 Part 5 02
  summary: 김독자는 인터넷 소설 멸망한 세계에서 살아남는 방법을 유일하게 끝까지 읽은 독자였는데, 어느 날 소설 속 무서운 사건들이 실제
    현실에서 그대로 벌어지기 시작해요. 김독자는 소설의 결말과 앞으로 일어날 일들을 미리 알고 있다는 것을 무기 삼아 위기를 하나씩 헤쳐 나가요.
    소설의 진짜 주인공이었던 유중혁과 함께 힘을 합쳐 멸망해 가는 세상에서 살아남으려 애써요. 자신이 읽던 이야기 속으로 들어가 버린다는 상상력
    넘치는 설정이 돋보이는 인기작이에요.
'9788949144177':
  title: 배드 가이즈
  summary: 늑대 씨, 뱀 씨, 상어 씨, 피라냐 씨는 겉모습이 무섭게 생겨서 늘 나쁜 녀석들이라는 오해를 받아 온 친구들이에요. 어느 날
    이들은 마음을 바꿔서 이제부터는 착한 일을 하는 착한 녀석들이 되기로 결심해요. 하지만 오랫동안 몸에 밴 습관 때문에 착한 일을 하려다가도
    자꾸 엉뚱하고 우스꽝스러운 사고를 치고 말아요. 겉모습만 보고 판단하면 안 된다는 교훈을 유쾌한 소동극으로 보여 주는 이야기예요.
'9788965793205':
  title: 빨간 머리 앤
  summary: 초록 지붕 집에 사는 남매 매튜와 마릴라는 일손을 도울 남자아이를 입양하려 했는데, 실수로 상상력 넘치는 빨간 머리 소녀 앤이
    오게 돼요. 처음엔 돌려보내려 했지만 씩씩하고 사랑스러운 앤의 모습에 두 사람은 결국 앤을 딸처럼 키우기로 해요. 앤은 에이번리 마을에서 단짝
    친구 다이애나를 사귀고, 라이벌이던 길버트와도 특별한 사이가 되며 씩씩하게 자라나요. 실수투성이지만 밝고 긍정적인 앤의 성장을 그린 전 세계인이
    사랑하는 고전이에요.
'9788965793250':
  title: 소공녀 세라
  summary: 부유한 상인의 딸 세라는 런던의 기숙학교에서 공주처럼 귀한 대접을 받으며 지내지만, 아버지가 갑자기 돌아가시고 재산까지 잃으면서
    하루아침에 하녀 신세가 돼요. 학교 원장 민친 선생님은 세라를 심하게 부려 먹지만, 세라는 힘든 상황 속에서도 상상력을 잃지 않고 품위와 친절함을
    지켜 나가요. 다락방에서 굶주리고 추위에 떨면서도 세라는 다른 어려운 친구들에게 먼저 손을 내밀어요. 결국 아버지의 친구를 만나 잃어버렸던
    행복을 되찾게 되는 감동적인 이야기예요.
'9788949124216':
  title: 셜록 홈즈
  summary: 셜록 홈즈는 런던에 사는 최고의 명탐정으로, 친구인 왓슨 박사와 함께 어려운 사건들을 해결해요. 홈즈는 작은 단서 하나도 놓치지
    않는 날카로운 관찰력과 추리력으로 범인을 척척 찾아내요. 사라진 보석부터 이상한 사건까지 다양한 미스터리가 등장해서 읽는 내내 손에 땀을 쥐게
    해요. 논리적으로 생각하는 재미를 알려 주는 세계적으로 유명한 추리 소설이에요.
'9788932923048':
  title: 수확자 :닐 셔스터먼 장편소설
  summary: 미래 세상은 질병도 죽음도 대부분 사라져서 사람들이 늙거나 아파서 죽는 일이 없어졌지만, 인구가 너무 많아지지 않도록 수확자라는
    사람들이 공식적으로 사람의 생명을 거두는 일을 해요. 시트라와 로완은 우연히 수확자 페러데이의 견습생으로 뽑혀 수확자가 되는 훈련을 받게 돼요.
    둘 중 한 사람만 진짜 수확자가 될 수 있다는 규칙 때문에 둘은 어쩔 수 없이 경쟁해야 하는 힘든 상황에 놓여요. 삶과 죽음, 권력의 의미를
    진지하게 되묻는 청소년 SF 소설이에요.
'9791167552082':
  title: 죽이고 싶은 아이 (한정판 썸머 에디션)
  summary: 같은 반 인기 많던 소녀 서연이 갑자기 죽은 채 발견되고, 사건 현장에서 발견된 단짝 친구 주은이 가장 유력한 용의자로 몰려요.
    주은은 정작 그날 밤 자신에게 무슨 일이 있었는지 기억하지 못한 채 억울하게 사람들의 의심을 받게 돼요. 이야기는 서연과 주은, 그리고 주변
    사람들의 시선을 번갈아 보여 주면서 진짜 진실이 무엇인지 서서히 밝혀 나가요. 우정 속에 감춰져 있던 복잡한 감정과 진실을 파헤치는 긴장감
    넘치는 청소년 소설이에요.
'9788934995494':
  title: 잘못 뽑은 전교 회장
  summary: 말썽꾸러기로 소문난 한 남학생은 친구들과 장난삼아 전교 회장 선거에 후보로 나갔다가 얼떨결에 정말로 당선되고 말아요. 반면 성실하고
    회장이 될 자신이 있던 여학생은 예상 밖의 결과에 속상해하다가 부회장을 맡게 돼요. 전교 회장이 된 말썽꾸러기 소년은 처음엔 책임감 없이 굴지만,
    여러 사건을 겪으며 조금씩 회장다운 모습으로 변해 가요. 예상 밖의 인물이 진짜 리더로 성장해 가는 과정을 유쾌하게 그린 어린이 소설이에요.
'9788930264914':
  title: 오싹오싹 좀비 금붕어
  summary: 톰의 형은 과학 실험을 좋아하는데, 실수로 자기가 기르던 금붕어에게 이상한 화학 약품을 쏟고 말아요. 그 약품 때문에 금붕어는
    좀비처럼 변해서 앞을 못 보고도 냄새로 다른 물고기를 쫓아다니는 무시무시한 존재가 되어 버려요. 톰과 형은 좀비 금붕어가 학교 수족관의 다른
    물고기들까지 위험하게 만들기 전에 문제를 해결하려고 고군분투해요. 엉뚱하고 유쾌한 상상력이 돋보이는 과학 소동극이에요.
'9788949144160':
  title: 배드 가이즈
  summary: 늑대 씨, 뱀 씨, 상어 씨, 피라냐 씨는 겉모습이 무섭게 생겨서 늘 나쁜 녀석들이라는 오해를 받아 온 친구들이에요. 어느 날
    이들은 마음을 바꿔서 이제부터는 착한 일을 하는 착한 녀석들이 되기로 결심해요. 하지만 오랫동안 몸에 밴 습관 때문에 착한 일을 하려다가도
    자꾸 엉뚱하고 우스꽝스러운 사고를 치고 말아요. 겉모습만 보고 판단하면 안 된다는 교훈을 유쾌한 소동극으로 보여 주는 이야기예요.
'9791130691893':
  title: 복면공주
  summary: 마그놀리아 공주는 낮에는 얌전하고 우아한 공주지만, 몬스터가 나타나면 검은 옷을 입고 복면공주로 변신해서 몬스터를 물리치는 비밀
    영웅이에요. 아무도 복면공주의 진짜 정체를 몰라야 하기 때문에 공주는 손님을 맞이하다가도 몰래 빠져나가 싸우고 다시 돌아오느라 늘 진땀을 빼요.
    어느 날 눈치 빠른 다른 공주가 자꾸 이상한 낌새를 알아차리면서 비밀을 들킬 위기에 처하기도 해요. 공주도 얼마든지 씩씩한 영웅이 될 수 있다는
    걸 유쾌하게 보여 주는 이야기예요.
'9791198610614':
  title: 알사탕 :백희나 그림책
  summary: 친구가 별로 없어 늘 혼자 노는 동동이는 문방구에서 신기한 사탕을 하나 사게 돼요. 그 사탕을 입에 넣을 때마다 소파, 강아지,
    심지어 돌아가신 할머니의 마음속 목소리까지 들리기 시작해요. 동동이는 사탕 덕분에 주변 사람들의 진짜 마음을 알게 되면서 조금씩 마음을 열고
    다른 사람과 가까워지는 법을 배워요. 마지막에는 처음 보는 친구에게 먼저 다가가 말을 거는 용기도 내게 되는 따뜻한 그림책이에요.
'9788965793281':
  title: 왕자와 거지
  summary: 얼굴이 똑같이 생긴 영국 왕자 에드워드와 가난한 거지 소년 톰은 우연히 만나 장난삼아 서로 옷을 바꿔 입어 봐요. 그런데 뜻하지
    않게 서로의 자리가 바뀌어 버려서, 왕자는 거리에서 배고픔과 멸시를 겪고 톰은 궁전에서 낯선 왕자 노릇을 하게 돼요. 왕자는 거리를 떠돌며
    백성들의 힘든 삶을 직접 겪으면서 진짜 왕이 갖춰야 할 마음가짐을 배우게 돼요. 결국 신분을 되찾은 왕자는 예전보다 훨씬 지혜롭고 자비로운
    왕이 된다는 이야기예요.
'9788983925374':
  title: 해리포터 :불의 잔
  summary: 해리는 호그와트 마법학교 4학년이 되는데, 원래는 열일곱 살이 넘어야 참가할 수 있는 위험한 트라이위저드 대회에 자기도 모르게
    참가자로 뽑혀 버려요. 해리는 사나운 용을 상대하고 호수 속 인어들을 만나며 목숨을 건 어려운 과제들을 하나씩 헤쳐 나가야 해요. 대회가 진행되는
    동안 볼드모트를 부활시키려는 무서운 음모가 숨어서 진행되고 있었다는 사실이 서서히 드러나요. 결국 대회의 마지막 순간, 해리는 볼드모트의 부활과
    마주하게 되는 시리즈의 중요한 전환점이에요.
'9788949186221':
  title: 마법의 시간여행
  summary: 잭과 애니 남매는 숲속에서 책이 가득한 신비한 나무 집을 발견하고, 그림을 가리키며 소원을 빌면 그 시대와 장소로 순식간에 이동한다는
    사실을 알게 돼요. 두 사람은 공룡이 살던 시대나 옛날 이집트처럼 낯설고 신기한 곳으로 모험을 떠나요. 낯선 시대에서 위험한 상황을 만나기도
    하지만, 지혜와 용기로 문제를 해결하고 무사히 집으로 돌아와요. 역사와 과학 지식을 모험 이야기 속에서 재미있게 배울 수 있는 인기 시리즈예요.
'9791130664408':
  title: 복면공주 11 - 못 말리는 고양이
  summary: 마그놀리아 공주는 낮에는 얌전하고 우아한 공주지만, 몬스터가 나타나면 검은 옷을 입고 복면공주로 변신해서 몬스터를 물리치는 비밀
    영웅이에요. 아무도 복면공주의 진짜 정체를 몰라야 하기 때문에 공주는 손님을 맞이하다가도 몰래 빠져나가 싸우고 다시 돌아오느라 늘 진땀을 빼요.
    어느 날 눈치 빠른 다른 공주가 자꾸 이상한 낌새를 알아차리면서 비밀을 들킬 위기에 처하기도 해요. 공주도 얼마든지 씩씩한 영웅이 될 수 있다는
    걸 유쾌하게 보여 주는 이야기예요.
'9788961559881':
  title: 파브르 곤충기
  summary: 파브르는 어린 시절부터 곤충을 좋아해서 평생 동안 여러 곤충들을 직접 관찰하며 연구한 과학자예요. 이 책에는 쇠똥구리가 열심히
    똥을 굴리는 모습, 사마귀의 사냥법, 매미가 우는 이유처럼 곤충들의 신기한 생활 모습이 자세히 담겨 있어요. 파브르는 실험실이 아니라 직접
    자연 속에서 곤충을 관찰하며 생생한 이야기를 들려줘요. 작은 곤충들의 세계가 얼마나 신비롭고 흥미로운지 알게 해 주는 고전 과학책이에요.
'9788965793564':
  title: 괴도 아르센 뤼팽
  summary: 아르센 뤼팽은 프랑스를 무대로 활약하는 괴도로, 부자나 나쁜 사람들의 값진 보물을 감쪽같이 훔치는 신출귀몰한 도둑이에요. 뛰어난
    변장술과 재치 있는 두뇌로 경찰과 탐정들을 늘 한발 앞서 따돌리며 짜릿한 모험을 벌여요. 나쁜 짓을 하는 것 같으면서도 나름의 의리와 매력을
    지닌 뤼팽의 활약에 독자들은 통쾌함을 느껴요. 프랑스 추리소설의 고전으로 사랑받는 괴도 이야기예요.
'9788936433871':
  title: 두근두근 내 인생 :김애란 장편소설
  summary: 아름이는 또래보다 몸이 훨씬 빨리 늙어 버리는 희귀한 병을 가지고 태어난 열여섯 살 소년이에요. 열일곱 어린 나이에 아름이를 낳은
    부모님은 아름이를 진심으로 사랑하며 함께 어려운 시간을 헤쳐 나가요. 아름이는 몸은 힘들지만 유머와 지혜로 삶과 죽음에 대해 담담하게 이야기를
    들려줘요. 짧지만 강렬한 삶 속에서도 사랑과 희망을 잃지 않는 가족의 이야기가 깊은 감동을 줘요.
'9788965480440':
  title: 초한지
  summary: 진나라가 무너진 뒤, 초나라의 항우와 한나라의 유방은 천하를 차지하기 위해 치열하게 맞서 싸워요. 항우는 힘이 세고 용맹한 장수였지만
    유방은 지략이 뛰어난 신하들의 도움을 받아 조금씩 세력을 넓혀 가요. 두 영웅의 팽팽한 대결은 여러 번 엎치락뒤치락하며 계속되고, 결국 유방이
    승리해 한나라를 세우게 돼요. 영웅들의 지혜와 용맹이 가득한 중국 고대 역사 이야기예요.
'9788983925404':
  title: 해리포터 :불의 잔
  summary: 해리는 호그와트 마법학교 4학년이 되는데, 원래는 열일곱 살이 넘어야 참가할 수 있는 위험한 트라이위저드 대회에 자기도 모르게
    참가자로 뽑혀 버려요. 해리는 사나운 용을 상대하고 호수 속 인어들을 만나며 목숨을 건 어려운 과제들을 하나씩 헤쳐 나가야 해요. 대회가 진행되는
    동안 볼드모트를 부활시키려는 무서운 음모가 숨어서 진행되고 있었다는 사실이 서서히 드러나요. 결국 대회의 마지막 순간, 해리는 볼드모트의 부활과
    마주하게 되는 시리즈의 중요한 전환점이에요.
'9788992008976':
  title: 까만 아기 양
  summary: 하얀 양들만 가득한 목장에서 까만 아기 양은 색깔이 다르다는 이유로 다른 양들과 잘 어울리지 못해요. 그러던 어느 날 양들이 위험에
    빠졌을 때, 남들과 다르게 생긴 까만 아기 양 덕분에 오히려 모두가 위기를 벗어나게 돼요. 다르게 생겼다고 무시당하던 까만 아기 양은 자신만의
    특별함이 얼마나 소중한지 깨닫게 돼요. 서로 다른 모습도 소중하다는 것을 알려 주는 따뜻한 그림책이에요.
'9788965793632':
  title: 안네의 일기
  summary: 유대인 소녀 안네 프랑크는 나치의 박해를 피해 가족과 함께 네덜란드 암스테르담의 비밀 다락방에 숨어 지내야 했어요. 안네는 좁고
    답답한 공간에서 두려움 속에 지내면서도 일기장에 자신의 생각과 꿈, 일상을 솔직하게 적어 나가요. 안네는 언젠가 전쟁이 끝나면 작가가 되고
    싶다는 꿈을 품고 희망을 잃지 않으려 애써요. 안타깝게도 안네는 전쟁이 끝나기 직전 목숨을 잃지만, 아버지가 이 일기를 책으로 펴내면서 전
    세계 사람들에게 큰 울림을 주었어요.
'9788955826548':
  title: 멋진 콩
  summary: 콩 마을에서 다른 콩들은 다 멋지고 인기가 많은데, 이 콩만은 특별한 것 없이 평범해서 자기가 별로라고 생각해요. 멋져 보이려고
    남을 따라 해 보기도 하지만 오히려 더 어색하고 불편하기만 해요. 결국 이 콩은 남을 따라 하지 않고 자기다운 모습 그대로 지내기로 마음먹으면서
    비로소 편안하고 행복해져요. 있는 그대로의 나도 충분히 멋지다는 걸 알려 주는 그림책이에요.
'9791130691879':
  title: 복면공주
  summary: 마그놀리아 공주는 낮에는 얌전하고 우아한 공주지만, 몬스터가 나타나면 검은 옷을 입고 복면공주로 변신해서 몬스터를 물리치는 비밀
    영웅이에요. 아무도 복면공주의 진짜 정체를 몰라야 하기 때문에 공주는 손님을 맞이하다가도 몰래 빠져나가 싸우고 다시 돌아오느라 늘 진땀을 빼요.
    어느 날 눈치 빠른 다른 공주가 자꾸 이상한 낌새를 알아차리면서 비밀을 들킬 위기에 처하기도 해요. 공주도 얼마든지 씩씩한 영웅이 될 수 있다는
    걸 유쾌하게 보여 주는 이야기예요.
'9788965794530':
  title: 오만과 편견
  summary: 엘리자베스 베넷은 첫인상이 거만해 보이는 부자 신사 다아시를 못마땅하게 여기며 편견을 갖게 돼요. 언니 제인은 다정한 빙리와 사랑에
    빠지지만 여러 오해 때문에 둘 사이가 어긋나기도 해요. 엘리자베스는 다아시에 대한 오해가 하나씩 풀리면서 자신의 편견을 되돌아보게 되고, 다아시
    역시 자신의 오만함을 깨달아요. 서로에 대한 편견과 오해를 극복하고 진짜 사랑을 찾아가는 영국의 대표 고전 소설이에요.
'9780810987999':
  title: Diary of a wimpy kid
  summary: 그레그 헤플리는 중학교에 갓 입학한 평범한 소년으로, 친구들 사이에서 인기를 얻고 싶어 하지만 일이 자꾸 엉뚱하게 꼬여요. 그레그는
    자기보다 힘센 형 로드릭과 늘 티격태격하고, 단짝 친구 롤리와 함께 여러 황당한 사건에 휘말려요. 잘난 척하다가 망신을 당하기도 하고, 게으름을
    피우다 곤란해지기도 하는 등 웃음이 끊이지 않는 일상이 그림일기 형식으로 펼쳐져요. 유머러스한 그림과 함께 사춘기 소년의 학교생활을 재치 있게
    그린 인기 시리즈예요.
'9788954683371':
  title: H마트에서 울다
  summary: 한국인 어머니와 미국인 아버지 사이에서 태어난 작가는 어머니가 암으로 세상을 떠난 뒤, 한인 마트인 H마트에 갈 때마다 어머니가
    떠올라 눈물을 흘리게 돼요. 작가는 어릴 적 어머니와 함께 먹던 김치와 여러 한국 음식들을 다시 만들어 보며 어머니와의 추억을 하나씩 되짚어요.
    음식을 매개로 어머니를 그리워하고 자신의 한국인 정체성을 다시 찾아가는 과정을 진솔하게 담아냈어요. 사랑하는 사람을 잃은 슬픔과 그리움을 음식과
    함께 풀어낸 감동적인 에세이예요.
'9791167770028':
  title: 나 혼자만 레벨업
  summary: 진우는 몬스터를 사냥해 세상을 지키는 헌터들 중에서도 가장 약한 최하급 헌터로 늘 무시당해요. 어느 날 위험한 이중 던전에서 죽을
    뻔한 위기를 넘긴 진우는 자신에게만 보이는 신비한 시스템 창을 얻게 돼요. 그 시스템 덕분에 진우는 게임 캐릭터처럼 사냥을 할 때마다 점점
    더 강해지는 레벨업을 하게 돼요. 아무도 주목하지 않던 약자가 세상에서 가장 강한 존재로 성장해 가는 짜릿한 이야기예요.
'9788954674058':
  title: 정년이
  summary: 목포에서 살던 소녀 정년이는 뛰어난 소리 실력을 가지고 있지만 형편이 어려워 꿈을 마음껏 펼치지 못해요. 서울로 올라간 정년이는
    우리나라 전통 공연인 국극 단체에 들어가 본격적으로 배우의 길을 걷기 시작해요. 실력 있는 라이벌들과 부딪히고 좌절도 겪지만 타고난 재능과
    노력으로 조금씩 무대의 주인공으로 성장해 나가요. 꿈을 향해 씩씩하게 나아가는 정년이의 이야기가 감동을 주는 작품이에요.
'9791192529974':
  title: 샤일로
  summary: 마티는 이웃 아저씨 저드가 심하게 괴롭히는 비글 강아지 샤일로를 우연히 만나게 돼요. 샤일로가 불쌍해서 몰래 숨겨 키우지만 결국
    들통이 나고 말아요. 마티는 샤일로를 진짜 자기 강아지로 만들기 위해 저드 아저씨와 힘든 협상을 벌여요. 힘들게 일하고 정직하게 노력한 끝에
    마티는 샤일로를 지켜낼 수 있게 돼요. 동물을 사랑하는 마음과 옳은 일을 하려는 용기를 느낄 수 있는 이야기예요.
'9788947528658':
  title: "(어린이를 위한) 바보 빅터 =17년 동안 바보로 살았던 멘사 회장의 이야기 /Victor, the fool for kids"
  summary: 어린 시절 아이큐 검사에서 실수로 73이라는 점수를 받은 빅터는 바보라는 오해를 받으며 자라요. 무려 17년 동안 자신이 정말
    바보인 줄 알고 살아가지요. 그러다 우연히 자신의 진짜 아이큐가 173이라는 놀라운 사실을 알게 돼요. 빅터는 좌절하지 않고 자신감을 되찾아
    훗날 멘사 회장까지 되는 놀라운 인생을 살아요. 다른 사람의 말보다 자기 자신을 믿는 것이 얼마나 중요한지 알려 주는 이야기예요.
'9788934967316':
  title: 전지적 독자 시점 =part 1 /Omniscient reader's viewpoint
  summary: 김독자는 아무도 끝까지 읽지 않은 인터넷 소설 '멸망 이후의 세계'를 유일하게 완독한 독자예요. 그런데 어느 날 현실 세계가 갑자기
    그 소설 속 이야기처럼 변하면서 무서운 시나리오들이 펼쳐지기 시작해요. 김독자는 소설 내용을 미리 알고 있다는 사실을 이용해서 위기를 하나씩
    헤쳐 나가요. 소설 속 등장인물들과 함께 힘을 합쳐 멸망해 가는 세상에서 살아남으려 애써요. 지식과 용기로 위기를 극복하는 통쾌한 이야기예요.
'9788965794219':
  title: 로미오와 줄리엣
  summary: 원수 집안인 몬터규 가문의 로미오와 캐풀렛 가문의 줄리엣은 무도회에서 만나 첫눈에 사랑에 빠져요. 두 집안이 서로 미워하는 사이라
    둘은 몰래 사랑을 키우며 비밀 결혼까지 하게 돼요. 하지만 여러 가지 오해와 불행한 사건들이 겹치면서 두 사람의 사랑은 큰 위기를 맞아요.
    결국 두 사람은 비극적인 죽음을 맞이하고 말아요. 두 집안은 그제야 서로 화해하게 되는, 슬프지만 유명한 사랑 이야기예요.
'9788952791160':
  title: 날씨가 좋으면 찾아가겠어요 :이도우 장편소설
  summary: 혜원은 서울 생활에 지쳐 고향인 북현면으로 내려와 이모의 헌책방 겸 카페를 함께 운영하게 돼요. 그곳에서 어린 시절 첫사랑이자
    오랜 친구인 은섭을 다시 만나게 되지요. 두 사람은 서로에게 남아 있던 상처와 오해를 하나씩 풀어가요. 고향 사람들과 소소한 일상을 보내며
    마음의 힘든 기억들을 천천히 치유해 나가요. 따뜻한 위로와 잔잔한 사랑을 느낄 수 있는 이야기예요.
'9788954671422':
  title: 정년이
  summary: 정년이는 목포에서 소리를 기막히게 잘하는 소녀로, 엄마의 반대를 무릅쓰고 여성국극단에 들어가기로 결심해요. 낯선 서울살이와 치열한
    경쟁 속에서도 타고난 재능과 노력으로 하나씩 인정을 받아가요. 라이벌들과 부딪히고 좌절도 겪지만 포기하지 않고 무대에 서는 꿈을 이어가요.
    결국 정년이는 여성국극의 스타로 성장하며 많은 사람들에게 감동을 줘요. 꿈을 향한 열정과 노력의 소중함을 보여 주는 이야기예요.
'9788983925381':
  title: 해리포터 :불의 잔
  summary: 호그와트 4학년이 된 해리는 세 학교가 겨루는 트리위저드 대회에 나이 제한에도 불구하고 참가하게 돼요. 용, 인어, 미로 같은
    위험한 과제들을 헤쳐 나가며 우정과 용기를 시험받아요. 대회 마지막 과제에서 해리는 라이벌 세드릭과 함께 트로피에 손을 대는 순간 무서운 곳으로
    순간이동을 하게 돼요. 그곳에서 강력해진 어둠의 마법사 볼드모트가 부활하는 장면을 목격하고 말아요. 어둠과의 싸움이 본격적으로 시작되는 긴장감
    넘치는 이야기예요.
'9788983925343':
  title: 해리포터 :비밀의 방
  summary: 호그와트 2학년이 된 해리는 학교에 숨겨진 '비밀의 방'이 열리면서 벌어지는 무서운 사건에 휘말리게 돼요. 학생들이 하나둘 알
    수 없는 힘에 의해 돌처럼 굳어버리는 일이 계속 일어나요. 해리는 지니가 정체불명의 일기장에 흘려서 위험에 빠진 것을 알게 돼요. 해리는 그리핀도르의
    검을 들고 방 안에 숨어 있던 무시무시한 바실리스크와 맞서 싸워요. 결국 친구들을 구하고 학교에 숨겨진 비밀을 풀어내는 통쾌한 이야기예요.
'9788925559483':
  title: 거인 부벨라와 지렁이 친구
  summary: 몸집이 커다란 부벨라는 마을 사람들이 모두 무서워해서 늘 혼자 외롭게 지내요. 어느 날 부벨라는 자신을 전혀 무서워하지 않는 작은
    지렁이를 만나게 돼요. 눈이 보이지 않는 지렁이는 부벨라가 얼마나 큰지 알지 못해서 편하게 친구가 되어 줘요. 부벨라는 처음으로 진짜 친구가
    생긴 것에 큰 기쁨을 느껴요. 겉모습이 아니라 마음으로 친구를 사귀는 게 얼마나 소중한지 알려 주는 이야기예요.
'9791171175956':
  title: 장난천재 쾌걸 조로리
  summary: 여우 조로리는 멋진 장난의 왕이 되겠다는 꿈을 안고 부하 멧돼지 형제 이시시, 노시시와 함께 여행을 떠나요. 장난꾸러기처럼 보이지만
    사실은 마음씨가 따뜻하고 재치가 넘치는 캐릭터예요. 가는 곳마다 기발한 장난을 계획하지만 뜻대로 되지 않고 우스꽝스러운 소동이 벌어져요. 그
    과정에서 곤경에 빠진 사람들을 도와주며 뜻밖에 좋은 일을 하게 되기도 해요. 유쾌한 웃음과 함께 따뜻한 마음을 배울 수 있는 이야기예요.
'9788961707183':
  title: 캡틴 언더팬츠
  summary: 조지와 해럴드는 짓궂은 장난을 좋아하는 단짝 친구로, 무서운 교장 선생님을 최면에 걸리게 만들어요. 최면에 걸린 교장 선생님은
    자신을 팬티만 입은 슈퍼히어로 캡틴 언더팬츠라고 믿게 돼요. 캡틴 언더팬츠는 엉뚱하지만 진짜 악당들과 맞서 싸우며 사건을 해결해요. 두 친구는
    교장 선생님을 원래대로 되돌리기 위해 애를 먹으면서도 함께 모험을 즐겨요. 유쾌하고 엉뚱한 웃음이 가득한 이야기예요.
'9788949144184':
  title: 배드 가이즈
  summary: 늑대 아저씨, 뱀 아저씨, 상어 아저씨, 피라냐 아저씨는 겉모습 때문에 늘 나쁜 녀석들이라는 오해를 받아요. 이들은 사람들에게
    착한 모습을 보여 주기 위해 좋은 일을 하기로 마음먹어요. 처음에는 좋은 일이 서툴러서 자꾸 엉뚱한 사고를 치고 말아요. 그래도 포기하지 않고
    진짜 착한 영웅이 되기 위해 노력해요. 겉모습만 보고 판단하면 안 된다는 걸 유쾌하게 알려 주는 이야기예요.
'9791164285433':
  title: 전지적 독자 시점
  summary: 김독자는 아무도 끝까지 읽지 않은 인터넷 소설 '멸망 이후의 세계'를 유일하게 완독한 독자예요. 그런데 어느 날 현실 세계가 갑자기
    그 소설 속 이야기처럼 변하면서 무서운 시나리오들이 펼쳐지기 시작해요. 김독자는 소설 내용을 미리 알고 있다는 사실을 이용해서 위기를 하나씩
    헤쳐 나가요. 소설 속 등장인물들과 함께 힘을 합쳐 멸망해 가는 세상에서 살아남으려 애써요. 지식과 용기로 위기를 극복하는 통쾌한 이야기의
    만화판이에요.
'9791164289608':
  title: 전지적 독자 시점
  summary: 김독자는 아무도 끝까지 읽지 않은 인터넷 소설 '멸망 이후의 세계'를 유일하게 완독한 독자예요. 그런데 어느 날 현실 세계가 갑자기
