'9791168418462':
  title: 슈뻘맨의 숨은 과학 찾기 :엉뚱 도전 속에 숨은 과학 상식
  summary: 이 책은 인기 유튜버 슈뻘맨과 함께 재미있는 과학을 배우는 책이에요. 슈뻘맨이 신기하고 엉뚱한 여러 가지 도전을 할 때, 그 속에
    숨어있는 과학 원리들을 알기 쉽게 설명해 준답니다. 예를 들어, 높이 쌓기 도전이나 특별한 재료 실험 같은 것들을 통해 우리 주변의 과학 현상을
