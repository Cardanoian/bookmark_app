'9788983927637':
  title: 해리포터 :마법사의 돌
  summary: 이모네 집 계단 밑 벽장에서 구박받으며 살던 해리는 열한 살 생일에 자신이 마법사라는 사실을 알게 돼요. 호그와트 마법학교에 입학한
    해리는 론, 헤르미온느와 둘도 없는 친구가 되지요. 셋은 학교 안에 숨겨진 수상한 비밀을 파헤치며 마법사의 돌을 지키려는 모험에 뛰어들어요.
    그 과정에서 자신의 부모님을 죽인 어둠의 마법사 볼드모트의 그림자와도 마주하게 돼요.
'9788949144016':
  title: 배드 가이즈
  summary: 늑대, 뱀, 피라냐, 상어처럼 사람들이 무서워하는 동물 친구들이 모여 '배드 가이즈' 클럽을 만들어요. 겉모습 때문에 늘 나쁜
    놈 취급을 받던 이들은 오히려 착한 일을 해서 사람들의 오해를 풀기로 결심하지요. 동물 보호소의 개들을 구하러 가는 등 서투르지만 진심 어린
    선행을 벌여요. 티격태격하면서도 진짜 좋은 친구, 좋은 편이 되어가는 유쾌한 이야기예요.
'9791196458676':
  title: 오무라이스 잼잼 :경이로운 일상음식 이야기
  summary: 작가가 좋아하는 여러 음식과 요리에 얽힌 소소한 이야기를 그림과 함께 들려주는 에세이 만화예요. 평범한 요리 하나에도 숨어 있는
    재미있는 유래나 특별한 추억을 발견할 수 있어요. 직접 요리하는 과정과 맛있게 먹는 순간의 즐거움이 생생하게 담겨 있어요. 음식을 통해 일상을
    더 따뜻하게 바라보게 해 주는 만화예요.
