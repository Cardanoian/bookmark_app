'9791162730522':
  title: 용선생 처음 세계사 :세계 역사 첫걸음
  summary: 용선생님과 아이들이 이번에는 시간 여행을 떠나 세계 곳곳의 역사 속으로 들어가요. 이집트, 그리스, 로마 등 여러 나라와 문명을
    직접 찾아가며 그 시대 사람들의 생활과 사건을 눈으로 지켜보지요. 낯설고 어렵게 느껴지던 세계사가 이야기를 따라가다 보면 쉽고 재미있게 이해돼요.
    세계 여러 나라의 역사를 처음 배우는 어린이에게 좋은 길잡이가 되어 준답니다.
'9788932473901':
  title: 이기적 유전자
  summary: 이 책은 우리 몸속에 있는 유전자의 눈으로 생명을 바라보자고 이야기해요. 사람이나 동물은 사실 유전자가 자기 자신을 다음 세대에
    남기기 위해 이용하는 그릇과 같다는 놀라운 생각을 들려주지요. 왜 동물들이 가족을 돌보고 때로는 서로 경쟁하는지 유전자의 관점에서 설명해 줘요.
    생명과 진화를 완전히 새로운 시각으로 바라보게 해 주는 유명한 과학 이야기예요.
'9788983927699':
  title: 해리포터 :불의 잔
  summary: 호그와트에서 세 마법학교가 겨루는 트라이위저드 대회가 열리고, 아직 나이가 안 된 해리의 이름이 뜻밖에도 불의 잔에서 나오면서
    이야기가 시작돼요. 해리는 얼떨결에 용을 상대하고 호수 밑을 탐험하는 등 위험한 과제들을 하나씩 헤쳐 나가야 하지요. 그 사이 친구 론과의
    오해, 초 챙과의 풋풋한 감정 등 학교 생활도 함께 펼쳐져요. 대회의 끝에서 해리는 볼드모트가 돌아왔다는 무서운 진실과 마주하게 된답니다.
'9791193031971':
  title: "(설민석의) 우리 고전 대모험"
  summary: 설민석 선생님이 안내자가 되어 아이들과 함께 우리 옛이야기 속 세상으로 모험을 떠나요. 춘향전, 흥부전 같은 우리나라 고전 문학
    속으로 직접 들어가 등장인물들을 만나고 사건을 함께 겪어보지요. 어렵게만 느껴지던 고전이 신나는 모험 이야기로 펼쳐지면서 쉽게 이해가 돼요.
    웃음과 감동 속에서 우리 고전의 재미와 지혜를 배울 수 있는 이야기예요.
'9788949123554':
  title: 기억 전달자
  summary: 조너스가 사는 마을은 고통도 다툼도 없이 모든 것이 완벽하게 통제된 곳이에요. 열두 살이 된 조너스는 마을의 단 한 사람, '기억
    보유자'가 되어 예전 세상의 진짜 기억들을 물려받는 특별한 임무를 맡게 되지요. 색깔도 감정도 몰랐던 조너스는 기쁨과 아픔이 담긴 기억들을
    하나씩 알게 되면서 마을의 숨겨진 무서운 비밀도 깨닫게 돼요. 결국 조너스는 아기 가브리엘을 지키기 위해 큰 결심을 하고 마을을 떠나게 된답니다.
