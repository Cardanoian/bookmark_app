'9791164797233':
  title: 별의 커비 :스타 얼라이즈
  summary: 어느 날 하트 모양의 사악한 기운이 별의 세계를 뒤덮으며 여러 캐릭터들의 마음을 나쁘게 물들여 버려요. 커비는 특별한 '친구 하트'를
    이용해 물든 마음을 정화하고 옛 라이벌들까지 친구로 만들어 함께 모험을 떠나지요. 커비와 친구들은 힘을 합쳐 별들을 되찾고 세상을 뒤덮은 어둠의
    근원을 향해 나아가요. 우정과 협력의 힘으로 위기를 극복하는 커비의 신나는 모험 이야기예요.
