'9788950971489':
  title: 그리스 로마 신화
  summary: "「그리스 로마 신화」는 아주 먼 옛날, 세상이 만들어질 때부터 살았던 신들과 영웅들의 흥미진진한 이야기들을 모아놓은 책이에요.
    올림포스산에 사는 최고의 신 제우스와 아름다운 여신 헤라, 바다의 신 포세이돈 같은 여러 신들이 어떤 모습으로 세상을 다스리고 서로 어떤 관계를
    맺었는지 알 수 있지요. 힘센 헤라클레스나 지혜로운 아테나 같은 영웅들의 멋진 모험담도 가득하답니다. 이 책을 읽으면 신들이 어떤 특별한 능력을
    가졌고, 인간들과 어떻게 어울려 살았는지 재미있게 상상해 볼 수 있어요. 신화 속 이야기들이 오늘날 우리가 쓰는 말이나 예술에도 많이 남아
    있어서 더욱 신기할 거예요. 수천 년 동안 사람들에게 사랑받아 온 멋진 이야기 속으로 함께 떠나 보아요!"
'9788950971564':
  title: 그리스 로마 신화
  summary: 이 책은 아주 먼 옛날, 세상의 시작과 함께 나타난 멋진 신들과 영웅들의 이야기를 들려줘요. 제우스, 헤라 같은 신들이 어떤 힘을
    가졌고 어떤 일을 했는지 재미있는 그림과 함께 배울 수 있어요. 용감한 영웅들이 무서운 괴물과 싸우고 놀라운 모험을 하는 이야기도 가득하답니다.
    이 책을 읽으면 우리가 쓰는 말이나 예술 작품에 숨어있는 신화 속 이야기들을 더 잘 이해하게 될 거예요. 신화 속 인물들의 흥미진진한 삶과
    지혜로운 선택들을 만나보세요!
'9788950971571':
  title: 그리스 로마 신화
  summary: 이 책은 아주 먼 옛날, 세상이 만들어질 때 나타난 신들의 이야기를 들려줘요. 하늘의 왕 크로노스가 아들들을 삼키는 무서운 이야기로
    시작되지요. 하지만 똑똑하고 용감한 막내아들 제우스가 아버지에게 맞서 싸워요. 제우스는 형제자매 신들과 힘을 합쳐 세상의 새로운 왕이 된답니다.
    신들의 힘찬 탄생과 흥미진진한 모험이 가득한 이야기예요.
'9788950971588':
  title: 그리스 로마 신화
  summary: 이 책은 아주 먼 옛날 그리스와 로마 사람들이 믿었던 신과 영웅들의 신비로운 이야기를 담고 있어요. 세상에서 가장 높은 신 제우스부터
    지혜로운 아테나, 용감한 헤라클레스 등 여러 신과 영웅들의 모험을 만날 수 있답니다. 신들이 싸우고 사랑하고 어려운 일을 헤쳐 나가는 흥미진진한
    이야기들을 읽으면서 상상력을 키울 수 있어요. 이 책을 통해 멋진 신화 속 인물들의 이야기와 그들이 남긴 지혜를 재미있게 배울 수 있을 거예요.
'9788950971595':
  title: 그리스 로마 신화
  summary: 이 책은 아주 먼 옛날 그리스와 로마 사람들이 믿었던 신들의 이야기를 담고 있어요. 힘센 제우스 신과 지혜로운 아테나 여신처럼
    여러 신들이 등장하지요. 신들은 때로는 싸우고 사랑하며, 인간들처럼 여러 감정을 느끼고 재미있는 일들을 겪어요. 이 이야기들을 읽으면서 상상력을
    키우고, 서양 문화에 대한 기초 지식도 얻을 수 있답니다.
'9788950983079':
  title: 정재승의 인간 탐구 보고서
  summary: 이 책은 우리가 왜 웃고 울고 화내는지, 우리 마음속 비밀을 알려주는 탐험 보고서와 같아요. 우리의 뇌가 어떻게 생각하고 기억하는지,
    그리고 왜 특정 행동을 하는지 탐험가처럼 자세히 들여다볼 수 있답니다. 친구들과 함께 놀 때, 또는 가족과 이야기할 때 우리의 마음이 어떻게
    움직이는지 재미있게 설명해 줘요. 마치 탐정처럼 우리 몸과 마음속에 숨겨진 신기한 사실들을 하나씩 발견하는 기분이 들 거예요. 이 책을 읽으면
    나 자신은 물론, 다른 사람의 마음까지 더 잘 이해하는 데 큰 도움이 될 거예요.
'9788950983482':
  title: 정재승의 인간 탐구 보고서
  summary: 이 책은 우리가 왜 웃고 화내고, 사람들은 어떤 생각을 하는지 궁금증을 해결해 주는 탐험 보고서예요. 마치 탐험가가 되어 우리
    뇌와 마음속으로 들어가 사람의 복잡한 비밀을 하나씩 밝혀내죠. 친구들의 질문에 과학적인 근거로 쉽고 재미있게 답해주면서, 인간의 행동과 심리에
    대해 배울 수 있답니다. 만화와 그림으로 되어 있어서 어렵지 않고, 나 자신은 물론 다른 친구들을 더 깊이 이해하는 데 도움을 줄 거예요.
    이 책을 읽다 보면 우리 주변 사람들을 새로운 눈으로 보게 될 거예요.
'9788950983499':
  title: 정재승의 인간 탐구 보고서
  summary: 이 책은 우리 주변의 사람들과 우리 자신을 더 잘 이해하도록 도와주는 신나는 탐험 보고서예요. 왜 어떤 행동을 하는지, 어떤 마음을
    가지고 있는지 등 인간의 신비로운 모습을 탐구하지요. 정재승 교수님과 함께 뇌와 마음, 감정에 대한 흥미로운 이야기들을 쉽고 재미있게 배울
    수 있어요. 친구 관계, 부끄러움, 웃음 등 다양한 상황 속에서 우리가 미처 몰랐던 심리와 행동의 비밀을 밝혀낸답니다. 이 책을 읽으면 우리
    스스로와 다른 사람들을 더욱 깊이 이해하는 멋진 인간 탐험가가 될 수 있을 거예요.
'9788950983505':
  title: 정재승의 인간 탐구 보고서
  summary: "「정재승의 인간 탐구 보고서」는 우리 몸과 마음에 대한 궁금증을 풀어주는 아주 재미있는 책이에요. 뇌는 어떻게 생각하고, 사람들은
    왜 기뻐하거나 화내는지 등 우리 자신에 대한 신비로운 이야기들을 알려준답니다. 유명한 과학자 정재승 교수님이 직접 감수하여 믿을 수 있고,
    어려운 과학도 쉽고 재미있게 풀어냈어요. 만화처럼 즐거운 그림과 함께 설명되어 있어서 과학을 잘 모르는 친구들도 흥미롭게 읽을 수 있을 거예요.
    이 책을 통해 우리 인간이 얼마나 신비롭고 멋진 존재인지 깨닫게 될 거예요."
'9788950983680':
  title: 비밀요원 레너드
  summary: 비밀요원 레너드는 땅속 비밀 요원인 두더지 레너드가 주인공인 이야기예요. 레너드는 비밀 기지에 살면서 숲의 평화를 지키는 임무를
    맡고 있죠. 때로는 소중한 물건을 지키고, 때로는 잃어버린 친구를 찾으러 나서기도 해요. 용감한 레너드는 엉뚱한 친구들과 함께 흥미진진한 모험을
    펼치며 사건을 해결한답니다. 이 책은 어린이들에게 용기와 우정의 소중함을 알려줄 거예요.
'9788950983697':
  title: 비밀요원 레너드
  summary: 레너드는 몸 색깔을 자유자재로 바꿀 수 있는 특별한 능력을 가진 비밀 요원 카멜레온이에요. 레너드는 위험에 처한 친구들을 돕기
    위해 오늘도 멋진 작전을 펼친답니다. 몸 색깔을 바꾸는 재주로 몰래 다가가거나, 주변과 똑같이 변신해서 어려운 사건들을 해결해요. 때로는 엉뚱한
    실수도 하지만, 언제나 최선을 다해 사건을 멋지게 해결하는 용감한 레너드의 모험 이야기예요.
'9788950983703':
  title: 비밀요원 레너드
  summary: 레너드는 남극에 사는 귀여운 펭귄이에요. 낮에는 조금 엉뚱하고 어리바리하지만, 밤이 되면 멋진 비밀요원 '블랙 마스크'로 변신해요.
    블랙 마스크는 돋보기, 망원경 같은 특별한 도구를 사용해서 친구들의 어려운 사건들을 해결해 줘요. 레너드는 용감하게 사건을 파헤치고, 모두가
    잠든 밤에도 남극의 평화를 지키기 위해 노력하는 멋진 비밀요원이에요.
'9788950983710':
  title: 비밀요원 레너드
  summary: 용감한 비밀 요원 햄스터 레너드의 신나는 모험 이야기예요. 작고 귀여운 레너드는 뛰어난 관찰력과 빠른 판단력으로 어려운 사건들을
    척척 해결하죠. 친구들과 함께 위기에 빠진 세상을 구하기 위해 여러 가지 재미있는 임무를 수행한답니다. 레너드는 때로는 위험한 상황에 부딪히기도
    하지만, 절대로 포기하지 않고 끝까지 문제를 해결해요. 이 책을 읽으면 레너드의 멋진 활약에 푹 빠져들게 될 거예요.
'9788950991463':
  title: 비밀요원 레너드
  summary: 레너드는 사실 최고의 실력을 가진 비밀 요원이에요. 그런데 어느 날 불의의 사고로 기억을 잃고, 뜻하지 않게 특수견 훈련소에 잡혀가게
    된답니다. 그곳에서 레너드는 험난한 훈련과 무서운 교관들 때문에 매일 고생하며 지내요. 과연 레너드는 잃어버린 기억을 되찾고 훈련소의 비밀을
    밝혀내 무사히 탈출할 수 있을까요? 용감한 비밀 요원 레너드의 스릴 넘치는 모험을 함께 떠나보세요.
'9788950993153':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 손오공과 그의 친구들은 세상을 위협하는 어둠의 세력에 맞서 싸워요. 이들은 마법으로 한자 마법을 사용하며 악당들을 물리치고 정의를
    지키는 모험을 떠납니다. 책을 읽으면서 자연스럽게 재미있는 한자들을 익힐 수 있어서, 한자를 배우는 것이 마치 놀이처럼 느껴진답니다. 손오공과
    친구들의 신나는 모험을 따라가며 멋진 한자 마법을 함께 배워 보아요.
'9788950993542':
  title: 비밀요원 레너드
  summary: 비밀요원 레너드는 평범한 강아지처럼 보이지만, 사실은 세상을 지키는 특별한 비밀 요원이에요. 최첨단 장비와 뛰어난 실력으로 여러
    사건들을 해결하며 활약하죠. 친구들과 함께 위험한 임무를 용감하게 수행하고 나쁜 악당들과 맞서 싸워요. 레너드의 흥미진진한 모험을 따라가다
    보면 정의와 용기의 중요성을 깨닫게 될 거예요.
'9788950993559':
  title: 비밀요원 레너드
  summary: 레너드는 사실 특별한 임무를 맡은 비밀 요원이에요. 어느 날, 중요한 발명가와 그의 발명품이 사라지는 사건이 발생해요. 레너드는
    이 미스터리를 풀기 위해 친구들과 함께 용감하게 수사를 시작한답니다. 여러 가지 단서를 찾고 위험한 상황을 헤쳐나가며 진실에 다가가요. 과연
    레너드와 친구들은 사라진 발명가를 찾고 사건의 비밀을 밝혀낼 수 있을까요? 친구들과 함께 어려움을 극복하며 성장하는 레너드의 흥미진진한 모험
    이야기예요.
'9788950993566':
  title: 비밀요원 레너드
  summary: 레너드는 조용하고 평범한 생쥐지만, 마음속으로는 용감한 비밀요원이 되는 꿈을 꾸었어요. 그러던 어느 날, 옆집에 사는 고양이 스키피가
    갑자기 사라지는 이상한 일이 벌어졌어요. 레너드는 사랑하는 이웃 고양이를 찾기 위해 친구들과 함께 모험을 떠나기로 결심해요. 친구들과 힘을
    합쳐 단서를 찾고 위험한 순간을 헤쳐나가면서, 레너드는 진짜 비밀요원처럼 문제를 해결하고 숨겨진 용기를 발견하게 된답니다. 이 책은 꿈을 향해
    도전하고 친구들과 함께 문제를 해결하는 즐거움을 알려주는 이야기예요.
'9788950993573':
  title: 비밀요원 레너드
  summary: 레너드는 평범해 보이는 고양이 같지만, 사실은 아주 특별한 비밀 요원이에요. 레너드는 사랑스러운 소녀 미나와 함께 살고 있지요.
    어느 날, 레너드에게 아주 중요한 임무가 떨어져요. 바로 사라진 '슈퍼볼'을 찾고 미나를 위험으로부터 지켜야 하는 것이죠. 레너드는 뛰어난
    고양이 능력과 비밀 요원 도구들을 이용해 사건의 진실을 파헤치기 시작해요. 과연 레너드는 무사히 임무를 마치고 미나를 지킬 수 있을까요?
'9788950995904':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 이 책은 주인공 손오공이 친구들과 함께 모험을 떠나면서 한자를 배우고, 어려운 문제들을 해결해 나가는 이야기예요. 악당들이 한자
    마법으로 세상을 어지럽히면, 손오공과 친구들은 멋진 한자 마법으로 맞서 싸우며 정의를 지키지요. 책을 읽다 보면 다양한 한자의 뜻과 생김새를
    자연스럽게 익힐 수 있어서 한자가 정말 재미있게 느껴질 거예요. 신나는 모험과 박진감 넘치는 전투 장면들 덕분에 지루할 틈 없이 한자 공부를
    할 수 있답니다.
'9788950997717':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 마법천자문은 손오공이 주인공인 신나는 한자 학습 만화예요. 손오공은 요괴들과 맞서 싸우면서 여러 가지 한자를 배우고, 그 한자들을
    마법처럼 사용하며 모험을 떠나요. '배울 학', '불 화' 같은 한자들을 주문처럼 외우면 실제로 그 한자의 힘이 나타나서 위기를 극복한답니다.
    친구들과 함께 세상을 지키기 위해 펼치는 흥미진진한 이야기를 통해 어려운 한자를 재미있게 익힐 수 있어요.
'9788957072394':
  title: 시간 고양이
  summary: 민서는 우연히 시간을 마음대로 움직일 수 있는 신비한 고양이 한 마리를 만나게 돼요. 이 시간 고양이 덕분에 민서는 후회했던 일들을
    다시 경험하기도 하고, 미래의 모습을 미리 엿보기도 합니다. 시간 고양이와 함께 신기한 모험을 하면서 민서는 잊었던 추억을 되찾거나 어려운
    상황을 해결하기도 해요. 때로는 시간을 되돌리기도 하고 빠르게 흐르게도 하면서 민서는 시간의 소중함과 현재의 중요성을 깨닫게 됩니다. 이 책은
    시간과 소통하며 성장하는 민서의 따뜻하고 특별한 이야기랍니다.
'9788957073483':
  title: 시간 고양이
  summary: 이 책은 시간을 마음대로 조절할 수 있는 신비로운 능력의 '시간 고양이'와 주인공 아이의 이야기예요. 아이는 고양이와 함께 시간을
    멈추거나 되돌리며 신기한 경험을 하게 돼요. 하지만 이런 능력 때문에 오히려 소중한 순간을 놓치거나 문제가 생기기도 합니다. 이 과정에서 아이는
    시간의 소중함과 친구와의 관계를 돌아보게 돼요. 시간을 현명하게 사용하고 현재를 소중히 여기는 마음을 배우는 따뜻한 성장 동화입니다.
'9788957077627':
  title: 시간 고양이
  summary: 주인공 우주는 매일 지각을 해서 엄마와 선생님께 혼나는 아이지요. 그러던 어느 날, 신비한 시간 고양이를 만나 시간을 멈추거나
    되돌릴 수 있는 특별한 시간 씨앗을 얻게 돼요. 우주는 시간 씨앗을 이용해 시험을 잘 보거나 혼날 일을 피하는 등 처음에는 신나게 쓰지만,
    점점 더 큰 욕심을 부리게 됩니다. 시간 씨앗 때문에 친구와의 약속도 어기게 되고 소중한 것을 잃을 뻔하면서 시간의 소중함과 약속의 중요성을
    깨닫게 돼요. 이 책은 시간을 지키는 것이 얼마나 중요한지 가르쳐 주는 재미있는 이야기랍니다.
'9788957361900':
  title: 의사 어벤저스 :어린이 의학 동화
  summary: 이 책은 우리 몸을 건강하게 지켜주는 다양한 의사 선생님들의 이야기를 어린이들이 쉽게 이해하도록 도와주는 동화예요. 소아과 의사,
    치과 의사, 안과 의사 등 여러 분야의 의사들이 마치 어벤저스 영웅들처럼 멋지게 등장한답니다. 각 의사 선생님들이 어떤 병을 고치고 우리를
    어떻게 돕는지 재미있는 이야기로 설명해 줘요. 이 책을 읽으면 병원이 더 이상 무섭지 않고, 우리 몸이 아플 때 어떤 의사 선생님을 찾아가야
    할지 알게 될 거예요.
'9788957361955':
  title: 어린 왕자
  summary: 사막에 비행기가 고장 나서 떨어진 조종사가 신기한 어린 왕자를 만나요. 어린 왕자는 아주 작은 별에서 왔는데, 그 별에는 예쁜
    장미꽃이 한 송이 있었어요. 장미꽃과의 갈등 때문에 여러 행성을 여행하며 다양한 어른들과 동물들을 만나게 됩니다. 특히 여우를 만나면서 '가장
    중요한 것은 눈에 보이지 않아, 마음으로 봐야 해'라는 소중한 가르침을 깨닫게 되죠. 어린 왕자는 결국 지구에서 소중한 친구를 만나고 다시
    자기 별의 장미꽃에게로 돌아가는 길을 찾아 떠난답니다.
'9788957361993':
  title: 의사 어벤저스 :어린이 의학 동화
  summary: 이 책은 우리 몸이 아플 때 도와주는 멋진 의사 선생님들의 이야기를 담고 있어요. 주인공 아이들이 여러 병원을 찾아가 치과, 안과,
    소아과 의사 선생님 등 다양한 의사들을 만난답니다. 각 의사 선생님이 어떤 일을 하고 우리 몸을 어떻게 건강하게 지켜주는지 쉽고 재미있게 설명해
    줘요. 이 책을 읽으면 의사 선생님들이 마치 히어로처럼 우리를 도와준다는 것을 깨닫게 될 거예요. 병원에 가는 것이 무섭지 않고, 건강을 지키는
    소중한 방법을 배울 수 있답니다.
'9788957362020':
  title: 의사 어벤저스 :어린이 의학 동화
  summary: 이 책은 어린 친구들을 의학의 세계로 초대하는 신나는 이야기예요. 우리 몸을 지키는 의사 어벤저스 친구들이 나와서 여러 가지 질병과
    우리 몸속 기관들에 대해 재미있게 설명해 줘요. 주인공들은 병균과 싸우고 환자를 돕는 과정을 통해 의사 선생님들이 얼마나 멋진 일을 하는지
    알려준답니다. 아이들은 이 책을 읽으면서 의학에 대한 궁금증을 풀고 건강의 소중함을 배울 수 있어요.
'9788958075912':
  title: 수학특성화중학교
  summary: 이 책은 주인공 보배가 특별한 수학 중학교에 들어가면서 겪는 신나는 모험 이야기예요. 보배는 수학을 정말 좋아하는 친구들과 함께
    어려운 문제들을 풀고 여러 가지 도전들을 헤쳐나가요. 때로는 친구들과 경쟁하기도 하고, 때로는 서로 도와가며 멋진 우정을 쌓아가지요. 수학
    공부뿐만 아니라 꿈을 찾고 스스로 성장하는 소중한 경험을 할 수 있는 재미있는 책이랍니다.
'9788958079026':
  title: 과학특성화중학교
  summary: 주인공은 과학 영재들이 모인 특별한 과학 특성화 중학교에 입학하게 돼요. 이 학교에서는 평범한 수업 대신 직접 과학 탐구를 하거나
    신비로운 사건들을 해결해야 하지요. 새로운 친구들과 함께 여러 가지 과학 실험을 하면서 어려운 문제에 부딪히기도 하고, 멋지게 해결하기도 합니다.
    책을 읽으면서 자연스럽게 과학 지식을 배우고, 주인공과 함께 성장하는 재미를 느낄 수 있답니다.
'9788958079255':
  title: 과학특성화중학교
  summary: 이 책은 똑똑한 학생들이 모인 과학특성화중학교에서 펼쳐지는 신나는 이야기예요. 주인공들은 특별한 과학 수업을 듣고, 어려운 과학
    문제를 해결하며 성장한답니다. 친구들과 함께 경쟁하고 협력하면서 과학적 재능을 키워나가요. 단순히 공부만 하는 것이 아니라, 꿈과 용기를 가지고
    도전하는 모습을 보여주는 재미있는 책이랍니다. 과학을 좋아하는 친구라면 이야기에 푹 빠져들 거예요!
'9788958079491':
  title: 과학특성화중학교
  summary: 이 책은 과학에 특별한 재능을 가진 친구들이 모인 '과학특성화중학교'에서 벌어지는 이야기예요. 주인공들은 학교생활을 하면서 여러
    가지 과학 미스터리를 만나고, 친구들과 힘을 합쳐 과학 원리를 이용해 해결해나가죠. 신기한 실험을 하기도 하고, 어려운 과학 문제를 풀기도
    하면서 재미있는 모험을 겪는답니다. 이 책을 읽으면 마치 내가 과학 영재가 된 것처럼 과학을 즐겁게 배우고, 주변의 궁금증을 과학적으로 해결하는
    방법을 익힐 수 있을 거예요.
'9788960867093':
  title: 놓지 마 과학!
  summary: "「놓지 마 과학!」은 정신이와 그의 가족들이 겪는 유쾌한 일상 속에서 과학 원리를 알려주는 학습 만화예요. 정신이 가족에게 벌어지는
    엉뚱하고 재미있는 사건들을 통해 여러 가지 과학 지식을 쉽고 즐겁게 배울 수 있답니다. 전기가 어떻게 흐르는지, 중력이 무엇인지 등 어려운
    과학 개념들을 만화 속 이야기로 자연스럽게 이해할 수 있어요. 과학을 어렵게만 생각했던 친구들도 이 책을 읽으면 과학이 얼마나 재미있는지 깨닫게
    될 거예요."
'9788965466833':
  title: 생일엔 마라탕
  summary: 은아는 엄마 아빠가 중국집을 하시는 평범한 아이예요. 자기 생일에 미역국 대신 마라탕을 먹고 싶어 하지만, 엄마는 미역국을 꼭
    먹어야 한다고 고집하시죠. 은아는 새로운 학교에서 친구 사귀기도 어렵고, 엄마와의 사이도 조금은 서먹해요. 하지만 마라탕을 좋아하는 친구를
    만나면서 용기를 내고, 엄마와도 솔직한 마음을 나누게 됩니다. 이 책은 가족과 친구의 소중함, 그리고 서로 다른 마음을 이해하는 법을 알려주는
    따뜻한 이야기예요.
'9788965466970':
  title: 생일엔 마라탕
  summary: 아리는 다가오는 생일에 꼭 마라탕을 먹고 싶어 해요. 하지만 엄마는 마라탕이 몸에 좋지 않을까 봐 걱정이 많아요. 아리는 엄마에게
    마라탕을 좋아하는 이유를 조곤조곤 설명하며 자기 마음을 보여주려고 노력해요. 가족들은 아리의 간절한 소원을 위해 모두 함께 고민하고 특별한
    방법을 찾아요. 덕분에 아리는 모두의 사랑이 담긴 맛있는 마라탕과 함께 행복한 생일을 보내게 됩니다. 이 책은 가족 간의 사랑과 소통, 그리고
    서로를 이해하는 따뜻한 이야기를 담고 있어요.
'9788965467083':
  title: 생일엔 마라탕
  summary: 주인공 하연이는 생일에 가장 좋아하는 마라탕을 먹고 싶어 해요. 하지만 아빠는 마라탕이 몸에 좋지 않다고 못 먹게 해서 하연이는
    너무 속상했어요. 하연이는 아빠와 마라탕 때문에 갈등을 겪으면서, 학교에서도 친구들과 여러 가지 일들을 겪게 된답니다. 이 책은 하연이가 자기가
    좋아하는 것을 지키고, 다른 사람의 생각도 이해하며 성장해나가는 따뜻한 이야기예요. 친구들과 가족 사이에서 서로 다른 마음을 어떻게 맞춰 나갈지
    배우는 재미있는 동화랍니다.
'9788965467250':
  title: 생일엔 마라탕
  summary: 주인공 나나는 생일날 마라탕을 먹고 싶어 하지만, 엄마는 마라탕을 싫어해서 나나는 속상한 마음이 들어요. 아빠는 나나와 엄마 사이에서
    고민하며 멋진 아이디어를 떠올려요. 결국 나나는 친구들과 함께 즐거운 생일 파티를 준비하게 됩니다. 이 과정에서 나나는 가족의 사랑을 느끼고,
    서로의 마음을 이해하는 법을 배우게 돼요. 마라탕을 통해 가족의 소중한 마음과 배려를 깨닫는 따뜻한 이야기랍니다.
'9788965467519':
  title: 생일엔 마라탕
  summary: 민하는 생일날 세상에서 제일 맛있는 마라탕을 꼭 먹고 싶었어요. 하지만 엄마는 미역국, 아빠는 다른 음식을 이야기해서 민하는 조금
    속상했답니다. 민하는 좋아하는 마라탕을 먹기 위해 직접 재료를 사러 나서고, 예상치 못한 특별한 경험을 하게 돼요. 결국 가족들은 민하의 마음을
    알게 되고, 모두 함께 따뜻한 마음으로 맛있는 마라탕을 먹으며 즐거운 생일을 보낸답니다. 좋아하는 것을 나누는 기쁨과 가족의 소중한 사랑을
    느낄 수 있는 이야기예요.
'9788965795940':
  title: 말괄량이 길들이기
  summary: 옛날 이탈리아에 아주 예쁘지만 심술궂고 고집 센 카타리나라는 아가씨가 살았어요. 카타리나의 여동생은 언니가 먼저 결혼해야만 결혼할
    수 있었죠. 어느 날, 페트루키오라는 용감한 남자가 나타나서 카타리나와 결혼하겠다고 나섰어요. 페트루키오는 카타리나의 심술궂은 버릇을 고쳐주기
    위해 아주 특별한 방법들을 썼어요. 결국 카타리나는 부드러운 마음을 갖게 되고, 모두가 놀랄 만큼 멋진 신부로 변한답니다. 이 이야기는 사랑과
    지혜로 사람의 마음을 어떻게 변화시킬 수 있는지 보여줘요.
'9788965796084':
  title: 홍길동전
  summary: 홍길동전은 홍길동이라는 영웅의 이야기예요. 홍길동은 아버지가 높은 벼슬아치였지만, 어머니가 첩이라서 서러움을 많이 겪었어요. 그래서
    집을 떠나 도술을 배우고, 가난하고 힘없는 사람들을 돕는 활빈당의 우두머리가 되었죠. 나쁜 관리들을 혼내주고 부자들에게서 재물을 뺏어 가난한
    사람들에게 나누어 주었어요. 결국 자신만의 새로운 나라 율도국을 세워 모두가 행복하게 사는 세상을 만들었답니다.
'9788968307515':
  title: 사춘기 대 중학 생활
  summary: 이 책은 초등학교를 졸업하고 중학생이 되는 친구들이 겪는 변화를 알려주는 길잡이 책이에요. 몸과 마음이 훌쩍 자라는 사춘기에 접어들면서
    어떤 기분이 들고 무슨 고민이 생길 수 있는지 이야기해 줘요. 새로운 학교생활, 친구 관계, 그리고 공부까지, 중학교 생활의 다양한 모습들을
    미리 엿볼 수 있답니다. 이 책을 읽으면 사춘기와 중학교 생활을 자신감 있게 맞이하고 멋지게 헤쳐나갈 수 있는 지혜를 얻을 수 있을 거예요.
'9791130622590':
  title: 낭만 강아지 봉봉
  summary: 봉봉이는 노래 부르는 것을 아주 좋아하는 작은 강아지예요. 봉봉이는 언젠가 멋진 록스타가 되는 꿈을 꾸고 있었죠. 할머니와 단둘이
    살면서도 매일매일 노래 연습을 게을리하지 않았답니다. 그러던 어느 날, 봉봉이의 노랫소리를 우연히 듣게 된 유명한 록스타 아저씨가 있었어요.
    과연 봉봉이는 꿈을 이룰 수 있을까요? 이 책은 작은 강아지 봉봉이가 꿈을 향해 나아가는 즐거운 이야기예요.
'9791130631325':
  title: '우리들의 MBTI 3 : 가족 관계 (한정판 윈터 에디션) - 나의 성격을 이해하고 더 멋진 내가 되는'
  summary: 이 책은 여러분의 성격을 이해하는 데 도움을 주는 MBTI 이야기를 담고 있어요. 나와 가족들이 어떤 MBTI 성격을 가졌는지
    알아보고, 서로 다른 점들을 인정하며 멋진 가족으로 지내는 방법을 배울 수 있답니다. 우리 가족만의 특별한 성격 궁합을 맞춰보면서 서로를 더욱
    잘 이해하게 될 거예요. 내 성격을 알고 가족들을 더 사랑하는 마음을 키울 수 있을 거예요.
'9791130635712':
  title: 흔한남매 불꽃 튀는 우리말 1 - 초등 국어 고수 되기 프로젝트
  summary: 이 책은 인기 유튜버 '흔한남매'의 으뜸이와 에이미가 등장해서 초등학생 친구들이 우리말 고수가 되도록 돕는 이야기예요. 재미있는
    만화와 흥미진진한 이야기 속에서 어려운 낱말이나 헷갈리는 문법을 저절로 배우게 된답니다. 흔한남매가 내는 우리말 미션을 하나씩 해결하다 보면
    국어 실력이 쑥쑥 자랄 거예요. 마치 게임처럼 재미있게 국어 공부를 할 수 있도록 도와주는 책이지요. 이 책을 읽으면 우리말 실력이 불꽃처럼
    튀어 오를 거예요.
'9791130637594':
  title: 흔한남매 불꽃 튀는 우리말 :초등 국어 고수 되기 프로젝트
  summary: 이 책은 인기 유튜버 흔한남매의 에이미와 으뜸이가 등장하는 신나는 우리말 학습 만화예요. 아이들이 자주 헷갈리거나 어려워하는 맞춤법,
    띄어쓰기, 속담, 관용어 등을 재미있는 이야기로 알려준답니다. 흔한남매 특유의 유머가 가득한 만화를 읽으면서 자연스럽게 올바른 우리말을 배울
    수 있어요. 이 책을 통해 친구들은 초등 국어 실력을 쑥쑥 키우고 우리말 고수로 거듭날 수 있을 거예요. 지루하지 않게 국어 공부를 하고 싶은
    친구들에게 강력 추천하는 책이랍니다.
'9791130640280':
  title: 흔한남매 불꽃 튀는 우리말 :초등 국어 고수 되기 프로젝트
  summary: 이 책은 인기 유튜버 흔한남매 캐릭터인 에이미와 에드워드가 나오는 재미있는 국어 학습 만화예요. 흔한남매가 겪는 다양한 사건들을
    통해 우리가 평소 쓰는 말과 문법, 그리고 바른 표현들을 쉽게 배울 수 있어요. 마치 국어 고수가 되기 위한 흥미진진한 프로젝트를 수행하는
    것 같아요. 이 책을 읽으면 흔한남매의 웃긴 이야기와 함께 우리말 실력을 쑥쑥 키울 수 있을 거예요.
'9791130641607':
  title: 흔한남매 불꽃 튀는 우리말 :초등 국어 고수 되기 프로젝트
  summary: 이 책은 인기 유튜버 흔한남매 에이미와 으뜸이가 등장해서 우리말을 재미있게 알려주는 책이에요. 일상에서 우리가 자주 틀리는 말이나
    헷갈리는 표현들을 만화처럼 유쾌하게 가르쳐 준답니다. 맞춤법, 띄어쓰기 같은 국어 지식은 물론, 재미있는 속담과 관용구도 배울 수 있어요.
    흔한남매의 불꽃 튀는 이야기 속에서 국어 실력을 쑥쑥 키우고 우리말 고수가 될 수 있을 거예요.
'9791130642710':
  title: 수상한 이웃집 시노다
  summary: 새 집으로 이사 온 유미는 옆집에 사는 시노다 할머니를 만나요. 할머니는 왠지 모르게 수상하고 이상해 보여서 유미의 호기심을 자극하죠.
    유미는 할머니가 새들과 이야기하고 신기한 물건들을 가지고 있는 모습을 몰래 지켜봐요. 그러면서 할머니가 사실은 특별한 비밀을 가지고 있고,
    매우 친절한 분이라는 것을 알게 돼요. 이웃집 할머니와 유미가 함께 신비로운 일들을 겪으며 따뜻한 우정을 쌓아가는 이야기입니다.
'9791130644318':
  title: 낭만 강아지 봉봉
  summary: 봉봉이는 낭만을 너무나 좋아하는 귀여운 강아지예요. 봉봉이는 마치 영화 속 주인공처럼 멋진 삶을 꿈꾸고, 매일매일 특별한 일을
    찾아다녀요. 때로는 거침없이 모험을 떠나기도 하고, 다른 강아지 친구들에게 용기 있는 모습을 보여주려고 애쓰기도 하지요. 하지만 봉봉이의 계획대로
    모든 일이 착착 진행되는 건 아니어서, 늘 재미있고 예측 불가능한 일들이 벌어진답니다. 이 책은 봉봉이의 사랑스럽고 유쾌한 일상을 통해 진정한
    행복이 무엇인지 생각하게 해줘요.
'9791130648040':
  title: 낭만 강아지 봉봉
  summary: 낭만 강아지 봉봉은 로맨스를 꿈꾸는 귀여운 강아지 봉봉이의 이야기예요. 봉봉이는 멋진 상상을 즐기고 언제나 설레는 사랑을 기다리죠.
    하지만 집 밖 세상은 봉봉이의 마음처럼 낭만적이지 않을 때도 있어요. 봉봉이는 여러 친구들을 만나고 특별한 경험을 하면서 진정한 로맨스와 행복이
    무엇인지 깨닫게 된답니다. 이 책은 강아지 봉봉이의 눈을 통해 용기와 사랑의 의미를 유쾌하게 보여줘요.
'9791130650470':
  title: 최악의 최애
  summary: 보라는 '트윙클'이라는 아이돌 그룹의 '유성'을 세상에서 제일 좋아하는 열혈 팬이에요. 그런데 보라의 반에 '트윙클'을 너무나
    잘 아는 전학생 주영이가 나타나죠. 보라는 주영이가 유성을 위험하게 따라다니는 '사생팬'이라고 오해하고 처음엔 싫어해요. 하지만 여러 사건을
    겪으면서 보라는 주영이의 진짜 모습을 알게 되고, 진짜 팬 활동이 무엇인지 깨닫게 됩니다. 이 책은 좋아하는 마음을 어떻게 표현하고, 친구와의
    오해를 어떻게 푸는지 알려주는 재미있는 이야기에요.
'9791130650951':
  title: 온 더 볼 =On the ball
  summary: 우주라는 친구는 축구를 정말 좋아하지만, 왠지 자신감이 없었어요. 언젠가 멋지게 골을 넣는 꿈을 꾸며 열심히 연습했답니다. 친구들과
    함께 땀 흘리며 연습하면서 우주는 포기하지 않는 마음과 서로 돕는 기쁨을 알게 되었어요. 마침내 우주는 축구 경기장에서 멋진 순간을 만들어낼
    수 있을까요? 이 책은 꿈을 향해 노력하는 우주의 성장 이야기예요.
'9791130651026':
  title: 루미너스 오늘부터 데뷔합니다
  summary: 김유리라는 평범한 초등학생은 아이돌이 되고 싶은 꿈을 가지고 있었어요. 어느 날, VR(가상현실) 세상에서 활동하는 아이돌 그룹
    '루미너스'의 멤버를 뽑는 오디션에 참여하게 되죠. 유리는 가상 세계에서 새로운 친구들을 만나 함께 꿈을 이루기 위해 열심히 노력해요. 가상
    세계와 현실을 오가며 여러 가지 어려움과 갈등을 겪지만, 친구들과 힘을 합쳐 성장하는 이야기랍니다. 과연 루미너스는 멋지게 데뷔할 수 있을까요?
'9791130653433':
  title: 낭만 강아지 봉봉
  summary: 봉봉은 그림 그리는 것을 좋아하는 보람이네 강아지예요. 보람이는 화가가 되고 싶지만, 자신감이 없어서 고민이 많답니다. 낭만 강아지
    봉봉은 그런 보람이를 몰래 돕기 위해 특별한 계획을 세워요. 봉봉은 그림 재료를 찾아주거나, 보람이에게 영감을 줄 만한 로맨틱한 상황을 만들기도
    하지요. 이 책은 사랑스러운 봉봉의 노력 덕분에 보람이가 용기를 얻고 꿈을 찾아가는 따뜻한 이야기랍니다. 강아지와 소녀의 아름다운 우정과 꿈을
    향한 마음을 배울 수 있어요.
'9791130655192':
  title: 온 더 볼 =On the ball
  summary: 이 책은 축구를 정말 좋아하는 아이들의 이야기예요. 아이들은 매일매일 열심히 연습하고, 넓은 운동장을 신나게 뛰어다니며 꿈을 키워요.
    때로는 공이 뜻대로 되지 않거나 실수를 할 때도 있지만, 친구들과 함께 힘을 합쳐 어려움을 이겨내요. 축구를 향한 뜨거운 열정과 함께 성장하는
    아이들의 모습이 감동적이에요. 이 책을 읽으면 축구의 재미와 친구의 소중함을 느낄 수 있을 거예요.
'9791130657806':
  title: 낭만 강아지 봉봉
  summary: 봉봉이는 평범한 듯 보이지만 사실은 아주 낭만적인 강아지예요. 봉봉이는 늘 새로운 곳으로 떠나기를 꿈꾸고, 여행하며 멋진 순간들을
    만나요. 바닷가에서 철썩이는 파도를 보기도 하고, 작은 마을의 골목길을 산책하며 새로운 친구를 사귀기도 해요. 봉봉이와 함께라면 잊고 있던
    주변의 아름다움을 발견하고, 상상의 나래를 펼칠 수 있을 거예요. 이 책은 봉봉이의 따뜻한 마음과 용감한 모험을 통해 우리에게 소중한 추억을
    선물한답니다.
'9791130662985':
  title: 다판다 편의점
  summary: 다영이는 부모님이 운영하는 '다판다 편의점' 때문에 늘 바쁜 가족이 불만이었어요. 하지만 어느 날, 엉뚱 발랄한 편의점 아르바이트생
    왕언니를 만나면서 편의점의 특별한 비밀을 알게 되지요. 사실 왕언니는 미래에서 온 인공지능 로봇이었고, 다판다 편의점은 손님들의 고민을 해결해
    주는 마법 같은 곳이었어요. 다영이는 왕언니와 함께 다양한 손님들의 이야기를 들으며 점차 편의점과 가족의 소중함을 깨닫게 됩니다. 이 책은
    편의점이라는 특별한 공간에서 다영이가 성장하는 이야기랍니다.
'9791130663302':
  title: 슈퍼 루키 :김영리 장편소설
  summary: 이 책은 야구를 너무나 사랑하는 소녀 유하의 이야기예요. 유하는 여자아이도 프로 야구 선수가 될 수 있다는 것을 보여주기 위해
    열심히 노력해요. 수많은 어려움과 편견 속에서도 포기하지 않고 훈련하며 꿈을 향해 나아가죠. 유하의 도전은 야구팀 친구들과 코치님 덕분에 더욱
    빛나고, 마침내 진짜 슈퍼 루키가 되어 모두에게 희망을 선물한답니다. 꿈을 향한 열정과 용기를 배울 수 있는 감동적인 소설이에요.
'9791130664279':
  title: 온 더 볼 =On the ball
  summary: 준이는 축구를 세상에서 가장 좋아하는 소년이에요. 축구 선수가 되는 것이 꿈이라 강아지 콩이와 함께 매일 열심히 연습하지요. 하지만
    약한 왼발 때문에 고민이 많았어요. 준이는 약점을 극복하기 위해 포기하지 않고 땀 흘려 노력해요. 이 책은 꿈을 향해 노력하고 친구와 함께하는
    즐거움을 알려주는 따뜻한 이야기예요.
'9791130664606':
  title: 너구리 라면 가게
  summary: 너구리 아저씨가 맛있는 라면 가게를 열었어요. 처음에는 라면 만들기가 너무 어려워서 손님으로 온 동물 친구들이 실망했어요. 하지만
    너구리 아저씨는 포기하지 않고 밤낮으로 라면을 만드는 연습을 했답니다. 마침내 너구리 아저씨는 세상에서 가장 맛있는 라면을 끓이게 되었고,
    동물 친구들은 모두 행복해졌어요. 이 책은 노력하면 무엇이든 잘할 수 있다는 소중한 교훈을 알려줘요.
'9791130666310':
  title: 낭만 강아지 봉봉
  summary: 봉봉은 낭만을 꿈꾸는 귀여운 강아지예요. 봉봉은 도시의 평범한 집에서 창밖을 보며 늘 새로운 곳으로 여행을 꿈꾸지요. 어느 날
    봉봉이는 용기를 내어 세상 밖으로 작은 모험을 떠나요. 길 위에서 특별한 친구들을 만나고, 아름다운 풍경을 보면서 즐거운 시간을 보내요. 봉봉이는
    여행을 통해 꿈을 이루고 행복을 찾아가는 방법을 배우게 된답니다.
'9791130667546':
  title: 다판다 편의점
  summary: 다판다 편의점은 귀여운 판다 사장님 다판다가 운영하는 특별한 편의점 이야기예요. 이 편의점에는 손님들의 고민을 해결해 줄 신기한
    물건들이 많이 있답니다. 친구들은 다판다 편의점에서 물건을 사고 마음의 위로를 받거나 문제를 해결하는 방법을 배워요. 때로는 재미있는 사건이
    벌어지기도 하고, 때로는 따뜻한 마음을 나누는 이야기가 펼쳐져요. 다판다 편의점은 우리 친구들에게 즐거움과 함께 소중한 교훈을 주는 곳이랍니다.
'9791130667560':
  title: 스티커 =김선미 장편소설 /Sticker
  summary: "「스티커」는 마음속 깊이 숨겨둔 상처를 스티커처럼 붙이고 사는 사람들의 이야기예요. 주인공 예리는 스티커 회사에서 일하면서,
    자신도 모르는 사이에 마음의 아픔을 숨기고 있었답니다. 예리는 주변의 다양한 사람들을 만나면서, 자기 안의 상처는 물론 다른 사람들의 아픔도
    이해하게 돼요. 이 책은 우리가 서로의 아픔을 감싸 안고, 용기 내어 마음의 스티커를 떼어내며 진정한 행복을 찾아가는 따뜻한 과정을 그려요."
'9791130671048':
  title: 열다섯에 곰이라니 :추정경 장편소설
  summary: 열다섯 살 소녀 수아는 부모님 없이 오빠와 단둘이 살고 있어요. 어느 날, 수아의 집에 커다랗고 신기한 곰 한 마리가 갑자기 나타납니다.
    이 곰은 보통 곰이 아니라 수아의 마음을 알아주고 마치 가족처럼 보듬어주는 특별한 존재예요. 수아는 곰과 함께 지내면서 부모님에 대한 그리움과
    오빠와의 관계에 대해 깊이 생각하게 됩니다. 곰 덕분에 수아는 용기를 얻고, 가족의 소중함과 사랑의 의미를 깨달으며 마음이 훌쩍 자라게 된답니다.
'9791130671109':
  title: 오늘의 기분은 사과 :김지현 장편소설
  summary: 이 책은 소연이라는 친구가 자신의 진짜 마음을 찾아가는 이야기예요. 소연이는 다른 사람들과 조금 다르다고 느끼며 여러 가지 감정을
    느껴요. 그러다 주변의 다양한 사람들을 만나면서 세상과 소통하는 방법을 배우게 된답니다. 마치 사과가 여러 가지 맛을 내는 것처럼, 소연이의
    마음속에도 여러 감정들이 생겨나요. 이 책을 읽으면 우리 친구들도 자신을 더 잘 이해하고 사랑하는 방법을 알게 될 거예요.
'9791130671772':
  title: 온 더 볼 6 - 오프 더 볼
  summary: "『온 더 볼 6: 오프 더 볼』은 축구 경기 중 공을 가지고 있지 않을 때 어떻게 움직여야 하는지 알려주는 이야기예요. 주인공
    호야는 공이 내게 오지 않을 때도 팀 승리를 위해 어떻게 해야 하는지 깨닫게 돼요. 친구들과 함께 공이 없는 곳에서 빈 공간을 찾아 움직이는
    '오프 더 볼' 전략을 배우고 연습하죠. 처음에는 어렵지만, 점차 중요한 축구 전략을 익히며 팀워크의 소중함까지 알아가는 흥미진진한 축구 성장
    동화입니다."
'9791130679266':
  title: 흔한남매 불꽃 튀는 우리말 5 - 초등 국어 고수 되기 프로젝트
  summary: 이 책은 인기 유튜버 흔한남매 으뜸이와 에이미가 주인공으로 나오는 우리말 학습 만화예요. 두 남매의 좌충우돌 에피소드를 따라가다
    보면, 초등학생들이 자주 틀리는 맞춤법이나 띄어쓰기, 그리고 재미있는 속담과 관용어 등을 자연스럽게 배울 수 있어요. 흔한남매 특유의 유머와
    함께 국어 실력을 쑥쑥 키울 수 있도록 도와주는 책이랍니다. 초등학생 친구들이 쉽고 즐겁게 우리말을 익히고 국어 고수가 될 수 있도록 이끌어
    줄 거예요.
'9791130679990':
  title: 낭만 강아지 봉봉
  summary: 봉봉이는 할아버지와 함께 시골에서 평화롭게 사는 강아지예요. 봉봉이는 특히 로맨틱 영화를 좋아해서 자신도 멋진 사랑을 꿈꾸곤 해요.
    어느 날 예쁜 강아지 루비를 만나게 되자, 봉봉이는 루비에게 잘 보이고 싶어 자신만의 로맨틱한 계획을 세우죠. 하지만 봉봉이는 루비의 마음을
    착각하고, 생각지도 못한 신나는 모험을 떠나게 된답니다. 이 모험 속에서 봉봉이는 진짜 낭만과 사랑이 무엇인지 조금씩 깨닫게 돼요.
'9791130695723':
  title: 열다섯에 곰이라니 :추정경 장편소설
  summary: 이 책은 열다섯 살 평범한 소년 이준혁의 이야기예요. 어느 날부터 준혁이에게 이상한 일들이 일어나기 시작해요. 달콤한 꿀만 먹고
    싶어지거나 몸이 점점 털투성이 곰처럼 변하는 것이었죠. 준혁이는 자신의 비밀을 친구들과 가족에게 숨기려고 애쓰지만 쉽지 않아요. 이 소설은
    곰으로 변해가는 준혁이의 모습을 통해, 청소년들이 겪는 몸과 마음의 변화, 그리고 자신을 있는 그대로 받아들이는 용기에 대해 생각하게 해줘요.
'9791130696577':
  title: 낭만 강아지 봉봉
  summary: 봉봉이는 세상에 하나뿐인 아주 낭만적인 강아지예요. 다른 강아지들처럼 짖거나 뛰어노는 대신, 꽃향기를 맡고 음악을 듣고 시를 쓰는
    걸 좋아하죠. 하지만 봉봉이의 주인 할아버지는 그런 봉봉이를 이해하지 못하고 늘 투덜거려요. 봉봉이는 자신과 마음이 통하는 진짜 낭만적인 친구를
    찾기 위해 용감하게 여행을 떠납니다. 과연 봉봉이는 자신을 이해해 주는 특별한 친구를 만날 수 있을까요? 이 책은 자신만의 특별함을 간직한
    봉봉이의 따뜻한 성장 이야기예요.
'9791130698137':
  title: 온 더 볼 =On the ball
  summary: 온 더 볼은 축구를 아주아주 좋아하는 한 아이의 이야기예요. 이 아이는 학교가 끝나면 매일매일 축구공을 들고 운동장으로 달려가지요.
    슛 연습도 하고, 드리블도 하면서 멋진 축구 선수가 되는 꿈을 키워요. 비가 오나 눈이 오나 축구공과 함께 열심히 연습하는 모습이 정말 멋지답니다.
    이 책은 우리가 무엇이든 꾸준히 노력하면 꿈을 이룰 수 있다는 걸 알려줘요.
'9791130698427':
  title: 온 더 볼 =On the ball
  summary: 주인공 온이는 축구를 정말 좋아하는 여자아이예요. 온이는 공만 있으면 어디든 축구장이 될 수 있다고 생각하고 늘 즐겁게 공을 가지고
    놀지요. 하지만 온이는 친구들과 함께 축구를 할 때 자꾸 넘어지고 실수해서 속상해했어요. 그래도 온이는 포기하지 않고 자신만의 방법으로 공과
    친해지려 노력한답니다. 이 책은 온이의 빛나는 상상력과 축구를 향한 순수한 열정을 아름다운 그림으로 보여줘요. 좋아하는 것을 꾸준히 즐기는
    온이의 모습을 보며 용기를 얻을 수 있을 거예요.
'9791130699318':
  title: '우리들의 MBTI 4 : 학습 유형 - 나의 성격을 이해하고 더 멋진 내가 되는'
  summary: 이 책은 초등학생 친구들이 자신의 MBTI 성격 유형을 통해 어떤 방식으로 공부할 때 가장 효과적인지 알려주는 책이에요. 다양한
    MBTI 유형별 특징을 쉽게 설명해주고, 각 유형에 맞는 공부 방법이나 학급 생활 팁을 알려준답니다. 친구들은 이 책을 읽으면서 자신이 어떤
    성격을 가졌는지 이해하고, 자신에게 딱 맞는 학습법을 찾을 수 있어요. 나의 성격을 잘 알면 공부가 더 즐거워지고, 학교생활도 더 멋지게 할
    수 있도록 도와줄 거예요.
'9791136273796':
  title: 흔한남매 흔한 MBTI - 믿거나 말거나 나에게 어울리는 직업
  summary: 이 책은 인기 유튜브 채널 '흔한남매'의 에이미와 으뜸이가 MBTI 성격 유형을 아이들 눈높이에 맞춰 쉽고 재미있게 설명해 줘요.
    다양한 질문에 답하면서 나만의 MBTI 성격 유형을 찾아보고, 나에게 어떤 직업이 잘 어울릴지 상상해 볼 수 있답니다. 만화로 꾸며져 있어서
    즐겁게 읽다 보면 나도 몰랐던 나의 장점과 재능을 발견하는 데 도움을 받을 수 있어요. 미래에 어떤 사람이 되고 싶은지 꿈을 키우고, 친구들의
    성격도 이해하는 좋은 기회가 될 거예요.
'9791141608873':
  title: 왝왝이가 그곳에 있었다 :이로아 장편소설
  summary: 이 책은 주인공 '왝왝이'가 겪는 신비하고 조금은 혼란스러운 이야기를 담고 있어요. 왝왝이는 자신을 특별한 존재라고 느끼지만,
    다른 친구들과 다른 점 때문에 가끔 외로움을 느끼기도 합니다. 이 책은 왝왝이가 여러 사건을 겪으면서 진정한 자신을 찾아가는 과정을 보여줘요.
    친구들과의 관계 속에서 자신만의 특별함을 이해하고, 세상과 소통하는 법을 배우게 된답니다. 우리는 왝왝이의 이야기를 통해 나 자신을 사랑하고
    다른 사람의 다름을 이해하는 소중한 마음을 배울 수 있어요.
'9791155818367':
  title: 미요의 신비한 고전책방 :만화 구운몽
  summary: 미요의 신비한 고전책방에서 들려주는 이 이야기는 '구운몽'이라는 아주 오래된 소설을 만화로 쉽게 풀어냈어요. 주인공 성진은 절에서
    도를 닦는 스님이었는데, 어느 날 꿈속에서 양소유라는 멋진 남자가 되어 부귀영화를 누리게 돼요. 그는 여덟 명의 아름다운 부인들을 얻고 높은
    벼슬에 오르며 세상의 모든 즐거움을 맛보았죠. 하지만 이 모든 것이 꿈이었다는 것을 깨닫고 다시 스님의 모습으로 돌아와요. 이 책은 우리가
    세상에서 중요하다고 생각하는 것들이 사실은 덧없을 수도 있다는 가르침을 줍니다. 미요와 함께 신비한 고전 속 지혜를 만나보세요!
'9791158682965':
  title: "(읽으면서 바로 써먹는) 어린이 초등 교과 어휘"
  summary: 이 책은 초등학생 친구들이 학교 공부에 나오는 중요한 낱말들을 재미있게 배우도록 도와줘요. 국어, 수학, 사회, 과학 등 여러
    과목 교과서에 나오는 어려운 말들을 쉽게 설명해 준답니다. 낱말의 뜻과 어떻게 쓰이는지 알려줘서, 친구들이 글을 읽고 이해하는 능력을 쑥쑥
    키울 수 있어요. 책을 읽으면서 배운 낱말들을 바로바로 써먹을 수 있도록 도와주어 학교 공부도 더 쉽고 재미있게 할 수 있을 거예요.
'9791159955167':
  title: 친구 자판기
  summary: 지수는 혼자 노는 게 익숙해서 친구가 있었으면 좋겠다고 생각했어요. 어느 날, 지수네 집에 친구 자판기가 나타났죠. 지수는 신기한
    자판기에 동전을 넣고 여러 친구를 뽑아 보았어요. 그런데 자판기에서 나온 친구들은 지수가 생각한 진짜 친구가 아니었어요. 지수는 진짜 친구는
    저절로 생기는 것이 아니라, 마음을 나누고 함께하는 과정에서 만들어진다는 것을 깨닫게 된답니다.
'9791161571188':
  title: 불편한 편의점 :김호연 장편소설
  summary: 서울역 주변을 떠돌던 독고라는 노숙자 아저씨가 우연히 한 할머니의 지갑을 찾아주게 돼요. 그 할머니는 편의점 사장님인데, 고마움에
    독고 아저씨에게 자기 편의점에서 야간 아르바이트를 제안하지요. 처음엔 덩치도 크고 말도 어눌한 아저씨 때문에 손님들이 불편해하지만, 아저씨만의
    특별한 진심에 점점 마음을 열게 된답니다. 편의점에 찾아오는 다양한 손님들과 독고 아저씨는 서로에게 따뜻한 위로를 주고받으며 성장해요. 겉보기엔
    불편했던 편의점이 사실은 사람들의 마음을 치유하는 따뜻한 공간으로 변하는 이야기랍니다.
'9791161571379':
  title: 불편한 편의점 :김호연 장편소설
  summary: 이 책은 서울의 한 동네 작은 편의점에서 일어나는 따뜻한 이야기예요. 칠순의 편의점 사장님이 기억을 잃은 노숙인 독고 씨를 야간
    아르바이트생으로 고용하면서 이야기가 시작돼요. 독고 씨는 겉모습은 무뚝뚝하지만, 손님들의 이야기를 잘 들어주고 따뜻한 위로를 건네줍니다. 편의점에는
    사는 게 힘든 다양한 손님들이 찾아오는데, 독고 씨와의 만남을 통해 용기와 희망을 얻어가요. 이 책은 불편해 보이는 편의점에서 서로를 이해하고
    위로하며 성장하는 사람들의 따뜻한 마음을 보여주는 이야기랍니다.
'9791161571768':
  title: 나의 돈키호테 :김호연 장편소설
  summary: 한 아저씨가 다니던 회사에서 나오게 된 후, 스페인의 유명한 이야기 속 주인공 '돈키호테'처럼 살기로 마음먹어요. 아저씨는 현실
    속에서 보이는 불의한 일들을 바로잡기 위해 용감하게 나서요. 남들이 보기에 어리석어 보일 수도 있지만, 아저씨는 굳건한 신념으로 여러 모험을
    겪어요. 이 책은 꿈과 이상을 잃지 않고 어려운 상황 속에서도 도전하는 용기의 중요성을 알려준답니다. 자신만의 방식으로 세상을 살아가고 싶어
    하는 아저씨의 특별한 여정을 따라가 볼 수 있어요.
'9791162041376':
  title: 호랑이 빵집
  summary: 깊은 숲속에 무시무시한 호랑이 아저씨가 맛있는 빵집을 열었어요. 처음에는 동물 친구들이 호랑이가 무서워서 빵집 근처에도 가지 못했답니다.
    하지만 달콤하고 고소한 빵 냄새가 솔솔 풍겨 오자, 동물들은 용기를 내어 빵집 문을 열었어요. 호랑이 아저씨가 정성껏 만든 빵 맛에 반한 동물들은
    금세 호랑이 아저씨와 친구가 되었어요. 이제 호랑이 빵집은 숲속 동물들이 맛있는 빵도 먹고 서로 이야기를 나누는 따뜻한 장소가 되었답니다.
    이 책은 다른 모습의 친구라도 함께 마음을 나누면 친해질 수 있다는 것을 알려줘요.
'9791162041475':
  title: 후덜덜 식당
  summary: 주인공 하리네 집은 '후덜덜 식당'이라는 아주 특별한 식당을 운영해요. 이곳에는 무시무시한 귀신, 도깨비, 저승사자 같은 손님들이
    찾아와 신기한 음식들을 주문하죠. 하리는 처음엔 무서워하지만, 손님들이 원하는 음식을 정성껏 만들며 그들의 사연을 듣게 돼요. 음식을 만들고
    소통하면서 하리는 두려움을 이겨내고 용기를 얻게 됩니다. 특별한 손님들과의 만남을 통해 하리가 성장하는 흥미로운 이야기예요.
'9791162041499':
  title: 호랑이 빵집
  summary: 호랑이 한 마리가 무서운 모습과 달리 맛있는 빵을 만드는 꿈을 꾸며 빵집을 열어요. 처음에는 으르렁거리는 호랑이가 무서워 아무도
    빵집에 오지 않았어요. 하지만 호랑이는 포기하지 않고 매일 밤낮으로 정성껏 빵을 구웠죠. 어느 날, 배고픈 아기 다람쥐가 용기를 내어 빵집
    문을 열고 들어와요. 다람쥐는 호랑이의 따뜻하고 맛있는 빵에 반하게 되고, 소문이 퍼져 숲속 동물들이 하나둘 빵집으로 모여들기 시작해요. 결국
    호랑이 빵집은 모두에게 사랑받는 행복한 빵집이 된답니다.
'9791162041512':
  title: 호랑이 빵집
  summary: 깊은 숲속에 무섭게 생긴 호랑이가 맛있는 빵을 만드는 빵집을 열었어요. 처음에는 동물 친구들이 호랑이를 무서워해서 빵집에 가기를
    망설였답니다. 하지만 호랑이는 따뜻한 마음으로 정성껏 구운 빵으로 친구들을 맞이했어요. 숲속 동물들은 호랑이 빵집의 맛있는 빵을 맛보고 모두
    행복해졌어요. 이 이야기는 겉모습만 보고 판단하지 않고 서로의 진심을 알아가는 소중한 마음을 일깨워줘요.
'9791162041567':
  title: 후덜덜 식당
  summary: 보람이라는 평범한 초등학생이 신비로운 '후덜덜 식당'을 발견하게 돼요. 이 식당은 고민을 가진 특별한 손님들이 찾아와서 자신의
    마음속 어려움을 이야기하는 곳이에요. 식당 주인은 손님들의 사연을 듣고 그들에게 꼭 맞는 특별한 음식을 만들어 줍니다. 손님들은 그 음식을
    먹으며 용기를 얻고 마음의 상처를 치유받아요. 보람이도 식당을 오가며 다양한 손님들의 이야기를 듣고, 함께 성장하며 삶의 소중한 가치들을 배우게
    된답니다.
'9791162041697':
  title: 후덜덜 식당
  summary: 주인공 도리는 엄마 아빠가 운영하는 조금 특별한 '후덜덜 식당'에서 일어나는 기묘한 일들을 보게 돼요. 이 식당에는 살아있는 사람뿐만
    아니라, 다양한 사연을 가진 귀신 손님들이 찾아와 자기만의 특별한 음식을 주문한답니다. 도리는 손님들이 주문한 음식을 만들면서 벌어지는 재밌고
    때로는 조금 무시무시한 사건들을 겪어요. 귀신 손님들이 가진 저마다의 고민을 듣고, 도리와 가족들은 그들의 소원을 이루어 주기도 한답니다.
    이 책은 무섭지만 따뜻한 이야기로, 음식과 함께 여러 가지 감정을 나누는 특별한 식당의 이야기를 담고 있어요.
'9791162041772':
  title: 호랑이 빵집
  summary: 깊은 산속에 커다랗고 무서워 보이는 호랑이가 살았어요. 이 호랑이는 알고 보니 마음이 따뜻하고 빵 굽는 것을 아주 좋아하는 친구였답니다.
    호랑이는 맛있는 빵을 구워 숲속 동물 친구들을 위한 빵집을 열었어요. 처음에는 동물들이 호랑이를 무서워했지만, 호랑이가 만든 달콤한 빵을 맛보고는
    모두 마음을 열었답니다. 호랑이 빵집은 숲속의 인기 명소가 되고, 친구들은 빵을 나누며 행복하게 지냈어요. 겉모습만 보고 판단하지 않는다는
    교훈을 주는 따뜻한 이야기예요.
'9791162041864':
  title: 어느 날, 귀신이 되었다
  summary: 동우라는 평범한 남자아이가 있었어요. 어느 날, 동우는 뜻밖의 사고로 그만 귀신이 되고 말아요. 귀신이 된 동우는 자신의 몸으로
    돌아가기 위해 이승을 떠돌며 다른 귀신 친구들을 만나게 돼요. 이승에서 자신이 미처 몰랐던 소중한 것들과 사람들의 마음을 귀신의 눈으로 보게
    된답니다. 과연 동우는 다시 사람으로 돌아올 수 있을까요? 삶과 죽음의 의미를 생각해보게 하는 이야기예요.
'9791162041901':
  title: "(냠냠 쩝쩝) 악어 급식"
  summary: 악어는 고기만 좋아하고 채소는 너무 싫어하는 편식쟁이에요. 학교 급식 시간에는 채소를 안 먹으려고 여러 가지 꾀를 부리기도 해요.
    하지만 친구들과 선생님이 채소도 아주 맛있고 몸에 좋다는 걸 알려주어요. 용기를 낸 악어는 채소를 한입 먹어보고 깜짝 놀라게 된답니다. 결국
    악어는 편식하지 않고 냠냠 쩝쩝 즐겁게 급식을 먹는 아이로 변하는 이야기예요.
'9791162041949':
  title: 호랑이 빵집
  summary: 옛날 옛날, 빵을 무척 좋아하는 호랑이가 살았어요. 이 호랑이는 직접 맛있는 빵을 만들어서 숲속에 빵집을 열었답니다. 하지만 동물
    친구들은 무서운 호랑이 때문에 빵집에 선뜻 오지 못했어요. 호랑이는 친구들이 자신의 빵을 맛볼 수 있도록 여러 가지 방법으로 용기를 내어 다가갔어요.
    결국 동물 친구들은 호랑이의 따뜻한 진심과 맛있는 빵에 반해 모두 호랑이 빵집의 단골손님이 되었답니다. 겉모습만 보고 판단하지 않는 마음을
    배울 수 있는 이야기예요.
'9791162337561':
  title: 내일은 실험왕 :본격 대결 과학실험 만화
  summary: 내일은 실험왕은 주인공들이 신나는 과학 실험 대결을 펼치며 과학 원리를 배우는 인기 만화예요. 주인공 범우주와 친구들은 학교 대표로
    출전하여 멋진 실험을 보여주며 다양한 과학 지식을 익히죠. 이 책에서는 대기의 순환과 날씨가 어떻게 변하는지에 대한 과학적 원리를 재미있는
    이야기와 실험으로 알려주고 있어요. 친구들과 협력하여 문제를 해결하고, 숨겨진 과학 재능을 발견하는 과정이 아주 흥미진진하답니다. 실제 실험
    과정과 과학 이론을 만화로 쉽게 배울 수 있어 과학이 한층 더 재미있게 느껴질 거예요.
'9791162339466':
  title: "(추리 천재) 엉덩이 탐정"
  summary: 엉덩이 탐정은 얼굴이 엉덩이처럼 생긴 독특하고 멋진 탐정이에요. 항상 '흠흠, 냄새가 나는군!' 하고 말하며 날카로운 추리력으로
    사건을 해결하죠. 조수 브라운과 함께 어려운 사건들을 척척 해결하며 범인을 잡는답니다. 범인들은 엉덩이 탐정의 필살기인 '방귀' 공격에 깜짝
    놀라 도망가지 못해요. 책을 읽는 친구들도 엉덩이 탐정과 함께 단서를 찾아 추리하며 미스터리를 풀 수 있어서 정말 재미있어요.
'9791162339909':
  title: 내일은 실험왕 :본격 대결 과학실험 만화
  summary: 이 책은 주인공 친구들이 과학 실험 대회에 나가 여러 가지 신기한 과학 실험들을 펼치는 이야기예요. 친구들은 서로 대결하며 과학
    지식과 실험 실력을 뽐내지요. 책을 읽다 보면 우리 주변의 다양한 과학 원리들을 아주 쉽고 재미있게 배울 수 있어요. 흥미진진한 대결과 함께
    새로운 과학 사실들을 알아가는 즐거움을 느낄 수 있을 거예요. 과학이 어렵다고 생각했던 친구들도 과학이 얼마나 재미있는지 알게 될 거예요.
'9791164060481':
  title: "(이상한 과자 가게) 전천당"
  summary: 이 책은 아주 신비로운 과자 가게 '전천당'에 대한 이야기예요. 이 가게는 베니코 할머니가 운영하는데, 사람들의 고민을 해결해
    주거나 소원을 이루어주는 특별한 과자들을 팔아요. 하지만 전천당의 과자들은 그 과자를 사용하는 사람의 마음가짐에 따라 행운을 가져다주기도 하고,
    때로는 어려운 일을 겪게 만들기도 한답니다. 과자를 먹고 새로운 경험을 하게 되는 여러 아이들의 흥미진진하고 교훈적인 이야기가 가득해요. 어떤
    과자를 고르고 어떤 일이 벌어질지 궁금하다면 꼭 읽어보세요.
'9791164060498':
  title: "(이상한 과자 가게) 전천당"
  summary: 전천당은 아주 신기한 과자들을 파는 이상한 가게예요. 이곳의 과자들은 먹는 사람의 고민을 해결해주거나 소원을 이루어주는 특별한
    힘을 가지고 있답니다. 하지만 과자를 잘못 사용하면 오히려 예상치 못한 일이 벌어지기도 해요. 사람들은 저마다의 사연을 가지고 전천당을 찾아와요.
    베니코 할머니는 손님에게 꼭 맞는 과자를 골라주며 흥미로운 이야기를 만들어 갑니다. 과연 이 과자들이 손님들에게 행복을 가져다줄까요?
'9791164064748':
  title: "(이상한 과자 가게) 전천당"
  summary: 전천당은 아주 특별한 손님들만 찾아갈 수 있는 신비한 과자 가게예요. 가게 주인 베니코 아주머니는 손님들의 고민을 해결해 주거나
    소원을 들어주는 특별한 과자들을 팔아요. 하지만 이 과자들은 사용법을 잘 지키지 않으면 예상치 못한 일이 벌어지기도 한답니다. 각 이야기마다
    과자를 맛본 아이들이 겪는 재미있고 신기한 일들을 통해 소중한 깨달음을 얻게 돼요. 마법 같은 과자와 아이들의 선택, 그리고 그 결과에 대한
    흥미진진한 이야기들이 가득한 책이랍니다.
'9791164065097':
  title: "(이상한 과자 가게) 전천당"
  summary: 이상한 과자 가게 전천당은 평범한 사람들에게 특별한 과자를 파는 신비로운 가게예요. 이 과자들은 먹는 사람의 소원을 이루어주거나
    특별한 능력을 주지만, 사용 방법에 따라 좋은 일이나 나쁜 일이 생기기도 해요. 가게 주인 베니코는 손님들에게 과자를 팔 때마다 과자가 가져올
    결과를 미리 알 수 있죠. 손님들은 각자의 고민이나 소원을 가지고 전천당을 찾아오고, 과자를 통해 흥미진진하고 신기한 경험을 하게 돼요. 과연
    어떤 손님이 어떤 과자를 사고, 어떤 일이 일어날까요? 전천당의 과자들은 단순한 음식이 아니라, 인생의 중요한 선택과 결과를 보여주는 마법
    같은 도구랍니다.
'9791164065530':
  title: "(이상한 과자 가게) 전천당"
  summary: 이 책은 신비로운 과자 가게, '전천당'에 대한 이야기예요. 가게 주인인 베니코 할머니는 고민을 가진 사람들에게 각자의 소원에
    맞는 특별한 과자를 팔아요. 이 과자들은 먹는 사람의 소원을 이루어주기도 하고, 어려운 문제를 해결해 주기도 하지요. 하지만 과자를 잘못 사용하거나
    나쁜 마음으로 욕심을 부리면 뜻밖의 일이 벌어지기도 한답니다. 아이들은 전천당의 신기한 과자를 통해 중요한 깨달음을 얻게 된답니다.
'9791164065547':
  title: 수상한 놀이공원 천옥원 :전천당 번외편
  summary: 이 책은 인기 많은 '이상한 과자 가게 전천당' 시리즈의 특별한 번외편이에요. 이번에는 전천당의 라이벌인 수상한 놀이공원 '천옥원'이
    문을 열어요. 천옥원은 사람들의 마음을 사로잡을 만한 신기하고 짜릿한 놀이기구와 체험들을 제공하지만, 그 뒤에는 어딘가 모르게 으스스한 비밀이
    숨겨져 있죠. 욕심을 부리며 천옥원의 유혹에 빠져든 사람들은 예상치 못한 재미와 함께 깜짝 놀랄 만한 결과와 마주하게 된답니다. 과연 천옥원에서
    진짜 행복을 찾을 수 있을까요, 아니면 다른 것을 얻게 될까요? 전천당과는 또 다른 특별한 이야기에 빠져보세요!
'9791164065745':
  title: "(이상한 과자 가게) 전천당"
  summary: 전천당은 행운을 주는 신기한 과자를 파는 비밀스러운 가게예요. 이곳 주인인 베니코 할머니는 손님들의 고민을 해결해 줄 특별한 과자들을
    내놓아요. 이 과자들은 손님들의 소원을 들어주지만, 사용법을 잘못 알면 예상치 못한 결과가 나타나기도 한답니다. 책에는 여러 아이들이 전천당의
    과자를 먹고 겪는 재미있고 신비한 이야기들이 가득해요. 과자 때문에 벌어지는 사건들을 통해 무엇이 진정한 행운인지 생각해 볼 수 있을 거예요.
'9791164067169':
  title: 사고뭉치 소방관 오케이
  summary: 오케이 소방관은 언제나 열심이지만, 늘 실수투성이라 사고뭉치라고 불려요. 불이 나면 꼭 물을 엉뚱한 곳에 뿌리거나, 나무 위에
    고양이를 구해주려다 자기가 갇히기도 하지요. 하지만 오케이 소방관은 포기하지 않고 엉뚱한 방법으로라도 꼭 문제를 해결하려고 노력해요. 때로는
    실수가 큰 도움이 되기도 해서 친구들을 깜짝 놀라게 해요. 이 책은 실수해도 괜찮고 용기를 내어 도전하는 것이 얼마나 중요한지 가르쳐 준답니다.
'9791164067183':
  title: "(이상한 과자 가게) 전천당"
  summary: 전천당은 신비한 과자를 파는 이상한 가게예요. 이곳의 주인 베니코는 손님의 고민을 듣고 딱 맞는 특별한 과자를 추천해주죠. 이
    과자들은 먹는 사람의 소원을 이루어주지만, 과자를 잘못 사용하면 때로는 예상치 못한 재미있는 일이 벌어지기도 해요. 과연 손님들은 전천당의
    과자로 행복해질 수 있을까요? 이 책을 읽으면 평범한 사람들의 삶이 과자 하나로 얼마나 신기하게 바뀌는지 알 수 있을 거예요.
'9791164068890':
  title: 수상한 놀이공원 천옥원 :전천당 번외편
  summary: 이 책은 인기 만점 '이상한 과자 가게 전천당' 시리즈의 특별한 번외편이에요. 여기서는 신비로운 과자 대신, '천옥원'이라는 수상한
    놀이공원에서 아주 특별한 놀이기구들을 만날 수 있어요. 놀이공원에 찾아오는 아이들은 각자의 고민을 안고 놀이기구를 타며 해결할 기회를 얻게
    된답니다. 하지만 놀이기구를 제대로 즐기지 않거나 욕심을 부리면 예상치 못한 일이 일어날 수도 있어요. 과연 아이들은 천옥원에서 즐거운 시간을
    보내고 원하는 것을 얻을 수 있을까요? 전천당과는 또 다른 신기하고 흥미진진한 이야기들을 직접 경험해 보세요.
'9791164131686':
  title: 흔한남매
  summary: 흔한남매는 으뜸 오빠와 에이미 동생의 유쾌하고 시끌벅적한 일상 이야기예요. 매일매일 서로 장난치고 티격태격 싸우지만, 누구보다
    서로를 아끼는 평범한 남매랍니다. 만화처럼 재밌고 웃긴 에피소드들이 가득해서 읽다 보면 저절로 웃음이 터져 나올 거예요. 형제자매와 함께 생활하는
    친구들이라면 더욱 공감하며 즐겁게 읽을 수 있습니다. 때로는 따뜻한 마음을 나누는 모습도 보여주어 마음까지 훈훈해지는 이야기들이 담겨 있어요.
'9791164131914':
  title: "(추리 천재) 엉덩이 탐정"
  summary: 엉덩이 탐정은 엉덩이 모양의 얼굴을 가진 아주 특별한 탐정이에요. 그는 어떤 어려운 사건이든 날카로운 추리와 번뜩이는 지혜로 척척
    해결한답니다. 조수 브라운과 함께 여러 가지 사건들을 맡아 범인을 찾아내고 친구들을 도와주죠. 언제나 '흠흠, 냄새가 나는군!' 하고 말하며
    멋지게 사건을 해결하는 모습이 아주 인상적이에요. 이 책은 사건 해결 과정을 따라가며 숨은 그림 찾기나 미로 같은 재미있는 활동도 할 수 있어요!
'9791164132140':
  title: 내일은 실험왕 :본격 대결 과학실험 만화
  summary: "『내일은 실험왕』은 새벽초등학교 실험반 친구들이 전국 실험 대회에 참가하며 벌어지는 신나는 과학 만화예요. 주인공인 범우주와
    친구들은 다양한 과학 실험을 직접 하면서 과학의 원리를 쉽고 재미있게 배우게 됩니다. 때로는 어려운 문제에 부딪히기도 하고, 다른 학교 라이벌들과
    멋진 대결을 펼치기도 해요. 이 책을 읽다 보면 여러분도 신기한 과학 지식을 얻고, 과학 실험의 즐거움에 푹 빠져들게 될 거예요. 실험왕 친구들과
    함께 흥미진진한 과학의 세계로 떠나볼까요?"
'9791164132454':
  title: 흔한남매
  summary: 흔한남매는 으뜸이 오빠와 에이미 동생이 주인공으로 나오는 아주 재미있는 책이에요. 이 책에는 남매가 매일매일 겪는 흔하고 유쾌한
    일상들이 담겨 있어요. 서로 투닥투닥 싸우기도 하고 짓궂은 장난을 치기도 하지만, 사실은 서로를 누구보다 아끼고 사랑한답니다. 친구들과 학교에서
    생기는 일, 가족과의 에피소드 등 공감 가는 이야기가 많아서 읽는 내내 웃음이 터질 거예요. 유튜브에서 사랑받던 '흔한남매'의 이야기를 책으로
    만나볼 수 있답니다.
'9791164133673':
  title: 내일은 실험왕 :본격 대결 과학실험 만화
  summary: "「내일은 실험왕」은 초등학생 친구들이 과학 실험 대결을 펼치는 신나는 만화 시리즈예요. 주인공 범우주는 친구들과 함께 학교 실험반에서
    여러 가지 과학 실험을 하면서 과학의 원리를 배우고 성장해요. 친구들은 매번 새로운 주제로 흥미로운 실험 대결을 펼치며 서로 경쟁하고 협력하기도
    해요. 이 책을 읽으면 과학이 얼마나 재미있는지, 그리고 우리 주변에서 과학을 어떻게 만날 수 있는지 알게 될 거예요. 실험 대결을 따라가며
    과학 지식도 쌓고 문제 해결 능력도 기를 수 있답니다."
'9791164134090':
  title: "(추리 천재) 엉덩이 탐정"
  summary: 엉덩이 탐정은 아주 특별하고 똑똑한 추리 천재 탐정이에요. 그의 얼굴은 정말로 엉덩이 모양을 닮았답니다. 그는 '흠, 냄새가 나는군.'
    이라는 멋진 대사와 함께 어려운 사건들을 척척 해결하지요. 엉덩이 탐정은 조수 브라운과 함께 여러 마을의 미스터리한 사건들을 명쾌하게 풀어냅니다.
    이 책을 읽는 친구들은 엉덩이 탐정과 함께 범인을 찾으며 신나는 추리의 세계를 경험할 수 있을 거예요!
'9791164134267':
  title: 흔한남매
  summary: 흔한남매는 으뜸 오빠와 에이미 여동생의 유쾌하고 시끌벅적한 일상 이야기를 담은 인기 만화책이에요. 둘은 매일 티격태격 다투기도
    하고, 기상천외한 장난을 치면서 하루도 조용할 날이 없답니다. 학교생활에서 벌어지는 일들이나 집에서 벌이는 엉뚱한 소동들이 친구들의 공감을
    얻고 큰 웃음을 주어요. 책을 읽다 보면 흔히 볼 수 있는 남매의 모습에 나도 모르게 웃음이 터져 나올 거예요. 때로는 미워하고 때로는 아끼는
    흔한남매의 이야기가 재미있을 거예요.
'9791164134649':
  title: "(흔한남매) 안 흔한 일기"
  summary: 이 책은 인기 유튜버 흔한남매의 으뜸이와 에이미 남매가 직접 쓴 것 같은 일기 형식의 책이에요. 매일매일 학교에서, 집에서 벌어지는
    유쾌하고 기발한 사건들을 흔한남매만의 방식으로 솔직하고 재미있게 들려준답니다. 서로 장난치고 티격태격하다가도 결국은 서로를 아끼는 남매의 모습에
    공감하고 웃음이 터질 거예요. 일기를 읽다 보면 흔한남매의 특별하고 안 흔한 하루하루를 함께 경험하는 기분이 들 거예요.
'9791164134847':
  title: 흔한남매
  summary: 흔한남매는 으뜸이 오빠와 에이미 동생의 유쾌한 일상을 담은 이야기예요. 두 남매는 매일 티격태격 싸우기도 하고, 때로는 서로를
    챙겨주며 재미있는 추억을 만들어요. 유튜브 인기 채널 '흔한남매'의 이야기를 책으로 만나볼 수 있지요. 책에는 남매가 벌이는 엉뚱하고 재미있는
    에피소드들이 가득하답니다. 독자들은 으뜸이와 에이미의 좌충우돌 이야기를 보며 웃고 공감할 수 있을 거예요. 이 책을 읽으면 가족의 소중함과
    형제자매의 특별한 관계를 느낄 수 있을 거예요.
'9791164134991':
  title: 내일은 실험왕 :본격 대결 과학실험 만화
  summary: "『내일은 실험왕』은 주인공 범우주와 친구들이 과학 실험 대회에 참가하면서 벌어지는 재미있는 이야기를 담은 학습 만화예요. 친구들은
    대회에서 여러 가지 과학 실험을 직접 해보며 과학 원리를 배우고, 신기한 과학 지식을 익히게 된답니다. 대결을 통해 점점 성장하는 친구들의
    모습이 아주 흥미진진해요. 이 책을 읽다 보면 복잡하게 느껴지던 과학도 쉽고 재미있게 느껴질 거예요. 독자들이 직접 해볼 수 있는 간단한 실험
    키트가 함께 제공되어 더욱 즐겁게 과학을 체험할 수 있답니다. 과학을 좋아하게 만들어주는 멋진 책이에요."
'9791164135158':
  title: "(흔한남매) 안 흔한 일기"
  summary: 흔한남매 '안 흔한 일기'는 으뜸 오빠와 에이미 동생의 유쾌하고 시끌벅적한 하루하루를 일기처럼 담아낸 책이에요. 두 남매가 겪는
    평범하지 않은 사건들과 엉뚱한 장난들이 만화와 함께 펼쳐져 읽는 내내 웃음을 멈출 수 없을 거예요. 티격태격 다투면서도 서로를 아끼는 흔한남매의
    모습에서 가족의 소중함을 느낄 수 있답니다. 마치 내 옆집 오빠, 동생 이야기처럼 공감하며 재미있게 읽을 수 있을 거예요.
'9791164135226':
  title: "(처음 읽는) 그리스 로마 신화 =First Greek mythology"
  summary: 이 책은 아주 먼 옛날 그리스와 로마 사람들이 믿었던 신들의 재미있는 이야기를 담고 있어요. 하늘의 신 제우스, 바다의 신 포세이돈,
    지혜의 여신 아테나 등 여러 신들의 모험과 활약을 만날 수 있지요. 신들이 어떻게 세상을 만들고, 인간들과 어떤 관계를 맺었는지 흥미진진한
    사건들을 통해 알려줍니다. 용감한 영웅 헤라클레스와 꾀 많은 오디세우스처럼 유명한 이야기들도 쉽게 풀어서 설명해 준답니다. 흥미로운 신화 속
    이야기들을 읽으며 상상력도 키우고 세상에 대한 지식도 넓힐 수 있는 책이에요.
'9791164135592':
  title: 흔한남매
  summary: 이 책은 유튜브에서 큰 인기를 얻은 흔한남매 으뜸이와 에이미의 재미있는 일상을 담고 있어요. 오빠 으뜸이와 여동생 에이미가 서로
    장난치고 티격태격하는 모습이 정말 현실적이면서도 웃음을 터뜨리게 해요. 때로는 유치한 장난에 화가 나기도 하지만, 결국 서로를 아끼는 남매의
    따뜻한 마음을 느낄 수 있답니다. 친구들과 학교에서 겪는 평범한 이야기들도 공감하며 재미있게 읽을 수 있을 거예요.
'9791164135738':
  title: 에그박사 :Egg&bugs
  summary: 에그박사 일행이 숲과 여러 자연 속에서 신기하고 재미있는 곤충 친구들을 만나는 이야기예요. 이 책은 인기 유튜버 에그박사 팀이
    만든 곤충 관찰 만화로, 곤충들의 특별한 모습과 생태를 쉽고 재미있게 알려준답니다. 주인공들이 직접 곤충을 찾아다니며 생생한 정보들을 전달해
    주어, 마치 함께 탐험하는 기분이 들 거예요. 이 책을 읽으면 우리가 미처 몰랐던 곤충 세상의 놀라운 비밀들을 배우고, 자연과 생명을 소중히
    여기는 마음을 기를 수 있어요.
'9791164135790':
  title: 내일은 실험왕 :본격 대결 과학실험 만화
  summary: "『내일은 실험왕』은 과학 실험 대결을 통해 주인공 친구들이 성장하는 이야기예요. 주인공들은 학교를 대표해서 친구들과 팀을 이루어
    여러 가지 신기한 과학 실험들을 펼칩니다. 대결을 준비하고 실험을 하면서 우리 주변의 과학 원리들을 쉽고 재미있게 배우게 되지요. 이 책을
    읽으면 복잡해 보이던 과학이 사실은 얼마나 재미있는지 알게 될 거예요. 직접 실험에 참여하는 듯한 기분을 느끼면서 과학에 대한 호기심을 키울
    수 있답니다."
'9791164135851':
  title: "(처음 읽는) 그리스 로마 신화 =First Greek mythology"
  summary: 이 책은 아주 먼 옛날 그리스와 로마 사람들이 상상했던 신비로운 이야기들을 담고 있어요. 번개를 다루는 제우스 신과 지혜로운 아테나
    여신처럼 강력하고 개성 넘치는 신들이 세상을 다스리며 일어나는 흥미진진한 사건들을 만날 수 있답니다. 헤라클레스처럼 용감한 영웅들이 무서운
    괴물들과 싸우거나 어려운 모험을 겪는 이야기도 펼쳐져요. 신들의 질투와 사랑, 영웅들의 용기와 지혜를 통해 우리가 살아가는 데 필요한 많은
    교훈을 배울 수 있는 재미있는 책이에요.
'9791164136032':
  title: 흔한남매의 흔한 호기심 :일상에서 만나는 과학 상식
  summary: 이 책은 인기 유튜버 흔한남매 은한이와 해진이가 우리 주변의 재미있는 과학 현상들을 알려주는 책이에요. 왜 하늘은 파란색인지,
    무지개는 어떻게 생기는지 같은 궁금증을 흔한남매와 함께 쉽고 재미있게 풀어나가죠. 만화 형식으로 되어 있어서 딱딱하게 느껴질 수 있는 과학
    지식도 어렵지 않게 배울 수 있어요. 일상생활에서 만나는 여러 가지 과학 상식을 즐거운 이야기와 그림으로 만나볼 수 있어서 과학이 더욱 친근하게
    느껴질 거예요.
'9791164136223':
  title: "(흔한남매) 안 흔한 일기"
  summary: 이 책은 인기 유튜버 '흔한남매'의 이야기를 담은 재미있는 일기 형식의 책이에요. 장난기 넘치는 오빠 으뜸이와 똑 부러지는 동생
    에이미의 좌충우돌 일상을 엿볼 수 있어요. 둘은 매일 티격태격 싸우기도 하고, 엉뚱한 장난을 치면서 늘 시끌벅적한 하루를 보내죠. 아이들의
    공감을 얻는 흔한남매의 안 흔한 이야기가 웃음과 재미를 가득 선물할 거예요. 가끔은 서로를 위하는 마음도 엿볼 수 있어서, 가족의 소중함도
    느낄 수 있답니다.
'9791164136261':
  title: 흔한남매
  summary: 이 책은 유튜브에서 큰 인기를 얻은 '흔한남매'의 이야기를 만화로 만든 책이에요. 주인공인 오빠 으뜸이와 동생 에이미는 매일매일
    티격태격 싸우지만, 때로는 서로를 아껴주는 모습을 보여주기도 해요. 학교나 집에서 벌어지는 평범하면서도 아주 웃긴 에피소드들이 가득하답니다.
    이 책을 읽다 보면 여러분의 형제자매 관계와 비슷한 점을 찾아보며 공감하고 깔깔 웃게 될 거예요.
'9791164136438':
  title: 에그박사 :Egg&bugs
  summary: 이 책은 유명한 유튜브 채널 '에그박사'의 이야기를 담고 있어요. 에그박사, 옐로우, 떵군 세 친구가 신나는 모험을 떠나 다양한
    곤충 친구들을 만나는 이야기예요. 책을 읽으면서 곤충들이 어디에 사는지, 어떤 특별한 능력을 가졌는지 재미있게 배울 수 있답니다. 마치 에그박사
    친구들과 함께 직접 곤충을 관찰하는 것처럼 느껴질 거예요. 이 책은 우리 주변의 작은 생물들에 대한 궁금증을 풀어주고, 자연을 더욱 사랑하게
    만드는 데 도움을 줄 거예요.
'9791164136667':
  title: "(처음 읽는) 그리스 로마 신화 =First Greek mythology"
  summary: 이 책은 신비로운 그리스 로마 신화 이야기를 처음 접하는 어린이들을 위해 쓰였어요. 올림포스 신들의 왕인 제우스를 비롯해 용감한
    영웅들과 여러 신들의 흥미진진한 모험을 쉽고 재미있게 들려준답니다. 신들이 세상을 만들고 인간과 어떤 관계를 맺었는지, 그리고 어떤 특별한
    능력을 가졌는지 알 수 있어요. 신들의 사랑과 질투, 모험과 지혜가 가득한 이야기를 읽으며 상상의 날개를 펼칠 수 있을 거예요. 우리가 아는
    여러 별자리나 서양 문화의 이야기도 신화에서 시작되었다는 것을 알게 될 거예요. 어린이들이 신화 속 세상과 영웅들을 만나며 재미있게 신화를
    이해할 수 있도록 도와주는 책이랍니다.
'9791164137053':
  title: "(추리 천재) 엉덩이 탐정"
  summary: 엉덩이 탐정은 얼굴이 엉덩이 모양인 아주 특별한 탐정이에요. 똑똑한 조수 브라운과 함께 어려운 사건들을 척척 해결한답니다. 날카로운
    관찰력과 추리력으로 범인을 찾아내고, 마지막에는 시원한 '뿡' 한 방으로 사건을 마무리해요. 책 속에는 숨은 그림 찾기나 미로 같은 놀이 페이지도
    많아서 이야기를 읽는 재미가 두 배예요. 유쾌하고 흥미진진한 추리 이야기들을 만나볼 수 있답니다.
'9791164137121':
  title: 흔한남매의 흔한 호기심 :일상에서 만나는 과학 상식
  summary: 흔한남매의 에이미와 으뜸이가 우리 친구들이라면 한 번쯤 궁금해했을 일상 속 과학 질문들을 해결해 줘요. 왜 트림이 나올까요? 비행기는
    어떻게 하늘을 날까요? 재채기는 왜 할까요? 이런 호기심들을 만화와 함께 쉽고 재미있게 알려준답니다. 책을 읽다 보면 우리 몸과 주변 세상에
    숨어 있는 과학 원리들을 자연스럽게 이해하게 될 거예요. 궁금증도 풀고 과학 상식도 쑥쑥 키울 수 있는 즐거운 책이랍니다.
'9791164137176':
  title: "(흔한남매) 별난 방탈출 :탈출 미션 스토리북"
  summary: 인기 유튜버 흔한남매의 으뜸이와 에이미가 신나는 방탈출 게임에 참여하는 이야기예요. 둘은 여러 방에 갇히게 되고, 각각의 방에
    숨겨진 미션과 수수께끼를 풀어야 한답니다. 책을 읽는 친구들도 흔한남매와 함께 추리하고 정답을 맞히면서 즐거운 탈출 게임을 경험할 수 있어요.
    과연 으뜸이와 에이미는 무사히 모든 방을 탈출하고 숨겨진 비밀을 밝혀낼 수 있을까요?
'9791164137435':
  title: 에그박사 :Egg&bugs
  summary: 이 책은 인기 유튜브 채널 '에그박사'의 신나는 곤충 탐험 이야기를 담고 있어요. 에그박사, 꼼지, 와구 삼총사가 여러 가지 신기한
    곤충들을 만나러 모험을 떠나요. 재미있는 만화와 그림을 통해 아이들이 평소 궁금했던 곤충들의 특징이나 사는 모습들을 쉽게 배울 수 있답니다.
    숨어 있는 곤충을 찾아보거나, 곤충 퀴즈를 풀면서 자연을 더욱 친근하게 느낄 수 있을 거예요. 곤충을 좋아하는 친구들이라면 정말 재미있게 볼
    수 있는 책이랍니다.
'9791164137527':
  title: 흔한남매
  summary: 흔한남매는 으뜸이 오빠와 에이미 동생이 주인공으로 나오는 재미있는 일상 이야기예요. 이 책은 티격태격 싸우면서도 서로를 아끼는
    평범한 남매의 모습을 코믹하게 보여줍니다. 오빠가 동생을 놀리거나, 동생이 오빠에게 당하지 않으려 맞서는 좌충우돌 에피소드들이 가득해요. 친구들도
    이 책을 읽다 보면 엉뚱하고 유쾌한 남매의 모습에 웃음이 터질 거예요. 결국 서로를 소중히 여기는 흔한남매의 이야기는 우리 친구들에게도 공감과
    웃음을 선물해 줄 거예요.
'9791164137879':
  title: "(흔한남매) 별난 방탈출 :탈출 미션 스토리북"
  summary: 흔한남매 에이미와 으뜸이가 신비한 방탈출 게임에 갇히는 이야기예요. 이 책은 단순히 읽는 것을 넘어, 책 속에 숨겨진 다양한 퍼즐과
    미션을 직접 풀며 다음 이야기로 넘어갈 수 있도록 만들었어요. 친구들은 흔한남매와 함께 단서를 찾고, 어려운 문제를 해결하면서 마치 게임을
    하듯이 책을 즐길 수 있답니다. 마치 게임 속 주인공이 된 것처럼 재미있는 두뇌 게임을 경험할 수 있을 거예요. 과연 에이미와 으뜸이는 모든
    미션을 성공하고 방탈출에 성공할 수 있을까요?
'9791164137893':
  title: "(처음 읽는) 그리스 로마 신화 =First Greek mythology"
  summary: 이 책은 아주 먼 옛날, 그리스와 로마 사람들이 믿었던 신과 영웅들의 흥미로운 이야기를 담고 있어요. 힘센 제우스 신과 지혜로운
    아테나 여신, 바다의 신 포세이돈 같은 여러 신들이 올림포스 산에서 살며 인간 세상에 많은 영향을 주었답니다. 용감한 영웅들은 무서운 괴물을
    물리치거나 놀라운 모험을 떠나기도 했어요. 신들은 때로는 다투고, 때로는 사랑하며 재미있는 사건들을 많이 만들었지요. 이 이야기들을 읽다 보면
    세상을 움직이는 다양한 이야기와 지혜를 얻을 수 있을 거예요.
'9791164137923':
  title: 흔한남매의 흔한 호기심 :일상에서 만나는 과학 상식
  summary: 이 책은 인기 유튜브 채널 흔한남매가 일상 속에서 궁금했던 과학 질문들을 재미있게 풀어주는 책이에요. 으뜸이와 에이미 남매가 우리
    주변에서 일어나는 신기한 현상들을 함께 탐구하며 과학 원리를 알려준답니다. 왜 비행기는 하늘을 나는지, 스마트폰 화면은 어떻게 터치되는지 등
    다양한 질문에 대한 답을 찾을 수 있어요. 흔한남매 특유의 재치 있는 만화와 설명으로 과학을 쉽고 재미있게 이해할 수 있을 거예요. 과학이
    어렵다고 느꼈던 친구들도 이 책을 읽으면 과학과 한층 더 가까워질 수 있답니다.
'9791164138005':
  title: 웃소
  summary: 이 책은 인기 유튜브 채널 '웃소'의 재미있는 이야기를 담은 만화책이에요. 웃소 멤버들이 직접 캐릭터로 나와 여러 가지 신나는
    모험을 펼친답니다. 친구들과 함께 웃고 즐길 수 있는 유쾌한 에피소드들이 가득해요. 어떤 이야기는 독자가 직접 선택하며 다음 내용을 결정하는
    게임처럼 되어 있어서 더욱 재미있어요. 유튜브에서 보던 웃소의 유머와 상상력을 책으로도 만나볼 수 있답니다. 웃소를 좋아하는 친구들이라면 정말
    즐겁게 읽을 수 있을 거예요.
'9791164138197':
  title: 흔한남매
  summary: 이 책은 평범하지만 아주 특별한 재미를 가진 오빠 으뜸이와 여동생 에이미의 이야기예요. 둘은 매일 투닥투닥 싸우기도 하고, 엉뚱한
    장난을 치면서 하루를 보내죠. 때로는 서로를 골려주는 기발한 계획을 세우기도 하고, 재미있는 일상 에피소드들이 가득하답니다. 책을 읽다 보면
    여러분의 형제, 자매들과 비슷한 모습에 공감하고 깔깔 웃게 될 거예요. 유쾌한 흔한남매의 이야기 속에서 형제자매의 소중함을 발견할 수 있을
    거예요.
'9791164138425':
  title: 에그박사 :Egg&bugs
  summary: 에그박사 삼총사(에그박사, 웅박사, 닥터유)가 멋진 곤충 탐험을 떠나는 이야기예요. 이 책에서는 우리 주변에서 볼 수 있는 여러
    가지 곤충 친구들을 재미있는 이야기와 만화로 만날 수 있답니다. 곤충들이 어떻게 생겼는지, 어디에서 사는지, 어떤 특별한 능력을 가지고 있는지
    자세히 알려줘요. 신나는 모험을 따라가다 보면 곤충 박사님처럼 곤충에 대해 많이 알게 될 거예요. 이 책을 읽고 나면 곤충이 더 좋아지고 자연을
    아끼는 마음도 생길 거예요.
'9791164138715':
  title: "(흔한남매) 별난 방탈출 :탈출 미션 스토리북"
  summary: 이 책은 인기 유튜버 흔한남매의 으뜸이와 에이미가 주인공인 방 탈출 미션 스토리북이에요. 으뜸이와 에이미는 여러 가지 신비하고
    재미있는 방에 갇히게 되고, 친구들의 도움이 필요하답니다. 책을 읽는 친구들은 숨겨진 단서를 찾고, 주어진 문제를 풀면서 흔한남매가 각 방을
    탈출할 수 있도록 도와주어야 해요. 미션을 성공하면 다음 이야기로 넘어갈 수 있어서 더욱 흥미진진해요. 마치 게임을 하듯이 문제를 해결하며
    이야기를 읽는 즐거움을 느낄 수 있을 거예요. 과연 흔한남매와 친구들은 모든 방을 탈출하고 미션을 성공할 수 있을까요?
'9791164138920':
  title: "(처음 읽는) 그리스 로마 신화 =First Greek mythology"
  summary: 이 책은 아주 먼 옛날, 서양 사람들이 상상했던 신들과 영웅들의 흥미진진한 이야기를 담고 있어요. 하늘의 신 제우스와 바다의 신
    포세이돈, 지혜의 여신 아테나 등 다양한 신들이 저마다 특별한 능력과 개성을 뽐낸답니다. 때로는 신들끼리 다투고, 때로는 인간 세상에 내려와
    흥미진진한 모험을 펼치기도 해요. 헤라클레스처럼 용감한 영웅들이 무서운 괴물과 맞서 싸우는 이야기도 가득하죠. 신들의 재미있는 이야기는 물론,
    옛날 사람들의 지혜와 상상력을 엿볼 수 있는 멋진 책이랍니다.
'9791164138982':
  title: 흔한남매의 흔한 호기심 :일상에서 만나는 과학 상식
  summary: 이 책은 인기 유튜버 흔한남매의 에이미와 으뜸이가 등장하여, 우리 친구들이 평소에 궁금해했던 과학 질문들을 함께 파헤치는 이야기예요.
    왜 비가 오는지, 왜 하늘은 파란색인지처럼 일상 속에서 만나는 다양한 궁금증들을 흔한남매만의 유쾌하고 재미있는 방식으로 풀어준답니다. 만화처럼
    이야기가 전개되어서 과학이 어렵다고 생각했던 친구들도 지루할 틈 없이 즐겁게 읽을 수 있을 거예요. 이 책을 읽다 보면 우리 주변의 모든 현상
    속에 숨어있는 과학 원리를 쉽게 이해하고, 과학 상식을 쑥쑥 늘릴 수 있을 거예요.
'9791164139750':
  title: 에그박사 :Egg&bugs
  summary: 이 책은 인기 유튜버 에그박사 팀이 들려주는 신나는 곤충 이야기예요. 에그박사 삼총사와 함께 다양한 곤충들의 생김새와 살아가는
    방식을 재미있게 탐험할 수 있답니다. 우리가 미처 몰랐던 곤충들의 신기하고 놀라운 비밀들을 그림과 함께 알기 쉽게 설명해 줘요. 곤충들이 사는
    곳이나 특별한 능력 등을 배우면서 자연과 더욱 친해질 수 있을 거예요. 이 책을 읽으면 마치 에그박사 팀과 함께 직접 곤충을 관찰하는 것처럼
    흥미로운 경험을 할 수 있어요.
'9791164139880':
  title: 흔한남매 겨울밤 대소동 :흔한남매 스페셜 에디션 겨울
  summary: 으뜸이와 에이미 흔한남매는 추운 겨울밤, 집에서 심심함을 참지 못하고 또 시끌벅적한 장난을 벌이기 시작해요. 조용하고 평화로워야
    할 밤이 흔한남매 때문에 온통 소동으로 가득 차게 된답니다. 서로를 골탕 먹이려다가 우스꽝스러운 상황에 빠지기도 하고, 예상치 못한 사건에
    휘말리기도 하면서 웃음을 선사해요. 과연 흔한남매는 시끌벅적한 겨울밤을 무사히 보낼 수 있을까요? 언제나처럼 예측 불가능한 흔한남매의 특별하고
    재미있는 겨울 이야기랍니다.
'9791164139897':
  title: 흔한남매
  summary: 이 책은 으뜸이 오빠와 에이미 동생, 흔한남매의 유쾌한 일상을 담고 있어요. 두 남매는 늘 서로를 놀리고 장난치며 티격태격 싸우지만,
    사실은 누구보다 서로를 아끼는 마음을 가지고 있답니다. 학교와 집에서 벌어지는 다양한 에피소드들이 마치 우리 주변에서 실제로 일어날 법한 이야기라
    공감이 가득해요. 친구와 부모님과의 관계, 학교생활 등 초등학생 친구들이라면 누구나 흥미롭게 읽을 수 있는 재미있는 내용이 많아요. 읽다 보면
    웃음이 끊이지 않고 우리 집 이야기 같아서 더욱 즐거울 거예요.
'9791164139910':
  title: 웃소
  summary: 이 책은 인기 유튜브 채널 '웃소'의 유쾌한 멤버들이 등장하는 신나는 이야기예요. 웃소 친구들은 기상천외한 미션을 해결하고, 엉뚱하면서도
    재미있는 상황들을 겪으며 독자들에게 즐거움을 선사해요. 책을 읽다 보면 웃소 멤버들의 개성 넘치는 매력에 빠져들게 될 거예요. 때로는 모험을
    떠나고, 때로는 문제를 해결하며 함께 웃고 새로운 것을 배울 수 있는 유쾌한 책이랍니다.
'9791164139927':
  title: "(처음 읽는) 그리스 로마 신화 =First Greek mythology"
  summary: 이 책은 아주 오래전 그리스와 로마 사람들이 상상했던 신비로운 이야기를 담고 있어요. 힘센 신들과 여신들이 올림포스 산에 살면서
    세상을 다스리고, 각각 특별한 능력을 가지고 있었죠. 용감한 영웅들은 무서운 괴물들과 싸우거나 놀라운 모험을 떠나기도 해요. 이 이야기들 속에는
    사람들의 지혜와 용기, 그리고 실수와 사랑 등 다양한 감정과 교훈이 숨어있답니다. 흥미진진한 신들의 이야기와 영웅들의 모험을 통해 상상력을
    키워보세요!
'9791165341909':
  title: 달러구트 꿈 백화점 :주문하신 꿈은 매진입니다
  summary: 이 책은 우리가 잠자는 동안 꾸는 '꿈'을 사고파는 특별한 백화점 이야기예요. 달러구트라는 신비로운 주인이 운영하는 이 백화점에서는
    다양한 종류의 꿈들을 팔고 있지요. 사람들은 잠이 들면 이 백화점에 찾아와 자신에게 맞는 꿈을 고르고, 꿈을 통해 위로를 받거나 힘을 얻기도
    해요. 새내기 직원 페니가 손님들에게 꿈을 팔면서 겪는 여러 가지 신기하고 따뜻한 이야기들이 펼쳐진답니다. 꿈에 대한 상상력 가득한 이야기들을
    읽으면서 꿈의 소중함을 느낄 수 있을 거예요.
'9791165343729':
  title: 달러구트 꿈 백화점 :이미예 장편소설
  summary: 잠든 사람들이 찾아오는 신비로운 '달러구트 꿈 백화점' 이야기예요. 이곳에서는 매일 밤 특별한 꿈들을 사고팔 수 있답니다. 주인공
    페니는 꿈 백화점에 취직해서 꿈을 파는 일을 배우게 돼요. 다양한 손님들은 저마다 원하는 꿈을 찾아 백화점을 방문하고, 페니는 그들에게 꼭
    맞는 꿈을 찾아 추천해 줍니다. 슬프거나 기쁘거나 때로는 신기한 꿈들을 만나며, 페니는 꿈의 진정한 의미와 소중함을 깨닫게 되는 따뜻한 이야기예요.
'9791165382650':
  title: 설민석의 한국사 대모험
  summary: 이 책은 태건이와 온달, 평강 공주가 시간 여행을 하면서 우리나라의 신나는 역사를 배우는 만화책이에요. 설민석 선생님이 들려주는
    재미있는 역사 이야기 덕분에 지루할 틈이 없답니다. 각 권마다 조선 시대, 삼국 시대 등 우리나라의 중요한 역사 시대를 탐험해요. 아이들이
    어려워하는 역사 지식을 쉽고 재미있게 알려주어 인기가 많아요. 역사 인물들을 직접 만나고 사건들을 경험하면서 자연스럽게 역사를 익힐 수 있어요.
    이 책을 읽으면 역사 공부가 아주 즐거워질 거예요.
'9791165382674':
  title: 설민석의 한국사 대모험
  summary: 이 책은 온달과 평강 공주가 시간 여행을 하면서 우리나라 역사를 배우는 만화책이에요. 설민석 선생님이 친구들 옆에서 중요한 역사
    이야기들을 쉽고 재미있게 설명해 준답니다. 고조선부터 현대까지 다양한 시대의 인물과 사건들을 흥미진진하게 만날 수 있어요. 역사가 어렵다고
    생각했던 친구들도 이 책을 읽으면 우리나라 역사의 재미에 푹 빠질 거예요. 책을 읽다 보면 자연스럽게 역사 지식도 쑥쑥 늘어날 거예요.
'9791165382704':
  title: 설민석의 한국사 대모험
  summary: 온달과 평강 공주의 후손인 온이와 평강이는 설민석 선생님과 함께 시간 여행을 떠나요. 이들은 우리나라의 중요한 역사 속 인물이나
    사건이 일어난 시대로 직접 찾아가요. 그곳에서 엉뚱한 사건에 휘말리기도 하고, 때로는 위험한 상황을 용감하게 헤쳐나가며 역사를 배워요. 흥미진진한
    모험을 통해 우리 역사에 대한 재미있는 사실들을 쉽고 즐겁게 알 수 있는 책이에요. 친구들도 이 책을 읽으며 역사 공부가 얼마나 재미있는지
    깨닫게 될 거예요.
'9791165382841':
  title: 설민석의 한국사 대모험
  summary: 이 책은 설민석 선생님이 어린이들을 위해 한국사를 쉽고 재미있게 알려주는 역사 만화책이에요. 주인공 온달과 평강이 시간 여행을
    떠나면서 옛날 사람들을 만나고 중요한 역사 사건들을 직접 겪게 된답니다. 어린이들이 흥미진진한 모험을 따라가다 보면 자연스럽게 역사 지식을
    얻을 수 있어요. 그림과 대화로 가득해서 어렵게 느껴질 수 있는 역사도 재미있게 배우고, 우리 조상들의 지혜와 용기를 느낄 수 있을 거예요.
'9791165382940':
  title: 설민석의 한국사 대모험
  summary: 이 책은 설민석 선생님과 함께 떠나는 신나는 한국사 시간 여행 이야기예요. 주인공 온달과 평강 공주, 그리고 설쌤이 시간을 넘나들며
    과거의 중요한 순간들을 직접 체험하게 돼요. 역사 속 인물들을 만나고, 흥미진진한 사건들을 겪으면서 우리 역사를 재미있게 배울 수 있답니다.
    마치 게임처럼 모험을 하면서 자연스럽게 역사의 흐름을 익히고, 나라를 지킨 위인들의 이야기도 만날 수 있어요. 어려운 역사를 만화로 쉽고 즐겁게
    알려주는 아주 유익한 책 시리즈랍니다.
'9791165382988':
  title: '설민석의 한국사 대모험 18 - 후삼국 편 : 온달의 기묘한 시간 여행'
  summary: 이 책은 평강 공주와 온달이 한국의 옛날 역사 속으로 모험을 떠나는 이야기예요. 이번에는 후삼국 시대로 시간 여행을 가서 중요한
    역사적 사건들을 직접 겪게 됩니다. 평강 공주와 온달은 궁예와 왕건 같은 인물들을 만나면서 후삼국 시대의 혼란과 새로운 나라 고려가 어떻게
    세워졌는지 배우게 돼요. 재미있는 시간 여행을 통해 우리 역사의 중요한 순간들을 신나게 알아볼 수 있습니다.
'9791165383053':
  title: 설민석의 한국사 대모험
  summary: 이 책은 설민석 선생님과 함께 우리나라 역사를 재미있게 배우는 만화책이에요. 주인공 온달과 평강 공주, 그리고 설쌤이 시간 여행을
    하면서 여러 시대의 역사 속 인물들을 만나요. 고구려부터 조선 시대까지, 중요한 사건들과 인물들의 이야기를 생생하게 알려준답니다. 읽다 보면
    마치 역사 속으로 직접 들어간 것처럼 신나고 재미있어서 역사가 저절로 머리에 쏙쏙 들어올 거예요. 어렵게 느껴질 수 있는 한국사를 모험처럼
    즐기면서 배울 수 있는 아주 유익한 책이랍니다.
'9791165383114':
  title: 설민석의 한국사 대모험
  summary: 이 책은 설쌤과 친구들이 시간 여행을 하며 우리나라의 역사를 모험하는 이야기예요. 주인공인 온달과 평강이 설쌤과 함께 과거로 떠나
    여러 시대의 역사 속 위인들을 만나죠. 어린이들이 어렵게 생각할 수 있는 한국사를 만화 형식으로 쉽고 재미있게 알려준답니다. 신나는 모험을
    통해 역사적 사건들을 직접 겪는 것처럼 생생하게 배울 수 있어요. 이 책을 읽으면 한국사에 대한 흥미와 지식이 쑥쑥 자랄 거예요.
'9791165702670':
  title: 너의 여름에 내가 닿을게 :안세화 장편소설
  summary: 이 책은 주인공 하리가 특별한 여름을 보내는 이야기예요. 하리는 가족의 비밀을 간직한 채 낡은 아파트에서 혼자 여름 방학을 보내게
    돼요. 그곳에서 만난 신비로운 소년 민준과 함께 시간을 보내며, 하리는 자신의 숨겨진 과거와 가족의 소중한 비밀들을 하나씩 알아갑니다. 이
    여름은 하리에게 뜻밖의 위로와 성장을 가져다주며, 따뜻한 우정과 가족의 의미를 다시 한번 느끼게 해 줄 거예요.
'9791165703578':
  title: '오늘의 의뢰: 너만 아는 비밀 :김성민 장편소설'
  summary: 주인공 '나'는 털북숭이 개 '나비'와 함께 남들의 비밀스러운 의뢰를 해결해 주는 '오늘의 의뢰'라는 특별한 회사를 운영해요.
    어느 날 자신에게 도착한 이상한 의뢰 편지를 발견하고, 누군가 자신을 찾고 있음을 알게 됩니다. 가장 친한 친구 서영이가 '나'의 비밀을 알게
    되면서 이야기는 점점 더 흥미진진해져요. '나'는 친구들과 함께 여러 사건을 해결하며 자신을 찾아온 사람의 정체를 밝혀내야 합니다. 이 책은
    친구들과의 우정과 함께 비밀을 지켜나가며 성장하는 모험 이야기예요.
'9791166830013':
  title: 요괴의 아이를 돌봐드립니다
  summary: 주인공 치요는 아기를 세상에서 가장 싫어하는 어린 소녀예요. 치요 할머니는 신기한 물건을 맡아주는 '이즈모 물건 보관소'를 운영하시는데,
    어느 날 할머니가 아파서 치요가 대신 가게를 맡게 되었어요. 그런데 찾아오는 손님들은 모두 신기한 요괴들이었고, 그들이 맡기는 것은 바로 조그만
    요괴 아기들이었지요. 치요는 할머니 대신 요괴 아기들을 돌보며 특별한 경험을 하고, 아기를 싫어하던 마음도 조금씩 변하게 된답니다. 요괴 아기들을
    통해 성장하는 치요의 이야기가 흥미진진하게 펼쳐져요.
'9791167031075':
  title: 가짜 모범생 :손현주 장편소설
  summary: 이 책은 겉으로는 늘 칭찬받는 모범생이지만, 학교 밖에서는 몰래 다른 모습을 하고 싶은 주인공 이로운의 이야기예요. 로운이는 학교
    친구들에게는 완벽한 모습을 보여주려고 애쓰지만, 사실은 자유롭게 놀고 싶은 마음이 가득하죠. 그러다 로운이의 비밀을 아는 친구가 나타나면서
    로운이는 큰 고민에 빠지게 돼요. 과연 로운이는 자신의 진짜 모습을 용기 있게 보여주고, 친구들과 진정한 관계를 맺을 수 있을까요? 겉모습과
    진짜 나, 그리고 친구 관계에 대해 생각해 볼 수 있는 재미있는 이야기랍니다.
'9791167031754':
  title: 신상문구점
  summary: 이 책은 아주 특별한 문구점, '신상문구점'에 대한 이야기예요. 주인공은 우연히 이 문구점을 발견하게 되는데, 이곳은 평범한 문구점이
    아니랍니다. 신상문구점에서는 친구들과의 고민이나 학교생활의 어려움을 해결해 주는 마법 같은 문구들을 팔아요. 주인공은 연필, 지우개, 공책
    같은 특별한 물건들의 도움을 받아 여러 가지 문제를 해결하고 용기를 얻게 된답니다. 어린이들의 마음을 따뜻하게 위로하고 성장할 수 있도록 도와주는
    신나는 모험 이야기예요.
'9791167390615':
  title: 신기한 맛 도깨비 식당
  summary: 평범한 음식이 지겹던 진호는 어느 날 신비한 도깨비 식당을 발견했어요. 그곳에는 도깨비 요리사가 평범한 재료로 세상에 없는 특별한
    음식을 만들어 주었죠. 구름처럼 폭신한 떡볶이, 반짝이는 김치찌개 등 마법 같은 요리들을 맛보며 진호는 깜짝 놀라요. 이 식당에서 진호는 음식의
    소중함과 즐거움을 깨닫고, 상상력 가득한 맛의 세계를 경험하게 된답니다. 맛있는 음식이 주는 행복과 따뜻한 마음을 배우는 재미있는 이야기에요.
'9791167390646':
  title: 신기한 맛 도깨비 식당
  summary: 주인공 동동이는 우연히 신기한 도깨비 식당을 발견해요. 이 식당에서는 도깨비들이 사람들의 마음을 달래주는 특별한 음식을 만들지요.
    음식을 먹으면 슬픈 마음이 사라지거나 용기가 생기는 등 놀라운 변화가 일어나요. 동동이는 도깨비들과 함께 사람들의 고민을 듣고, 음식으로 그들의
    마음을 치유하는 것을 도와줘요. 이 과정을 통해 동동이도 성장하고, 감정의 소중함을 깨닫게 된답니다.
'9791167390691':
  title: 신기한 맛 도깨비 식당
  summary: 맛없어라는 이름을 가진 친구는 음식 먹는 것을 싫어했어요. 음식이 싫어서 집을 떠나 길을 헤매다 신기한 식당을 발견해요. 그곳은
    도깨비들이 요리하는 '도깨비 식당'이었어요. 도깨비들은 할머니의 사랑, 아빠의 웃음 같은 특별한 재료로 맛있는 음식을 만들었지요. 맛없어는
    도깨비 식당의 음식을 먹고 세상 모든 음식의 소중한 맛을 알게 되고, 가족의 사랑도 깨닫게 된답니다.
'9791167390837':
  title: 신기한 맛 도깨비 식당
  summary: 동동이가 우연히 신기한 도깨비 식당을 발견하면서 이야기가 시작돼요. 이 식당에서는 도깨비 할아버지가 손님들의 고민을 해결해 주는
    특별한 음식을 만들어 팔아요. 동동이는 도깨비 할아버지를 도와 손님들의 재미있고 슬픈 이야기들을 듣게 돼요. 음식을 먹은 손님들은 용기를 얻거나,
    친구의 소중함을 깨닫는 등 특별한 경험을 하게 되지요. 동동이도 이 과정에서 많은 것을 배우고 성장해 가는 따뜻하고 즐거운 동화랍니다.
'9791167390929':
  title: 신기한 맛 도깨비 식당
  summary: 은동이는 엄마와 크게 다툰 후 할머니 댁으로 향합니다. 그곳에서 우연히 '도깨비 식당'이라는 신기한 식당을 발견하게 돼요. 이
    식당은 손님들의 슬픔, 걱정 같은 감정을 맛있는 음식으로 바꿔 주는 특별한 곳이에요. 은동이는 도깨비 식당에서 여러 가지 맛있는 음식을 먹으며
    친구와 가족의 소중함을 깨닫고 마음을 치유하게 된답니다. 맛있는 음식과 함께 성장하는 은동이의 따뜻한 이야기예요.
'9791167390943':
  title: 고민을 들어줘 닥터 별냥
  summary: 별냥 선생님은 아이들의 마음속 고민을 들어주고 해결해 주는 아주 특별한 고양이 의사예요. 아이들은 학교생활, 친구 관계, 가족
    문제 등 다양한 고민을 안고 별냥 선생님을 찾아옵니다. 별냥 선생님은 따뜻하고 지혜로운 방법으로 아이들이 스스로 고민을 극복할 수 있도록 도와줘요.
    이 책을 읽으면 여러분도 별냥 선생님처럼 지혜롭게 고민을 해결하는 방법을 배울 수 있을 거예요. 서로 다른 고민을 가진 친구들의 이야기를 통해
    공감하고 위로도 받을 수 있습니다.
'9791167391018':
  title: 신기한 맛 도깨비 식당
  summary: 주인공 은동이가 엄마와 다툰 후 심부름을 가다 신비로운 도깨비 식당을 발견해요. 이 식당은 손님에게 딱 필요한 신기한 음식을 만들어주는
    곳이에요. 은동이는 도깨비 할머니가 내어준 특별한 음식을 맛보며 자신의 마음을 들여다보고 엄마의 사랑을 깨닫게 됩니다. 음식을 통해 가족의
    소중함과 화해하는 법을 배우는 따뜻한 이야기예요. 아이들은 이 책을 읽으며 음식의 힘과 사랑의 의미를 느낄 수 있을 거예요.
'9791167391209':
  title: 신기한 맛 도깨비 식당 8
  summary: 이 책은 맛있는 음식으로 친구들의 고민을 해결해 주는 도깨비 식당의 여덟 번째 이야기예요. 이번 편에서는 뜨거운 화를 다스려주는
    특별한 '불꽃 찹쌀떡'이 등장한답니다. 도깨비 주방장과 조수 반짝이가 만든 찹쌀떡을 먹은 친구는 자기 마음을 다스리는 방법을 배우게 돼요.
    이야기를 읽으며 우리 친구들도 자기 감정을 잘 살펴보고, 친구들과 함께 지혜롭게 어려움을 이겨내는 방법을 배울 수 있을 거예요.
'9791167391391':
  title: 신기한 맛 도깨비 식당
  summary: 이 책은 아이들의 고민과 감정을 특별한 음식으로 풀어주는 신비한 도깨비 식당 이야기예요. 주인공 아이는 학교생활이나 친구 관계에서
    힘든 일이 생길 때 이 식당을 찾아가요. 도깨비 식당 주인은 아이의 마음에 꼭 맞는 맛있는 음식을 내주면서, 아이가 자신의 감정을 이해하고
    표현할 수 있도록 도와줘요. 아이들은 맛있는 음식을 먹으며 마음의 위로를 받고, 용기를 얻어 어려움을 극복하는 방법을 배워요. 이 따뜻한 이야기는
    아이들이 힘들 때 슬기롭게 헤쳐 나갈 힘을 선물해 준답니다.
'9791167550804':
  title: 블랙박스 :세상에서 너를 지우려면
  summary: 주인공 유하는 어느 날 갑자기 자신을 둘러싼 이상한 소문과 나쁜 글들 때문에 힘든 시간을 보내게 돼요. 친구들은 유하를 오해하고
    따돌리기 시작하며, 유하는 마치 세상에서 지워지는 것 같은 외로움을 느낍니다. 누가 왜 이런 일을 꾸몄는지 알 수 없어 유하는 너무나 혼란스럽고
    무서워요. 하지만 유하는 용기를 내어 자신을 둘러싼 오해와 진실을 찾아 나서기로 결심합니다. 이 책은 우리가 함부로 하는 말이나 퍼지는 소문이
    한 친구에게 얼마나 큰 상처가 될 수 있는지 생각하게 해주는 이야기입니다. 어려움 속에서도 자신을 지키려는 유하의 이야기는 우리에게 소중한
    교훈을 줍니다.
'9791167550903':
  title: 열세 살 우리는
  summary: 이 책은 열세 살이 된 친구들의 고민과 일상을 다룬 이야기예요. 주인공들은 학교생활, 친구들과의 우정, 그리고 가족 문제 등 여러
    가지 어려움을 겪게 돼요. 때로는 친구 사이에서 오해가 생기거나, 혼자만 힘든 비밀을 간직하기도 하죠. 하지만 서로를 이해하고 도와주면서 조금씩
    성장해 나가는 모습을 보여준답니다. 이 책을 읽으면 열세 살 친구들의 마음을 이해하고 공감할 수 있을 거예요.
'9791167550972':
  title: 당연하게도 나는 너를 :이꽃님 장편소설
  summary: 미미는 어느 날 갑자기 사라진 엄마를 찾아 여행을 떠나요. 엄마가 남긴 오래된 일기장과 그림들을 따라가며, 미미는 엄마의 어린
    시절 비밀을 하나씩 알게 됩니다. 엄마는 어렸을 때 헤어진 친엄마를 찾고 있었고, 미미는 엄마의 마음을 이해하며 함께 엄마의 엄마를 찾아나서죠.
    이 모험을 통해 미미는 엄마를 더욱 사랑하게 되고, 가족의 진짜 의미를 깨닫게 되는 따뜻한 이야기입니다.
'9791167552006':
  title: 햇빛초 대나무 숲의 모든 글이 삭제되었습니다
  summary: 햇빛초등학교 학생들만 아는 비밀 공간, '대나무 숲'이 있어요. 이곳에서 학생들은 익명으로 재미있는 이야기나 불만들을 털어놓곤
    했죠. 그런데 어느 날, 대나무 숲의 모든 글이 감쪽같이 사라져 버리는 사건이 발생해요. 학생들은 글이 사라진 이유를 궁금해하며 혼란에 빠지게
    됩니다. 이 사건을 통해 학생들은 자신이 쓴 글과 친구들의 마음을 다시 한번 돌아보게 되면서, 진정한 우정과 소통의 중요성을 깨닫게 되는 이야기예요.
'9791167553157':
  title: 브릿지 :문경민 장편소설
  summary: 서현이라는 친구는 가장 친한 친구가 이사를 가버려 너무 외로웠어요. 그러던 어느 날, 서현이는 비밀스러운 인터넷 커뮤니티인 '브릿지'에
    가입하게 돼요. 그곳에서 서현이는 다른 친구들과 솔직한 고민을 나누고, 자신과 비슷한 마음을 가진 친구들을 만나 위로를 받아요. 이 책은 외로움을
    느끼던 서현이가 인터넷 세상에서 새로운 관계를 맺으며 성장하는 이야기예요. 서로의 마음을 이어주는 다리처럼, 친구들과 소통하는 것의 소중함을
    깨닫게 해준답니다.
'9791167553294':
  title: 고백해도 되는 타이밍 :황영미 장편소설
  summary: "「고백해도 되는 타이밍」은 좋아하는 친구에게 마음을 고백할까 말까 고민하는 민준이의 이야기예요. 민준이는 좋아하는 친구에게 솔직한
    마음을 전하고 싶지만, 언제 어떻게 말해야 할지 몰라 늘 망설입니다. 학교에서 일어나는 여러 사건들과 친구들과의 관계 속에서 민준이는 고백할
    기회를 찾으려고 애씁니다. 과연 민준이는 가장 좋은 순간에 자신의 마음을 용기 있게 전할 수 있을까요? 이 책을 읽다 보면 민준이의 두근거리는
    마음과 성장하는 모습을 함께 느낄 수 있을 거예요."
'9791167553300':
  title: 내가 없던 어느 밤에 :이꽃님 장편소설
  summary: 한밤중에 엄마가 돌아가시고, 가람이는 큰 슬픔에 잠겨요. 그런데 엄마의 죽음이 사고가 아닐지도 모른다는 이상한 소문이 들려오기
    시작했어요. 가람이는 엄마가 왜 돌아가셨는지 진실을 찾기 위해 엄마의 흔적을 따라가며 숨겨진 비밀들을 하나씩 마주하게 돼요. 과연 가람이는
