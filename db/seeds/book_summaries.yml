'9791186805978':
  title: "(어린이를 위한) 그릿"
  summary: 이 책은 끝까지 포기하지 않고 노력하는 마음, 즉 '그릿'이 왜 중요한지 어린이 눈높이에서 설명해 주는 책이에요. 재능보다 꾸준한
    노력과 열정이 목표를 이루는 데 더 큰 힘이 된다는 것을 다양한 예시와 이야기로 보여 줘요. 어려운 일을 만났을 때 쉽게 포기하지 않고 다시
    도전하는 태도가 왜 필요한지 알려 줘요. 작은 성공 경험을 쌓아 가며 자신감을 키우는 방법도 함께 소개해요. 꿈을 이루기 위해 꾸준함이 왜
    중요한지 깨닫게 해 주는 책이에요.
'9791171174300':
  title: 그리스 로마 신화
  summary: 제우스를 비롯한 올림포스의 신들이 어떻게 세상을 다스리게 되었는지부터 이야기가 시작돼요. 헤라클레스의 열두 가지 과업, 트로이
