'9791186940020':
  title: 조선왕조실톡
  summary: 조선 시대 임금님들과 신하들이 마치 요즘 친구들처럼 스마트폰으로 카카오톡을 주고받는 것처럼 그려진 재미있는 역사 만화예요. 태조부터
    여러 임금님까지 진짜 있었던 역사 이야기를 웃긴 말투와 이모티콘으로 쉽게 풀어내요. 임금님도 우리처럼 고민하고 다투고 웃는 모습을 보면서 조선
    역사가 훨씬 가깝게 느껴진답니다. 만화 뒤에는 역사 선생님이 실제 있었던 일을 친절하게 설명해 주는 코너도 있어요. 어렵게만 느껴지던 조선왕조
    역사를 웃으면서 배울 수 있는 책이에요.
'9791186940099':
  title: 조선왕조실톡
  summary: 조선 시대 임금님들과 신하들이 마치 요즘 친구들처럼 스마트폰으로 카카오톡을 주고받는 것처럼 그려진 재미있는 역사 만화예요. 태조부터
