    단서들을 잘 찾아보고 이야기를 다시 생각하면, 등골이 오싹해지는 진짜 공포를 느낄 수 있을 거예요. 흔한남매와 함께 오싹하면서도 재미있는 상상력을
    펼쳐볼 수 있을 거예요.
'9791168418554':
  title: "(처음 읽는) 그리스 로마 신화 =First Greek mythology"
