  summary: 누구나 한 번쯤 떠올려 봤을 법한 엉뚱하고 기발한 질문들에 진지하게 과학으로 답해주는 책이에요. '이런 일이 실제로 일어나면 어떻게
    될까?' 하는 상상을 그래프와 그림을 곁들여 꼼꼼하게 풀어내지요. 황당해 보이는 질문도 진짜 과학 지식으로 설명되는 과정이 무척 흥미로워요.
    읽다 보면 과학이 이렇게 재미있을 수 있다는 걸 새삼 느끼게 되는 책이에요.
