    학교생활을 떠올리게 되는 책이에요.
'9791166377709':
  title: 엽기 과학자 프래니
  summary: 프래니는 예쁜 인형 놀이보다 이상한 실험과 괴물 만들기를 훨씬 좋아하는 별난 소녀 과학자예요. 지하 실험실에서 온갖 기계와 약품으로
    놀라운 발명품을 만들어 내지만 친구들은 그런 프래니를 이상하게만 봐요. 그래서 프래니는 평범한 아이처럼 보이려고 애써 보지만 자기다운 모습을
    숨기기는 쉽지 않답니다. 결국 프래니의 기발한 발명품이 뜻밖의 순간에 큰 도움이 되면서 친구들도 조금씩 프래니를 인정하게 돼요. 남과 다르다고
    기죽지 않고 자신만의 개성을 마음껏 뽐내는 프래니의 모습이 유쾌한 책이에요.
'9791167742452':
  title: "(호기심 가득한 어린이를 위한) 이토록 굉장한 세계 :동물은 어떻게 지구의 놀라운 비밀을 감지할까요?"
  summary: 이 책은 사람의 눈이 아니라 동물들의 눈으로 세상이 어떻게 보이는지 알려 주는 과학책이에요. 박쥐는 소리로 세상을 보고, 상어는
    아주 작은 전기 신호를 느끼며, 어떤 새는 사람이 볼 수 없는 색깔까지 본답니다. 냄새로 세상을 읽는 동물, 지구의 자기장을 느끼는 동물처럼
    우리와 전혀 다른 감각을 가진 친구들이 잔뜩 등장해요. 저자는 이렇게 서로 다른 감각의 세계를 아주 쉽고 재미있게 설명해 준답니다. 이 책을
    읽고 나면 똑같은 세상도 동물마다 전혀 다르게 느낀다는 것을 새롭게 깨닫게 될 거예요.
'9788955617672':
  title: 갈매기에게 나는 법을 가르쳐준 고양이
  summary: 갈매기 켕가는 기름에 뒤덮인 몸으로 마지막 힘을 다해 고양이 소르바스에게 알을 낳아요. 소르바스는 세 가지 약속을 하게 되는데,
    알을 먹지 않고 잘 돌보며 새끼가 태어나면 나는 법까지 가르쳐 주겠다는 약속이었어요. 아기 갈매기가 태어나자 고양이 친구들은 서로 힘을 합쳐
    정성껏 아기 갈매기를 돌봐 준답니다. 하지만 고양이인 소르바스가 갈매기에게 나는 법을 가르친다는 건 세상에서 가장 어려운 약속이었지요. 서로
    다른 존재라도 진심 어린 사랑과 우정이 있다면 불가능해 보이는 일도 이뤄낼 수 있다는 것을 보여 주는 따뜻한 이야기예요.
'9788983927705':
  title: 해리포터 :불의 잔
  summary: 호그와트에 다니는 해리포터는 어느 날 자기 학교뿐 아니라 다른 마법학교 학생들까지 겨루는 트리위저드 대회에 나이 제한에도 불구하고
    뽑히게 돼요. 위험한 세 가지 과제를 치르면서 해리는 용을 만나기도 하고 호수 속을 헤엄치기도 하는 등 아슬아슬한 모험을 하게 된답니다. 한편
    호그와트에서는 다른 나라 마법학교 학생들과 함께 지내며 새로운 친구도 사귀고 무도회 준비로 들썩이기도 해요. 대회가 진행될수록 해리 주변에서는
    뭔가 심상치 않은 일들이 벌어지기 시작하지요. 즐거운 학교 축제 같던 이야기가 점점 긴장감 넘치는 사건으로 이어지는 시리즈의 네 번째 이야기예요.
'9788983927880':
  title: 해리포터 :불사조 기사단
  summary: 새 학기를 맞은 해리포터는 볼드모트가 돌아왔다는 사실을 말해도 마법 정부와 어른들이 믿어 주지 않아 답답한 나날을 보내요. 설상가상으로
    호그와트에는 엄격하기 짝이 없는 새 선생님 엄브리지 교수가 오면서 학교생활이 훨씬 힘들어진답니다. 해리와 친구들은 스스로를 지키기 위해 몰래
    모여 진짜 마법 방어술을 연습하는 비밀 모임을 만들게 돼요. 한편 어른 마법사들도 볼드모트에 맞서기 위해 비밀리에 힘을 모으기 시작하지요.
    진실을 믿어 주지 않는 세상 속에서 해리와 친구들이 용기를 내어 맞서 싸우는 시리즈 다섯 번째 이야기예요.
'9788983928030':
  title: 해리포터 :죽음의 성물
  summary: 해리포터 시리즈의 마지막 이야기로, 해리는 이제 호그와트로 돌아가지 않고 친구 론, 헤르미온느와 함께 위험한 여행을 떠나요. 볼드모트를
    완전히 물리치기 위해서는 그의 힘이 숨겨진 여러 물건들을 찾아 없애야 한다는 것을 알게 되거든요. 어른들의 도움 없이 셋이서만 힘을 합쳐 마법
    세계 곳곳을 다니며 위험한 고비를 넘긴답니다. 그 과정에서 전설로만 전해지던 신비한 물건 이야기도 알게 되며 진실에 점점 가까워져요. 오랜
    우정과 용기로 마침내 커다란 싸움에 맞서게 되는 시리즈의 감동적인 마지막 편이에요.
'9791187038030':
  title: 왜 세계의 절반은 굶주리는가? :유엔 식량특별조사관이 아들에게 들려주는 기아의 진실
  summary: 이 책은 아빠가 아들의 질문에 답하는 대화 형식으로 쓰인 특별한 책이에요. 아이는 아빠에게 왜 어떤 나라 사람들은 먹을 것이 없어서
    굶주리는지 묻고, 아빠는 그 이유를 하나하나 차근차근 설명해 준답니다. 지구에는 사실 모든 사람이 먹고도 남을 만큼 식량이 있지만 불공평하게
    나누어지고 있다는 사실을 알려 줘요. 전쟁이나 가난, 잘못된 경제 구조 때문에 굶주리는 사람들이 생긴다는 어려운 이야기를 눈높이에 맞게 풀어
    준답니다. 이 책을 읽으면 세계 곳곳에서 벌어지는 굶주림 문제에 대해 깊이 생각해 보게 돼요.
'9788936447434':
  title: "(10대들을 위한) 나의 문화유산답사기"
  summary: 이 책은 우리나라 곳곳에 숨어 있는 문화유산을 찾아 떠나는 여행 이야기예요. 유홍준 선생님이 쓴 원작을 바탕으로 궁궐, 절, 옛
    마을 같은 곳을 직접 둘러보며 그 안에 담긴 역사와 사연을 들려준답니다. 아는 만큼 보인다는 말처럼, 문화유산에 담긴 이야기를 알고 나면 예사롭게
    보이던 것들이 새롭게 보이기 시작해요. 그림과 설명이 함께 있어 어렵게 느껴지던 문화재 이야기도 청소년의 눈높이에 맞게 쉽게 풀어 준답니다.
    우리 땅 곳곳에 담긴 소중한 역사를 발견하는 즐거움을 느낄 수 있는 책이에요.
'9791193487297':
  title: 채사장의 지대넓얕 :지적 대화를 위한 넓고 얕은 지식
  summary: 이 책은 역사, 경제, 정치, 사회, 과학 같은 다양한 분야의 지식을 넓고 얕게 소개해 주는 어린이 교양서예요. 어려운 이야기도
    재미있는 대화와 그림을 통해 쉽게 풀어서 설명해 준답니다. 한 가지 주제만 깊이 파고들지 않고 여러 분야를 두루두루 살펴보면서 세상을 보는
    눈을 넓혀 준다는 점이 특징이에요. 평소에 궁금했지만 어렵게만 느껴졌던 이야기들을 술술 이해할 수 있게 도와준답니다. 폭넓은 지식을 쌓고 싶은
    어린이에게 좋은 길잡이가 되어 주는 책이에요.
'9788950981655':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 손오공은 나쁜 요괴들 때문에 위기에 빠진 세상을 구하기 위해 신비한 한자의 힘을 배우게 돼요. 한자를 큰 소리로 외치면 그 글자가
    가진 뜻 그대로 마법이 되어 나타나는 신기한 일이 벌어진답니다. 예를 들어 불 화 자를 외치면 진짜 불길이 솟아오르는 식이에요. 손오공은 저팔계,
    사오정 같은 친구들과 함께 모험을 떠나며 하나씩 새로운 한자 마법을 익혀 나가지요. 한자를 배우면서 신나는 모험도 함께 즐길 수 있어 어린이들에게
    인기 많은 학습 만화랍니다.
