'9788934908296':
  title: 놓지 마 맞춤법
  summary: "『놓지 마 맞춤법』은 맞춤법을 어려워하는 주인공 정신이가 강아지 놓지 마와 함께 신나는 모험을 하며 우리말 맞춤법을 배우는 학습
    만화예요. 정신이가 자주 틀리는 헷갈리는 맞춤법들을 재미있는 이야기와 그림으로 보여주어 쉽게 이해할 수 있도록 도와준답니다. 친구들과 학교생활에서
    일어날 수 있는 다양한 상황들을 통해 자연스럽게 맞춤법 원리를 익힐 수 있어요. 이 책을 읽으면서 어려운 맞춤법도 재미있게 배우고, 올바른
    우리말을 사용하는 습관을 기를 수 있을 거예요."
'9788934925705':
