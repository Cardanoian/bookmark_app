'9788949121338':
  title: 빨강 연필 :신수현 장편동화
  summary: 글짓기를 못해서 늘 속상했던 주인공은 우연히 신비한 빨간 연필을 줍게 돼요. 그 연필을 잡으면 저절로 술술 멋진 글이 써져서 글짓기
    대회에서 상까지 받으며 인기를 얻게 되지요. 하지만 그 글이 진짜 자기 실력이 아니라는 사실에 마음은 점점 불편해지고 무거워져요. 결국 주인공은
    고민 끝에 정직하게 자신의 글을 쓰는 것이 얼마나 중요한지 깨닫게 된답니다.
'9791191826012':
  title: 너도 하늘말나리야 :이금이 장편소설
  summary: 엄마 아빠가 이혼해서 시골로 이사 온 미르, 몸이 아픈 엄마와 사는 소희, 엄마를 잃은 슬픔을 안고 사는 바우, 세 아이가 작은
    시골 마을에서 만나요. 처음엔 서로 마음을 열지 못하고 부딪히기도 하지만, 함께 시간을 보내며 서로의 아픔을 이해하고 위로해 주게 되지요.
    아름다운 자연 속에서 세 아이는 각자의 슬픔을 조금씩 극복하며 진짜 친구가 되어가요. 하늘말나리처럼 씩씩하게 피어나는 아이들의 성장 이야기랍니다.
'9791130697536':
  title: "(최재천의) 동물대탐험 :지구를 사랑하는 어린이를 위한 생물학 동화"
  summary: 생물학자 최재천 선생님이 들려주는 이야기를 따라 세계 곳곳에 사는 신비한 동물들을 만나러 떠나는 책이에요. 동물들이 살아가는 특별한
    습성과 가족을 이루는 방법, 서로 돕고 살아가는 모습들을 흥미롭게 알려주지요. 딱딱한 설명이 아니라 이야기처럼 풀어내서 동물의 세계가 쉽고
    재미있게 다가와요. 이 책을 읽고 나면 동물과 자연을 더욱 아끼고 사랑하는 마음이 생긴답니다.
