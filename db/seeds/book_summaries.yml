'9791162730669':
  title: 용선생의 시끌벅적 과학교실
  summary: 용선생님과 아이들이 실험실에서 함께 부딪히고 웃으며 과학 원리를 배워가는 이야기예요. 궁금한 과학 현상이 생기면 직접 실험을 해보면서
    왜 그런 일이 일어나는지 하나씩 알아가지요. 어려운 과학 개념도 친구들의 좌충우돌 실험 과정을 따라가다 보면 쉽게 이해할 수 있어요. 만화로
    재미있게 풀어내서 과학이 술술 머리에 들어온답니다.
'9791168411876':
  title: 내일은 실험왕 :본격 대결 과학실험 만화 시즌2
  summary: 과학을 좋아하는 아이들이 실험 대결을 펼치며 성장해 가는 이야기예요. 주인공들은 서로 실력을 겨루면서 다양한 과학 실험을 직접
    해보고 그 원리를 배워가지요. 실험이 실패하기도 하고 예상 밖의 결과가 나오기도 하면서 진짜 과학자처럼 문제를 해결해 나가요. 만화로 신나게
    읽다 보면 어려운 과학 원리도 저절로 익히게 된답니다.
'9791195434077':
  title: 조선왕조실톡
  summary: 조선 시대 왕과 신하들이 마치 요즘처럼 스마트폰 메신저로 대화를 나누는 모습으로 역사를 보여주는 만화예요. 태조 이성계부터 시작해
    조선의 여러 임금님과 그 시대에 있었던 진짜 역사적 사건들을 재미있게 풀어내지요. 딱딱하게만 느껴지던 조선왕조실록 속 이야기가 친근한 대화체로
    쉽게 다가와요. 웃으면서 읽다 보면 조선의 역사가 저절로 머릿속에 쏙쏙 들어온답니다.
'9788926380413':
  title: 신비아파트 한자 귀신 1 - 1001개의 구슬
  summary: 신비아파트에 사는 하리와 두리 친구들이 이번에는 한자의 힘을 가진 귀신들과 만나면서 이야기가 시작돼요. 귀신들이 일으키는 신비한
    사건을 해결하려면 한자의 뜻과 소리를 알아야 실마리를 풀 수 있어요. 아이들은 무섭고 신비한 모험을 헤쳐 나가면서 자연스럽게 한자를 하나씩
    익히게 되지요. 신비아파트 특유의 오싹하면서도 유쾌한 이야기 속에서 한자 공부를 함께 할 수 있어요.
'9788936438838':
  title: 아버지의 해방일지 :정지아 장편소설
  summary: 딸 아리는 사회주의 운동을 했던 아버지가 갑자기 돌아가시면서 장례식장을 지키게 돼요. 삼일장 동안 아버지를 알던 여러 사람들이
    찾아오고, 아리는 그들의 이야기를 통해 몰랐던 아버지의 삶을 하나씩 알아가지요. 엄격하고 어려워 보이기만 했던 아버지에게도 뜨거운 신념과 정이
    있었다는 걸 깨닫게 돼요. 슬픔 속에서도 웃음을 잃지 않는 장례식장 풍경을 통해 가족의 의미를 다시 생각하게 하는 이야기예요.
'9788966351985':
  title: 늪 100층짜리 집
  summary: 주인공은 늪 속에 숨겨진 백 층짜리 신비한 집을 발견하고 아래로, 아래로 내려가는 모험을 떠나요. 한 층씩 내려갈 때마다 개구리,
    물방개 같은 늪에 사는 다양한 생물 친구들을 만나게 되지요. 층마다 펼쳐지는 신기하고 개성 넘치는 풍경을 구경하는 재미가 가득해요. 맨 아래층에
    도착하면 뜻밖의 반가운 만남이 기다리고 있답니다.
'9788950976989':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 하늘의 벌을 받아 힘을 잃은 손오공이 인간 세상으로 내려와 한 아이를 만나면서 이야기가 시작돼요. 손오공은 한자를 외치면 그 한자의
    뜻대로 신기한 힘이 생기는 마법을 배우게 돼요. 사오정, 저팔계 같은 친구들과 함께 나쁜 요괴들을 물리치며 서유기 속 세상을 모험하지요. 이야기를
    재미있게 따라가다 보면 한자의 뜻과 모양을 저절로 익히게 되는 학습 만화예요.
