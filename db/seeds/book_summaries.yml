'9788983925336':
  title: 해리포터 :비밀의 방
  summary: 호그와트 2학년이 된 해리는 학교에 숨겨진 '비밀의 방'이 열리면서 벌어지는 무서운 사건에 휘말리게 돼요. 학생들이 하나둘 알
    수 없는 힘에 의해 돌처럼 굳어버리는 일이 계속 일어나요. 해리는 지니가 정체불명의 일기장에 흘려서 위험에 빠진 것을 알게 돼요. 해리는 그리핀도르의
    검을 들고 방 안에 숨어 있던 무시무시한 바실리스크와 맞서 싸워요. 결국 친구들을 구하고 학교에 숨겨진 비밀을 풀어내는 통쾌한 이야기예요.
'9788965792901':
  title: 비밀의 화원
  summary: 메리는 부모님을 여의고 영국의 낯선 저택인 미셀스웨이트 저택에서 살게 돼요. 저택에는 오랫동안 아무도 들어가지 않은 비밀의 정원이
    숨겨져 있다는 것을 알게 되지요. 메리는 하인 소년 디콘의 도움을 받아 정원을 몰래 가꾸기 시작해요. 그러던 중 저택에 숨겨져 있던 몸이 약한
    사촌 콜린을 만나 함께 정원을 돌보게 돼요. 정원이 되살아나듯 메리와 콜린의 몸과 마음도 건강하게 변해가는 감동적인 이야기예요.
'9788952787330':
  title: 마틸다
  summary: 마틸다는 책 읽기를 좋아하는 똑똑한 아이지만 부모님은 마틸다를 무시하고 함부로 대해요. 학교에서도 무섭고 못된 교장 선생님 트런치불
    때문에 아이들은 늘 마음을 졸이며 지내요. 다행히 다정한 담임 선생님 미스 허니는 마틸다의 재능을 알아보고 아껴 줘요. 마틸다는 자신에게 신기한
    초능력이 있다는 것을 알게 되고 이 힘을 이용해 못된 어른들에 맞서요. 지혜와 용기로 어려움을 이겨내는 통쾌하고 감동적인 이야기예요.
'9780545581608':
  title: 'Dog Man ( Dog Man #01 ) (Hardcover)'
  summary: 경찰견이 되고 싶었던 그렉과 경찰관 나이트는 폭탄 사고를 당해 크게 다치고 말아요. 병원에서 의사 선생님은 나이트의 머리와 그렉의
    몸을 이어 붙여서 새로운 생명을 만들어 줘요. 이렇게 태어난 도그맨은 사람처럼 걷고 말하지만 개의 코와 귀를 가진 특별한 경찰관이 돼요. 도그맨은
    나쁜 고양이 피티 같은 악당들과 맞서 싸우며 마을을 지켜요. 실수투성이지만 사랑스러운 도그맨의 좌충우돌 활약이 담긴 이야기예요.
'9788950935252':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 손오공은 오랜 옛날 하늘에서 큰 소동을 벌인 죄로 산에 갇혀 있다가 초린이라는 아이의 도움으로 풀려나게 돼요. 손오공과 초린이는
    함께 한자의 힘이 담긴 마법 주문을 사용하며 여러 요괴들과 맞서 싸워요. 한자를 외치면 그 글자의 뜻대로 신기한 마법이 펼쳐지는 것이 이 이야기의
    특징이에요. 두 사람은 힘을 합쳐 위기를 헤쳐 나가며 우정을 쌓아 가요. 한자를 재미있게 배우면서 손오공의 모험도 즐길 수 있는 이야기예요.
'9791191363739':
  title: 나 혼자만 레벨업
  summary: 성진우는 가장 약한 E급 헌터로 늘 목숨을 걸고 겨우겨우 던전을 돌아다니는 처지예요. 어느 날 아주 위험한 이중 던전에 갇혀 죽을
    고비를 넘기게 되지요. 그 사건 이후 성진우에게는 다른 헌터들에게는 없는 특별한 시스템이 생겨서 끝없이 강해질 수 있게 돼요. 성진우는 이
    능력을 이용해 하루하루 레벨을 올리며 점점 최강의 헌터로 성장해 나가요. 약자에서 최강자로 거듭나는 통쾌한 성장 이야기예요.
'9788972979517':
  title: 나의 라임오렌지나무 :특별판
  summary: 제제는 가난한 집안의 장난꾸러기 다섯 살 소년으로 어른들에게 자주 혼나며 외로움을 느껴요. 제제는 마당의 작은 오렌지나무에게 밍기뉴라는
    이름을 지어 주고 친구처럼 이야기를 나누며 위로를 받아요. 그러던 중 자상하고 다정한 어른 뽀르뚜가 아저씨를 만나 처음으로 진짜 사랑받는 기분을
    느끼게 되지요. 하지만 뽀르뚜가 아저씨에게 뜻밖의 슬픈 사고가 일어나면서 제제는 큰 상처를 받아요. 어린아이의 순수한 마음과 성장통을 뭉클하게
    그린 이야기예요.
'9788966072170':
  title: 꼬마 흡혈귀
  summary: 안톤은 어느 날 밤 창문 앞에 나타난 또래 흡혈귀 소년 뤼디거를 만나게 돼요. 처음에는 무서웠지만 안톤과 뤼디거는 점점 서로에게
    둘도 없는 친구가 되어요. 안톤은 부모님 몰래 뤼디거와 함께 신비하고 아슬아슬한 밤의 모험을 즐기게 되지요. 흡혈귀 세계의 비밀도 알게 되면서
    두 친구의 우정은 더욱 깊어져요. 서로 다른 세계에 살아도 진짜 친구가 될 수 있다는 걸 보여 주는 이야기예요.
'9788950966980':
  title: 열두 살에 부자가 된 키라
  summary: 키라는 우연히 말하는 강아지 머니를 만나 돈에 대한 특별한 수업을 받게 돼요. 머니는 키라에게 용돈을 무작정 쓰지 않고 저축하고
    불려 나가는 방법을 하나씩 가르쳐 줘요. 키라는 목표를 세우고 계획을 세워 돈을 관리하는 습관을 차근차근 배워 나가요. 작은 실천들이 쌓여서
    키라는 점점 돈을 다루는 데 자신감을 갖게 돼요. 어린이도 스스로 경제 관념을 키울 수 있다는 걸 알려 주는 이야기예요.
'9791167770370':
  title: 나 혼자만 레벨업
  summary: 성진우는 가장 약한 E급 헌터로 늘 목숨을 걸고 겨우겨우 던전을 돌아다니는 처지예요. 어느 날 아주 위험한 이중 던전에 갇혀 죽을
