'9788972976189':
  title: 초등학생을 위한 나의 라임 오렌지나무 (초등용)
  summary: 브라질의 가난한 동네에 사는 다섯 살 소년 제제는 장난꾸러기라는 이유로 집에서 자주 혼이 나요. 외로운 제제는 마당의 작은 라임
    오렌지나무에게 '밍기뉴'라는 이름을 지어주고 친구처럼 이야기를 나누지요. 그러던 중 자상하게 자신을 아껴주는 뽀르뚜가 아저씨를 만나 처음으로
    깊은 사랑을 느끼게 돼요. 순수한 소년의 눈으로 바라본 기쁨과 슬픔이 가득한 감동적인 성장 이야기예요.
