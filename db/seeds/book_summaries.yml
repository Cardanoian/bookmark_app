    세탁소 할머니는 사과를 정성껏 빨고 다림질해서 반짝반짝 새것처럼 만들어줘요. 이 사과들은 친구들의 슬프거나 걱정되는 마음을 뜻하는데, 사과가
    깨끗해지면 친구들의 마음도 밝고 행복해져요. 힘들고 복잡한 마음도 깨끗하게 씻어낼 수 있다는 따뜻한 메시지를 전해주는 그림책입니다.
'9791169812238':
  title: 물 없는 수영장 :김선정 장편소설
  summary: "「물 없는 수영장」은 가장 친한 친구를 물놀이 사고로 잃고 수영을 그만둔 하나라는 소녀의 이야기예요. 하나는 마음속 깊이 슬픔과
    죄책감을 안고 살아가죠. 그러던 중 하나는 신비로운 '물 없는 수영장'을 만나게 돼요. 그곳에서 하나는 친구와의 추억을 다시 떠올리고, 아픈
    마음을 마주하며 조금씩 상처를 치유해 나갑니다. 이 책은 슬픔을 이겨내고 다시 용기를 찾아 성장하는 따뜻한 메시지를 전해준답니다."
'9791171171019':
  title: 물리박사 김상욱의 수상한 연구실 :어린이를 위한 세상의 모든 과학
  summary: 이 책은 김상욱 박사님의 특별한 연구실로 우리를 초대해서 신기한 과학 이야기를 들려줘요. 우주와 세상이 어떻게 돌아가는지, 빛과
    소리는 무엇인지 등 여러 가지 과학 원리를 재미있게 설명해 준답니다. 마치 탐정이 된 것처럼 연구실의 수상한 점들을 파헤치며 과학의 비밀을
    하나씩 알아갈 수 있어요. 어려운 과학 개념도 만화처럼 쉽게 풀어져 있어서 과학이 더욱 재미있게 느껴질 거예요. 호기심 많은 친구들이 과학
    박사님처럼 생각하고 탐구하는 즐거움을 느낄 수 있게 도와주는 책입니다.
'9791171171057':
  title: 물리박사 김상욱의 수상한 연구실 :어린이를 위한 세상의 모든 과학
  summary: 이 책은 신기한 과학의 세계를 모험하는 어린이들을 위한 책이에요. 물리 박사 김상욱 선생님의 수상한 연구실에서 친구들과 함께 여러
    가지 과학 현상을 탐험한답니다. 딱딱하고 어렵게 느껴질 수 있는 물리, 화학, 생물 등 다양한 과학 지식을 재미있는 이야기와 실험으로 쉽게
    알려줘요. 왜 하늘이 파란지, 우리 몸은 어떻게 움직이는지 등 궁금했던 과학 질문들의 답을 찾을 수 있을 거예요. 이 책을 읽다 보면 우리
    주변의 모든 현상들이 신기한 과학으로 가득 차 있다는 걸 알게 될 거예요!
'9791171171330':
  title: 비밀요원 레너드
  summary: 레너드는 평범한 강아지처럼 보이지만, 사실은 사람들을 돕는 아주 특별한 비밀 요원이에요. 어느 날, 레너드는 친구들을 괴롭히는
    거만한 고양이 샤샤를 잡으라는 임무를 받게 돼요. 레너드는 샤샤에게 들키지 않기 위해 평범한 강아지인 척 변장하고, 샤샤의 약점을 알아내기
    위해 몰래 작전을 펼쳐요. 과연 레너드는 똑똑하고 멋진 방법으로 샤샤를 물리치고 친구들을 무사히 구해낼 수 있을까요?
'9791171172825':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 이 책은 손오공과 친구들이 나쁜 요괴들을 물리치기 위해 모험을 떠나는 이야기예요. 손오공 일행은 위기에 처할 때마다 특별한 한자
    마법을 사용해서 적들과 맞서 싸워요. 예를 들어, '불 화(火)' 글자를 외치면 불덩이가 나가고, '얼음 빙(氷)' 글자를 외치면 얼음이 솟아나는
    식이죠. 재미있는 만화를 보면서 손오공의 신나는 모험을 따라가다 보면 자연스럽게 많은 한자를 배우게 된답니다. 용기, 지혜, 우정 같은 소중한
    가치도 함께 배울 수 있는 신나는 한자 학습 만화예요.
'9791171173310':
  title: 비밀요원 레너드
  summary: 레너드는 평범해 보이는 강아지지만, 사실 엄청난 비밀 요원이에요. 세상의 맛있는 음식을 모두 훔치려는 악당 닥터 캣의 음모를 막는
    것이 레너드의 중요한 임무랍니다. 레너드는 특별한 도구들과 똑똑한 생각으로 닥터 캣과 짜릿하고 유쾌한 대결을 펼쳐요. 과연 레너드는 맛있는
    음식을 지켜내고 세상을 구원할 수 있을까요?
'9791171174713':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 이 책은 주인공 손오공이 친구들과 함께 모험을 떠나며 한자를 배우는 이야기예요. 손오공은 나쁜 마법으로 세상을 어지럽히는 악당들을
    물리치기 위해 한자 마법을 사용해요. 위험한 상황을 만날 때마다 새로운 한자를 배우고, 그 한자를 힘찬 마법으로 바꾸어 위기를 헤쳐나가죠.
    재미있는 만화와 신나는 이야기 속에서 자연스럽게 한자의 모양과 뜻을 익힐 수 있어요. 손오공의 용감한 모험을 따라가다 보면 한자 실력은 물론,
    용기와 우정의 소중함도 배울 수 있을 거예요.
'9791171174805':
  title: 물리박사 김상욱의 수상한 연구실 :어린이를 위한 세상의 모든 과학
  summary: 이 책은 꼬마 상욱이가 신비로운 수상한 연구실에서 과학의 비밀을 파헤치는 신나는 모험 이야기예요. 우리 주변에서 일어나는 재미있는
    과학 현상들을 박사님과 함께 탐험하며 궁금증을 해결한답니다. 왜 물이 끓으면 수증기가 되는지, 소리는 어떻게 전달되는지 같은 다양한 과학 질문들의
    답을 찾아요. 어려운 물리, 화학, 생물 이야기를 신나는 실험과 만화 같은 그림으로 쉽고 재미있게 설명해 준답니다. 이 책을 읽으면 과학이
    훨씬 더 흥미롭게 느껴질 거예요.
'9791171174812':
  title: 물리박사 김상욱의 수상한 연구실 :어린이를 위한 세상의 모든 과학
  summary: 이 책은 물리박사 김상욱 선생님과 함께 신비하고 '수상한 연구실'을 탐험하는 과학 도감이에요. 아이들은 일상생활 속 궁금증부터
    우주에 숨겨진 비밀까지, 세상의 모든 과학을 재미있게 배울 수 있어요. 흥미진진한 이야기와 그림을 통해 어렵게 느껴지던 과학 원리들이 쉽게
    이해될 거예요. 왜 이런 현상이 일어나는지, 세상은 어떻게 돌아가는지 과학자의 눈으로 탐구하는 방법을 알려준답니다. 이 책을 읽으면 주변 모든
    것이 신기한 과학 놀이터처럼 느껴질 거예요. 호기심을 키우고 과학적 사고력을 길러주는 아주 특별한 책이랍니다.
'9791171175192':
  title: 비밀요원 레너드
  summary: "「비밀요원 레너드」는 최고의 비밀 요원 '002'인 귀여운 물범 레너드가 주인공인 책이에요. 레너드는 사라진 물건을 찾아주는
    회사에서 일하며, 알쏭달쏭한 사건들을 해결하는 멋진 임무를 맡고 있어요. 펭귄 파트너 오스카와 함께 사라진 물건을 찾으러 용감하게 모험을 떠나지요.
    둘은 동물 친구들과 힘을 합쳐 어려운 사건을 해결하고, 나쁜 악당들로부터 세상을 구하기 위해 노력한답니다. 이 책을 읽으면 용기와 지혜를 배우고,
    친구들과 함께 문제를 해결하는 즐거움을 느낄 수 있을 거예요."
'9791171176458':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 마법천자문은 손오공과 친구들이 마법 한자를 사용하여 나쁜 마물들과 싸우는 신나는 모험 이야기예요. 손오공은 요술봉을 휘두르며 '불
    화', '물 수' 같은 한자를 외치면 그 한자의 힘으로 마법을 사용한답니다. 이 책을 읽으면서 자연스럽게 한자의 뜻과 모양을 익힐 수 있어요.
    착한 마음과 용기, 그리고 친구와의 우정이 얼마나 소중한지도 배우게 될 거예요. 한자가 어렵게 느껴지는 친구들도 재미있는 이야기에 빠져들어
    즐겁게 공부할 수 있는 책이에요.
'9791171176649':
  title: 비밀요원 레너드
  summary: 레너드는 평범한 고양이처럼 보이지만, 사실은 엄청난 비밀요원이에요. 주인 가족과 함께 살면서 집안에서 벌어지는 크고 작은 사건들을
    예리한 눈빛으로 파헤치려 노력하죠. 때로는 사라진 간식의 범인을 찾고, 때로는 집 안의 위험한 물건들을 조사하며 자신만의 방식으로 임무를 수행해요.
    고양이 특유의 귀여움과 비밀요원의 날카로운 모습이 어우러져 어린이 친구들에게 큰 웃음과 흥미를 안겨주는 이야기랍니다. 레너드의 좌충우돌 비밀
    임무를 따라가며 모험심을 키워볼 수 있어요.
'9791171178155':
  title: 멍멍말 통역사 김야옹
  summary: 김야옹은 아주 특별한 능력을 가진 아이예요. 바로 멍멍이들이 하는 말을 알아듣고 통역해 줄 수 있답니다! 야옹이는 이 능력을 사용해서
    사람들하고 멍멍이들 사이에 생긴 오해나 문제를 해결해 줘요. 때로는 길을 잃은 강아지를 돕고, 때로는 이웃집 멍멍이가 왜 시무룩한지 알려주기도
    하죠. 이 책은 야옹이와 멍멍이들이 함께 겪는 따뜻하고 신나는 이야기예요. 동물과 사람이 서로를 이해하는 것이 얼마나 중요한지 깨닫게 해준답니다.
'9791171178186':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 마법천자문은 용감한 주인공 손오공이 친구들과 함께 모험을 떠나는 이야기예요. 손오공 일행은 세상을 지배하려는 나쁜 요괴들과 맞서
    싸우며 다양한 사건을 겪는답니다. 이때 손오공은 '마법천자문'이라는 신비한 한자 마법을 사용해서 요괴들을 물리쳐요. 이 책을 읽으면서 자연스럽게
    한자의 뜻과 생김새를 익힐 수 있어요. 재미있는 만화와 신나는 이야기 덕분에 어려운 한자 공부가 즐거운 놀이처럼 느껴질 거예요.
'9791171178346':
  title: 비밀요원 레너드
  summary: 레너드는 아주 평범해 보이지만, 사실은 '달팽이 비밀 연구소'에서 일하는 베테랑 비밀요원이에요. 레너드는 특별한 달팽이 능력과
    다양한 비밀 도구들을 사용해서 동물 세상에서 벌어지는 사건들을 해결해 나가지요. 때로는 느리지만 침착하게 문제를 해결하는 레너드의 모습은 어린이들에게
    용기와 지혜를 보여줘요. 친구들과 함께 흥미진진한 모험을 하며 자신만의 방법으로 세상을 구하는 멋진 달팽이 요원의 이야기랍니다.
'9791171178704':
  title: 빨간내복야코 어린이 상식 :이거 모르면 지구인 아님
  summary: 이 책은 인기 캐릭터 빨간내복야코와 함께 어린 친구들이 꼭 알아야 할 여러 가지 상식들을 재미있게 알려주는 책이에요. 우리가 평소에
    궁금해했던 과학, 역사, 생활 속 신기한 이야기들을 쉽고 즐겁게 배울 수 있답니다. 만화처럼 재미있는 그림과 알기 쉬운 설명 덕분에 책장이
    술술 넘어갈 거예요. 이 책을 읽다 보면 나도 모르게 똑똑해지고, 친구들에게 자랑할 만한 지식도 많이 쌓이게 될 거예요. 이 책으로 상식 박사가
    되어 진정한 '지구인'으로 거듭날 수 있답니다!
'9791171179138':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 손오공과 그의 친구들은 세상을 어지럽히는 악당들과 맞서 싸우며 신나는 모험을 떠나요. 이들은 싸우면서 여러 가지 한자 마법을 배우고
    사용하게 돼요. 매 장마다 새로운 한자들이 등장하며, 친구들은 이 한자들이 가진 힘을 익혀 위기를 극복해 나가지요. 독자들은 손오공의 모험을
    따라가며 자연스럽게 한자의 뜻과 쓰임을 배울 수 있답니다. 마치 게임처럼 흥미진진한 이야기 속에서 어려운 한자를 쉽고 재미있게 익힐 수 있는
    책이에요.
'9791171179794':
  title: 비밀요원 레너드
  summary: "『비밀요원 레너드』는 겉보기엔 평범한 고양이 레너드의 숨겨진 활약을 다룬 이야기예요. 레너드는 사실 악당들을 물리치고 세상을
    구하는 멋진 비밀 요원이랍니다. 몰래 임무를 수행하며 위험에 빠진 친구들을 돕고, 정의를 위해 용감하게 싸워요. 이 책을 읽으면 고양이 레너드의
    기발하고 신나는 모험 속으로 빠져들어 흥미진진한 시간을 보낼 수 있을 거예요."
'9791171179954':
  title: Go go 카카오프렌즈 :세계 역사 문화 체험 학습만화
  summary: 카카오프렌즈 친구들이 시간여행을 하면서 세계 여러 나라의 역사와 문화를 배우는 학습 만화 시리즈예요. 라이언, 어피치, 무지 등
    귀여운 카카오프렌즈들이 각 나라의 유명한 장소를 방문하고, 그곳에서 벌어지는 특별한 사건들을 해결해요. 만화를 읽으면서 자연스럽게 세계사의
    중요한 사건이나 문화유산에 대해 알게 된답니다. 재미있는 모험 이야기와 함께 그 나라에 대한 정보글도 있어서 지식도 쑥쑥 늘어날 거예요. 카카오프렌즈와
    함께 신나는 세계 여행을 떠나볼까요?
'9791171241675':
  title: 타키포오 얼렁뚱땅 상식스쿨
  summary: 이 책은 인기 유튜브 채널 '캐릭온TV'의 캐릭터들이 등장하는 재미있는 학습 만화예요. 타키포오 친구들이 얼렁뚱땅 실수하면서도
    우리 주변의 다양한 상식을 쉽고 유쾌하게 알려준답니다. 과학, 역사, 생활 속 궁금증 등 여러 분야의 지식을 만화로 즐겁게 익힐 수 있어요.
    지루하지 않고 웃음 가득한 이야기로 초등학생 친구들이 꼭 알아야 할 상식을 배울 수 있는 책이에요.
'9791171711451':
  title: 빨간내복야코 맞춤법 절대 안 틀리는 책
  summary: 이 책은 인기 캐릭터 빨간내복야코와 친구들이 나와서 어린이들이 헷갈리기 쉬운 맞춤법을 쉽고 재미있게 알려줘요. 야코와 친구들의
    유쾌한 이야기들을 읽으면서 일상생활에서 자주 틀리는 단어들을 익힐 수 있답니다. 헷갈리기 쉬운 띄어쓰기나 받침 등을 왜 그렇게 써야 하는지
    친절하게 설명해 주며, 재미있는 문제들을 풀어볼 수도 있어요. 이 책을 읽으면 글을 쓸 때 맞춤법 걱정 없이 자신감 있게 쓸 수 있게 될 거예요!
'9791171711956':
  title: 오백 년째 열다섯 :김혜정 장편소설
  summary: 이 책은 오백 년 동안이나 열다섯 살 모습으로 살고 있는 소녀 연이의 특별한 이야기예요. 연이는 사람들과 어울리지 않고 조용히
    지내왔는데, 어느 날 서준이라는 친구를 만나면서 새로운 삶을 시작하게 됩니다. 서준이 덕분에 연이는 오랫동안 잊고 지냈던 즐거움과 따뜻한 감정을
    다시 느끼게 돼요. 과연 연이는 500년 동안 이어진 외로움과 저주를 극복하고 진정한 행복을 찾을 수 있을까요? 친구와의 소중한 우정과 성장을
    다룬 따뜻한 이야기입니다.
'9791171712267':
  title: 놓지 마 과학!
  summary: 이 책은 장난기 넘치는 정신이 가족과 친구들의 좌충우돌 이야기를 통해 과학 원리를 재미있게 알려주는 학습 만화예요. 우리 몸의
    비밀부터 우주의 신비까지, 다양한 과학 주제를 어렵지 않게 설명해 준답니다. 정신이가 겪는 우스꽝스러운 상황 속에서 과학 상식이 쏙쏙 머리에
    들어와요. 아이들이 과학을 포기하지 않고 즐겁게 배울 수 있도록 도와주는 유쾌한 과학 책이랍니다.
'9791171712328':
  title: 빨간내복야코 맞춤법 절대 안 틀리는 책
  summary: 이 책은 인기 있는 캐릭터인 빨간내복야코와 친구들이 등장해서 맞춤법을 쉽고 재미있게 알려줘요. 아이들이 자주 틀리는 헷갈리는 낱말이나
    문법 규칙을 다양한 그림과 활동으로 배울 수 있어요. 지루하지 않게 퀴즈를 풀거나 게임을 하듯이 맞춤법 실력을 키울 수 있답니다. 이 책을
    읽으면 맞춤법 박사가 되어 글쓰기에 자신감이 생길 거예요. 빨간내복야코와 함께라면 이제 맞춤법은 절대 틀리지 않을 거예요!
'9791171712465':
  title: 소맥거핀의 인체 친구들
  summary: 유명 유튜버 소맥거핀의 인기 애니메이션 '인체 친구들'을 책으로 만날 수 있어요. 우리 몸속의 뇌, 심장, 폐, 위 등 여러 장기들이
    살아있는 친구들처럼 등장한답니다. 이 친구들은 각자 맡은 역할을 재미있는 이야기와 그림으로 소개해 줘요. 딱딱한 과학 지식이 아니라, 만화를
    보듯이 쉽고 유쾌하게 우리 몸의 신비와 소중함을 배울 수 있답니다. 우리 몸이 얼마나 놀라운지 인체 친구들과 함께 즐겁게 탐험해 보세요!
'9791171712670':
  title: 반려 요괴
  summary: 주인공 아인이는 외톨이였는데, 어느 날 우연히 귀여운 요괴 '뭉치'를 만나 친구가 돼요. 뭉치는 평범한 요괴가 아니라 신비한 힘을
    가진 특별한 존재였죠. 아인이는 뭉치 덕분에 용기를 얻고 자신도 몰랐던 특별한 능력을 발견하게 됩니다. 둘은 함께 지내면서 서로에게 세상에
    하나뿐인 가족이 되어준답니다. 이 책은 외로운 아이와 신비한 요괴가 서로를 알아가고 우정을 쌓는 따뜻한 모험 이야기예요.
'9791171712687':
  title: 반려 요괴
  summary: 이 책은 외로운 소년 '진'이가 특별한 요괴 친구들을 만나면서 벌어지는 이야기예요. 진이는 우연히 '요괴 상점'에서 버려진 도깨비
    '보리'를 만나 가족으로 맞이하게 돼요. 진이와 보리는 다른 귀엽고 개성 넘치는 요괴 친구들을 만나며 신나는 모험을 해요. 때로는 마을에 나타난
    문제들을 요괴 친구들과 함께 힘을 합쳐 해결하기도 한답니다. 이 책은 요괴들과 친구가 되어 서로를 이해하고 성장하는 따뜻한 이야기를 담고 있어요.
'9791171712793':
  title: 빨간내복야코 안 읽으면 완전 위험한 과학책
  summary: 이 책은 인기 유튜버 빨간내복야코 친구들과 함께 우리 주변의 신기하고 때로는 위험할 수도 있는 과학 현상들을 쉽고 재미있게 알려줘요.
    우리가 매일 사용하는 물건이나 자연 현상 속에 숨어있는 과학 원리를 유머러스한 그림과 함께 배울 수 있답니다. 왜 전기를 조심해야 하는지,
    우리 몸은 어떻게 움직이는지 등 꼭 알아야 할 과학 지식들이 가득해요. 이 책을 읽으면 생활 속 과학이 얼마나 중요한지 깨닫고, 우리를 둘러싼
    세상을 더 똑똑하게 이해할 수 있을 거예요. 만약 이 과학 상식을 모른다면 조금 위험하거나 불편한 상황에 처할 수도 있으니, 꼭 읽어보세요!
'9791171712946':
  title: 소맥거핀의 인체 친구들
  summary: 이 책은 우리 몸속의 심장, 뇌, 위 같은 중요한 기관들을 친근하고 재미있는 캐릭터 친구들로 만날 수 있게 해줘요. 각 친구들은
    저마다 하는 일이 무엇인지 신나는 이야기와 함께 알려준답니다. 아이들은 마치 애니메이션을 보듯 우리 몸이 어떻게 움직이는지, 그리고 각각의
    장기들이 얼마나 소중한지 쉽고 즐겁게 배울 수 있어요. 웃음 가득한 이야기 속에서 인체에 대한 호기심을 키우고 건강의 중요성도 깨닫게 될 거예요.
'9791171713417':
  title: 빨간내복야코 안 읽으면 완전 위험한 과학책
  summary: 이 책은 인기 유튜버 빨간내복야코 친구들과 함께 우리 생활 속 과학 원리를 배우는 재미있는 과학책이에요. 일상에서 만나는 정전기나
    폭발 같은 현상들이 왜 일어나는지, 그리고 이것들이 얼마나 위험할 수 있는지 과학적으로 알려주죠. 만화처럼 알록달록한 그림과 재치 있는 설명을
    통해 아이들이 과학을 쉽고 즐겁게 이해하도록 도와줘요. 과학 상식을 몰랐을 때 일어날 수 있는 아찔한 상황들을 보여주면서 호기심을 자극하고,
    과학이 우리 삶에 얼마나 중요한지 깨닫게 해준답니다. 이 책을 읽으면 주변의 모든 현상에 숨어있는 과학을 발견하고 똑똑한 과학 박사가 될 수
    있을 거예요.
'9791171713684':
  title: 소맥거핀의 인체 친구들
  summary: 이 책은 인기 유튜버 소맥거핀이 만든 아주 특별한 인체 탐험 책이에요. 우리 몸속에는 피 친구, 뼈 친구처럼 다양한 인체 친구들이
    살고 있는데요, 이 친구들이 직접 우리 몸의 구석구석을 신나는 모험을 통해 소개해 줘요. 우리 심장은 어떤 일을 하고, 뇌는 어떻게 생각하는지
    등 어려운 인체 지식을 만화처럼 재미있는 이야기로 쉽게 알려준답니다. 몸속 친구들과 함께 즐겁게 놀다 보면 우리 몸이 얼마나 소중하고 대단한지
    알게 될 거예요.
'9791171713769':
  title: 오백 년째 열다섯 :김혜정 장편소설
  summary: 주인공 미소는 무려 오백 년 동안이나 열다섯 살로 살아가고 있는 신비로운 소녀예요. 평범한 삶을 꿈꾸던 미소는 과거와 미래의 인물들이
    뒤섞인 특별한 마을로 이사하게 돼요. 그곳에서 자신처럼 나이를 먹지 않는 친구들을 만나며 새로운 인연을 맺죠. 미소는 멈춰버린 시간을 다시
    흐르게 하기 위해 용감한 모험을 시작해요. 이 이야기는 우리가 정말 바라는 것이 무엇인지, 그리고 평범한 일상이 얼마나 소중한지 깨닫게 해준답니다.
'9791171714100':
  title: 야광 코딱지
  summary: 동민이라는 친구가 밤에 혼자 화장실에서 야광 코딱지를 후벼 파요. 그런데 그 코딱지를 변기에 버리자, 코딱지가 점점 커지기 시작했어요!
    처음에는 변기를 가득 채우더니, 나중에는 온 집안을 넘쳐서 도시 전체를 야광으로 물들였답니다. 사람들은 모두 이 거대한 야광 코딱지에 놀랐고,
    동민이도 어떻게 해야 할지 몰라 당황했어요. 과연 동민이는 이 엄청난 야광 코딱지 소동을 무사히 해결할 수 있을까요?
'9791171714360':
  title: 비스킷
  summary: 소진이에게 귀여운 강아지 비스킷이 생겼어요. 소진이는 비스킷에게 앉아, 기다려 같은 것을 가르쳐주고 싶지만, 비스킷은 너무 활발하고
    장난이 심해서 잘 듣지 않아요. 소진이는 비스킷이 자기를 좋아하는 건지 헷갈리고 때로는 속상하기도 했어요. 하지만 소진이는 비스킷이 자신만의
    특별한 방식으로 사랑을 표현하고 있다는 것을 깨닫게 돼요. 결국 둘은 서로를 더욱 깊이 이해하고 따뜻한 마음으로 함께하는 소중한 친구가 된답니다.
'9791171714469':
  title: 빨간내복야코 안 읽으면 완전 위험한 과학책
  summary: 빨간내복야코와 친구들이 등장하여 우리가 궁금해할 만한 과학 현상들을 신나는 모험으로 풀어주는 책이에요. 이 책은 우리 주변에서
    일어나는 신기한 일들의 과학적인 비밀을 쉽고 재미있게 알려준답니다. 왜 그런 일이 생기는지, 어떻게 해결할 수 있는지 야코와 함께 탐험하다
    보면 어느새 과학 박사가 된 기분이 들 거예요. 이 책을 읽으면 과학이 얼마나 우리 생활과 가깝고 즐거운지 깨달을 수 있어요. 자, 야코와
    함께 과학의 세계로 떠나볼까요?
'9791171722747':
  title: 타키포오 얼렁뚱땅 상식스쿨
  summary: 이 책은 캐릭온TV의 귀여운 타키포오 친구들과 함께 우리 주변의 다양한 상식을 배우는 재미있는 책이에요. 생활 속 궁금증부터 과학,
    역사 등 여러 분야의 지식을 만화처럼 쉽고 즐겁게 알려준답니다. 타키포오 친구들이 얼렁뚱땅 실수하고 엉뚱한 상황에 빠지면서 상식을 하나씩 알아가는
    방식이라 더욱 흥미진진해요. 어렵게 느껴질 수 있는 정보들을 웃음과 함께 배우면서, 어느새 똑똑해질 수 있을 거예요. 궁금증을 해결하고 싶거나
    재미있게 공부하고 싶은 친구들에게 딱 맞는 책이랍니다.
'9791172036669':
  title: 타키포오 얼렁뚱땅 상식스쿨
  summary: "「타키포오 얼렁뚱땅 상식스쿨」은 인기 유튜브 채널 캐릭온TV의 귀여운 캐릭터 타키포오와 친구들이 함께하는 상식 학습 만화예요.
    타키포오와 친구들이 엉뚱하고 재미있는 일들을 겪으며 다양한 분야의 상식들을 쉽고 즐겁게 알려준답니다. 이 책을 읽으면서 어린이 친구들은 과학,
    역사, 문화 등 여러 가지 지식들을 자연스럽게 익힐 수 있어요. 학교나 일상생활에서 궁금했던 상식들을 유쾌한 이야기와 그림으로 배우며 똑똑해질
    수 있는 책이랍니다."
'9791173111686':
  title: 슈뻘맨의 숨은 과학 찾기 :엉뚱 도전 속에 숨은 과학 상식
  summary: 이 책은 인기 유튜버 슈뻘맨의 재미있는 도전 속에 숨어 있는 과학 원리를 알려줘요. 슈뻘맨이 벌이는 엉뚱하고 신나는 실험들을 보면서
    친구들은 저절로 과학 상식을 배울 수 있어요. 물리, 화학, 생명 과학 등 다양한 분야의 과학 지식을 쉽고 재미있게 설명해 준답니다. 재미있는
    이야기와 그림 덕분에 과학이 어렵지 않고 아주 즐거운 과목이라는 것을 깨닫게 될 거예요. 이 책을 읽으면 도전 정신과 탐구심을 키우면서 우리
    주변의 모든 현상 속에 과학이 숨어 있음을 발견하게 될 거예요.
'9791173113444':
  title: "(흔한남매) 수수께끼 어드벤처 :수수께끼로 배우는 교과 지식"
  summary: 이 책은 아주 인기 많은 흔한남매 캐릭터들과 함께 떠나는 신나는 모험 이야기예요. 흔한남매가 여러 장소에서 재미있는 수수께끼를
    만나고, 친구들과 함께 머리를 맞대어 풀어나가지요. 수수께끼를 해결하면서 저절로 국어, 수학, 과학 같은 교과 지식을 배울 수 있답니다. 웃으면서
    똑똑해질 수 있는 아주 특별한 책이에요!
'9791173113772':
  title: 윔피 키드
  summary: 윔피 키드는 그레그라는 초등학생 남자아이의 일기 형식으로 되어 있어요. 그레그는 학교생활이 정말 힘들다고 생각하고, 친구들과의
    관계나 집안일 때문에 늘 골치를 썩이죠. 하지만 그레그는 언제나 자신만의 방법으로 이 모든 어려운 상황들을 헤쳐나가려고 애써요. 때로는 엉뚱하고
    재미있는 계획을 세우기도 하고, 가끔은 실수를 저지르기도 한답니다. 이 책을 읽다 보면 그레그의 좌충우돌 학교생활과 성장 이야기를 유쾌하게
    만날 수 있을 거예요.
'9791173114038':
  title: 흔한남매
  summary: 흔한남매는 개그맨 남매인 으뜸이와 에이미의 유쾌한 일상을 담은 이야기예요. 두 남매는 매일같이 티격태격 싸우고 서로에게 장난을
    치지만, 사실은 누구보다 서로를 아끼고 사랑한답니다. 학교생활이나 집에서의 재미있는 에피소드들이 가득해서 읽는 내내 웃음을 멈출 수 없을 거예요.
    이 책을 읽으면 형제자매가 있는 친구들은 공감하고, 외동인 친구들도 마치 남매가 생긴 것처럼 즐거울 거예요.
'9791173114168':
  title: 슈뻘맨의 숨은 국어 찾기 :슈뻘맨과 함께 국어 완전 정복!
  summary: 인기 유튜버 슈뻘맨이 초등학생 친구들과 함께 국어 실력을 쑥쑥 키워주는 학습 만화책이에요. 슈뻘맨과 친구들이 모험을 떠나면서 속담,
    관용어, 맞춤법 등 다양한 국어 지식을 쉽고 재미있게 배우게 돼요. 이야기 속에서 헷갈리기 쉬운 낱말의 뜻과 사용법을 자연스럽게 익힐 수 있답니다.
    단순히 외우는 것이 아니라 직접 문제를 풀고 활동하면서 국어 실력을 확실히 다질 수 있게 도와줘요. 마치 게임하듯이 신나는 이야기 속에서 국어의
    재미를 깨닫고 실력을 키울 수 있는 책이랍니다.
'9791173119262':
  title: 에그박사 :Egg&bugs
  summary: 에그박사, 팝, 띠용 세 친구가 신비로운 자연 속으로 모험을 떠나는 이야기예요. 이 책에서는 특히 알과 다양한 곤충들을 만나며
    그들의 특별한 능력과 살아가는 방식을 탐구합니다. 친구들은 흥미진진한 사건들을 겪으면서 곤충에 대한 궁금증을 해결하고 새로운 지식을 얻게 된답니다.
    어린이들이 좋아하는 유쾌한 그림과 함께 자연과 곤충의 세계를 쉽고 재미있게 배울 수 있도록 도와주는 책이에요.
'9791173320101':
  title: 흔한남매 과학 탐험대
  summary: 이 책은 인기 유튜버 흔한남매의 으뜸이와 에이미가 주인공으로 나오는 과학 학습 만화예요. 흔한남매는 신나는 모험을 떠나면서 우리
    주변의 여러 과학 현상과 원리들을 쉽고 재미있게 배우게 됩니다. 티격태격하지만 늘 함께 힘을 모아 미션을 해결하는 흔한남매의 모습은 아주 유쾌해요.
    어린이 친구들은 흔한남매의 유머 가득한 이야기들을 읽으면서 자연스럽게 과학 지식을 쌓을 수 있을 거예요. 과학이 어렵다고 생각했던 친구들도
    이 책을 통해 과학의 재미를 발견할 수 있을 거랍니다!
'9791173320224':
  title: "(흔한 남매) 세계사 탐험대"
  summary: 흔한 남매 으뜸이와 에이미가 신나는 시간 여행을 떠나 세계 역사를 탐험하는 이야기예요. 이 책에서 흔한 남매는 고대 문명부터 근현대사까지
    다양한 시대와 장소를 넘나들며 역사 속 중요 사건들을 직접 겪게 돼요. 흥미진진한 모험을 통해 여러 나라의 문화와 위인들을 만나면서 세계사를
    자연스럽게 배울 수 있답니다. 웃음 가득한 이야기와 재미있는 그림으로 역사 공부가 전혀 지루하지 않을 거예요. 으뜸이와 에이미와 함께 놀면서
    세계 역사를 정복해 보세요!
'9791173320385':
  title: 놓지 마 맞춤법
  summary: 이 책은 인기 만화 '놓지 마 정신줄' 친구들이 맞춤법을 쉽고 재미있게 알려주는 학습 만화예요. 헷갈리기 쉬운 한국어 맞춤법 규칙을
    주인공들이 겪는 재미있는 이야기 속에 자연스럽게 녹여냈답니다. 만화 중간중간에 퀴즈와 설명이 나와 지루할 틈 없이 공부할 수 있어요. 딱딱하게
    느껴질 수 있는 맞춤법 공부를 신나게 즐기면서 저절로 익힐 수 있도록 도와주는 책이랍니다. 책을 읽다 보면 어느새 맞춤법 실력이 쑥쑥 늘어날
    거예요.
'9791173320835':
  title: 하고 싶은 공부 :최재천과 함께하는 어린이 성장 동화
  summary: 이 책은 공부가 재미없는 한 아이가 최재천 교수님을 만나며 진정한 공부의 의미를 찾아가는 이야기예요. 교수님은 아이에게 호기심을
    갖고 자신이 정말 좋아하고 알고 싶은 것을 탐구하는 것이 진짜 공부라고 알려줍니다. 주인공은 시험 성적만을 위한 공부가 아닌, 세상의 모든
    것이 배움의 대상이 될 수 있다는 것을 깨달아요. 최재천 교수님의 실제 경험과 생각들이 담겨 있어서 아이들이 스스로 '하고 싶은 공부'가 무엇인지
    생각하게 도와주는 따뜻한 성장 동화입니다.
'9791173320927':
  title: 별별 직업 상담소
  summary: 이 책은 한 아이가 여러 가지 직업에 대해 고민하며 특별한 직업 상담소를 찾아가는 이야기예요. 상담소에서는 사람들이 생각하지 못했던
    아주 독특하고 재미있는 직업들을 많이 알려준답니다. 예를 들면, '사람들을 놀라게 하는 일'이나 '아무것도 안 하는 일' 같은 상상 속 직업들도
    소개하죠. 아이는 이런 신기한 직업들을 들으면서 자기가 정말 하고 싶은 일이 무엇인지 깊이 생각해 보게 돼요. 직업의 의미를 다시 한번 고민하고,
    꿈을 자유롭게 상상하도록 도와주는 따뜻하고 유쾌한 책입니다. 어린이 친구들도 이 책을 보면서 나중에 어떤 어른이 되고 싶은지 마음껏 상상해
    보세요!
'9791173321009':
  title: 내가 할배냥
  summary: 꼬부라는 이름의 늙은 고양이가 주인공이에요. 꼬부는 할아버지 고양이인데, 자기만의 규칙을 지키며 집에서 평화롭게 살고 있었죠.
    하지만 어느 날, 꼬부의 평화로운 일상에 작은 변화가 생기기 시작해요. 꼬부는 집에서 사랑받는 존재로, 느리지만 자신만의 방식으로 세상을 느끼고
    경험해요. 이 책은 나이든 고양이의 시선으로 가족과 함께하는 소중한 시간을 따뜻하게 그린답니다.
'9791173321252':
  title: 드래곤 히어로
  summary: 강투지는 용을 아주 좋아하는 평범한 초등학생이에요. 어느 날, 투지가 그린 용이 진짜로 살아 움직이면서 세상을 시끄럽게 만들어요.
    투지는 자기가 그린 용 때문에 벌어진 일을 해결하기 위해 특별한 능력을 가진 드래곤 히어로가 됩니다. 과연 투지는 용과 함께 신나는 모험을
    떠나 세상을 구할 수 있을까요? 이 책은 용을 좋아하는 투지의 성장과 용감한 모험을 담은 이야기예요.
'9791173321610':
  title: 흔한남매 과학 탐험대
  summary: "「흔한남매 과학 탐험대」는 인기 유튜브 채널 흔한남매의 으뜸이와 에이미가 주인공으로 나오는 과학 학습 만화예요. 으뜸이와 에이미가
    호기심 가득한 과학 세계를 탐험하면서 여러 가지 신나는 모험을 겪는답니다. 이 책을 읽으면서 친구들은 흔한남매의 유쾌한 이야기를 따라가며 과학
    원리들을 쉽고 재미있게 배울 수 있어요. 어려운 과학 용어나 복잡한 현상도 만화를 통해 자연스럽게 이해하게 될 거예요. 마치 게임처럼 즐겁게
    과학 지식을 쌓고, 궁금증을 해결하는 방법을 알아가는 데 도움을 주는 책이랍니다."
'9791173321757':
  title: "(흔한 남매) 세계사 탐험대"
  summary: 인기 유튜버 흔한남매의 으뜸이와 에이미가 이번에는 신나는 세계사 탐험을 떠나요. 장난기 가득한 흔한남매와 함께 고대 이집트, 로마
    제국 등 흥미진진한 역사 속 장소들을 방문하며 재미있는 사건들을 겪는답니다. 마치 시간 여행을 하는 것처럼 여러 나라의 중요한 인물과 문화,
    그리고 역사적 순간들을 만나게 될 거예요. 책을 읽다 보면 흔한남매의 유쾌한 모험을 따라가며 세계 역사를 쉽고 재미있게 배울 수 있답니다.
'9791173322914':
  title: 흔한남매 과학 탐험대
  summary: 흔한남매 과학 탐험대는 인기 유튜버 흔한남매가 등장하는 신나는 과학 만화책이에요. 으뜸이와 에이미가 특별한 과학 탐험을 떠나면서
    다양한 과학 원리를 쉽고 재미있게 배우게 된답니다. 우리 주변에서 궁금했던 과학 현상들을 흔한남매가 직접 체험하고 설명해 주어요. 이 책을
    읽으면 과학이 어렵지 않고 아주 흥미로운 모험이라는 것을 깨달을 수 있을 거예요. 흔한남매와 함께 신나는 과학의 세계로 떠나봐요!
'9791173470615':
  title: "(흔한남매) 별난 세계 여행"
  summary: 에이미와 으뜸이 남매가 이번에는 지구 반대편의 나라들로 아주 특별한 세계 여행을 떠나요. 이집트의 피라미드, 프랑스의 에펠탑 같은
    유명한 곳들을 찾아가는데, 가는 곳마다 흔한남매답게 시끌벅적한 사건들이 터진답니다. 두 남매는 티격태격하면서도 서로 돕고, 각 나라의 신기한
    문화와 재미있는 역사 이야기도 배우게 돼요. 예상치 못한 웃긴 상황 속에서 지구촌 친구들을 만나고 맛있는 음식도 먹으면서 잊지 못할 추억을
    만들어요. 과연 에이미와 으뜸이는 무사히 세계 여행을 마치고 집으로 돌아올 수 있을까요? 유쾌한 흔한남매의 좌충우돌 세계 여행을 함께 떠나
    보아요!
'9791173470660':
  title: "(흔한남매) 흔한 게임"
  summary: "「흔한남매 흔한 게임」은 인기 유튜버 흔한남매의 으뜸이와 에이미가 주인공으로 나오는 신나는 만화책이에요. 이 책에서는 흔한남매가
    컴퓨터 게임, 보드 게임, 바깥놀이 등 여러 가지 재미있는 게임들을 즐기면서 벌어지는 이야기들을 담고 있어요. 게임을 하며 생기는 웃기고 황당한
    상황들 때문에 읽는 내내 배꼽 잡고 웃게 될 거예요. 흔한남매의 티격태격하는 모습이나 게임에 푹 빠져서 벌어지는 실수들을 보면서 우리들의 모습과도
    닮아있다고 느낄 수 있을 거예요. 게임을 좋아하는 친구들이나 흔한남매 팬이라면 이 책을 아주 재미있게 읽을 수 있을 거예요."
'9791173470967':
  title: 내일은 발명왕 :본격 대결 과학발명 만화
  summary: 주인공 온유한과 친구들은 발명반에서 다양한 발명품을 만들어요. 이 책은 발명 대결을 통해 과학 원리를 배우고 창의력을 키워주는
    만화예요. 친구들과 함께 머리를 맞대고 기발한 아이디어를 내서 문제를 해결해 나간답니다. 흥미진진한 발명 경쟁을 보면서 과학 지식뿐만 아니라
    도전 정신과 협동심도 배울 수 있어요. 재미있는 만화 형식으로 되어 있어 과학 발명이 어렵지 않고 신나게 다가올 거예요.
'9791173471148':
  title: 슈뻘맨의 숨은 생물 찾기 :관찰하며 배우는 생물 지식
  summary: 이 책은 인기 유튜버 슈뻘맨과 함께 우리 주변에 숨어 있는 다양한 생물들을 찾아 떠나는 신나는 탐험 이야기예요. 주변에 어떤 생물들이
    살고 있는지 관찰하고 배우는 방법을 재미있게 알려준답니다. 슈뻘맨이 들려주는 이야기와 함께 생물들의 특별한 능력과 살아가는 방식을 알아볼 수
    있어요. 이 책을 읽으면 우리 눈에는 잘 띄지 않지만 늘 함께 살아가는 생명체들의 소중함을 깨닫고, 자연을 더욱 사랑하게 될 거예요. 꼭 직접
    밖에 나가 생물들을 찾아보고 싶은 마음이 들게 해 줄 책이랍니다.
'9791173471780':
  title: 흔한남매의 흔한 호기심 :일상에서 만나는 과학 상식
  summary: 흔한남매 에이미와 으뜸이가 이번에는 우리 주변의 신기한 과학 이야기를 알려주는 책이에요. 일상생활에서 흔히 궁금했던 질문들을 함께
    탐구하며 과학 상식을 쉽고 재미있게 배울 수 있어요. 왜 하늘은 파맑은 파란색인지, 라면은 왜 꼬불꼬불한지 같은 흥미로운 질문들에 답을 찾아가죠.
    이 책을 읽다 보면 우리 눈에 보이지 않던 과학 원리들이 얼마나 우리 가까이에 있고 재미있는지 알게 될 거예요. 흔한남매와 함께 신나는 과학
    지식을 배우면서 똑똑한 어린이가 되어 보아요.
'9791173473869':
  title: 흔한남매 이상한 나라의 고전 읽기
  summary: 으뜸이와 에이미 흔한남매가 이번에는 고전 읽기를 도와주러 왔어요. 어렵고 지루하다고 생각했던 옛날이야기들을 흔한남매의 유쾌하고
    재미있는 방식으로 풀어내준답니다. 백설 공주나 신데렐라 같은 유명한 이야기부터 처음 듣는 신기한 이야기까지 모두 만나볼 수 있어요. 흔한남매와
    함께 고전 속 주인공들이 되어 신나는 모험을 떠나면서, 고전이 얼마나 재미있는지 저절로 알게 될 거예요. 이 책을 읽으면 어려운 고전도 쉽고
    재미있게 읽을 수 있답니다!
'9791173473968':
  title: 흔한남매
  summary: 흔한남매는 티격태격하면서도 서로를 챙기는 평범한 남매의 재미있는 일상을 담은 책이에요. 오빠 '한으뜸'과 동생 '한이쁜'이 주인공인데요,
    집에서나 학교에서나 매일매일 웃음이 끊이지 않는 다양한 에피소드들이 펼쳐진답니다. 장난기 가득한 오빠와 똑 부러지는 동생이 서로에게 장난을
    치고 갈등하기도 하지만, 결국은 누구보다 소중한 가족임을 깨닫게 해줘요. 이 책을 읽으면 마치 내 옆집 오빠, 동생 이야기를 보는 것 같아서
    깔깔 웃음이 나고 공감할 수 있을 거예요.
'9791173476051':
  title: 슈뻘맨의 숨은 과학 찾기 :엉뚱 도전 속에 숨은 과학 상식
  summary: 이 책은 유튜브 크리에이터 슈뻘맨 아저씨의 신나는 도전을 통해 과학을 배우는 책이에요. 슈뻘맨 아저씨의 엉뚱하고 기발한 실험들
    속에 숨어 있는 재미있는 과학 원리들을 알기 쉽게 설명해 준답니다. 우리 주변에서 쉽게 찾아볼 수 있는 다양한 과학 현상들이 왜 일어나는지,
    쉽고 재미있게 알려주죠. 책을 읽는 친구들은 슈뻘맨 아저씨와 함께 직접 실험에 참여하는 기분을 느끼며 과학 상식을 쑥쑥 키울 수 있을 거예요.
    과학이 어렵지 않고 우리 생활 속에 가까이 있다는 것을 알려주는 흥미로운 책이랍니다.
'9791173476259':
  title: 에그박사 :Egg&bugs
  summary: 에그박사님들은 곤충을 너무나 사랑하는 세 명의 친구들이에요. 이 책은 에그박사님들과 함께 다양한 곤충들의 신기한 세상을 탐험하는
    이야기예요. 책 속에서 아이들은 예쁜 나비부터 용감한 장수풍뎅이까지, 여러 곤충들이 어디에 살고 무엇을 먹는지 배우게 될 거예요. 에그박사님들의
    재미있는 설명과 그림 덕분에 곤충 친구들과 더 가까워지고 자연을 사랑하는 마음도 키울 수 있답니다.
'9791173476594':
  title: "(처음 읽는) 그리스 로마 신화 =First Greek mythology"
  summary: 이 책은 아주 옛날 그리스와 로마 사람들이 믿었던 신과 영웅들의 재미있는 이야기를 담고 있어요. 힘센 제우스 신부터 용감한 헤라클레스
    영웅까지, 신비롭고 멋진 캐릭터들을 만날 수 있답니다. 세상이 어떻게 시작되었는지, 여러 신들이 어떤 모험을 했는지 쉽고 재미있게 알려줘요.
    이 책을 읽으면 상상력을 키우고, 서양 문화에 대한 기본적인 지식도 얻을 수 있을 거예요.
'9791173477263':
  title: 흔한남매 이무기 :이해하면 무서운 이야기
  summary: 흔한남매 으뜸이와 에이미가 들려주는 오싹하고 무서운 이야기 모음집이에요. 겉으로 보기엔 평범한 이야기들이지만, 그 속에 숨겨진
    뜻을 깨닫는 순간 등골이 오싹해지는 재미를 느낄 수 있답니다. 친구들과 함께 이야기를 읽고 숨겨진 반전이나 비밀을 찾아보는 활동도 무척 흥미로울
    거예요. 예측할 수 없는 반전과 섬뜩한 상상력으로 가득 찬 이야기들을 통해 색다른 스릴을 경험할 수 있어요.
'9791173477683':
  title: 슈뻘맨의 숨은 생물 찾기 :관찰하며 배우는 생물 지식
  summary: 이 책은 인기 크리에이터 슈뻘맨과 함께 우리 주변에 숨어 사는 생물들을 찾아 떠나는 신나는 탐험 이야기예요. 도심의 작은 풀숲부터
    깊은 숲속, 그리고 바다까지 여러 환경에서 만나는 다양한 생물들의 모습을 관찰하게 된답니다. 생물들이 어떤 특징을 가졌는지, 어디에 숨어 사는지,
    어떻게 살아가는지 등 신기한 생물 지식을 쉽고 재미있게 배울 수 있어요. 마치 슈뻘맨과 함께 직접 탐험하는 것처럼 생물과 자연에 대한 궁금증을
    해결해 줄 거예요.
'9791173479939':
  title: 흔한남매
  summary: 흔한남매는 유튜브에서 아주 큰 인기를 얻은 코미디 채널을 책으로 만든 시리즈예요. 으뜸 오빠와 에이미 동생이 주인공인데, 이 둘은
    매일 티격태격하면서도 서로를 챙겨주는 평범한 남매의 모습을 보여주죠. 책에는 남매가 집에서 벌이는 엉뚱하고 재미있는 장난들과 유쾌한 일상 에피소드들이
    가득 담겨 있어요. 아이들은 으뜸이와 에이미의 이야기에 공감하며 깔깔 웃을 수 있을 거예요. 우리 주변에서 흔히 볼 수 있는 남매의 모습이
    담겨 있어 더욱 친근하고 재미있답니다.
'9791173479946':
  title: 에그박사 :Egg&bugs
  summary: '에그박사: Egg&bugs는 유튜브에서 인기 있는 에그박사 삼총사가 곤충의 세계를 탐험하는 책이에요. 이 책에서 에그박사와 닥터에그,
    알이 등장해서 여러 가지 신기한 곤충들을 직접 찾아보고 관찰해요. 아이들은 이 책을 읽으면서 곤충들이 어떻게 생겼는지, 어떤 특징이 있는지
    재미있게 배울 수 있어요. 마치 에그박사 친구들과 함께 숲 속 탐험을 떠나는 것처럼 신나는 곤충 이야기를 만날 수 있답니다. 다양한 곤충들의
    사진과 재미있는 설명 덕분에 곤충 박사가 된 기분을 느낄 거예요.'
'9791173571268':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 마법천자문은 손오공이 친구들과 함께 떠나는 신나는 한자 모험 이야기예요. 나쁜 마물들이 한자 마법으로 세상을 어지럽히면, 손오공은
    정의로운 힘과 한자 마법을 써서 맞서 싸워요. 이 책을 읽다 보면 흥미진진한 모험을 즐기면서 어려운 한자를 쉽고 재미있게 배울 수 있어요.
    손오공과 친구들이 힘을 합쳐 위기를 극복하고 점점 더 강해지는 모습이 아주 멋지답니다. 마치 게임처럼 몰입해서 한자 마법을 익히는 특별한 경험을
    할 수 있을 거예요.
'9791173571749':
  title: 빨간내복야코 어린이 상식 :이거 모르면 지구인 아님
  summary: 이 책은 유튜브에서 인기가 많은 '빨간내복야코' 친구들과 함께 재미있는 상식을 배우는 책이에요. 우리가 살고 있는 지구와 관련된
    흥미로운 질문과 답으로 가득 차 있답니다. 왜 잠을 자야 하는지, 자동차는 어떻게 움직이는지 같은 어린이들이 궁금해할 만한 지식들을 쉽게 알려줘요.
    그림과 함께 쉽고 재미있게 설명해 주어 읽는 내내 지루할 틈이 없을 거예요. 이 책을 읽으면 몰랐던 사실들을 많이 알게 되고, 똑똑한 지구인이
    될 수 있을 거랍니다.
'9791173571978':
  title: 비밀요원 레너드
  summary: 레너드는 사실 먹는 것을 세상에서 제일 좋아하는 오소리 비밀 요원이에요. 어느 날, 전 세계를 혼란에 빠뜨릴 '맛 폭탄'을 만들려는
    악당이 나타나요. 레너드는 생쥐 요원 미키와 함께 이 맛 폭탄을 막기 위한 아주 중요한 임무를 맡게 된답니다. 맛있는 음식과 흥미진진한 추격전이
    가득한 모험 속에서 과연 레너드는 악당을 물리칠 수 있을까요? 귀여운 동물 요원들의 좌충우돌 대활약을 만나볼 수 있는 유쾌한 이야기예요.
'9791173572128':
  title: Go go 카카오프렌즈 :세계 역사 문화 체험 학습만화
  summary: 카카오프렌즈 친구들이 시간 여행을 하며 전 세계의 역사와 문화를 탐험하는 신나는 학습 만화예요. 친구들은 '역사 도감'의 조각을
    찾기 위해 여러 나라를 방문하고, 그곳의 특별한 유물이나 역사적인 사건들을 직접 경험한답니다. 만화 속 카카오프렌즈는 때로는 문제를 해결하고,
    때로는 위험에 빠지기도 하지만, 서로 도우며 지혜롭게 헤쳐나가요. 이 책을 읽으면 카카오프렌즈와 함께 모험을 즐기면서 다양한 나라의 역사와
    문화를 재미있게 배울 수 있을 거예요.
'9791173573019':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 이 책은 주인공 손오공이 친구들과 함께 흥미진진한 모험을 떠나는 이야기예요. 손오공은 한자 마법을 사용해서 세상을 어지럽히는 나쁜
    요괴들과 맞서 싸워요. 각각의 한자에는 특별한 힘이 담겨 있어서, 손오공은 한자를 배울 때마다 더 강해진답니다. 친구들과 힘을 합쳐 위험한
    순간들을 극복하고, 세상의 평화를 되찾기 위해 노력하는 용감한 이야기예요. 이 책을 읽으면 재미있는 모험을 즐기면서 자연스럽게 한자를 익힐
    수 있을 거예요.
'9791173573705':
  title: 비밀요원 레너드
  summary: 레너드는 평범한 오소리처럼 보이지만, 사실은 아주 특별한 비밀 요원이에요. 그의 든든한 파트너 피넛 햄스터와 함께 다양한 사건들을
    해결하지요. 이 책에서 레너드와 피넛은 위험한 임무를 맡아 흥미진진한 모험을 떠나요. 둘은 뛰어난 실력과 용기를 발휘해서 악당들의 음모를 밝혀내고,
    멋지게 세상을 지켜낸답니다. 친구와 함께 힘을 합쳐 문제를 해결하는 모습이 어린이 친구들에게 큰 재미와 감동을 줄 거예요.
'9791173573903':
  title: Go go 카카오프렌즈 :세계 역사 문화 체험 학습만화
  summary: 귀여운 카카오프렌즈 친구들, 라이언, 무지, 어피치 등이 세계 곳곳으로 신나는 여행을 떠나는 이야기에요. 친구들은 특별한 임무를
    가지고 여러 나라를 방문하며 재미있는 사건들을 겪어요. 이 모험을 통해 우리는 프랑스 에펠탑, 이집트 피라미드처럼 유명한 장소나 그 나라의
    역사, 문화를 자연스럽게 배울 수 있답니다. 카카오프렌즈와 함께라면 어렵게만 느껴지던 세계사 공부도 마치 게임처럼 즐거워질 거예요!
'9791173575051':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 마법천자문은 손오공과 친구들이 한자 마법을 사용해서 세상을 구하는 신나는 모험 이야기예요. 손오공은 나쁜 마귀들을 물리치고 잃어버린
    한자 조각을 찾아 떠나죠. 이 모험 속에서 손오공과 친구들은 새로운 한자를 배우고, 그 한자 마법으로 여러 어려움을 해결해요. 이야기를 읽다
    보면 자연스럽게 한자를 익히고, 용기와 지혜도 배울 수 있답니다.
'9791188874088':
  title: 설민석의 한국사 대모험
  summary: 이 책은 설민석 선생님과 함께 한국의 중요한 역사 속으로 떠나는 신나는 시간 여행 이야기예요. 주인공 '온달'과 '평강' 공주가
    실수로 과거의 역사 시대로 떨어지면서 이야기가 시작돼요. 두 친구는 우리 역사의 위대한 인물들을 만나고, 중요한 사건들을 직접 겪으면서 역사를
    배우게 됩니다. 다양하고 흥미진진한 모험을 통해 한국사를 쉽고 재미있게 알아갈 수 있어요. 이 책을 읽으면 우리나라의 자랑스러운 역사와 문화에
    대해 더 깊이 이해하게 될 거예요.
'9791188874262':
  title: 설민석의 한국사 대모험
  summary: "「설민석의 한국사 대모험」은 어린이들이 한국 역사를 재미있고 쉽게 배울 수 있도록 만든 만화책 시리즈예요. 주인공 온달과 평강
    공주, 그리고 설민석 선생님이 함께 시간 여행을 하면서 우리나라 역사의 중요한 순간들을 직접 경험하게 됩니다. 이들은 위대한 역사 속 인물들을
    만나고, 재미있는 사건들을 함께 해결해 나가면서 자연스럽게 한국사 지식을 익혀요. 마치 신나는 모험을 하는 것처럼 역사의 재미에 푹 빠져들게
    해주는 책이랍니다."
'9791188874293':
  title: 설민석의 한국사 대모험
  summary: 이 책은 설민석 선생님이 들려주는 재미있는 한국사 이야기예요. 평강 공주와 온달, 그리고 시간 여행을 돕는 로빈이 함께 과거 한국으로
    떠나 모험을 해요. 역사 속 위인들을 직접 만나고, 중요한 사건들을 겪으면서 우리 역사를 생생하게 배우게 된답니다. 어렵게 느껴질 수 있는
    한국사를 만화와 함께 쉽고 재미있게 이해할 수 있도록 도와줘요. 각 권마다 다른 시대와 인물을 다루며 흥미진진한 역사 여행을 떠날 수 있답니다.
'9791188874385':
  title: 설민석의 한국사 대모험
  summary: "『설민석의 한국사 대모험』은 시간 여행을 떠나 우리나라의 흥미진진한 역사를 배우는 책이에요. 주인공 온달과 평강 공주, 그리고
    든든한 로봇 '설쌤'이 과거로 돌아가 다양한 역사 속 인물들을 만난답니다. 이들은 옛날 시대의 중요한 사건들을 직접 보고 겪으면서 한국사의
    흐름을 깨닫게 돼요. 어려운 역사 이야기를 만화로 쉽고 재미있게 풀어내어 어린이 친구들이 지루할 틈이 없어요. 이 책을 읽으면서 우리 조상들의
    지혜와 용기를 배우고, 자랑스러운 한국사를 더욱 사랑하게 될 거예요."
'9791188874460':
  title: 설민석의 한국사 대모험
  summary: 이 책은 온달과 평강 공주가 시간 여행을 하며 우리나라 역사 속으로 모험을 떠나는 이야기예요. 옛날 시대로 돌아가 왕을 만나고,
    재미있는 사건들을 겪으면서 자연스럽게 한국사를 배울 수 있어요. 만화 형식이라 어렵지 않고, 설민석 선생님이 들려주는 역사 이야기도 함께 나와
    더 좋아요. 책을 읽다 보면 우리 조상들이 어떻게 살았는지, 어떤 중요한 일들이 있었는지 저절로 알게 될 거예요. 역사를 신나게 배우고 싶은
    친구들에게 정말 추천하는 책이랍니다.
'9791188912919':
  title: 시간을 건너는 집 :김하연 장편소설
  summary: 주인공 수아가 이모가 사는 신기한 은색 집으로 이사 가요. 이 집은 시간을 건너갈 수 있는 특별한 능력을 가지고 있어요. 수아는
    집에서 시간을 건너온 듯한 신비로운 소년 우진이를 만나게 돼요. 함께 시간을 넘나들며 서로의 가족과 잃어버린 소중한 것들을 찾아주려 노력해요.
    이 과정에서 서로를 이해하고 성장하며 따뜻한 우정을 쌓아가는 이야기예요.
'9791189686710':
  title: 이상한 무인 아이스크림 가게
  summary: 이 책은 신기한 무인 아이스크림 가게에서 벌어지는 이야기예요. 이 가게는 돈 대신 마음을 넣으면 손님들에게 딱 맞는 특별한 아이스크림을
    만들어 준답니다. 아이들은 아이스크림을 먹으며 저마다의 고민을 해결하고 따뜻한 위로를 받아요. 주인공 친구들이 가게를 통해 자신과 친구의 마음을
    알아가고 성장하는 과정을 볼 수 있어요. 맛있는 아이스크림처럼 달콤하고 시원한 이야기가 가득하답니다.
'9791190090766':
  title: 테스터 :이희영 장편소설
  summary: 이 책은 미래 사회를 배경으로, 모든 사람이 '테스터'라는 시험을 통해 앞으로 무엇을 할지 결정되는 이야기를 담고 있어요. 주인공은
    이 시험을 통과해야 하는 특별한 아이인데, 시험을 준비하며 친구들과 함께 사람의 가치와 선택에 대해 깊이 고민하게 된답니다. 과연 주인공은
    정해진 대로 따를까요, 아니면 자신만의 길을 찾아나설까요? 우리는 이 이야기를 통해 진정한 삶의 의미와 자유로운 선택의 중요성을 생각해 볼
    수 있을 거예요.
'9791190182737':
  title: 놓지 마 과학!
  summary: "『놓지 마 과학!』은 재미있는 만화를 통해 우리 친구들이 과학을 쉽게 배울 수 있도록 도와주는 책이에요. 엉뚱하고 귀여운 정신이네
    가족이 생활 속에서 겪는 신기한 과학 현상들을 만날 수 있어요. 어려운 과학 원리들도 만화를 읽다 보면 저절로 머리에 쏙쏙 들어올 거예요.
    우리 주변에 숨어있는 과학의 비밀을 유쾌하게 파헤치며 과학이 얼마나 즐거운지 알게 해준답니다."
'9791190305310':
  title: 놓지 마 과학!
  summary: 놓지 마 과학!은 정신이와 그의 가족, 친구들이 겪는 재미있는 일상 속에서 과학 원리를 알려주는 학습 만화예요. 정신이 가족에게는
    신기한 과학적 현상들이 계속해서 벌어지고, 그 속에 숨겨진 과학 이야기를 파헤치죠. 예를 들어, 왜 물건이 뜨는지, 왜 머리카락이 쭈뼛 서는지
    등 궁금한 질문들을 해결해 준답니다. 이 책은 어려운 과학 개념들을 유쾌한 그림과 이야기로 아주 쉽게 설명해 줘요. 덕분에 친구들도 만화를
    읽듯이 즐겁게 과학 지식을 쌓을 수 있을 거예요. 정신이와 함께 신나는 과학의 세계로 떠나 보세요!
'9791190337427':
  title: 햇빛초 대나무 숲에 새 글이 올라왔습니다
  summary: 햇빛초등학교 아이들은 익명으로 솔직한 이야기를 올리는 '대나무 숲' 게시판을 만들었어요. 주인공 초아는 여기에 좋아하는 친구에
    대한 비밀 글을 올리죠. 하지만 초아의 글 때문에 친구들 사이에 오해가 생기고, 학교 생활이 조금씩 복잡해지기 시작해요. 온라인에 올린 비밀
    글들이 현실 세계의 우정에 영향을 주면서 아이들은 고민에 빠집니다. 과연 초아와 친구들은 이 문제를 어떻게 해결하고, 진짜 친구의 소중함을
    깨달을 수 있을까요?
'9791190337755':
  title: 죽이고 싶은 아이 :이꽃님 장편소설
  summary: 이 책은 한 아이를 둘러싼 무서운 사건의 진실을 파헤치는 흥미진진한 이야기예요. 주인공 경민이는 어느 날, "너를 죽일 거야"라는
    섬뜩한 메시지를 받아요. 그런데 메시지를 보낸 것으로 의심되는 친구 지웅이가 갑자기 사고로 쓰러져 의식을 잃게 되지요. 경민이는 누가 진짜
    메시지를 보냈는지, 그리고 지웅이에게 무슨 일이 있었는지 밝히기 위해 사건을 파헤쳐요. 친구들 사이의 오해와 학교 안에서 벌어지는 복잡한 관계
    속에서 숨겨진 진실을 찾아야 한답니다. 과연 경민이는 모든 비밀을 풀고 진짜 범인을 찾을 수 있을까요?
'9791190409124':
  title: 똥볶이 할멈 :K-히어로 판타지
  summary: 똥볶이 할멈은 특별한 능력을 가진 슈퍼 할머니 이야기예요. 할머니는 똥 모양의 떡볶이를 만들어 파는데, 이 떡볶이를 먹으면 용기와
    힘이 솟아나요. 할머니는 아이들과 함께 학교에서 벌어지는 괴롭힘이나 나쁜 일들을 막기 위해 나선답니다. 못된 사람들을 혼내주고 친구들을 도와주는
    아주 신나는 K-히어로 판타지 모험 이야기예요.
'9791190409131':
  title: 똥볶이 할멈 :K-히어로 판타지
  summary: 옛날, 아주 특별한 똥볶이를 파는 신비로운 할머니가 있었어요. 이 똥볶이를 먹으면 어린이들에게 특별한 초능력이 생긴답니다! 주인공
    아이들은 똥볶이를 먹고 놀라운 힘을 얻게 돼요. 어린이들은 이 특별한 힘으로 마을에 닥친 여러 가지 어려운 사건들을 용감하게 해결해나가요.
    과연 아이들은 똥볶이 할머니와 함께 멋진 K-히어로가 되어 정의를 지킬 수 있을까요? 재미있고 신나는 판타지 모험 이야기예요!
'9791190409148':
  title: 똥볶이 할멈 :K-히어로 판타지
  summary: 이 책은 평범해 보이지만 사실은 특별한 힘을 가진 똥볶이 할멈의 유쾌한 이야기예요. 할머니는 맛있는 똥볶이를 만들며 동네를 지키는
    K-히어로이지요. 엉뚱하고 발랄한 상상력으로 가득한 똥볶이 할멈은 마을에 나타난 나쁜 악당들을 혼내 줍니다. 할머니의 비밀스러운 능력과 멋진
    활약을 통해 어린이 친구들도 용기와 정의를 배울 수 있어요. 웃음과 감동, 그리고 통쾌한 액션이 가득한 재미있는 판타지 동화랍니다.
'9791190409261':
  title: 똥볶이 할멈 :K-히어로 판타지
  summary: 이 책은 평범해 보이는 떡볶이 할머니가 사실은 놀라운 힘을 가진 K-히어로라는 재미있는 이야기예요. 할머니는 맛있는 떡볶이를 팔면서
    동네 사람들과 정겹게 지내지요. 그런데 악당들이 나타나 세상을 어지럽히면, 할머니는 멋진 모습으로 변신해서 악당들과 맞서 싸워요. 할머니는
    특별한 능력으로 사람들을 도와주고, 용감하게 세상을 지켜낸답니다. 맛있는 떡볶이와 함께 할머니의 신나는 모험을 즐길 수 있는 유쾌한 판타지
    동화예요.
'9791190409384':
  title: 똥볶이 할멈 :K-히어로 판타지
  summary: 똥볶이 할멈은 평범하게 떡볶이를 파는 할머니의 신나는 비밀을 알려주는 이야기예요. 사실 이 할머니는 도시를 위협하는 무시무시한
    괴물들과 싸우는 숨겨진 K-히어로랍니다. 주인공 아이들은 우연히 할머니의 특별한 능력을 알게 되고, 할머니의 떡볶이 재료로 만든 신기한 힘을
    빌려 함께 악당들을 물리치게 돼요. 쫄깃하고 매콤한 떡볶이처럼 흥미진진한 모험과 정의를 위한 싸움이 가득한 판타지 동화랍니다.
'9791190409391':
  title: 하늘 마을로 간 택배 :구름 배송 왔습니다
  summary: 아롱이는 땅 위로 택배를 배달하는 평범한 배달부였어요. 어느 날 아롱이에게 아주 특별한 주문이 들어왔답니다. 바로 하늘 마을로
    '구름'을 배송해 달라는 것이었어요! 아롱이는 멋진 구름 택배를 싣고 하늘로 올라가며 신기한 친구들을 만나고 어려움도 이겨냈어요. 과연 아롱이는
    구름을 무사히 하늘 마을에 전해줄 수 있을까요? 이 책은 용감하게 도전하고 친구들을 돕는 아롱이의 따뜻한 이야기예요.
'9791190630184':
  title: 놓지 마 과학!
  summary: "「놓지 마 과학!」은 정신없이 웃다 보면 과학 지식이 쑥쑥 자라는 인기 만화책이에요. 엉뚱하고 재미있는 정신이네 가족이 생활
    속에서 궁금한 과학 현상들을 파헤치죠. 정신이 아빠와 엄마, 그리고 사고뭉치 남매 정신이와 정주리가 등장해서 좌충우돌 에피소드를 만들어요.
    이 책을 읽으면 어려운 과학 원리도 유쾌하고 쉽게 이해할 수 있을 거예요. 만화를 보듯 술술 읽다 보면 어느새 과학 박사가 된답니다!"
'9791190786508':
  title: 천하무적 개냥이 수사대
  summary: 이 책은 명탐정 개 뭉치와 그의 조수 고양이 냥냥이가 주인공이에요. 둘은 '천하무적 개냥이 수사대'를 결성해서 동네에서 일어나는
    신기하고 재미있는 사건들을 해결한답니다. 사라진 물건을 찾거나, 이상한 일이 벌어졌을 때 뭉치의 용기와 냥냥이의 똑똑함으로 추리하며 범인을
    찾아내요. 서로 다른 개성을 가진 두 친구가 힘을 합쳐 문제를 해결하는 모습이 정말 멋져요. 이 책을 읽으면 탐정이 된 것처럼 함께 사건을
    풀어가는 재미를 느낄 수 있을 거예요.
'9791190908184':
  title: 놓지 마 과학!
  summary: 놓지 마 과학!은 재미있는 만화로 과학을 알려주는 인기 시리즈예요. 정신이와 그의 가족, 그리고 엉뚱한 친구들이 일상생활에서 겪는
    여러 에피소드를 통해 과학 원리를 쉽게 설명해 준답니다. 딱딱하고 어려운 과학 공식이나 용어 대신, 유머 넘치는 이야기 속에 다양한 과학 지식을
    담고 있어요. 물리학, 화학, 생물학 등 여러 분야의 과학 상식을 재미있게 배울 수 있도록 구성되어 있어요. 이 책을 읽다 보면 과학이 우리
    주변에 늘 함께 있다는 것을 깨닫고 과학과 친해질 수 있을 거예요!
'9791191043297':
  title: 오늘 밤, 세계에서 이 사랑이 사라진다 해도
  summary: 주인공 마오리는 아주 특별한 병을 앓고 있어요. 잠에서 깨어나면 어제의 기억을 모두 잊어버리는 병이지요. 남자 주인공 토오루는
    그런 마오리를 위해 매일 새로운 하루를 선물하기로 결심해요. 둘은 매일 밤 일기를 쓰며 서로의 소중한 기억을 간직하려고 노력한답니다. 과연
    이 특별한 사랑은 매일 밤 사라지지 않고 계속 이어질 수 있을까요? 슬프지만 아름다운 사랑 이야기예요.
'9791191043723':
  title: 어느 날, 내 죽음에 네가 들어왔다
  summary: 이 책은 삶이 너무 힘들어서 죽음을 생각하던 한 사람이 특별한 기회를 얻는 이야기예요. 어느 날, 죽음의 신 같은 존재가 나타나
    주인공에게 새로운 조건을 내걸어요. 주인공은 그 조건들을 들어주기 위해 다른 사람들과 만나면서 여러 경험을 하게 됩니다. 이 과정에서 주인공은
    자신의 삶과 죽음에 대해 깊이 생각하게 되고, 주변 사람들과의 소중한 인연을 깨달으며 삶의 진정한 의미를 찾아가게 된답니다.
'9791191043754':
  title: 세상의 마지막 기차역
  summary: 이 책은 세상의 가장 먼 곳, 신비로운 '세상의 마지막 기차역'에 도착한 유이라는 소녀의 이야기예요. 이 기차역에는 특별한 마지막
    기차를 기다리는 여러 사람들이 있어요. 유이는 그곳에서 만나는 다양한 손님들의 마음 아픈 이야기와 소중한 기억들을 듣게 된답니다. 기차역에서
    사람들과 시간을 보내며 유이는 삶과 이별, 그리고 희망의 의미를 조금씩 알아가게 돼요. 슬프지만 아름다운 이야기들을 통해 우리에게 진정한 행복이
    무엇인지 생각해보게 하는 따뜻한 책이에요.
'9791191043976':
  title: 오늘 밤, 세계에서 이 눈물이 사라진다 해도
  summary: 이 책은 잠에서 깨면 어제의 기억을 모두 잃어버리는 특별한 병을 가진 소녀와, 그런 소녀를 옆에서 묵묵히 지켜주는 소년의 이야기예요.
    소년은 매일 아침 소녀에게 어제 무슨 일이 있었는지 친절하게 알려주고, 새로운 추억을 만들어주기 위해 노력해요. 소녀는 매일 새로운 날을 맞이하지만,
    소년 덕분에 잊지 못할 소중한 시간을 보내게 된답니다. 두 친구의 아름답고도 가슴 뭉클한 이야기가 담겨 있어, 진정한 사랑과 우정이 무엇인지
    생각하게 해주는 책이에요.
'9791191119114':
  title: 천하무적 개냥이 수사대
  summary: "「천하무적 개냥이 수사대」는 똑똑한 개 '개철'과 귀여운 고양이 '냥냥이'가 함께 마을의 재미있는 사건들을 해결하는 이야기예요.
    개철이는 셜록 홈즈를 따라 하는 명탐정이고, 냥냥이는 통통 튀는 매력으로 개철이를 돕는 멋진 파트너랍니다. 둘은 잃어버린 강아지를 찾거나,
    수상한 흔적을 추적하며 동네 친구들의 고민을 해결하기 위해 신나게 뛰어다녀요. 이 책을 읽으면 추리하는 즐거움과 함께 서로 힘을 합치는 소중함을
    배울 수 있을 거예요."
'9791191496017':
  title: 설민석의 세계사 대모험
  summary: 설민석 선생님이 만든 신나는 세계 역사 만화예요. 주인공 온달과 평강 공주가 시간 여행을 떠나면서 세계 여러 나라의 역사 속으로
    모험을 한답니다. 이집트 피라미드나 로마 제국처럼 재미있는 곳들을 다니면서 중요한 사건과 인물들을 만나요. 어려운 세계사 이야기를 마치 재미있는
    이야기처럼 들려주어 역사 공부가 즐거워질 거예요. 역사를 잘 모르는 친구들도 쉽게 이해하며 세계 역사의 흐름을 익힐 수 있어요.
'9791191496024':
  title: 설민석의 삼국지 대모험
  summary: 이 책은 옛날 중국에서 서로 다른 세 나라가 힘을 겨루던 삼국시대 이야기를 만화로 재미있게 보여줘요. 유비, 관우, 장비 삼형제는
    서로 돕고 힘을 합쳐 세상에 평화를 가져오기 위해 노력해요. 똑똑한 제갈량과 같은 멋진 친구들과 함께 조조, 손권 같은 다른 영웅들과 흥미진진한
    싸움을 벌이기도 해요. 이 책을 읽으면서 용기, 우정, 지혜 등 소중한 가치들을 자연스럽게 배울 수 있답니다. 마치 게임처럼 신나는 모험을
    떠나며 역사도 배울 수 있는 책이에요.
'9791191496048':
  title: 설민석의 삼국지 대모험
  summary: 이 책은 아주 옛날 중국의 세 나라 이야기를 설민석 선생님이 쉽고 재미있게 들려주는 만화책이에요. 유비, 관우, 장비 같은 용감한
    영웅들이 세상을 평화롭게 만들기 위해 힘을 모으는 모험이 펼쳐져요. 지혜로운 전략가 제갈량이 꾀를 내고, 박진감 넘치는 전투가 계속되면서 손에
    땀을 쥐게 할 거예요. 이 책을 읽으며 정의로운 마음과 친구와의 우정이 얼마나 소중한지 배우고, 리더십에 대해서도 생각해 볼 수 있답니다.
    어려운 삼국지 이야기를 쉽고 신나는 모험으로 만나 보세요.
'9791191496055':
  title: 설민석의 세계사 대모험
  summary: 설민석 선생님과 함께 떠나는 신나는 세계사 여행이에요. 주인공 설쌤과 세나, 로빈이 시간 요정 타임마스터와 함께 과거의 여러 나라로
    모험을 떠나요. 이집트, 로마, 중국 등 다양한 문명과 역사적 사건들을 직접 경험하며 배울 수 있어요. 어려운 세계사 지식도 재미있는 이야기와
    만화로 쉽게 풀어져 있어서 흥미진진하답니다. 마치 모험 게임을 하듯이 세계 역사를 재미있게 배울 수 있는 책이에요.
'9791191496062':
  title: 설민석의 삼국지 대모험
  summary: 설민석의 삼국지 대모험은 아주 먼 옛날 중국에서 위, 촉, 오 세 나라가 서로 가장 강한 나라가 되기 위해 싸웠던 신나는 이야기를
    만화로 쉽게 풀어낸 책이에요. 유비, 관우, 장비 삼형제가 의형제를 맺고 혼란스러운 세상에서 백성들을 위해 나라를 세우는 이야기가 펼쳐진답니다.
    뛰어난 전략가 제갈공명이 등장해 지혜로운 계책으로 위기를 극복하는 모습도 흥미진진하게 그려져요. 용감하고 의리 있는 장수들과 똑똑한 책사들의
    흥미로운 모험을 따라가다 보면, 역사 속 지혜와 용기를 배울 수 있을 거예요.
'9791191496130':
  title: 설민석의 삼국지 대모험
  summary: 이 책은 중국의 아주 옛날이야기, '삼국지'를 설민석 선생님과 함께 쉽고 재미있게 배우는 만화책이에요. 용감한 영웅 유비, 관우,
    장비가 힘을 합쳐 세상의 혼란을 잠재우고 백성을 평화롭게 만들려는 흥미진진한 모험을 그린답니다. 똑똑한 제갈량 같은 멋진 군사들과 무서운 적
    조조, 손권도 등장해서 이야기가 더욱 박진감 넘쳐요. 친구들은 이 책을 읽으며 세 나라가 서로 싸우고 화해하며 성장하는 과정을 통해 지혜와
    용기, 우정의 소중함을 배울 수 있을 거예요. 마치 게임을 하듯이 즐겁게 역사 속 영웅들을 만날 수 있답니다.
'9791191496147':
  title: 설민석의 세계사 대모험
  summary: 이 책은 주인공 태건이와 로빈, 그리고 램프의 요정 지니가 함께 시간 여행을 하면서 세계 역사를 배우는 모험 이야기예요. 친구들은
    세계 여러 나라의 중요한 순간과 장소로 떠나게 된답니다. 고대 문명부터 현대사까지, 위대한 인물들을 만나고 역사적인 사건들을 직접 겪으며 세계를
    알아가죠. 딱딱하게 느껴질 수 있는 세계사를 흥미진진한 모험처럼 느끼고, 쉽고 재미있게 이해할 수 있도록 도와주는 책이에요. 마치 내가 직접
    역사 속으로 들어간 것 같은 생생한 경험을 할 수 있을 거예요.
'9791191496154':
  title: 설민석의 삼국지 대모험
  summary: 이 책은 아주 먼 옛날 중국의 유명한 이야기 '삼국지'를 재미있는 만화로 다시 꾸민 책이에요. 역사 선생님 설민석 선생님이 어려운
    삼국지 이야기를 아이들 눈높이에 맞춰 쉽고 신나게 설명해 줍니다. 유비, 관우, 장비, 제갈량 같은 멋진 영웅들이 서로 힘을 합치고 지혜를
    모아 혼란스러운 세상을 바꾸려는 대모험을 펼쳐요. 서로 다른 세 나라가 누가 진짜 주인이 될지 싸우면서 우정과 용기, 그리고 지혜를 배우는
    흥미진진한 이야기가 가득합니다. 이 책을 읽으면 중국의 역사와 함께 다양한 인물들의 매력을 발견할 수 있을 거예요!
'9791191496161':
  title: 설민석의 세계사 대모험
  summary: 설민석의 세계사 대모험은 유명한 설민석 선생님이 아이들을 위해 만든 신나는 역사 이야기예요. 주인공 태건이와 로빈이 시간 여행을
    떠나면서 이집트, 로마, 중국 등 세계 여러 나라의 중요한 역사적 순간들을 직접 경험하게 된답니다. 모험을 통해 각 나라의 문화와 위대한 인물들을
    만나고, 어려운 상황들을 지혜롭게 헤쳐나가면서 역사를 자연스럽게 배울 수 있어요. 이 책은 복잡하게 느껴질 수 있는 세계사를 쉽고 재미있는
    모험 이야기로 풀어내어 아이들이 역사와 더욱 친해지도록 도와줍니다.
'9791191496185':
  title: 설민석의 삼국지 대모험
  summary: "『설민석의 삼국지 대모험』은 중국의 아주 오래된 영웅들의 이야기인 삼국지를 어린이들이 재미있게 읽을 수 있도록 만화로 만든 책이에요.
    어지러운 세상을 구하려는 세 명의 영웅, 유비, 관우, 장비가 복숭아나무 아래에서 만나 의형제를 맺고 힘을 합쳐요. 이들은 지혜로운 제갈량
    같은 친구들의 도움을 받아 혼란 속에서 새로운 나라를 세우기 위해 멋진 모험을 시작한답니다. 위, 촉, 오 세 나라가 서로 경쟁하며 싸우고
    화합하는 흥미진진한 이야기가 펼쳐지며, 우리는 영웅들의 용기와 지혜, 그리고 서로를 아끼는 마음을 배울 수 있어요."
'9791191496208':
  title: 설민석의 한국사 대모험
  summary: 이 책은 설민석 선생님과 함께 우리나라의 역사를 탐험하는 신나는 만화책이에요. 주인공 온달과 평강 공주가 시간 여행을 떠나 과거의
    위인들을 만나고 중요한 역사적 순간들을 직접 경험하게 된답니다. 재미있는 그림과 쉬운 이야기로 한국사를 쉽고 즐겁게 배울 수 있도록 도와줘요.
    책을 읽다 보면 어느새 역사 속 지식이 머릿속에 쏙쏙 들어와 있을 거예요.
'9791191496598':
  title: 설민석의 삼국지 대모험
  summary: 이 책은 아주 먼 옛날 중국의 세 나라가 서로 싸우던 삼국지 이야기를 어린이들이 재미있게 읽을 수 있도록 만화로 만든 책이에요.
    유비, 관우, 장비 삼형제가 의형제를 맺고 혼란스러운 세상을 바로잡으려는 모험을 떠나요. 지혜로운 제갈공명의 멋진 전략과 조조, 손권 등 다양한
    인물들의 흥미진진한 대결을 만날 수 있답니다. 설민석 선생님이 알려주는 역사 이야기가 함께 담겨 있어 더욱 쉽게 이해하고 즐길 수 있을 거예요.
    주인공들과 함께 용기와 지혜를 배우며 짜릿한 모험 속으로 떠나보세요!
'9791191496604':
  title: 설민석의 한국사 대모험
  summary: 주인공 온달과 평강 공주가 역사 속으로 시간 여행을 떠나 한국 곳곳의 중요한 시대로 모험을 떠나는 이야기예요. 매 권마다 각 시대의
    위인들이나 중요한 사건들을 직접 만나며 한국사를 배울 수 있답니다. 마치 친구와 함께 역사 속을 탐험하는 듯한 흥미진진한 모험이 가득해요.
    어려운 역사 이야기를 쉽고 재미있는 만화로 풀어내어 지루할 틈이 없어요. 이 책을 읽다 보면 저절로 우리 역사의 흐름을 이해하고, 역사를 사랑하는
    마음도 쑥쑥 자랄 거예요.
'9791191496628':
  title: "(설민석의) 그리스 로마 신화 대모험"
  summary: 이 책은 설민석 선생님이 어린이들을 위해 재미있게 들려주는 그리스 로마 신화 이야기예요. 올림포스 신들의 탄생부터 용감한 영웅들의
    멋진 모험까지, 신화 속 다양한 이야기들을 만날 수 있어요. 흥미진진한 신들의 세계를 탐험하며 그들의 지혜와 용기를 배우고, 상상력을 키울
    수 있답니다. 마치 게임처럼 신나는 모험을 떠나면서 자연스럽게 그리스 로마 신화를 알아갈 수 있는 책이에요.
'9791191496635':
  title: 설민석의 삼국지 대모험
  summary: 이 책은 옛날 중국 삼국 시대의 멋진 영웅 이야기를 쉽고 재미있는 만화로 들려줘요. 유비, 관우, 장비 삼형제처럼 용감한 장수들과
    지혜로운 전략가들이 나라를 세우고 지키기 위해 펼치는 흥미진진한 모험을 담고 있답니다. 조조, 손권 등 여러 인물들의 활약과 전쟁 이야기를
    따라가다 보면, 어려운 역사도 그림처럼 머리에 쏙쏙 들어올 거예요. 설민석 선생님이 아이들 눈높이에 맞춰 쉽고 재미있게 설명해 주어서, 삼국지의
    매력에 푹 빠질 수 있을 거예요!
'9791191496642':
  title: 설민석의 한국사 대모험
  summary: 이 책은 시간을 여행하는 온달과 평강 공주가 한국 역사 속으로 모험을 떠나는 이야기예요. 온달과 평강은 과거로 돌아가 다양한 역사
    속 인물들을 만나고, 중요한 사건들을 직접 경험하며 배운답니다. 각 권마다 다른 시대와 주제를 다루고 있어서, 마치 내가 그 시대에 있는 것처럼
    생생하게 역사를 체험할 수 있어요. 어렵게만 느껴졌던 한국사를 쉽고 재미있는 만화로 배울 수 있도록 도와주는 신나는 역사 탐험 책이랍니다.
    온달과 평강의 흥미진진한 모험을 따라가다 보면 어느새 역사 박사가 될 수 있을 거예요!
'9791191496659':
  title: 설민석의 삼국지 대모험
  summary: 이 책은 중국의 아주 먼 옛날, 위, 촉, 오 세 나라가 서로 최고가 되려고 싸웠던 재미있는 이야기를 담고 있어요. 설민석 선생님이
    어려운 삼국지 이야기를 어린이 눈높이에 맞춰 쉽고 신나는 만화로 꾸며 주었답니다. 유비, 관우, 장비 같은 용감한 영웅들이 어떻게 나라를 지키고
    새로운 세상을 만들려고 노력했는지 알 수 있을 거예요. 지혜로운 책략과 멋진 싸움을 통해 친구들과 함께 우정을 나누고 어려움을 이겨내는 법도
    배울 수 있습니다. 마치 게임을 하듯이 흥미진진한 모험을 따라가다 보면 어느새 삼국지의 매력에 푹 빠지게 될 거예요.
'9791191496666':
  title: 설민석의 삼국지 대모험
  summary: 이 책은 설민석 선생님이 어린이 친구들을 위해 삼국지 이야기를 쉽고 재미있는 만화로 풀어낸 시리즈예요. 용감한 유비, 관우, 장비
    삼형제와 지혜로운 제갈량 등 수많은 영웅들이 천하를 놓고 벌이는 흥미진진한 모험을 담고 있답니다. 중국 후한 시대, 위·촉·오 세 나라가 서로
    싸우며 벌어지는 멋진 전략과 감동적인 우정을 만날 수 있어요. 책을 읽다 보면 친구들은 역사 지식뿐만 아니라 지혜와 용기, 의리 같은 소중한
    가치들을 자연스럽게 배울 수 있을 거예요. 어린이의 눈높이에 맞춰 복잡한 삼국지 이야기를 생생한 그림과 함께 즐겁게 탐험할 수 있습니다.
'9791191496673':
  title: 설민석의 삼국지 대모험
  summary: 이 책은 유명한 역사 선생님 설민석이 초등학생 눈높이에 맞춰 들려주는 삼국지 이야기예요. 중국의 위, 촉, 오 세 나라가 가장
    강한 나라가 되기 위해 치열하게 싸우는 모험을 다룬답니다. 유비, 관우, 장비처럼 용감한 장수들과 지혜로운 제갈공명의 이야기가 만화로 흥미진진하게
    펼쳐져요. 친구들과 함께 영웅들이 겪는 다양한 사건들을 따라가면서 용기와 지혜를 배울 수 있을 거예요.
'9791191496680':
  title: 설민석의 삼국지 대모험
  summary: 이 책은 아주 먼 옛날 중국의 삼국 시대를 배경으로, 영웅들이 펼치는 모험 이야기를 담고 있어요. 설민석 선생님이 어린이 친구들이
    재미있게 이해할 수 있도록 삼국지를 쉽게 풀어서 만화로 만들었답니다. 유비, 관우, 장비 같은 용감한 장수들과 지혜로운 제갈량 같은 인물들이
    등장해서 나라를 통일하기 위해 여러 전투를 벌여요. 친구들과의 우정, 용기, 그리고 지혜를 배우면서 역사 속으로 신나는 여행을 떠날 수 있을
    거예요!
'9791191496697':
  title: 설민석의 삼국지 대모험
  summary: "「설민석의 삼국지 대모험」은 유명한 설민석 선생님이 어린이 눈높이에 맞춰 들려주는 신나는 삼국지 만화책이에요. 이 책은 옛날
    중국에서 위, 촉, 오 세 나라가 서로 힘을 겨루던 영웅들의 모험 이야기를 담고 있어요. 유비, 관우, 장비처럼 멋진 친구들이 등장해서 세상을
    구하기 위해 용감하게 싸우고 지혜로운 전략을 펼치는 모습들을 볼 수 있답니다. 어려운 역사 내용을 재미있는 만화와 설민석 선생님의 쉬운 설명으로
    알 수 있어서, 역사를 처음 접하는 친구들도 즐겁게 읽을 수 있어요. 이 책을 통해 용감한 영웅들의 우정과 도전을 배우며 역사 상식과 지혜를
    함께 키울 수 있을 거예요."
'9791191496703':
  title: 설민석의 세계사 대모험
  summary: 설쌤과 친구들이 신비한 시간 여행을 떠나 세계 곳곳의 역사 현장을 직접 체험하는 이야기예요. 이 책은 고대 문명부터 근현대사까지,
    다양한 시대와 나라의 흥미로운 역사 이야기를 생생하게 전달해 줍니다. 주인공들이 어려운 상황을 헤쳐나가며 문제를 해결하는 과정을 통해 역사
    속 인물들의 지혜와 용기를 배울 수 있어요. 딱딱하게 외우는 역사가 아니라, 마치 신나는 모험을 떠나듯 재미있게 세계사를 배울 수 있도록 도와주는
    책이랍니다. 역사가 어렵다고 느꼈던 친구들도 이 책을 읽으면 세계사가 얼마나 재미있고 멋진지 알게 될 거예요!
'9791191496727':
  title: 설민석의 삼국지 대모험
  summary: 이 책은 아주 먼 옛날 중국의 재미있는 역사 이야기, '삼국지'를 만화로 쉽게 풀어낸 책이에요. 역사 선생님 설민석 아저씨가 아이들이
    삼국지를 즐겁게 배우도록 만들었답니다. 용감한 유비, 관우, 장비 등 여러 영웅들이 힘을 합쳐 나라를 지키고 세상을 통일하려는 멋진 모험을
    떠나요. 신나는 전투와 똑똑한 전략들을 통해 충성심, 우정, 지혜 같은 소중한 가치도 함께 배울 수 있을 거예요.
'9791191496888':
  title: 설민석의 세계사 대모험
  summary: 이 책은 온달, 평강, 그리고 귀여운 로빈이 설쌤과 함께 신나는 시간 여행을 떠나는 이야기예요. 친구들은 세계 곳곳의 중요한 역사적
    순간들을 직접 경험하게 됩니다. 고대 이집트 피라미드부터 로마 제국, 프랑스 혁명까지, 흥미진진한 모험을 통해 각 시대의 역사와 문화를 배우게
    되죠. 유명한 역사 인물들을 만나 그들의 이야기를 듣고, 때로는 어려운 사건들을 해결하며 역사 지식을 쌓아 나갑니다. 재미있는 그림과 이야기로
    세계사를 쉽고 즐겁게 배울 수 있는 책이랍니다.
'9791191496949':
  title: "(설민석의) 그리스 로마 신화 대모험"
  summary: 이 책은 신들의 왕 제우스와 헤라, 지혜의 여신 아테나 등 그리스 로마 신들의 흥미진진한 이야기를 담고 있어요. 신들이 힘을 합쳐
    거인족 티탄들을 물리치고, 영웅들이 무서운 괴물들과 싸우는 용감한 모험들을 만날 수 있답니다. 설민석 선생님이 어린이들이 쉽고 재미있게 신화를
    이해할 수 있도록 알기 쉽게 설명해 주어요. 신화 속에서 지혜와 용기, 사랑과 우정 같은 소중한 가치들을 배울 수 있을 거예요. 멋진 그림들과
    함께 신화 속 세상으로 떠나는 신나는 대모험을 떠나볼까요?
'9791191583052':
  title: 천하무적 개냥이 수사대
  summary: 이 책은 용감한 개 '개박사'와 똑똑한 고양이 '냥집사'가 힘을 합쳐 사건을 해결하는 이야기예요. 둘은 엉뚱하면서도 재미있는 일들을
    겪으며 마을에서 일어나는 여러 가지 미스터리를 풀어나가지요. 서로 티격태격하면서도 결정적인 순간에는 최고의 팀워크를 보여준답니다. 어린이 친구들은
    이 책을 읽으며 흥미진진한 탐정 놀이를 하고, 친구와 함께 문제를 해결하는 즐거움을 배울 수 있어요.
'9791191766318':
  title: 놓지 마 과학!
  summary: 이 책은 엉뚱하고 재미있는 놓지 마 정신줄 가족들과 함께 일상생활 속 과학 원리를 배우는 만화예요. 주인공인 '정신이'와 그의
    가족들이 겪는 황당한 사건들을 통해 중력, 열, 소리, 빛 같은 다양한 과학 개념을 쉽게 설명해 줘요. 복잡하고 어려운 과학 지식도 만화를
    읽다 보면 저절로 머리에 쏙쏙 들어와서 재미있게 공부할 수 있답니다. 웃고 즐기면서 과학 상식을 늘릴 수 있는 유익한 책이에요.
'9791191824001':
  title: 지구 끝의 온실 :김초엽 장편소설
  summary: 온 세상이 독성 먼지로 뒤덮여 사람들이 돔 안에 살던 미래 시대 이야기예요. 주인공 아영은 식물이 자라는 신비한 온실에서 할머니와
    함께 살았어요. 아영은 자신이 어떻게 그곳에 오게 되었는지 궁금해하며 지구를 다시 푸르게 만들려고 해요. 친구들과 함께 온실의 비밀을 파헤치고,
    황폐해진 세상에 숨겨진 희망을 찾아 모험을 떠난답니다. 이 책은 자연의 소중함과 서로 돕는 마음, 그리고 새로운 세상을 꿈꾸는 용기를 알려주는
    멋진 이야기예요.
'9791191891287':
  title: 메리골드 마음 세탁소 =윤정은 장편소설 /Marigold mind laundry
  summary: 메리골드 마음 세탁소는 아주 특별한 세탁소예요. 이곳에서는 옷을 빠는 대신, 사람들의 아프고 지친 마음을 깨끗하게 씻어준답니다.
    슬프거나 힘들었던 기억과 감정을 가져오면, 세탁소 주인은 따뜻하게 마음을 다독여줘요. 사람들은 이곳에서 마음의 짐을 덜어내고, 자기 자신을
    보듬으며 위로를 받아요. 이 책은 우리가 마음을 어떻게 돌보고 치유할 수 있는지 알려주는 따뜻하고 감동적인 이야기예요.
'9791192403076':
  title: 여기는 커스터드, 특별한 도시락을 팝니다
  summary: 여기는 '커스터드'라는 아주 특별한 도시락 가게예요. 이 가게의 주인인 커스터드 씨는 손님들의 이야기에 귀 기울여서 평범하지 않은
    도시락을 만들어 준답니다. 어떤 도시락은 자신감이 없는 친구에게 용기를 주고, 또 어떤 도시락은 서로 싸운 친구들을 화해하게 도와주죠. 도시락
