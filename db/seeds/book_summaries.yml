'9788950981617':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 장난꾸러기 손오공이 신비한 한자의 세계로 빨려 들어가면서 벌어지는 모험을 그린 이야기예요. 그 세계에서는 한자를 큰 소리로 외치면
    진짜 힘이 생겨나요. 손오공은 친구들과 함께 여러 요괴와 위기를 만나며 한자를 하나씩 배우고 활용하게 됩니다. 위험한 순간마다 딱 맞는 한자의
    힘을 떠올려야 살아남을 수 있어요. 모험을 따라가다 보면 어느새 한자 실력도 쑥쑥 늘어난답니다.
'9791162337493':
  title: 윔피 키드
  summary: 소심하고 평범한 중학생 그레그 헤플리가 학교와 집에서 겪는 좌충우돌 일상을 일기 형식으로 담은 이야기예요. 그레그는 인기도 많고
    편하게 살고 싶어 하지만 뜻대로 되는 일이 별로 없어요. 친구 라울리와 티격태격하기도 하고, 형과 동생 사이에서 골치 아픈 일도 자주 생기죠.
    그림과 짧은 글이 어우러져 그레그의 속마음과 실수담이 재미있게 펼쳐집니다. 읽다 보면 저절로 웃음이 나는 유쾌한 성장 일기예요.
'9788983927712':
  title: 해리포터 :불의 잔
  summary: 호그와트 4학년이 된 해리는 세 마법학교가 겨루는 트리위저드 대회에 나이 제한에도 불구하고 갑작스럽게 참가자로 뽑히게 돼요. 용을
    피하는 과제, 호수 속 인어를 구하는 과제, 미로를 통과하는 과제까지 위험한 시험을 차례로 치러 나갑니다. 그 뒤에는 누군가 해리를 노리는
    무서운 음모가 숨어 있었어요. 대회의 마지막 순간, 해리는 죽음을 먹는 자들의 우두머리인 볼드모트가 마침내 부활하는 것을 목격하게 됩니다.
    우정과 용기로 위기를 헤쳐 나가는 해리의 모습이 감동을 줍니다.
'9791187777052':
  title: 전사들 :새로운 예언
  summary: 숲속에서 전사의 규율을 지키며 살아가는 네 부족 고양이들의 이야기예요. 사람들이 숲을 파괴하기 시작하면서 고양이들은 살던 터전을
    잃을 위기에 처합니다. 젊은 전사 고양이들은 새로운 보금자리를 찾기 위해 위험한 여정을 떠나야 해요. 낯선 길 위에서 여러 위기와 시련을 만나며
    서로 다른 부족 고양이들이 힘을 합치게 됩니다. 야생 고양이들의 우정과 모험이 펼쳐지는 판타지 시리즈예요.
'9788983927897':
  title: 해리포터 :불사조 기사단
  summary: 볼드모트가 돌아왔다는 사실을 마법 정부가 믿지 않으면서 해리는 거짓말쟁이로 몰려 힘든 5학년을 보내게 돼요. 엄격한 새 선생님
    엄브리지가 호그와트를 장악하며 제대로 된 방어 마법조차 가르치지 않으려 하죠. 답답해진 해리는 친구들과 함께 '덤블도어의 군대'라는 비밀 모임을
    만들어 스스로 방어 마법을 익혀 나갑니다. 마법 정부와 볼드모트 세력 사이에서 커다란 전투가 벌어지고, 해리는 소중한 사람을 잃는 아픔을 겪게
    돼요. 해리와 볼드모트를 둘러싼 오래된 예언의 비밀도 밝혀집니다.
'9788947527934':
  title: 바보 빅터 :17년 동안 바보로 살았던 멘사 회장의 이야기
  summary: 어릴 때 IQ 검사에서 실수로 낮은 점수가 나오는 바람에 바보 취급을 받으며 자란 빅터의 실화를 담은 이야기예요. 선생님과 친구들이
    놀리는 말을 들으며 빅터도 스스로를 바보라고 믿게 되었어요. 그렇게 수십 년이 흐른 뒤에야 빅터는 자신의 진짜 IQ가 매우 높다는 사실을 알게
    됩니다. 남이 아닌 나 스스로 나를 어떻게 믿느냐가 인생을 바꾼다는 큰 깨달음을 전해줘요. 자신감을 잃은 사람들에게 큰 용기를 주는 감동적인
    이야기입니다.
'9788949124674':
  title: 건방이의 속담 수련기 :초절정 속담 고수 되기
  summary: 평범한 아이였던 건방이가 신비한 스승을 만나면서 속담의 힘을 배우는 수련을 시작하는 이야기예요. 속담 하나하나에 담긴 지혜를 몸으로
    부딪치며 깨우쳐 나가는 과정이 흥미진진하게 펼쳐집니다. 힘든 훈련을 거칠 때마다 건방이는 조금씩 속담 고수로 성장해 가요. 재미있는 모험 속에서
    자연스럽게 여러 속담의 뜻과 쓰임을 익힐 수 있습니다. 웃음과 교훈을 동시에 주는 수련기예요.
'9791187777014':
  title: 암호클럽
  summary: 암호와 비밀 코드를 좋아하는 아이들이 모여 만든 '암호클럽'이 마을에서 일어난 이상한 사건을 파헤치는 이야기예요. 친구들은 서로
    힘을 모아 편지나 물건 속에 숨겨진 암호를 하나씩 풀어 나갑니다. 암호를 풀 때마다 사건의 실마리가 조금씩 드러나며 진실에 가까워지죠. 다양한
    암호 기법이 등장해서 읽으면서 직접 암호 풀이에 도전해 볼 수도 있어요. 추리와 우정이 함께 어우러진 신나는 이야기입니다.
'9788965463665':
  title: 어린 여우를 위한 무서운 이야기
  summary: 두 마리 아기 여우 미아와 율리가 늙은 이야기꾼 여우에게서 무서운 옛이야기들을 듣는 형식으로 펼쳐지는 책이에요. 이야기 속에는
    사냥꾼을 만나거나 위험한 병에 걸리는 등 여우들이 마주하는 여러 두려운 순간들이 담겨 있습니다. 하나하나의 이야기가 끝날 때마다 다음 이야기로
    이어지며 긴장감이 계속됩니다. 무섭지만 그 안에는 용기와 살아남는 지혜에 대한 교훈도 함께 담겨 있어요. 오싹하면서도 마음이 뭉클해지는 이야기
    모음집입니다.
'9788937839948':
  title: 윔피 키드
  summary: 소심하고 평범한 중학생 그레그 헤플리가 학교와 집에서 겪는 좌충우돌 일상을 일기 형식으로 담은 이야기예요. 그레그는 인기도 많고
