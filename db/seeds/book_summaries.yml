'9788949144030':
  title: 배드 가이즈
  summary: 늑대, 뱀, 상어, 피라냐처럼 무섭게 생긴 동물 친구들이 사실은 착한 일을 해보기로 마음먹는 이야기예요. 사람들이 자신들을 나쁜
    녀석으로만 보는 게 속상했던 이들은 '굿 가이즈'가 되기로 결심합니다. 첫 번째 도전으로 유기견 보호소에 갇힌 개들을 구하러 나서지만 좋은
    뜻과 다르게 일이 자꾸 꼬이고 말아요. 서투르지만 진심 어린 이들의 좌충우돌 선행 도전기가 유쾌하게 펼쳐집니다. 겉모습만으로 판단할 수 없다는
    교훈을 재미있게 전해줘요.
'9791190147781':
  title: "(주석으로 쉽게 읽는) 고정욱 삼국지"
  summary: 중국 후한 말, 어지러운 세상을 바로잡기 위해 유비와 관우, 장비가 도원에서 의형제를 맺으며 이야기가 시작돼요. 이들은 조조,
    손권 등 여러 영웅들과 힘을 겨루며 천하를 놓고 다투게 됩니다. 지혜로운 책사 제갈량이 유비를 도와 여러 위기를 이겨내는 장면도 흥미진진하게
    펼쳐지죠. 의리와 지혜, 용기를 지닌 영웅들의 이야기가 감동과 재미를 함께 줍니다. 중국 고전 삼국지를 어린이도 쉽게 이해할 수 있도록 풀어낸
    이야기예요.
'9788950977917':
  title: 이사도라 문
  summary: 엄마는 요정이고 아빠는 뱀파이어인 특별한 소녀 이사도라 문의 이야기예요. 반은 요정이고 반은 뱀파이어인 이사도라는 두 세계의 특징을
    모두 가지고 있어서 남들과 조금 다르답니다. 처음으로 인간 학교에 다니게 되면서 자신의 마법 같은 능력을 숨겨야 할지 고민하게 돼요. 친구를
    사귀고 학교생활에 적응해 가면서 자신만의 특별함을 자연스럽게 받아들이게 됩니다. 상상력 가득한 그림과 함께 이사도라의 사랑스러운 일상이 펼쳐져요.
'9788983927958':
  title: 해리포터 :혼혈왕자
  summary: 호그와트 6학년이 된 해리는 덤블도어 교수와 함께 볼드모트의 과거 기억을 하나씩 살펴보며 그의 비밀을 파헤치기 시작해요. 그러던
    중 해리는 예전 주인이 남긴 메모로 가득한 '혼혈왕자'의 마법약 교과서를 손에 넣게 됩니다. 그 책 덕분에 마법약 수업에서 실력이 부쩍 늘지만,
    동시에 위험한 비밀도 함께 딸려 옵니다. 한편 드레이코 말포이는 볼드모트로부터 은밀한 임무를 받아 몰래 움직이고 있었어요. 이야기의 끝에서
    해리는 커다란 슬픔을 가져오는 충격적인 사건을 마주하게 됩니다.
'9788934944188':
  title: 사피엔스 :그래픽 히스토리
  summary: 우리 인류인 호모 사피엔스가 어떻게 지구 곳곳으로 퍼져나가 오늘날처럼 세상을 이끄는 존재가 되었는지 설명해 주는 만화예요. 아주
    오래전 여러 인류 중 하나였던 사피엔스가 다른 인류와 어떻게 달랐는지부터 이야기가 시작됩니다. 상상하고 이야기를 만들어내는 능력이 사피엔스를
    특별하게 만들었다는 점을 흥미롭게 풀어내요. 만화 형식이라 어렵게 느껴질 수 있는 인류의 역사를 쉽고 재미있게 따라갈 수 있습니다. 우리가
    어디에서 왔는지 궁금한 친구들에게 좋은 안내서가 되어줄 거예요.
'9788983711892':
  title: 코스모스 :특별판
  summary: 우주가 어떻게 시작되었고 별과 은하는 어떻게 만들어졌는지 차근차근 설명해 주는 과학 교양서예요. 아주 작은 지구가 광활한 우주
    속에서 얼마나 특별한 존재인지 깨닫게 해줍니다. 인류가 별을 관찰하며 우주의 비밀을 하나씩 밝혀온 과학의 역사도 함께 만나볼 수 있어요. 어려운
    우주 이야기를 쉽고 감동적인 문장으로 풀어내 읽는 재미를 더해줍니다. 밤하늘의 별을 보며 우주에 대한 호기심을 키우고 싶은 친구들에게 잘 어울리는
    책이에요.
'9788936455736':
  title: 눈아이 :안녕달 그림책
  summary: 혼자 사는 할머니가 하얀 눈으로 작은 눈사람을 만드는 것으로 이야기가 시작돼요. 그날 밤, 눈사람은 신기하게도 '눈아이'가 되어
    살아 움직입니다. 할머니와 눈아이는 함께 밤하늘 아래에서 특별하고 따뜻한 시간을 보내게 돼요. 하지만 아침이 밝아오면 눈아이는 다시 눈으로
    돌아가야 하는 아쉬운 이별의 순간을 맞이합니다. 짧지만 따뜻한 만남을 통해 외로움과 사랑에 대해 생각하게 해주는 그림책이에요.
'9791158362072':
  title: 라면을 먹으면 숲이 사라져
  summary: 우리가 즐겨 먹는 라면 속에 숨어 있는 놀라운 비밀을 알려주는 책이에요. 라면 재료로 많이 쓰이는 팜유를 얻기 위해 열대 우림을
    마구 베어내고 있다는 사실을 알기 쉽게 설명해 줍니다. 숲이 사라지면서 그곳에 살던 오랑우탄 같은 동물들도 살 곳을 잃어가고 있다는 이야기를
    들려줘요. 아무 생각 없이 먹던 음식이 지구 반대편 자연과 연결되어 있다는 걸 깨닫게 해줍니다. 환경을 생각하는 작은 습관의 중요성을 일깨워
    주는 책이에요.
'9788949187310':
  title: 수학 귀신 :수학을 싫어하는 한 소년이 수학의 원리를 깨우치기까지
  summary: 수학을 싫어하는 소년 로베르트의 꿈속에 매일 밤 신비한 수학 귀신이 나타나면서 이야기가 시작돼요. 수학 귀신은 열두 밤에 걸쳐
    로베르트에게 소수, 무한대 같은 신기한 수학의 세계를 하나씩 보여줍니다. 처음에는 수학이 싫었던 로베르트도 점점 숫자의 재미있는 비밀에 빠져들게
    돼요. 어려운 수학 개념을 꿈속 모험처럼 재미있게 풀어내어 누구나 쉽게 이해할 수 있습니다. 다 읽고 나면 수학을 다시 보게 되는 신비한 이야기예요.
'9788983927903':
  title: 해리포터 :불사조 기사단
  summary: 볼드모트가 돌아왔다는 사실을 마법 정부가 믿지 않으면서 해리는 거짓말쟁이로 몰려 힘든 5학년을 보내게 돼요. 엄격한 새 선생님
    엄브리지가 호그와트를 장악하며 제대로 된 방어 마법조차 가르치지 않으려 하죠. 답답해진 해리는 친구들과 함께 '덤블도어의 군대'라는 비밀 모임을
    만들어 스스로 방어 마법을 익혀 나갑니다. 마법 정부와 볼드모트 세력 사이에서 커다란 전투가 벌어지고, 해리는 소중한 사람을 잃는 아픔을 겪게
    돼요. 해리와 볼드모트를 둘러싼 오래된 예언의 비밀도 밝혀집니다.
'9788983928061':
  title: 해리포터 :죽음의 성물
  summary: 호그와트를 떠난 해리와 론, 헤르미온느는 볼드모트를 완전히 무너뜨리기 위해 그의 남은 호크룩스를 찾아 위험한 여정을 떠나요. 여정
    중에 세 가지 신비한 물건으로 이루어진 전설의 '죽음의 성물' 이야기를 알게 됩니다. 소중한 사람들을 잃는 크나큰 슬픔을 겪으면서도 세 친구는
    포기하지 않고 끝까지 나아가요. 마침내 호그와트에서 볼드모트와 그의 세력에 맞서는 커다란 전투가 벌어집니다. 오랜 싸움 끝에 해리는 마침내
    볼드모트와의 운명적인 대결을 마주하게 돼요.
'9788936443313':
  title: 푸른 사자 와니니 :이현 장편동화
  summary: 아프리카 초원에 사는 아기 사자 와니니는 몸이 작고 약하다는 이유로 무리에서 쫓겨나고 말아요. 홀로 남겨진 와니니는 마디바 할머니와
    아산테, 잘루 삼촌 같은 또 다른 떠돌이 사자들을 만나 새로운 가족을 이루게 됩니다. 함께 사냥하는 법을 배우고 어려움을 이겨내면서 와니니는
    점점 용감하고 지혜로운 사자로 자라나요. 위기의 순간마다 꾀와 용기를 발휘한 와니니는 마침내 무리를 이끄는 당당한 사자로 거듭납니다. 작고
    약했던 와니니가 진짜 자기 힘을 찾아가는 감동적인 성장 이야기예요.
'9788950977924':
  title: 이사도라 문
  summary: 이사도라 문은 뱀파이어 아빠와 요정 엄마 사이에서 태어난 특별한 아이예요. 반은 뱀파이어라서 밤에 날아다닐 수 있고 반은 요정이라서
    마법 지팡이도 가지고 있답니다. 하지만 이사도라는 특별한 능력을 뽐내기보다 다른 친구들처럼 평범한 학교생활을 하고 싶어해요. 그래서 검은 옷
    대신 알록달록한 옷을 입고 씩씩하게 학교에 다니며 크고 작은 사건들을 헤쳐 나가지요. 자신만의 특별함을 있는 그대로 사랑하게 되는 유쾌한 이야기예요.
'9788983927910':
  title: 해리포터 :불사조 기사단
  summary: 마법사 해리 포터는 볼드모트가 부활했다고 진실을 말하지만 마법 정부는 이를 믿지 않고 해리를 거짓말쟁이로 몰아붙여요. 새 학기
    호그와트에는 마법 정부에서 보낸 엄격한 엄브리지 선생님이 부임해 학생들의 자유를 억누르기 시작합니다. 해리와 친구들은 몰래 '덤블도어의 군대'를
    만들어 스스로 방어 마법을 연습하며 힘을 키워 나가요. 한편 볼드모트는 예언의 비밀을 손에 넣으려 하고, 해리는 소중한 사람을 지키기 위해
    맞서게 됩니다. 우정과 용기로 어둠에 맞서는 해리의 다섯 번째 모험이에요.
'9788971849736':
  title: 오월의 달리기
  summary: 달리기를 좋아하는 소년 명수는 광주에서 육상 선수로 활약할 날을 꿈꾸며 열심히 훈련해요. 그러던 1980년 5월, 평화롭던 광주
    시내가 갑자기 군인들과 시민들의 충돌로 뒤덮이며 큰 혼란에 빠지게 됩니다. 명수는 거리에서 벌어지는 무섭고 낯선 상황을 마주하며 어른들의 세계를
    조금씩 알아가게 되지요. 가족과 이웃들이 서로를 걱정하고 지키려 애쓰는 모습을 보며 명수도 용기를 내어 자기 몫을 하려 합니다. 우리 역사의
    아픈 순간을 한 소년의 눈으로 담담하게 그려낸 이야기예요.
'9788983927927':
  title: 해리포터 :불사조 기사단
  summary: 마법사 해리 포터는 볼드모트가 부활했다고 진실을 말하지만 마법 정부는 이를 믿지 않고 해리를 거짓말쟁이로 몰아붙여요. 새 학기
    호그와트에는 마법 정부에서 보낸 엄격한 엄브리지 선생님이 부임해 학생들의 자유를 억누르기 시작합니다. 해리와 친구들은 몰래 '덤블도어의 군대'를
    만들어 스스로 방어 마법을 연습하며 힘을 키워 나가요. 한편 볼드모트는 예언의 비밀을 손에 넣으려 하고, 해리는 소중한 사람을 지키기 위해
    맞서게 됩니다. 우정과 용기로 어둠에 맞서는 해리의 다섯 번째 모험이에요.
'9788983927965':
  title: 해리포터 :혼혈왕자
  summary: 호그와트로 돌아온 해리는 덤블도어 교수님과 함께 볼드모트의 과거를 알아내는 특별 수업을 받기 시작해요. 둘은 볼드모트가 영혼을
    여러 조각으로 나누어 숨겨 놓은 '호크룩스'의 비밀을 하나씩 파헤쳐 나갑니다. 그 사이 해리는 우연히 얻은 낡은 마법약 교과서 주인 '혼혈왕자'의
    정체를 궁금해하며 학교생활을 이어가고요. 스네이프 교수와 말포이를 둘러싼 수상한 움직임도 점점 커져만 갑니다. 볼드모트를 무너뜨릴 실마리를
    찾아가는 동안 해리는 예상치 못한 충격적인 사건과 마주하게 돼요.
'9788993055207':
  title: 윔피 키드
  summary: 평범한 중학생 그레그 헤플리는 학교에서 인기도 없고 늘 사건 사고에 휘말리는 소심한 소년이에요. 그레그는 엄마의 권유로 일기를
    쓰기 시작하는데, 그 안에 학교와 가족, 친구 롤리와 있었던 웃기고 창피한 일들을 솔직하게 그림과 함께 담아냅니다. 형과 동생 사이에서 치이고,
    인기 많은 친구가 되고 싶어 이런저런 계획을 세우지만 매번 엉뚱하게 꼬이고 말아요. 그래도 그레그는 특유의 유머로 실수와 창피함을 넘기며 하루하루를
    씩씩하게 살아갑니다. 누구나 겪을 법한 성장통을 재치 있는 그림일기로 풀어낸 이야기예요.
'9788933870792':
  title: "(설민석의) 삼국지 :누구나 쉽게 시작하고 모두가 빠져드는 이야기"
  summary: 중국 후한 말, 나라가 어지러워지자 유비와 관우, 장비는 복숭아나무 아래에서 의형제를 맺고 함께 세상을 구하기로 다짐해요. 이들은
    조조, 손권과 함께 위·촉·오 세 나라로 천하가 나뉘는 치열한 다툼 속에 뛰어들게 됩니다. 지혜로운 책사 제갈량은 유비를 도와 여러 어려운
    싸움에서 놀라운 꾀를 발휘하지요. 적벽대전을 비롯한 크고 작은 전투를 거치며 영웅들은 저마다의 신념을 걸고 맞서 싸웁니다. 의리와 지혜, 용기가
    어우러진 중국 최고의 영웅 이야기를 쉽게 풀어낸 책이에요.
'9788936456085':
  title: 완득이 :김려령 장편소설
  summary: 도완득은 몸이 불편한 아버지와 삼촌과 함께 살아가는 고등학생으로, 밤이면 몰래 킥복싱을 배우며 답답한 마음을 풀어요. 옆집에 사는
    담임 선생님 동주는 완득이를 시도 때도 없이 불러내고 잔소리를 해대서 완득이는 그런 선생님이 못마땅하기만 합니다. 그러던 어느 날 완득이는
    어릴 적 집을 떠난 엄마가 필리핀 사람이라는 사실과 함께 살아있다는 소식을 알게 되지요. 처음엔 낯설고 혼란스럽지만 완득이는 조금씩 엄마를
    받아들이고 자신의 진짜 모습을 찾아갑니다. 투닥거리던 동주 선생님도 사실은 완득이를 진심으로 아끼고 있었다는 걸 깨닫게 되는 따뜻한 이야기예요.
'9788983945068':
  title: 트루먼 스쿨 악플 사건
  summary: 트루먼 중학교 학생들은 학교 과제로 인터넷 신문 '트루먼 게시판'을 만들게 돼요. 그런데 누군가 이 게시판에 친구들을 험담하고
    놀리는 악성 댓글을 익명으로 올리기 시작하면서 문제가 커집니다. 특히 한 친구가 근거 없는 소문과 악플의 표적이 되어 큰 상처를 받게 되지요.
    주인공과 친구들은 누가 악플을 다는지, 왜 이런 일이 벌어졌는지 진실을 밝히기 위해 나서게 됩니다. 사이버 폭력이 얼마나 아픈 상처를 남기는지,
    그리고 진심 어린 사과와 이해가 왜 중요한지를 생각하게 하는 이야기예요.
'9788983928047':
  title: 해리포터 :죽음의 성물
  summary: 호그와트로 돌아가지 않기로 한 해리와 론, 헤르미온느는 볼드모트를 완전히 무찌르기 위해 남은 호크룩스를 찾아 위험한 여정을 떠나요.
    셋은 서로를 의지하며 마법 정부마저 장악한 볼드모트의 추격을 피해 곳곳을 옮겨 다니며 실마리를 찾습니다. 그 과정에서 죽음을 다스린다는 전설의
    세 가지 물건, '죽음의 성물' 이야기를 알게 되지요. 마침내 해리는 자신에게 숨겨진 운명의 비밀을 깨닫고 마지막 결전을 준비하게 됩니다.
    오랜 우정과 용기로 완성되는 해리 포터 시리즈의 감동적인 마지막 이야기예요.
'9791168123915':
  title: 도그맨
  summary: 사건 현장에서 크게 다친 경찰견과 경찰관을 살리기 위해 의사들은 개의 머리와 사람의 몸을 합치는 수술을 하게 돼요. 그렇게 태어난
    도그맨은 개의 뛰어난 후각과 충성심, 사람의 지능을 함께 가진 특별한 경찰관이 됩니다. 도그맨은 껌을 씹는 습관이나 물건을 물어뜯는 실수 같은
    개다운 모습 때문에 종종 사고를 치기도 해요. 하지만 나쁜 고양이 악당 피티가 못된 계획을 꾸밀 때마다 도그맨은 특유의 코와 용기로 사건을
    해결하지요. 웃음과 감동이 함께 담긴 유쾌한 그래픽노블 시리즈예요.
'9791130677705':
  title: Who? 오타니 쇼헤이 =Ohtani Shohei
  summary: 일본 이와테현의 작은 마을에서 태어난 오타니 쇼헤이는 어릴 때부터 야구를 좋아하며 큰 꿈을 키웠어요. 그는 투수와 타자를 모두
    잘하는 보기 드문 재능으로 일본 프로야구에서부터 주목을 받기 시작합니다. 이후 미국 메이저리그에 진출한 오타니는 공을 던지는 투수이자 방망이를
    휘두르는 타자로 동시에 뛰며 사람들을 놀라게 하지요. 부상과 어려움을 이겨내며 꾸준히 훈련한 끝에 그는 메이저리그 최우수선수로 여러 차례 선정되는
    영광을 안았어요. 포기하지 않는 노력으로 자신만의 길을 개척한 오타니 쇼헤이의 성장 이야기예요.
'9788936456023':
  title: 구덩이:루이스 쌔커 장편소설
  summary: 스탠리 옐네츠는 억울하게 도둑 누명을 쓰고 캠프 그린 레이크라는 소년원 같은 캠프로 보내져요. 그곳 아이들은 매일 뙤약볕 아래에서
    커다란 구덩이를 파야 하는데, 사실 이는 사막이 된 호숫가에 숨겨진 무언가를 찾기 위한 소장의 비밀스러운 계획이었지요. 스탠리는 캠프에서 사귄
    친구 제로와 함께 힘든 나날을 견디며 우정을 쌓아 갑니다. 그러던 중 스탠리는 자기 집안에 내려오는 오래된 저주와 이 캠프의 숨겨진 과거가
    서로 연결되어 있다는 사실을 알게 돼요. 우연과 운명이 절묘하게 맞아떨어지며 통쾌하게 풀려나가는 이야기예요.
'9788983927972':
  title: 해리포터 :혼혈왕자
  summary: 호그와트로 돌아온 해리는 덤블도어 교수님과 함께 볼드모트의 과거를 알아내는 특별 수업을 받기 시작해요. 둘은 볼드모트가 영혼을
    여러 조각으로 나누어 숨겨 놓은 '호크룩스'의 비밀을 하나씩 파헤쳐 나갑니다. 그 사이 해리는 우연히 얻은 낡은 마법약 교과서 주인 '혼혈왕자'의
    정체를 궁금해하며 학교생활을 이어가고요. 스네이프 교수와 말포이를 둘러싼 수상한 움직임도 점점 커져만 갑니다. 볼드모트를 무너뜨릴 실마리를
    찾아가는 동안 해리는 예상치 못한 충격적인 사건과 마주하게 돼요.
'9791168126411':
  title: 도그맨
  summary: 사건 현장에서 크게 다친 경찰견과 경찰관을 살리기 위해 의사들은 개의 머리와 사람의 몸을 합치는 수술을 하게 돼요. 그렇게 태어난
    도그맨은 개의 뛰어난 후각과 충성심, 사람의 지능을 함께 가진 특별한 경찰관이 됩니다. 도그맨은 껌을 씹는 습관이나 물건을 물어뜯는 실수 같은
    개다운 모습 때문에 종종 사고를 치기도 해요. 하지만 나쁜 고양이 악당 피티가 못된 계획을 꾸밀 때마다 도그맨은 특유의 코와 용기로 사건을
    해결하지요. 웃음과 감동이 함께 담긴 유쾌한 그래픽노블 시리즈예요.
'9791130681078':
  title: 복면공주
  summary: 마그놀리아 공주는 겉으로는 예의 바르고 얌전한 공주지만, 사실은 몰래 검은 옷을 입고 괴물을 물리치는 비밀 영웅 '복면공주'예요.
    괴물이 나타났다는 종이 울리면 공주는 순식간에 옷을 갈아입고 달려나가 괴물들을 무찌른 뒤 다시 얌전한 공주로 돌아오지요. 그러던 어느 날 예의범절을
    중요하게 여기는 깐깐한 손님이 성에 놀러 오면서 비밀을 들킬 위기에 처하게 됩니다. 공주는 자신의 정체를 숨기면서도 괴물과 손님을 모두 챙겨야
    하는 좌충우돌 하루를 보내요. 씩씩하고 용감한 공주의 이중생활이 유쾌하게 펼쳐지는 이야기예요.
'9788952773104':
  title: 13층 나무 집
  summary: 앤디와 테리는 무려 13층짜리 신기한 나무 집에서 함께 살고 있어요. 이 나무 집에는 볼링장, 상어 연못, 비밀 지하 실험실 같은
    기상천외한 공간들이 층마다 가득하답니다. 두 사람은 출판사에 새 책을 써서 보내야 하는데, 나무 집에서 벌어지는 온갖 소동 때문에 글쓰기가
    자꾸만 늦어지고 말아요. 이런저런 엉뚱한 사건에 휘말리면서도 앤디와 테리는 재치와 웃음으로 위기를 헤쳐 나갑니다. 상상력이 폭발하는 나무 집에서
    벌어지는 유쾌하고 기발한 이야기예요.
'9788983927989':
  title: 해리포터 :혼혈왕자
  summary: 호그와트로 돌아온 해리는 덤블도어 교수님과 함께 볼드모트의 과거를 알아내는 특별 수업을 받기 시작해요. 둘은 볼드모트가 영혼을
    여러 조각으로 나누어 숨겨 놓은 '호크룩스'의 비밀을 하나씩 파헤쳐 나갑니다. 그 사이 해리는 우연히 얻은 낡은 마법약 교과서 주인 '혼혈왕자'의
    정체를 궁금해하며 학교생활을 이어가고요. 스네이프 교수와 말포이를 둘러싼 수상한 움직임도 점점 커져만 갑니다. 볼드모트를 무너뜨릴 실마리를
    찾아가는 동안 해리는 예상치 못한 충격적인 사건과 마주하게 돼요.
'9788949135113':
  title: 기억 전달자 :아이너스 상 수상 작가가 그래픽노블로 재탄생시킨 로이스 로리의 SF 명작
  summary: 조나스가 사는 마을은 고통도 다툼도 없이 모두가 평화롭게 사는 것처럼 보이는 완벽한 공동체예요. 열두 살이 된 조나스는 마을의
    중요한 임무를 받는 '기억 보유자' 자리를 물려받게 됩니다. 그는 늙은 '기억 전달자'로부터 마을이 감춰 온 색깔과 감정, 그리고 아픈 기억들을
    하나씩 전해 받기 시작하지요. 진짜 기억을 알게 될수록 조나스는 마을이 숨기고 있는 무서운 비밀을 깨닫고 큰 혼란에 빠집니다. 진실을 알게
    된 조나스가 마을을 위해 중요한 선택을 내리는 뭉클한 이야기예요.
'9788954681179':
  title: 밝은 밤 :최은영 장편소설
  summary: 이혼 후 낯선 도시로 이사 온 지연이가 오랫동안 소식이 끊겼던 외할머니를 만나면서 이야기가 시작돼요. 지연이는 할머니, 그리고
    그 위의 엄마들까지 이어지는 여러 대의 여성들의 삶을 하나씩 알아가요. 각자 힘든 시절을 견디며 서로에게 상처도 주고받았지만, 결국은 사랑으로
    이어져 있었다는 걸 깨닫게 돼요. 가족이라는 이름 아래 감춰진 아픔과 화해를 따뜻하게 그린 소설이에요.
'9788936443382':
  title: 불량한 자전거 여행 :김남중 장편동화
  summary: 부모님이 자꾸 다투는 게 힘들었던 산호는 가출하듯 집을 나와 자전거로 전국을 도는 여행 모임에 들어가요. 처음에는 자전거도 잘
    못 타고 힘들어하지만, 여러 친구, 형들과 함께 페달을 밟으며 점점 씩씩해져요. 산 넘고 강 건너며 온갖 사건을 겪는 동안 산호는 몸도 마음도
    훌쩍 자라나요. 진짜 어른이 되어 가는 길을 자전거 여행에 빗대어 보여 주는 성장 동화예요.
'9791193821732':
  title: 나 혼자만 레벨업
  summary: 세상에 갑자기 나타난 던전과 몬스터 때문에 사람들은 헌터가 되어 싸우는데, 주인공 성진우는 그중에서도 가장 약한 최하급 헌터예요.
    어느 날 아주 위험한 던전에서 죽을 뻔한 순간, 성진우에게만 보이는 신비한 시스템이 나타나요. 그 뒤로 성진우는 계속 임무를 깨고 레벨을 올리며
    점점 더 강해져요. 약했던 주인공이 나만의 힘으로 최강이 되어 가는 통쾌한 이야기예요.
'9791168125636':
  title: 도그맨
  summary: 사고로 머리는 개, 몸은 사람이 되어 버린 경찰관 도그맨의 이야기예요. 냄새도 잘 맡고 사람처럼 말도 잘 듣는 도그맨은 나쁜 짓을
    하는 고양이 표도르 같은 악당들과 맞서 싸워요. 실수도 많이 하고 엉뚱한 짓도 하지만, 결국은 마을을 지키는 진짜 영웅이 돼요. 웃긴 그림과
    짧은 만화로 되어 있어서 낄낄대며 술술 읽을 수 있는 책이에요.
'9788983928054':
  title: 해리포터 :죽음의 성물
  summary: 해리포터 시리즈의 마지막 편으로, 해리와 론, 헤르미온느는 학교로 돌아가지 않고 볼드모트를 없앨 방법을 찾아 위험한 여행을 떠나요.
    세 사람은 마지막 호크룩스들을 찾아 파괴하면서, 죽음을 다스린다는 전설의 물건 죽음의 성물의 비밀도 알게 돼요. 결국 호그와트에서 마법사와
    어둠의 세력이 맞붙는 큰 전투가 벌어져요. 우정과 용기로 끝까지 맞서 싸우는 해리의 마지막 모험을 담은 감동적인 결말이에요.
'9788949144047':
  title: 배드 가이즈
  summary: 늑대, 뱀, 상어, 피라냐처럼 다들 무서워하는 동물들이 모여 나쁜 녀석들 갱단을 만들어요. 겉모습 때문에 늘 나쁜 놈 취급을 받던
    이들은 이미지를 바꾸려고 착한 일을 해 보기로 결심해요. 그런데 막상 착한 일을 하려니 자꾸 사고가 나고 엉뚱한 소동이 벌어져요. 무섭게 생겼어도
    마음은 따뜻할 수 있다는 걸 유쾌하게 보여 주는 이야기예요.
'9788952781505':
  title: 26층 나무 집
  summary: 앤디와 테리는 세상에서 가장 신기한 나무 집에서 함께 살아요. 나무 집에는 층마다 볼링장, 거대 새총, 상어 수족관 같은 엉뚱하고
    재미있는 공간들이 가득해요. 이번에는 나무 집이 더 높아지면서 두 친구는 새로운 사건과 소동에 휘말리게 돼요. 말도 안 되는 상상력과 웃음이
    가득한 시리즈예요.
'9791160575330':
  title: 엽기 과학자 프래니
  summary: 프래니는 학교에서 좀 별난 아이로 통하는 꼬마 과학자예요. 프래니는 이상한 발명품을 만들고 괴물 같은 실험도 서슴지 않아요. 친구들과
    어울리고 싶어서 평범해지려고 애써 보지만, 결국 자기다운 모습이 최고라는 걸 깨달아요. 괴짜스럽고 유쾌한 그림으로 웃음을 주는 어린이 소설이에요.
'9791187777144':
  title: 전사들 :새로운 예언
  summary: 숲속에는 각자의 규칙과 전사 계율을 지키며 사는 고양이 부족들이 있어요. 이번 이야기에서는 숲에 심각한 위기가 닥치고, 젊은 고양이들이
    예언에 이끌려 새로운 보금자리를 찾아 위험한 여행을 떠나요. 부족마다 성격도 다르고 갈등도 있지만, 힘을 모아 어려움을 헤쳐 나가요. 야생
    고양이들의 우정과 모험을 그린 인기 판타지 시리즈예요.
'9791168124608':
  title: 도그맨
  summary: 머리는 개, 몸은 사람인 경찰관 도그맨이 이번에도 마을에서 벌어지는 사건을 해결하러 나서요. 냄새를 잘 맡는 능력과 사람 같은
    판단력으로 나쁜 짓을 하려는 악당들을 골탕 먹여요. 실수투성이지만 순수하고 용감한 도그맨의 모습이 웃음을 자아내요. 그림이 많고 이야기가 짧아서
    부담 없이 재미있게 읽을 수 있는 만화책이에요.
'9791130698649':
  title: 프런트 데스크
  summary: 중국에서 미국으로 이민 온 소녀 미아는 부모님이 일하는 낡은 모텔 프런트 데스크를 돕게 돼요. 미아네 가족은 돈도 없고 텃세도
    겪지만, 미아는 글쓰기 실력을 발휘해 어려운 손님들의 문제를 해결해 줘요. 못된 모텔 주인의 부당한 대우에 맞서 싸우면서 미아는 점점 용기를
    얻어요. 이민자 가족의 어려움과 희망을 담은 따뜻한 성장 이야기예요.
'9791169256056':
  title: 156층 나무집
  summary: 앤디와 테리가 사는 나무 집이 이번에는 156층까지 늘어났어요. 나무 집 안에는 상상도 못 할 엉뚱한 놀이 공간과 장치들이 층마다
    숨어 있어요. 두 친구는 이번에도 이상한 사건에 휘말리며 좌충우돌 소동을 벌여요. 기발한 상상력과 웃음 가득한 그림으로 사랑받는 시리즈예요.
'9791193549810':
  title: 나 혼자만 레벨업
  summary: 가장 약한 헌터였던 성진우가 신비한 시스템의 힘으로 점점 강해지는 이야기가 계속돼요. 위험한 던전을 하나씩 공략하며 성진우는 남들이
    갖지 못한 특별한 능력을 얻어 가요. 동료와 가족을 지키기 위해 점점 더 강한 몬스터와 맞서 싸워요. 혼자였던 주인공이 최강의 존재로 성장해
    가는 짜릿한 이야기예요.
'9791186940174':
  title: 조선왕조실톡
  summary: 조선 시대 왕과 신하들의 이야기를 마치 요즘 친구들이 메신저로 대화하듯 재미있게 풀어낸 역사 만화예요. 딱딱하게 느껴지던 왕들의
    사건과 뒷이야기가 웃긴 그림과 말투로 쉽게 들어와요. 실제 역사적 사실을 바탕으로 하면서도 유쾌한 상상을 더해 지루하지 않게 조선 역사를 알려
    줘요. 역사를 어려워하는 어린이도 낄낄 웃으며 배울 수 있는 책이에요.
'9791165383664':
  title: 황석영의 어린이 민담집
  summary: 소설가 황석영 작가가 우리나라 곳곳에 전해 내려오는 옛이야기, 즉 민담을 어린이들이 읽기 쉽게 풀어 쓴 책이에요. 도깨비, 호랑이,
    지혜로운 사람들이 나오는 다양한 이야기 속에는 조상들의 재치와 교훈이 담겨 있어요. 술술 읽히는 문장과 정겨운 이야기로 옛날 사람들의 생각과
    마음을 느낄 수 있어요. 우리 전래동화를 새롭게 만나 볼 수 있는 책이에요.
'9791164131594':
  title: "(착해도 너무 착한) 롤리의 일기 :롤리, 드디어 입을 열다!"
  summary: 그렉의 단짝 친구 롤리가 자기만의 시선으로 학교와 일상 이야기를 일기로 들려주는 책이에요. 그렉이 쓴 일기에서는 사고뭉치처럼 보였던
    일들도 순진하고 착한 롤리의 눈으로 보면 다르게 느껴져요. 엉뚱하고 유쾌한 생각과 그림일기로 학교생활의 웃긴 순간들을 보여 줘요. 같은 사건이라도
    누구의 눈으로 보느냐에 따라 다르게 보인다는 걸 재미있게 알려 주는 책이에요.
'9791130698199':
  title: 맡겨진 소녀 :클레어 키건 소설
  summary: 한 소녀가 엄마의 출산을 앞두고 잠시 친척 부부의 집에 맡겨지면서 이야기가 시작돼요. 낯선 집이지만 소녀는 그곳에서 처음으로 따뜻한
    보살핌과 사랑을 느끼게 돼요. 말수는 적지만 다정한 아저씨, 아주머니와 지내며 소녀의 마음도 조금씩 열려요. 짧지만 잔잔하고 뭉클한 여운을
    남기는 이야기예요.
'9788936475642':
  title: 아몬드 :큰글자도서
  summary: 선재는 뇌 속 편도체가 작아서 다른 사람들처럼 감정을 잘 느끼지 못하는 아이예요. 어느 날 사고로 엄마와 할머니를 한꺼번에 잃게
    되면서 선재는 혼자 세상과 마주하게 돼요. 그러다 화를 잘 참지 못하는 아이 곤이를 만나 이상하게도 서로에게 마음을 열게 돼요. 감정을 모르던
    선재가 곤이와의 우정을 통해 진짜 감정을 배워 가는 성장 이야기예요.
'9788936433598':
  title: 채식주의자:한강 연작소설
  summary: 평범하게 살던 영혜는 어느 날 이상한 꿈을 꾼 뒤로 갑자기 고기를 먹지 않기로 결심해요. 가족들은 그런 영혜를 이해하지 못하고
    크게 다투며 갈등을 겪어요. 영혜는 점점 사람들과 멀어지며 자기만의 생각 속으로 빠져들어요. 한 사람의 선택이 가족과 주변 사람들에게 어떤
    영향을 미치는지 깊이 생각하게 하는 소설이에요.
'9788949144054':
  title: 배드 가이즈
  summary: 늑대, 뱀, 상어, 피라냐 같은 무섭게 생긴 동물들이 모여 나쁜 녀석들 모임을 만들어요. 사람들에게 나쁜 놈으로만 보이는 게 억울해서
    이들은 착한 일을 해서 이미지를 바꾸기로 해요. 좋은 뜻으로 나섰지만 자꾸 일이 꼬이면서 우스꽝스러운 소동이 벌어져요. 겉모습만 보고 판단하면
    안 된다는 걸 유쾌하게 보여 주는 이야기예요.
'9791157822775':
  title: 룰스 :단 한 사람만을 위한 규칙
  summary: 캐서린에게는 자폐가 있는 남동생 데이비드가 있어서, 동생을 도와주려고 나름의 규칙들을 만들어 놓았어요. 동생 때문에 창피할 때도
    많았던 캐서린은 휠체어를 탄 소년 제이슨을 만나면서 다르게 생각하게 돼요. 제이슨과 친해지면서 캐서린은 다르다는 것에 대한 자기 생각을 되돌아봐요.
    가족과 우정, 그리고 서로 다른 사람을 이해하는 마음을 그린 따뜻한 이야기예요.
'9791187777267':
  title: 전사들 :새로운 예언
  summary: 숲에서 규칙을 지키며 살아가는 고양이 부족들에게 큰 위기가 찾아와요. 젊은 고양이들은 예언의 부름을 받아 새로운 보금자리를 찾아
    위험한 여행을 떠나게 돼요. 서로 다른 부족 출신 고양이들이 힘을 합쳐 어려움을 헤쳐 나가요. 야생 고양이들의 세계를 배경으로 한 우정과 모험
    가득한 판타지 시리즈예요.
'9788950994372':
  title: "(이사도라 문) 마녀 요정 미라벨"
  summary: 이사도라 문은 뱀파이어 아빠와 요정 엄마 사이에서 태어난 반은 뱀파이어, 반은 요정인 소녀예요. 인간 학교와 마법 학교를 오가며
    두 세계 사이에서 좌충우돌 일상을 보내요. 이번 이야기에서는 마녀 친구 미라벨과 함께 신비한 사건을 겪게 돼요. 특별한 능력을 가진 주인공이
    평범한 고민도 함께 겪는 모습이 사랑스러운 시리즈예요.
'9788965481638':
  title: 구스범스
  summary: 평범한 하루를 보내던 아이들이 갑자기 이상하고 오싹한 사건에 휘말리는 공포 이야기 시리즈예요. 저주받은 인형이나 이상한 물건,
    괴물 같은 존재가 나타나 주인공을 위협해요. 무섭지만 재미있게 풀어내서 등골이 서늘하면서도 다음 장이 궁금해지는 이야기예요. 전 세계 어린이들에게
    사랑받은 대표적인 공포 동화 시리즈예요.
'9791186940303':
  title: 조선왕조실톡 7 - 안녕, 조선 패밀리
  summary: 조선 시대 왕실 이야기를 요즘 친구들이 메신저로 대화하는 것처럼 재미있게 풀어낸 역사 만화예요. 실제 역사 속 사건과 인물들을
    바탕으로 하면서도 유쾌한 말투와 그림으로 쉽게 설명해 줘요. 딱딱하게 느껴지던 조선 왕실의 이야기가 웃음과 함께 술술 들어와요. 역사를 재미있게
    배우고 싶은 어린이에게 딱 맞는 책이에요.
'9791165794811':
  title: 130층 나무 집
  summary: 앤디와 테리가 사는 나무 집이 이번에는 130층까지 늘어났어요. 나무 집 곳곳에는 상상도 못 할 엉뚱한 놀이 공간과 신기한 장치들이
    숨어 있어요. 이번에도 두 친구는 이상한 사건에 휘말리며 좌충우돌 소동을 벌여요. 기발한 상상력과 웃음이 가득한 인기 시리즈예요.
'9791164130764':
  title: 추리 천재 엉덩이 탐정과 카레 사건
  summary: 얼굴이 엉덩이처럼 생긴 괴짜 명탐정이 이번에는 카레와 관련된 이상한 사건을 해결하러 나서요. 방귀 냄새로 단서를 찾고 엉뚱한 방법으로
    범인을 추리하는 모습이 웃음을 자아내요. 조수와 함께 사건 현장을 조사하며 진짜 범인을 찾아가요. 웃기면서도 진짜 추리 요소가 담긴 인기 탐정
    시리즈예요.
'9788949139999':
  title: 모모 :시간을 훔치는 도둑과, 그 도둑이 훔쳐 간 시간을 찾아 주는 한 소녀에 대한 이상한 이야기
  summary: 모모는 남의 이야기를 진심으로 잘 들어 주는 신비한 능력을 가진 소녀예요. 어느 날 사람들에게서 시간을 훔쳐 가는 회색 신사들이
    나타나면서 마을 사람들은 점점 여유를 잃고 바빠지기만 해요. 모모는 시간을 지키는 호라 박사와 거북이 카시오페이아의 도움을 받아 회색 신사들과
    맞서 싸워요. 진짜 소중한 시간이 무엇인지 깊이 생각하게 해 주는 유명한 이야기예요.
'9791171713691':
  title: 도그맨
  summary: 머리는 개, 몸은 사람인 경찰관 도그맨이 마을에서 벌어지는 사건을 해결하러 나서요. 냄새를 잘 맡는 능력과 충성심으로 나쁜 짓을
    하려는 악당들과 맞서요. 실수도 많이 하지만 순수하고 용감한 모습이 웃음과 감동을 함께 줘요. 그림이 많고 이야기가 짧아 부담 없이 즐겁게
    읽을 수 있어요.
'9788950977931':
  title: 이사도라 문
  summary: 이사도라 문은 뱀파이어 아빠와 요정 엄마를 둔 반은 뱀파이어, 반은 요정인 특별한 소녀예요. 인간 세상과 마법 세상 두 곳을 오가며
    학교생활과 일상 속 크고 작은 사건을 겪어요. 특별한 능력이 있지만 평범한 아이들처럼 친구 문제로 고민하기도 해요. 발랄하고 사랑스러운 그림으로
    인기를 끈 어린이 시리즈예요.
'9788934967392':
  title: 전지적 독자 시점 =싱숑 장편소설 /Omniscient reader's viewpoint
  summary: 김독자는 아무도 안 읽는 웹소설 하나를 끝까지 읽은 유일한 독자였어요. 그런데 어느 날 그 소설 속 이야기가 진짜 현실이 되어
    세상이 무섭게 변해 버려요. 독자는 소설 내용을 미리 알고 있다는 것을 무기로 삼아 살아남기 위해 힘든 상황들을 헤쳐 나가요. 이야기 속 인물들과
    함께 위기를 극복해 가는 스케일 큰 판타지예요.
'9791165383640':
  title: 황석영의 어린이 민담집
  summary: 소설가 황석영 작가가 우리나라에 전해 내려오는 옛이야기들을 어린이가 읽기 쉽게 풀어 쓴 책이에요. 도깨비, 호랑이, 지혜로운 사람들이
    나오는 이야기 속에는 조상들의 재치와 교훈이 담겨 있어요. 정겨운 말투와 술술 읽히는 문장으로 옛날 사람들의 생각을 느낄 수 있어요. 우리
    전래동화를 새롭게 만나는 재미를 주는 책이에요.
'9788971846643':
  title: 서찰을 전하는 아이
  summary: 주인공 소년은 위험한 시대에 비밀 서찰을 전해야 하는 임무를 맡게 돼요. 누구를 믿어야 할지 모르는 상황에서 소년은 목숨을 걸고
    먼 길을 떠나요. 길 위에서 여러 사람을 만나며 세상의 아픔과 어른들의 사정을 알아가요. 어린 주인공이 겪는 긴박한 여정을 통해 역사 속 아픔을
    느끼게 하는 동화예요.
'9788983946966':
  title: 방관자 :방관자인가? 다음 희생양인가?
  summary: 새로운 동네로 이사 온 에릭은 친구들 사이에서 힘이 센 그리핀이 다른 아이를 괴롭히는 모습을 보게 돼요. 처음에는 휘말리기 싫어서
    못 본 척하지만, 괴롭힘은 점점 심해지고 에릭의 마음도 불편해져요. 에릭은 방관자로 남을지, 용기를 내서 나설지 고민하게 돼요. 학교 폭력을
    지켜보는 주변 사람의 선택이 얼마나 중요한지 생각하게 하는 이야기예요.
'9788934935735':
  title: 사피엔스 :그래픽 히스토리
  summary: 인류의 조상이 어떻게 지구에서 가장 강한 동물이 되었는지를 만화로 쉽게 풀어낸 책이에요. 사냥하고 채집하며 살던 원시 인류가 언어와
    상상력을 갖게 되면서 큰 무리를 이루고 협력하는 과정을 보여줘요. 다른 인류 종들과 경쟁하고 자연을 바꿔 나가는 인류의 역사를 그림과 함께
    재미있게 설명해요. 어렵게 느껴질 수 있는 인류 역사를 만화로 쉽게 이해할 수 있게 해 주는 책이에요.
'9788936478292':
  title: 스노볼 :박소영 장편소설
  summary: 사람들이 가난한 사람들의 일상을 텔레비전으로 지켜보는 미래 사회를 배경으로 한 이야기예요. 눈 덮인 마을에 사는 주인공은 방송에
    나오는 삶을 살아가며 부자 시청자들의 시선 속에 갇혀 지내요. 방송 밖 진짜 삶과 방송을 위해 꾸며진 삶 사이에서 주인공은 혼란을 느껴요.
    불평등한 사회를 날카롭게 보여 주는 청소년 SF 소설이에요.
'9788965590972':
  title: 윔피 키드
  summary: 평범한 중학생 그렉 헤플리가 학교와 가족, 친구들 사이에서 겪는 좌충우돌 일상을 일기 형식으로 그린 책이에요. 인기를 얻고 싶어
    하지만 매번 엉뚱한 사고를 치는 그렉의 모습이 웃음을 자아내요. 그림일기처럼 그림과 글이 함께 있어서 술술 재미있게 읽을 수 있어요. 전 세계
    어린이들에게 사랑받은 인기 시리즈예요.
'9791130646381':
  title: 이처럼 사소한 것들 :클레어 키건 소설
  summary: 아일랜드의 작은 마을에서 연탄과 석탄을 배달하며 살아가는 빌 펄롱의 이야기예요. 어느 날 배달을 갔다가 수녀원에서 힘들게 지내는
    어린 소녀를 우연히 보게 돼요. 그 모습을 본 빌은 못 본 척 넘어갈지, 용기를 내어 나설지 깊이 고민하게 돼요. 작은 선택 하나가 만들어
    내는 큰 용기를 잔잔하게 보여 주는 이야기예요.
'9791165384500':
  title: 황석영의 어린이 민담집
  summary: 소설가 황석영 작가가 우리나라 전래 이야기를 어린이 눈높이에 맞게 풀어 쓴 책이에요. 도깨비와 호랑이, 지혜로운 사람들이 등장하는
    이야기 속에 조상들의 재치와 교훈이 담겨 있어요. 정겹고 쉬운 문장으로 옛이야기의 재미를 느낄 수 있어요. 우리 옛이야기를 새롭게 만나 볼
    수 있는 책이에요.
'9788934967422':
  title: 전지적 독자 시점 =싱숑 장편소설 /Omniscient reader's viewpoint
  summary: 김독자는 아무도 끝까지 읽지 않은 웹소설을 유일하게 완독한 독자였어요. 그런데 그 소설 속 이야기가 실제 현실이 되어 세상이 무섭게
    바뀌어 버려요. 독자는 소설의 결말을 미리 알고 있다는 것을 무기 삼아 위기를 헤쳐 나가요. 이야기 속 인물들과 힘을 합쳐 살아남는 스케일
    큰 이야기예요.
'9791187777069':
  title: 암호클럽
  summary: 아이들이 모여 만든 암호클럽이 다양한 암호와 비밀 코드를 풀며 사건을 해결해 나가는 이야기예요. 편지에 숨겨진 암호나 그림 속
    힌트를 하나씩 풀어내며 진실에 다가가요. 친구들과 힘을 모아 머리를 쓰는 과정이 흥미진진하게 펼쳐져요. 읽으면서 직접 암호를 풀어 보는 재미도
    함께 느낄 수 있는 시리즈예요.
'9791168413757':
  title: 셜록 홈스, 범인을 찾아라!
  summary: 명탐정 셜록 홈스가 친구 왓슨과 함께 어려운 사건을 하나씩 풀어 나가는 이야기예요. 작은 단서 하나도 놓치지 않는 날카로운 관찰력과
    추리로 사건의 진실을 밝혀내요. 다른 사람들이 눈치채지 못하는 것들을 알아채는 홈스의 모습이 흥미진진해요. 세계에서 가장 유명한 탐정의 활약을
    어린이도 쉽게 즐길 수 있게 만든 책이에요.
'9788960869219':
  title: 무빙 :강풀액션만화
  summary: 남들이 모르는 특별한 능력을 가진 사람들이 자기 능력을 숨기고 평범하게 살아가는 이야기예요. 하늘을 날 수 있거나 다친 곳이 금방
    낫는 등 특별한 힘을 가진 부모들의 아이들이 고등학생이 되면서 이야기가 본격적으로 시작돼요. 감춰졌던 과거의 비밀과 위험한 사건들이 서서히
    드러나요. 능력자들의 액션과 가족애가 함께 어우러진 이야기예요.
'9791165384456':
  title: 황석영의 어린이 민담집
  summary: 황석영 작가가 우리나라 전래 이야기를 쉽고 정겹게 풀어낸 책이에요. 도깨비, 호랑이, 지혜로운 사람들이 나오는 이야기 속에 조상들의
    재치와 삶의 교훈이 담겨 있어요. 쉬운 문장이라 옛이야기를 처음 만나는 어린이도 술술 읽을 수 있어요. 우리 옛이야기의 재미와 지혜를 함께
    느낄 수 있는 책이에요.
'9788954652384':
  title: 황석영.이충호 만화 삼국지 1 - 난세에 태어나다
  summary: 중국이 여러 나라로 어지럽게 나뉘어 싸우던 삼국시대를 배경으로 한 이야기예요. 유비, 관우, 장비 세 사람이 복숭아나무 아래에서
    의형제를 맺고 함께 어려운 세상을 헤쳐 나가기로 결심해요. 황건적의 난 같은 혼란스러운 사건들 속에서 세 사람의 우정과 의리가 빛을 발해요.
    만화로 쉽게 풀어낸 삼국지의 첫 이야기예요.
'9788949162041':
  title: 장군이네 떡집
  summary: 장군이는 떡집을 하는 할머니 옆에서 신기한 떡들을 만나게 돼요. 떡집에서 파는 떡들은 저마다 특별한 효과가 있어서, 어떤 떡을
    먹느냐에 따라 이상한 일이 벌어져요. 장군이는 떡의 힘을 통해 욕심을 부리면 안 되는 이유와 소중한 것을 깨달아 가요. 우리 전통 음식인 떡을
    소재로 재미난 상상력을 더한 이야기예요.
'9788950969783':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 장난꾸러기 손오공이 한자의 세계로 들어가 다양한 모험을 펼치는 이야기예요. 한자마다 숨겨진 요괴나 괴물을 만나 물리치면서 자연스럽게
    한자의 뜻과 모양을 배우게 돼요. 손오공은 여의봉을 휘두르며 통쾌하게 문제를 해결해 나가요. 만화로 재미있게 한자를 익힐 수 있어서 어린이들에게
    오랫동안 사랑받은 학습 만화예요.
'9788963722320':
  title: 달빛 마신 소녀
  summary: 마을 사람들은 해마다 아기 한 명을 숲속 마녀에게 바쳐야 한다고 믿고 있어요. 그런데 사실 숲에 사는 착한 마녀 잰은 버려진 아기들을
    구해서 달빛을 먹여 키우고 있었어요. 어느 날 실수로 별빛 대신 달빛을 잔뜩 먹인 아기 루나에게 신비한 마법의 힘이 생기고 말아요. 루나가
    자라며 자신의 힘을 알아가고 진실을 마주하는 따뜻한 판타지 이야기예요.
'9791165814649':
  title: 작전명 말모이 한글을 지킨 사람들
  summary: 일제강점기, 일본이 우리말과 우리글을 못 쓰게 막던 시절의 이야기예요. 사람들은 목숨을 걸고 몰래 우리말 사전을 만들기 위해 전국의
    사투리와 단어를 모으는 말모이 작업을 이어가요. 들키면 위험한 상황에서도 우리말을 지키려는 사람들의 용기가 감동을 줘요. 한글과 우리말을 지켜낸
    사람들의 노력을 알게 해 주는 역사 이야기예요.
'9791173113598':
  title: "(처음 읽는) 삼국지"
  summary: 중국이 위, 촉, 오 세 나라로 나뉘어 다투던 삼국시대를 배경으로 한 이야기예요. 유비, 관우, 장비가 의형제를 맺고 어지러운
    세상을 바로잡기 위해 함께 나서요. 지혜로운 제갈량의 계책과 영웅들의 활약으로 여러 큰 전투가 펼쳐져요. 의리와 지혜를 배울 수 있는 중국
    고전을 어린이 눈높이로 쉽게 풀어낸 책이에요.
'9791187777199':
  title: 암호클럽
  summary: 아이들이 모인 암호클럽이 여러 가지 암호와 비밀 코드를 풀어 사건을 해결해 나가는 이야기예요. 편지나 물건에 숨겨진 힌트를 하나씩
    풀며 진실에 다가가요. 친구들과 머리를 맞대고 추리하는 과정이 흥미진진하게 펼쳐져요. 직접 암호를 풀어 보는 재미도 느낄 수 있는 인기 시리즈예요.
'9791196254803':
  title: 원더
  summary: 얼굴 생김새가 남들과 다른 어거스트는 태어나서 처음으로 일반 학교에 다니게 돼요. 처음에는 친구들의 시선과 놀림 때문에 힘들어하지만,
    진심으로 다가오는 친구들도 하나둘 생겨요. 어거스트와 주변 친구, 가족들의 시선을 번갈아 보여 주며 서로를 이해하는 과정을 그려요. 다름을
    받아들이고 진짜 친절이 무엇인지 깨닫게 해 주는 감동적인 이야기예요.
'9788936434427':
  title: 유원 :백온유 장편소설
  summary: 유원은 어릴 적 불이 난 집에서 삼촌의 도움으로 목숨을 건졌지만, 삼촌은 그 사고로 세상을 떠났어요. 사람들은 유원을 기적처럼
    살아남은 아이로만 기억하고, 유원은 그 시선이 늘 부담스러워요. 시간이 흘러도 그날의 기억과 죄책감에서 벗어나지 못한 채 살아가던 유원은 조금씩
    자신의 상처와 마주하게 돼요. 아픔을 딛고 진짜 자기 삶을 찾아가는 청소년의 성장을 그린 이야기예요.
'9788949162126':
  title: 달콩이네 떡집
  summary: 달콩이는 신비한 떡집에서 이상한 떡들을 만나게 돼요. 떡집에서 파는 떡은 저마다 특별한 힘이 있어서, 먹는 사람에 따라 뜻밖의
    일이 벌어져요. 달콩이는 떡을 통해 자기 마음을 돌아보고 소중한 것이 무엇인지 깨달아 가요. 우리 전통 떡을 소재로 상상력을 더한 유쾌한 동화예요.
'9788987721217':
  title: "(박완서 동화집)자전거 도둑"
  summary: 시골에서 서울로 올라와 가게 점원으로 일하는 소년 수남이의 이야기예요. 어느 날 수남이는 자전거를 타다가 실수로 신사의 차를 긁고,
    신사는 억지로 큰돈을 요구해요. 수남이는 자전거를 들고 도망쳐 돈을 안 내고 넘어가지만, 그 일이 오히려 마음을 무겁게 만들어요. 정직하게
    살라고 가르쳐 준 아버지를 떠올리며 옳고 그름에 대해 다시 생각하게 되는 이야기예요.
'9791193821398':
  title: 나 혼자만 레벨업
  summary: 세상에 던전과 몬스터가 나타나면서 사람들은 헌터가 되어 싸워야 해요. 주인공 성진우는 그중에서도 가장 약한 최하급 헌터였어요.
    죽을 뻔한 위험한 던전에서 살아남은 뒤, 성진우에게만 보이는 신비한 시스템이 생기면서 이야기가 시작돼요. 약했던 주인공이 혼자만의 힘으로 점점
    최강이 되어 가는 통쾌한 이야기예요.
'9791164130603':
  title: 윔피 키드
  summary: 평범한 중학생 그렉 헤플리가 학교와 친구, 가족 사이에서 겪는 좌충우돌 일상을 일기로 그린 책이에요. 인기 많은 아이가 되고 싶어
    하지만 매번 엉뚱한 사고를 쳐요. 그림과 글이 함께 있는 일기 형식이라 술술 재미있게 읽을 수 있어요. 전 세계 어린이들에게 오랫동안 사랑받은
    인기 시리즈예요.
'9788959135813':
  title: 유미의 세포들 =Yumi's cells
  summary: 유미의 머릿속에는 감정과 성격을 나타내는 작고 귀여운 세포들이 살고 있어요. 이성세포, 감성세포 같은 세포들이 회의를 하며 유미의
    하루하루와 연애를 도와줘요. 유미가 사랑하고, 다투고, 성장하는 현실적인 이야기가 세포들의 시선으로 재미있게 펼쳐져요. 평범한 직장인의 삶과
    사랑을 유쾌하고 따뜻하게 그린 인기 웹툰이에요.
'9788950993207':
  title: "(만화) 열두 살에 부자가 된 키라"
  summary: 열두 살 소녀 키라는 우연히 말하는 강아지 머니를 만나게 돼요. 머니는 키라에게 돈을 벌고 모으고 불리는 방법을 하나씩 가르쳐
    줘요. 키라는 배운 것을 실천하며 스스로 돈 관리하는 습관을 만들어가요. 어린이도 쉽게 이해할 수 있게 경제와 돈의 원리를 알려 주는 이야기예요.
'9791166890475':
  title: 갈매기에게 나는 법을 가르쳐준 고양이
  summary: 갈매기 켕가는 죽기 전에 고양이 소르바스에게 알을 지켜 달라고, 그리고 태어날 아기 갈매기에게 나는 법을 가르쳐 달라고 부탁해요.
    소르바스는 뜻밖의 약속을 지키기 위해 다른 고양이 친구들과 함께 아기 갈매기를 정성껏 돌봐요. 고양이가 새에게 나는 법을 가르친다는 건 불가능해
    보이지만, 친구들은 포기하지 않아요. 서로 다른 존재도 사랑과 우정으로 약속을 지켜낼 수 있다는 걸 보여 주는 감동적인 이야기예요.
'9788949162058':
  title: 소원 떡집
  summary: 주인공은 우연히 신비한 떡집을 발견하고 특별한 떡을 먹게 돼요. 떡집의 떡들은 저마다 소원과 관련된 신기한 효과가 있어서, 먹을
    때마다 예상치 못한 일이 벌어져요. 주인공은 떡의 힘을 통해 진짜 소중한 소원이 무엇인지 깨달아 가요. 우리 전통 음식 떡을 소재로 상상력을
    더한 유쾌한 동화예요.
'9788925556789':
  title: 마션 :어느 괴짜 과학자의 화성판 어드벤처 생존기
  summary: 화성 탐사 중 갑작스러운 모래 폭풍 때문에 대원들은 마크 와트니가 죽은 줄 알고 화성에 그를 남겨둔 채 떠나요. 하지만 마크는
    살아남았고, 혼자 화성에서 구조될 때까지 버텨야 해요. 마크는 과학 지식을 총동원해 감자를 기르고 장비를 고치며 살아남을 방법을 찾아내요.
    유머를 잃지 않고 위기를 극복해 나가는 과학적이고 스릴 넘치는 생존 이야기예요.
'9788949144061':
  title: 배드 가이즈
  summary: 늑대, 뱀, 상어, 피라냐처럼 무섭게 생긴 동물들이 모여 나쁜 녀석들 갱단을 만들어요. 사람들에게 항상 나쁜 놈 취급을 받던 이들은
    착한 일을 해서 이미지를 바꾸기로 결심해요. 좋은 뜻으로 나섰지만 자꾸 일이 꼬이면서 우스꽝스러운 소동이 벌어져요. 겉모습만 보고 판단하면
    안 된다는 걸 유쾌하게 보여 주는 이야기예요.
'9788990878052':
  title: 어느날 내가 죽었습니다
  summary: 유미는 오토바이 사고로 갑자기 세상을 떠난 친구 재준이의 일기장을 우연히 읽게 돼요. 평소 알던 모습과는 다른 재준이의 속마음과
    비밀을 하나씩 알아가면서 유미는 큰 혼란을 느껴요. 친구의 죽음을 받아들이는 과정에서 유미는 삶과 우정, 사랑의 의미를 다시 생각하게 돼요.
    갑작스러운 이별을 통해 성장해 가는 마음을 섬세하게 그린 청소년 소설이에요.
'9791160400168':
  title: 오무라이스 잼잼 :경이로운 일상음식 이야기
  summary: 작가가 직접 먹고 만든 다양한 음식 이야기를 담은 만화 에세이예요. 오므라이스, 라면, 김밥 같은 익숙한 음식부터 낯선 음식까지
    먹는 즐거움을 그림과 함께 소개해요. 음식에 얽힌 추억과 소소한 일상 이야기가 정겹게 펼쳐져요. 먹는 것을 좋아하는 사람이라면 누구나 공감할
    수 있는 유쾌한 만화예요.
'9788959135882':
  title: 유미의 세포들 =Yumi's cells
  summary: 유미의 머릿속에는 감정과 성격을 나타내는 작고 귀여운 세포들이 살고 있어요. 이성세포, 감성세포 같은 세포들이 회의를 하며 유미의
    하루와 연애를 도와줘요. 유미가 사랑하고 다투고 성장하는 이야기가 세포들의 눈으로 재미있게 펼쳐져요. 평범한 사람의 삶과 사랑을 유쾌하고 따뜻하게
    그린 인기 웹툰이에요.
'9788972887683':
  title: 7년 동안의 잠 :박완서 그림동화
  summary: 개미들은 땅속에서 잠들어 있는 매미 애벌레를 발견하고 잡아먹으려고 해요. 그런데 지혜로운 여왕개미가 이 애벌레는 칠 년을 기다려야
    매미가 되어 아름다운 노래를 부를 수 있다고 말려요. 개미들은 당장 먹고 싶은 마음을 참고 매미가 잠에서 깨어날 때까지 기다려 주기로 해요.
    눈앞의 이익보다 기다림과 생명의 소중함을 일깨워 주는 그림책이에요.
'9788966071722':
  title: 꼬마 흡혈귀
  summary: 평범한 소년 안톤은 우연히 또래 흡혈귀 소년 뤼디거를 만나 친구가 돼요. 뤼디거는 낮에는 관 속에서 자고 밤에만 돌아다니는 진짜
    흡혈귀지만, 사람을 해치지는 않아요. 안톤은 뤼디거의 흡혈귀 가족과 어울리며 신기하고 오싹한 모험을 함께해요. 서로 다른 세계의 두 친구가
    우정을 쌓아가는 유쾌하고 따뜻한 이야기예요.
'9791130623528':
  title: 윙페더 사가
  summary: 이기비 남매 재너, 팅크, 릴리는 사악한 팽 무리가 다스리는 땅 스크리에서 평범하게 살고 있었어요. 그러다 자신들이 사실 오래전
    사라진 왕국 아니에라의 후계자라는 놀라운 사실을 알게 돼요. 남매는 위험한 팽들을 피해 목숨을 건 여행을 떠나게 돼요. 가족애와 용기를 그린
    모험 가득한 판타지 시리즈예요.
'9788952744586':
  title: 117층 나무 집
  summary: 앤디와 테리가 사는 나무 집이 이번에는 117층까지 늘어났어요. 나무 집 곳곳에는 상상도 못 할 엉뚱한 놀이 공간과 신기한 장치들이
    숨어 있어요. 두 친구는 이번에도 이상한 사건에 휘말리며 좌충우돌 소동을 벌여요. 기발한 상상력과 웃음이 가득한 인기 시리즈예요.
'9791171711000':
  title: 도그맨
  summary: 머리는 개, 몸은 사람인 경찰관 도그맨이 마을에서 벌어지는 사건을 해결하러 나서요. 냄새를 잘 맡는 능력과 충성심으로 나쁜 짓을
    하려는 악당들과 맞서요. 실수도 많이 하지만 순수하고 용감한 모습이 웃음과 감동을 함께 줘요. 그림이 많고 이야기가 짧아 부담 없이 즐겁게
    읽을 수 있어요.
'9788925543222':
  title: 소년 셜록 홈즈
  summary: 아직 유명해지기 전, 십 대 소년이었던 셜록 홈스의 첫 모험을 그린 이야기예요. 방학을 맞아 친척 집에 간 셜록은 우연히 이상한
    사건을 마주하게 돼요. 날카로운 관찰력과 논리적인 추리로 어른들도 풀지 못한 사건의 실마리를 하나씩 풀어가요. 훗날 최고의 탐정이 되는 셜록
    홈스의 어린 시절 이야기를 만날 수 있어요.
'9788959135899':
  title: 유미의 세포들 =Yumi's cells
  summary: 유미의 머릿속에는 감정과 성격을 나타내는 작고 귀여운 세포들이 살고 있어요. 이성세포, 감성세포 같은 세포들이 회의를 하며 유미의
    하루와 연애를 이끌어가요. 유미가 사랑하고 다투고 성장하는 이야기가 세포들의 시선으로 재미있게 펼쳐져요. 평범한 사람의 삶과 사랑을 유쾌하고
    따뜻하게 그린 인기 웹툰이에요.
'9791173470905':
  title: 열두 살에 부자가 된 키라
  summary: 열두 살 소녀 키라는 우연히 말하는 강아지 머니를 만나게 돼요. 머니는 키라에게 돈을 벌고 모으고 불리는 방법을 하나씩 가르쳐
    줘요. 키라는 배운 것을 실천하며 스스로 돈을 관리하는 습관을 만들어가요. 어린이도 쉽게 이해할 수 있게 경제와 돈의 원리를 알려 주는 이야기예요.
'9791187777397':
  title: 전사들 :새로운 예언
  summary: 숲에서 무리를 이루어 사는 야생 고양이들의 이야기예요. 고양이들은 각자의 부족(클랜)에 속해 전사로서 규율을 지키며 살아가요.
    힘든 시련과 위험한 모험을 겪으면서 고양이들은 우정과 용기를 배워가요. 동물이지만 사람처럼 생각하고 말하는 모습이 흥미진진하게 그려져요.
'9791173470943':
  title: "(소통이 어려운 나를 위한) 데일 카네기 인간관계론"
  summary: 사람들과 더 잘 지내는 방법을 알려주는 책이에요. 남을 비난하기보다 진심으로 칭찬하고, 상대방의 이야기를 잘 들어주라고 말해요.
    이름을 기억해 주고 먼저 웃으며 다가가면 친구를 사귀기 쉬워진다고 알려줘요. 어린이 눈높이에 맞게 데일 카네기의 인간관계 지혜를 쉽게 풀어낸
    책이에요.
'9788971967867':
  title: 손도끼
  summary: 비행기 사고로 캐나다 숲 한가운데 홀로 떨어진 소년 브라이언의 이야기예요. 가진 것이라곤 손도끼 하나뿐인 브라이언은 스스로 불을
    피우고 먹을 것을 구하며 살아남는 법을 배워가요. 처음엔 두렵고 서툴렀지만 점점 자연 속에서 지혜롭게 버티는 법을 터득해요. 혼자 힘으로 위기를
    이겨내는 소년의 성장 이야기예요.
'9788936434618':
  title: 위저드 베이커리 :구병모 장편소설
  summary: 새엄마와 갈등을 겪던 소년이 집을 뛰쳐나와 늦은 밤 낯선 빵집에 들어가면서 이야기가 시작돼요. 그 빵집은 마법사가 운영하는 곳으로,
    소원을 들어주는 신기한 빵을 팔아요. 소년은 그곳에 머물며 자신의 아픈 과거와 가족 문제를 하나씩 마주하게 돼요. 상처받은 마음이 조금씩 치유되어
    가는 과정을 그린 이야기예요.
'9788956187372':
  title: 고구마구마
  summary: 여러 가지 생김새를 가진 고구마들이 등장하는 그림책이에요. 통통한 고구마, 길쭉한 고구마, 울퉁불퉁한 고구마 등 생김새는 저마다
    다르지만 모두 자기 모습 그대로 당당해요. 겉모습만 보고 판단하지 말자는 메시지를 재미있게 전해줘요. 리듬감 있는 말장난으로 아이들에게 사랑받는
    그림책이에요.
'9788955823509':
  title: 엄마가 유령이 되었어!
  summary: 갑자기 세상을 떠난 엄마가 유령이 되어 아이 곁에 나타나는 이야기예요. 엄마는 아직 아이 혼자 할 줄 모르는 일들을 하나씩 가르쳐
    주며 함께 시간을 보내요. 밥 먹기, 옷 입기 같은 일상을 함께하며 아이는 조금씩 씩씩해져요. 이별의 슬픔과 사랑을 따뜻하게 그린 그림책이에요.
'9788950977948':
  title: 이사도라 문
  summary: 이사도라 문은 요정 엄마와 뱀파이어 아빠 사이에서 태어난 특별한 소녀예요. 요정 학교에도 뱀파이어 학교에도 완전히 어울리지 못해
    고민이 많아요. 결국 인간 학교에 다니게 되면서 새로운 친구들을 만나고 좌충우돌 학교생활을 시작해요. 반은 요정, 반은 뱀파이어인 자신만의
    매력을 찾아가는 이야기예요.
'9791130656151':
  title: 드래곤 마스터
  summary: 평범한 농부 소년 드레이크는 어느 날 갑자기 성으로 불려가 드래곤 마스터로 선택돼요. 드레이크는 땅의 드래곤과 짝을 이루어 서로
    마음을 나누는 법을 배워가요. 다른 드래곤 마스터들과 함께 훈련하며 우정을 쌓고 왕국을 지키는 임무를 맡게 돼요. 소년과 드래곤의 특별한 우정을
    그린 모험 이야기예요.
'9791190305945':
  title: 유미의 세포들 =Yumi's cells
  summary: 평범한 직장인 유미의 마음속에는 감정과 생각을 담당하는 작은 세포들이 살고 있어요. 사랑 세포, 이성 세포, 감성 세포 같은 세포들이
    회의를 하며 유미의 하루하루를 이끌어가요. 연애와 일상 속에서 유미가 겪는 고민과 감정을 세포들의 시선으로 재미있게 보여줘요. 마음속 감정을
    캐릭터로 표현한 독특한 이야기예요.
'9788934967439':
  title: 전지적 독자 시점 =싱숑 장편소설 /Omniscient reader's viewpoint
  summary: 주인공 김독자는 오랫동안 봐온 인터넷 소설 속 세상이 현실이 되어버린 것을 알게 돼요. 소설의 결말까지 미리 알고 있는 사람은
    김독자뿐이라 그는 이 지식을 이용해 위기를 헤쳐나가야 해요. 소설 속 등장인물들과 함께 갑작스레 닥친 재난 같은 사건들을 헤쳐나가요. 오직
    한 사람만 아는 미래라는 독특한 설정이 흥미진진한 이야기예요.
'9788966350759':
  title: 하늘 100층짜리 집
  summary: 주인공이 하늘 위로 끝없이 이어지는 100층짜리 집을 한 층 한 층 올라가는 그림책이에요. 층마다 구름, 해, 달, 별처럼 하늘에
    사는 신기한 존재들을 만나요. 페이지를 넘길 때마다 전혀 다른 풍경이 펼쳐져서 보는 재미가 커요. 상상력을 자극하는 그림 여행을 담은 책이에요.
'9788936475659':
  title: 아몬드 :큰글자도서
  summary: 편도체가 작아 감정을 잘 느끼지 못하는 소년 윤재의 이야기예요. 엄마와 할머니의 보살핌 속에 자라던 윤재는 어느 날 큰 사고로
    가족을 잃게 돼요. 감정 표현이 서툰 윤재는 거칠고 반항적인 소년 곤이를 만나면서 조금씩 변화를 겪어요. 서로 다른 두 소년이 우정을 통해
    진짜 감정을 배워가는 성장 이야기예요.
'9788959135929':
  title: 유미의 세포들 =Yumi's cells
  summary: 평범한 직장인 유미의 마음속에는 감정과 생각을 담당하는 작은 세포들이 살고 있어요. 사랑 세포, 이성 세포, 감성 세포 같은 세포들이
    회의를 하며 유미의 하루하루를 이끌어가요. 연애와 일상 속에서 유미가 겪는 고민과 감정을 세포들의 시선으로 재미있게 보여줘요. 마음속 감정을
    캐릭터로 표현한 독특한 이야기예요.
'9788934967415':
  title: 전지적 독자 시점 =싱숑 장편소설 /Omniscient reader's viewpoint
  summary: 주인공 김독자는 오랫동안 봐온 인터넷 소설 속 세상이 현실이 되어버린 것을 알게 돼요. 소설의 결말까지 미리 알고 있는 사람은
    김독자뿐이라 그는 이 지식을 이용해 위기를 헤쳐나가야 해요. 소설 속 등장인물들과 함께 갑작스레 닥친 재난 같은 사건들을 헤쳐나가요. 오직
    한 사람만 아는 미래라는 독특한 설정이 흥미진진한 이야기예요.
'9788950977962':
  title: 이사도라 문
  summary: 이사도라 문은 요정 엄마와 뱀파이어 아빠 사이에서 태어난 특별한 소녀예요. 요정 학교에도 뱀파이어 학교에도 완전히 어울리지 못해
    고민이 많아요. 결국 인간 학교에 다니게 되면서 새로운 친구들을 만나고 좌충우돌 학교생활을 시작해요. 반은 요정, 반은 뱀파이어인 자신만의
    매력을 찾아가는 이야기예요.
'9791136214355':
  title: 날씨의 아이 =Weathering with you
  summary: 집을 나와 도쿄로 온 소년 호다카가 맑은 날씨를 부르는 신비한 능력을 가진 소녀 히나를 만나면서 이야기가 시작돼요. 두 사람은
    날씨를 맑게 해주는 일을 하며 돈을 벌고 특별한 우정을 쌓아가요. 하지만 히나의 능력에는 슬픈 비밀이 숨어 있다는 것을 알게 돼요. 소중한
    사람을 지키기 위한 소년의 선택을 그린 이야기예요.
'9788961707596':
  title: 뉴 키드
  summary: 흑인 소년 조던이 백인 학생이 대부분인 사립학교로 전학을 가면서 겪는 이야기를 그린 그래픽노블이에요. 조던은 그림 그리기를 좋아하지만
    낯선 학교에서 자신과 다른 친구들 사이에서 소속감을 느끼기 어려워해요. 은근한 차별과 오해를 겪으면서도 조던은 자기 자신을 지켜나가요. 다름을
    이해하고 진짜 친구를 찾아가는 성장 이야기예요.
'9788960869226':
  title: 무빙 :강풀액션만화
  summary: 평범해 보이지만 남다른 능력을 가진 부모들과 그 능력을 물려받은 아이들의 이야기예요. 몸이 다치면 금세 낫는 아빠와 하늘을 나는
    엄마 밑에서 아이들은 자신의 힘을 숨기며 살아가요. 아이들이 성장하면서 부모님의 숨겨진 과거와 위험한 비밀이 서서히 드러나요. 가족애와 능력자들의
    액션이 함께 어우러진 이야기예요.
'9788994077468':
  title: 아름다운 아이
  summary: 얼굴 생김새가 남들과 달라 여러 번 수술을 받은 소년 어거스트가 처음으로 학교에 가면서 이야기가 시작돼요. 낯선 시선과 놀림 속에서도
    어거스트는 용기를 내어 친구를 사귀려고 노력해요. 어거스트뿐 아니라 가족과 친구들의 시선으로도 이야기가 펼쳐지며 서로를 이해하는 법을 보여줘요.
    겉모습이 아니라 마음으로 사람을 보는 것의 소중함을 알려주는 이야기예요.
'9791169814003':
  title: 프린들 파일
  summary: 소년 닉은 국어 선생님과의 사소한 다툼에서 시작해 '펜'을 '프린들'이라는 새 단어로 부르기로 해요. 친구들이 재미 삼아 따라
    하면서 이 단어는 학교를 넘어 온 마을, 나아가 전국으로 퍼져나가요. 선생님은 이를 막으려 하지만 오히려 단어는 점점 유명해져요. 말과 언어가
    어떻게 생겨나고 퍼지는지를 유쾌하게 보여주는 이야기예요.
'9791191583519':
  title: 유미의 세포들 =Yumi's cells
  summary: 평범한 직장인 유미의 마음속에는 감정과 생각을 담당하는 작은 세포들이 살고 있어요. 사랑 세포, 이성 세포, 감성 세포 같은 세포들이
    회의를 하며 유미의 하루하루를 이끌어가요. 연애와 일상 속에서 유미가 겪는 고민과 감정을 세포들의 시선으로 재미있게 보여줘요. 마음속 감정을
    캐릭터로 표현한 독특한 이야기예요.
'9791167790668':
  title: 중증외상센터 :골든아워
  summary: 실력은 뛰어나지만 병원에서 인정받지 못하던 외과 의사 백강혁이 낙후된 중증외상센터에 오면서 이야기가 시작돼요. 골든아워, 즉 생사를
    가르는 짧은 시간 안에 백강혁은 뛰어난 실력으로 위급한 환자들을 살려내요. 처음엔 무시당하지만 그의 실력이 알려지면서 주변 사람들의 시선이
    달라져요. 생명을 구하는 의료진의 치열한 하루를 그린 이야기예요.
'9791190030540':
  title: "(정재승의) 과학콘서트 =복잡한 세상, 명쾌한 과학 /Science concert"
  summary: 교통 체증부터 유행하는 노래까지, 우리 주변에서 일어나는 신기한 현상들을 과학과 수학으로 풀어내는 책이에요. 복잡해 보이는 세상의
    원리를 재미있는 실제 사례를 통해 쉽게 설명해줘요. 어려운 과학 이론도 생활 속 이야기로 풀어내니 술술 읽혀요. 세상을 새로운 눈으로 바라보게
    해주는 과학 교양서예요.
'9788965464013':
  title: 우리는 우주를 꿈꾼다 :가족은 복잡한 은하다
  summary: 미국 우주왕복선 챌린저호 발사를 앞둔 시기, 삼남매의 일상을 그린 이야기예요. 유급 위기에 놓인 첫째 캐시, 걱정 많은 둘째 핏치,
    우주비행사를 꿈꾸는 막내 버드는 저마다의 고민을 안고 있어요. 가족들은 서로 다투기도 하지만 챌린저호 발사를 함께 기다리며 마음이 이어져요.
    가족의 사랑과 각자의 꿈을 따뜻하게 그린 이야기예요.
'9788966350278':
  title: 바다 100층짜리 집
  summary: 바닷속 깊은 곳까지 이어지는 100층짜리 집을 한 층씩 내려가며 탐험하는 그림책이에요. 층마다 물고기, 문어, 산호 같은 바다
    생물들이 살고 있는 신기한 방들이 펼쳐져요. 페이지를 넘길 때마다 새로운 바닷속 풍경이 등장해서 눈이 즐거워요. 상상력 가득한 바닷속 여행을
    담은 그림책이에요.
'9788932917207':
  title: "(하퍼 리) 앵무새 죽이기 :하퍼 리 장편소설"
  summary: 미국 남부의 작은 마을에서 변호사 아버지 애티커스를 둔 소녀 스카웃의 시선으로 펼쳐지는 이야기예요. 아버지는 억울하게 누명을 쓴
    흑인을 변호하게 되면서 마을 사람들의 편견과 맞서게 돼요. 스카웃과 오빠 젬은 이 사건을 지켜보며 세상의 불공평함과 용기의 의미를 배워가요.
    정의와 편견에 맞서는 용기를 그린 세계적인 고전이에요.
'9788934967408':
  title: 전지적 독자 시점 =싱숑 장편소설 /Omniscient reader's viewpoint
  summary: 주인공 김독자는 오랫동안 봐온 인터넷 소설 속 세상이 현실이 되어버린 것을 알게 돼요. 소설의 결말까지 미리 알고 있는 사람은
    김독자뿐이라 그는 이 지식을 이용해 위기를 헤쳐나가야 해요. 소설 속 등장인물들과 함께 갑작스레 닥친 재난 같은 사건들을 헤쳐나가요. 오직
    한 사람만 아는 미래라는 독특한 설정이 흥미진진한 이야기예요.
