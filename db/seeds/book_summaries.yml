    알려주는 이야기예요.
'9788966072064':
  title: 와일드 로봇의 탈출
  summary: 로봇 로즈는 섬에서 야생동물들과 함께 살다가 인간들에게 붙잡혀 공장으로 끌려가요. 로즈는 자신을 키운 아기 기러기 브라이트빌과
    섬의 친구들을 다시 만나기 위해 탈출을 계획해요. 다른 로봇들의 도움을 받으며 낯선 도시를 지나 위험한 여정을 헤쳐 나가요. 결국 로즈는 온갖
    어려움을 이겨내고 그리운 섬과 가족 같은 친구들 곁으로 돌아가요. 로봇과 동물 친구들의 우정과 모험을 그린 감동적인 이야기예요.
'9788993242980':
  title: 슈퍼 거북
  summary: 느림보로 놀림받던 거북 꾸물이는 토끼와의 경주에서 이겨서 갑자기 유명한 슈퍼 거북이 돼요. 사람들의 기대에 부응하려고 꾸물이는
    밤낮없이 몰래 빠르기 연습을 하느라 지쳐가요. 자기만의 속도와 방식을 잃어버린 채 힘들어하던 꾸물이는 결국 진짜 자기 모습을 찾기로 결심해요.
    남의 기대에 맞추기보다 자기답게 사는 게 더 행복하다는 걸 깨닫는 이야기예요. 토끼와 거북이 이야기를 재치 있게 뒤집은 그림책이에요.
'9788983925350':
  title: 해리포터 :아즈카반의 죄수
  summary: 해리는 호그와트 3학년이 되어 탈옥수 시리우스 블랙이 자신을 노린다는 무서운 소문을 듣게 돼요. 학교 주변에는 영혼을 빨아먹는
    무시무시한 디멘터들이 지키고 있어서 해리는 더욱 불안해져요. 알고 보니 시리우스는 해리의 아빠와 절친했던 사이이자 해리의 대부라는 놀라운 사실이
    밝혀져요. 해리와 친구들은 시간을 되돌리는 마법 도구까지 이용해 억울한 누명을 벗기기 위해 애써요. 우정과 진실을 향한 용기를 보여 주는 해리포터
    시리즈 세 번째 이야기예요.
'9791130681108':
  title: 복면공주
  summary: 얌전한 공주 마곳은 사실 밤이 되면 까만 옷을 입고 몬스터를 물리치는 비밀 영웅 복면공주로 변신해요. 왕국에 몬스터가 나타날 때마다
    공주는 몰래 빠져나가 힘차게 싸우고 다시 얌전한 공주로 돌아와요. 이웃 나라 공주가 놀러 왔다가 마곳의 비밀을 눈치채면서 이야기가 더 재미있어져요.
    얌전한 공주 이미지 뒤에 숨겨진 용감하고 씩씩한 모습을 보여주는 유쾌한 이야기예요. 여자아이도 얼마든지 강하고 멋진 영웅이 될 수 있다는 걸
    보여줘요.
'9788971992296':
  title: "(쉽게 읽는) 백범일지"
  summary: 이 책은 독립운동가 백범 김구 선생님이 직접 쓴 자기 삶의 이야기를 어린이도 읽기 쉽게 풀어 쓴 책이에요. 가난한 집안에서 태어난
    김구가 어떻게 공부하고 성장했는지, 나라를 되찾기 위해 어떤 어려움을 겪었는지 보여줘요. 일본의 지배에 맞서 독립운동에 온 힘을 쏟고 상하이
    임시정부를 이끌었던 이야기가 담겨 있어요. 자신의 안전보다 나라의 독립을 먼저 생각했던 김구 선생님의 마음을 느낄 수 있어요. 우리나라를 위해
    헌신한 위인의 삶을 배울 수 있는 책이에요.
'9791189327156':
  title: 물고기는 존재하지 않는다 :상실, 사랑 그리고 숨어 있는 삶의 질서에 관한 이야기
  summary: 이 책은 물고기를 연구하던 과학자 데이비드 스타 조던의 이야기와 글쓴이 룰루 밀러 자신의 이야기를 함께 담은 논픽션이에요. 조던은
    힘들게 모은 물고기 표본이 지진으로 몽땅 깨져 버리는 큰 시련을 겪지만 포기하지 않고 다시 연구를 이어가요. 글쓴이는 이런 조던의 이야기를
    따라가면서 삶의 혼란과 어려움을 어떻게 이겨낼 수 있을지 고민해요. 그리고 놀랍게도 과학적으로는 물고기라는 분류 자체가 존재하지 않는다는 흥미로운
    사실을 알게 돼요. 혼란 속에서도 질서와 의미를 찾아가는 방법을 생각하게 해주는 책이에요.
'9788936456160':
  title: 위저드 베이커리 =구병모 장편소설 /Wizard bakery
  summary: 말을 더듬는 소년은 새엄마와 갈등을 겪다가 누명까지 쓰게 되자 집을 뛰쳐나가요. 우연히 신비한 마법 빵집에 들어가게 되고, 그곳에서
    소원을 이루어 주는 특별한 빵을 만드는 제빵사를 만나요. 소년은 자신의 힘든 처지를 되돌리기 위해 시간을 되돌리는 선택을 할지 고민하게 돼요.
    이야기를 통해 가족 안에서 벌어지는 상처와 오해, 그리고 진실을 마주하는 용기에 대해 생각하게 해줘요. 판타지와 현실이 섞인 독특한 분위기로
    많은 청소년들에게 사랑받은 소설이에요.
'9791196394509':
  title: 죽고 싶지만 떡볶이는 먹고 싶어 :백세희 에세이
  summary: 이 책은 작가가 오랫동안 마음의 우울함을 안고 살아온 이야기를 솔직하게 담은 에세이예요. 정신과 의사 선생님과 나눈 상담 대화를
    그대로 옮겨서 마음이 아픈 사람의 생각과 감정을 있는 그대로 보여줘요. 죽고 싶을 만큼 힘들면서도 떡볶이는 먹고 싶어 하는 것처럼, 우울함
    속에서도 삶은 계속된다는 걸 이야기해요. 마음이 아픈 것도 자연스러운 일이며 도움을 받아도 괜찮다는 걸 알려줘요. 힘든 감정을 솔직하게 나누는
    게 얼마나 중요한지 느끼게 해주는 책이에요.
'9788950942830':
  title: 이사도라 문
  summary: 이사도라 문은 엄마는 요정이고 아빠는 뱀파이어인 특별한 여자아이예요. 낮에는 인간 학교에, 밤에는 마법 학교에 다니며 두 세계를
    오가는 특별한 일상을 보내요. 요정의 마법과 뱀파이어의 능력을 함께 지녔지만 완벽하지 않아서 크고 작은 실수도 저지르곤 해요. 가족과 친구들과
    함께 다양한 사건을 겪으면서 무럭무럭 성장해 나가요. 서로 다른 두 세계 사이에서 자기다움을 찾아가는 사랑스러운 이야기예요.
'9788965590682':
  title: 윔피 키드
  summary: 그레그 헤플리는 평범한 중학생이지만 엄마의 권유로 하루하루 일기를 쓰기 시작해요. 인기도 없고 몸도 약한 그레그는 학교와 친구,
    가족 사이에서 겪는 크고 작은 사건들을 재치 있게 그림일기로 남겨요. 단짝 친구 라울리와 우정을 쌓으면서도 가끔 다투기도 하고, 형과 동생
    사이에서 억울한 일도 많이 겪어요. 유명해지고 싶고 멋있어 보이고 싶은 마음에 엉뚱한 사고를 치기도 하지만 결국 자기 모습 그대로도 괜찮다는
    걸 배워가요. 웃음 가득한 그림일기 형식으로 성장기 고민을 유쾌하게 풀어낸 이야기예요.
'9791168123335':
  title: 도그맨
  summary: 도그맨은 몸은 개, 머리도 개인데 사람처럼 두 발로 걷고 경찰 일을 하는 특별한 캐릭터예요. 원래 경찰견과 경찰관이었는데 큰 사고를
    당해 개의 머리와 사람의 몸을 이어붙여 탄생했어요. 냄새를 잘 맡는 개의 능력과 사람의 지혜를 함께 가진 도그맨은 마을에서 벌어지는 사건들을
    유쾌하게 해결해요. 말썽꾸러기 고양이 피티가 자꾸 나쁜 계획을 꾸미지만 도그맨은 특유의 엉뚱함과 착한 마음으로 이겨내요. 그림과 만화가 가득해서
    읽는 재미가 넘치는 시리즈예요.
'9791130618654':
  title: 리버 보이 :특별판
  summary: 제스는 할아버지가 편찮으시다는 소식을 듣고 가족과 함께 할아버지의 고향 마을로 여행을 떠나요. 화가였던 할아버지는 마지막으로 강가
    마을에서 그림을 완성하고 싶어 하시고, 제스는 그런 할아버지 곁을 지켜요. 강에서 수영을 하던 제스는 신비로운 소년을 만나 함께 시간을 보내며
    위로를 받아요. 할아버지의 마지막 그림 속에 담긴 의미를 깨달으면서 제스는 이별을 받아들이는 법을 배워가요. 삶과 죽음, 가족의 사랑을 잔잔하게
    그려낸 감동적인 이야기예요.
'9789810986988':
  title: "(The) Bad guys"
  summary: 늑대 아저씨는 사납게 생겼지만 사실 친구들과 함께 착한 사람이 되고 싶어 해요. 뱀, 상어, 피라냐 같은 무섭게 생긴 친구들이
    모여 나쁜 녀석 클럽을 만들었다가 착한 일을 해보기로 결심해요. 첫 도전으로 동물 보호소에 갇힌 강아지들을 구해 주려다가 큰 소동이 벌어져요.
    겉모습만 보고 나쁘다고 오해받던 친구들이 진짜 착한 마음을 보여 주려고 좌충우돌하는 이야기예요. 웃기면서도 겉모습보다 마음이 중요하다는 걸
    알려주는 이야기예요.
'9791195718832':
  title: 나쁜 어린이 표
  summary: 건우는 수업 시간에 떠들거나 장난쳤다는 이유로 선생님에게 자꾸 나쁜 어린이 표를 받아요. 표가 쌓이면 벌을 받아야 해서 건우는
    억울하고 속상한 마음이 커져요. 그러던 어느 날 건우는 몰래 선생님에게도 나쁜 선생님 표를 주기 시작해요. 아이의 눈으로 바라본 학교와 어른들의
    모습을 솔직하고 재미있게 보여주는 이야기예요. 벌보다 이해와 배려가 더 필요하다는 걸 생각하게 해주는 책이에요.
'9788979381184':
  title: 진짜 친구 :혼자가 아니라는 걸 기억해!
  summary: 이 책은 작가 섀넌 헤일이 어린 시절 겪은 진짜 이야기를 그림으로 담은 자전적 만화예요. 단짝 친구라고 믿었던 아이에게 따돌림을
    당하면서 섀넌은 마음에 큰 상처를 입어요. 여러 친구 무리를 옮겨 다니며 진짜 친구가 무엇인지 고민하고 외로움과 불안을 느껴요. 결국 자신을
    있는 그대로 좋아해 주는 친구를 만나면서 우정의 진짜 의미를 깨달아 가요. 친구 관계로 고민하는 어린이들의 마음에 깊이 공감되는 그래픽노블이에요.
'9788901033518':
  title: 돼지책
  summary: 피곳 씨네 가족은 엄마 혼자 요리와 청소, 집안일을 다 하는데도 아빠와 두 아들은 당연하게만 여겨요. 어느 날 엄마가 너희는 돼지야라는
    쪽지를 남기고 집을 나가 버려요. 엄마 없이 지내며 집이 엉망이 되고 나서야 가족들은 자신들이 얼마나 엄마에게 의지해 왔는지 깨달아요. 돌아온
    엄마와 함께 이제는 온 가족이 집안일을 나누어 하기로 해요. 가족 안의 역할과 평등에 대해 생각하게 해주는 유명한 그림책이에요.
'9788950949945':
  title: 이사도라 문
  summary: 이사도라 문은 엄마는 요정이고 아빠는 뱀파이어인 특별한 여자아이예요. 낮에는 인간 학교에, 밤에는 마법 학교에 다니며 두 세계를
    오가는 특별한 일상을 보내요. 요정의 마법과 뱀파이어의 능력을 함께 지녔지만 완벽하지 않아서 크고 작은 실수도 저지르곤 해요. 가족과 친구들과
    함께 다양한 사건을 겪으면서 무럭무럭 성장해 나가요. 서로 다른 두 세계 사이에서 자기다움을 찾아가는 사랑스러운 이야기예요.
'9788958280378':
  title: 사라, 버스를 타다
  summary: 사라는 흑인이라는 이유로 버스 뒷자리에만 앉아야 했던 시절, 어느 날 용기를 내어 버스 앞자리에 앉아요. 기사님은 화를 내며 그만두라고
    하지만 사라는 자리를 옮기지 않고 그대로 앉아 있어요. 사라의 작은 용기는 사람들에게 큰 울림을 주고, 흑인들이 버스를 타지 않는 운동으로
    번져 나가요. 결국 사람들의 노력으로 버스에서 인종에 따라 자리를 나누던 부당한 규칙이 사라지게 돼요. 용기와 평등에 관한 감동적인 그림책이에요.
'9791130665405':
  title: Who? 김구
  summary: 이 책은 우리나라의 독립을 위해 평생을 바친 백범 김구 선생님의 삶을 만화로 쉽게 보여주는 위인전이에요. 가난한 어린 시절부터
    나라를 되찾기 위해 독립운동에 뛰어들기까지의 과정을 그려요. 일본의 감시와 위협 속에서도 상하이 임시정부를 이끌며 끝까지 조국의 독립을 포기하지
    않았던 모습을 보여줘요. 광복 후에도 통일된 나라를 위해 애쓰다 안타깝게 생을 마감한 이야기까지 담고 있어요. 어린이들에게 나라 사랑과 용기의
    의미를 알려주는 위인전이에요.
'9791136401267':
  title: 나 혼자만 레벨업 =추공 장편소설 /Only I level up
  summary: 성진우는 세상에서 가장 약한 사냥꾼이라고 놀림받는 E급 헌터예요. 어느 날 위험한 던전에서 죽음 직전까지 갔다가 살아난 뒤, 성진우에게만
    보이는 신비한 시스템이 생겨요. 이 시스템 덕분에 성진우는 다른 사람과 달리 끝없이 강해질 수 있는 특별한 능력을 갖게 돼요. 스스로 사냥과
    훈련을 거듭하며 세상에서 가장 약했던 헌터가 점점 최강의 존재로 성장해 가요. 짜릿한 성장과 전투 장면으로 큰 인기를 끈 판타지 이야기예요.
'9791136401274':
  title: 나 혼자만 레벨업 =추공 장편소설 /Only I level up
  summary: 성진우는 세상에서 가장 약한 사냥꾼이라고 놀림받는 E급 헌터예요. 어느 날 위험한 던전에서 죽음 직전까지 갔다가 살아난 뒤, 성진우에게만
    보이는 신비한 시스템이 생겨요. 이 시스템 덕분에 성진우는 다른 사람과 달리 끝없이 강해질 수 있는 특별한 능력을 갖게 돼요. 스스로 사냥과
