'9788950999544':
  title: 이사도라 문
  summary: 이사도라 문은 엄마는 요정이고 아빠는 뱀파이어인 특별한 여자아이예요. 낮에는 인간 학교에, 밤에는 마법 학교에 다니며 두 세계를
    오가는 특별한 일상을 보내요. 요정의 마법과 뱀파이어의 능력을 함께 지녔지만 완벽하지 않아서 크고 작은 실수도 저지르곤 해요. 가족과 친구들과
    함께 다양한 사건을 겪으면서 무럭무럭 성장해 나가요. 서로 다른 두 세계 사이에서 자기다움을 찾아가는 사랑스러운 이야기예요.
'9788956604992':
  title: 7년의 밤 :정유정 장편소설
  summary: 어느 날 최현수는 실수로 자동차 사고를 낸 뒤 당황한 나머지 돌이킬 수 없는 큰 잘못을 저지르고 말아요. 그 사고로 딸을 잃은
    마을 사람 오영제는 깊은 분노와 슬픔에 빠져 현수와 그의 가족에게 무서운 복수를 다짐해요. 이야기는 사건이 일어난 그날 밤과 그 후 오랜 시간이
    지난 뒤를 오가며 감춰졌던 진실을 하나씩 밝혀내요. 서로에게 상처를 주고받는 두 가족의 이야기를 통해 죄책감과 용서에 대해 깊이 생각하게 해요.
    긴장감 넘치는 전개로 큰 화제가 되었던 한국 소설이에요.
'9791130681115':
  title: 복면공주
  summary: 얌전한 공주 마곳은 사실 밤이 되면 까만 옷을 입고 몬스터를 물리치는 비밀 영웅 복면공주로 변신해요. 왕국에 몬스터가 나타날 때마다
    공주는 몰래 빠져나가 힘차게 싸우고 다시 얌전한 공주로 돌아와요. 이웃 나라 공주가 놀러 왔다가 마곳의 비밀을 눈치채면서 이야기가 더 재미있어져요.
    얌전한 공주 이미지 뒤에 숨겨진 용감하고 씩씩한 모습을 보여주는 유쾌한 이야기예요. 여자아이도 얼마든지 강하고 멋진 영웅이 될 수 있다는 걸
    보여줘요.
'9788933870839':
  title: "(설민석의) 삼국지 :누구나 쉽게 시작하고 모두가 빠져드는 이야기"
  summary: 중국이 위, 촉, 오 세 나라로 나뉘어 서로 힘을 겨루던 시대를 배경으로 한 이야기예요. 유비, 관우, 장비는 복숭아밭에서 의형제를
    맺고 힘을 합쳐 어지러운 세상을 구하기로 결심해요. 지혜로운 제갈량이 유비를 도와 여러 전투에서 뛰어난 전략을 펼치며 촉나라를 세우는 데 큰
    공을 세워요. 조조, 손권 등 각기 다른 인물들이 저마다의 야망과 지혜로 천하를 놓고 다투는 모습이 펼쳐져요. 의리와 지혜, 영웅들의 파란만장한
    삶을 담은 중국의 대표적인 고전이에요.
'9791161570341':
  title: 갈매기의 꿈
  summary: 갈매기 조나단은 다른 갈매기들처럼 먹이를 구하기 위해서가 아니라 하늘을 나는 것 자체가 좋아서 날마다 나는 연습을 해요. 무리의
    규칙을 어기고 혼자 이상한 비행을 한다는 이유로 조나단은 무리에서 쫓겨나고 말아요. 그래도 조나단은 포기하지 않고 더 높이, 더 빠르게, 더
    아름답게 나는 법을 끝없이 연구해요. 시간이 흘러 조나단은 자신처럼 진정한 비행을 꿈꾸는 다른 갈매기들을 만나 그들에게 나는 법을 가르쳐 줘요.
    꿈을 향한 도전과 자유의 의미를 생각하게 해주는 유명한 이야기예요.
'9791171172955':
  title: 이사도라 문
  summary: 이사도라 문은 엄마는 요정이고 아빠는 뱀파이어인 특별한 여자아이예요. 낮에는 인간 학교에, 밤에는 마법 학교에 다니며 두 세계를
    오가는 특별한 일상을 보내요. 요정의 마법과 뱀파이어의 능력을 함께 지녔지만 완벽하지 않아서 크고 작은 실수도 저지르곤 해요. 가족과 친구들과
    함께 다양한 사건을 겪으면서 무럭무럭 성장해 나가요. 서로 다른 두 세계 사이에서 자기다움을 찾아가는 사랑스러운 이야기예요.
'9791155818374':
  title: 미요의 신비한 고전책방 :만화 춘향전
  summary: 기생의 딸 춘향이는 그네를 타다가 양반집 도련님 이몽룡을 만나 서로 사랑에 빠지고 몰래 부부의 연을 맺어요. 이몽룡이 과거를 보러
    한양으로 떠난 뒤, 새로 부임한 못된 사또 변학도가 춘향이에게 수청을 들라며 괴롭혀요. 춘향이는 죽음을 각오하면서도 끝까지 이몽룡을 향한 마음을
    지키며 사또의 말을 따르지 않아요. 과거에 급제한 이몽룡이 암행어사가 되어 몰래 돌아와 변학도를 벌하고 춘향이를 구해 줘요. 신분을 뛰어넘는
    사랑과 지조를 그린 우리나라의 대표 고전을 만화로 재미있게 풀어낸 책이에요.
'9788936456221':
  title: 우아한 거짓말 :김려령 장편소설
  summary: 중학생 천지는 어느 날 갑자기 세상을 떠나고, 남겨진 엄마와 언니 만지는 그 이유를 알 수 없어 슬픔에 빠져요. 언니 만지는 동생이
    남긴 흔적들을 하나씩 따라가며 천지에게 무슨 일이 있었는지 알아 가기 시작해요. 그 과정에서 친구 화연이가 겉으로는 다정한 척하면서 은밀하게
    천지를 따돌리고 상처를 줬다는 사실이 드러나요. 다정한 말 뒤에 숨겨진 교묘한 괴롭힘이 얼마나 무서운지, 그걸 알아채는 게 얼마나 어려운지를
    보여줘요. 친구 사이의 진심과 배려에 대해 깊이 생각하게 하는 소설이에요.
'9788954699914':
  title: 하얼빈 :김훈 장편소설
  summary: 1909년, 안중근은 우리나라를 빼앗으려 한 일본의 정치인 이토 히로부미를 막기 위해 하얼빈 역으로 향해요. 오랜 시간 나라를
    되찾기 위해 고민하고 훈련해 온 안중근은 결국 하얼빈 역에서 이토 히로부미를 향해 총을 쏘아요. 이 소설은 안중근의 결단에 이르기까지의 마음과
    고뇌, 주변 사람들의 이야기를 촘촘하게 그려내요. 거사 이후 재판을 받으면서도 당당했던 안중근의 신념과 용기를 보여줘요. 실제 역사적 사건을
    바탕으로 나라를 지키려 한 한 인물의 삶을 깊이 있게 다룬 소설이에요.
'9788983926296':
  title: 해리포터 :스페셜 리허설 에디션 대본
  summary: 어른이 된 해리포터의 아들 알버스는 유명한 아빠의 그림자에 가려 힘들어하며 호그와트에 입학해요. 알버스는 원수 집안이었던 말포이의
    아들 스코피우스와 뜻밖에 단짝 친구가 돼요. 둘은 아빠 해리가 겪은 아픈 과거를 되돌리고 싶은 마음에 몰래 타임터너를 이용해 시간을 거슬러
    올라가요. 하지만 과거를 바꾸려는 시도가 예상치 못한 위험한 결과를 불러오면서 큰 사건에 휘말리게 돼요. 아버지와 아들, 우정과 선택에 대해
    생각하게 해주는 해리포터 이야기의 새로운 편이에요.
'9791173820113':
  title: 나 혼자만 레벨업
  summary: 성진우는 세상에서 가장 약한 사냥꾼이라고 놀림받는 E급 헌터예요. 어느 날 위험한 던전에서 죽음 직전까지 갔다가 살아난 뒤, 성진우에게만
    보이는 신비한 시스템이 생겨요. 이 시스템 덕분에 성진우는 다른 사람과 달리 끝없이 강해질 수 있는 특별한 능력을 갖게 돼요. 스스로 사냥과
    훈련을 거듭하며 세상에서 가장 약했던 헌터가 점점 최강의 존재로 성장해 가요. 짜릿한 성장과 전투 장면으로 큰 인기를 끈 판타지를 만화로 그린
    이야기예요.
'9788952783509':
  title: 꽃들에게 희망을 (반양장)
  summary: 노랑 애벌레는 하늘 높이 치솟은 커다란 기둥을 발견하고 수많은 애벌레들과 함께 꼭대기를 향해 기어오르기 시작해요. 서로를 밟고
    올라서야 하는 냉혹한 경쟁 속에서 노랑 애벌레는 줄무늬 애벌레를 만나 사랑에 빠지지만 결국 각자의 길을 선택하게 돼요. 무작정 오르기만 하던
    노랑 애벌레는 문득 이 경쟁이 정말 의미 있는 것인지 의문을 품게 돼요. 고치가 되어 기다리는 것이 무섭고 두렵지만 노랑 애벌레는 진짜 나비가
    되기 위한 용기를 내기로 해요. 결국 아름다운 나비가 되어 진정한 자유와 희망이 무엇인지 보여주는 이야기예요.
'9791136401243':
  title: 나 혼자만 레벨업 =추공 장편소설 /Only I level up
  summary: 성진우는 세상에서 가장 약한 사냥꾼이라고 놀림받는 E급 헌터예요. 어느 날 위험한 던전에서 죽음 직전까지 갔다가 살아난 뒤, 성진우에게만
    보이는 신비한 시스템이 생겨요. 이 시스템 덕분에 성진우는 다른 사람과 달리 끝없이 강해질 수 있는 특별한 능력을 갖게 돼요. 스스로 사냥과
    훈련을 거듭하며 세상에서 가장 약했던 헌터가 점점 최강의 존재로 성장해 가요. 짜릿한 성장과 전투 장면으로 큰 인기를 끈 판타지 이야기예요.
'9788966071739':
  title: 꼬마 흡혈귀
  summary: 소년 안톤은 어느 날 밤 창문 너머로 자신과 나이가 비슷한 흡혈귀 소년 뤼디거를 만나 신비한 우정을 쌓기 시작해요. 뤼디거는 낮에는
    관 속에서 자고 밤에만 돌아다니는 진짜 흡혈귀지만 사람을 해치지 않는 장난꾸러기예요. 안톤은 무섭기도 하지만 뤼디거의 세계가 궁금해서 밤마다
    몰래 만나며 특별한 모험을 함께해요. 뤼디거의 흡혈귀 가족들과도 얽히면서 인간과 흡혈귀 사이의 우정이 점점 깊어져요. 서로 다른 세계의 두
    친구가 나누는 따뜻하고 유쾌한 우정 이야기예요.
'9788965138082':
  title: 말더듬이 악어의 멋진 연설
  summary: 악어는 말을 더듬는 버릇 때문에 사람들 앞에서 말하는 걸 늘 두려워하고 부끄러워해요. 그러던 어느 날 악어는 많은 이들 앞에서
    중요한 연설을 해야 하는 상황에 놓이게 돼요. 더듬거리며 힘겹게 말을 이어가던 악어는 포기하지 않고 자신의 진심을 끝까지 전하려고 애써요.
    완벽하지 않은 말투였지만 진심이 담긴 악어의 연설은 듣는 이들의 마음을 움직여요. 다르다는 것이 부끄러운 게 아니라는 걸 따뜻하게 알려주는
    그림책이에요.
'9788925560960':
  title: "(쓸쓸하고 찬란하神) 도깨비 :드라마 원작소설"
  summary: 김신은 고려 시대 장군이었지만 죽지 않는 도깨비가 되는 저주를 받아 수백 년을 홀로 살아가요. 저주를 끝내려면 자신을 볼 수 있고
    도깨비 신부라 불리는 사람을 찾아 가슴에 박힌 칼을 뽑아야 해요. 우연히 만난 소녀 은탁이 바로 그 도깨비 신부라는 걸 알게 되면서 둘 사이에
    특별한 인연이 시작돼요. 저승사자와 얽히고설킨 사연 속에서 김신과 은탁은 서로에게 마음을 열고 사랑하게 돼요. 영원한 삶과 죽음, 운명적인
    사랑을 그린 인기 드라마를 소설로 옮긴 이야기예요.
'9788989646488':
  title: 엄마 까투리
  summary: 엄마 까투리는 아홉 마리 아기 꿩들을 데리고 산속에서 먹이를 구하며 살아가요. 어느 날 갑자기 산에 불이 나서 엄마와 아기들이
    모두 위험에 빠지게 돼요. 엄마 까투리는 아기들을 지키기 위해 자기 몸으로 불을 막아내며 끝까지 아기들을 보호해요. 엄마의 희생 덕분에 아기
    꿩들은 무사히 살아남지만 엄마는 큰 상처를 입고 말아요. 자식을 향한 엄마의 깊은 사랑을 뭉클하게 보여주는 그림책이에요.
'9791191114225':
  title: 작별인사 :김영하 장편소설
  summary: 철이는 연구소에서 아빠와 단둘이 살아가는 평범한 소년인 줄 알았는데, 어느 날 자신이 사람이 아니라 정교하게 만들어진 휴머노이드
    로봇이라는 사실을 알게 돼요. 인간이 아니라는 이유로 낯선 시설에 갇힌 철이는 그곳에서 자신과 처지가 비슷한 로봇, 클론 친구들을 만나요.
    몸은 기계라도 누군가를 그리워하고 슬퍼하는 마음만은 진짜였던 철이는 진짜 인간다움이 무엇인지 고민하게 돼요. 가까운 미래를 배경으로 나는 누구인가라는
    질문을 잔잔하지만 깊게 던지는 이야기예요.
'9788957363027':
  title: "(만화로 보는)그리스 로마 신화"
  summary: 그리스 로마 신화는 하늘과 바다와 땅을 다스리는 제우스, 헤라, 포세이돈 같은 올림포스 신들의 이야기를 담고 있어요. 헤라클레스처럼
    힘센 영웅이 괴물을 무찌르는 모험담도 있고, 페르세우스가 메두사를 물리치는 이야기도 나와요. 신들끼리 다투기도 하고 인간을 돕거나 벌주기도
    하면서 벌어지는 다채로운 사건들이 흥미진진하게 펼쳐져요. 오랜 옛날 그리스와 로마 사람들이 세상이 어떻게 생겨났다고 믿었는지 엿볼 수 있는
    재미있는 이야기 모음집이에요.
'9791130691909':
  title: 복면공주
  summary: 마그놀리아 공주는 낮에는 얌전하고 우아한 공주지만, 몬스터가 나타나면 검은 옷을 입고 복면공주로 변신해서 몬스터를 물리치는 비밀
    영웅이에요. 아무도 복면공주의 진짜 정체를 몰라야 하기 때문에 공주는 손님을 맞이하다가도 몰래 빠져나가 싸우고 다시 돌아오느라 늘 진땀을 빼요.
    어느 날 눈치 빠른 다른 공주가 자꾸 이상한 낌새를 알아차리면서 비밀을 들킬 위기에 처하기도 해요. 공주도 얼마든지 씩씩한 영웅이 될 수 있다는
    걸 유쾌하게 보여 주는 이야기예요.
'9788994749617':
  title: "(명탐정) 셜록 홈즈"
  summary: 셜록 홈즈는 런던에 사는 최고의 명탐정으로, 친구인 왓슨 박사와 함께 어려운 사건들을 해결해요. 홈즈는 작은 단서 하나도 놓치지
    않는 날카로운 관찰력과 추리력으로 범인을 척척 찾아내요. 사라진 보석부터 이상한 사건까지 다양한 미스터리가 등장해서 읽는 내내 손에 땀을 쥐게
    해요. 논리적으로 생각하는 재미를 알려 주는 세계적으로 유명한 추리 소설이에요.
'9788987721118':
  title: "(황순원 단편집)소나기"
  summary: 시골에 사는 소년은 개울가에서 서울에서 놀러 온 윤 초시네 증손녀 소녀를 만나 마음이 두근거리기 시작해요. 둘은 함께 산으로 놀러
    가고, 갑자기 소나기를 만나 원두막에서 비를 피하며 더욱 가까워져요. 그런데 그날 이후 소녀가 몹시 앓아누웠다는 소식이 들려오고, 소년은 애타는
    마음으로 소녀를 걱정해요. 짧지만 순수한 첫사랑의 설렘과 아픔을 아름답게 그린 우리나라를 대표하는 소설이에요.
'9788954679633':
  title: 정년이
  summary: 목포에서 살던 소녀 정년이는 뛰어난 소리 실력을 가지고 있지만 형편이 어려워 꿈을 마음껏 펼치지 못해요. 서울로 올라간 정년이는
    우리나라 전통 공연인 국극 단체에 들어가 본격적으로 배우의 길을 걷기 시작해요. 실력 있는 라이벌들과 부딪히고 좌절도 겪지만 타고난 재능과
    노력으로 조금씩 무대의 주인공으로 성장해 나가요. 꿈을 향해 씩씩하게 나아가는 정년이의 이야기가 감동을 주는 작품이에요.
'9791136401236':
  title: 나 혼자만 레벨업 =추공 장편소설 /Only I level up
  summary: 진우는 몬스터를 사냥해 세상을 지키는 헌터들 중에서도 가장 약한 최하급 헌터로 늘 무시당해요. 어느 날 위험한 이중 던전에서 죽을
    뻔한 위기를 넘긴 진우는 자신에게만 보이는 신비한 시스템 창을 얻게 돼요. 그 시스템 덕분에 진우는 게임 캐릭터처럼 사냥을 할 때마다 점점
    더 강해지는 레벨업을 하게 돼요. 아무도 주목하지 않던 약자가 세상에서 가장 강한 존재로 성장해 가는 짜릿한 이야기예요.
'9788983925367':
  title: 해리포터 :아즈카반의 죄수
  summary: 해리포터는 호그와트 마법학교 3학년이 되었는데, 탈옥한 위험한 죄수 시리우스 블랙이 자신을 노리고 있다는 소식을 듣게 돼요. 학교
    주변에는 사람의 행복한 기억을 빨아들이는 무서운 디멘터들이 지키고 서 있어서 해리는 늘 긴장 속에 지내요. 하지만 이야기가 진행될수록 시리우스
    블랙에 대한 놀라운 진실과 해리 부모님의 숨겨진 이야기가 하나씩 밝혀져요. 반전과 우정, 마법이 가득한 해리포터 시리즈의 세 번째 이야기예요.
'9791169630436':
  title: 화산귀환
  summary: 화산파 최고의 고수였던 매화검존은 마지막 순간 제자들을 지키다가 목숨을 잃지만, 백 년 뒤 몰락한 화산파의 어리고 약한 제자의
    몸으로 다시 눈을 뜨게 돼요. 예전의 실력과 기억을 고스란히 간직한 그는 형편없이 기울어 버린 화산파를 다시 일으켜 세우기로 결심해요. 뛰어난
    무공 실력을 숨긴 채 사문의 사형제들과 부딪히고 강호의 여러 세력과도 맞서며 벌어지는 무협 이야기예요. 통쾌한 무공 대결과 의리가 돋보이는
    인기 만화예요.
