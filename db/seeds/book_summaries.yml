'9791175485334':
  title: 흔한남매 이상한 나라의 고전 읽기
  summary: 흔이와 한이 남매가 이야기 속으로 풍덩 빠져들어 유명한 고전 작품들을 직접 체험해요. 티격태격하면서도 이야기 속 인물들과 함께
    사건을 겪으며 고전의 내용을 자연스럽게 알아가지요. 어렵게만 느껴지던 고전이 남매의 유쾌한 모험 덕분에 친근하게 다가와요. 웃으면서 읽다 보면
    어느새 고전의 줄거리와 교훈까지 익힐 수 있어요.
'9788950976859':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 손오공이 신비한 한자의 힘을 빌려 요괴들과 맞서 싸우는 한자 학습 만화예요. 한자를 큰 소리로 외치면 그 뜻과 소리에 맞는 신기한
    마법이 펼쳐져요. 위기에 빠질 때마다 한자의 도움으로 지혜롭게 문제를 해결해 나가요. 손오공과 친구들의 좌충우돌 모험을 따라가다 보면 어느새
    한자를 재미있게 익힐 수 있어요.
