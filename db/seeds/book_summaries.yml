    흥미진진하게 펼쳐져요. 서양 문화와 예술 작품 곳곳에 녹아 있는 그리스 로마 신화를 쉽고 재미있게 이해할 수 있도록 도와줘요. 상상력 넘치는
    신화 세계를 만나며 교양도 함께 쌓을 수 있는 책이에요.
'9791164135691':
  title: 윔피 키드
  summary: 그레그 헤플리는 중학교에 막 입학한 소심하고 엉뚱한 남학생으로, 자기가 겪는 학교생활을 그림일기처럼 솔직하게 적어 나가요. 덩치
    크고 자기를 놀리는 형과 늘 사고를 몰고 다니는 단짝 친구 라울리 때문에 하루하루가 소란스러워요. 인기 많은 아이가 되고 싶어 이런저런 엉뚱한
    계획을 세우지만 대부분 우스꽝스럽게 실패하고 말아요. 과장된 그림과 재치 있는 글이 함께 있어 술술 읽히는 게 매력이에요. 평범한 아이의 좌충우돌
    일상을 유쾌하게 보여 주는 인기 시리즈예요.
