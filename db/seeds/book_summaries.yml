'9788934983439':
  title: '흔한남매 과학 탐험대 3 : 인체'
  summary: 흔한남매 과학 탐험대 세 번째 이야기는 우리 몸속을 탐험하는 신나는 여행이에요. 으뜸이와 에이미가 우리의 뼈, 근육, 소화 기관
    등 인체의 비밀을 재미있게 알려줄 거예요. 만화와 퀴즈를 풀면서 과학 지식을 쏙쏙 배울 수 있답니다. 우리 몸이 어떻게 움직이고 왜 중요한지
    흔한남매와 함께 알아봐요. 우리 몸의 신비로운 능력에 깜짝 놀라게 될 거예요.
'9788934989257':
  title: 흔한남매 과학 탐험대
  summary: 으뜸이와 에이미 흔한남매가 이번에는 과학 탐험을 떠나요. 재미있는 사건들을 겪으면서 우리 주변의 다양한 과학 원리들을 배우게 된답니다.
    흔한남매 특유의 유쾌한 개그와 함께 과학 상식을 쉽고 재미있게 익힐 수 있어요. 생활 속에서 궁금했던 과학 질문들을 함께 풀어가며 과학과 더욱
    친해질 수 있는 책입니다. 흥미진진한 모험을 따라가다 보면 어느새 과학 박사가 된 기분일 거예요.
'9788934991991':
  title: 내 멋대로 반려동물 뽑기
  summary: 지유는 강아지를 키우고 싶지만 엄마 아빠가 반대해서 늘 아쉬워해요. 그러던 어느 날, 지유는 신기한 문구점에서 자기 마음대로 반려동물을
    뽑을 수 있는 기계를 발견해요. 지유는 이 기계로 정말 특별하고 상상 속에서만 존재할 것 같은 동물들을 뽑게 된답니다. 뽑은 반려동물들과 함께
    지내며 지유는 여러 가지 즐거운 일들과 책임감을 배우게 돼요. 이 책은 특별한 반려동물들과의 만남을 통해 따뜻한 감동과 교훈을 주는 이야기예요.
'9788934993483':
  title: "(내 멋대로) 친구 뽑기"
  summary: 주아는 단짝 친구가 이사 가서 외롭고 심심했어요. 어느 날 주아는 자기 마음대로 친구를 뽑을 수 있는 특별한 기계를 발견하게 됩니다.
    처음에는 자기 말에 무조건 동의하고 뭐든지 잘하는 친구들을 뽑아서 좋았어요. 하지만 완벽해 보이는 친구들과 지내면서 진짜 친구는 이런 게 아니라는
    걸 깨닫게 돼요. 서로 다른 점을 인정하고 함께 어울려 노력해야 진정한 친구가 될 수 있다는 소중한 이야기에요.
'9788934993711':
  title: 내 멋대로 아빠 뽑기
  summary: 유리에게는 좀 특별한 아빠가 있어요. 아빠는 유리를 위해 마법사, 우주 비행사, 인어공주 등 다양한 모습으로 변신하곤 했죠. 친구들에게
    들킬까 봐 걱정하는 유리와 달리, 아빠는 매번 멋진 변신으로 유리를 깜짝 놀라게 해요. 아빠의 독특한 행동 때문에 유리는 가끔 창피하기도 하지만,
    사실 그 모든 변신은 유리를 향한 아빠의 깊은 사랑이었어요. 유리는 아빠의 진짜 마음을 깨닫고, 세상에 하나뿐인 멋진 아빠를 진심으로 이해하게
    된답니다.
'9788934993865':
  title: 내 멋대로 나 뽑기
  summary: 여름이는 평범한 자기 모습이 마음에 들지 않아 고민이 많았어요. 어느 날, 신기한 뽑기 기계를 만나게 되는데, 그 기계는 예쁜
    나, 똑똑한 나처럼 다양한 '나'를 뽑을 수 있게 해주었죠. 여름이는 뽑기에서 나온 다른 모습의 나로 살아보면서 새로운 경험들을 해요. 하지만
    다른 모습으로 살아보니 예상치 못한 어려움도 겪고, 진짜 자기 모습이 그리워지기 시작했어요. 결국 여름이는 가장 소중한 건 있는 그대로의 '나'
    자신이라는 걸 깨닫게 되는 따뜻한 이야기예요.
'9788936433635':
  title: 완득이 :김려령 장편소설
  summary: 완득이는 공부도 별로고, 반항적인 고등학생으로 보여요. 하지만 완득이에게는 가난한 환경과 장애인 아빠 등 남들에게 말 못 할 힘든
    사정이 많았어요. 담임 선생님인 동주는 늘 완득이를 귀찮게 하는 듯했지만, 사실은 완득이를 누구보다 아끼고 있었어요. 선생님의 도움으로 킥복싱을
    배우고, 오래전 헤어진 필리핀 엄마도 다시 만나게 되면서 완득이의 삶은 변하기 시작해요. 완득이는 선생님과 주변 사람들의 관심 속에서 세상에
    마음을 열고 조금씩 성장하며 자기만의 길을 찾아가는 이야기입니다.
'9788936434120':
  title: 소년이 온다 :한강 장편소설
  summary: 이 책은 1980년 한국의 광주라는 도시에서 일어난 가슴 아픈 이야기를 담고 있어요. 당시 많은 사람이 용기를 내어 중요한 것을
    지키려 했지만, 슬프고 아픈 일들을 겪게 되었죠. 이 소설은 그 사건 속에서 사라진 어린 소년과, 그 일을 겪은 사람들의 아픔과 기억을 이야기해요.
    우리는 이 이야기를 통해 인간의 존엄성과, 어려운 상황 속에서도 잊지 말아야 할 것들에 대해 생각해 볼 수 있답니다.
'9788936434267':
  title: 아몬드 :손원평 장편소설
  summary: 이 책은 감정을 느끼지 못하는 소년, 윤재의 이야기예요. 윤재는 슬프거나 기뻐도 그 감정을 이해하거나 표현하지 못해서 다른 사람들과
    조금 다르게 보였어요. 사랑하는 엄마와 할머니가 윤재를 많이 도와주셨지만, 어느 날 갑자기 슬픈 일이 생기면서 윤재는 혼자가 되었어요. 그러다
    마음속에 상처를 가진 곤이라는 친구를 만나게 되고, 곤이와 함께 여러 경험을 하면서 윤재는 조금씩 감정을 배우기 시작해요. 이 이야기는 우리가
    서로를 이해하고, 감정을 알아가면서 성장하는 멋진 과정을 보여준답니다.
'9788936447014':
  title: 아홉 살 마음 사전
  summary: 이 책은 우리 마음속에 있는 여러 가지 감정들을 재미있게 알려주는 사전 같은 책이에요. '뿌듯하다', '서운하다', '후련하다'
    같은 다양한 기분들을 하나하나 설명해 준답니다. 예쁜 시와 함께 감정이 느껴지는 순간들을 그림으로도 보여줘요. 이 책을 읽으면 내가 어떤 마음인지
    더 잘 알게 되고, 친구나 가족에게 내 기분을 말하기도 쉬워질 거예요. 마치 우리 마음을 이해하는 비밀 열쇠 같답니다.
'9788936447694':
  title: 고양이 해결사 깜냥
  summary: 깜냥이는 특별한 고양이 해결사예요. 고양이 신령님의 부탁을 받고 등에 가방을 메고 사람들의 고민을 들어주고 해결해 주기 위해 나타났답니다.
    때로는 붕어빵 아저씨의 붕어빵을 팔아주기도 하고, 때로는 잃어버린 물건을 찾아주기도 하면서 여러 가지 심부름을 해요. 깜냥이의 지혜롭고 따뜻한
    도움 덕분에 마을 사람들은 다시 웃음을 찾고 행복해진답니다. 오늘도 깜냥이는 다음 심부름을 찾아 동네 골목을 누비며 사람들을 돕는답니다.
'9788936447861':
  title: 고양이 해결사 깜냥
  summary: 깜냥은 평범한 길고양이였지만, 우연히 사람들의 고민을 해결해주는 '해결사' 배지를 얻게 돼요. 고양이 해결사 깜냥은 작고 사소해
    보이는 고민이라도 그냥 지나치지 않아요. 날카로운 눈썰미와 재빠른 몸놀림, 고양이만의 특별한 방식으로 사람들의 문제를 척척 해결해 준답니다.
    잃어버린 물건을 찾아주거나, 마음이 아픈 사람을 위로해주면서 따뜻한 위로와 기쁨을 전하죠. 깜냥 덕분에 동네는 점점 더 활기차고 행복한 곳으로
    변해가요. 깜냥의 유쾌하고 감동적인 해결사 활동 이야기가 펼쳐진답니다.
'9788936448011':
  title: 고양이 해결사 깜냥
  summary: 깜냥이는 밤마다 특별한 택배를 배달하는 고양이 택배 기사예요. 우연히 택배 상자를 열어 본 깜냥이는 상자 속 물건들이 가진 비밀스러운
    이야기를 듣게 된답니다. 깜냥이는 그 물건들을 배달하면서 만나는 사람들의 크고 작은 어려움을 자신만의 방법으로 지혜롭게 해결해 줘요. 외로운
    사람에게 친구가 되어주고, 고민이 있는 아이에게 용기를 주는 등 깜냥이의 활약이 펼쳐져요. 이 책은 다른 사람의 마음을 헤아리고 도와주는 따뜻한
    마음이 얼마나 소중한지 알려준답니다.
'9788936448097':
  title: 위풍당당 여우 꼬리
  summary: 한여름은 엉덩이에 마치 여우 꼬리처럼 특별한 털뭉치를 가지고 태어났어요. 이 꼬리 때문에 친구들에게 놀림을 받고 스스로 부끄러워하며
    숨기고 싶어 했죠. 하지만 어느 날, 여름이는 특별한 친구들을 만나면서 자기 꼬리에 대해 다시 생각하게 돼요. 자신에게 있는 조금 다른 점이
    부끄러운 것이 아니라 아주 특별하고 멋진 것임을 깨닫게 된답니다. 이 책은 다른 사람과 달라도 괜찮고, 스스로를 사랑하는 마음이 가장 중요하다는
    것을 알려주는 이야기예요.
'9788936448134':
  title: 고양이 해결사 깜냥
  summary: 깜냥은 보통 고양이가 아니에요. 사람들의 고민을 해결해 주는 특별한 해결사 고양이랍니다. 매일 새로운 동네로 출근해서 여러 가지
    어려운 일들을 만나게 돼요. 물건이 없어진 가게를 돕거나, 친구들의 다툼을 말리거나, 외로운 사람을 위로해 주기도 해요. 깜냥은 뛰어난 관찰력과
    지혜로 사람들의 문제를 해결하고, 아무도 모르게 다음 임무를 찾아 떠나요. 이 책을 읽으면 따뜻한 마음과 친구를 돕는 기쁨을 느낄 수 있을
    거예요.
'9788936448172':
  title: 위풍당당 여우 꼬리
  summary: 주인공 여우 '꼬리'는 다른 동물들과 달리 인간 세상에 살아가며 자신의 꼬리를 부끄러워해요. 사람들이 꼬리의 꼬리를 보고 놀랄까
    봐 항상 숨기려고 애썼죠. 꼬리는 학교에서 새로운 친구들을 만나고 특별한 사건들을 겪으면서 많은 것을 깨닫게 돼요. 그러면서 자신의 꼬리가
    결코 부끄러운 것이 아니라, 오히려 자신만의 멋진 개성이라는 것을 알아갑니다. 이 책은 자신을 있는 그대로 받아들이고 사랑하는 용기에 대해
    이야기해 주는 따뜻한 동화예요.
'9788936448264':
  title: 위풍당당 여우 꼬리
  summary: 이 책은 다른 여우들처럼 풍성한 꼬리가 없어서 늘 자신감 없는 아기 여우 '꼬리'의 이야기예요. 꼬리는 예쁜 꼬리를 찾아 자신만의
    특별한 모험을 떠나고, 그 과정에서 여러 친구들을 만나요. 꼬리는 다른 동물 친구들의 멋진 꼬리를 부러워하기도 하지만, 점차 자신의 모습 그대로를
    사랑하는 법을 깨닫게 된답니다. 진짜 위풍당당함은 남과 비교하는 것이 아니라 자기 자신을 소중히 여기는 마음에서 나온다는 것을 배우는 따뜻한
    이야기예요.
'9788936448370':
  title: 고양이 해결사 깜냥
  summary: 고양이 해결사 깜냥은 심부름센터에서 온 특별한 고양이예요. 깜냥이는 마트나 학교 등 여러 곳에 나타나 사람들의 어려운 고민을 듣고
    해결해 준답니다. 때로는 물건을 찾아주거나 잃어버린 마음을 찾아주기도 해요. 고양이만의 재치 있고 따뜻한 방법으로 문제를 해결해서 모두를 행복하게
    만들어 줍니다. 깜냥이의 멋진 활약을 보면 우리 마음도 따뜻해질 거예요.
'9788936448424':
  title: 달콤 짭짤 코파츄 :다영 과학동화
  summary: 이 책은 달콤하고 짭짤한 맛의 비밀을 알려주는 재미있는 과학동화예요. 주인공 코파츄와 함께 여러 가지 맛을 느끼는 모험을 떠나면서,
    우리는 혀가 어떻게 맛을 구분하는지 배우게 된답니다. 달콤함, 짭짤함은 물론 시고 쓴맛까지, 세상의 다양한 맛이 왜 다르게 느껴지는지 신기한
    이야기가 펼쳐져요. 우리 입안에서 맛을 느끼는 작은 친구들, 즉 미각 세포들의 이야기도 들을 수 있어요. 이 책을 읽으면 음식 맛의 과학 원리를
    쉽고 즐겁게 이해할 수 있을 거예요!
'9788936448493':
  title: 위풍당당 여우 꼬리
  summary: 폭시는 다른 여우들과 달리 황금빛 특별한 꼬리를 가진 아기 여우예요. 처음에는 남들과 다른 꼬리를 숨기고 싶어 하고 부끄러워하기도
    했어요. 하지만 꼬리를 숨기려 할수록 재미있고 신나는 일들이 폭시에게 일어나기 시작하죠. 친구들과 함께 여러 모험을 겪으면서, 폭시는 자신의
    특별한 꼬리가 얼마나 소중하고 멋진지 깨닫게 된답니다. 이 책은 남들과 다른 점을 부끄러워하지 않고, 자신을 있는 그대로 사랑하는 방법을 알려주는
    따뜻한 이야기예요.
'9788936448523':
  title: 고양이 해결사 깜냥
  summary: 깜냥이는 평범한 고양이였지만, 어느 날 갑자기 '해결사' 명함을 받게 돼요. 명함을 받은 깜냥이는 동네 사람들의 고민을 해결해
    주는 특별한 고양이 해결사가 된답니다. 주인의 잃어버린 물건을 찾아주거나, 친구와 싸워 속상한 아이의 마음을 달래주는 등 깜냥이는 고양이만의
    특별한 재치와 능력으로 사람들을 도와줘요. 깜냥이가 문제를 해결하며 사람들에게 기쁨을 주고 자신도 뿌듯함을 느끼는 따뜻한 이야기들이 펼쳐져요.
    매번 새로운 의뢰를 받으며 펼쳐지는 깜냥이의 활약을 기대해도 좋아요.
'9788936448592':
  title: 아무거나 문방구 :정은정 동화
  summary: 평범한 아이들이 어느 날 우연히 신기한 '아무거나 문방구'를 발견하게 돼요. 이 문방구는 아이들이 원하는 것은 무엇이든 파는 곳인데,
    돈 대신 물건값을 '간절한 마음'으로 받는답니다. 아이들은 각자 이루고 싶은 소원을 빌며 특별한 물건들을 사지만, 그 물건들은 예상치 못한
    모습으로 나타나거나 재미있는 일들을 벌여요. 문방구에서 겪는 특별한 경험들을 통해 아이들은 진정한 행복이 무엇인지 깨닫고 마음이 한 뼘 더
    자라게 된답니다.
'9788936448608':
  title: 위풍당당 여우 꼬리
  summary: 한별이는 풍성한 머리카락 때문에 고민이 많아요. 마치 여우 꼬리 같다고 놀림받는 것 같아 늘 감추고 싶어 했죠. 그러던 한별이가
    할머니와 친구들을 만나면서 특별한 경험을 하게 돼요. 자신의 '여우 꼬리'가 부끄러운 게 아니라 자신만의 멋진 모습이라는 것을 깨닫게 됩니다.
    이 책은 자기 자신을 사랑하고 있는 그대로의 모습을 받아들이는 용기를 선물해 줄 거예요.
'9788936448752':
  title: 고양이 해결사 깜냥
  summary: 깜냥이는 밤마다 아주 특별한 고양이 택배를 배달하는 해결사 고양이예요. 사람들이 정말로 필요한 물건과 함께 따뜻한 마음을 전하며,
    그들의 고민을 해결해 주지요. 때로는 외로운 아이에게 친구가 되어주고, 잃어버린 마음을 찾아주기도 해요. 깜냥이의 택배 속에는 언제나 마음을
    어루만져 주는 따뜻한 비밀이 숨어 있답니다. 이 책을 읽으면 깜냥이의 따뜻하고 지혜로운 활약을 보면서, 작은 도움의 소중함을 배울 수 있을
    거예요.
'9788936448790':
  title: 팥빙수 눈사람 펑펑 :나은 동화
  summary: 이 책은 한여름에 나타난 특별한 팥빙수 눈사람 이야기예요. 이 눈사람은 팥빙수로 만들어져서 더운 날에도 녹지 않고 신나는 모험을
    즐길 수 있어요. 팥빙수 눈사람은 친구들과 함께 여름날의 더위를 잊게 해 줄 시원한 상상 속 세계를 여행합니다. 아이들은 팥빙수 눈사람과 함께
    즐거운 시간을 보내며 새로운 추억을 만들지요. 여름의 색다른 풍경과 따뜻한 우정을 담고 있는 유쾌한 동화예요.
'9788936448844':
  title: 위풍당당 여우 꼬리
  summary: 이 책은 자기 꼬리를 세상에서 가장 소중하게 생각하는 여우 '폭스'의 이야기예요. 폭스의 꼬리는 너무 멋지고 특별해서 다른 여우들의
    부러움을 한몸에 받아요. 하지만 특별한 꼬리 때문에 오히려 외롭고 힘든 일을 겪기도 합니다. 폭스는 친구들과 함께 용기를 내어 어려운 일들을
    해결하면서 진정한 아름다움이 무엇인지 깨닫게 돼요. 겉모습이 아닌, 마음속의 진짜 가치를 배우는 따뜻한 성장 동화입니다.
'9788936448905':
  title: 팥빙수 눈사람 펑펑 :나은 동화
  summary: 아롱이라는 친구는 특별한 팥빙수 눈사람을 만들었어요. 이 눈사람은 차가운 얼음과 달콤한 팥으로 만들어져서 귀여운 모습이었죠. 아롱이는
    팥빙수 눈사람과 함께 숨바꼭질도 하고 즐거운 시간을 보내며 둘만의 소중한 추억을 쌓아갔어요. 하지만 따뜻한 햇볕에 눈사람이 녹아버리자 아롱이는
    슬펐지만, 팥빙수 눈사람과 나눈 특별한 순간들을 영원히 마음속에 간직하게 된답니다.
'9788936448950':
  title: 고양이 해결사 깜냥
  summary: 고양이 해결사 깜냥은 신비로운 능력을 가진 고양이 깜냥이가 우리 주변의 크고 작은 문제들을 해결해 주는 이야기예요. 깜냥이는 고양이
    전용 문을 통해 도움이 필요한 곳에 나타나는데요. 학교에서 친구들의 다툼을 해결하거나, 빵집에서 잃어버린 물건을 찾아주는 등 멋진 활약을 펼쳐요.
    깜냥이 덕분에 사람들은 행복해지고, 마음의 어려움까지 시원하게 해결된답니다. 깜냥이의 따뜻하고 유쾌한 모험을 읽다 보면 저절로 미소가 지어질
    거예요.
'9788936456894':
  title: 페인트 :이희영 장편소설
  summary: 이 책은 아이들이 부모님을 직접 고르는 아주 특별한 세상 이야기예요. 주인공 '제이'는 부모님을 선택해야 할 나이가 되었어요.
    '페인트'라고 불리는 예비 부모님들을 만나면서, 제이는 어떤 부모님이 좋을지 고민하게 돼요. 제이는 과연 어떤 부모님을 선택하게 될까요? 그리고
    이 부모님을 고르는 시스템이 정말 좋은 것인지 깊이 생각하게 된답니다.
'9788937886966':
  title: "(10대를 위한) 정의란 무엇인가 :하버드대 마이클 샌델 교수의 정의 수업"
  summary: 이 책은 우리가 살고 있는 세상에서 '정의'가 무엇인지 함께 고민해 보는 책이에요. 정의로운 사회는 어떤 모습일지, 그리고 우리가
    옳고 그름을 판단할 때 어떤 기준이 필요한지 재미있는 이야기들을 통해 알려줘요. 예를 들어, 모두에게 똑같이 나눠주는 것이 항상 정의로운지,
    아니면 각자 노력한 만큼 받는 것이 정의로운지 생각해 볼 기회를 줘요. 이 책을 읽으면서 스스로 답을 찾아보고, 친구들과 토론하며 세상을 더
    정의롭게 만드는 방법을 배울 수 있을 거예요.
'9788947547260':
  title: 세금 내는 아이들
  summary: "『세금 내는 아이들』은 우리 주변의 중요한 경제 이야기, 바로 세금에 대해 알려주는 책이에요. 이 책은 한 초등학교에서 아이들이
    직접 가게를 열고 돈을 벌면서 세금의 필요성을 깨닫게 되는 흥미로운 이야기를 담고 있어요. 아이들은 세금을 내는 것이 불편하다고 생각하지만,
    세금이 도로를 만들고 학교를 짓는 등 우리 모두에게 도움이 된다는 것을 알게 된답니다. 어린이들이 세금을 왜 내야 하는지, 또 세금이 우리
    사회를 위해 어떻게 사용되는지 쉽고 재미있게 이해할 수 있도록 도와줘요. 이 책을 읽으면 세금 덕분에 더 좋은 세상이 만들어진다는 것을 배우게
    될 거예요."
'9788949136028':
  title: '행운음원 #소원을 들어주는 음악'
  summary: 민수라는 여자아이는 아픈 할아버지를 걱정하며 지내던 중, 우연히 신비한 음악 재생기를 발견하게 돼요. 이 재생기에서는 '소원을
    들어주는 음악'인 '행운음원'이 흘러나오는데, 민수는 이 음악으로 할아버지와 친구들의 소원을 들어주려 합니다. 하지만 소원에는 지켜야 할 규칙이
    있고, 때로는 민수가 생각하지 못한 일들이 벌어지기도 해요. 이 책은 소원이 이루어지는 과정에서 진정한 행복과 친구, 가족의 소중함을 깨닫는
    따뜻한 이야기입니다.
'9788949137049':
  title: 멸망에 투자하세요 :황이경 장편소설
  summary: 이 책은 세상이 혼란에 빠지고 독특한 규칙이 생긴 미래를 배경으로 해요. 사람들은 살아남기 위해 '멸망'이라는 특이한 곳에 돈을
    투자해야만 한답니다. 주인공 은결이는 힘든 세상에서 가족과 함께 살아남기 위해 애쓰며 여러 문제에 부딪혀요. 이 과정에서 돈의 의미와 진정한
    가치가 무엇인지 깊이 생각하게 됩니다. 어려운 상황 속에서도 희망을 잃지 않고 헤쳐나가는 아이들의 용기 있는 이야기가 펼쳐져요.
'9788949141060':
  title: 지킬 박사와 하이드 씨
  summary: 지킬 박사는 아주 착하고 똑똑한 의사였어요. 그는 자신의 나쁜 마음을 없애고 싶어 특별한 약을 만들었답니다. 이 약을 마시자 박사는
    잔인하고 무서운 하이드 씨로 변하게 돼요. 처음엔 마음대로 변신했지만, 점점 하이드 씨가 지킬 박사의 몸과 마음을 지배하게 되면서 박사는 큰
    고통을 겪어요. 결국 지킬 박사는 자기 자신과 싸우며 끔찍한 결말을 맞이하는 이야기예요. 이 책은 사람의 마음속에 있는 착한 면과 나쁜 면에
    대해 생각하게 해줍니다.
'9788949144511':
  title: 내 인생 최악의 일주일
  summary: 올리버에게는 모든 일이 꼬이는 최악의 한 주가 시작되었어요. 옆집에 사는 심술궂은 소년 윌리엄 때문에 자전거가 망가지고, 새로
    태어난 동생 때문에 엄마 아빠의 관심도 빼앗기죠. 학교에서는 숙제도 잊어버리고, 좋아하는 여자 친구 앞에서는 바보 같은 실수를 연발해요. 설상가상으로
    가장 아끼는 햄스터마저 사라져 버리자 올리버는 정말 속상했어요. 과연 올리버는 이 최악의 한 주를 무사히 잘 보낼 수 있을까요?
'9788949144542':
  title: 내 인생 최악의 일주일
  summary: 루이는 부모님 없이 할머니 할아버지 댁에서 일주일을 보내게 되었어요. 스마트폰도 게임도 못 하는 시골이라 정말 싫고 최악의 한
    주가 될 거라고 생각했죠. 하지만 할머니 할아버지와 함께 숲을 탐험하고, 맛있는 치즈를 만들고, 재미있는 모험을 하면서 생각이 바뀌기 시작해요.
    루이는 시골 생활의 즐거움을 깨닫고 할머니 할아버지와도 더 가까워져요. 이 일주일은 최악이 아니라 루이에게 최고의 선물 같은 시간이 되었답니다.
'9788949144559':
  title: 내 인생 최악의 일주일
  summary: 루이라는 평범한 초등학생에게 갑자기 월요일부터 모든 일이 꼬이기 시작해요. 친한 친구랑 싸우고, 숙제도 엉망이 되고, 심지어 아끼는
    강아지까지 말썽을 부려서 온통 최악의 상황이 펼쳐진답니다. 마치 세상 모든 불운이 자신에게만 찾아온 것 같은 힘든 일주일이었죠. 과연 루이는
    이 끔찍한 일주일을 잘 견뎌내고 다시 평범한 웃음을 찾을 수 있을까요? 이 책은 루이가 여러 가지 문제들을 겪으며 성장하는 과정을 재미있게
    보여준답니다.
'9788949162386':
  title: 오리 부리 이야기
  summary: 주인공 오리는 자신의 평범한 오리 부리가 마음에 들지 않아 고민했어요. 다른 새들처럼 예쁘고 멋진 부리를 갖고 싶어서 이것저것
    바꿔 보았죠. 뾰족한 부리, 갈고리 부리 등 여러 부리를 달아 보았지만 모두 불편하고 어울리지 않았어요. 결국 오리는 자신의 원래 오리 부리가
    제일 편하고 예쁘다는 것을 깨닫게 됩니다. 이 이야기는 자기 모습을 있는 그대로 사랑하는 마음이 얼마나 중요한지 알려주는 따뜻한 책이에요.
'9788949162621':
  title: 학교 옆 만능빌딩
  summary: 시은이네 학교 옆에 신기한 '만능빌딩'이 생겼어요. 이 빌딩은 아이들이 바라는 모든 것을 뚝딱 만들어 주는 마법 같은 곳이었죠.
    시은이와 친구들은 만능빌딩에서 상상만 하던 멋진 물건과 공간을 만들며 매일 신나는 시간을 보냈어요. 하지만 빌딩의 숨겨진 비밀을 알게 되면서
    친구들 사이에 작은 갈등이 생기기 시작해요. 과연 시은이는 진정한 만능이 무엇인지 깨닫고 친구들과 다시 사이좋게 지낼 수 있을까요?
'9788949168111':
  title: 귀신 문제 해결단
  summary: 팡이는 조금 특별한 귀신이에요. 보통 귀신과는 다르게 인간을 도와주는 '귀신 문제 해결단'을 운영하고 있답니다. 인간 조수인 콩과
    함께, 귀신 때문에 고민하는 사람들의 문제를 척척 해결해주지요. 무서운 귀신을 만나는 게 아니라, 오히려 귀여운 귀신 친구들을 만나 유쾌한
    사건들을 해결하는 이야기에요. 팡이와 콩은 마을의 다양한 귀신 사건들을 해결하며 웃음과 감동을 전해준답니다.
'9788950900830':
  title: 벌거벗은 세계사
  summary: 이 책은 복잡한 세계의 역사를 초등학생 친구들이 쉽고 재미있게 이해하도록 도와줘요. 마치 벌거벗듯 복잡한 것을 싹 벗겨내고 핵심만
