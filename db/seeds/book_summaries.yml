'9791171171255':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 한자의 힘으로 마법을 부리는 신기한 이야기예요. 주인공들은 요괴들이 사는 세상에 들어가 전설의 손오공을 만나 함께 모험을 떠나요.
    위험한 요괴를 물리치려면 한자를 알아야 마법을 쓸 수 있어서, 모험을 하면서 자연스럽게 한자를 배우게 돼요. 손오공과 친구들이 힘을 모아 어려운
    고비를 넘기는 신나는 이야기가 펼쳐진답니다.
'9788937838750':
  title: "(추리 천재) 엉덩이 탐정"
  summary: 머리가 엉덩이처럼 생긴 신사 탐정이 어려운 사건을 척척 해결하는 추리 이야기예요. 탐정은 냄새를 맡으면서 단서를 찾고, 침착하고
    예의 바른 태도로 사건의 진실을 밝혀내요. 조수 브라운과 함께 다니며 마을에서 일어나는 이상한 사건들을 하나씩 풀어나가요. 마지막에 범인을
    밝혀낼 때마다 시원하고 재미있는 반전이 기다리고 있답니다.
'9788950971557':
  title: 그리스 로마 신화
  summary: 제우스, 헤라, 포세이돈 같은 올림포스 신들과 헤라클레스, 페르세우스 같은 영웅들의 이야기를 담은 책이에요. 신들이 다투기도 하고
    인간을 돕거나 벌주기도 하면서 세상에 여러 가지 일이 벌어져요. 헤라클레스가 힘든 열두 가지 과업을 해내는 이야기나 트로이 전쟁 이야기처럼
    손에 땀을 쥐게 하는 모험담도 만날 수 있어요. 신비하고 흥미진진한 그리스 로마 신화 속 이야기들을 쉽고 재미있게 읽을 수 있답니다.
'9791162332542':
  title: "(추리 천재) 엉덩이 탐정"
  summary: 머리가 엉덩이처럼 생긴 신사 탐정이 어려운 사건을 척척 해결하는 추리 이야기예요. 탐정은 냄새를 맡으면서 단서를 찾고, 침착하고
    예의 바른 태도로 사건의 진실을 밝혀내요. 조수 브라운과 함께 다니며 마을에서 일어나는 이상한 사건들을 하나씩 풀어나가요. 마지막에 범인을
    밝혀낼 때마다 시원하고 재미있는 반전이 기다리고 있답니다.
'9788993900873':
  title: 암호클럽
  summary: 암호를 풀어서 사건을 해결하는 아이들의 이야기예요. 주인공들은 클럽을 만들어 다양한 암호와 비밀 문자를 공부하고 서로 연습해요.
    마을에서 일어난 이상한 사건의 단서가 암호로 되어 있다는 것을 알게 되면서 힘을 합쳐 암호를 풀어나가요. 머리를 써서 하나씩 수수께끼를 풀어가는
    재미가 가득한 이야기랍니다.
'9788934951056':
  title: 책 먹는 여우의 여름 이야기
  summary: 책을 너무 좋아해서 책을 먹어버리는 여우 아저씨의 이야기예요. 여우 아저씨는 이야기를 쓰고 그 이야기가 담긴 책을 맛있게 먹으며
    살아가요. 여름을 배경으로 새로운 사건과 인물들을 만나면서 또 한 번 재미있는 이야기를 만들어가요. 책과 이야기를 사랑하는 마음이 따뜻하게
    느껴지는 책이랍니다.
'9791164062270':
  title: "(이상한 과자 가게) 전천당"
  summary: 이상한 과자 가게 전천당에는 베니코 할머니가 있어요. 손님이 가게에 들어오면 할머니는 그 사람에게 꼭 필요한 신기한 과자를 딱
    하나 골라줘요. 과자를 먹으면 소원이 이루어지지만, 설명서에 적힌 규칙을 지키지 않으면 무서운 일이 벌어지고 말아요. 손님마다 다른 사연과
    소원, 그리고 과자의 신비한 힘이 펼쳐지는 이야기랍니다.
'9791188874217':
  title: 설민석의 한국사 대모험
  summary: 설민석 선생님과 함께 우리나라 역사 속으로 떠나는 모험 이야기예요. 주인공들은 시간여행을 통해 고조선부터 조선까지 여러 시대의
    역사적 사건과 인물들을 직접 만나요. 위기에 처할 때마다 지혜를 모아 어려움을 헤쳐나가면서 한국사의 중요한 순간들을 몸으로 체험해요. 흥미진진한
    모험을 따라가다 보면 우리 역사를 재미있게 배우게 된답니다.
'9788934937098':
  title: 책 먹는 여우의 봄 이야기
  summary: 책을 너무 좋아해서 책을 먹어버리는 여우 아저씨의 이야기예요. 여우 아저씨는 이야기를 쓰고 그 이야기가 담긴 책을 맛있게 먹으며
    살아가요. 봄을 배경으로 새로운 사건과 인물들을 만나면서 또 한 번 재미있는 이야기를 만들어가요. 책과 이야기를 사랑하는 마음이 따뜻하게 느껴지는
    책이랍니다.
'9788954675604':
  title: 세계를 건너 너에게 갈게 :이꽃님 장편소설
  summary: 시간이 다른 두 소녀가 신기한 우체통을 통해 편지를 주고받는 이야기예요. 한 소녀는 1999년에, 다른 소녀는 2020년에 살고
    있는데 서로의 시대를 넘어 편지를 나누며 친구가 돼요. 편지를 주고받으며 서로의 고민과 마음을 나누고 우정을 쌓아가요. 시간을 뛰어넘은 특별한
    우정과 감동적인 비밀이 담긴 이야기랍니다.
'9791168416789':
  title: 윔피 키드
  summary: 그렉이라는 소년이 자신의 학교생활과 일상을 일기처럼 써 내려가는 이야기예요. 그렉은 친구 라울리와 함께 다니며 학교에서 이런저런
    사건을 겪고, 형 로드릭과도 티격태격해요. 유명해지고 싶고 멋있어 보이고 싶어 하지만 뜻대로 되지 않아 우스꽝스러운 일들이 자꾸 벌어져요.
    그림일기 형식으로 되어 있어 그렉의 유쾌하고 솔직한 생각을 재미있게 볼 수 있답니다.
'9791173571305':
  title: 열혈 세종대왕
  summary: 조선의 위대한 임금 세종대왕의 이야기예요. 세종대왕은 백성들이 글을 몰라 불편해하는 모습을 안타깝게 여겨 누구나 쉽게 배울 수
    있는 글자, 한글을 만들었어요. 학문과 과학 기술에도 관심이 많아 여러 신하들과 함께 다양한 발명품과 제도를 만들어냈어요. 백성을 사랑하는
    마음으로 나라를 이끈 세종대왕의 훌륭한 업적을 배울 수 있는 책이랍니다.
'9788950971601':
  title: 그리스 로마 신화
  summary: 제우스, 헤라, 포세이돈 같은 올림포스 신들과 헤라클레스, 페르세우스 같은 영웅들의 이야기를 담은 책이에요. 신들이 다투기도 하고
    인간을 돕거나 벌주기도 하면서 세상에 여러 가지 일이 벌어져요. 헤라클레스가 힘든 열두 가지 과업을 해내는 이야기나 트로이 전쟁 이야기처럼
    손에 땀을 쥐게 하는 모험담도 만날 수 있어요. 신비하고 흥미진진한 그리스 로마 신화 속 이야기들을 쉽고 재미있게 읽을 수 있답니다.
'9791173111402':
  title: "(처음 읽는) 삼국지"
  summary: 중국의 유명한 고전 삼국지 이야기를 쉽게 풀어낸 책이에요. 유비, 관우, 장비가 의형제를 맺고 어지러운 세상을 바로잡기 위해 나서는
    이야기로 시작해요. 지혜로운 제갈량의 활약과 조조, 손권 같은 영웅들이 힘을 겨루는 대결도 만날 수 있어요. 의리와 지혜를 배울 수 있는 흥미진진한
    영웅들의 이야기랍니다.
'9788954440042':
  title: 시간을 파는 상점 :김선영 장편소설
  summary: 아빠를 잃은 뒤 인터넷에 '시간을 파는 상점'이라는 사이트를 열고 사람들의 심부름을 대신해 주는 열일곱 살 온조의 이야기예요.
    손님들이 남긴 사연을 하나씩 해결해 가면서 온조는 자신이 잃어버렸던 마음도 조금씩 되찾아 가요. 처음에는 그저 돈을 벌기 위한 일이었지만,
    여러 의뢰를 겪으며 다른 사람의 아픔에 공감하는 법을 배우게 됩니다. 시간을 판다는 특별한 상상력으로 진짜 소중한 것이 무엇인지 생각하게 해
    주는 이야기예요.
'9791196222628':
  title: 회색 인간
  summary: 땅속 세계로 끌려간 사람들이 짐승처럼 채굴 노동만 하며 하루하루를 버티는 이야기예요. 희망을 잃어 가던 사람들 앞에 한 남자가
    나타나 벽에 그림을 그리기 시작하면서 조금씩 변화가 찾아옵니다. 예술이 무엇인지도 몰랐던 사람들이 그림을 보며 다시 웃고 노래하고 이야기를
    나누기 시작해요. 힘든 상황에서도 인간다움을 지켜 내는 것이 얼마나 소중한지 생각하게 해 주는 이야기입니다.
'9788936459093':
  title: 페인트 (양장)
  summary: 국가가 부모 대신 아이들을 키워 주는 미래 사회의 보육 시설에 사는 소년 제누의 이야기예요. 이곳 아이들은 자라면서 자신을 입양할
    부모를 직접 면접 보고 고를 수 있어요. 제누는 여러 어른들을 만나 면접을 보면서 진짜 가족이란 무엇인지, 부모와 자식의 관계란 어떤 것인지
    고민하게 됩니다. 서로를 알아가는 면접 과정을 통해 가족의 의미를 다시 생각하게 해 주는 이야기예요.
'9788936442804':
  title: 푸른 사자 와니니 :이현 장편동화
  summary: 아프리카 초원에서 태어난 암사자 와니니가 무리에서 쫓겨나면서 벌어지는 이야기예요. 힘도 세지 않고 사냥도 서툴렀던 와니니는 혼자가
    된 뒤 여러 위기를 겪으며 스스로 살아가는 법을 배워 갑니다. 그 과정에서 새로운 친구들을 만나 서로 도우며 우정을 쌓아요. 약하고 부족해
    보였던 와니니가 자신만의 방식으로 성장해 진정한 우두머리가 되어 가는 감동적인 이야기입니다.
'9788972756194':
  title: 나미야 잡화점의 기적 :히가시노 게이고 장편소설
  summary: 오래전 문을 닫은 나미야 잡화점에 우연히 숨어든 세 도둑이 겪는 신비한 이야기예요. 이들은 셔터 틈으로 들어온 편지 한 통을 발견하는데,
    놀랍게도 그 편지는 과거에서 온 고민 상담 편지였답니다. 세 사람은 얼떨결에 답장을 보내면서 시간을 넘나드는 편지 왕래가 시작되고, 서로 다른
    시대를 살던 사람들의 사연이 실처럼 이어져 있다는 것을 알게 돼요. 작은 잡화점을 중심으로 여러 사람의 고민과 소원이 따뜻하게 연결되는 이야기입니다.
'9791133440054':
  title: 너의 이름은. =Your name.
  summary: 시골 마을에 사는 소녀 미츠하와 도쿄에 사는 소년 타키가 어느 날부터 꿈속에서 서로의 몸이 바뀌는 신비한 일을 겪는 이야기예요.
    두 사람은 서로의 일상을 대신 살아가며 점점 가까워지지만, 정작 얼굴을 마주한 적은 없어요. 그러던 중 미츠하의 마을에 큰 위기가 다가오고
    있다는 사실을 알게 되면서 이야기는 예상치 못한 방향으로 흘러갑니다. 시간과 공간을 뛰어넘는 특별한 인연을 그린 감동적인 이야기예요.
'9791191438024':
  title: 호랑이를 덫에 가두면 :태 켈러 장편소설
  summary: 한국계 소녀 릴리가 몸이 편찮으신 할머니 곁에 있으려고 낯선 마을로 이사 오면서 벌어지는 이야기예요. 어느 날 밤 릴리 앞에 거대한
    호랑이가 나타나, 오래전 할머니가 감추어 둔 신비한 이야기들을 돌려주면 병을 낫게 해 주겠다고 제안합니다. 릴리는 호랑이가 말한 옛이야기들을
    하나씩 찾아 나서며 할머니와 가족에게 숨겨져 있던 사연을 알게 돼요. 한국 전래동화와 가족의 사랑이 어우러진 신비롭고 따뜻한 이야기입니다.
'9791167552723':
  title: 죽이고 싶은 아이 :이꽃님 장편소설
  summary: 어느 날 아침, 늘 붙어 다니던 단짝 친구가 싸늘한 시신으로 발견되면서 벌어지는 이야기예요. 사건 현장에서 발견된 결정적인 증거
    때문에 주인공은 순식간에 친구를 해친 범인으로 의심을 받게 됩니다. 자신은 절대 그런 일을 하지 않았다고 믿지만, 주변 사람들의 엇갈린 증언들이
    하나둘 쌓이면서 진실은 점점 미궁 속으로 빠져들어요. 여러 사람의 시선으로 사건을 따라가며 진짜 범인이 누구인지 추리하게 되는 이야기입니다.
'9788954654753':
  title: 체리새우 :황영미 장편소설
  summary: 중학교 교실 안에서 친한 친구들이 이루던 무리에 변화가 생기면서 벌어지는 이야기예요. 주인공 다현은 친구들 사이의 미묘한 서열과
    눈치싸움 속에서 자신의 자리를 지키려 애를 씁니다. 사소한 오해와 갈등이 쌓이면서 단단해 보였던 우정에도 조금씩 금이 가기 시작해요. 진짜
    나다운 모습으로 친구를 사귄다는 것이 무엇인지 돌아보게 해 주는 성장 이야기입니다.
'9791173113581':
  title: "(처음 읽는) 삼국지"
  summary: 중국이 위, 촉, 오 세 나라로 나뉘어 다투던 삼국 시대를 배경으로 한 이야기예요. 유비, 관우, 장비 세 사람이 복숭아나무 아래에서
    의형제를 맺는 도원결의로 이야기가 시작됩니다. 지혜로운 조조, 의리 있는 관우, 슬기로운 제갈량 등 개성 강한 영웅들이 서로 힘을 겨루며 천하를
    다투는 모습이 펼쳐져요. 지혜와 의리, 우정을 배울 수 있는 동양 고전의 대표작입니다.
'9791158681791':
  title: "(읽으면서 바로 써먹는) 어린이 명심보감"
  summary: 옛 성현들의 지혜로운 말씀을 어린이 눈높이에 맞게 쉽게 풀어낸 책이에요. 효도, 우정, 배움, 예절처럼 살아가면서 꼭 필요한 마음가짐을
    짧은 글귀와 이야기로 배울 수 있습니다. 어려운 한자 구절도 쉬운 풀이와 함께 실려 있어 옛 어른들의 가르침을 재미있게 익힐 수 있어요. 오늘을
    살아가는 우리에게도 여전히 도움이 되는 지혜를 전해 주는 책입니다.
'9788934958987':
  title: 멈출 수 없는 우리
  summary: 아주 먼 옛날 여러 인류 중 하나였던 호모 사피엔스가 어떻게 지구를 지배하게 되었는지 들려주는 이야기예요. 힘도 세지 않고 몸집도
    크지 않았던 사피엔스는 서로 이야기를 지어내고 상상하는 특별한 능력 덕분에 많은 사람들과 힘을 합칠 수 있었답니다. 이 능력으로 사냥과 농사,
    마을과 도시를 이루며 점점 더 큰 무리를 이루고 세상을 바꾸어 나가요. 인류의 역사를 쉽고 재미있게 풀어낸 어린이를 위한 이야기입니다.
'9791164135653':
  title: "(10대를 위한) 사피엔스 :한 번에 정리하는 인류 문명의 역사"
  summary: 수백만 년 전 여러 인류 중 하나였던 우리 조상이 어떻게 지구의 주인이 되었는지 설명해 주는 책이에요. 언어와 상상력을 가진 인류가
    사냥과 채집을 하던 시대를 지나 농사를 짓고 마을을 이루며 살아가는 과정을 차례로 보여 줍니다. 인류가 문명을 만들고 세상을 바꿔 온 커다란
    흐름을 청소년의 눈높이에 맞게 정리했어요. 인류의 역사를 한눈에 살펴보고 싶은 학생들에게 좋은 안내서가 되는 책입니다.
'9788936452056':
  title: 식탁 위의 세계사
  summary: 우리가 매일 먹는 빵, 감자, 후추, 설탕, 커피 같은 음식들 속에 숨어 있는 세계 역사 이야기를 들려주는 책이에요. 작은 향신료
    하나, 음식 하나가 어떻게 큰 전쟁이나 무역, 나라 간의 다툼으로 이어졌는지 재미있게 풀어냅니다. 식탁 위에 놓인 평범한 음식들이 사실은 세계
    여러 나라의 역사와 깊이 연결되어 있다는 것을 알게 돼요. 음식이라는 친숙한 소재로 세계사를 쉽고 흥미롭게 배울 수 있는 책입니다.
'9791193031964':
  title: "(설민석의) 우리 고전 대모험"
  summary: 역사 강사 설민석 선생님과 아이들이 함께 시간 여행을 떠나 우리 고전 속 이야기를 직접 만나는 학습만화예요. 흥부와 놀부, 심청이,
    홍길동 같은 익숙한 고전 속 인물들을 만나 그 시대의 이야기를 생생하게 체험합니다. 재미있는 모험을 따라가다 보면 우리 고전이 담고 있는 지혜와
    교훈을 자연스럽게 배우게 돼요. 옛이야기를 쉽고 재미있게 만나고 싶은 어린이에게 좋은 학습만화입니다.
'9791175484290':
  title: 흔한남매
  summary: 유튜브에서 큰 인기를 얻은 남매 캐릭터 흔한남매의 티격태격 일상을 담은 만화예요. 오빠와 여동생은 사소한 일로도 티격태격 다투지만
    결국은 서로를 아끼는 평범한 남매랍니다. 학교, 집, 방학 같은 일상 속에서 벌어지는 크고 작은 사건들이 웃음을 자아내요. 우리 주변 어디에나
    있을 법한 친근한 남매의 모습을 재미있게 그려 낸 만화입니다.
'9791173322907':
  title: "(흔한 남매) 세계사 탐험대"
  summary: 인기 캐릭터 흔한남매가 시간 여행을 떠나 세계 여러 나라의 역사 속으로 뛰어드는 학습만화예요. 오빠와 여동생은 티격태격 다투면서도
    각 시대의 사건과 인물들을 직접 만나며 좌충우돌 모험을 펼칩니다. 재미있는 사건들을 따라가다 보면 세계사의 굵직한 흐름을 자연스럽게 익힐 수
    있어요. 친숙한 캐릭터와 함께 세계 역사를 쉽고 즐겁게 배울 수 있는 학습만화입니다.
'9791164062072':
  title: "(이상한 과자 가게) 전천당"
  summary: 아무도 모르게 나타났다가 사라지는 신비한 과자 가게 전천당의 이야기예요. 이 가게 주인 베니코 아주머니는 손님의 고민에 꼭 맞는
    신비한 과자를 팔지만, 정해진 규칙을 어기면 무서운 일이 벌어진다는 경고도 함께 건넵니다. 손님들은 저마다의 소원을 이루기 위해 과자를 사
    가지만, 욕심을 부리다 뜻밖의 대가를 치르기도 해요. 매번 새로운 손님과 신비한 과자가 등장하는 이야기 속에서 소중한 교훈을 얻을 수 있는
    시리즈입니다.
