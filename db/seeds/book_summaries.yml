'9788964964767':
  title: 오싹오싹 크레용!
  summary: 토끼 재스퍼는 쓰레기통에서 몽당 크레용 하나를 주워요. 그 크레용으로 그림을 그리면 놀랍도록 멋진 그림이 완성되고 숙제도 술술
    풀려서 처음엔 신이 나요. 하지만 크레용은 점점 재스퍼 마음대로 되지 않고 무섭게 굴며 자꾸 이상한 그림을 그리게 만들어요. 결국 재스퍼는
    용기를 내어 오싹한 크레용과 맞서게 된답니다.
