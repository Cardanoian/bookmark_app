'9788936433697':
  title: 위저드 베이커리 =구병모 장편소설 /Wizard bakery
  summary: 억울한 오해를 받고 집을 나온 소년이 신비한 빵집에 숨어들면서 벌어지는 이야기예요. 그 빵집은 마법사가 운영하는 곳으로, 손님의
    소원을 들어주는 신기한 빵과 과자를 팔아요. 소년은 그곳에서 지내며 마법사와 다른 손님들의 사연을 알게 되고, 자신의 상처와도 마주하게 돼요.
