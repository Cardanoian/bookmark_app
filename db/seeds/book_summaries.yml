'9791175484887':
  title: 흔한남매의 흔한 호기심 :일상에서 만나는 과학 상식
  summary: 인기 캐릭터 흔이와 한이 남매가 티격태격하면서도 일상 속 다양한 궁금증을 함께 풀어가요. 우리 주변에서 흔히 볼 수 있는 현상들
    속에 숨어 있는 과학 원리를 재미있게 알려줘요. 개그 코드 가득한 남매의 모습을 보며 웃다 보면 과학 상식이 저절로 쌓여요. 어렵게 느껴지던
    과학이 친근하게 다가오는 학습 만화예요.
'9788950976880':
  title: 마법천자문 :손오공의 한자 대탐험
