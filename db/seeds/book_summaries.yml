    고전 속에 숨겨진 교훈이나 새로운 사실들을 흔한남매와 함께 알아가는 즐거움이 가득할 거예요. 이 책을 읽다 보면 고전 문학이 더 이상 어렵지
    않고 정말 재미있다고 느끼게 될 거랍니다.
'9791168418974':
