'9791168417823':
  title: "(처음 읽는) 그리스 로마 신화 =First Greek mythology"
  summary: 이 책은 아주 먼 옛날, 세상과 사람들을 다스리던 신들과 영웅들의 흥미진진한 이야기를 담은 그리스 로마 신화를 어린이 눈높이에
    맞춰 쉽게 들려줘요. 하늘의 왕 제우스, 바다의 신 포세이돈, 지혜의 여신 아테나 등 멋진 신들의 탄생과 활약을 만날 수 있답니다. 헤라클레스
