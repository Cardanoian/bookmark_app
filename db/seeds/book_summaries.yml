'9791164386994':
  title: 신비아파트 한자 귀신 11 - 악귀의 노래
  summary: 신비아파트에 정체를 알 수 없는 악귀의 노랫소리가 들려오면서 심상치 않은 사건이 시작돼요. 하리와 친구들은 이 오싹한 사건의 비밀을
    풀기 위해 한자의 뜻과 소리를 하나씩 파헤쳐 나가지요. 위험한 순간들을 헤쳐 나가며 아이들은 용기와 지혜를 발휘해 악귀에 맞서요. 짜릿한 모험을
    따라가다 보면 어느새 한자 실력이 쑥쑥 자라난답니다.
'9791130671024':
  title: 리버보이 :팀 보울러 장편소설
  summary: 제스는 화가인 할아버지와 함께 할아버지가 어린 시절을 보낸 강가 마을로 여름휴가를 떠나요. 할아버지는 큰 병을 앓고 계셨지만 마지막
    그림 '리버보이'를 완성하겠다는 꿈을 안고 계셨지요. 강가에서 제스는 신비로운 소년을 만나 함께 헤엄치며 삶과 죽음, 강물의 흐름에 대한 소중한
    깨달음을 얻어요. 결국 할아버지와 이별하게 되지만 제스는 그 만남을 통해 한층 성숙해진답니다.
'9791164382729':
  title: "(코믹 메이플스토리) 수학도둑 :지식·능력·경험을 융합하여 정리하는 No.1 수학학습만화"
  summary: 수학 나라의 소중한 수학 지식을 도둑맞으면서 이야기가 시작돼요. 주인공들은 사라진 수학 개념을 되찾기 위해 수학도둑을 뒤쫓으며
    모험을 떠나지요. 모험 중에 만나는 문제들을 하나씩 풀어가면서 자연스럽게 수학 원리를 익히게 돼요. 메이플스토리의 인기 캐릭터들이 함께 등장해서
    더욱 재미있게 수학을 배울 수 있는 학습 만화예요.
'9788950976934':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 하늘의 벌을 받아 힘을 잃은 손오공이 인간 세상으로 내려와 한 아이를 만나면서 이야기가 시작돼요. 손오공은 한자를 외치면 그 한자의
    뜻대로 신기한 힘이 생기는 마법을 배우게 돼요. 사오정, 저팔계 같은 친구들과 함께 나쁜 요괴들을 물리치며 서유기 속 세상을 모험하지요. 이야기를
    재미있게 따라가다 보면 한자의 뜻과 모양을 저절로 익히게 되는 학습 만화예요.
'9788926384855':
  title: "(코믹 메이플스토리) 수학도둑 :창의사고력 강화, 수리논술력을 키워 주는 스토리텔링 수학의 선구자!"
  summary: 수학 나라의 소중한 수학 지식을 도둑맞으면서 이야기가 시작돼요. 주인공들은 사라진 수학 개념을 되찾기 위해 수학도둑을 뒤쫓으며
    모험을 떠나지요. 모험 중에 만나는 문제들을 하나씩 풀어가면서 자연스럽게 수학 원리를 익히게 돼요. 메이플스토리의 인기 캐릭터들이 함께 등장해서
    더욱 재미있게 수학을 배울 수 있는 학습 만화예요.
'9791166377679':
  title: 엽기 과학자 프래니
  summary: 프래니는 학교보다 실험실에서 지내는 게 더 즐거운 괴짜 과학자 소녀예요. 친구들과 친해지고 싶어서 이런저런 신기한 발명품을 만들지만
    그 발명품들이 자꾸 엉뚱한 소동을 일으키고 말지요. 실수와 실패를 거듭하면서도 프래니는 포기하지 않고 다시 도전하는 씩씩한 모습을 보여줘요.
    좌충우돌 소동 끝에 프래니는 자신만의 방식으로 친구를 사귀는 법을 배워간답니다.
'9788950980054':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 하늘의 벌을 받아 힘을 잃은 손오공이 인간 세상으로 내려와 한 아이를 만나면서 이야기가 시작돼요. 손오공은 한자를 외치면 그 한자의
