'9788936443368':
  title: 푸른 사자 와니니 :이현 장편동화
  summary: 초원에서 태어난 아기 사자 와니니는 몸이 작고 약하다는 이유로 무리를 이끄는 어른 사자들에게 인정받지 못해요. 결국 와니니는 정든
    무리에서 쫓겨나 홀로 넓은 초원으로 나가게 됩니다. 혼자가 된 와니니는 마찬가지로 무리에서 밀려난 사자들을 만나 서로 의지하며 함께 살아가기로
    해요. 사냥도 서투르고 위험한 일도 많지만 친구들과 힘을 합쳐 하나씩 어려움을 헤쳐 나가지요. 작고 약했던 와니니가 자기만의 방식으로 진짜
    리더로 자라나는 모습이 감동을 준답니다.
'9788937839931':
  title: 윔피 키드
  summary: 그레그 헤플리는 학교에서 유명해지고 싶은 평범한 중학생이에요. 이 책은 그레그가 학교생활과 친구 관계, 가족 이야기를 그림과 함께
    일기 형식으로 솔직하게 적어 내려간 이야기랍니다. 단짝 친구 라울리와 티격태격하기도 하고 엉뚱한 계획을 세웠다가 망신을 당하기도 해요. 유명해지고
    싶은 마음에 이런저런 일을 벌이지만 뜻대로 되지 않는 경우가 더 많지요. 실수투성이지만 웃음이 나는 그레그의 이야기를 통해 평범한 우리들의
    학교생활을 떠올리게 되는 책이에요.
'9791175482692':
  title: 윔피 키드
  summary: 그레그 헤플리는 학교에서 유명해지고 싶은 평범한 중학생이에요. 이 책은 그레그가 학교생활과 친구 관계, 가족 이야기를 그림과 함께
