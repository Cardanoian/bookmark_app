    깨닫게 되지요. 흥미진진한 모험을 통해 어려운 세계사 지식을 쉽고 즐겁게 배울 수 있답니다. 마치 게임처럼 다음 이야기가 궁금해지는 책이에요.
'9791197120541':
  title: 유진과 유진 :이금이 장편소설
  summary: 이 이야기는 이름이 같은 두 명의 유진이가 우연히 만나면서 시작돼요. 한 유진이는 학교에 다니고 있고, 다른 유진이는 새로 전학
    온 친구예요. 두 유진이는 이름이 같을 뿐만 아니라, 어릴 적에 겪었던 마음 아픈 기억까지 똑같다는 것을 알게 됩니다. 처음에는 서로를 낯설어하고
    피하기도 하지만, 점점 서로에게 기대고 용기를 얻으며 진정한 친구가 된답니다. 함께 아픔을 이겨내고, 다시 밝고 행복한 미래를 꿈꾸는 두 유진이의
    성장 이야기예요. 서로에게 큰 힘이 되어주는 모습을 통해 친구의 소중함과 용기를 배울 수 있어요.
'9791197226199':
  title: 설민석의 삼국지 대모험
  summary: 이 책은 설민석 선생님과 함께 옛날 중국의 아주 커다란 이야기를 만화로 재미있게 보여주는 책이에요. 촉, 위, 오라는 세 나라가
    서로 가장 강한 나라가 되려고 싸우는 흥미진진한 모험이 가득하답니다. 용감한 유비, 관우, 장비 삼형제와 지혜로운 제갈량 등 멋진 영웅들이
    많이 나와요. 친구들과 힘을 합치고 어려운 문제를 해결하는 과정에서 지혜와 용기를 배울 수 있어요. 복잡한 삼국지 이야기도 어린이 친구들이
    쉽고 재미있게 이해할 수 있도록 도와주는 멋진 책이랍니다.
'9791197377143':
  title: 어서오세요, 휴남동 서점입니다 :황보름 장편소설
  summary: 영주라는 여자가 있었어요. 바쁜 도시 생활에 지쳐 작은 동네에 자신만의 서점을 열기로 해요. '휴남동 서점'에서 영주는 책을 팔고
    커피를 내리며 손님들과 만나요. 서점을 찾아오는 사람들은 각자 다른 고민과 이야기를 가지고 있지요. 영주와 손님들은 책을 통해 서로의 마음을
    나누고, 쉬어가는 법을 배우며 천천히 성장한답니다. 이 서점은 지친 사람들에게 따뜻한 위로와 새로운 시작을 선물하는 특별한 공간이 돼요.
'9791197407062':
  title: 이루의 세상
  summary: 이루는 조용하고 평범한 일상을 좋아하던 아이였어요. 그런데 갑자기 가족이 새로운 곳으로 이사를 가게 되면서 이루의 세상이 크게
    변해요. 이루는 처음에는 낯선 환경과 친구들에게 적응하기 어렵고, 예전 집을 그리워했어요. 하지만 새로운 친구들과 함께 여러 경험을 하면서
    점차 마음을 열고 새로운 세상에서 자신만의 행복을 찾아가게 된답니다. 이 책은 변화에 적응하고, 새로운 관계를 맺으며 성장하는 이루의 따뜻한
    이야기를 담고 있어요.
'9791197578410':
  title: 채사장의 지대넓얕 :지적 대화를 위한 넓고 얕은 지식
  summary: 이 책은 우리가 세상을 더 잘 이해할 수 있도록 도와주는 지식들을 알려줘요. 역사, 경제, 정치, 그리고 우리 마음속의 생각들까지
    다양한 분야의 중요한 개념들을 쉽고 재미있게 설명해 준답니다. 친구들과 깊은 대화를 나눌 때 궁금했던 점들을 해결해 주고, 세상을 보는 눈을
    넓혀줄 거예요. 어려운 지식도 큰 그림으로 이해하면서 똑똑한 사람이 될 수 있도록 돕는 책이에요.
'9791198026811':
  title: 10대를 위한 총균쇠 수업 :gun, germs, and steel
  summary: 이 책은 아주 먼 옛날부터 왜 어떤 나라들은 다른 나라보다 더 빨리 발전하게 되었는지 알려주는 흥미로운 이야기예요. 사람들의 능력
    차이가 아니라, 살았던 지역의 환경 차이 때문이라고 쉽게 설명해 주죠. 특히 어떤 곡식을 키울 수 있었는지, 어떤 동물을 기를 수 있었는지,
    그리고 땅의 생김새가 어땠는지 같은 자연적인 조건들이 중요하다고 말해요. 덕분에 총, 병균, 그리고 쇠 같은 것들이 어떻게 나라마다 다르게
    발전하고 퍼져나갔는지 알게 될 거예요. 이 책을 읽으면 우리가 사는 세상을 더 넓고 깊이 이해할 수 있답니다.
'9791198179913':
  title: 설민석의 한국사 대모험
  summary: 이 책은 온달과 평강 공주가 시간 여행을 하면서 우리나라 역사를 배우는 재미있는 만화 시리즈예요. 두 주인공은 과거로 떠나 여러
    시대의 역사 속 인물들을 만나고, 중요한 사건들을 직접 경험하게 된답니다. 때로는 위험에 빠지기도 하지만, 슬기롭게 헤쳐나가면서 우리 역사의
    중요한 순간들을 생생하게 보여줘요. 어린이 친구들은 온달과 평강 공주의 신나는 모험을 따라가다 보면, 어렵게만 느껴졌던 한국사를 쉽고 재미있게
    이해할 수 있을 거예요. 역사의 중요한 장면들을 그림과 이야기로 배우며, 자연스럽게 한국사에 대한 지식을 쌓을 수 있는 유익한 책이랍니다.
'9791198179982':
  title: "(설민석의) 그리스 로마 신화 대모험"
  summary: 이 책은 설민석 선생님이 어린이 친구들을 위해 그리스 로마 신화를 쉽고 재미있게 들려주는 책이에요. 하늘을 다스리는 제우스부터
    지혜로운 아테나, 힘센 헤라클레스까지 다양한 신과 영웅들의 이야기가 가득 담겨 있어요. 신들이 어떤 모험을 하고 세상을 어떻게 변화시켰는지
    흥미진진하게 따라가 볼 수 있답니다. 어린이들이 복잡한 신화 이야기를 지루하지 않게 읽으며 상상력을 키우고, 동시에 신화 속에 숨겨진 교훈과
    지혜를 배울 수 있도록 도와줘요. 멋진 그림과 함께 펼쳐지는 이야기들이 마치 만화책처럼 술술 읽혀서 신화 속 세상에 푹 빠져들게 할 거예요.
'9791198179999':
  title: 설민석의 세계사 대모험
  summary: 이 책은 주인공 타임캡슐이 설민석 선생님과 함께 전 세계의 중요한 역사 속으로 시간 여행을 떠나는 이야기예요. 타임캡슐은 여러
    나라와 시대를 방문하며 흥미진진한 모험을 합니다. 고대 이집트의 피라미드부터 프랑스 혁명까지, 역사 속 위인들을 만나고 중요한 사건들을 직접
    경험해요. 어린이 친구들은 타임캡슐의 신나는 모험을 따라가면서 세계 역사를 쉽고 재미있게 배울 수 있답니다. 마치 게임처럼 생생하게 역사를
    만날 수 있는 책이에요.
'9791198511577':
  title: 똥볶이 할멈 :K-히어로 판타지
  summary: 이 책은 맛있는 똥볶이를 파는 평범해 보이는 할머니의 이야기예요. 하지만 이 할머니는 사실 특별한 능력을 가진 숨겨진 K-히어로랍니다!
    할머니는 떡볶이를 만드는 힘으로 마을에 나타나는 악당들을 물리치고 친구들을 도와줘요. 평범한 할머니가 영웅으로 변신하는 모습이 아주 신나고
    재미있는 판타지 동화랍니다. 용기와 따뜻한 마음이 담긴 할머니의 활약을 기대해 보세요.
'9791198511591':
  title: 크리스마스 날 하늘 마을에서 온 택배
  summary: 크리스마스 이브, 하늘 마을에서 온 작은 택배를 배달하는 배달부 하늘이의 이야기예요. 하늘이는 눈 내리는 길을 따라가며 여러 친구들을
    만나요. 배달 가는 길에 친구들을 도와주고 따뜻한 마음을 나누지요. 작은 택배 상자 안에는 놀라운 선물이 숨겨져 있었는데, 바로 서로 돕는
    마음과 기쁨이 담겨 있었어요. 하늘이의 따뜻한 마음은 모두에게 멋진 크리스마스 선물이 된답니다.
'9791198809902':
  title: 말하고 싶은 비밀
  summary: 이 책은 아이들이 마음속에 품고 있는 비밀들에 대한 이야기예요. 주인공들은 저마다 아무에게도 말하지 못한 소중한 비밀을 가지고
    있답니다. 어떤 비밀은 누군가와 나누고 싶어 하고, 어떤 비밀은 혼자만 간직하고 싶어 하지요. 아이들은 비밀 때문에 느끼는 여러 복잡한 감정들을
    솔직하게 보여줍니다. 이 책을 읽다 보면 여러분도 자신만의 비밀에 대해 생각해보는 시간을 가질 수 있을 거예요. 때로는 비밀을 말할 용기가
    필요하다는 것도 알려준답니다.
'9791198948724':
  title: "(똥볶이 할멈의) 힘 주는 말"
  summary: 이 책은 '똥볶이 할멈'이라는 특별한 할머니와 아이들의 따뜻한 이야기예요. 할머니는 아이들이 힘들거나 속상할 때마다 힘을 주는
    따뜻한 말들을 건네준답니다. 학교생활이나 친구 관계에서 고민하는 아이들은 할머니의 말을 듣고 용기와 위로를 얻어요. 할머니의 마법 같은 말들
    덕분에 아이들은 다시 환하게 웃으며 스스로 어려움을 이겨낼 힘을 찾게 되지요. 이 책을 읽으면 우리 마음에도 긍정적인 생각의 씨앗이 심어지고,
    어려움을 극복할 수 있는 힘을 얻을 수 있을 거예요.
'9791198948731':
  title: 블랙북 :김하연 장편소설
  summary: 어느 날, 주인공은 우연히 낡고 비밀스러운 까만색 책 한 권을 발견해요. 이 책 안에는 마을 사람들이 오랫동안 숨겨왔던 놀라운
    이야기들과 비밀들이 담겨 있었죠. 주인공은 마치 탐정이 된 것처럼, 책에 적힌 단서들을 하나하나 따라가며 진실을 찾아 나서게 돼요. 때로는
    위험한 순간도 있지만, 용기를 내어 미스터리를 풀어나갑니다. 과연 주인공은 까만색 책에 담긴 모든 비밀을 밝혀내고 숨겨진 진실을 알게 될까요?
'9791198948748':
  title: 리와인드 베이커리 :범유진 장편소설
  summary: 리와인드 베이커리는 시간을 되돌릴 수 있는 특별한 빵을 파는 신기한 빵집이에요. 이 빵집의 주인 '진'은 손님들의 후회를 들어주고,
    빵을 만들어 과거로 돌아갈 기회를 선물하죠. 하지만 과거를 바꾼다고 해서 모든 일이 더 좋아지는 건 아니에요. 때로는 예상치 못한 새로운 문제가
    생기기도 해요. 진은 손님들이 후회에 갇히지 않고, 용기 내어 앞으로 나아가는 법을 깨닫도록 도와준답니다. 이 책은 실수해도 괜찮고, 지금을
    소중히 여기는 마음을 가르쳐주는 따뜻한 이야기예요.
'9791198948755':
  title: 맞춤법 천재라면 - 세기의 맞춤법 대결! 라면 팀 VS 편의점 팀
  summary: 이 책은 맞춤법을 쉽고 재미있게 배울 수 있도록 도와주는 이야기예요. '라면 팀'과 '편의점 팀' 친구들이 등장해서 누가누가 맞춤법을
    잘 아는지 대결을 펼쳐요. 헷갈리기 쉬운 표현들을 직접 사용하며 어떤 게 바른 맞춤법인지 자연스럽게 알 수 있게 된답니다. 친구들은 대결을
    통해 점점 맞춤법 천재로 변해가고, 독자들도 함께 배우면서 실력을 키울 수 있을 거예요. 맞춤법 공부가 어렵게 느껴지는 친구들에게 웃음과 재미를
    선물하는 책이랍니다.
'9791198948762':
  title: 똥볶이 할멈 :K-히어로 판타지
  summary: 강산이라는 아이가 우연히 특별한 똥볶이를 파는 할머니를 만나요. 이 할머니는 평범한 분이 아니라, 사실 엄청난 비밀을 가진 K-히어로였답니다.
    할머니가 만든 똥볶이는 먹으면 신기한 힘이 솟아나는 마법의 음식이에요. 강산이와 친구들은 똥볶이 할멈과 함께 세상을 지키기 위한 흥미진진한
    모험을 시작해요. 맛있는 똥볶이와 함께 용기와 우정, 그리고 멋진 한국형 영웅들의 이야기를 만날 수 있을 거예요.
'9791199398122':
  title: 시간 고양이
  summary: 수진이는 시간을 멈추거나 되돌릴 수 있는 신기한 고양이 '시'를 만납니다. 수진이는 이 고양이의 특별한 능력으로 싫었던 일을 되돌리거나
    실수를 고치곤 했어요. 하지만 시간을 바꾸는 것이 항상 좋은 결과만 가져오는 것은 아니라는 것을 깨닫게 됩니다. 때로는 더 큰 문제가 생기기도
    하고, 소중한 추억이 사라지기도 하죠. 결국 수진이는 과거를 바꾸기보다는 지금 이 순간을 소중히 여기고 받아들이는 법을 배우게 됩니다. 이
    책은 시간의 소중함과 현재를 살아가는 용기에 대해 이야기해 줍니다.
'9791168412712':
  title: "(처음 읽는) 그리스 로마 신화 =First Greek mythology"
  summary: 제우스, 헤라, 포세이돈 같은 올림포스 신들과 헤라클레스, 페르세우스 같은 영웅들의 이야기를 담은 책이에요. 신들이 다투기도 하고
    인간을 돕거나 벌주기도 하면서 세상에 여러 가지 일이 벌어져요. 헤라클레스가 힘든 열두 가지 과업을 해내는 이야기나 트로이 전쟁 이야기처럼
    손에 땀을 쥐게 하는 모험담도 만날 수 있어요. 신비하고 흥미진진한 그리스 로마 신화 속 이야기들을 쉽고 재미있게 읽을 수 있답니다.
'9788950989804':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 한자의 힘으로 마법을 부리는 신기한 이야기예요. 주인공들은 요괴들이 사는 세상에 들어가 전설의 손오공을 만나 함께 모험을 떠나요.
    위험한 요괴를 물리치려면 한자를 알아야 마법을 쓸 수 있어서, 모험을 하면서 자연스럽게 한자를 배우게 돼요. 손오공과 친구들이 힘을 모아 어려운
    고비를 넘기는 신나는 이야기가 펼쳐진답니다.
'9791191496000':
  title: 설민석의 세계사 대모험
  summary: 설민석 선생님과 함께 세계 역사 속으로 떠나는 모험 이야기예요. 주인공들은 시간을 넘나들며 이집트, 로마, 중국 같은 여러 나라의
    옛날 역사적 사건과 인물들을 직접 만나게 돼요. 위기의 순간마다 지혜를 발휘해 문제를 해결하면서 세계사의 중요한 장면들을 생생하게 체험해요.
    재미있는 모험을 따라가다 보면 어려운 세계사 지식도 저절로 익히게 된답니다.
'9791164060931':
  title: "(이상한 과자 가게) 전천당"
  summary: 이상한 과자 가게 전천당에는 베니코 할머니가 있어요. 손님이 가게에 들어오면 할머니는 그 사람에게 꼭 필요한 신기한 과자를 딱
    하나 골라줘요. 과자를 먹으면 소원이 이루어지지만, 설명서에 적힌 규칙을 지키지 않으면 무서운 일이 벌어지고 말아요. 손님마다 다른 사연과
    소원, 그리고 과자의 신비한 힘이 펼쳐지는 이야기랍니다.
