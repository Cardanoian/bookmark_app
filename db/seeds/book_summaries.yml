'9791164381524':
  title: "(코믹 메이플스토리) 수학도둑 :지식·능력·경험을 융합하여 정리하는 No.1 수학학습만화"
  summary: 수학 나라의 소중한 수학 지식을 도둑맞으면서 이야기가 시작돼요. 주인공들은 사라진 수학 개념을 되찾기 위해 수학도둑을 뒤쫓으며
    모험을 떠나지요. 모험 중에 만나는 문제들을 하나씩 풀어가면서 자연스럽게 수학 원리를 익히게 돼요. 메이플스토리의 인기 캐릭터들이 함께 등장해서
    더욱 재미있게 수학을 배울 수 있는 학습 만화예요.
'9788950977016':
  title: 마법천자문 :손오공의 한자 대탐험
