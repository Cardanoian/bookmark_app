'9788950963477':
  title: 마법천자문 :손오공의 한자 대탐험
  summary: 손오공은 스승 삼장법사와 함께 세상을 구하기 위해 신비한 한자의 힘을 모으는 모험을 떠나요. 곳곳에 숨겨진 한자들을 찾아내 익히면
    그 한자가 가진 힘을 마법처럼 사용할 수 있어요. 여행 중에 다양한 요괴와 악당들을 만나 한자의 힘으로 맞서 싸우며 위기를 헤쳐 나가요. 재미있는
    모험 이야기를 따라가다 보면 자연스럽게 여러 한자와 뜻을 배울 수 있어요. 이야기와 학습을 함께 즐길 수 있는 어린이 인기 학습만화예요.
