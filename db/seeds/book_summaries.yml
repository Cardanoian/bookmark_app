'9788949144092':
  title: 배드 가이즈
  summary: 늑대 씨, 뱀 씨, 상어 씨, 피라냐 씨는 무섭게 생겼다는 이유로 늘 나쁜 놈 취급을 받아 온 친구들이에요. 오해를 벗고 착한
    이미지로 거듭나고 싶어진 이들은 '굿가이즈 클럽'을 만들어 착한 일을 하기로 결심해요. 첫 도전으로 동물 보호소에 갇힌 강아지들을 구하러 가지만
    계획대로 되지 않고 우당탕 소동이 벌어져요. 겉모습만 보고 무섭다고 오해받던 친구들이 진짜 좋은 친구가 되어 가는 과정을 유쾌하게 그려요.
    편견을 넘어서는 우정과 성장을 재미있게 보여 주는 그림책이에요.
'9788949144115':
  title: 배드 가이즈
