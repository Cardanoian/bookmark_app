    이 책을 읽다 보면 마치 게임을 하듯이 역사 지식이 쑥쑥 자라고, 다음 이야기가 저절로 기다려질 거예요."
'9791196893187':
  title: 설민석의 세계사 대모험
  summary: 이 책은 설민석 선생님과 함께 시간 여행을 떠나 세계 곳곳의 역사를 배우는 아주 신나는 모험 이야기예요. 주인공 설쌤, 세나,
    로빈이 고대 이집트, 로마, 중국 등 여러 문명 속으로 들어가 그 시대의 역사적 사건과 인물들을 직접 만나요. 흥미진진한 만화와 이야기로 어렵게
    느껴질 수 있는 세계사의 중요한 정보들을 쉽고 재미있게 알려준답니다. 이 책을 읽다 보면 자연스럽게 역사 지식을 쌓고, 세상을 더 넓게 바라보는
    눈을 키울 수 있을 거예요.
'9791196893194':
  title: 설민석의 세계사 대모험
