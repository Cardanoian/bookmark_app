'9788937839818':
  title: 윔피 키드
  summary: 평범한 중학생 그레그는 학교에서도 집에서도 크고 작은 사건 사고를 몸소 겪어요. 잘나가고 싶은 마음은 굴뚝같지만 현실은 늘 어설프고
    창피한 순간의 연속이지요. 그레그는 자신의 하루하루를 일기와 그림으로 솔직하게 기록해 나가요. 웃음이 절로 나는 좌충우돌 학교생활 이야기예요.
'9791190569477':
  title: 오무라이스 잼잼 13
  summary: 작가가 좋아하는 여러 음식과 요리에 얽힌 소소한 이야기를 그림과 함께 들려주는 에세이 만화예요. 평범한 요리 하나에도 숨어 있는
    재미있는 유래나 특별한 추억을 발견할 수 있어요. 직접 요리하는 과정과 맛있게 먹는 순간의 즐거움이 생생하게 담겨 있어요. 음식을 통해 일상을
    더 따뜻하게 바라보게 해 주는 만화예요.
'9788965466642':
  title: 프리워터 :자유를 찾는 모든 이들의 꿈
  summary: 노예로 살던 어린 남매는 목숨을 걸고 도망쳐 깊은 늪지대 숲속으로 숨어들어요. 그곳에서 뜻밖에도 자유를 찾아 먼저 도망쳐 온 사람들이
    모여 사는 숨겨진 마을을 발견하게 되지요. 마을 사람들은 서로를 가족처럼 보살피며 자유로운 삶을 지켜가고 있었어요. 남매는 그 안에서 진짜
    자유와 용기, 그리고 함께하는 힘의 의미를 배워가요.
