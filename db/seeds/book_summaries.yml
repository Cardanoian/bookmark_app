'9791164137213':
  title: 윔피 키드
  summary: 평범한 중학생 그레그 헤플리가 매일매일 겪는 좌충우돌 학교생활을 일기 형식으로 담은 이야기예요. 그레그는 인기 많은 친구가 되고
    싶지만 뜻대로 되지 않아 크고 작은 실수와 망신을 당하곤 합니다. 단짝 친구 롤리, 짓궂은 형 로드릭과 함께 벌어지는 사건들이 웃음을 자아내요.
    삐뚤빼뚤한 그림과 함께 쓰인 솔직한 일기가 친근하게 다가오는 이야기입니다.
