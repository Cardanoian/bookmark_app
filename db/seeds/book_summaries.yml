  summary: 동네에 있는 낡은 문방구에서 신기한 물건들을 파는 이야기예요. 아이들은 저마다의 소원을 이루어 줄 것 같은 신비한 물건을 사게
    되지만, 그 물건에는 예상치 못한 대가가 따라와요. 물건을 통해 아이들은 자신의 욕심과 마음을 돌아보게 돼요. 소원과 교훈이 함께 담긴 신비로운
    이야기예요.
'9791168122543':
  title: 도그맨
  summary: 경찰견과 경찰관이 사고를 당해 몸은 사람, 머리는 개인 도그맨으로 다시 태어나는 이야기예요. 도그맨은 뛰어난 후각과 충성심으로
    마을에서 일어나는 사건들을 해결해 나가요. 악당 고양이 피티와 티격태격하면서도 결국 도그맨은 정의를 지켜내요. 유쾌한 그림과 말장난이 가득한
    만화책이에요.
'9791161725390':
  title: 11월 13일의 불꽃 :청년 전태일의 꿈
  summary: 어려운 환경에서 일하던 어린 노동자들을 안타깝게 여긴 청년 전태일의 이야기예요. 전태일은 열악한 노동 환경을 개선하기 위해 노력했지만
    세상은 쉽게 바뀌지 않았어요. 결국 그는 노동자들의 권리를 알리기 위해 자신의 몸을 던지는 큰 결심을 해요. 더 나은 세상을 꿈꾸었던 한 청년의
    용기를 담은 이야기예요.
'9788965590743':
  title: 윔피 키드
  summary: 평범한 중학생 그레그가 학교와 가족 안에서 겪는 좌충우돌 일상을 그림일기 형식으로 담은 이야기예요. 인기를 얻고 싶어 하지만 늘
    어설픈 실수를 저지르는 그레그의 모습이 웃음을 자아내요. 친구와 형제 사이에서 벌어지는 크고 작은 사건들이 재미있게 펼쳐져요. 솔직하고 유쾌한
    그림일기로 사랑받는 이야기예요.
'9788950993221':
  title: "(만화) 열두 살에 부자가 된 키라"
  summary: 돈 때문에 고민하던 열두 살 소녀 키라가 말하는 고양이 머니를 만나면서 이야기가 시작돼요. 고양이 머니는 키라에게 돈을 모으고
    현명하게 쓰는 방법을 하나씩 알려줘요. 키라는 머니의 조언을 따라 조금씩 저축하고 꿈을 이루어가는 법을 배워요. 어린이의 눈높이에서 돈과 경제를
    배우게 해주는 이야기예요.
