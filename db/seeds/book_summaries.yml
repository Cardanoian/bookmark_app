'9791193031926':
  title: 설민석의 세계사 대모험
  summary: 설민석 선생님과 함께 아이들이 시간여행을 떠나 세계사 속 중요한 순간들을 직접 만나 보는 이야기예요. 이집트 문명부터 여러 나라의
    큰 사건들을 생생하게 체험하며 세계 역사의 흐름을 배우게 되지요. 어렵게만 느껴지던 세계사가 모험처럼 펼쳐지면서 술술 이해가 돼요. 설민석
    선생님 특유의 재미있는 설명으로 세계사와 한 걸음 더 가까워질 수 있는 책이에요.
'9791198363510':
  title: 아몬드 :손원평 장편소설
  summary: 윤재는 태어날 때부터 감정을 잘 느끼지 못하는 특별한 뇌를 가지고 있어요. 크리스마스 이브에 벌어진 끔찍한 사고로 할머니를 잃고
    엄마마저 의식을 잃게 되면서 윤재는 혼자가 되지요. 그러던 어느 날 매사에 화가 잔뜩 나 있는 친구 곤이를 만나면서 윤재의 삶에 조금씩 변화가
    찾아와요. 서로 너무나 다른 두 아이가 우정을 쌓아가며 진짜 감정이란 무엇인지 함께 배워가는 이야기예요.
