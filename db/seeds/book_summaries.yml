  summary: 이 책은 인기 유튜버 슈뻘맨이 보여주는 기발하고 엉뚱한 도전들 속에 숨어 있는 과학 상식을 재미있게 알려줘요. 슈뻘맨이 직접 보여주는
    신기한 실험과 예측 불가능한 도전을 따라가면서, 우리 주변의 다양한 과학 원리를 쉽고 즐겁게 배울 수 있답니다. 액체 괴물 만들기부터 하늘을
    나는 물건의 비밀까지, 어린이들이 호기심을 가질 만한 주제들이 가득해요. 어려운 과학 이론 대신, 직접 눈으로 보고 이해하기 쉬운 설명 덕분에
    과학이 얼마나 재미있는지 깨달을 수 있을 거예요. 이 책을 통해 과학이 결코 어렵지 않고 우리 생활 속에 가까이 있다는 것을 발견할 수 있을
    거예요.
'9791168415188':
  title: 슈뻘맨의 숨은 과학 찾기 :엉뚱 도전 속에 숨은 과학 상식
  summary: 유튜브 인기 크리에이터 슈뻘맨이 기발하고 엉뚱한 도전에 나서는 이야기예요. 투명 벽 만들기, 콜라 폭포 실험 등 평범한 듯 보이지만
    특별한 궁금증을 자극하는 도전들을 펼쳐요. 이 책은 슈뻘맨이 직접 다양한 실험을 하며 겪는 흥미진진한 상황들을 보여준답니다. 어린이 친구들은
    슈뻘맨의 좌충우돌 도전 속에 숨어 있는 재미있는 과학 원리와 상식을 자연스럽게 배울 수 있어요. 마치 놀이처럼 과학을 접하며 호기심을 키우고
    생각하는 힘을 기를 수 있도록 돕는답니다.
'9791168415232':
  title: 흔한남매
  summary: "「흔한남매」는 말썽쟁이 오빠 으뜸이와 똑 부러지는 여동생 에이미의 재미있는 일상 이야기예요. 이 책에는 두 남매가 집에서, 학교에서,
    그리고 친구들과 함께 겪는 여러 가지 시끌벅적하고 웃긴 사건들이 가득하답니다. 서로 놀리고 장난치며 티격태격 싸우는 모습은 꼭 우리 주변의
    흔한 남매들 같아요. 하지만 미운 정 고운 정 다 들었는지, 결정적인 순간에는 서로를 아끼고 챙기는 따뜻한 마음을 보여주기도 해요. 어린이
    독자들이 공감하며 웃을 수 있는 유쾌한 이야기들이 가득한 책이랍니다."
'9791168415331':
  title: 흔한남매 이상한 나라의 고전 읽기
  summary: 으뜸이와 에이미, 흔한남매가 이번에는 신기한 고전 이야기 속으로 들어가 모험을 시작해요. 마치 '이상한 나라의 앨리스'처럼 예상치
    못한 일들이 가득한 세상에 발을 들이게 되죠. 그곳에서 흔한남매 특유의 장난기와 유머로 여러 사건을 겪으며 고전 명작을 새로운 시선으로 바라보게
    해줘요. 이 책을 읽으면 어렵게 느껴지던 고전 이야기가 흔한남매 덕분에 아주 재미있고 쉽게 다가올 거예요. 아이들은 이 책을 통해 고전의 매력을
    즐겁게 발견할 수 있답니다!
'9791168415355':
  title: "(흔한남매) 별난 세계 여행"
  summary: 으뜸이와 에이미 흔한남매가 이번엔 신나는 세계 여행을 떠나요. 여행 중 마법에 걸린 비행기를 타고 특별한 능력을 얻게 되어 전
    세계를 누비며 여러 나라의 숨겨진 보물을 찾아 나선답니다. 세계 곳곳에서 벌어지는 좌충우돌 에피소드 속에서 남매는 티격태격하면서도 끈끈한 우정을
    보여주지요. 과연 으뜸이와 에이미는 흥미진진한 세계 여행을 무사히 마치고 돌아올 수 있을까요?
'9791168415379':
  title: 웃소
  summary: 인기 유튜브 채널 '웃소' 멤버들이 이번에는 책 속으로 들어왔어요! 웃소 친구들인 태훈, 디투, 성희, 고탱, 해리는 어느 날
    갑자기 알 수 없는 신비한 저택에 갇히게 돼요. 저택 곳곳에는 이상하고 재미있는 미션들이 숨어 있는데, 친구들은 서로 힘을 합쳐 이 미션들을
    해결해야만 저택을 탈출할 수 있답니다. 웃소 멤버들의 재치 있는 아이디어와 좌충우돌 모험을 따라가며 즐거운 웃음과 함께 문제를 해결하는 재미를
    느낄 수 있을 거예요. 과연 웃소 친구들은 힘을 모아 저택을 탈출할 수 있을까요?
'9791168415409':
  title: 흔한남매의 흔한 호기심 :일상에서 만나는 과학 상식
  summary: 이 책은 인기 유튜브 채널 '흔한남매'의 주인공인 에이미와 으뜸이가 우리 주변의 과학을 재미있게 알려주는 책이에요. 아이들이 일상에서
    한 번쯤 궁금해했을 만한 질문들을 모아 쉽고 친절하게 설명해 줘요. 예를 들어, 왜 하늘이 파란지, 물건이 왜 무거운지 같은 과학 원리를 만화와
    실험으로 풀어낸답니다. 어려운 과학 용어 대신 눈높이에 맞는 설명과 그림 덕분에 누구나 즐겁게 과학 상식을 배울 수 있어요. 이 책을 읽다
    보면 과학이 우리 생활과 아주 가깝다는 것을 깨닫게 될 거예요.
'9791168415539':
  title: 에그박사 :Egg&bugs
  summary: 에그박사 친구들과 함께 신나는 곤충 탐험을 떠나는 이야기예요. 주인공 에그박사, 웅박사, 찐박사가 숲속이나 물가 등 다양한 자연
    속에서 여러 곤충들을 만나요. 작은 개미부터 멋진 장수풍뎅이까지, 곤충들의 특징과 살아가는 모습을 재미있게 관찰할 수 있지요. 책을 읽다 보면
    곤충들이 어떻게 자라고 무엇을 먹는지, 신기한 비밀들을 알게 될 거예요. 이 책은 곤충에 대한 궁금증을 풀어주고 자연을 사랑하는 마음을 키워줄
    거예요.
'9791168415591':
  title: "(흔한남매) 수수께끼 어드벤처 :수수께끼로 배우는 교과 지식"
  summary: 이 책은 인기 유튜버 흔한남매, 에이미와 으뜸이가 등장하는 신나는 수수께끼 어드벤처예요. 흔한남매는 수수께끼가 가득한 세상으로
    모험을 떠나며 독자들을 초대해요. 이야기는 두 남매가 여러 사건을 겪으며 재미있는 퀴즈와 미스터리를 해결하는 방식으로 진행돼요. 독자들은 흔한남매와
    함께 수수께끼를 풀면서 자연스럽게 교과서에 나오는 지식들을 배울 수 있어요. 지루하게 느껴질 수 있는 학교 공부를 웃음과 함께 즐겁게 접할
    수 있도록 도와주는 책이랍니다. 이 책을 읽다 보면 여러분도 똑똑해지는 기분을 느끼며 책 읽는 재미에 푹 빠질 거예요!
'9791168415621':
  title: 내일은 발명왕 :본격 대결 과학발명 만화
  summary: 이 책은 발명 대결을 펼치는 친구들의 신나는 과학 만화예요. 주인공들이 재미있는 발명품을 만들면서 우리 주변의 과학 원리를 쉽게
    배울 수 있어요. 친구들은 대결에서 이기기 위해 기발한 아이디어를 내고 직접 발명품을 만들며 창의력을 키워나가요. 이 책을 읽으면 다양한 발명
    지식과 과학 상식을 자연스럽게 익힐 수 있고, 나도 멋진 발명가가 되고 싶다는 생각이 들 거예요.
'9791168415744':
  title: "(처음 읽는) 그리스 로마 신화 =First Greek mythology"
  summary: 그리스 로마 신화는 아주 오랜 옛날부터 전해 내려오는 흥미진진한 이야기들을 모아 놓은 책이에요. 이 책은 세상이 어떻게 생겨났는지,
    하늘과 땅을 다스리는 신들은 누구인지 알려줘요. 제우스, 헤라, 아폴론 등 여러 신들의 재미있는 모험과 신기한 능력을 만날 수 있어요. 때로는
    슬프고, 때로는 용감한 신들과 사람들의 이야기가 가득하답니다. 신들의 지혜와 인간의 약점을 통해 세상을 살아가는 소중한 지혜를 배울 수 있을
    거예요.
'9791168416314':
  title: 흔한남매 이상한 나라의 고전 읽기
  summary: 흔한남매의 으뜸이와 에이미가 신비로운 고전 이야기 속으로 떠나는 모험이에요. 두 남매는 '이상한 나라의 앨리스'나 '오즈의 마법사'처럼
    유명한 고전 동화 속 주인공들을 직접 만나게 된답니다. 흔한남매 특유의 유쾌한 말과 행동으로 고전 이야기에 재미를 더해줘요. 친구들은 이 책을
    읽으면서 어렵게만 느껴졌던 고전들을 아주 쉽고 즐겁게 이해할 수 있을 거예요. 고전의 깊은 지혜와 흔한남매의 웃음을 한 번에 만날 수 있답니다.
'9791168416369':
  title: 흔한남매
  summary: 흔한남매는 평범한 남매인 으뜸이와 에이미가 주인공인 아주 재미있는 이야기예요. 이 책은 남매가 집에서, 학교에서, 또는 밖에서
    겪는 웃기고 황당한 일들을 만화로 보여준답니다. 으뜸이는 장난꾸러기 오빠이고, 에이미는 엉뚱하고 귀여운 동생이에요. 둘은 티격태격 싸우기도
    하고 서로를 놀리기도 하지만, 결국에는 서로 아끼는 마음을 보여줘요. 책을 읽다 보면 여러분의 형제나 자매와 비슷한 모습에 공감하고 깔깔 웃게
    될 거예요. 유쾌한 흔한남매의 일상 속으로 함께 떠나봐요!
'9791168416598':
  title: 흔한남매의 흔한 호기심 :일상에서 만나는 과학 상식
  summary: 흔한남매 에이미와 에드워드가 매일매일 겪는 흔한 일상 속에서 궁금했던 과학 질문들을 함께 파헤치는 책이에요. 하늘이 왜 파랗고,
    물은 왜 위에서 아래로 흐르는지 등 다양한 호기심을 흔한남매만의 유쾌한 방식으로 설명해준답니다. 어려운 과학 용어 대신 재미있는 그림과 이야기로
    과학 원리를 쉽게 이해할 수 있어요. 우리 주변에서 흔히 볼 수 있는 현상들이 어떤 과학 원리로 일어나는지 자연스럽게 배울 수 있을 거예요.
    이 책을 읽으면 과학이 훨씬 더 재미있고 신나는 세상으로 느껴질 거예요!
'9791168416628':
  title: "(흔한남매) 별난 세계 여행"
  summary: 이 책은 인기 유튜버 흔한남매 으뜸이와 에이미가 전 세계를 여행하며 벌어지는 기상천외한 이야기들을 담고 있어요. 평범하지 않은
    특별한 세계 여행 속에서 흔한남매는 여러 나라의 독특한 문화와 재미있는 생활 모습을 만나게 된답니다. 흔한남매 특유의 장난과 웃음이 가득한
    일들을 겪으면서, 때로는 좌충우돌 실수도 하고 새로운 것을 배우기도 해요. 이 책을 읽으면 마치 흔한남매와 함께 지구 한 바퀴를 도는 것처럼
    즐거운 간접 경험을 할 수 있을 거예요. 과연 흔한남매는 별난 세계 여행을 무사히 마칠 수 있을까요?
'9791168416703':
  title: 웃소
  summary: 웃소 미스터리 개그 클럽 친구들이 신비로운 도깨비의 섬으로 특별한 여행을 떠나요. 그 섬에서는 도깨비들이 나타나고, 자꾸만 이상하고
    재미있는 일들이 벌어진답니다. 친구들은 웃음과 기발한 상상력을 모아 섬의 미스터리한 사건들을 해결해나가야 해요. 이 과정을 통해 용기와 우정의
    소중함을 깨닫고, 과연 섬의 비밀을 밝혀낼 수 있을까요?
'9791168416840':
  title: 에그박사 :Egg&bugs
  summary: 이 책은 유튜브에서 유명한 '에그박사'님들이 곤충 친구들을 찾아다니며 재미있는 이야기를 들려주는 책이에요. 에그박사님, 양박사님,
    웅박사님이 함께 숲속이나 물가 등 여러 곳을 탐험하면서 새로운 곤충을 만난답니다. 평소에는 무심코 지나쳤던 개미, 무당벌레 같은 작은 곤충들의
    특별한 습관과 사는 모습을 자세히 알려줘요. 곤충들이 알에서 깨어나 자라나는 모습부터 어떤 재미있는 능력을 가지고 있는지도 알 수 있어요.
    이 책을 읽으면 곤충에 대한 궁금증이 해결되고, 우리 주변의 자연과 작은 생명들을 더 사랑하게 될 거예요.
'9791168417199':
  title: 흔한남매
  summary: 으뜸이와 에이미는 매일매일 장난을 치며 티격태격 다투는 흔한 남매예요. 서로를 골탕 먹이려 하거나 놀리기도 하지만, 사실은 누구보다
    서로를 아끼고 사랑한답니다. 이 책은 유튜브에서 큰 인기를 얻은 흔한남매의 유쾌하고 코믹한 일상을 담은 만화예요. 친구들과 가족들이 함께 공감하며
    웃을 수 있는 재미있는 이야기들이 가득 들어 있답니다. 때로는 엉뚱하고 때로는 감동적인 남매의 모습에 푹 빠져들 거예요.
'9791168417601':
  title: 내일은 발명왕 :본격 대결 과학발명 만화
  summary: 이 책은 발명 대결에 참가한 어린이들의 신나는 이야기를 담고 있어요. 주인공들은 과학 원리를 배우면서 기발한 아이디어를 현실로
    만들어내지요. 친구들과 함께 머리를 맞대고, 때로는 경쟁하며 멋진 발명품을 만들어간답니다. 이 책을 읽으면 우리 주변의 과학이 얼마나 재미있는지,
