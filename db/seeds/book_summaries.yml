  summary: 실룩이는 변비 때문에 고민하는 친구들을 돕는 아주 특별한 탐정이에요. 이 책은 실룩 탐정이 여러 아이들의 변비 문제를 해결하는
    과정을 재미있게 보여줘요. 실룩이는 아이들이 어떤 음식을 먹고, 어떻게 생활하는지 꼼꼼히 조사한답니다. 변비가 생기는 이유를 알려주고, 건강하게
    화장실 가는 비법을 가르쳐줘요. 이 책을 읽으면 몸속 이야기도 배우고, 즐겁게 변비 걱정을 날려버릴 수 있을 거예요!
'9791168341180':
  title: 야옹이 수영 교실
  summary: 야옹이는 사실 물을 싫어하지만, 시원하게 헤엄치는 친구들이 부러웠어요. 용기를 내어 돌고래 선생님의 수영 교실에 등록했답니다.
    처음에는 물에 들어가는 것조차 무서워했지만, 선생님과 친구들의 따뜻한 응원 덕분에 포기하지 않았어요. 야옹이는 열심히 연습하며 물에 대한 두려움을
    극복했고, 마침내 멋지게 헤엄치는 법을 배우게 됩니다. 이 책은 두려움을 이겨내고 새로운 도전에 성공하는 야옹이의 용감한 이야기를 담고 있어요.
'9791168341340':
  title: 변비 탐정 실룩
  summary: 주인공 '실룩'은 변비 때문에 힘들어하는 친구들을 돕는 아주 특별한 탐정이에요. 실룩 탐정은 친구들이 왜 변비에 걸렸는지 여러
    가지 단서를 찾아내고 똑똑하게 해결 방법을 알려준답니다. 이 책은 우리가 무엇을 먹고 어떤 생활 습관을 가지는지에 따라 변비가 생길 수 있다는
    것을 재미있게 보여줘요. 건강한 식습관과 운동의 중요성을 배우면서 실룩 탐정과 함께 변비를 물리치는 유쾌한 이야기랍니다.
'9791168341623':
  title: "(시원하게 도와주는) 북극곰 센터"
  summary: 지구가 점점 더워져서 북극곰들이 살 곳인 얼음이 자꾸 녹고 있어요. 그래서 북극곰들이 힘들어할 때마다 도와주는 특별한 '북극곰
    센터'가 생겼답니다. 이 센터에서는 북극곰들에게 시원한 얼음을 주고, 아픈 북극곰들을 치료해 주며 돌봐줘요. 주인공 하준이는 북극곰 센터에서
    일어나는 일들을 보면서, 지구를 아끼고 북극곰들을 돕는 것이 얼마나 중요한지 깨닫게 된답니다. 우리는 이 책을 통해 북극곰 친구들을 돕고 환경을
    사랑하는 마음을 키울 수 있어요.
'9791168341852':
  title: 변비 탐정 실룩
  summary: 이 책은 '변비 탐정 실룩'이 되어 아이들의 변비 고민을 해결해 주는 이야기예요. 우리 몸속에서 음식물이 어떻게 소화되고 배출되는지
    재미있게 설명해 줘요. 변비에 걸리지 않기 위해 채소를 많이 먹고, 물을 충분히 마시고, 규칙적으로 운동하는 것이 얼마나 중요한지 알려준답니다.
    변비로 힘들어하는 친구들이 건강한 배변 습관을 기르는 데 도움을 주는 유쾌하고 교육적인 책이에요.
'9791168342422':
  title: 변비 탐정 실룩
  summary: 주인공 실룩이는 변비 때문에 힘들어하는 친구들을 돕는 특별한 탐정이에요. 실룩이는 친구들의 몸속으로 들어가 음식들이 어떻게 소화되고
    건강한 응가가 되는지 신기한 모험을 통해 보여줘요. 이 책을 읽으면 우리 몸이 어떻게 움직이는지 배우고, 채소와 물을 충분히 먹는 것이 얼마나
    중요한지 알 수 있을 거예요. 실룩이 탐정과 함께 건강한 응가를 만드는 비밀을 찾아 떠나봐요!
'9791168342439':
  title: 천 년 집사 백 년 고양이 :추정경 장편소설
  summary: 여기 100년 동안 살아온 특별한 고양이 '하루'가 있어요. 하루는 자신을 천 년 동안 모실 집사를 찾기 위해 특별한 여정을 떠난답니다.
    이 여행 중에 하루는 여러 사람을 만나면서 따뜻하고 소중한 경험을 하게 돼요. 고양이의 눈으로 본 사람들의 세상은 때로는 웃기고, 때로는 슬프지만
    늘 새로운 깨달음을 주어요. 과연 하루는 자신에게 딱 맞는 천 년 집사를 찾고 진정한 행복을 찾을 수 있을까요? 이 책은 삶과 관계의 소중함을
    알려주는 감동적인 이야기예요.
'9791168342811':
  title: "(뜨겁게 도와주는) 북극곰 센터"
  summary: 북극곰 아저씨는 세상에서 가장 친절하고 뜨거운 마음을 가진 동물이에요. 그는 고민에 빠진 다른 동물 친구들을 도와주기 위해 특별한
    센터를 열었답니다. 센터에 찾아오는 코끼리, 펭귄, 그리고 여러 동물들은 북극곰 아저씨의 따뜻한 도움 덕분에 용기를 얻고 문제를 해결해요.
    이 책을 읽으면 힘든 친구를 돕는 것이 얼마나 중요한지 깨닫고, 세상의 모든 동물들이 서로 아끼고 돕는 따뜻한 마음을 배울 수 있을 거예요.
'9791168410541':
  title: "(흔한남매) 별난 방탈출 :탈출 미션 스토리북"
  summary: 이 책은 인기 유튜버 '흔한남매'가 주인공으로 나오는 신나는 방탈출 이야기예요. 에이미와 으뜸이가 함께 특별한 방탈출 미션에 도전하게
    된답니다. 숨겨진 단서를 찾고, 재미있는 수수께끼를 풀면서 다음 단계로 나아가야 해요. 과연 흔한남매는 여러 가지 어려운 함정을 통과하고 무사히
    방을 탈출할 수 있을까요? 친구들과 함께 읽으면서 추리력과 문제 해결 능력을 키울 수 있는 흥미진진한 모험 이야기예요.
'9791168410848':
  title: 흔한남매의 흔한 호기심 :일상에서 만나는 과학 상식
  summary: 이 책은 인기 유튜버 흔한남매가 등장하여 우리 주변의 과학 호기심을 쉽고 재미있게 풀어주는 책이에요. 흔한남매와 함께 '왜 하늘은
    파랄까?', '왜 목욕탕 거울에는 김이 서릴까?' 같은 일상 속 질문들을 탐험할 수 있어요. 만화 형식으로 되어 있어서 지루하지 않고 즐겁게
    과학 지식을 배울 수 있지요. 어려운 과학 용어 대신 친절한 설명으로 과학이 얼마나 재미있는지 알려준답니다. 우리 친구들도 이 책을 읽으며
    과학에 대한 궁금증을 해결하고 과학 박사가 될 수 있을 거예요!
'9791168410930':
  title: 흔한남매 오해요 :귀염 뽀짝 부캐들과 펼치는 초단편 콩트 만화
  summary: 인기 유튜버 흔한남매가 만든 아주 재미있는 만화책이에요. 으뜸이와 에이미 남매, 그리고 그들의 귀여운 부캐(새로운 모습) 친구들이
    주인공이랍니다. 이 책에서는 짧고 웃긴 이야기들이 많이 펼쳐져요. 친구들이 서로 오해하기도 하고, 재미있는 장난을 치면서 엉뚱하고 유쾌한 상황들을
    만들어낸답니다. 매 페이지마다 배꼽 잡는 이야기들이 가득해서 지루할 틈이 없을 거예요.
'9791168411029':
  title: 에그박사 :Egg&bugs
  summary: 에그박사 삼총사(에그박사, 웅박사, 닥터유)는 곤충과 자연을 아주 사랑하는 친구들이에요. 이 책은 에그박사 친구들이 신기한 곤충들을
    직접 만나 관찰하고 재미있는 모험을 하는 과학 학습 만화랍니다. 곤충들의 특별한 능력이나 생김새, 살아가는 방식 등 흥미로운 곤충 이야기를
    쉽게 배울 수 있어요. 만화로 되어 있어서 어렵지 않게 읽으면서 곤충에 대한 호기심을 키울 수 있을 거예요. 책을 읽다 보면 우리 주변의 작은
    곤충들이 얼마나 소중하고 멋진 존재인지 깨닫게 될 거예요.
'9791168411074':
  title: 웃소
  summary: 웃소 책은 인기 유튜브 채널 '웃소' 친구들의 기발하고 유쾌한 이야기를 담고 있어요. 웃소 멤버들이 기상천외한 상상력으로 다양한
    미션에 도전하며 예측 불가능한 상황들을 만들어낸답니다. 책을 읽는 동안 때로는 배꼽 빠지게 웃고, 때로는 엉뚱한 아이디어에 깜짝 놀라게 될
    거예요. 웃소 친구들과 함께 즐거운 모험을 떠나면서 창의적인 생각과 넘치는 유머 감각을 키울 수 있을 거예요.
'9791168411333':
  title: "(처음 읽는) 그리스 로마 신화 =First Greek mythology"
  summary: 이 책은 아주 먼 옛날, 그리스와 로마 사람들이 상상했던 신들과 영웅들의 멋진 이야기를 들려줘요. 하늘을 다스리는 제우스 신부터
    지혜로운 아테나 여신, 바다의 신 포세이돈까지 여러 신들의 놀라운 능력을 만날 수 있어요. 신들이 왜 싸우고, 어떻게 세상을 만들었는지 재미있는
    에피소드들을 읽다 보면 시간이 가는 줄 모를 거예요. 용감한 영웅들이 무서운 괴물들과 싸우는 이야기들도 가득해서 어린이 친구들이 신화의 세계에
    푹 빠져들 수 있답니다.
'9791168411685':
  title: 흔한남매
  summary: 흔한남매는 유튜브에서 큰 인기를 얻고 있는 '흔한남매' 채널의 재미있는 일상 이야기를 책으로 만든 거예요. 으뜸이 오빠와 에이미
    동생이 서로 장난을 치고 투닥거리면서 벌어지는 유쾌하고 코믹한 에피소드들이 가득하답니다. 평범한 학교생활, 집에서의 모습, 친구들과의 이야기
    등 초등학생 친구들이 공감할 만한 내용들이 많아요. 때로는 엉뚱하고 때로는 귀여운 남매의 모습에 절로 웃음이 터져 나올 거예요. 이 책을 읽으면
    마치 내 옆에 있는 오빠나 동생처럼 친근하게 느껴질 거예요.
'9791168411692':
  title: "(흔한남매) 별난 방탈출 :탈출 미션 스토리북"
  summary: 흔한남매 에이미와 으뜸이가 신비한 방탈출 게임에 갇히게 돼요. 친구들은 책을 읽으면서 흔한남매를 도와 여러 방에서 탈출해야 해요.
    각 방에는 재미있는 그림과 함께 풀어야 할 수수께끼나 퍼즐이 숨어있답니다. 숨겨진 단서를 찾아내고 정답을 맞히면 다음 이야기로 넘어갈 수 있어요.
    과연 흔한남매는 모든 미션을 해결하고 무사히 탈출할 수 있을까요? 이 책은 친구들이 직접 참여하며 이야기를 만들어가는 신나는 모험이 될 거예요.
'9791168411715':
  title: 내일은 발명왕 :본격 대결 과학발명 만화
  summary: "「내일은 발명왕」은 여러 친구들이 팀을 이루어 발명 대결을 펼치는 신나는 과학 만화예요. 주인공들은 기발한 아이디어와 과학 지식을
    활용해서 멋진 발명품을 만들어 내죠. 때로는 어려움을 겪기도 하지만, 서로 협력하고 노력해서 문제를 해결해 나간답니다. 이 책을 읽으면 다양한
    과학 원리를 쉽고 재미있게 배우고, 창의적인 발명 아이디어도 얻을 수 있을 거예요. 과연 친구들은 발명왕이 될 수 있을까요? 이 책은 과학을
    즐겁게 만들어주는 매력이 있어요."
'9791168411852':
  title: 흔한남매의 흔한 호기심 :일상에서 만나는 과학 상식
  summary: 이 책은 인기 유튜브 크리에이터 흔한남매 으뜸이와 에이미가 주인공으로 나와요. 우리 주변에서 흔히 궁금해할 만한 과학 현상들을
    흔한남매 특유의 유머와 함께 쉽고 재미있게 알려주는 책이랍니다. 왜 땀이 나는지, 번개는 왜 치는지 등 일상생활 속에서 만날 수 있는 다양한
    과학 상식들을 만화와 그림으로 풀어 설명해 줘요. 과학이 어렵다고 느끼는 친구들도 흔한남매와 함께라면 즐겁게 과학 지식을 배울 수 있을 거예요.
    이 책을 읽으면 세상을 보는 눈이 더욱 넓어지고, 호기심이 가득한 과학 탐험가가 될 수 있을 거예요.
'9791168411937':
  title: "(처음 읽는) 그리스 로마 신화 =First Greek mythology"
  summary: 이 책은 아주 옛날, 지중해 근처 그리스와 로마 사람들이 믿었던 신들의 이야기를 들려줘요. 하늘의 왕 제우스, 바다의 신 포세이돈,
    지혜의 여신 아테나 등 재미있고 멋진 신들이 많이 나와요. 신들뿐만 아니라 헤라클레스처럼 힘센 영웅들의 놀라운 모험 이야기도 가득하답니다.
    이 신화들은 때로는 웃음을 주고, 때로는 생각할 거리를 던져주면서 우리에게 사랑, 용기, 지혜 같은 소중한 가르침을 주기도 해요. 이 책을
    읽으면 상상의 날개를 활짝 펼치고 신비로운 신화 세계를 여행하는 기분을 느낄 수 있을 거예요.
'9791168412132':
  title: 웃소
  summary: 이 책은 인기 유튜브 채널 '웃소' 멤버들이 직접 등장하는 흥미진진한 모험 이야기예요. 웃소 멤버들은 특별한 사건이나 어려운 문제에
