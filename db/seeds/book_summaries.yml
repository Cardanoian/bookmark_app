    지혜가 가득한 이야기들을 통해 상상력을 키울 수 있을 거예요. 우리가 알고 있는 별자리나 재미있는 표현들도 이 신화에서 시작되었다는 것을 알게
    될 거예요.
'9791168417984':
  title: 에그박사 :Egg&bugs
  summary: 이 책은 유튜브 에그박사 형들과 귀여운 냐하, 으뜸이가 함께 곤충을 탐험하는 이야기예요. 흥미진진한 만화를 통해 우리 주변의 다양한
    곤충들을 만나고 신기한 비밀을 알아볼 수 있어요. 곤충들의 생김새나 특징, 그리고 곤충들이 사는 곳 같은 재미있는 정보들이 가득하답니다. 이
