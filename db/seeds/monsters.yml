# 반려 몬스터 도감 시드 (docs/monsters.md §7 기계 판독용 YAML — verbatim).
# 규칙:
# - 라인당 forms 3개(stage 1·2·3). evolves_from_id 는 stage 순서로 자동 연결(시더가 이전 stage 를 부모로 설정).
# - evolve_condition 은 해당 폼에서 다음 단계로 가는 조건. stage 3 은 조건 없음.
# - starter: true 인 라인의 stage 1 이 스타터 선택지. phase: 1 은 Phase 1 시드 대상.
# - unlock_condition 은 라인 단위 자동 해금 규칙(docs/monster_unlocks.md §3). 시더가 stage 1 폼에만 대입한다.
#   스타터 라인(01/05/17)은 활동절만 저장한다("스타터 선택 OR"는 보유 시 skip 으로 자연 충족되므로 미저장).
monster_lines:
  # === STORY (보라) ===
  - dex_no: 1
    element: story
    rarity: common
    starter: true
    phase: 1
    unlock_condition: { reports: 3 }
    forms:
      - { stage: 1, key: pup_1, name: "갈피멍", evolve_condition: { points: 100, reports: 3 } }
      - { stage: 2, key: pup_2, name: "이야기멍", evolve_condition: { points: 450, a_grades: 1, b_or_better: 5 } }
      - { stage: 3, key: pup_3, name: "전설멍" }
