# 운영 환경의 총괄관리자 값은 Rails credentials의 superadmin.name/email/password가 우선합니다.
# 아래 값은 credentials가 없는 로컬 개발·테스트 환경의 기본값입니다.
superadmin:
  name: 총괄관리자
  role: superadmin
  email: admin@example.com
  password: changeme1234

# 로그인에 사용하지 않는 온디맨드 콘텐츠 소유자입니다. 비밀번호는 생성 시 무작위로 정합니다.
system_user:
  name: 시스템
  role: superadmin

sample_accounts:
  excluded_environments:
    - production
  # 체험·데모 자료가 사는 **가상 학교**. 실학교(NEIS 스냅샷)에 데모 계정을 얹으면 그 학교의
  # 실제 구성원과 섞이고, 화면·제출물에 실학교명이 새어 나온다. 그래서 전국 CSV 에 없는
  # 자체 코드의 학교를 따로 두고 모든 데모 자료를 여기에 모은다.
  #
  # · neis_code 는 NEIS 표준학교코드 체계와 겹치지 않는 자리표(전국 CSV 6,333교에 없는 값).
  # · data_source 는 반드시 **manual** — `schools:seed_full` 은 `data_source: "neis"` 행만
  #   비활성화하고 manual 행은 보존하므로, 전국 스냅샷을 다시 적재해도 이 학교가 살아남는다.
  # · 세종특별자치시는 단층제라 전국 CSV 의 세종 행들도 gu 가 비어 있다(같은 규약을 따른다).
  school:
    neis_code: "9999999"
    name: 테스트초등학교
    region: 세종특별자치시교육청
    gu:
    office_code: I10
    address: 세종특별자치시 테스트로 1

  classrooms:
    - id: grade_3_class_1
      grade: 3
      class_no: 1
      teacher: homeroom_teacher

  users:
    # 3-1 샘플 담임. 이미 존재하는 계정의 개명·비밀번호 갱신은 시드가 하지 않으므로
    # 마이그레이션 20260727000001(RenameSampleAccounts)이 담당한다.
    - id: homeroom_teacher
      name: 김지은
      role: teacher
      email: jieun@gbeai.net
      password: jieun11!

    - id: school_admin
      name: 박은수
      role: school_admin
      email: eunsu@gbeai.net
      password: eunsu11!

    - id: librarian
      name: 최지혜
      role: librarian
      email: jihye@gbeai.net
      password: jihye11!

    # 3-1 대표 학생. 나머지 학급 구성원(총 21명)과 활동 내역은 db/seeds/demo/sample_3_1.yml 이
    # 단일 진실이며 DemoSeeder 의 top-up 경로가 명단에 없는 학생만 추가한다.
    - id: student
      name: 이도현
      role: student
      classroom: grade_3_class_1
      password: student1234
