  - 인상 깊었던 장면 이야기하기
students:
  - name: 최지우
    reports:
      - book_title: 마틸다
        quality: b
        reviewed: true
        days_ago: 20
        teacher_comment: 느낀 점을 잘 썼어요.
        body: |
          마틸다는 어려운 상황 속에서도 책을 사랑하고 지혜롭게 문제를 해결하는 주인공이다. 나는 마틸다가 나쁜 어른들에게 당당하게 맞서는 모습이 정말 멋있었다. 트런치불 교장 선생님이 벌을 받는 장면에서 통쾌한 기분이 들었다. 허니 선생님과 마틸다가 서로 도와주는 모습을 보고 따뜻한 마음을 느꼈다. 나도 마틸다처럼 책을 많이 읽어서 지혜로운 사람이 되고 싶다.
      - book_title: 푸른 사자 와니니
        quality: a
        reviewed: true
        days_ago: 45
        body: |
          이 책의 주인공 와니니는 무리에서 쫓겨나 홀로 초원을 떠돌게 된다. 나는 와니니가 절망적인 상황에서도 포기하지 않고 스스로 살아갈 방법을 찾아가는 모습에 큰 감동을 받았다. 특히 다른 동물들과 부딪히면서도 지혜롭게 위기를 헤쳐나가는 장면에서 와니니의 성장이 느껴졌다. 무리를 다시 만나 진정한 우두머리로 인정받는 결말이 뭉클했다. 나도 힘든 순간에 와니니처럼 용기와 지혜를 가지고 이겨내는 사람이 되고 싶다.
      - book_title: 롤러 걸
        quality: b
        reviewed: true
        days_ago: 33
        body: |
          롤러 스케이트를 타는 주인공의 도전 이야기가 정말 신났다. 처음에는 잘 못 타서 힘들어했지만 점점 실력이 느는 모습이 멋있었다. 친구와의 우정이 변화하는 과정도 마음에 와닿았다. 나도 새로운 것에 도전하는 것을 두려워하지 않아야겠다.
      - book_title: 찰리와 초콜릿 공장
        quality: b
        reviewed: false
        days_ago: 7
        body: |
          찰리와 초콜릿 공장을 읽고 웡카 아저씨의 신비한 공장이 정말 궁금해졌다. 욕심을 부리던 친구들이 차례로 곤란을 겪는 장면이 재미있었다. 찰리가 착하고 정직해서 결국 좋은 기회를 얻는 결말이 뿌듯했다. 나도 찰리처럼 욕심부리지 않고 정직하게 살아야겠다.
      - book_title: 빨강 연필
        quality: b
        reviewed: true
        days_ago: 58
        teacher_comment: 다음에는 더 자세히 써볼까요?
        body: |
          빨간 연필로 글을 쓰면 자꾸 거짓말이 써지는 이야기가 신기했다. 나는 주인공이 점점 거짓말에 익숙해지는 모습을 보며 걱정이 되었다. 결국 솔직함이 가장 중요하다는 것을 깨닫는 결말이 좋았다. 나도 정직하게 글을 쓰는 사람이 되어야겠다.
    game_plays: 8
    quiz_attempts: 5
    monster_lines: 7
    evolved: 3
    forum_posts:
      - 저는 마틸다가 책을 좋아하는 점이 저랑 닮은 것 같아요.
      - 와니니처럼 저도 힘든 일이 있어도 포기하지 않을래요.
      - 친구들이 추천한 책도 읽어보고 싶어요.
    book_intro: 이 책은 어려운 상황에서도 용기를 잃지 않는 주인공의 이야기예요. 함께 읽으며 응원해주세요.
    book_sequel: 주인공이 위기를 이겨낸 뒤에는 더 큰 모험이 기다리고 있을 것 같아요. 다음 이야기도 궁금해요.
  - name: 김서준
    reports:
      - book_title: 도그맨
        quality: b
        reviewed: true
        days_ago: 62
        body: |
          도그맨이 나쁜 사람들과 맞서 싸우는 이야기가 정말 통쾌했다. 나는 도그맨이 실수를 해도 끝까지 정의를 지키려는 모습이 멋있었다. 그림과 글이 함께 있어서 더 재미있게 읽을 수 있었다. 나도 도그맨처럼 포기하지 않는 사람이 되고 싶다.
      - book_title: 윔피 키드
        quality: a
        reviewed: true
        days_ago: 50
        body: |
          그레그의 학교생활 이야기가 웃기고 공감이 많이 되었다. 나는 그레그가 실수를 해도 유머러스하게 넘기는 모습이 재미있었다. 친구들과의 에피소드가 나의 학교생활과 비슷해서 웃음이 났다. 나도 그레그처럼 긍정적으로 생각해야겠다.
      - book_title: 마법천자문
        quality: b
        reviewed: true
        days_ago: 41
        body: |
          한자를 배우며 모험을 떠나는 이야기라서 공부와 재미를 동시에 느꼈다. 나는 손오공과 친구들이 한자의 힘으로 위기를 이겨내는 장면이 멋있었다. 한자 하나하나에 담긴 뜻을 알게 되어 신기했다. 나도 한자를 더 열심히 공부해야겠다고 생각했다.
      - book_title: 구스범스
        quality: b
        reviewed: true
        days_ago: 29
        body: |
          무서운 이야기들이 가득해서 손에 땀을 쥐며 읽었다. 나는 주인공들이 무서운 상황 속에서도 침착하게 대처하는 모습이 멋있었다. 상상력이 넘치는 괴물들의 이야기가 정말 흥미로웠다. 나도 무서운 일이 생겨도 침착하게 행동해야겠다.
      - book_title: 잘못 뽑은 전교 회장
        quality: b
        reviewed: false
        days_ago: 12
        body: |
          전교 회장이 된 일찬이의 이야기를 재미있게 읽었다. 처음에는 장난처럼 시작했지만 점점 진지해지는 모습이 인상 깊었다. 친구들과의 갈등을 해결해 나가는 과정이 흥미로웠다. 나도 책임감을 가지고 행동해야겠다고 다짐했다.
      - book_title: 15소년 표류기
        quality: b
        reviewed: true
        days_ago: 5
        teacher_comment: 모험 이야기를 실감나게 표현했어요.
        body: |
          무인도에 표류한 소년들이 힘을 합쳐 살아가는 이야기가 정말 흥미진진했다. 나는 소년들이 서로 협력하며 어려움을 이겨내는 모습이 멋있었다. 각자의 역할을 찾아가는 과정이 인상 깊었다. 나도 친구들과 힘을 합치는 것이 중요하다는 것을 배웠다.
    game_plays: 11
    quiz_attempts: 7
    monster_lines: 12
    evolved: 4
    forum_posts:
      - 저는 도그맨이 실수해도 끝까지 노력하는 게 멋있었어요.
      - 마법천자문 읽고 한자에 관심이 더 생겼어요.
      - 다음에는 더 두꺼운 책에도 도전해보고 싶어요.
    book_intro: 친구들과 함께 웃으며 읽을 수 있는 재미있는 이야기예요. 그림도 많아서 쉽게 읽을 수 있어요.
    book_sequel: 주인공의 다음 모험에서는 새로운 친구들도 만나면 좋겠어요. 더 큰 사건이 벌어질 것 같아요.
  - name: 이하은
    reports:
      - book_title: 소공녀
        quality: a
        reviewed: true
        days_ago: 55
        body: |
          세라가 힘든 상황에서도 품위를 잃지 않는 모습이 정말 대단했다. 나는 세라가 하녀가 되어서도 다른 사람을 배려하는 마음을 잃지 않는 것이 감동적이었다. 결국 행복을 되찾는 결말을 보고 마음이 따뜻해졌다. 나도 어려운 상황에서도 착한 마음을 잃지 않아야겠다.
      - book_title: 하이디
        quality: b
        reviewed: true
        days_ago: 40
        body: |
          알프스의 자연 속에서 자라는 하이디의 이야기가 정말 평화롭게 느껴졌다. 나는 하이디가 할아버지와 클라라에게 따뜻한 마음을 전하는 모습이 좋았다. 자연을 사랑하는 하이디의 순수한 마음이 인상 깊었다. 나도 하이디처럼 밝고 순수한 마음을 가지고 싶다.
      - book_title: 키다리 아저씨
        quality: b
        reviewed: true
        days_ago: 24
        body: |
          주디가 얼굴도 모르는 후원자에게 편지를 쓰는 설정이 신기했다. 나는 주디가 밝고 긍정적인 성격으로 어려움을 이겨내는 모습이 좋았다. 편지 형식으로 쓰여 있어서 마치 친구의 일기를 보는 것 같았다. 나도 주디처럼 긍정적으로 생각하는 사람이 되고 싶다.
      - book_title: 일기 감추는 날
        quality: b
        reviewed: true
        days_ago: 9
        teacher_comment: 일기 쓰기의 마음을 잘 이해했네요.
        body: |
          이 책의 주인공은 일기를 숨기고 싶어 하는 마음을 잘 표현하고 있다. 나도 가끔 일기를 다른 사람에게 보여주기 싫을 때가 있어서 공감이 되었다. 선생님이 일기를 검사하는 것에 대한 고민이 현실적으로 느껴졌다. 나도 내 마음을 솔직하게 쓰는 일기를 써야겠다고 생각했다.
    game_plays: 6
    quiz_attempts: 4
    monster_lines: 6
    evolved: 2
    forum_posts:
      - 저는 하이디처럼 밝고 씩씩한 사람이 되고 싶어요.
      - 소공녀 세라의 마음이 참 따뜻했어요.
    book_intro: 따뜻한 마음을 가진 주인공이 어려움을 이겨내는 이야기예요. 읽고 나면 마음이 훈훈해져요.
    book_sequel: 주인공이 앞으로도 계속 밝고 씩씩하게 살아갔으면 좋겠어요. 새로운 친구도 사귀면 좋겠어요.
  - name: 박도윤
    reports:
      - book_title: 불량한 자전거 여행
        quality: b
        reviewed: true
        days_ago: 65
        body: |
          형제가 자전거를 타고 떠나는 여행 이야기가 정말 흥미진진했다. 나는 두 형제가 서로 다투면서도 점점 가까워지는 모습이 좋았다. 여행 중에 만나는 다양한 사람들 이야기도 재미있었다. 나도 언젠가 이런 멋진 여행을 떠나보고 싶다.
      - book_title: 나쁜 어린이 표
        quality: c
        reviewed: true
        days_ago: 48
        body: |
          선생님이 나눠주는 나쁜 어린이 표 때문에 주인공이 속상해하는 이야기다. 나는 주인공의 마음이 이해가 되어서 짠했다. 어른들도 실수를 할 수 있다는 것을 이 책을 통해 알게 되었다. 나도 친구를 함부로 판단하지 않아야겠다고 생각했다.
      - book_title: 5월 35일
        quality: b
        reviewed: true
        days_ago: 36
        body: |
          어린이날이 없어진 나라의 이야기라는 설정이 신기하고 재미있었다. 나는 주인공들이 어린이날을 되찾기 위해 노력하는 모습이 멋있었다. 어른들도 어린이의 마음을 이해해야 한다는 것을 느꼈다. 나도 내 생각을 용기 있게 말할 수 있는 사람이 되고 싶다.
      - book_title: 오즈의 마법사
        quality: b
        reviewed: false
        days_ago: 15
        body: |
          도로시가 친구들과 함께 오즈의 나라를 여행하는 이야기가 신비로웠다. 나는 허수아비, 양철 나무꾼, 사자가 각자 원하는 것을 찾아가는 모습이 감동적이었다. 결국 자기 안에 이미 답이 있었다는 것을 깨닫는 결말이 인상 깊었다. 나도 내 안의 용기와 지혜를 믿어야겠다고 생각했다.
      - book_title: 플랜더스의 개
        quality: b
        reviewed: true
        days_ago: 4
        body: |
          네로와 파트라슈의 우정이 정말 감동적이었다. 나는 가난하지만 그림을 사랑하는 네로의 마음이 안타까웠다. 파트라슈가 끝까지 네로 곁을 지키는 모습에서 눈물이 났다. 나도 진정한 우정이 무엇인지 다시 생각해보게 되었다.
    game_plays: 9
    quiz_attempts: 6
    monster_lines: 9
    evolved: 3
    forum_posts:
      - 저는 오즈의 마법사에서 사자가 용기를 찾는 장면이 좋았어요.
      - 네로와 파트라슈 이야기 읽고 눈물이 났어요.
    book_intro: 모험을 좋아하는 친구들에게 추천하고 싶은 이야기예요. 읽는 내내 두근두근했어요.
    book_sequel: 다음에는 주인공이 더 멀리 여행을 떠나는 이야기가 있으면 좋겠어요. 새로운 도전이 기대돼요.
  - name: 정하윤
    reports:
      - book_title: 푸른 사자 와니니
        quality: b
        reviewed: true
        days_ago: 60
        body: |
          와니니가 무리에서 쫓겨나 혼자가 되는 장면에서 마음이 아팠다. 힘든 순간에도 포기하지 않고 살아가려는 모습이 대단했다. 초원의 다른 동물들과의 만남도 흥미로웠다. 나도 힘든 일이 생겨도 포기하지 않아야겠다고 생각했다.
      - book_title: 마틸다
        quality: b
        reviewed: true
        days_ago: 47
        body: |
          마틸다는 어린 나이에도 똑똑하고 용감한 아이여서 존경스러웠다. 부모님의 관심을 받지 못했지만 스스로 책을 읽으며 지식을 쌓는 모습이 인상 깊었다. 트런치불 교장 선생님의 못된 행동을 보면서 화가 났지만 마틸다가 지혜롭게 해결해서 다행이었다. 나도 마틸다처럼 힘든 상황에서도 포기하지 않고 노력해야겠다.
      - book_title: 롤러 걸
        quality: c
        reviewed: true
        days_ago: 22
        body: |
          이 책을 읽고 롤러 더비라는 운동을 처음 알게 되었다. 주인공이 넘어져도 다시 일어나 연습하는 모습이 인상 깊었다. 친구 관계에서 생기는 고민도 공감이 되었다. 나도 포기하지 않고 끝까지 노력하는 사람이 되고 싶다.
      - book_title: 윔피 키드
        quality: b
        reviewed: false
        days_ago: 8
        teacher_comment: 친구 이야기를 재미있게 담았어요.
        body: |
