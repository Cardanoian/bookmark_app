# 데모 학급이 사는 **가상 학교** 정의(`DemoSeeder` 가 없으면 만든다).
#
# 왜 가상 학교인가: 데모 자료를 전국 NEIS 스냅샷의 실학교에 얹으면 그 학교의 실제 구성원과
# 섞이고, 대회 요강이 금지하는 실학교명이 화면(학교 랭킹·학교 선택)·제출물 경로로 새어 나간다.
#
# 규약(체험 계정 학교 `accounts.yml` 의 sample_accounts.school 과 동일):
#   · neis_code : 전국 CSV 6,333교에 없는 자리표 코드
#   · data_source: **manual** — `schools:seed_full` 은 `data_source: "neis"` 행만 비활성화하므로
#                  전국 스냅샷을 다시 적재해도 이 학교들이 살아남는다
#   · region    : 세종특별자치시교육청 하나로 모은다. 세종은 단층제라 전국 CSV 의 세종 행들도
#                  gu 가 비어 있어(같은 규약) 학교 선택 피커의 시군구 단계와 어긋나지 않는다
#   · name      : 전국 CSV 의 실학교명과 **겹치지 않는** 이름만 쓴다(랭킹 화면에 그대로 노출된다)
#
# 체험 계정이 사는 테스트초등학교(9999999)는 여기가 아니라 `db/seeds/accounts.yml` 이 소유한다
# (시드 순서상 역할 샘플 계정이 DemoSeeder 보다 먼저 필요하기 때문).
# 기존 DB 의 이전은 마이그레이션 20260730000002 가 담당한다.
