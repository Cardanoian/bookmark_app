# 테스트초 3-1 — accounts.yml 의 역할 샘플 학급을 21명 규모의 정상 학급으로 채운다.
# 평소 전체 시드는 기존 활동을 보존하는 top-up 계약을 유지한다. 공개 체험 배포에서는
# DemoData::PublicClassroomRefresh가 이 파일을 정본으로 삼아 학급 활동을 백업 후 다시 만든다.
#
# teacher 는 accounts.yml 의 homeroom_teacher 와 **같은 이메일**이어야 한다. seed_teacher 가
# 이메일로 기존 행을 찾으므로, 다르면 담임이 둘이 된다.
#
# 활동량은 template(noeul_3_1.yml)의 학생별 편차를 그대로 쓴다(activity_level: high = 스케일 1.0).
# 신규 19명을 명단 앞에 두어 활발한 프로필(#1~#19)을 받게 하고, 기존 2명은 맨 뒤에 둔다
# (기존 학생은 활동을 만들지 않으므로 그 자리의 프로필은 쓰이지 않는다).
# nickname 을 명시하면 전역 닉네임 카운터를 소비하지 않아 기존 학급 745명의 별칭이 밀리지 않는다.
classroom:
  school_neis_code: "9999999"
  school_label: 테스트초등학교
  grade: 3
  class_no: 1
  academic_year: 2026
teacher:
  name: 김지은
  email: jieun@gbeai.net
template: noeul_3_1.yml
activity_level: high
story:
  student_name: 이도현
  featured_report_keys:
    - dohyun_rewrite
missions:
  - title: 책과 친해지기
    description: 독후감 세 편을 쓰고 독서 게임도 해 봐요.
    reward_points: 40
    start_days_ago: 18
    end_days_ahead: 9
    completion_rate: 0.5
    goals:
      - { type: approved_reports, target: 3 }
      - { type: game_plays, target: 4 }
  - title: 꾸준히 읽는 습관
    description: 다음 목표까지 독후감과 게임을 꾸준히 이어 가요.
    reward_points: 60
    start_days_ago: 25
    end_days_ahead: 5
    completion_rate: 0.35
    goals:
      - { type: approved_reports, target: 4 }
      - { type: game_plays, target: 8 }
  - title: 독서 골든벨 도전
    description: 최근에 읽은 책을 떠올리며 게임 실력을 키워요.
    reward_points: 50
    start_days_ago: 10
    end_days_ahead: 14
    completion_rate: 0.6
    goals:
      - { type: approved_reports, target: 2 }
      - { type: game_plays, target: 7 }
# 테스트학급의 뒷이야기는 실제 독후감 작성 빈도가 높은 책을 중심으로 둔다. 학생별 template의
# 짧은 book_sequel 문구 대신 이 목록을 사용하며, book_title로 카탈로그 도서에 정확히 연결한다.
# ai_comment 는 책갈피 도우미 코멘트(SequelFeedbackService 규칙 — 2~4문장, 글에서 보이는 좋은 점을
# 원문 그대로 작은따옴표로 인용, 제안 1가지)이고, 담임 승인 여부는 reviewed(기본 true)로 적는다.
# reviewed: false 인 글은 체험 담임의 '뒷이야기 검토' 미검토 탭에 남는다.
book_sequels:
  - student_name: 강태오
    book_title: 푸른 사자 와니니
    ai_comment: "혼자 떠돌 때 본 새들을 떠올려 물을 찾아내는 장면이 정말 똑똑해요. '혼자 차지하지 않고 무리를 불러 함께 돌을 치웠다'는 부분에서 와니니가 얼마나 자랐는지 느껴져요. 샘을 찾은 뒤 무리 친구들이 와니니에게 뭐라고 말했을지도 이어서 상상해 볼래요?"
    body: |
      와니니가 무리로 돌아온 지 며칠 뒤, 비가 오지 않아 물웅덩이가 거의 말라 버렸다. 아기 사자들은 목이 마르다고 자꾸 보챘다.

      와니니는 혼자 떠돌 때 새들이 한쪽으로 날아가던 모습이 생각났다. 새들을 따라가 보니 바위 밑에 작은 샘이 있었다. 와니니는 혼자 차지하지 않고 무리를 불러 함께 돌을 치웠다. 그러자 맑은 물이 졸졸 흘러나왔다. 아기 사자들이 물을 마시는 걸 보니 와니니는 자기가 진짜 무리의 도움이 된 것 같아서 뿌듯했다.
  - student_name: 곽서연
    book_title: 도그맨
    ai_comment: "치즈 도둑을 냄새로 쫓아가는 장면이 탐정 이야기처럼 흥미진진해요. '도그맨은 생쥐들을 잡는 대신 자기 간식을 나눠 주고' 부분에서 도그맨의 따뜻한 마음이 잘 보여요. 억울했던 도그맨이 머리를 쓰다듬어 받을 때 어떤 기분이었을지 한 문장 더 써 보면 어때요?"
    body: |
      다음 날 경찰서 간식 창고에서 치즈가 몽땅 사라졌다. 경찰서장은 또 도그맨이 먹은 줄 알고 화를 냈다. 도그맨은 억울했지만 바닥 냄새를 맡으며 범인을 찾아갔다.

      냄새는 하수구에 사는 작은 생쥐 가족한테 이어졌다. 생쥐들은 배가 너무 고파서 치즈를 가져갔다고 말했다. 도그맨은 생쥐들을 잡는 대신 자기 간식을 나눠 주고 다시는 훔치지 말라고 했다. 경찰서장은 처음에는 잔소리를 했지만, 생쥐들이 치즈를 돌려주자 도그맨 머리를 쓰다듬어 주었다.
  - student_name: 권민재
    book_title: 마틸다
    ai_comment: "'책장 사이에 떨어진 색종이 조각'을 단서로 범인을 찾는 장면이 탐정처럼 재미있어요. 화내지 않고 선생님께 함께 말씀드린 덕분에 동생들을 위한 낮은 책장까지 생겨서 마음이 따뜻해져요. 마틸다가 금요일마다 동생들에게 어떤 책을 읽어 주었을지도 상상해 볼래요?"
    body: |
      허니 선생님과 살게 된 마틸다는 새 학교 도서관을 제일 좋아했다. 그런데 어느 날부터 책이 한 권씩 사라졌다. 마틸다는 책장 사이에 떨어진 색종이 조각을 보고 범인을 찾아 나섰다.

      체육관 뒤 창고에는 일 학년 아이들이 몰래 만든 작은 도서관이 있었다. 아이들은 어려운 책만 빌려주는 게 부끄러워서 책을 몰래 가져왔다고 했다. 마틸다는 화내지 않고 선생님께 같이 말씀드렸다. 그 뒤 학교에는 어린 동생들을 위한 낮은 책장이 생겼고, 마틸다는 매주 금요일마다 책을 읽어 주었다.
  - student_name: 김나윤
    book_title: 나쁜 어린이 표
    ai_comment: "나쁜 어린이 표 대신 '마음 설명 카드'를 떠올린 생각이 정말 멋져요. 건우가 실수를 숨기지 않고 까닭을 적는 장면에서 용기가 느껴져요. 다른 친구들은 마음 설명 카드에 어떤 이야기를 썼을지 한 장면 더 이어 써 보면 어때요?"
    body: |
      다음 월요일, 선생님은 나쁜 어린이 표가 든 상자를 교탁에서 치웠다. 대신 왜 그런 행동을 했는지 쓰는 마음 설명 카드를 나누어 주었다.

      건우는 미술 물통을 엎질렀을 때 또 혼날까 봐 가슴이 철렁했다. 그래도 숨기지 않고 급하게 붓을 옮기다가 그랬다고 카드에 썼다. 친구들은 건우를 놀리지 않고 같이 바닥을 닦았다. 선생님도 먼저 까닭을 물어보겠다고 약속했다. 건우는 서랍 속 나쁜 선생님 표를 꺼냈다가 다시 접어 넣었다. 이제는 그 표를 쓸 일이 없을 것 같았다.
  - student_name: 노아린
    book_title: 잘못 뽑은 반장
    ai_comment: "처음에는 엉터리 반장이었던 이로운이 이번에는 소민이를 도와주는 쪽이 되어서 이야기가 자연스럽게 이어져요. '반장 이름표가 없어도 반을 도울 수 있다'는 마지막 생각이 참 멋진 마무리예요. 소민이가 용기를 내어 반 친구들에게 처음 한 말은 무엇이었을지 상상해 볼래요?"
    body: |
      새 학기가 되자 이로운은 절대로 반장을 하지 않겠다고 했다. 이번에는 말이 작은 소민이가 반장이 되었는데, 친구들이 떠들 때마다 얼굴만 빨개지고 아무 말도 못 했다.

      이로운은 자기도 처음에는 엉터리 반장이었다고 말해 주었다. 그리고 우유 당번을 빠뜨린 친구를 대신 돕고, 운동장을 쓰지 못하게 하는 형들에게 가서 차례를 지켜 달라고 말했다. 학급 회의 날 소민이는 이로운 덕분에 용기를 냈다고 고마워했다. 이로운은 반장 이름표가 없어도 반을 도울 수 있다는 걸 알게 되었다.
  - student_name: 민서율
    book_title: 롤러 걸
    ai_comment: "엉덩방아를 찧고 포기하고 싶어진 마음까지 솔직하게 써 줘서 애스트리드가 더 가깝게 느껴져요. '넘어지는 것도 기술'이라는 팀 친구의 말이 이야기 전체를 따뜻하게 만들어요. 공연이 끝난 뒤 애스트리드가 니콜에게 무슨 말을 했을지 이어 써 보면 어때요?"
    body: |
      첫 경기가 끝난 뒤에도 애스트리드는 매일 롤러 연습을 했다. 학교 장기 자랑 날에는 친구들 앞에서 멋진 회전을 보여 주기로 했다. 그런데 연습하다가 또 엉덩방아를 찧어서 그냥 포기하고 싶어졌다.

      팀 친구가 넘어지는 것도 기술이라고 말하며 손을 잡아 주었다. 애스트리드는 어려운 회전 대신 자기가 제일 자신 있는 빠른 달리기를 넣었다. 공연 날 한 번 비틀거렸지만 끝까지 달렸고, 관중석의 니콜도 크게 박수를 쳤다. 애스트리드는 완벽하지 않아도 끝까지 하면 멋질 수 있다고 생각했다.
  - student_name: 배지안
    book_title: 플랜더스의 개
    ai_comment: "'네로가 마지막에 그린 파트라슈의 얼굴'을 찾아내는 첫 장면부터 마음이 뭉클해요. 마을 사람들이 미안한 마음을 전시실과 도움으로 바꾸어 가는 과정이 차근차근 잘 이어졌어요. 전시실 앞에 매일 앉아 있던 갈색 강아지가 어디에서 왔는지도 상상해 볼래요?"
    body: |
      눈이 녹은 봄날, 성당을 청소하던 사람이 의자 밑에서 낡은 그림 한 장을 발견했다. 네로가 마지막에 그린 파트라슈의 얼굴이었다. 마을 사람들은 그림을 보고 네로를 도와주지 못한 일을 미안해했다.

      사람들은 성당 옆에 작은 전시실을 만들고 네로의 그림을 걸었다. 그림을 보러 온 아이들은 돈을 조금씩 모아 배고픈 아이와 떠돌이 개를 돕기로 했다. 전시실 문 앞에는 어느새 갈색 강아지 한 마리가 매일 앉아 있었다. 아이들은 그 강아지에게 따뜻한 우유를 주며 네로와 파트라슈를 오래 기억했다.
  - student_name: 서다인
    book_title: 윔피 키드
    ai_comment: "게임기만 챙겼다가 깜깜한 텐트에 남게 된 장면이 웃기면서도 실감 나요. 핑계를 대지 않고 맞다고 말하는 그레그가 한 뼘 자란 것 같고, '이번 야영은 최악이 아니었다'는 일기 한 줄도 재미있어요. 롤리가 그 작은 고맙다는 말을 알아챘을지 다음 장면으로 이어 써 보면 어때요?"
    body: |
      새 학기 첫 체험 학습은 야영이었다. 그레그는 무거운 손전등 대신 게임기를 몰래 가방에 넣었다. 밤이 되자 게임기 배터리는 꺼지고 텐트 안은 깜깜해졌다.

      롤리는 손전등을 빌려주면서 또 준비물을 대충 챙겼냐고 물었다. 그레그는 창피했지만 이번에는 핑계를 대지 않고 맞다고 했다. 둘은 같이 텐트 끈을 다시 묶고 길을 잃은 친구의 운동화도 찾아 주었다. 집에 돌아온 그레그는 일기에 이번 야영은 최악이 아니었다고 썼다. 롤리한테 고맙다는 말도 아주 작게 덧붙였다.
  - student_name: 송채아
    book_title: 찰리와 초콜릿 공장
    reviewed: false
    ai_comment: "혼자 먹으면 양파 맛, 나누어 먹으면 딸기 맛이 나는 사탕이라니 정말 기발한 상상이에요. '반으로 나누어 친구와 먹으면 딸기 맛이 나는 사탕' 덕분에 나누는 기쁨이 이야기 끝까지 잘 전해져요. 찰리가 다음에 만들 사탕에는 어떤 비밀이 숨어 있을지 상상해 볼래요?"
    body: |
      초콜릿 공장을 맡게 된 찰리는 처음으로 자기 사탕을 만들었다. 동그란 사탕을 혼자 먹으면 양파 맛이 나지만, 반으로 나누어 친구와 먹으면 딸기 맛이 나는 사탕이었다.

      웡카 아저씨는 혼자 먹는 손님은 화를 낼 거라고 걱정했다. 하지만 찰리는 나누어 먹는 기쁨을 알려 주고 싶다고 했다. 공장 문을 연 날, 욕심 많은 아이가 사탕을 통째로 먹고 얼굴을 찡그렸다. 옆 친구에게 반을 나누어 주자 정말 딸기 맛이 났다. 그날부터 공장 앞에서는 모르는 아이들도 사탕을 나누며 금방 친구가 되었다.
  - student_name: 홍수아
    book_title: 강아지똥
    reviewed: false
    ai_comment: "민들레 씨앗이 멀리 날아가 새 이야기를 시작하는 장면이 정말 아름다워요. 아이가 '매일 우유갑에 물을 담아 주었다'는 부분에서 작은 싹을 아끼는 마음이 느껴져요. 담장 밑 민들레를 본 다른 친구들은 어떤 말을 했을지 한 장면 더 이어 써 보면 어때요?"
    body: |
      민들레꽃이 진 뒤 하얀 씨앗들이 바람을 타고 멀리 날아갔다. 그중 한 씨앗은 어느 학교 담장 밑 작은 틈에 내려앉았다. 흙도 별로 없고 사람들이 자꾸 밟고 지나가는 곳이었다.

      한 아이가 작은 싹을 발견하고 매일 우유갑에 물을 담아 주었다. 친구들은 그냥 잡초라고 했지만 아이는 어떤 꽃이 될지 기다려 보자고 했다. 며칠 뒤 노란 민들레가 활짝 피었다. 바람이 불자 꽃은 골목에 있던 강아지똥의 이야기를 들려주는 것처럼 살랑살랑 흔들렸다.
student_names:
  # ── 신규 19명 (남 10 / 여 9) — 프로필 #1~#19: 독후감 5~1건, 게임 8~0회로 편차가 크다
  - { name: 강태오, nickname: 씩씩한책돛대 }
