        text: 샬롯의 거미줄에서 펀은 아빠가 약하게 태어난 새끼 돼지를 죽이려고 하니까 그건 너무 불공평하다고 막았어요. 펀이 가만히 있었으면 윌버는 없었을 거예요. 그래서 저는 어린이도 맞서도 된다고 생각해요.
      - topic: cooperation
        stance: pro
        text: 저는 같이 하는 게 좋아요. 샬롯의 거미줄에서 샬롯이 윌버를 살리려고 거미줄에 글자를 썼는데 쓸 말은 쥐 템플턴이 쓰레기장에서 찾아다 줬어요. 샬롯 혼자 했으면 그렇게 못 했을 거예요.
      - topic: honest_process
        stance: pro
        text: 금도끼 은도끼 생각이 났어요. 나무꾼은 금도끼를 그냥 가질 수도 있었는데 자기 건 쇠도끼라고 솔직하게 말했어요. 욕심부린 사람은 자기 도끼까지 잃어버렸고요. 그래서 저는 정직한 게 먼저라고 생각해요.
