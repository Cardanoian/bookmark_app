      - 하이디처럼 저도 자연 속에서 뛰어놀고 싶어요.
    book_intro: 여민이라는 아이의 눈으로 바라본 어른들의 복잡한 세상 이야기예요.
    book_sequel: 여민이는 자라서도 어려운 사람들의 마음을 잘 헤아리는 어른이 될 것 같아요.

  - name: 정민준
    reports:
      - book_title: 나무를 심은 사람
        quality: b
        reviewed: true
        days_ago: 9
        body: |
          한 사람이 묵묵히 나무를 심어서 황무지였던 땅을 숲으로 바꾸는 이야기가 놀라웠다. 아무 보상을 바라지 않고 오랜 세월 나무를 심는 모습이 존경스러웠다. 작은 행동이라도 꾸준히 하면 큰 변화를 만들 수 있다는 걸 배웠다. 전쟁 중에도 나무 심기를 멈추지 않는 모습에서 굳은 의지가 느껴졌다. 우리 동네에도 이런 분이 있다면 좋겠다는 생각이 들었다. 나도 작은 것부터 꾸준히 실천해보고 싶어졌다.
      - book_title: 마당을 나온 암탉
        quality: b
        reviewed: true
        days_ago: 20
        body: |
          잎싹이 답답한 양계장을 벗어나 자유를 찾아가는 모습이 인상 깊었다. 초록머리를 자기 자식처럼 키우는 모습에서 진짜 사랑이 느껴졌다. 위험한 마당 밖에서도 씩씩하게 살아가는 잎싹이 대단했다. 가족은 핏줄이 아니라 마음으로 이어진다는 걸 느꼈다. 초록머리가 훨훨 날아가는 마지막 장면이 뭉클했다. 짧은 이야기지만 생각할 거리가 많았다.
      - book_title: 홍길동전
        quality: c
        reviewed: true
        days_ago: 35
        body: |
          길동이 서자라서 차별받는 상황이 안타까웠다. 활빈당을 이끄는 부분은 통쾌했지만 이해하기 어려운 부분도 있었다. 옛날에는 신분 때문에 능력을 인정받지 못하는 사람이 많았다는 걸 알게 되었다. 길동이 새로운 나라를 세우는 결말이 인상적이었다. 지금 세상에는 이런 차별이 없어서 다행이라고 생각했다. 나도 부당한 일을 보면 용기 내어 나서고 싶다는 생각이 들었다.
      - book_title: 기억 전달자
        quality: a
        reviewed: true
        days_ago: 52
        teacher_comment: 사회 구조에 대한 생각까지 확장했네요.
        body: |
          고통이 없는 대신 감정도 없는 마을의 모습이 처음엔 이상적으로 보였지만 사실 무서웠다. 조너스가 진짜 기억을 물려받으며 힘들어하는 장면이 인상 깊었다. 슬픔을 겪어야 진짜 행복도 느낄 수 있다는 생각이 들었다. 완벽해 보이는 사회가 자유를 빼앗긴 곳이라는 게 소름 돋았다. 조너스가 용기 내어 마을을 떠나는 장면에서 응원하는 마음이 들었다. 자유롭게 선택할 수 있다는 것이 얼마나 소중한지 다시 느꼈다.
