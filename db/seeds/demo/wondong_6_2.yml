  - name: 홍지우
    reports:
      - book_title: 빨간 머리 앤
        quality: b
        reviewed: true
        days_ago: 22
        body: |
          앤이 실수하면서도 씩씩하게 지내는 모습이 좋았다. 상상하기를 좋아하는 앤을 보면서 나도 하루를 특별하게 생각해보고 싶어졌다. 초록지붕 집 사람들과 진짜 가족이 되어가는 과정이 따뜻했다. 다이애나와의 우정도 예쁘게 느껴졌다. 나도 상상력을 더 키워보고 싶다는 생각이 들었다. 밝고 씩씩한 앤의 모습을 닮고 싶다는 생각이 들었다.
      - book_title: 소공녀
        quality: b
        reviewed: true
        days_ago: 38
        body: |
          세라가 가난해져도 품위를 잃지 않는 모습이 대단했다. 상상력으로 힘든 현실을 견디는 부분이 인상적이었다. 어려운 친구 베키를 챙기는 장면이 따뜻했다. 사람을 대하는 태도는 재산이 아니라 마음이라는 걸 느꼈다. 마지막에 행운이 찾아와서 다행이었다. 힘든 상황에서도 품위를 지키는 세라를 본받고 싶다.
    game_plays: 2
    quiz_attempts: 2
    monster_lines: 2
    evolved: 1
    forum_posts:
