    book_sequel: 주디는 나중에 자신도 누군가의 키다리 아저씨가 되어줄 것 같아요.

  - name: 조은서
    reports:
      - book_title: 소공녀
        quality: b
        reviewed: true
        days_ago: 7
        body: |
          세라가 부자였다가 갑자기 가난해져도 품위를 잃지 않는 모습이 대단했다. 다락방에서 힘들게 지내면서도 상상력으로 어려움을 이겨내는 게 인상적이었다. 어려운 친구 베키를 챙기는 장면에서 마음이 따뜻해졌다. 사람을 대하는 태도는 재산이 아니라 마음에서 나온다는 걸 느꼈다. 나도 힘든 친구가 있으면 먼저 다가가고 싶다. 마지막에 다시 행운이 찾아와서 다행이었다.
      - book_title: 이상한 나라의 앨리스
        quality: b
        reviewed: true
        days_ago: 18
        body: |
