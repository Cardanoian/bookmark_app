topics:
  - 이 책을 친구에게 추천한다면?
  - 가장 인상 깊은 문장은 무엇인가요?
  - 주인공에게 하고 싶은 말은?
students:
  - name: 김도윤
    reports:
      - book_title: 어린 왕자
        quality: b
        reviewed: true
        days_ago: 5
        teacher_comment: 생각을 자기 경험과 잘 연결했어요.
        body: |
          바오바브나무 장면을 읽으면서 작은 습관 하나가 나중에 큰 문제가 될 수 있다는 걸 깨달았다. 나도 방 정리를 미루다가 결국 하루 종일 치운 적이 있어서 뜨끔했다. 어린 왕자가 장미를 걱정하는 모습을 보면서 진짜 소중한 것은 매일 돌봐야 한다는 생각이 들었다. 여우가 알려준 길들이기라는 말이 마음에 오래 남았다. 친구 사이도 서로 시간을 들여야 특별해지는 거라는 걸 새삼 느꼈다. 어른들이 숫자만 중요하게 여긴다는 부분에서는 우리 반 친구들과도 비슷한 이야기를 나눈 적이 있다. 겉모습보다 마음으로 보는 게 진짜라는 문장은 오래 기억할 것 같다.
      - book_title: 기억 전달자
        quality: a
        reviewed: true
        days_ago: 12
        teacher_comment: 주제를 깊이 있게 이해했습니다.
        body: |
          색깔이 없는 마을이라는 설정이 처음엔 이상했지만 읽을수록 무섭게 느껴졌다. 고통이 없는 대신 기쁨도 잃어버린 사람들을 보면서 감정이 있다는 게 얼마나 소중한지 알게 되었다. 조너스가 기억을 물려받으며 힘들어하는 장면에서는 나도 가슴이 답답해졌다. 세상에는 아프고 슬픈 일도 있어야 진짜 행복도 느낄 수 있다는 생각이 들었다. 완벽해 보이는 사회가 사실은 자유를 빼앗긴 곳이라는 게 소름 돋았다. 우리 가족이 다투기도 하지만 그만큼 웃을 때도 많다는 걸 다시 생각하게 되었다. 이 책은 읽고 나서도 계속 생각나는 이야기였다.
      - book_title: 마당을 나온 암탉
        quality: b
        reviewed: true
        days_ago: 19
        body: |
          잎싹이 양계장을 나가기로 결심하는 장면에서 답답한 곳에 머무르기보다 위험해도 넓은 세상으로 나가고 싶었던 마음이 이해됐다. 자기 알이 아닌 알을 품어서 초록머리를 키우는 모습이 정말 감동적이었다. 진짜 가족은 핏줄보다 함께 보낸 시간과 마음이라는 생각이 들었다. 초록머리가 훨훨 날아가는 모습을 보면서 나도 언젠가 부모님 품을 떠나 내 길을 가야 한다는 걸 어렴풋이 느꼈다. 족제비를 미워하지 않는 잎싹의 마음이 어른스럽게 느껴졌다. 짧지만 여운이 많이 남는 이야기였다.
      - book_title: 푸른 사자 와니니
        quality: b
        reviewed: true
        days_ago: 27
        body: |
          무리에서 쫓겨난 와니니가 혼자서도 씩씩하게 살아가는 모습이 인상 깊었다. 처음엔 약하다고 무시당했지만 결국 무리를 구하는 리더가 되는 걸 보면서 겉모습만으로 판단하면 안 된다는 걸 배웠다. 마디바 할머니의 지혜로운 말들이 오래 기억에 남았다. 친구들과 힘을 합쳐 위기를 넘기는 장면에서는 우리 반 단합대회가 떠올랐다. 혼자 있는 시간에 오히려 많은 것을 배울 수 있다는 게 새로웠다. 나도 힘들 때 와니니처럼 포기하지 않아야겠다고 다짐했다.
      - book_title: 열세 살 우리는
        quality: b
        reviewed: true
        days_ago: 34
        teacher_comment: 고쳐 쓰면서 생각이 훨씬 깊어졌어요.
        improvement: 0.4
        body: |
          사춘기를 겪는 주인공들의 고민이 내 이야기 같아서 공감이 많이 되었다. 친구 관계 때문에 속상해하는 장면을 읽으면서 나도 비슷한 일을 겪었던 때가 떠올랐다. 처음 썼을 때보다 다시 읽으며 왜 그 친구가 서운했을지 더 자세히 생각해서 이번에 고쳐 썼다. 몸도 마음도 변하는 시기라 어른들이 이해해 주면 좋겠다는 생각을 했다. 등장인물들이 서로 오해를 풀어가는 과정이 따뜻했다. 나도 앞으로 친구와 다투면 먼저 대화를 해보려고 한다. 열세 살이라는 나이가 힘들지만 특별한 시기라는 걸 알게 되었다.
      - book_title: 아홉살 인생
        quality: c
        reviewed: false
        days_ago: 48
        body: |
          여민이라는 아이의 눈으로 본 어른들의 세상이 신기했다. 가난한 동네에서도 나름의 즐거움을 찾는 모습이 좋았다. 여러 인물이 나와서 조금 헷갈리는 부분도 있었지만 끝까지 읽었다. 힘든 상황에서도 웃음을 잃지 않는 여민이가 대단하다고 생각했다. 나도 어려운 일이 생기면 여민이처럼 긍정적으로 생각해보고 싶다. 이 책을 읽고 나도 주변 사람들을 더 따뜻하게 바라보고 싶어졌다.
      - book_title: 나무를 심은 사람
        quality: b
        reviewed: true
        days_ago: 61
        body: |
          한 사람이 오랜 시간 나무를 심어서 황무지를 숲으로 만드는 이야기가 놀라웠다. 아무도 알아주지 않아도 묵묵히 좋은 일을 하는 부피에 아저씨가 존경스러웠다. 작은 실천도 오래 계속하면 세상을 바꿀 수 있다는 걸 배웠다. 우리 학교 텃밭 가꾸기 활동도 이런 마음으로 해야겠다고 생각했다. 환경을 지키는 일이 결국 사람을 위한 일이라는 것도 새롭게 느꼈다. 이 책을 읽고 나도 작은 것부터 꾸준히 해보고 싶어졌다.
    game_plays: 12
    quiz_attempts: 8
    monster_lines: 13
    evolved: 4
    forum_posts:
      - 저는 잎싹이 초록머리를 지켜주는 장면이 가장 기억에 남아요.
      - 기억 전달자를 읽고 감정이 있는 게 얼마나 소중한지 알았어요.
      - 열세 살 우리는을 읽으니 제 이야기 같아서 놀랐어요.
    book_intro: 잎싹이라는 암탉이 양계장을 나와 진짜 자기 삶을 찾아가는 이야기예요.
    book_sequel: 초록머리는 훨훨 날아가서 자기와 닮은 무리를 만나 자유롭게 살아갈 것 같아요.

  - name: 이서연
    reports:
      - book_title: 빨간 머리 앤
        quality: a
        reviewed: true
        days_ago: 8
        teacher_comment: 앤의 성장을 자신의 이야기로 잘 풀어냈어요.
        body: |
          앤이 실수를 많이 하면서도 씩씩하게 지내는 모습이 정말 매력적이었다. 상상하는 것을 좋아하는 앤을 보면서 나도 평범한 하루를 조금 특별하게 상상해보고 싶어졌다. 초록지붕 집 사람들이 앤을 점점 진짜 가족으로 받아들이는 과정이 따뜻했다. 앤이 자기 빨간 머리를 부끄러워하다가 점점 자신을 사랑하게 되는 모습이 좋았다. 나도 내 단점이라고 생각했던 부분을 다르게 봐야겠다고 느꼈다. 다이애나와의 우정도 정말 예쁘게 느껴졌다. 이 책을 읽고 나서 나도 상상력을 더 키워보고 싶다는 생각이 들었다.
      - book_title: 키다리 아저씨
        quality: b
        reviewed: true
        days_ago: 16
        body: |
          주디가 편지를 쓰며 조금씩 성장해가는 모습이 인상 깊었다. 얼굴도 모르는 후원자에게 솔직하게 자기 마음을 털어놓는 게 용기 있어 보였다. 힘든 상황에서도 유머를 잃지 않는 주디의 성격이 밝고 좋았다. 편지글이라는 형식이 신기해서 나도 누군가에게 편지를 써보고 싶어졌다. 도움을 받는 것에 감사하면서도 당당하게 자기 삶을 살아가는 모습이 멋졌다. 결국 키다리 아저씨의 정체를 알게 되는 순간 나도 깜짝 놀랐다.
      - book_title: 소공녀
        quality: b
        reviewed: true
        days_ago: 24
        body: |
          세라가 부자였다가 하루아침에 가난해져도 품위를 잃지 않는 모습이 대단했다. 다락방에서 힘든 생활을 하면서도 상상력으로 어려움을 이겨내는 게 인상적이었다. 사람을 대하는 태도는 재산이 아니라 마음에서 나온다는 걸 느꼈다. 세라가 어려운 친구 베키를 챙기는 장면에서 마음이 따뜻해졌다. 나도 힘든 친구가 있으면 먼저 손을 내밀고 싶다는 생각이 들었다. 마지막에 다시 행운이 찾아오는 부분에서는 나도 모르게 웃음이 났다.
      - book_title: 비밀의 화원
        quality: b
        reviewed: true
        days_ago: 33
        body: |
          심술궂던 메리가 정원을 가꾸면서 점점 밝아지는 모습이 좋았다. 아픈 콜린이 밖으로 나가 자연을 만나며 건강해지는 과정이 신기했다. 닫혀 있던 정원의 문을 여는 장면이 마치 마음의 문을 여는 것 같았다. 자연 속에서 뛰어놀면 몸도 마음도 건강해진다는 걸 새삼 느꼈다. 나도 방학 동안 밖에서 더 많이 뛰어놀아야겠다고 다짐했다. 친구들과 함께하면 힘든 일도 이겨낼 수 있다는 생각이 들었다.
      - book_title: 이상한 나라의 앨리스
        quality: c
        reviewed: false
        days_ago: 45
        body: |
          앨리스가 이상한 나라에서 겪는 일들이 상상도 못 할 정도로 신기했다. 몸이 커졌다 작아졌다 하는 장면이 재미있었다. 등장인물들이 워낙 특이해서 이해하기 어려운 부분도 있었다. 그래도 앨리스가 침착하게 상황을 헤쳐나가는 모습은 멋있었다. 꿈속 이야기라는 걸 알았을 때 조금 아쉬웠다. 그래도 나는 앨리스의 엉뚱한 모험이 재미있었다.
      - book_title: 하이디
        quality: b
        reviewed: true
        days_ago: 58
        body: |
          알프스의 자연 속에서 자유롭게 지내는 하이디의 모습이 부러웠다. 도시로 간 하이디가 답답해하다가 다시 산으로 돌아가고 싶어 하는 마음이 이해됐다. 할아버지가 하이디 덕분에 조금씩 마음을 여는 장면이 따뜻했다. 몸이 불편한 클라라가 하이디와 지내면서 건강해지는 모습도 감동적이었다. 자연이 사람을 치유해줄 수 있다는 걸 이 책을 통해 느꼈다. 나도 자연 속에서 뛰어놀 때가 제일 행복하다는 걸 다시 생각했다.
    game_plays: 10
    quiz_attempts: 6
    monster_lines: 9
    evolved: 3
    forum_posts:
      - 소공녀의 세라처럼 힘들어도 품위를 지키고 싶어요.
      - 비밀의 화원을 읽고 저도 식물을 키워보고 싶어졌어요.
    book_intro: 고아가 된 세라가 다락방에서도 희망을 잃지 않고 지내는 이야기예요.
    book_sequel: 세라는 나중에 어려운 친구들을 도우며 따뜻한 어른으로 자랄 것 같아요.

  - name: 박지호
    reports:
      - book_title: 톰 소여의 모험
        quality: b
        reviewed: true
        days_ago: 4
        body: |
          톰이 친구들과 온갖 모험을 벌이는 장면들이 정말 재미있었다. 장난꾸러기지만 위기의 순간에는 용감해지는 모습이 멋있었다. 동굴에서 길을 잃었을 때 침착하게 상황을 살피는 모습이 인상 깊었다. 나도 톰처럼 답답한 교실 밖에서 더 많은 모험을 해보고 싶다는 생각이 들었다. 친구들과의 우정이 이야기 내내 따뜻하게 느껴졌다. 어른들 몰래 하는 일이 재미있어 보였지만 위험한 것도 있다는 걸 느꼈다.
      - book_title: 허클베리 핀의 모험
        quality: b
        reviewed: true
        days_ago: 10
        body: |
          헉이 짐과 함께 뗏목을 타고 강을 내려가는 여정이 자유로워 보였다. 헉이 짐을 노예로 돌려보내야 할지 고민하다가 결국 우정을 선택하는 장면이 감동적이었다. 당시 사회의 잘못된 생각과 맞서는 헉의 용기가 대단했다. 나라면 그런 상황에서 쉽게 결정하지 못했을 것 같다. 강을 따라가며 만나는 다양한 사람들의 이야기도 흥미로웠다. 옳다고 믿는 것을 끝까지 지키는 게 중요하다는 걸 배웠다.
      - book_title: 홍길동전
        quality: a
        reviewed: true
        days_ago: 17
        teacher_comment: 역사적 배경과 인물의 마음을 잘 연결했어요.
        body: |
          서자라는 이유로 차별받는 길동의 처지가 안타까웠다. 부당한 세상에 맞서 활빈당을 이끄는 길동의 모습이 통쾌했다. 신분 때문에 능력을 인정받지 못하는 게 얼마나 억울한 일인지 알게 되었다. 길동이 율도국을 세워 새로운 나라를 만드는 결말이 인상적이었다. 지금은 신분 차별이 없지만 여전히 부당한 일들이 있다는 생각을 했다. 어려운 사람들을 돕는 길동처럼 나도 주변을 살필 줄 아는 사람이 되고 싶다.
      - book_title: 정글북
        quality: b
        reviewed: true
        days_ago: 23
        teacher_comment: 고쳐 쓰면서 인물의 감정을 더 깊이 담았네요.
        improvement: 0.5
        body: |
          모글리가 늑대 무리 속에서 자라며 정글의 법칙을 배우는 이야기가 흥미로웠다. 처음 썼을 때는 줄거리만 적었는데 다시 읽고 모글리의 마음이 어땠을지 더 생각해서 고쳐 썼다. 시어칸이라는 호랑이와 맞서는 장면에서 모글리의 용기가 느껴졌다. 발루와 바기라 같은 친구들이 모글리를 지켜주는 모습이 따뜻했다. 인간과 동물 사이에서 자기 자리를 찾아가는 모글리의 고민이 이해됐다. 나도 낯선 곳에 가면 그곳의 규칙을 배우려고 노력해야겠다고 생각했다.
      - book_title: 오즈의 마법사
        quality: b
        reviewed: true
        days_ago: 30
        body: |
          도로시와 친구들이 각자 원하는 것을 찾아 오즈로 떠나는 여정이 즐거웠다. 허수아비, 양철 나무꾼, 겁쟁이 사자가 사실은 이미 지혜와 마음과 용기를 가지고 있었다는 게 인상 깊었다. 자기가 가진 걸 모르고 밖에서 찾아다닐 때가 많다는 생각이 들었다. 나도 내가 이미 잘하는 게 있는데 몰랐던 건 아닌지 돌아보게 되었다. 친구들과 함께 어려움을 헤쳐나가는 모습이 보기 좋았다. 결국 집이 최고라는 도로시의 말이 마음에 남았다.
      - book_title: 마당을 나온 암탉
        quality: c
        reviewed: true
        days_ago: 38
        body: |
          잎싹이 양계장을 나가고 싶어 하는 마음은 이해가 됐다. 초록머리를 키우는 부분은 감동적이었다. 다만 족제비와의 관계는 조금 이해하기 어려웠다. 자유를 위해 위험을 감수하는 잎싹이 용감하다고 생각했다. 짧은 이야기지만 생각할 거리가 많았다. 다음에는 결말 부분을 더 자세히 읽어봐야겠다.
      - book_title: 기억 전달자
        quality: b
        reviewed: true
        days_ago: 50
        body: |
          고통도 기쁨도 없는 마을이 처음엔 평화로워 보였지만 사실은 무서운 곳이었다. 조너스가 진짜 감정을 알게 되면서 힘들어하는 과정이 인상 깊었다. 편리함을 위해 자유를 포기한 사회의 모습이 섬뜩하게 느껴졌다. 우리는 슬픔도 겪어봐야 진짜 기쁨을 안다는 생각이 들었다. 조너스가 마을을 떠나기로 결심하는 장면에서 응원하는 마음이 들었다. 자유롭게 선택할 수 있다는 게 얼마나 소중한지 다시 느꼈다.
      - book_title: 작은 아씨들
        quality: b
        reviewed: false
        days_ago: 65
        body: |
          네 자매가 서로 다른 성격으로 티격태격하면서도 아끼는 모습이 좋았다. 조가 작가의 꿈을 향해 노력하는 모습이 멋있었다. 가난해도 가족끼리 서로 돕고 나누는 장면이 따뜻했다. 베스가 아플 때 자매들이 함께 걱정하는 모습에서 가족의 의미를 느꼈다. 나도 형제자매와 다투다가도 결국 서로를 챙기게 되는 게 비슷하다고 생각했다. 각자의 꿈을 응원해주는 가족의 모습이 부러웠다.
