  - name: 최하은
    reports:
      - book_title: 아홉살 인생
        quality: b
        reviewed: true
        days_ago: 6
        body: |
          여민이가 어른들의 복잡한 세상을 아이의 눈으로 바라보는 게 신선했다. 가난하고 힘든 상황에서도 유머를 잃지 않는 모습이 좋았다. 주변 어른들의 각기 다른 사연을 보면서 세상에는 다양한 삶이 있다는 걸 느꼈다. 여민이가 친구들과 겪는 일들이 우리 반 이야기 같아서 공감이 되었다. 어려운 형편이라도 밝게 지내는 여민이를 보면서 나도 힘든 일이 있을 때 긍정적으로 생각해야겠다고 다짐했다. 아홉 살이라는 어린 나이에도 많은 걸 겪고 배우는 여민이가 대견했다.
      - book_title: 열세 살 우리는
        quality: a
        reviewed: true
        days_ago: 14
        teacher_comment: 또래의 마음을 깊이 있게 읽어냈어요.
        body: |
          사춘기의 고민들이 마치 내 이야기를 읽는 것 같았다. 친구 관계에서 오는 서운함과 오해가 정말 공감이 갔다. 몸과 마음이 변하는 시기를 겪는 인물들의 감정이 섬세하게 표현되어 있었다. 나도 요즘 별것 아닌 일에도 예민해질 때가 많은데 이 책을 읽고 조금 이해가 되었다. 등장인물들이 결국 서로를 이해하려고 노력하는 모습이 감동적이었다. 열세 살이라는 시기가 힘들지만 그만큼 성장하는 시간이라는 걸 알게 되었다. 앞으로 친구와 갈등이 생기면 이 책을 떠올리며 대화로 풀어보고 싶다.
      - book_title: 푸른 사자 와니니
        quality: b
        reviewed: true
        days_ago: 22
        body: |
          무리에서 쫓겨난 와니니가 포기하지 않고 살아가는 모습이 감동적이었다. 약하다고 생각했던 와니니가 결국 무리를 이끄는 리더가 되는 장면이 통쾌했다. 마디바 할머니의 지혜로운 조언들이 마음에 남았다. 친구들과 함께 어려움을 헤쳐나가는 모습이 든든해 보였다. 나도 힘든 순간이 와도 와니니처럼 포기하지 않아야겠다고 생각했다. 초원의 풍경 묘사도 생생해서 실제로 보는 것 같았다.
      - book_title: 하이디
        quality: b
        reviewed: true
        days_ago: 29
        body: |
          알프스의 맑은 자연 속에서 지내는 하이디의 모습이 부러웠다. 도시에서 답답해하던 하이디가 다시 산으로 돌아가서 행복해하는 모습이 인상 깊었다. 할아버지의 마음이 하이디 덕분에 서서히 열리는 과정이 따뜻했다. 몸이 약한 클라라가 하이디와 함께 지내며 건강해지는 모습도 좋았다. 자연 속에서 뛰어놀 때 가장 행복하다는 게 이해되었다. 나도 방학에는 밖에서 더 많이 시간을 보내야겠다고 생각했다.
      - book_title: 소공녀
        quality: c
        reviewed: true
        days_ago: 41
        body: |
          세라가 갑자기 가난해져도 품위를 지키는 모습이 인상적이었다. 다락방 생활 장면은 조금 슬프게 느껴졌다. 세라가 상상력으로 힘든 현실을 견디는 부분이 신기했다. 다른 인물들의 이야기가 많아서 조금 헷갈리기도 했다. 그래도 마지막에 행운이 찾아와서 다행이라고 생각했다. 나도 힘든 상황에서 세라처럼 희망을 잃지 않고 싶다.
      - book_title: 어린 왕자
        quality: b
        reviewed: false
        days_ago: 55
        body: |
          장미를 사랑하면서도 투정을 이해하지 못했던 어린 왕자의 마음이 이해됐다. 여우와 친구가 되는 과정에서 길들인다는 말의 의미를 알게 되었다. 어른들이 숫자와 겉모습만 중요하게 여기는 부분이 우리 사회와도 비슷하다고 느꼈다. 진짜 중요한 것은 눈에 보이지 않는다는 문장이 마음에 오래 남았다. 나도 겉모습보다 마음을 보는 사람이 되고 싶다고 생각했다. 이 책은 짧지만 여러 번 곱씹어 읽고 싶은 이야기였다.
    game_plays: 9
