    book_intro: 고통도 슬픔도 없는 완벽해 보이는 마을에서 살아가는 조너스의 이야기예요.

  - name: 강수아
    reports:
      - book_title: 빨간 머리 앤
        quality: b
        reviewed: true
        days_ago: 11
        body: |
          앤이 실수투성이지만 밝고 씩씩하게 지내는 모습이 좋았다. 상상하기를 좋아하는 앤을 보면서 나도 평범한 하루를 특별하게 생각해보고 싶어졌다. 초록지붕 집 사람들과 점점 진짜 가족이 되어가는 과정이 따뜻했다. 다이애나와의 우정도 예쁘게 느껴졌다. 자기 단점도 사랑하게 되는 앤의 모습에서 배울 점이 많았다. 나도 나만의 상상력을 더 키워보고 싶다.
      - book_title: 키다리 아저씨
        quality: b
        reviewed: true
        days_ago: 26
        body: |
          주디가 편지를 통해 조금씩 성장해가는 모습이 인상 깊었다. 얼굴도 모르는 후원자에게 솔직한 마음을 전하는 용기가 대단했다. 힘든 형편에서도 유머를 잃지 않는 주디의 성격이 밝게 느껴졌다. 편지글 형식이 신기해서 나도 누군가에게 편지를 써보고 싶어졌다. 도움을 받으면서도 당당하게 살아가는 모습이 멋졌다. 나도 어려운 상황에서 주디처럼 밝은 마음을 잃지 않고 싶다.
      - book_title: 비밀의 화원
        quality: c
        reviewed: true
        days_ago: 44
        body: |
          심술궂던 메리가 정원을 가꾸며 밝아지는 모습이 좋았다. 아픈 콜린이 밖에 나가 건강해지는 과정이 신기했다. 인물이 많이 나와서 처음엔 헷갈렸다. 자연 속에서 지내면 몸과 마음이 건강해진다는 걸 느꼈다. 나도 방학에 밖에서 더 놀아야겠다고 생각했다. 정원을 함께 가꾸는 친구들의 우정도 보기 좋았다.
    game_plays: 5
