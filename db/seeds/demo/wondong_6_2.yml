  - name: 송민재
    reports:
      - book_title: 나무를 심은 사람
        quality: b
        reviewed: true
        days_ago: 33
        body: |
          한 사람이 오랜 세월 나무를 심어 숲을 만드는 이야기가 놀라웠다. 보상을 바라지 않고 묵묵히 좋은 일을 하는 모습이 존경스러웠다. 작은 실천도 꾸준히 하면 큰 변화를 만든다는 걸 배웠다. 전쟁 중에도 나무 심기를 멈추지 않는 모습이 인상적이었다. 나도 작은 것부터 꾸준히 해보고 싶어졌다. 꾸준함이 얼마나 큰 힘을 가지는지 다시 느꼈다.
      - book_title: 기억 전달자
        quality: b
        reviewed: true
        days_ago: 66
        body: |
          고통도 기쁨도 없는 마을이 평화로워 보였지만 사실은 무서운 곳이었다. 조너스가 진짜 감정을 알게 되며 힘들어하는 과정이 인상 깊었다. 슬픔도 겪어봐야 진짜 기쁨을 안다는 생각이 들었다. 자유롭게 선택할 수 있다는 것이 소중하다고 느꼈다. 조너스가 용기 내어 떠나는 장면에서 응원하는 마음이 들었다. 나도 진짜 감정을 느끼며 살아가고 싶다고 생각했다.
    game_plays: 3
    quiz_attempts: 1
    monster_lines: 3
    evolved: 1
    forum_posts:
      - 기억 전달자를 읽고 감정을 느낄 수 있다는 게 소중하다고 생각했어요.

  - name: 전하람
    reports:
      - book_title: 홍길동전
        quality: c
        reviewed: true
        days_ago: 54
        body: |
          길동이 서자라서 차별받는 상황이 안타까웠다. 활빈당을 이끄는 부분은 통쾌했다. 옛날에는 신분 때문에 능력을 인정받지 못하는 사람이 많았다는 걸 알게 되었다. 새로운 나라를 세우는 결말이 인상적이었다. 지금은 이런 차별이 없어서 다행이라고 생각했다. 길동처럼 용기 있게 행동하는 사람이 되고 싶다.
