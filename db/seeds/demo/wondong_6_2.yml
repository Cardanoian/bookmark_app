        teacher_comment: 인물의 성격을 구체적으로 잘 표현했어요.
        body: |
          톰과 친구들의 모험이 정말 신나고 재미있었다. 장난꾸러기지만 위기에는 용감해지는 모습이 멋있었다. 동굴에서 길을 잃었을 때도 침착하게 대처하는 모습이 인상 깊었다. 친구들과의 우정이 이야기 내내 따뜻하게 느껴졌다. 나도 톰처럼 용기를 내서 문제를 해결해보고 싶다는 생각이 들었다. 어른들 몰래 하는 모험이 재미있어 보였지만 위험할 수도 있겠다는 생각도 들었다.
      - book_title: 허클베리 핀의 모험
        quality: b
        reviewed: true
        days_ago: 40
        body: |
          헉이 짐과 뗏목을 타고 강을 내려가는 여정이 자유로워 보였다. 짐을 지키기 위해 고민하다가 우정을 선택하는 장면이 감동적이었다. 당시의 잘못된 생각에 맞서는 헉의 용기가 대단했다. 강을 따라 만나는 다양한 사람들의 이야기도 흥미로웠다. 옳다고 믿는 걸 지키는 게 중요하다는 걸 배웠다. 나도 옳은 일을 위해 용기를 내는 사람이 되고 싶다.
      - book_title: 정글북
        quality: b
        reviewed: true
        days_ago: 57
        body: |
          모글리가 늑대 무리 속에서 자라며 정글의 법칙을 배우는 이야기가 흥미로웠다. 시어칸과 맞서는 장면에서 모글리의 용기가 느껴졌다. 발루와 바기라 같은 친구들이 지켜주는 모습이 따뜻했다. 인간과 동물 사이에서 자리를 찾아가는 고민이 이해됐다. 나도 낯선 곳에서는 규칙을 배우려고 노력해야겠다. 정글의 지혜를 배우는 모글리가 대단하다고 느꼈다.
    game_plays: 6
    quiz_attempts: 4
    monster_lines: 6
    evolved: 2
    forum_posts:
      - 톰 소여의 모험을 읽고 저도 용기를 내보고 싶어졌어요.
      - 정글북의 모글리처럼 새로운 환경에 잘 적응하고 싶어요.
    book_intro: 알프스의 맑은 자연 속에서 씩씩하게 살아가는 하이디의 이야기예요.

  - name: 신동현
    reports:
      - book_title: 오즈의 마법사
        quality: b
        reviewed: true
        days_ago: 19
        body: |
          도로시와 친구들이 오즈로 떠나는 여정이 즐거웠다. 허수아비, 양철 나무꾼, 사자가 이미 원하는 것을 가지고 있었다는 게 신기했다. 자기가 가진 것을 모르고 밖에서 찾아다닐 때가 많다는 생각이 들었다. 친구들과 함께 어려움을 헤쳐나가는 모습이 보기 좋았다. 결국 집이 최고라는 도로시의 말이 마음에 남았다. 나도 이미 가진 것들을 더 소중히 여겨야겠다고 생각했다.
      - book_title: 작은 아씨들
        quality: c
        reviewed: true
        days_ago: 34
        body: |
          네 자매가 다투면서도 아끼는 모습이 좋았다. 조가 작가의 꿈을 위해 노력하는 모습이 멋있었다. 인물이 많이 나와서 처음엔 조금 헷갈렸다. 베스가 아플 때 자매들이 함께 걱정하는 모습에서 가족의 의미를 느꼈다. 나도 형제자매와 다투다가도 결국 챙기게 되는 게 비슷했다. 가족끼리 서로 아끼는 모습이 오래 기억에 남을 것 같다.
      - book_title: 어린 왕자
        quality: b
        reviewed: true
        days_ago: 51
        body: |
          장미를 사랑하면서도 투정을 이해하지 못했던 어린 왕자의 마음이 이해됐다. 여우와 친구가 되며 길들인다는 말의 의미를 알게 되었다. 어른들이 숫자만 중요하게 여기는 부분이 우리 사회와도 닮았다고 느꼈다. 진짜 중요한 것은 눈에 보이지 않는다는 문장이 오래 남았다. 나도 겉모습보다 마음을 보는 사람이 되고 싶다. 이 책은 짧지만 여러 번 곱씹어 읽고 싶은 이야기였다.
    game_plays: 5
    quiz_attempts: 3
    monster_lines: 5
    evolved: 1
    forum_posts:
      - 어린 왕자의 여우가 알려준 길들인다는 말이 마음에 남았어요.
    book_sequel: 어린 왕자는 자기 별로 돌아가 장미를 다시 정성껏 돌보며 지낼 것 같아요.

  - name: 권나윤
    reports:
      - book_title: 아홉살 인생
        quality: b
        reviewed: true
        days_ago: 25
        body: |
          여민이가 어른들의 복잡한 세상을 아이의 눈으로 바라보는 게 신기했다. 가난한 형편에서도 유머를 잃지 않는 모습이 좋았다. 여민이가 겪는 일들이 우리 반과 비슷해서 공감이 되었다. 힘든 상황에서도 밝게 지내는 여민이를 보고 나도 배우고 싶었다. 짧은 이야기였지만 생각할 거리가 많았다. 다음에는 다른 책도 읽어보고 싶다.
    game_plays: 2
