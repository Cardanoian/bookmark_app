  - name: 황시우
    reports:
      - book_title: 열세 살 우리는
        quality: b
        reviewed: true
        days_ago: 30
        body: |
          사춘기의 고민들이 내 이야기 같아서 공감이 되었다. 친구 관계에서 오는 오해와 서운함이 실감 났다. 몸과 마음이 변하는 시기를 겪는 인물들의 감정이 잘 느껴졌다. 등장인물들이 서로 이해하려 노력하는 모습이 좋았다. 나도 친구와 갈등이 생기면 대화로 풀어가고 싶다는 생각이 들었다. 열세 살이 힘들지만 특별한 시기라는 걸 알게 되었다.
      - book_title: 마당을 나온 암탉
        quality: c
        reviewed: false
        days_ago: 62
        body: |
          잎싹이 양계장을 나가고 싶어 하는 마음은 이해가 됐다. 초록머리를 키우는 부분은 감동적이었다. 뒷부분은 조금 이해하기 어려웠다. 자유를 위해 위험을 감수하는 잎싹이 용감하다고 생각했다. 짧지만 여운이 남는 이야기였다. 이 책은 다시 읽을 때마다 새로운 느낌을 줄 것 같다.
    game_plays: 3
    quiz_attempts: 2
    monster_lines: 3
    evolved: 1
    forum_posts:
      - 열세 살 우리는을 읽고 친구 관계에 대해 다시 생각해봤어요.

  - name: 안다은
    reports:
      - book_title: 푸른 사자 와니니
        quality: b
        reviewed: true
        days_ago: 46
        body: |
          무리에서 쫓겨난 와니니가 포기하지 않고 살아가는 모습이 감동적이었다. 약했던 와니니가 결국 무리를 이끄는 리더가 되는 장면이 인상 깊었다. 마디바 할머니의 조언들이 마음에 남았다. 친구들과 힘을 합쳐 어려움을 헤쳐나가는 모습이 든든했다. 나도 힘든 순간에 포기하지 않아야겠다고 생각했다. 초원의 풍경 묘사도 실감 났다.
    game_plays: 1
    quiz_attempts: 0
    monster_lines: 1
