students:
  - name: 김예준
    reports:
      - book_title: 마당을 나온 암탉
        quality: b
        reviewed: true
        days_ago: 45
        teacher_comment: 감상이 깊고 삶과 잘 연결했어요.
        body: |
          잎싹이 알을 품고 지키려는 모습을 보면서 진짜 엄마의 마음이 무엇인지 생각해 보게 되었다. 처음에는 그냥 동화 속 이야기라고만 생각했는데 읽을수록 잎싹의 선택 하나하나가 용기 있어 보였다. 나도 우리 반에서 누군가를 위해 손해를 감수해 본 적이 있는지 돌아보게 되었다. 잎싹이 마당 닭들에게 무시당하면서도 자기 꿈을 포기하지 않는 부분에서 나는 남들의 시선보다 내 마음이 더 중요하다는 걸 배웠다. 초록머리를 떠나보내는 마지막 장면은 슬프면서도 멋있다고 느껴졌다. 사랑한다는 것은 붙잡아 두는 게 아니라 놓아주는 것일 수도 있다는 생각이 들었다. 앞으로 나도 누군가를 아낄 때 내 방식만 고집하지 않으려고 한다.
      - book_title: 기억 전달자
        quality: b
        reviewed: true
        days_ago: 30
        body: |
          조너스가 살던 마을은 겉으로는 평화롭지만 사실은 감정도 색깔도 없는 곳이었다. 나는 처음에 그런 세상이 편할 것 같다고 생각했는데 읽으면서 생각이 완전히 바뀌었다. 아픔이 없으면 기쁨도 제대로 느낄 수 없다는 걸 조너스를 통해 알게 되었다. 우리 학교에서도 가끔 힘든 일이 있지만 그 덕분에 좋은 일이 더 소중하게 느껴진다는 걸 깨달았다. 조너스가 마을을 떠나기로 결심하는 장면에서 진짜 용기란 편안함을 버리는 것일 수도 있다는 생각이 들었다. 나라면 그런 선택을 할 수 있었을지 자신은 없지만 그 마음만은 이해할 수 있었다. 이 책을 읽고 나서 평범한 하루도 감사하게 느껴졌다.
      - book_title: 푸른 사자 와니니
        quality: a
        reviewed: true
        days_ago: 12
        improvement: 0.6
        teacher_comment: 자기 경험과 연결해서 고쳐 쓰니 훨씬 좋아졌어요.
        body: |
          무리에서 쫓겨난 와니니가 혼자서도 살아가는 모습을 보면서 나는 자립이라는 단어를 새롭게 이해하게 되었다. 처음 이 책을 폈을 때는 그냥 동물 이야기인 줄 알았는데 와니니의 두려움과 용기가 내 마음에도 그대로 전해졌다. 특히 와니니가 다른 무리를 만나 자신만의 방식으로 인정받는 장면에서 나는 크게 감동했다. 나도 예전에 전학을 온 친구가 있었는데 그 친구가 낯선 반에서 적응하려고 애쓰던 모습이 떠올랐다. 그때 나는 먼저 다가가지 못했는데 이 책을 읽고 나니 조금 후회가 되었다. 와니니처럼 어려운 상황에서도 포기하지 않는 마음이 결국 자신을 구한다는 걸 배웠다. 다음에는 낯선 친구에게 내가 먼저 손을 내밀어 보고 싶다. 이 책은 단순한 동물 이야기가 아니라 나 자신을 돌아보게 하는 거울 같았다.
      - book_title: 어린 왕자
        quality: b
        reviewed: true
        days_ago: 55
        body: |
          어린 왕자가 자기 별의 장미를 그리워하는 장면을 읽으면서 소중한 것은 자주 봐야만 소중해지는 게 아니라는 걸 느꼈다. 여우가 말한 길들인다는 표현이 처음에는 이해가 안 됐는데 곱씹을수록 관계에 대한 깊은 뜻이 담겨 있다고 생각했다. 어른들이 숫자와 겉모습만 중요하게 여긴다는 부분을 읽으며 나도 혹시 친구를 겉모습으로 판단한 적은 없었는지 반성했다. 어린 왕자가 여러 별을 여행하며 만난 어른들은 저마다 이상해 보였지만 사실 우리 주변에도 비슷한 사람이 있을 것 같았다. 나는 이 책을 읽고 눈에 보이지 않는 마음을 더 잘 보려고 노력해야겠다고 다짐했다. 특히 가족이나 친한 친구처럼 매일 보는 사람일수록 그 소중함을 잊기 쉬운 것 같다. 이 책은 짧지만 여러 번 다시 읽고 싶은 이야기였다.
      - book_title: 홍길동전
        quality: c
        reviewed: true
        days_ago: 65
        body: |
          홍길동은 서자로 태어나서 차별을 많이 받았다. 나는 그 부분을 읽으면서 옛날에는 신분 때문에 힘든 사람이 많았다는 걸 알게 되었다. 길동이 활빈당을 만들어서 나쁜 부자들의 재물을 가난한 사람들에게 나눠주는 장면이 멋있었다. 요즘 세상에는 신분 제도가 없지만 그래도 차별은 남아 있는 것 같다. 나는 길동처럼 용감하게 옳은 일을 할 수 있을지 잘 모르겠다. 그래도 어려운 사람을 도와주는 마음은 배우고 싶다.
      - book_title: 톰 소여의 모험
        quality: b
        reviewed: true
        days_ago: 20
        teacher_comment: 인물의 성격 변화를 잘 짚었어요.
        body: |
          톰이 친구들과 함께 동굴을 탐험하고 장난을 치는 모습을 보면서 나도 모르게 웃음이 났다. 톰은 말썽꾸러기지만 위기의 순간에는 누구보다 용감하게 행동한다는 점이 인상 깊었다. 나도 평소에는 소심한 편인데 정말 중요한 순간에는 용기를 내야겠다고 생각했다. 톰과 친구들이 자신의 장례식을 몰래 지켜보는 장면은 재미있으면서도 가족의 소중함을 다시 느끼게 해주었다. 미시시피강 주변의 자유로운 여름 풍경이 눈앞에 그려지는 듯했다. 나도 방학이 되면 친구들과 마음껏 뛰어놀고 싶다는 생각이 들었다. 이 책을 읽고 나서 모험은 꼭 멀리 가지 않아도 우리 동네에서도 시작될 수 있다는 걸 알았다.
      - book_title: 하이디
        quality: b
        reviewed: false
        days_ago: 8
        body: |
          하이디가 알프스의 맑은 공기 속에서 할아버지와 지내는 장면을 읽으면서 자연이 사람을 얼마나 건강하게 만들어 주는지 느꼈다. 도시로 간 하이디가 향수병에 걸리는 부분에서 나도 여행 가서 집이 그리웠던 기억이 떠올랐다. 하이디의 순수한 마음이 주변 사람들을 하나둘 변화시키는 모습이 신기했다. 특히 클라라가 하이디 덕분에 다시 걷게 되는 장면에서는 마음이 따뜻해졌다. 나는 하이디처럼 꾸밈없이 사람을 대하는 태도를 배우고 싶다. 자연 속에서 뛰어노는 하이디를 보면서 나도 주말에는 스마트폰을 잠깐 내려놓고 밖에 나가고 싶어졌다. 작은 친절이 큰 변화를 만든다는 걸 이 책에서 배웠다.
    game_plays: 12
    quiz_attempts: 8
    monster_lines: 12
    evolved: 4
    forum_posts:
      - 저는 잎싹이 초록머리를 떠나보내는 장면이 가장 기억에 남아요. 슬프지만 멋있었어요.
      - 어린 왕자에게 하고 싶은 말은, 장미를 아끼는 마음이 정말 멋지다는 거예요.
      - 내가 만약 홍길동이라면 활빈당을 만들기 전에 더 많은 친구들을 모았을 것 같아요.
    book_intro: 이 책은 양계장에서 살던 암탉 잎싹이 자유를 찾아 떠나면서 벌어지는 이야기예요. 모성애와 용기에 대해 생각하게 만드는 감동적인 동화예요.
    book_sequel: 그 뒤로 초록머리는 넓은 하늘을 날아 먼 곳까지 여행하며 자신만의 무리를 이끄는 멋진 기러기로 자랐어요. 가끔 잎싹이 살던 저수지 위를 지날 때면 어린 시절의 따뜻한 기억을 떠올렸답니다.

  - name: 이하윤
    reports:
      - book_title: 빨간 머리 앤
        quality: a
        reviewed: true
        days_ago: 10
        teacher_comment: 밝은 성격과 상상력을 잘 표현했어요.
        body: |
          앤이 초록지붕 집에 처음 도착해서 온갖 상상을 펼치는 장면을 읽으면서 나는 앤의 밝은 성격에 완전히 반해버렸다. 앤은 힘든 어린 시절을 보냈지만 그 어떤 순간에도 상상력으로 자신을 지켜낸다는 점이 정말 대단하다고 느꼈다. 나도 가끔 속상한 일이 있을 때 앤처럼 좋은 쪽으로 생각을 바꿔보려고 노력한 적이 있다. 마릴라 아주머니가 처음에는 무뚝뚝했지만 점점 앤을 진심으로 아끼게 되는 과정이 감동적이었다. 사람과 사람 사이의 정은 시간이 지나면서 천천히 쌓이는 것 같다는 생각이 들었다. 앤이 시험에서 좋은 성적을 받으려고 노력하는 모습을 보면서 나도 요즘 공부에 좀 더 최선을 다해야겠다고 다짐했다. 앤과 다이애나의 우정처럼 나도 친구와 평생 갈 우정을 만들고 싶다. 이 책을 읽고 나니 힘든 상황에서도 웃음을 잃지 않는 사람이 되고 싶어졌다.
      - book_title: 키다리 아저씨
        quality: b
        reviewed: true
        days_ago: 33
        body: |
          주디가 얼굴도 모르는 후원자에게 편지를 쓰는 설정이 참신하다고 생각했다. 주디는 고아원에서 자랐지만 밝고 씩씩하게 대학 생활에 적응해 나가는 모습이 멋있었다. 나는 주디처럼 매일 있었던 일을 글로 남기면 나중에 좋은 추억이 될 것 같다는 생각이 들었다. 편지 속에서 주디가 점점 성장하고 자신의 생각을 또렷하게 표현하는 부분이 인상 깊었다. 키다리 아저씨의 정체를 알게 되는 마지막 장면에서는 나도 모르게 소름이 돋았다. 누군가 보이지 않는 곳에서 나를 응원해 주고 있다는 사실이 얼마나 큰 힘이 되는지 느낄 수 있었다. 나도 나중에 어려운 사람을 조용히 도와주는 사람이 되고 싶다.
      - book_title: 이상한 나라의 앨리스
        quality: b
        reviewed: true
        days_ago: 48
        body: |
          앨리스가 토끼굴에 빠지면서 시작되는 이상한 나라 이야기는 상상만 해도 신기했다. 앨리스는 낯선 상황에서도 당황하지 않고 나름대로 문제를 해결해 나가는 점이 대단해 보였다. 나는 이 책을 읽으면서 논리적으로 이해가 안 되는 세계도 재미있게 즐길 수 있다는 걸 알게 되었다. 트럼프 여왕이 소리를 지르는 장면은 무섭기도 하고 우습기도 했다. 앨리스처럼 새로운 환경에 놓였을 때 나도 겁먹지 않고 부딪혀 보는 자세를 배우고 싶다. 결국 모든 게 꿈이었다는 결말이 허무하기도 했지만 상상 속에서라도 자유롭게 모험할 수 있다는 게 좋았다.
      - book_title: 소공녀
        quality: a
        reviewed: true
        days_ago: 22
        body: |
          세라가 갑자기 가난해졌는데도 공주처럼 품위 있게 행동하는 모습이 정말 인상적이었다. 나는 처음에 세라가 부잣집 딸일 때만 착한 줄 알았는데 힘든 상황에서도 변하지 않는 마음을 보고 진짜 품위란 무엇인지 다시 생각하게 되었다. 세라가 다락방에서 배고픔을 참으면서도 상상으로 자신을 위로하는 장면에서는 마음이 아팠다. 그런데도 세라는 다른 사람에게 마지막 빵을 나눠주는데 그 장면을 읽고 나도 모르게 눈물이 났다. 형편이 어려워도 남을 배려하는 마음은 잃지 않을 수 있다는 걸 세라에게서 배웠다. 나는 평소에 물건이 조금만 부족해도 짜증을 냈던 적이 많았는데 반성이 되었다. 세라처럼 어떤 상황에서도 품위를 지키는 사람이 되고 싶다는 목표가 생겼다.
      - book_title: 작은 아씨들
        quality: b
        reviewed: false
        days_ago: 6
        body: |
          네 자매가 각자 다른 성격을 가지고 있으면서도 서로를 아끼는 모습이 보기 좋았다. 특히 조가 작가의 꿈을 이루기 위해 노력하는 모습이 나에게 큰 자극이 되었다. 가난한 형편에도 크리스마스에 어려운 이웃을 도와주는 첫 장면에서 나눔의 의미를 다시 생각하게 되었다. 베스가 아플 때 자매들이 서로를 걱정하는 모습에서 가족의 소중함을 느꼈다. 나도 우리 가족과 힘든 일이 생기면 서로 도와야겠다는 생각이 들었다. 네 자매의 이야기를 읽으면서 나만의 꿈도 좀 더 구체적으로 그려보고 싶어졌다.
      - book_title: 비밀의 화원
        quality: b
        reviewed: true
        days_ago: 60
        body: |
          까칠했던 메리가 비밀의 화원을 가꾸면서 점점 밝아지는 과정이 신기하고 재미있었다. 나는 식물을 가꾸는 게 사람의 마음까지 바꿀 수 있다는 사실이 놀라웠다. 콜린이 방 안에만 있다가 화원에 나와 걷게 되는 장면은 정말 감동적이었다. 자연과 함께하는 시간이 몸과 마음을 모두 건강하게 만들어 준다는 걸 배웠다. 나도 요즘 집에서만 있는 시간이 많은데 밖에 나가서 햇빛을 쬐고 싶어졌다. 메리와 콜린처럼 서로에게 좋은 영향을 주는 친구가 되고 싶다.
      - book_title: 나무를 심은 사람
        quality: a
        reviewed: true
        days_ago: 15
        body: |
          엘제아르 부피에가 아무 보상도 바라지 않고 수십 년 동안 묵묵히 나무를 심는 모습에서 나는 큰 감동을 받았다. 처음에는 황무지였던 땅이 결국 숲이 되고 사람들이 다시 모여 사는 마을이 되는 과정이 놀라웠다. 나는 평소에 무언가를 하다가 결과가 바로 안 보이면 쉽게 포기하는 편인데 이 책을 읽고 반성했다. 부피에는 누가 알아주지 않아도 자신이 옳다고 믿는 일을 꾸준히 해냈다는 점이 존경스러웠다. 작은 씨앗 하나가 이렇게 큰 변화를 만들 수 있다는 사실이 신기했다. 나도 매일 조금씩이라도 꾸준히 할 수 있는 나만의 일을 찾아보고 싶다. 이 책은 인내와 꾸준함의 힘을 다시 한번 깨닫게 해주었다.
      - book_title: 아홉살 인생
        quality: b
        reviewed: true
        days_ago: 40
        body: |
          여민이가 산동네에서 여러 이웃들을 만나며 세상을 배워가는 이야기가 정겹게 느껴졌다. 어린 여민이의 눈으로 본 어른들의 세계는 복잡하지만 그 안에도 따뜻함이 있었다. 나는 여민이처럼 주변 사람들을 더 자세히 관찰해 본 적이 별로 없었는데 반성하게 되었다. 가난하지만 서로 의지하며 살아가는 산동네 사람들의 모습에서 정이란 무엇인지 느낄 수 있었다. 여민이가 여러 일을 겪으며 조금씩 성장하는 모습이 내 모습과도 비슷하다고 생각했다. 나도 아홉 살 때보다 지금 더 많은 걸 이해하게 된 것 같아 뿌듯했다.
    game_plays: 15
    quiz_attempts: 10
    monster_lines: 14
    evolved: 5
    forum_posts:
      - 저는 앤이 마릴라 아주머니께 처음으로 마음을 열던 장면이 가장 기억에 남아요.
      - 주디에게 하고 싶은 말은, 편지를 쓰면서 조금씩 성장하는 모습이 멋졌다는 거예요.
      - 내가 만약 세라라면 힘든 상황에서도 품위를 지킬 수 있을지 잘 모르겠어요.
    book_intro: 이 책은 고아 소녀 앤이 초록지붕 집에 오게 되면서 벌어지는 유쾌하고 따뜻한 성장 이야기예요. 상상력 넘치는 앤의 모습을 보면 저절로 웃음이 나요.
    book_sequel: 그 뒤로 앤은 대학에 진학해서 더 넓은 세상을 만나게 되었어요. 그래도 초록지붕 집과 다이애나를 잊지 않고 방학 때마다 꼭 찾아갔답니다.

  - name: 박지호
    reports:
      - book_title: 허클베리 핀의 모험
        quality: b
        reviewed: false
        days_ago: 18
        body: |
          허크가 짐과 함께 뗏목을 타고 강을 따라가는 여정이 정말 자유로워 보였다. 허크는 사회의 규칙과 자신의 양심 사이에서 고민하는데 그 모습이 어린이답지 않게 깊어 보였다. 짐을 도와주기로 결심하는 장면에서 진짜 우정과 용기가 무엇인지 느낄 수 있었다. 나는 허크처럼 옳다고 생각하는 일이면 남들이 뭐라 해도 지켜야 한다는 걸 배웠다. 강 위에서 자유롭게 지내는 모습을 보니 나도 자연 속에서 여행해 보고 싶어졌다. 이 책을 읽고 진짜 친구란 어려울 때 함께 있어주는 사람이라는 걸 다시 느꼈다.
      - book_title: 정글북
        quality: b
        reviewed: true
        days_ago: 50
        body: |
          모글리가 늑대 무리 속에서 자라면서도 결국 사람으로 돌아가는 이야기가 흥미로웠다. 정글의 법칙을 배우며 자란 모글리는 동물이면서도 사람 같은 지혜를 갖고 있었다. 나는 모글리가 자신이 어디에 속하는지 고민하는 장면에서 나 자신의 정체성에 대해서도 생각해보게 되었다. 시어칸의 위협 속에서도 침착하게 대응하는 모글리의 모습이 멋있었다. 정글 속 동물들의 우정과 규칙을 보면서 자연에도 나름의 질서가 있다는 걸 느꼈다. 나도 어려운 상황에서 모글리처럼 침착하게 생각해서 행동하고 싶다.
      - book_title: 오즈의 마법사
        quality: b
        reviewed: true
        days_ago: 27
        body: |
          도로시가 회오리바람에 휩쓸려 낯선 오즈의 나라로 가게 되는 시작부터 흥미진진했다. 허수아비, 양철 나무꾼, 겁쟁이 사자가 각자 부족하다고 생각한 것을 이미 가지고 있었다는 결말이 인상 깊었다. 나는 이 부분을 읽으면서 사람은 누구나 자기 안에 생각보다 큰 힘을 가지고 있다는 걸 느꼈다. 도로시가 집으로 돌아가고 싶어하는 마음이 여행 내내 느껴져서 가족의 소중함도 다시 생각하게 되었다. 어려운 여정을 함께 겪으며 친구가 되는 과정이 훈훈했다. 나도 스스로를 너무 부족하다고만 생각하지 말고 자신감을 가져야겠다고 다짐했다.
      - book_title: 열세 살 우리는
        quality: a
        reviewed: true
        days_ago: 35
        teacher_comment: 친구 관계에 대한 고민이 잘 드러났어요.
        body: |
          등장인물들이 사춘기를 겪으며 친구 관계에서 갈등하는 모습이 마치 우리 반 이야기 같아서 공감이 많이 되었다. 나도 요즘 친구들과 사소한 오해로 서먹해진 적이 있었는데 그때 느꼈던 복잡한 감정이 책 속 인물들과 비슷했다. 겉으로는 아무렇지 않은 척하지만 속으로는 상처받고 흔들리는 인물들의 마음이 세밀하게 그려져 있어서 놀랐다. 친구들끼리 오해가 쌓이다가 결국 솔직하게 마음을 터놓는 장면에서 나도 눈물이 날 뻔했다. 이 나이대에는 관계가 쉽게 흔들릴 수 있지만 그만큼 진심으로 다가가면 다시 회복될 수 있다는 걸 배웠다. 나도 앞으로 친구와 갈등이 생기면 피하지 말고 솔직하게 이야기해보고 싶다. 열세 살은 어른도 아이도 아닌 애매한 나이지만 그래서 더 소중한 시기라는 생각이 들었다.
      - book_title: 마당을 나온 암탉
        quality: c
        reviewed: true
        days_ago: 62
        body: |
          잎싹은 알을 낳는 닭이었는데 마당을 나가서 살고 싶어했다. 나는 잎싹이 왜 그렇게 자유를 원하는지 처음에는 잘 몰랐다. 잎싹이 오리알을 품어서 키우는 장면이 신기했다. 초록머리가 자라서 무리와 함께 떠나는 장면은 좀 슬펐다. 엄마가 자식을 사랑하는 마음은 동물도 사람과 비슷한 것 같다. 나도 나중에 부모님 마음을 더 이해하고 싶다.
      - book_title: 홍길동전
        quality: b
        reviewed: true
        days_ago: 5
        improvement: 0.4
        body: |
          홍길동은 재주가 뛰어났지만 서자라는 이유로 아버지를 아버지라 부르지 못하는 처지가 안타까웠다. 나는 이 부분을 읽으면서 조선 시대의 신분 제도가 얼마나 사람을 답답하게 만들었는지 알게 되었다. 길동이 집을 떠나 활빈당을 만들고 탐관오리를 혼내주는 장면은 통쾌하게 느껴졌다. 힘없는 백성들을 도와주는 길동의 모습에서 진짜 정의로움이 무엇인지 배울 수 있었다. 율도국을 세워서 모두가 평등하게 사는 나라를 만드는 결말이 인상 깊었다. 나도 주변에서 부당한 일을 보면 못 본 척하지 않고 목소리를 낼 수 있는 사람이 되고 싶다.
    game_plays: 10
    quiz_attempts: 6
    monster_lines: 9
    evolved: 3
    forum_posts:
      - 저는 허크가 짐을 도와주기로 결심하는 장면이 가장 기억에 남아요.
      - 도로시에게 하고 싶은 말은, 집으로 돌아가고 싶은 마음이 이해된다는 거예요.
    book_intro: 이 책은 허클베리 핀이 노예 짐과 함께 뗏목을 타고 강을 따라 내려가는 모험 이야기예요. 자유와 우정에 대해 깊이 생각하게 해주는 책이에요.
    book_sequel: 그 뒤로 허크는 짐이 완전히 자유의 몸이 된 것을 보고 마음이 놓였어요. 두 사람은 가끔 강가에서 만나 그때의 모험을 이야기하며 웃음을 나눴답니다.

  - name: 최유준
    reports:
      - book_title: 어린 왕자
        quality: a
        reviewed: true
        days_ago: 9
        body: |
          어린 왕자가 자기 별을 떠나 여러 별을 여행하며 만나는 어른들은 저마다 이상한 방식으로 살고 있었다. 나는 숫자와 소유에만 집착하는 어른들의 모습을 보면서 혹시 나도 그렇게 될까 봐 조금 걱정이 되었다. 여우가 어린 왕자에게 길들인다는 것이 관계를 맺는다는 뜻이라고 알려주는 장면이 가장 마음에 남았다. 나는 친구를 사귈 때 시간과 정성을 들여야 진짜 소중한 사이가 된다는 걸 이 책에서 배웠다. 장미를 향한 어린 왕자의 마음이 처음에는 이해가 안 됐지만 나중에는 그 사랑이 참 순수하다고 느껴졌다. 눈에 보이지 않는 것이 가장 중요하다는 말이 계속 마음에 맴돌았다. 나는 평소에 겉모습이나 성적처럼 보이는 것에만 신경 썼는데 이 책을 읽고 진짜 중요한 게 뭔지 다시 생각하게 되었다. 앞으로는 마음으로 보는 연습을 하고 싶다.
      - book_title: 하이디
        quality: b
        reviewed: true
        days_ago: 31
        body: |
          하이디가 알프스의 자연 속에서 자유롭게 뛰어노는 모습을 보면서 나도 그 풍경 속에 있는 것 같은 기분이 들었다. 도시에서 지내는 동안 하이디가 점점 시무룩해지는 모습을 보고 사람마다 어울리는 환경이 다르다는 걸 느꼈다. 페터와 염소들과 함께하는 하이디의 일상이 소박하지만 행복해 보였다. 클라라가 하이디를 만나고 나서 조금씩 밝아지는 과정이 인상 깊었다. 순수한 마음이 다른 사람에게도 좋은 영향을 줄 수 있다는 걸 배웠다. 나도 하이디처럼 꾸밈없는 마음으로 사람들을 대하고 싶다.
      - book_title: 기억 전달자
        quality: b
        reviewed: true
        days_ago: 44
        body: |
          조너스가 사는 마을은 고통도 없지만 그만큼 진짜 기쁨도 없는 곳이었다. 나는 처음에는 그런 세상이 안전하고 좋아 보였는데 읽을수록 뭔가 허전하다는 느낌을 받았다. 기억 전달자가 되면서 조너스가 알게 되는 전쟁과 아픔의 기억들이 무겁게 다가왔다. 그래도 조너스는 색깔과 음악, 사랑 같은 아름다운 기억도 함께 알게 되어서 오히려 더 인간다워진 것 같았다. 감정이 없는 평화보다는 힘들어도 진짜 감정이 있는 삶이 더 의미 있다는 생각이 들었다. 나는 평범한 하루하루가 사실은 감사한 일이라는 걸 다시 느꼈다.
      - book_title: 푸른 사자 와니니
        quality: b
        reviewed: true
        days_ago: 24
        body: |
          무리에서 쫓겨난 와니니가 혼자 살아남으려고 애쓰는 모습이 안쓰러우면서도 대단하게 느껴졌다. 사자 무리에도 서열과 규칙이 있다는 게 신기했고 와니니가 그 안에서 인정받으려고 노력하는 모습이 인상 깊었다. 나는 와니니처럼 힘든 상황에서도 포기하지 않는 마음을 배우고 싶다. 새로운 친구들을 만나면서 와니니가 자신만의 자리를 찾아가는 과정이 감동적이었다. 결국 진짜 강함은 남을 이기는 게 아니라 자신을 지켜내는 힘이라는 생각이 들었다. 나도 어려운 일이 생기면 와니니처럼 끝까지 버텨보고 싶다.
      - book_title: 작은 아씨들
        quality: a
        reviewed: true
        days_ago: 16
        improvement: 0.5
        teacher_comment: 가족 이야기와 연결한 부분이 돋보여요.
        body: |
          네 자매가 서로 성격은 다르지만 어려운 형편 속에서도 서로를 이해하고 응원하는 모습이 정말 따뜻하게 느껴졌다. 나는 특히 조가 자신의 꿈을 위해 포기하지 않고 계속 글을 쓰는 모습에서 큰 용기를 얻었다. 베스가 성홍열에 걸렸을 때 온 가족이 걱정하며 하나가 되는 장면에서는 가족이란 이런 거구나 하고 느꼈다. 메그가 형편이 어려워도 자신의 삶에 만족하며 살아가는 모습도 인상 깊었다. 에이미가 실수를 통해 조금씩 철이 들어가는 과정을 보면서 나 자신도 실수하면서 배우고 있다는 걸 깨달았다. 나는 평소에 언니 오빠나 동생과 다툴 때가 많은데 이 책을 읽고 나서 가족끼리 더 아껴줘야겠다고 생각했다. 각자 다른 꿈을 가진 네 자매처럼 나도 나만의 꿈을 소중히 키워가고 싶다.
      - book_title: 비밀의 화원
        quality: b
        reviewed: true
        days_ago: 52
        body: |
          메리가 처음에는 까칠하고 외로운 아이였는데 비밀의 화원을 가꾸면서 점점 밝아지는 모습이 좋았다. 나는 식물을 돌보는 일이 사람의 마음까지 치유할 수 있다는 게 신기했다. 콜린이 화원에서 조금씩 걷기 시작하는 장면은 정말 뭉클했다. 자연 속에서 뛰어놀고 흙을 만지는 경험이 아이들에게 정말 중요하다는 생각이 들었다. 나도 요즘 집에서만 지내는 시간이 많은데 밖으로 나가서 몸을 움직이고 싶어졌다. 메리와 콜린의 우정을 보면서 서로에게 좋은 영향을 주는 친구가 되고 싶다는 생각을 했다.
      - book_title: 소공녀
        quality: c
        reviewed: true
        days_ago: 68
        body: |
          세라는 원래 부잣집 딸이었는데 아빠가 돌아가시고 갑자기 가난해졌다. 나는 세라가 힘든 상황에서도 착하게 행동하는 게 대단하다고 생각했다. 다락방에서 춥고 배고프게 지내는 장면이 안쓰러웠다. 그래도 세라는 상상력으로 힘든 시간을 견뎌냈다. 마지막에 세라가 다시 좋은 환경으로 돌아가서 다행이라고 생각했다. 나도 힘든 일이 있어도 세라처럼 마음을 잘 지키고 싶다.
      - book_title: 아홉살 인생
        quality: b
        reviewed: true
        days_ago: 38
        body: |
          여민이가 산동네에서 다양한 사람들을 만나며 세상을 조금씩 알아가는 이야기가 정겹게 느껴졌다. 어른들의 복잡한 사정을 어린아이의 눈으로 바라보는 부분이 신선했다. 가난하지만 서로 돕고 사는 이웃들의 모습에서 따뜻한 정을 느낄 수 있었다. 나는 여민이처럼 주변 사람들의 사정을 좀 더 관심 있게 지켜봐야겠다는 생각이 들었다. 여민이가 여러 일을 겪으며 성장하는 모습이 지금의 나와도 닮아 있다고 느꼈다. 아홉 살의 여민이가 배운 것들이 어른이 되어서도 큰 힘이 될 것 같다.
      - book_title: 나무를 심은 사람
        quality: b
        reviewed: false
        days_ago: 3
        body: |
          엘제아르 부피에가 아무런 대가도 바라지 않고 수십 년 동안 나무를 심는 모습이 정말 존경스러웠다. 나는 이렇게 오랜 시간 꾸준히 무언가를 한다는 게 얼마나 어려운 일인지 생각해보게 되었다. 황무지였던 땅이 점점 숲으로 변하고 사람들이 다시 모여드는 과정을 보면서 작은 노력도 쌓이면 큰 변화를 만든다는 걸 배웠다. 나는 평소에 뭔가를 시작하면 금방 결과를 보고 싶어 했는데 이 책을 읽고 반성했다. 부피에처럼 묵묵히 자신의 일을 해나가는 사람이 결국 세상을 더 좋게 만든다는 생각이 들었다. 나도 작은 일이라도 꾸준히 실천하는 습관을 길러야겠다.
    game_plays: 14
