      - book_title: 작은 아씨들
        quality: b
        reviewed: true
        days_ago: 37
        body: |
          네 자매가 성격이 다 다르지만 서로를 아끼는 모습이 보기 좋았다. 조가 작가의 꿈을 위해 노력하는 모습이 인상 깊었다. 어려운 형편에도 이웃을 돕는 첫 장면에서 나눔의 의미를 느꼈다. 베스가 아플 때 가족이 걱정하는 모습에서 가족애를 느꼈다. 나는 우리 가족과도 더 사이좋게 지내야겠다고 생각했다. 각자의 꿈을 응원하는 자매들이 부러웠다.
      - book_title: 비밀의 화원
        quality: b
        reviewed: true
        days_ago: 53
        body: |
          까칠했던 메리가 비밀의 화원을 가꾸며 점점 밝아지는 모습이 신기했다. 식물을 돌보는 일이 사람의 마음까지 치유할 수 있다는 게 놀라웠다. 콜린이 화원에서 걷기 시작하는 장면이 뭉클했다. 자연 속에서 시간을 보내는 게 아이들에게 정말 중요하다는 생각이 들었다. 나도 밖에 나가서 몸을 움직이고 싶어졌다. 메리와 콜린의 우정이 서로에게 좋은 영향을 준다고 느꼈다.
