      - 홍길동에게 하고 싶은 말은, 어려운 사람들을 도와줘서 고맙다는 거예요.
    book_intro: 이 책은 홍길동이 신분 차별에 맞서 활빈당을 만들어 가난한 사람들을 돕는 이야기예요. 정의로움에 대해 생각하게 해줘요.

  - name: 강민서
    reports:
      - book_title: 빨간 머리 앤
        quality: b
        reviewed: false
        days_ago: 14
        body: |
          앤이 실수를 자주 하지만 그때마다 밝게 웃어넘기는 모습이 보기 좋았다. 초록지붕 집에서 마릴라와 매튜 남매에게 조금씩 사랑받게 되는 과정이 훈훈했다. 나는 앤처럼 상상력이 풍부하지는 않지만 힘든 일이 있을 때 좋게 생각하는 연습을 해보고 싶다. 다이애나와의 우정이 오래도록 이어지는 모습이 부러웠다. 학교에서 길버트와 티격태격하다가 나중에 서로 이해하게 되는 부분도 재미있었다. 나도 친구와 다투더라도 결국 화해할 수 있다는 걸 다시 느꼈다.
      - book_title: 키다리 아저씨
        quality: a
        reviewed: true
        days_ago: 26
        teacher_comment: 생각을 조리 있게 잘 표현했어요.
        body: |
          주디가 얼굴도 모르는 후원자에게 편지를 쓰면서 자신의 대학 생활을 솔직하게 나누는 모습이 인상 깊었다. 고아원에서 자랐지만 주디는 밝고 씩씩한 성격으로 어려움을 이겨내고 있었다. 편지를 쓸수록 주디의 생각이 점점 깊어지고 문장도 성숙해지는 게 느껴져서 신기했다. 나는 주디처럼 매일 일기를 쓰면 나중에 내가 얼마나 성장했는지 알 수 있을 것 같다는 생각이 들었다. 키다리 아저씨가 사실은 주변에 있던 사람이었다는 반전이 놀라웠다. 보이지 않는 곳에서 누군가를 응원하는 마음이 얼마나 큰 힘이 되는지 느낄 수 있었다. 나도 나중에 어려운 사람을 조용히 도와주는 사람이 되고 싶어졌다.
      - book_title: 이상한 나라의 앨리스
        quality: b
        reviewed: true
        days_ago: 41
        body: |
          앨리스가 토끼를 따라 굴속으로 들어가면서 펼쳐지는 이상한 세계가 정말 신기했다. 몸이 커졌다 작아졌다 하는 장면들이 상상만 해도 재미있었다. 앨리스가 낯선 상황에서도 침착하게 대처하려고 노력하는 모습이 인상 깊었다. 트럼프 여왕처럼 화를 잘 내는 인물을 보면서 나는 저렇게 되지 말아야겠다고 생각했다. 결국 꿈이었다는 결말이 아쉬웠지만 상상 속 모험이 즐거웠다. 나도 가끔은 엉뚱한 상상을 하면서 즐거움을 느껴보고 싶다.
      - book_title: 하이디
        quality: b
        reviewed: true
        days_ago: 55
        body: |
          하이디가 알프스에서 자유롭게 지내는 모습을 보면서 자연이 주는 행복을 느낄 수 있었다. 할아버지와 처음에는 서먹했지만 점점 가까워지는 과정이 따뜻했다. 도시로 갔다가 다시 산으로 돌아온 하이디가 행복해하는 모습에서 자기에게 맞는 환경이 중요하다는 걸 배웠다. 클라라가 하이디를 만나고 건강해지는 장면이 감동적이었다. 나는 하이디처럼 순수한 마음으로 사람을 대하고 싶다는 생각이 들었다. 자연 속에서 뛰어노는 장면을 보니 나도 바깥 활동을 더 하고 싶어졌다.
      - book_title: 어린 왕자
        quality: c
        reviewed: true
        days_ago: 63
        body: |
          어린 왕자는 자기 별을 떠나서 여러 별을 여행했다. 여러 어른들을 만났는데 다 조금씩 이상했다. 여우를 만나서 길들인다는 것을 배웠다. 장미를 소중하게 생각하는 마음이 인상 깊었다. 나는 눈에 보이지 않는 것도 중요하다는 걸 알게 되었다. 소중한 사람을 더 잘 챙겨야겠다고 생각했다.
    game_plays: 8
    quiz_attempts: 5
    monster_lines: 8
    evolved: 2
    forum_posts:
      - 저는 주디가 키다리 아저씨의 정체를 알게 되는 장면이 가장 기억에 남아요.
    book_sequel: 그 뒤로 주디는 대학을 졸업하고 작가가 되어 자신의 이야기를 책으로 펴냈어요. 키다리 아저씨에게 받은 사랑을 다른 어려운 아이들에게 돌려주었답니다.

  - name: 조유진
    reports:
      - book_title: 소공녀
        quality: b
        reviewed: true
        days_ago: 22
        body: |
          세라가 갑자기 가난해졌는데도 품위를 잃지 않는 모습이 인상 깊었다. 다락방에서 힘들게 지내면서도 상상으로 자신을 위로하는 부분이 안쓰러웠다. 나는 세라가 자기보다 더 어려운 사람에게 빵을 나눠주는 장면에서 큰 감동을 받았다. 어려운 상황에서도 남을 배려하는 마음을 잃지 않는 게 정말 대단하다고 느꼈다. 나도 가진 게 조금 부족해도 나누는 마음을 가지고 싶다. 세라처럼 힘든 순간에도 희망을 잃지 않는 사람이 되고 싶다.
      - book_title: 작은 아씨들
        quality: b
        reviewed: true
        days_ago: 47
        body: |
          네 자매가 성격은 다 다르지만 서로 아끼고 도와주는 모습이 보기 좋았다. 조가 작가의 꿈을 위해 열심히 노력하는 모습이 인상 깊었다. 형편이 어려워도 크리스마스에 이웃을 돕는 장면에서 나눔의 의미를 배웠다. 베스가 아플 때 온 가족이 걱정하는 모습에서 가족애를 느꼈다. 나는 우리 가족과도 더 사이좋게 지내야겠다고 생각했다. 각자의 꿈을 응원해주는 자매의 모습이 부러웠다.
      - book_title: 비밀의 화원
        quality: c
        reviewed: true
        days_ago: 65
        body: |
          메리는 처음에 성격이 까칠했다. 비밀의 화원을 찾아서 가꾸기 시작했다. 콜린도 만나서 함께 화원을 돌봤다. 콜린이 점점 걷게 되는 게 신기했다. 자연이 사람을 변화시킬 수 있다는 걸 알았다. 나도 식물을 키워보고 싶어졌다.
    game_plays: 4
    quiz_attempts: 2
    monster_lines: 4
    evolved: 1
    forum_posts:
      - 저는 세라가 마지막 빵을 나눠주는 장면이 가장 기억에 남아요.
    book_intro: 이 책은 갑자기 가난해진 소녀 세라가 힘든 상황에서도 품위를 지키며 살아가는 이야기예요. 희망의 힘을 느낄 수 있어요.

  - name: 윤도현
    reports:
      - book_title: 오즈의 마법사
        quality: b
        reviewed: true
        days_ago: 17
        body: |
          도로시가 회오리바람에 휩쓸려 낯선 나라로 가게 되는 이야기가 흥미진진했다. 허수아비와 양철 나무꾼, 겁쟁이 사자가 각자 부족한 것을 채우려고 여행하는 모습이 재미있었다. 사실 그들은 이미 원하는 것을 가지고 있었다는 결말이 인상 깊었다. 나는 이 부분을 읽으면서 나도 생각보다 용기나 지혜를 더 많이 가지고 있을지도 모른다는 생각이 들었다. 도로시가 집을 그리워하는 마음이 여행 내내 느껴져서 가족의 소중함도 다시 느끼게 되었다. 어려움을 함께 겪으며 친구가 되는 과정이 훈훈했다.
      - book_title: 허클베리 핀의 모험
        quality: b
        reviewed: true
        days_ago: 36
        body: |
          허크와 짐이 뗏목을 타고 강을 따라 내려가는 여정이 자유로워 보였다. 허크는 사회의 규칙과 자기 양심 사이에서 갈등하는데 그 모습이 인상 깊었다. 짐을 끝까지 돕기로 하는 장면에서 진짜 우정이 무엇인지 느낄 수 있었다. 나는 허크처럼 옳다고 믿는 일은 지켜야 한다는 걸 배웠다. 자연 속에서 자유롭게 지내는 모습을 보니 나도 여행을 떠나고 싶어졌다. 이 책은 우정과 용기에 대해 다시 생각하게 해주었다.
      - book_title: 정글북
        quality: b
        reviewed: true
        days_ago: 52
        body: |
          모글리가 늑대 무리 속에서 자라며 정글의 법칙을 배우는 이야기가 흥미로웠다. 동물들 사이에도 규칙과 질서가 있다는 게 신기했다. 시어칸의 위협에도 침착하게 대응하는 모글리가 멋있어 보였다. 나는 모글리가 자신이 속한 곳을 고민하는 장면에서 나의 정체성도 생각해보게 되었다. 결국 인간 세상으로 돌아가는 모글리의 선택이 인상 깊었다. 나도 힘든 상황에서 침착하게 생각하는 힘을 기르고 싶다.
      - book_title: 열세 살 우리는
        quality: a
        reviewed: true
        days_ago: 8
        body: |
          등장인물들이 친구 관계에서 겪는 갈등이 마치 우리 반 이야기처럼 생생하게 느껴졌다. 사소한 오해로 서먹해졌다가 다시 가까워지는 과정을 보면서 나도 비슷한 경험이 떠올랐다. 겉으로는 아무렇지 않은 척해도 속으로는 흔들리는 인물들의 마음이 세밀하게 그려져 있어서 놀랐다. 친구에게 솔직하게 마음을 털어놓는 장면에서 나도 용기를 내야겠다는 생각이 들었다. 열세 살이라는 나이가 어른도 아이도 아니어서 더 혼란스럽지만 그만큼 소중한 시기라는 생각이 들었다. 나는 앞으로 친구와 갈등이 생기면 피하지 않고 대화로 풀어보고 싶다.
