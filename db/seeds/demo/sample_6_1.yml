    book_intro: 이 책은 어린 왕자가 자신의 별을 떠나 여러 별을 여행하며 소중한 것이 무엇인지 깨달아가는 이야기예요. 짧지만 깊은 여운을 남기는 책이에요.
    book_sequel: 그 뒤로 어린 왕자는 자기 별로 돌아가 장미를 다시 정성껏 돌보았어요. 여우와의 약속을 기억하며 눈에 보이지 않는 소중함을 잊지 않고 살아갔답니다.

  - name: 정시우
    reports:
      - book_title: 톰 소여의 모험
        quality: b
        reviewed: true
        days_ago: 20
        body: |
          톰이 친구들과 함께 보물을 찾으러 다니는 모험 이야기가 정말 흥미진진했다. 톰은 장난꾸러기지만 위험한 순간에는 용감하게 나서는 모습이 멋있었다. 나는 톰처럼 모험심이 강하지는 않지만 이 책을 읽고 조금 더 도전해보고 싶은 마음이 생겼다. 친구들과 함께 동굴 속에서 길을 잃었을 때 서로 의지하는 장면이 인상 깊었다. 여름방학에 친구들과 강가에서 뛰어노는 모습을 보니 나도 그런 추억을 만들고 싶어졌다. 이 책을 읽고 나서 평범한 일상도 마음먹기에 따라 모험이 될 수 있다는 걸 느꼈다.
      - book_title: 정글북
        quality: b
        reviewed: true
        days_ago: 45
        body: |
          모글리가 늑대들 사이에서 자라면서도 자신이 누구인지 고민하는 이야기가 흥미로웠다. 정글 속 동물들에게도 나름의 규칙과 우정이 있다는 걸 알게 되었다. 시어칸이라는 위협 속에서도 침착하게 대처하는 모글리의 모습이 대단해 보였다. 나는 모글리처럼 어려운 상황에서 침착함을 유지하는 법을 배우고 싶다. 결국 사람들에게 돌아가기로 하는 모글리의 선택이 쉽지 않았을 것 같다는 생각이 들었다. 자신이 속한 곳을 찾아가는 모글리의 여정이 인상 깊었다.
      - book_title: 홍길동전
        quality: c
        reviewed: true
        days_ago: 60
        body: |
          홍길동은 서자로 태어나서 차별을 많이 받았다. 그래서 집을 떠나서 활빈당을 만들었다. 못된 부자들의 재물을 가져다가 가난한 사람들을 도와줬다. 나는 길동이 용감하다고 생각했다. 나중에 율도국이라는 나라를 만드는 것도 멋있었다. 나도 어려운 사람을 도와주고 싶다는 생각이 들었다.
      - book_title: 마당을 나온 암탉
        quality: b
        reviewed: true
        days_ago: 33
        body: |
          잎싹이 양계장을 나와서 자기만의 삶을 살아가는 모습이 인상 깊었다. 알을 품고 초록머리를 키우는 잎싹의 모성애가 대단하게 느껴졌다. 나는 잎싹이 다른 동물들에게 무시당하면서도 꿋꿋하게 자기 뜻을 지키는 모습을 보고 용기를 배웠다. 초록머리가 자라서 무리와 함께 떠나는 장면에서는 이별의 슬픔도 느껴졌다. 사랑하는 존재를 자유롭게 놓아주는 것도 사랑의 한 방법이라는 생각이 들었다. 나도 가족을 사랑하는 방법에 대해 다시 생각해보게 되었다.
    game_plays: 6
    quiz_attempts: 4
    monster_lines: 6
