        body: |
          도로시가 오즈의 나라에서 여러 친구를 만나는 이야기가 흥미로웠다. 허수아비, 양철 나무꾼, 겁쟁이 사자가 각자 원하는 걸 이미 가지고 있었다는 게 신기했다. 나도 내가 부족하다고 생각한 부분을 다시 생각해보게 되었다. 위험한 상황도 힘을 합쳐 헤쳐나가는 모습이 좋았다. 결국 집으로 돌아가는 결말이 따뜻했다.
