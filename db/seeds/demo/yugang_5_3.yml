  - name: 박지우
    reports:
      - book_title: 아홉살 인생
        quality: a
        reviewed: true
        days_ago: 68
        teacher_comment: 인물의 마음을 깊이 이해했어요.
        body: |
          여민이가 사는 산동네는 가난하지만 그 안에서도 여러 사람들의 이야기가 살아 숨 쉬는 것 같았다. 백촌 할머니와의 인연, 친구들과의 다툼과 화해를 보면서 아홉 살이라는 나이에도 이렇게 많은 일을 겪을 수 있다는 게 놀라웠다. 특히 여민이가 가난 때문에 겪는 부끄러움과 그것을 이겨내려는 모습이 마음에 오래 남았다. 나는 부족함 없이 사는 편이라서 이 책을 읽으며 내가 가진 것들에 감사하게 되었다. 여민이처럼 어려운 상황에서도 웃음을 잃지 않는 태도를 배우고 싶다. 사람은 환경보다 마음가짐이 더 중요하다는 걸 이 책에서 배웠다.
      - book_title: 어린 왕자
        quality: b
        reviewed: true
        days_ago: 60
        body: |
          어린 왕자가 여러 별을 여행하며 만나는 어른들은 저마다 이상한 것에 집착하고 있었다. 그 모습을 보면서 어른이 되면 정말 중요한 것을 잊어버리게 되는 걸까 궁금해졌다. 장미와 여우 이야기를 통해 관계의 소중함을 배울 수 있었다. 나도 친구를 오래 사귀면서 서로 길들여지는 것 같다는 생각이 들었다. 눈에 보이지 않는 것이 더 중요하다는 말을 잊지 않고 싶다.
      - book_title: 홍길동전
        quality: b
        reviewed: true
        days_ago: 52
        body: |
          홍길동이 신분 때문에 차별받는 모습을 보며 마음이 아팠다. 도술을 부리며 탐관오리를 혼내주는 장면은 통쾌했다. 활빈당이 가난한 사람들을 돕는 모습이 멋있었다. 결국 자기만의 나라를 세우는 결말이 인상적이었다. 정의를 위해 행동하는 용기를 배웠다.
      - book_title: 정글북
        quality: c
        reviewed: true
        days_ago: 45
        body: |
          모글리가 정글에서 자라는 이야기가 신기했다. 여러 동물 친구들이 등장해서 재미있었다. 시어 칸과 싸우는 장면이 긴장됐다. 결국 인간 마을로 가는 결말이 아쉬웠다. 나도 정글 모험을 해보고 싶어졌다.
      - book_title: 하이디
        quality: b
        reviewed: true
        days_ago: 38
        body: |
          하이디가 알프스에서 자연과 함께 지내는 모습이 정말 평화로워 보였다. 도시에서 지내는 동안 산을 그리워하는 하이디의 마음이 절실하게 느껴졌다. 클라라가 하이디 덕분에 건강해지는 장면이 감동적이었다. 할아버지와 하이디가 서로 마음을 여는 과정도 따뜻했다. 자연 속에서 사는 삶이 얼마나 소중한지 알게 되었다.
      - book_title: 작은 아씨들
        quality: b
        reviewed: true
        days_ago: 28
        body: |
          네 자매가 각자 다른 꿈을 가지고 성장하는 이야기가 좋았다. 조가 자신의 길을 찾아가는 모습이 특히 멋있었다. 가난해도 가족끼리 서로 아끼는 모습이 따뜻했다. 베스의 이야기에서는 눈물이 날 뻔했다. 나도 가족을 더 소중히 여겨야겠다고 생각했다.
      - book_title: 톰 소여의 모험
        quality: a
        reviewed: true
        days_ago: 18
        improvement: 0.4
        body: |
          톰 소여는 장난꾸러기지만 위기 앞에서는 진짜 용기를 보여주는 인물이다. 처음 글을 썼을 때는 재미있는 장면만 적었는데, 다시 읽어보니 톰이 왜 그런 행동을 했는지 이유를 더 생각해보게 되었다. 동굴에서 인디언 조를 마주쳤을 때 도망치지 않고 침착하게 대응하는 모습이 인상 깊었다. 친구들과의 우정, 특히 허클베리와의 관계도 다시 보니 더 깊게 느껴졌다. 나도 무서운 상황에서 침착함을 유지하는 연습을 해야겠다고 다짐했다.
      - book_title: 열세 살 우리는
        quality: b
        reviewed: false
        days_ago: 4
        body: |
          열세 살 아이들의 고민이 지금 내 고민이랑 비슷해서 몰입해서 읽었다. 친구 사이의 미묘한 감정 변화가 잘 그려져 있었다. 오해가 생겼을 때 서로 솔직하게 말하는 게 중요하다는 걸 느꼈다. 나도 친구랑 다툰 적이 있어서 공감이 갔다. 이 책을 읽고 나도 용기 내서 먼저 화해를 청해야겠다고 생각했다.
    game_plays: 13
    quiz_attempts: 8
    monster_lines: 13
    evolved: 5
    forum_posts:
      - 아홉살 인생을 읽고 제 생활을 돌아보게 됐어요.
      - 톰 소여의 모험은 다시 읽어도 재미있어요.
      - 저는 어린 왕자의 여우 이야기가 제일 좋아요.
    book_intro: 이 책은 가난한 산동네에 사는 아홉 살 소년 여민이가 이웃들과 함께 겪는 다양한 사건들을 통해 성장해가는 이야기예요.
    book_sequel: 여민이는 산동네를 떠나면서도 그곳에서 만난 사람들을 잊지 않아요. 저는 여민이가 어른이 되어서도 따뜻한 마음을 간직했을 것 같아요.

