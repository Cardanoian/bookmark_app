students:
  - name: 한서연
    reports:
      - book_title: 기억 전달자
        quality: a
        reviewed: true
        days_ago: 62
        teacher_comment: 생각의 깊이가 느껴져요.
        body: |
          조너스가 사는 마을은 겉으로는 평화롭지만 감정과 색깔이 없는 곳이었다. 나는 처음에 그 사회가 편리해 보였지만 읽을수록 답답하고 슬프게 느껴졌다. 기억 전달자에게서 진짜 고통과 기쁨을 전해 받는 조너스를 보면서 감정이 있다는 것 자체가 얼마나 소중한 일인지 깨달았다. 특히 아기 게이브리얼을 지키기 위해 마을을 떠나는 장면에서는 가슴이 두근거렸다. 나도 평소에 불편한 감정을 피하고 싶었는데, 이 책을 읽고 나서는 슬픔도 기쁨만큼 나를 성장시키는 감정이라는 생각이 들었다. 앞으로는 내 감정을 있는 그대로 받아들이는 사람이 되고 싶다.
      - book_title: 푸른 사자 와니니
        quality: b
        reviewed: true
        days_ago: 48
        body: |
          와니니는 무리에서 쫓겨나 혼자가 되었지만 포기하지 않고 초원을 살아간다. 처음에는 와니니가 불쌍하다는 생각만 들었는데, 점점 씩씩하게 변해가는 모습을 보며 응원하게 되었다. 특히 다른 동물 친구들과 힘을 합쳐 위기를 넘기는 장면이 기억에 남는다. 나도 학교에서 힘든 일이 생기면 와니니처럼 포기하지 않고 방법을 찾아보고 싶다. 사자도 혼자서는 살아가기 힘들다는 것을 알게 되어 친구의 소중함을 다시 느꼈다.
      - book_title: 어린 왕자
        quality: a
        reviewed: true
        days_ago: 33
        improvement: 0.6
        body: |
          어린 왕자가 장미 한 송이를 그렇게까지 소중히 여기는 이유를 처음에는 이해하지 못했다. 하지만 여우가 말한 것처럼 길들인다는 것이 서로에게 시간을 들이고 책임을 갖는 것이라는 걸 알고 나니 장미와 어린 왕자의 관계가 다르게 보였다. 나에게도 오래 함께 지낸 강아지가 있는데, 그 강아지가 왜 특별한지 이 책을 읽고서야 제대로 설명할 수 있게 되었다. 가장 중요한 것은 눈에 보이지 않는다는 문장을 다시 읽으며 내가 겉모습만 보고 판단했던 순간들을 반성하게 되었다. 고쳐 쓰면서 이 문장이 내 삶에 어떻게 적용되는지 더 자세히 담아보았다. 사물이 아니라 관계가 사람을 특별하게 만든다는 것을 잊지 않고 싶다.
      - book_title: 빨간 머리 앤
        quality: b
        reviewed: true
        days_ago: 21
        body: |
          앤은 상상력이 풍부해서 평범한 것도 특별하게 만드는 재주가 있다. 초록지붕 집에 오게 된 앤이 처음에는 실수도 많이 하지만 점점 마릴라와 매튜의 사랑을 받으며 성장하는 모습이 인상 깊었다. 나도 앤처럼 작은 것에서 즐거움을 찾는 사람이 되고 싶다는 생각이 들었다. 다이애나와의 우정 장면을 읽을 때는 나와 친한 친구가 떠올라서 웃음이 났다. 앤의 밝은 성격을 보면서 나도 힘든 일이 있어도 긍정적으로 생각해봐야겠다고 다짐했다.
      - book_title: 하이디
        quality: b
        reviewed: false
        days_ago: 9
        body: |
          하이디가 알프스의 할아버지 집으로 가면서 처음에는 낯설어하지만 곧 자연 속에서 행복을 찾는 모습이 좋았다. 도시로 간 하이디가 클라라의 집에서 지내면서도 산을 그리워하는 장면을 읽으며 고향이라는 것이 얼마나 큰 의미인지 느꼈다. 클라라가 하이디 덕분에 자연 속에서 건강을 되찾는 부분도 감동적이었다. 나도 자연 속에서 뛰어놀았던 방학이 떠올라서 반가웠다. 사람과 자연이 서로를 치유해 줄 수 있다는 것을 이 책을 통해 배웠다.
      - book_title: 나무를 심은 사람
        quality: c
        reviewed: true
        days_ago: 65
        body: |
          엘제아르 부피에 할아버지는 아무도 시키지 않았는데 혼자서 나무를 계속 심었다. 처음에는 왜 그렇게까지 하는지 이해가 안 갔지만 나중에 숲이 된 것을 보고 놀랐다. 한 사람의 꾸준한 노력이 정말 큰 결과를 만들 수 있다는 것을 알았다. 나도 무언가를 꾸준히 해보고 싶다는 생각이 들었다. 작은 행동도 계속하면 세상을 바꿀 수 있다는 게 신기했다.
    game_plays: 12
    quiz_attempts: 7
    monster_lines: 10
    evolved: 3
    forum_posts:
      - 저는 어린 왕자에서 여우가 한 말이 제일 기억에 남아요.
      - 푸른 사자 와니니를 읽고 혼자여도 용기를 내야겠다고 생각했어요.
      - 결말이 슬펐지만 그래서 더 오래 기억에 남는 책도 있는 것 같아요.
    book_intro: 이 책은 사회에서 감정과 기억을 없애고 평화를 유지하는 마을에 사는 조너스가, 기억 전달자를 만나면서 진짜 세상을 알아가는 이야기예요.
    book_sequel: 그 뒤로 조너스는 아기 게이브리얼과 함께 눈 덮인 언덕을 넘어 새로운 세상을 향해 떠나요. 마을 밖에 무엇이 있을지 저도 궁금해졌어요.

  - name: 김도윤
    reports:
      - book_title: 홍길동전
        quality: a
        reviewed: true
        days_ago: 55
        teacher_comment: 시대 배경까지 생각하며 읽었네요.
        body: |
          홍길동은 서자로 태어나 아버지를 아버지라 부르지 못하는 차별을 겪는다. 나는 처음에 이런 신분 제도가 있었다는 것 자체가 이해가 안 됐는데, 그만큼 홍길동이 느꼈을 억울함이 크게 다가왔다. 활빈당을 만들어 가난한 사람들을 돕는 모습에서는 홍길동이 단순히 화가 나서 도망친 것이 아니라 세상을 바꾸고 싶어 했다는 걸 알 수 있었다. 율도국을 세워 새로운 나라를 만드는 결말을 보며 정의로운 세상은 그냥 주어지는 게 아니라 누군가 노력해서 만드는 것이라는 생각이 들었다. 오늘날에는 신분 차별이 없지만 여전히 불공평한 일들이 있다는 걸 떠올리게 되었다. 나도 주변의 억울한 친구를 보면 그냥 넘기지 않고 도와주고 싶다.
      - book_title: 정글북
        quality: b
        reviewed: true
        days_ago: 47
        body: |
          모글리가 늑대 무리 속에서 자라면서도 결국 인간의 세상과 정글 사이에서 고민하는 이야기가 흥미로웠다. 발루와 바기라가 모글리를 가르치는 장면에서는 진짜 가족 같은 정을 느낄 수 있었다. 호랑이 시어 칸과의 대립은 긴장감이 넘쳐서 손에 땀을 쥐고 읽었다. 정글에도 지켜야 할 법칙이 있다는 설정이 신기했다. 나도 학교와 집에서 지켜야 할 규칙들이 왜 필요한지 다시 생각하게 되었다.
      - book_title: 톰 소여의 모험
        quality: b
        reviewed: true
        days_ago: 40
        body: |
          톰 소여는 장난꾸러기지만 위기 상황에서는 누구보다 용감한 모습을 보여준다. 페인트칠을 친구들에게 시키는 장면에서는 톰의 재치에 웃음이 났다. 동굴에서 길을 잃었을 때 침착하게 빠져나오는 부분이 가장 기억에 남는다. 나라면 그 상황에서 무서워서 아무것도 못 했을 것 같은데 톰은 끝까지 포기하지 않았다. 모험을 즐기면서도 중요한 순간에는 책임감을 보이는 톰이 멋있었다.
      - book_title: 오즈의 마법사
        quality: b
        reviewed: true
        days_ago: 30
        body: |
          도로시는 토네이도에 휩쓸려 낯선 오즈의 나라로 가게 되지만 집으로 돌아가기 위해 씩씩하게 여행을 떠난다. 허수아비, 양철 나무꾼, 겁쟁이 사자가 각자 부족하다고 생각한 것을 이미 가지고 있었다는 결말이 인상적이었다. 나도 스스로 부족하다고 생각했던 부분이 사실은 잘하고 있었던 건 아닐까 돌아보게 되었다. 여러 친구들과 힘을 합쳐 어려움을 헤쳐나가는 이야기가 재미있었다. 결국 답은 멀리 있지 않고 내 안에 있다는 말이 마음에 남았다.
      - book_title: 허클베리 핀의 모험
        quality: a
        reviewed: true
        days_ago: 20
        body: |
          허클베리 핀이 짐과 함께 뗏목을 타고 강을 따라가는 여정은 단순한 모험이 아니라 자유를 찾아가는 이야기처럼 느껴졌다. 짐이 노예라는 이유로 부당한 대우를 받는 것을 보면서 허클베리가 점점 짐을 진짜 친구로 여기게 되는 과정이 감동적이었다. 사회의 규칙과 자신의 마음이 부딪힐 때 허클베리가 결국 마음을 따르기로 결심하는 장면에서 뭉클했다. 나라면 그 상황에서 그렇게 용기를 낼 수 있었을지 생각해보게 되었다. 진짜 우정은 겉으로 보이는 것보다 서로를 얼마나 이해하느냐에 달려 있다는 걸 배웠다.
      - book_title: 마당을 나온 암탉
        quality: b
        reviewed: true
        days_ago: 15
        body: |
          잎싹이 양계장을 나와 자기 알을 품고 싶어 하는 마음이 절실하게 느껴졌다. 초록 머리를 자기 자식처럼 키우면서도 결국 원래 종족에게 보내주는 잎싹의 모습에서 진짜 사랑이 무엇인지 생각하게 되었다. 족제비에게 쫓기는 장면들은 긴장되면서도 안타까웠다. 자유를 위해 위험을 감수하는 잎싹을 보며 나도 소중한 것을 위해서는 용기를 내야 한다고 느꼈다. 이 책은 슬프지만 따뜻한 이야기였다.
      - book_title: 열세 살 우리는
        quality: c
        reviewed: false
        days_ago: 6
        body: |
          열세 살 아이들이 겪는 고민이 나랑 비슷해서 공감이 많이 됐다. 친구 관계 때문에 힘들어하는 장면이 특히 그랬다. 나도 비슷한 일이 있었던 게 생각났다. 등장인물들이 서로 오해를 풀어가는 과정이 좋았다. 나도 친구랑 오해가 생기면 빨리 풀어야겠다.
    game_plays: 14
    quiz_attempts: 9
    monster_lines: 12
    evolved: 4
    forum_posts:
      - 홍길동전을 읽고 지금 우리 사회랑 비교해봤어요.
      - 오즈의 마법사에서 도로시가 신은 은구두가 멋있었어요.
      - 저는 허클베리 핀의 모험이 이번 달 최고였어요.
    book_intro: 이 책은 서자로 태어난 홍길동이 차별에 맞서 활빈당을 이끌고, 마침내 자신만의 이상적인 나라 율도국을 세우는 이야기예요.
    book_sequel: 율도국의 왕이 된 홍길동은 백성들과 함께 평등한 세상을 만들어가요. 저는 홍길동이 그 후에도 계속 억울한 사람들을 도왔을 것 같아요.

  - name: 이서준
    reports:
      - book_title: 소공녀
        quality: a
        reviewed: true
        days_ago: 58
        teacher_comment: 세라의 마음을 잘 표현했어요.
        body: |
          세라는 부자였다가 갑자기 하녀 신세가 되었지만 끝까지 품위를 잃지 않으려 노력한다. 다락방에서 힘든 생활을 하면서도 다른 사람에게 친절을 베푸는 세라를 보며 진짜 부자는 재산이 아니라 마음이라는 생각이 들었다. 상상 속에서 공주라고 스스로를 믿는 장면은 슬프면서도 세라의 강인함이 느껴졌다. 결국 상황이 좋아졌을 때도 세라가 변하지 않고 주변 사람들을 챙기는 모습이 가장 인상 깊었다. 나도 어려운 상황에서 사람이 어떻게 행동하는지가 그 사람의 진짜 모습이라는 걸 배웠다.
      - book_title: 비밀의 화원
        quality: b
        reviewed: true
        days_ago: 44
        body: |
          메리는 처음에 까다롭고 외로운 아이였지만 비밀의 화원을 가꾸면서 점점 밝아진다. 콜린이 방에만 갇혀 있다가 화원에서 걷기 시작하는 장면이 가장 감동적이었다. 자연이 사람을 치유할 수 있다는 것을 이 책에서 느낄 수 있었다. 나도 화단을 가꿔본 적이 있는데 그때 기분이 좋았던 게 떠올랐다. 메리와 콜린이 함께 성장하는 모습을 보며 우정의 힘을 느꼈다.
      - book_title: 작은 아씨들
        quality: b
        reviewed: true
        days_ago: 35
        body: |
          마치 가의 네 자매는 성격이 다 다르지만 서로를 아끼는 마음은 똑같았다. 특히 조가 작가의 꿈을 이루기 위해 노력하는 모습이 멋있었다. 베스가 아플 때 자매들이 서로를 위로하는 장면에서는 마음이 아팠다. 가난한 형편에도 서로 나누고 돕는 모습이 따뜻했다. 나도 형제자매와 더 사이좋게 지내야겠다고 생각했다.
      - book_title: 키다리 아저씨
        quality: b
        reviewed: false
        days_ago: 12
        body: |
