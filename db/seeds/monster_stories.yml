      - stage: 2
        body: >-
          학생이 여러 장르의 책을 읽으며 새로운 느낌을 받아들이자, 물감애벌레는 사라진 줄 알았던 색마다 이야기가 있음을 발견해요. 무지개고치는 고치 속에서 예전 글을 다시 고치며 각 색이 어울릴 자리를 천천히 찾아요. 서두르지 않고 다듬은 색들은 마침내 튼튼한 날개 결이 돼요.
      - stage: 3
        body: >-
          무지개나비는 햇살 아래서 날개를 펴고, 다름을 부끄러워하던 숲 친구들과 색깔 축제를 열어요. 어떤 색도 혼자보다 함께일 때 더 아름답다는 것을 모두가 느껴요. 무지개나비는 바람에 새 빛깔을 섞으며 행복하게 지내요.

  - dex_no: 23
    growth_message: 모르는 것을 웃으며 다시 풀고 힘을 모으면 어떤 문제도 새 놀이가 돼요.
    scenes:
      - stage: 1
        body: >-
          어려운 퀴즈를 피해 장난치던 웃음 한 조각이 방울깨비가 되어 태어났어요. 하지만 모르는 문제가 쌓이자 방울 소리는 점점 작아지고, 방울깨비는 웃음 뒤에 숨어 도망치기만 해요. 숲에는 풀지 못한 문제들이 검은 장난구름처럼 모여들어요.
      - stage: 2
        body: >-
          학생이 퀴즈를 다시 풀고 미션을 하나씩 끝낼 때마다, 방울깨비는 틀린 문제를 금빛 방울로 바꿔요. 뿔깨비는 넘어져도 방망이를 다시 쥐고 친구들의 힘을 빌려 한 문제씩 맞서요. 검은 구름은 무서운 벌이 아니라 함께 풀 수 있는 놀이판으로 바뀌어요.
      - stage: 3
        body: >-
          무쌍깨비는 금빛 방망이로 놀이판을 열고, 모르는 것을 묻는 친구에게 가장 크게 박수쳐요. 예전의 작은 방울 소리는 이제 모두를 용기 내게 하는 웃음소리가 돼요. 무쌍깨비는 친구들과 신나는 문제 축제를 열며 행복하게 지내요.

  - dex_no: 24
    growth_message: 읽고 만나고 깊이 생각한 모든 경험은 새로운 세계를 만드는 상상이 돼요.
    scenes:
      - stage: 1
        body: >-
          수많은 책의 꿈이 무지개 알에 모여 알드래가 태어났어요. 그런데 도감 세계의 하늘에 커다란 금이 가서, 알드래가 품은 꿈의 조각들이 흩어질 위기에 놓여요. 알드래는 알껍질 밖으로 나가고 싶지만 너무 큰 위기 앞에서 자신이 너무 작다고 느껴요.
      - stage: 2
        body: >-
          학생이 좋은 글과 고전에서 배운 마음을 모을 때마다, 알드래는 알을 깨고 뭉치용이 되어 흩어진 꿈의 조각을 품어요. 이야기에서 찾은 용기와 질문, 다정함과 도전이 저마다 하늘의 금 하나를 메워요. 뭉치용은 어느 조각도 놓치지 않고 이어 붙이며 마지막까지 날개를 키워요.
      - stage: 3
        body: >-
          상상용은 무지갯빛 날개를 펴 도감 세계의 하늘을 완전히 이어요. 처음에는 혼자 작고 두려웠던 알드래가, 학생이 읽고 생각한 경험이 모이면 자기 세계를 지킬 수 있다는 것을 보여 줘요. 상상용은 새 이야기가 시작되는 하늘 아래에서 오래오래 행복하게 지내요.

completion_finale:
  heading: 스물네 개의 빛
  paragraphs:
    - >-
      학생이 24개 라인의 완전형을 모두 만난 날, 도감의 마지막 빈 페이지가 열려요. 그 페이지에는 처음엔 작고 불안했던 몬스터들이 위기를 이겨 낸 순간과, 학생이 읽고 쓰고 고쳐 온 시간이 한 장면씩 떠올라요.
    - >-
      스물네 번의 성장은 한 권의 커다란 책갈피가 돼요. 그 책갈피에는 누가 더 빨랐는지가 아니라, 어려운 날에도 다시 책을 펼친 용기와 자기 마음을 돌아본 다정함이 적혀 있어요. 마지막 페이지에는 이렇게 적혀 있어요. “작은 생각들이 모여, 너만의 이야기를 완성했어요.”
    - >-
      도감은 완성된 채로 멈추지 않아요. 학생이 다음 책을 펼칠 때마다, 그동안 자라난 용기와 상상이 새로운 이야기를 시작해요.
