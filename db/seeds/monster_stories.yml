---
# 반려 몬스터 학생 노출용 진화 서사(docs/monsters.md §5.8).
# 앱의 몬스터 상세 화면이 MonsterLore 를 통해 런타임에 읽는 정적 콘텐츠이며,
# DB 시드가 아니므로 마이그레이션·스키마 변경 없이 이 파일만 갱신하면 된다.
#
# 각 라인은 기·승(탄생과 위기) → 전(해결 과정) → 결(행복한 결말)의 3개 장면으로
# 진화 단계와 1:1로 대응한다. growth_message 는 완전 성장 보상으로 유지한다.
stories:
  - dex_no: 1
    growth_message: 한 편씩 남긴 네 생각이 길을 잃은 이야기를 다시 빛나게 해요.
    scenes:
      - stage: 1
        body: >-
          누군가 읽다 덮어 둔 책 속에서 라벤더 책갈피가 꼬리로 변하며 갈피멍이 태어났어요. 그런데 바람이 책갈피를 자꾸 빼앗아 가서, 가장 중요한 장면에서 이야기가 길을 잃어버려요. 갈피멍은 자기가 좋아하는 이야기를 끝까지 지켜 주지 못할까 봐 작게 낑낑거려요.
      - stage: 2
        body: >-
          학생이 책을 읽고 마음에 남은 장면을 한 편씩 글로 남길 때마다, 갈피멍은 흩어진 책갈피를 하나씩 찾아요. 틀리게 쓴 줄거리는 함께 다시 읽고, 고친 문장에는 리본을 살며시 묶어 두어요. 쌓인 이야기들이 바람을 막는 작은 책장이 되자 갈피멍은 이야기멍으로 자라요.
      - stage: 3
        body: >-
          전설멍은 책장 망토로 길 잃은 책들을 감싸고, 누구나 자기 생각을 남길 수 있는 따뜻한 이야기 쉼터를 만들어요. 처음에 사라질까 봐 울던 이야기들은 이제 학생과 친구들의 문장 속에서 오래오래 살아가요. 전설멍은 매일 새 책갈피를 건네며 모두와 행복하게 지내요.

  - dex_no: 2
    growth_message: 잘 듣고 네 말로 들려줄 때, 이야기는 더 멀리 날아갈 수 있어요.
    scenes:
      - stage: 1
        body: >-
          아침 햇살이 빈 교실의 책장을 비추던 날, 책장 무늬 깃털에서 쫑알이가 태어났어요. 하고 싶은 말은 아주 많은데 말들이 한꺼번에 날아가 버려, 친구들이 쫑알이의 진짜 마음을 알아듣지 못해요. 쫑알이는 자기 목소리가 소란스럽기만 한 것 같아 슬퍼져요.
      - stage: 2
        body: >-
          학생이 독후감을 쓰기 전에 느낀 것을 천천히 말해 보고, 다른 친구의 글에도 귀 기울일 때마다 쫑알이의 말들이 제자리를 찾아요. 수다앵무가 된 뒤에는 먼저 끝까지 듣고, 가장 소중한 한마디를 골라 또렷하게 들려줘요. 열두 편의 이야기가 모일수록 어지럽던 깃털은 서로를 품는 날개가 되어 가요.
      - stage: 3
        body: >-
          이야기봉황은 책장처럼 빛나는 날개로 말이 서툰 친구들의 목소리까지 하늘에 띄워요. 모두가 서로의 이야기를 들어 주는 날, 빈 교실은 가장 시끌벅적하고 다정한 이야기 마을이 돼요. 이야기봉황은 열린 창가에서 다음 첫 문장을 기다리며 행복하게 지내요.

  - dex_no: 3
    growth_message: 처음부터 완벽하지 않아도 괜찮아요. 써 보고 다듬으면 생각이 힘을 얻어요.
    scenes:
      - stage: 1
        body: >-
          지우개 가루 사이에서 굴러다니던 짧은 연필심이 반짝이며 뾰족이가 태어났어요. 뾰족이는 생각이 가득해도 첫 글자를 잘못 쓰면 모두 망칠 것 같아 종이 앞에서 꼼짝하지 못해요. 빈 공책이 점점 커다란 벽처럼 보여서, 뾰족이는 자기 목소리까지 지워질까 봐 무서워해요.
      - stage: 2
        body: >-
          학생이 용기를 내 토론 글에 짧은 의견 하나를 적자, 뾰족이의 심에서 작은 빛이 나요. 또각연필은 지운 자국을 실패가 아니라 다시 생각한 발자국이라고 알려 주며 함께 고쳐 써요. 문장을 다듬을수록 빈 공책의 벽은 자신의 생각을 만나는 창문으로 바뀌어요.
      - stage: 3
        body: >-
          글씨봉은 금빛 심으로 망설이는 친구에게 첫 글자 하나를 선물해요. 그 글자에서 시작된 편지와 독후감이 마을을 잇는 리본이 되고, 아무도 혼자 생각을 품지 않게 돼요. 글씨봉은 새 공책이 펼쳐질 때마다 설레는 마음으로 행복하게 지내요.

  - dex_no: 4
    growth_message: 오래된 이야기에도 오늘의 너에게 건네는 새로운 말이 숨어 있어요.
    scenes:
      - stage: 1
        body: >-
          오래된 두루마리에 마지막 이야기를 적던 붓끝에서 도담여우가 태어났어요. 하지만 사람들 사이에서 오래된 이야기가 잊히자 두루마리의 글자가 하나씩 옅어지고, 도담여우는 자기만의 이야기도 사라질까 봐 숲 가장자리에 숨어요. 낯선 책은 어려울 것 같아 가까이 갈 용기도 나지 않아요.
      - stage: 2
        body: >-
          학생이 서로 다른 장르의 책을 펼칠 때마다 도담여우는 옛이야기와 새이야기에서 닮은 마음을 찾아요. 고전을 천천히 읽으며, 오래된 말에도 오늘의 걱정을 달래는 힘이 있다는 것을 배워요. 그렇게 이야기를 건넬 용기를 얻은 도담여우는 이야기여우가 돼요.
      - stage: 3
        body: >-
          만담여우는 빛나는 옛책을 펴고 어린 친구와 오래된 거북이의 이야기를 한자리에 이어 줘요. 잊힐 뻔한 두루마리는 이제 모두가 찾아오는 이야기 나무가 되고, 숲은 세대가 함께 웃는 곳이 돼요. 만담여우는 매일 새로운 손님에게 먼저 인사하며 행복하게 지내요.

  - dex_no: 5
    growth_message: 호기심을 따라 여러 책을 펼치면, 따로 있던 지식이 서로 이어져요.
    scenes:
      - stage: 1
        body: >-
          도서관 계단 아래 떨어진 파란 목도리에서 아롱냥이 태어났어요. 아롱냥은 낯선 책을 만날 때마다 책 사이의 길을 잃고, 어느 날에는 별자리 지도에 있던 집으로 돌아가는 길마저 흐려져요. 모르는 것이 많다는 사실이 부끄러워 혼자서만 서성거려요.
      - stage: 2
        body: >-
          학생이 여러 장르의 책에서 단서를 하나씩 찾고, 스스로 왜 그럴까를 물을 때마다 흐린 길에 파란 선이 생겨요. 안경냥은 모르는 낱말을 피하지 않고 다시 읽고, 답이 달라도 책들을 나란히 펴 보며 길을 연결해요. 네 갈래의 책길이 만나자 잃어버린 지도가 다시 또렷해져요.
      - stage: 3
        body: >-
          지혜냥은 별자리 지도 망토를 두르고, 처음 온 친구도 자기만의 책길을 찾도록 안내해요. 길을 몰라 울던 아롱냥의 집은 이제 질문과 발견이 끊이지 않는 푸른 도서관이 돼요. 지혜냥은 밤마다 별을 세며 행복하게 지내요.

  - dex_no: 6
    growth_message: 틀린 답을 다시 살펴보는 순간에도 새로운 생각은 반짝여요.
    scenes:
      - stage: 1
        body: >-
          답을 찾지 못한 질문들이 밤하늘에 작은 안개가 되던 날, 그 안개 속에서 동글부엉이 태어났어요. 궁금한 것은 많지만 틀린 질문을 할까 봐 입을 다물자, 안개가 점점 짙어져 책을 읽을 빛마저 가려요. 동글부엉은 모르는 마음을 혼자 품고 울먹여요.
      - stage: 2
        body: >-
          학생이 퀴즈의 틀린 답 옆에 왜 그랬을까를 적고 다시 살필 때마다, 동글부엉 머리 위 전구가 켜져요. 반짝부엉은 답을 맞히는 것보다 질문을 놓치지 않는 일을 먼저 배워요. 책에서 찾은 단서들과 질문을 이어 보자 안개에는 작은 별구멍이 생겨요.
      - stage: 3
        body: >-
          아이디어부엉은 전구 왕관으로 밤하늘을 환히 비추고, 질문이 많은 친구들이 모이는 둥지를 만들어요. 그곳에서는 틀린 답도 다음 생각으로 가는 사다리가 돼요. 아이디어부엉은 매일 새로운 왜를 들으며 행복하게 지내요.

  - dex_no: 7
    growth_message: 큰 문제도 한 단계씩 살피고 여러 지식을 연결하면 해결할 수 있어요.
    scenes:
      - stage: 1
        body: >-
          고장 난 시계와 책갈피 톱니가 우연히 맞물리며 도르리가 태어났어요. 첫 미션을 받자 글자들이 너무 큰 기계처럼 보여 톱니가 헛돌고, 도르리는 자기가 쓸모없는 로봇일까 봐 걱정해요. 미션 마을의 멈춘 시계도 도르리 때문에 영영 멈출 것만 같아요.
      - stage: 2
        body: >-
          학생이 미션을 작은 순서로 나누고, 여러 책에서 찾은 지식과 퀴즈 답을 맞춰 볼 때마다 도르리의 톱니가 한 칸씩 돌아가요. 째깍로봇은 틀린 부품을 빼고 다시 끼우는 일을 포기하지 않아요. 다섯 갈래의 지식이 맞물리자 멈춘 시계가 다시 똑딱거리기 시작해요.
      - stage: 3
        body: >-
          발명로봇은 기계 날개를 달고 어려운 문제 앞에 선 친구들에게 한 단계씩 해 보자고 손을 내밀어요. 미션 마을의 시계는 이제 친구들의 새로운 발명 시간을 알려 줘요. 발명로봇은 매일 함께 만든 해결책을 전시하며 행복하게 지내요.

  - dex_no: 8
    growth_message: 천천히 깊게 읽은 지식은 오래도록 너를 지켜 주는 등껍질이 돼요.
    scenes:
      - stage: 1
        body: >-
          오래된 책의 수정 표지가 떨어져 나오던 날, 그 조각이 등에 붙으며 조각등이 태어났어요. 글자가 빼곡한 고전 앞에서 조각등은 너무 느린 자기 걸음이 부끄럽고, 수정 등껍질에는 금이 가기 시작해요. 모두가 먼저 가 버릴까 봐 책을 덮고 싶어져요.
      - stage: 2
        body: >-
          학생이 한 문장을 천천히 다시 읽고 고전 속 마음을 자기 말로 적어 볼 때마다, 조각등의 금에는 은은한 책 문양이 생겨요. 지식거북은 오래된 이야기를 읽고 모르는 부분을 다시 찾아보며, 느린 걸음도 깊은 길을 만든다는 것을 배워요. 여러 시대의 이야기가 등껍질을 단단히 이어 줘요.
      - stage: 3
        body: >-
          만물거북은 커다란 등껍질 위에 누구나 쉬어 읽을 수 있는 고전 정원을 만들어요. 급하지 않아도 끝까지 읽은 친구들은 그곳에서 자기만의 단단한 쉼터를 찾아요. 만물거북은 오래된 별을 바라보며 행복하게 지내요.

  - dex_no: 9
    growth_message: 네 마음을 솔직히 들여다보면 다른 사람의 마음도 더 다정하게 만날 수 있어요.
    scenes:
      - stage: 1
        body: >-
          처음 펼친 책에서 주인공이 울던 순간, 떨어진 눈물 한 방울이 하트가 되어 콩닥이가 태어났어요. 콩닥이는 슬프고 기쁜 마음이 한꺼번에 몰려오면 무엇이라고 말해야 할지 몰라, 양 볼의 하트를 꼭 숨겨요. 숨긴 마음이 많아질수록 하트는 작아지고 콩닥이의 가슴은 외로워져요.
      - stage: 2
        body: >-
          학생이 독후감에 오늘 느낀 마음을 솔직히 한 줄씩 적자, 콩닥이는 슬픔도 기쁨도 이름을 갖게 된다는 것을 알아요. 두근이는 학생이 남긴 글을 읽고, 말하기 어려운 마음에는 다정한 그림과 응원을 붙여 줘요. 적어 둔 마음들이 작은 하트 등불이 되어 외로운 길을 밝혀 줘요.
      - stage: 3
        body: >-
          사랑햄둥이는 큰 하트 귀로 친구들의 작은 한숨까지 들어요. 마음을 나눈 친구들은 더 이상 혼자 울지 않고, 서로의 좋은 날도 함께 축하해요. 사랑햄둥이는 포근한 하트 집에서 모두와 행복하게 지내요.

  - dex_no: 10
    growth_message: 마음의 모든 빛깔을 인정하면 눈물 뒤에도 무지개가 떠올라요.
    scenes:
      - stage: 1
        body: >-
          책 속에서 흘러나온 한 방울의 눈물이 푸른 바다에 떨어져 또르고래가 태어났어요. 그런데 또르고래가 슬픈 이야기를 혼자 삼킬수록 바다는 조용하고 무거운 눈물 바다가 돼요. 자기 울음이 친구들을 더 슬프게 할까 봐 노래도 부르지 못해요.
      - stage: 2
        body: >-
          학생이 글에 감동한 이유를 더 자세히 적고, 부족한 마음을 다시 고쳐 표현할 때마다 또르고래는 눈물에 숨은 말을 찾아요. 촉촉고래는 울음이 약한 것이 아니라 누군가를 아끼는 마음이라는 것을 배워요. 친구들의 응원과 이야기가 눈물 바다에 잔잔한 노랫길을 만들어요.
      - stage: 3
        body: >-
          무지개고래는 하늘까지 닿는 물기둥으로 슬픔 뒤의 무지개를 보여 줘요. 바다 친구들은 마음이 힘든 날에도 함께 노래하고, 기쁜 날에는 그 무지개 아래에서 춤춰요. 무지개고래는 따뜻한 파도 속에서 행복하게 지내요.

  - dex_no: 11
    growth_message: 따뜻한 한마디와 조용한 기다림은 친구의 하루를 바꿀 수 있어요.
    scenes:
      - stage: 1
        body: >-
          친구들의 기분을 닮아 모양이 바뀌는 구름 귀에서 몽실토끼가 태어났어요. 몽실토끼는 모두를 기쁘게 해 주고 싶어 자기 마음은 말하지 못한 채 귀를 계속 바꿔요. 어느 날 귀가 너무 얽혀서, 누구의 마음이 자기 마음인지 알 수 없게 돼요.
      - stage: 2
        body: >-
