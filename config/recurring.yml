production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # 미션 완료·보상 주기 재평가(menu_refactor 심화 §2.A.6 안전망2). 트리거 미스·지연배정 갭 백스톱.
  # Rewarder 멱등이라 재실행 안전. production 전용이라 dev/test 는 즉시 평가 + 수동 rake 로 커버.
  reevaluate_active_missions:
    class: Missions::ReevaluateJob
    schedule: every hour at minute 27
