# Name of your application. Used to uniquely configure containers.
service: bookmark_app

# Name of the container image.
image: superiorz1/bookmark_app

# Deploy to these servers.
servers:
  web:
    - 133.186.251.153

# Enable SSL auto certification via Let's Encrypt (requires config.assume_ssl + config.force_ssl in production.rb).
proxy:
  ssl: true
  hosts:
    - chaekgalpi.net
    - www.chaekgalpi.net
  # Pass the client IP through kamal-proxy so Rails can apply per-IP throttles.
  # Both hosts arrive through Cloudflare's HTTP proxy.
  forward_headers: true

# Where you keep your container images.
registry:
  username: superiorz1
  password:
    - KAMAL_REGISTRY_PASSWORD
# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    # 앱의 유일한 배포 시크릿. 컨테이너는 이 키로 credentials.yml.enc 를 복호화해
    # 외부 API 키(gemini·naver·data4library·neis)를 런타임에 읽는다(docs/API_KEYS.md §3).
    - RAILS_MASTER_KEY
  clear:
    RAILS_ENV: production
    # Keep URLs generated by mailers aligned with the canonical proxy host.
    APP_HOST: chaekgalpi.net
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    SOLID_QUEUE_IN_PUMA: true

# Aliases are triggered with "bin/kamal <alias>".
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
volumes:
  - "bookmark_app_storage:/rails/storage"

# Bridge fingerprinted assets between versions to avoid 404 on in-flight requests.
asset_path: /rails/public/assets

builder:
  arch: amd64
ssh:
  user: ubuntu
  keys:
    - ~/.ssh/gbe-debate.pem
  keys_only: true

